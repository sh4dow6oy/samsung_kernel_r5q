name: S10 Lite Kernel Build - v109

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: mainey/android_kernel_samsung_r5q
          ref: lineage-18.1
          path: kernel-res

      - name: Setup Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves make python3 lz4 perl git curl
          git clone --depth=1 https://gitlab.com/clangsantoni/zyc_clang.git toolchain/zyc-clang

      - name: Upstream & BPF
        run: |
          cd kernel-res
          git config user.email "ai@gemini.com"
          git config user.name "Gemini"
          git remote add stable https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux-stable.git
          git fetch stable linux-4.14.y
          git merge v4.14.356 --no-edit || echo "Conflicts ignored"

      - name: Surgical Fixes v109
        run: |
          cd kernel-res
          
          # 1. FIX CAMERA (Eroarea cu variabila 'i' neinițializată)
          # Căutăm linia cu for-ul problematic și ne asigurăm că i este definit
          sed -i 's/uint32_t                     i;/uint32_t                     i = 0;/g' drivers/media/platform/msm/camera/cam_isp/isp_hw_mgr/isp_hw/vfe_hw/vfe_bus/cam_vfe_bus_ver3.c

          # 2. FIX SEC_DEBUG (Erorile din asm/sec_debug.h)
          # Samsung face override la niște funcții de sistem. Le "omorâm" ca să treacă de linking.
          sed -i 's/extern void sec_debug_check_sum_interrupted/static inline void sec_debug_check_sum_interrupted/g' arch/arm64/include/asm/sec_debug.h
          echo "#define sec_debug_log_copy_line(x,...) do {} while (0)" >> include/linux/sec_debug.h

          # 3. FIX DRIVERS/SOC/SAMSUNG
          # Uneori driverele lor de baterie/thermal au etichete de tip 'out:' goale
          find drivers/soc/samsung -name "*.c" -exec sed -i 's/out:$/out: ;/g' {} +

          # 4. Configurare BPF pentru Android 15
          sed -i 's/CONFIG_BPF_SYSCALL=n/CONFIG_BPF_SYSCALL=y/' arch/arm64/configs/r5q_eur_open_defconfig
          {
            echo "CONFIG_BPF_JIT=y"
            echo "CONFIG_CGROUP_BPF=y"
            echo "CONFIG_NETFILTER_XT_MATCH_BPF=y"
          } >> arch/arm64/configs/r5q_eur_open_defconfig

      - name: Build Kernel
        run: |
          cd kernel-res
          export PATH=$(pwd)/../toolchain/zyc-clang/bin:$PATH
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          MAKE_ARGS="ARCH=arm64 CC=clang HOSTCC=gcc LLVM=1 LLVM_IAS=1"
          # -Wno-error e vital aici pentru că sursa de cameră Samsung e plină de bug-uri de logică
          export KCFLAGS="-Wno-everything -Wno-error -Wno-implicit-function-declaration -Idrivers/hid"

          make $MAKE_ARGS r5q_eur_open_defconfig
          make -j$(nproc --all) $MAKE_ARGS Image.gz-dtb || make -j$(nproc --all) $MAKE_ARGS Image.gz

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-S10Lite-v109
          path: |
            kernel-res/arch/arm64/boot/Image.gz-dtb
            kernel-res/arch/arm64/boot/Image.gz
