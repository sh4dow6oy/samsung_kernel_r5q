name: Build Samsung S10 Lite (r5q) - Neutron Clang

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        repository: sh4dow6oy/android_kernel_samsung_a82xq
        ref: linux-4.14.285
        fetch-depth: 1

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential bison flex libssl-dev libelf-dev xz-utils wget git gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi zstd python3

    - name: Download and Setup Neutron Clang
      run: |
        mkdir -p neutron
        wget https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
        tar -I zstd -xf neutron-clang-10032024.tar.zst -C neutron
        echo "NEUTRON_PATH=$(pwd)/neutron/bin" >> $GITHUB_ENV

    - name: Deep Clean Makefile & Fix Samsung Pathing
      run: |
        # 1. Eliminăm orice referință la python și gcc-wrapper.py din Makefile-uri
        find . -type f -name "Makefile*" -exec sed -i 's/python $(srctree)\/scripts\/gcc-wrapper.py//g' {} +
        find . -type f -name "Makefile*" -exec sed -i 's/$(srctree)\/scripts\/gcc-wrapper.py//g' {} +
        
        # 2. Stergem efectiv scriptul wrapper ca să fim siguri
        rm -f scripts/gcc-wrapper.py
        touch scripts/gcc-wrapper.py # Cream un fisier gol
        chmod +x scripts/gcc-wrapper.py

        # 3. Rezolvăm eroarea "secgetspf" și "perflog.h" (erori tipice Samsung)
        # Creăm folderele lipsă pe care Makefile-ul le caută cu căi relative nebunești
        mkdir -p ../../system/core/liblog/include/log/
        touch ../../system/core/liblog/include/log/perflog.h

    - name: Build Kernel
      run: |
        export PATH=${{ env.NEUTRON_PATH }}:$PATH
        
        # Variabile esențiale
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        
        # Forțăm CC să fie binarul pur, fără wrappere
        export CC=clang
        export HOSTCC=gcc
        
        # Curățare și Configurare
        make clean
        make mrproper
        make r5q_eur_open_defconfig
        
        # Compilare cu un set de flag-uri care suprascrie orice mizerie din Makefile
        make -j$(nproc --all) \
                      ARCH=arm64 \
                      CC=clang \
                      LD=ld.lld \
                      AR=llvm-ar \
                      NM=llvm-nm \
                      OBJCOPY=llvm-objcopy \
                      OBJDUMP=llvm-objdump \
                      STRIP=llvm-strip \
                      CLANG_TRIPLE=aarch64-linux-gnu- \
                      CROSS_COMPILE=aarch64-linux-gnu- \
                      CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
                      LLVM=1 \
                      LLVM_IAS=1 \
                      KCFLAGS="-w" \
                      DTC_EXT=dtc

    - name: Check Results
      run: |
        if [ -f arch/arm64/boot/Image.gz-dtb ] || [ -f arch/arm64/boot/Image.gz ]; then
            echo "Kernel built successfully!"
        else
            echo "Kernel build failed. Check logs above."
            exit 1
        fi

    - name: Upload Kernel
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-S10Lite-Neutron-Final
        path: |
          arch/arm64/boot/Image.gz*
          arch/arm64/boot/dtbo.img
