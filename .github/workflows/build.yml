name: S10 Lite Kernel Build - Upstream CIP & A15 Fixes

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Esențial pentru a permite merge-ul upstream

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev dwarves \
            libncurses-dev git wget unzip make python2 \
            python3 python3-minimal lz4 xz-utils gcc g++ pahole

      - name: Download Proton Clang
        run: |
          mkdir -p toolchain
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang

      - name: Upstream Integration (Linux-CIP)
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

          # Adăugăm sursa oficială stabilă CIP (Civil Infrastructure Platform)
          git remote add upstream https://git.kernel.org/pub/scm/linux/kernel/git/cip/linux-cip.git
          
          # Facem fetch la ramura stabilă 4.14
          git fetch upstream linux-4.14.y --depth=100

          # Încercăm un merge. Folosim strategy-option 'theirs' pentru a favoriza patch-urile de securitate
          # Dacă merge-ul eșuează din cauza conflictelor masive, ignorăm eroarea și trecem la checkout selectiv
          git merge upstream/linux-4.14.y -m "Merge Linux-CIP Upstream" || echo "Conflicte detectate, trecem la extragere selectivă..."

          # FORȚĂM subsystemul BPF și headerele critice să fie cele din upstream (CIP)
          # Aceasta rezolvă eroarea btf.h și lipsa tipurilor de date pentru Android 15
          git checkout upstream/linux-4.14.y -- kernel/bpf/
          git checkout upstream/linux-4.14.y -- include/linux/bpf.h
          git checkout upstream/linux-4.14.y -- include/uapi/linux/bpf.h
          git checkout upstream/linux-4.14.y -- include/uapi/linux/btf.h
          git checkout upstream/linux-4.14.y -- include/linux/btf.h || true
          git checkout upstream/linux-4.14.y -- arch/arm64/net/
          
          echo "Upstream eBPF components updated successfully."

      - name: Pre-build Fixes
        run: |
          # 1. Injectăm __poll_t în types.h dacă încă lipsește (fix pentru bpf.h)
          grep -q "__poll_t" include/uapi/linux/types.h || echo "typedef unsigned int __poll_t;" >> include/uapi/linux/types.h
          
          # 2. Fix log-uri Samsung (perflog.h)
          mkdir -p system/core/liblog/include/log
          mkdir -p system/logging/liblog/include/log
          touch system/core/liblog/include/log/perflog.h
          touch system/logging/liblog/include/log/perflog.h
          
          # 3. Rezolvarea referințelor btf.h în core.c (pentru a căuta în linux/ nu în uapi/)
          find kernel/bpf/ -name "*.c" | xargs sed -i 's|<uapi/linux/btf.h>|<linux/btf.h>|g' || true
          
          # 4. Dezactivare wrapper Samsung și link Python2
          [ -f
