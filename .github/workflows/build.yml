name: S10 Lite - Kernel sh4dow6oy v22

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves make python3 lz4 perl
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang

      - name: Core Pascua Backport (eBPF 5.1)
        run: |
          git remote add linux-stable https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git || true
          git fetch linux-stable linux-5.1.y --depth=1
          PATHS=(
            "kernel/bpf/" "include/linux/bpf.h" "include/linux/filter.h" 
            "include/linux/bpf_verifier.h" "include/linux/tnum.h" "include/linux/btf.h"
            "include/uapi/linux/bpf.h" "include/uapi/linux/btf.h"
            "include/uapi/linux/bpf_common.h" "include/linux/bpf-cgroup.h"
          )
          for path in "${PATHS[@]}"; do git checkout FETCH_HEAD -- "$path"; done

      - name: Nuclear Cleaning (v22)
        run: |
          # 1. Ștergem fizic referințele la LIRC din codul importat
          sed -i '/bpf_lirc\.h/d' kernel/bpf/syscall.c
          sed -i '/bpf_lirc\.h/d' include/linux/bpf.h
          
          # 2. Creăm headere dummy în toate locațiile posibile
          mkdir -p include/linux/
          printf "#ifndef _BPF_LIRC_H\n#define _BPF_LIRC_H\n#endif" > include/linux/bpf_lirc.h
          mkdir -p out/include/linux/ || true
          
          # 3. Neutralizăm fișierele problematice
          rm -f kernel/bpf/bpf_lirc.c kernel/bpf/devmap.c kernel/bpf/cpumap.c
          touch kernel/bpf/bpf_lirc.c kernel/bpf/devmap.c kernel/bpf/cpumap.c

          # 4. Injectăm Stubs (Funcții goale) ca să nu mai avem erori de linkare
          sed -i '1i #include <linux/err.h>\nstatic inline int lirc_prog_attach(void *a, void *b) { return -1; }\nstatic inline int lirc_prog_detach(void *a) { return -1; }\nstatic inline int lirc_prog_query(void *a, void *b) { return -1; }\nstatic inline int skb_flow_dissector_bpf_prog_attach(void *a, void *b) { return -1; }\nstatic inline int skb_flow_dissector_bpf_prog_detach(void *a) { return -1; }\nstatic inline void *perf_get_event(void *a) { return ERR_PTR(-1); }\nstatic inline int bpf_get_perf_event_info(void *a, void *b, void *c, void *d, void *e) { return -1; }\nstatic inline void bpf_probe_unregister(void *a, void *b) {}\nstatic inline void bpf_put_raw_tracepoint(void *a) {}\nstatic inline void *bpf_get_raw_tracepoint(void *a) { return NULL; }\nstatic inline int bpf_probe_register(void *a, void *b) { return -1; }' kernel/bpf/syscall.c

          # 5. Fix Atomic (5.1 -> 4.14)
          sed -i 's/atomic_fetch_add_unless/atomic_add_unless/g' kernel/bpf/syscall.c

          # 6. Fix Filter & Network (Restaurăm ce a funcționat la v16)
          sed -i '/#include <linux\/skbuff.h>/a static inline int skb_metadata_len(const struct sk_buff *skb) { return 0; }\n#define cant_sleep() do { } while (0)\nstatic inline bool kallsyms_show_value(void) { return false; }' include/linux/filter.h
          sed -i 's/static const struct bpf_func_proto bpf_sk_redirect_map_proto/const struct bpf_func_proto bpf_sk_redirect_map_proto/g' net/core/filter.c
          
          # Trick-ul de mapping pentru rețea
          sed -i '/int xdp_do_generic_redirect(/i #define xdp_do_generic_redirect(dev, skb, prog) __xdp_do_generic_redirect(dev, skb, NULL, prog)' include/linux/filter.h
          sed -i 's/int xdp_do_generic_redirect(/int __xdp_do_generic_redirect(/g' include/linux/filter.h
          sed -i 's/int xdp_do_generic_redirect(/int __xdp_do_generic_redirect(/g' net/core/filter.c

      - name: Build Kernel
        run: |
          export PATH=$(pwd)/toolchain/proton-clang/bin:$PATH
          MAKE_ARGS="O=out ARCH=arm64 CC=clang HOSTCC=gcc CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1"
          
          make $MAKE_ARGS r5q_eur_open_defconfig
          
          # Forțăm header-ul în folderul de build (unde l-a căutat ultima oară)
          mkdir -p out/include/linux/
          echo "#ifndef _BPF_LIRC_H\n#define _BPF_LIRC_H\n#endif" > out/include/linux/bpf_lirc.h

          ./scripts/config --file out/.config --set-str CONFIG_LOCALVERSION "-sh4dow6oy"
          ./scripts/config --file out/.config --enable CONFIG_BPF_SYSCALL
          ./scripts/config --file out/.config --disable CONFIG_KPERFMON
          ./scripts/config --file out/.config --disable CONFIG_DEFEX
          
          make $MAKE_ARGS olddefconfig
          make -j$(nproc --all) $MAKE_ARGS Image.gz-dtb || make -j1 $MAKE_ARGS Image.gz-dtb

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-sh4dow6oy-v22
          path: out/arch/arm64/boot/Image.gz-dtb
