name: Build Samsung SM8150 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        repository: sh4dow6oy/android_kernel_samsung_sm8150
        ref: auriana
        path: kernel

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm libncurses-dev wget git

    - name: Setup AOSP Clang (r383902)
      run: |
        mkdir -p clang
        wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/3857008389202edac32d57008bb8c99d2c957f9d/clang-r383902.tar.gz
        tar -xf clang-r383902.tar.gz -C clang
        echo "CLANG_PATH=$(pwd)/clang/bin" >> $GITHUB_ENV

    - name: Download AOSP GCC 4.9
      run: |
        git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 gcc64
        git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 gcc32
        echo "GCC64_PREFIX=$(pwd)/gcc64/bin/aarch64-linux-android-" >> $GITHUB_ENV
        echo "GCC32_PREFIX=$(pwd)/gcc32/bin/arm-linux-androideabi-" >> $GITHUB_ENV

    - name: Build Kernel
      run: |
        cd kernel
        
        # Extragem calea către binarele GCC pentru AS
        GCC_AS="${{ env.GCC64_PREFIX }}as"
        
        # Setup PATH
        export PATH="${{ env.CLANG_PATH }}:$(dirname ${{ env.GCC64_PREFIX }}):$PATH"
        
        # --- FIXURI SURSĂ ---
        # 1. Bypass Clang Safety Switch
        CLANG_SAFE_FLAG="-enable-trivial-auto-var-init-zero-knowing-it-will-be-removed-from-clang"
        sed -i "s/-ftrivial-auto-var-init=zero/-ftrivial-auto-var-init=zero $CLANG_SAFE_FLAG/g" Makefile
        
        # 2. Fix WLAN Variant
        sed -i 's/$(CONFIG_WLAN_VARIANT)_defconfig/samsung_defconfig/g' drivers/net/wireless/qualcomm/wcn39xx/qcacld-3.0/Kbuild || true
        
        # 3. Bypass GCC Version Check
        find . -name "compiler-gcc.h" -exec sed -i '/#error Sorry, your version of GCC is too old/d' {} +

        # Configurare
        cat arch/arm64/configs/sm8150_sec_defconfig arch/arm64/configs/sm8150_sec_r5q_eur_open.config > arch/arm64/configs/combined_defconfig
        echo "CONFIG_CC_STACKPROTECTOR_NONE=y" >> arch/arm64/configs/combined_defconfig
        echo "# CONFIG_CC_STACKPROTECTOR_STRONG is not set" >> arch/arm64/configs/combined_defconfig

        # Argumente de build
        # Am adăugat AS= pentru a forța asamblorul de ARM64
        MAKE_ARGS="O=out ARCH=arm64 \
             CC=clang HOSTCC=gcc \
             AS=$GCC_AS \
             CROSS_COMPILE=${{ env.GCC64_PREFIX }} \
             CROSS_COMPILE_ARM32=${{ env.GCC32_PREFIX }} \
             CLANG_TRIPLE=aarch64-linux-gnu- \
             LD=ld.lld DTC_EXT=$(pwd)/scripts/dtc/dtc"

        make $MAKE_ARGS combined_defconfig
        make $MAKE_ARGS olddefconfig

        # Compilare finală - adăugăm flag-ul de ignorare a asamblorului integrat
        make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-w -fno-stack-protector -fno-integrated-as"
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-SM8150-r5q
        path: |
          kernel/out/arch/arm64/boot/Image.gz-dtb
          kernel/out/arch/arm64/boot/dtbo.img
          kernel/out/.config
