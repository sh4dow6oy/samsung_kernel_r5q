name: Lumi Kernel R5Q - Roynas Lineage Fusion (No KSU)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: 1. Checkout Roynas Base (R3Q)
        uses: actions/checkout@v4
        with:
          repository: Roynas-Android-Playground/kernel_samsung_r3q
          ref: master
          fetch-depth: 0

      - name: 2. Merge LineageOS 20 (Full Codebase Sync)
        run: |
          git config --global user.email "gh-actions@github.com"
          git config --global user.name "GitHub Actions"
          git remote add lineage https://github.com/LineageOS/android_kernel_qcom_sm8150.git
          git fetch lineage lineage-20
          
          echo "--- Merging LineageOS 20 into Roynas ---"
          # Folosim strategia 'theirs' pentru a prioritiza fix-urile Lineage în codul comun
          git merge lineage/lineage-20 -X theirs -m "Merge LineageOS 20 SM8150" || echo "Merge finished with some conflicts"

      - name: 3. Setup Neutron Clang
        run: |
          sudo apt-get update && sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev wget zstd zip
          mkdir clang && wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang
          mkdir -p bin-force
          ln -sf $(pwd)/clang/bin/clang bin-force/as
          ln -sf $(pwd)/clang/bin/ld.lld bin-force/ld
          echo "$(pwd)/bin-force" >> $GITHUB_PATH

      - name: 4. Config Optimization & KernelSU Hard-Removal
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/bin-force:$PATH"
          MAKE_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang AS=clang LD=ld.lld CROSS_COMPILE=aarch64-linux-gnu- O=out"

          echo "--- 1. Nuclear Removal of KernelSU References ---"
          # Curățăm referințele din fișierele de configurare
          find . -type f -name "Kconfig*" -exec sed -i '/[kK][eE][rR][nN][eE][lL][sS][uU]/d' {} +
          find . -type f -name "Makefile*" -exec sed -i '/[kK][eE][rR][nN][eE][lL][sS][uU]/d' {} +
          
          # REPARAȚIE: Ștergem și recreăm folderul pentru a evita eroarea "File exists"
          rm -rf drivers/android/kernelsu
          mkdir -p drivers/android/kernelsu
          
          # Creăm fișiere dummy goale (Failsafe pentru sistemul de build)
          touch drivers/android/kernelsu/Kconfig
          echo "obj-y += kernelsu/" > drivers/android/kernelsu/Makefile
          touch drivers/android/kernelsu/Makefile

          echo "--- 2. Locating r5q_defconfig ---"
          if [ -f "arch/arm64/configs/r5q_defconfig" ]; then
              CONF_PATH="r5q_defconfig"
          elif [ -f "arch/arm64/configs/vendor/r5q_defconfig" ]; then
              CONF_PATH="vendor/r5q_defconfig"
          else
              echo "FATAL: r5q_defconfig not found!" && exit 1
          fi

          echo "--- 3. Generating Base Config ---"
          make $MAKE_ARGS $CONF_PATH

          echo "--- 4. Injecting A15 eBPF & Fixing Previous Errors ---"
          ./scripts/config --file out/.config \
            -e CONFIG_BPF_SYSCALL \
            -e CONFIG_BPF_JIT \
            -e CONFIG_BPF_JIT_ALWAYS_ON \
            -e CONFIG_CGROUP_BPF \
            -e CONFIG_NET_CLS_BPF \
            -e CONFIG_NET_ACT_BPF \
            -e CONFIG_BPF_EVENTS \
            -d CONFIG_KSU \
            -d CONFIG_KERNEL_SU \
            -d CONFIG_SAMSUNG_PRODUCT_SHIP \
            -d CONFIG_SEC_RESTRICT_SETID \
            -d CONFIG_KNOX_KAP \
            -e CONFIG_ARM64_CRC32 \
            -d CONFIG_CGROUP_FREEZER \
            --set-val CONFIG_VMSTAT_INTERVAL 1 \
            -d CONFIG_CC_STACKPROTECTOR_STRONG \
            -e CONFIG_CC_STACKPROTECTOR_NONE \
            --set-str CONFIG_LOCALVERSION "-Lumi-Hybrid-V3"

          make $MAKE_ARGS olddefconfig
      - name: 5. Final Compilation
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/bin-force:$PATH"
          MAKE_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang AS=clang LD=ld.lld CROSS_COMPILE=aarch64-linux-gnu- O=out"
          
          echo "--- Starting Lineage-Roynas Fusion Build ---"
          make -j$(nproc --all) $MAKE_ARGS Image.gz-dtb

      - name: 6. Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lumi-Kernel-R5Q-A15-Ready
          path: out/arch/arm64/boot/Image.gz-dtb
