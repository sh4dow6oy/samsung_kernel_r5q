name: Build Roynas R5Q - Neutron Clang eBPF Dynamic
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: Roynas-Android-Playground/kernel_samsung_r3q
          ref: master
          fetch-depth: 0 # Necesar pentru a putea face cherry-pick din alte ramuri

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev \
          ccache python3 python-is-python3 libarchive-tools wget zstd libtinfo6 zip git

      - name: Setup Neutron Clang
        run: |
          mkdir clang
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang

      - name: Dynamic eBPF Cherry-Pick
        run: |
          git config --global user.email "bot@github.com"
          git config --global user.name "Kernel-Builder"
          
          # Adăugăm remote-ul LineageOS 23.2 (Kernel 4.14 Google MSM)
          git remote add lineage https://github.com/LineageOS/android_kernel_google_msm-4.14.git
          git fetch lineage lineage-23.2
          
          echo "Detecting eBPF & Networking commits..."
          
          # Extragem ultimele 60 de commit-uri legate de BPF pentru a asigura compatibilitatea Android 12-14
          # Le aplicăm în ordine inversă (cronologică) pentru a evita erorile de dependență
          BPF_COMMITS=$(git log lineage/lineage-23.2 --grep="bpf" --oneline --reverse -n 60 | awk '{print $1}')
          
          for commit in $BPF_COMMITS; do
            echo "Applying: $commit"
            git cherry-pick $commit --strategy-option=theirs || git cherry-pick --skip
          done

          # Extragem și patch-urile de netfilter/xt_quota necesare pentru monitorizarea datelor
          NET_COMMITS=$(git log lineage/lineage-23.2 --grep="netfilter" --oneline --reverse -n 20 | awk '{print $1}')
          
          for commit in $NET_COMMITS; do
            echo "Applying Net: $commit"
            git cherry-pick $commit --strategy-option=theirs || git cherry-pick --skip
          done

      - name: Build Kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export KBUILD_BUILD_USER="Roynas"
          export KBUILD_BUILD_HOST="Neutron-CI"
          
          # 1. CLEANUP (Polly removal & vDSO Fix)
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-mllvm -polly[^ ]*//g' {} +
          [ -f arch/arm64/kernel/vdso/Makefile ] && sed -i 's/-static//g' arch/arm64/kernel/vdso/Makefile

          # 2. Argumente Build
          MAKE_ARGS="ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            O=out"

          # 3. Configurare eBPF & Safety Disables
          make $MAKE_ARGS r5q_defconfig
          
          ./scripts/config --file out/.config \
            -e CONFIG_BPF \
            -e CONFIG_BPF_SYSCALL \
            -e CONFIG_BPF_JIT \
            -e CONFIG_HAVE_EBPF_JIT \
            -e CONFIG_BPF_EVENTS \
            -e CONFIG_NET_CLS_BPF \
            -e CONFIG_NET_ACT_BPF \
            -e CONFIG_CGROUP_BPF \
            -e CONFIG_NET_SCH_INGRESS \
            -d CONFIG_LTO -d CONFIG_LTO_CLANG -e CONFIG_LTO_NONE \
            -d CONFIG_KNOX_KAP -d CONFIG_SECURITY_SAMSUNG_KNOX \
            -d CONFIG_ASSIST_KSU -d CONFIG_KSU
            
          make $MAKE_ARGS olddefconfig

          # 4. Compilare (Adăugat ignore pentru pointer types și declarații implicite pentru Neutron)
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-fcommon -Wno-error -Wno-implicit-function-declaration -Wno-unused-command-line-argument -Wno-incompatible-pointer-types -Wno-unused-but-set-variable"

      - name: Package with AnyKernel3
        run: |
          IMAGE="$GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz-dtb"
          [ ! -f "$IMAGE" ] && IMAGE="$GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz"
          
          git clone https://github.com/osm0sis/AnyKernel3.git
          rm -rf AnyKernel3/.git
          cp $IMAGE AnyKernel3/Image.gz
          [ -f "$GITHUB_WORKSPACE/out/arch/arm64/boot/dtbo.img" ] && cp "$GITHUB_WORKSPACE/out/arch/arm64/boot/dtbo.img" AnyKernel3/dtbo.img
          
          # Configurare pentru S10 Lite (r5q)
          sed -i 's/device.name1=maguro/device.name1=r5q/g' AnyKernel3/anykernel.sh
          sed -i 's/device.name2=toroplus/device.name2=SM-G770F/g' AnyKernel3/anykernel.sh
          
          cd AnyKernel3 && zip -r9 ../Kernel-R5Q-eBPF-Dynamic.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-S10Lite-R5Q
          path: Kernel-R5Q-eBPF-Dynamic.zip
