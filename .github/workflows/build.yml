name: Build R5Q - Phoenix BPF Final
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Your Kernel (r5q)
        uses: actions/checkout@v4
        with:
          repository: Roynas-Android-Playground/kernel_samsung_r3q
          ref: master
          path: kernel
          fetch-depth: 0

      - name: Phoenix Kernel Total Transplant (Deep Sync)
        run: |
          cd kernel
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          
          # 1. Adăugăm sursa Phoenix
          git remote add phoenix https://github.com/PhoenixKernel/linux.git
          git fetch phoenix android-4.14-phoenix --depth=1
          
          echo "Deep-Syncing BPF Headers & Logic from Phoenix..."
          
          # 2. TRANSPLANT HEADERE CRITICE (Rezolvă eroarea BPF_PROG_TYPE_LSM)
          # Importăm atât versiunea de kernel cât și cea de user-space (uapi)
          git checkout phoenix/android-4.14-phoenix -- include/linux/bpf.h
          git checkout phoenix/android-4.14-phoenix -- include/linux/bpf_types.h
          git checkout phoenix/android-4.14-phoenix -- include/uapi/linux/bpf.h
          git checkout phoenix/android-4.14-phoenix -- include/linux/filter.h
          git checkout phoenix/android-4.14-phoenix -- include/linux/mm_types.h
          git checkout phoenix/android-4.14-phoenix -- include/linux/sched.h
          git checkout phoenix/android-4.14-phoenix -- include/linux/security.h
          git checkout phoenix/android-4.14-phoenix -- include/linux/lsm_hook_defs.h
          git checkout phoenix/android-4.14-phoenix -- include/linux/lsm_hooks.h

          # 3. TRANSPLANT SUBSISTEME (Codul sursă .c)
          git checkout phoenix/android-4.14-phoenix -- kernel/bpf/
          git checkout phoenix/android-4.14-phoenix -- security/
          git checkout phoenix/android-4.14-phoenix -- kernel/fork.c
          git checkout phoenix/android-4.14-phoenix -- kernel/exit.c
          git checkout phoenix/android-4.14-phoenix -- fs/proc/base.c
          git checkout phoenix/android-4.14-phoenix -- net/core/filter.c
          git checkout phoenix/android-4.14-phoenix -- arch/arm64/net/bpf_jit_comp.c

          # 4. FIX CLANG COMPLIANCE (Struct tags & Spinlocks)
          # Corectăm eroarea 'page' fără tag 'struct' în base.c
          sed -i 's/page = (char \*)__get_free_page/struct page *page_ptr; page = (char *)__get_free_page/g' fs/proc/base.c || true
          
          # Inițializăm noul lock arg_lock în fork.c (necesar pentru noul mm_struct)
          if grep -q "arg_lock" include/linux/mm_types.h; then
            sed -i '/spin_lock_init(&mm->page_table_lock);/a \	spin_lock_init(&mm->arg_lock);' kernel/fork.c || true
          fi

          git add .
          git commit -m "Phoenix Final: Synced BPF/LSM headers and fixed LSM types" || echo "No changes"

      - name: Setup Neutron Clang
        run: |
          sudo apt-get update && sudo apt-get install -y zstd libssl-dev
          mkdir clang
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang
          echo "$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_PATH

      - name: Build Kernel
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          
          # Curățare flag-uri LLVM incompatibile cu backport-ul BPF
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-mllvm -polly[^ ]*//g' {} +

          MAKE_ARGS="ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            O=out"

          mkdir -p out
          make $MAKE_ARGS r5q_defconfig

          # ACTIVARE BPF MODERNI (Ajustat pentru Android 15 / OneUI 7)
          ./scripts/config --file out/.config \
            -e CONFIG_BPF \
            -e CONFIG_BPF_SYSCALL \
            -e CONFIG_BPF_JIT \
            -e CONFIG_BPF_LSM \
            -e CONFIG_BPF_EVENTS \
            -e CONFIG_CGROUP_BPF \
            -e CONFIG_NET_CLS_BPF \
            -e CONFIG_NET_ACT_BPF \
            -d CONFIG_SAMSUNG_RTIC \
            -d CONFIG_SECURITY_RKP \
            -d CONFIG_WERROR

          make $MAKE_ARGS olddefconfig

          # Compilare cu ignorarea warning-urilor de redefinire
          make -j$(nproc --all) $MAKE_ARGS Image.gz \
            KCFLAGS="-w -fcommon -fno-stack-protector -Wno-implicit-function-declaration" \
            HOSTCFLAGS="-w"

      - name: Package with AnyKernel3
        run: |
          if [ -f kernel/out/arch/arm64/boot/Image.gz ]; then
            git clone https://github.com/osm0sis/AnyKernel3.git AK3
            cp kernel/out/arch/arm64/boot/Image.gz AK3/
            cd AK3
            sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
            zip -r9 ../R5Q-OneUI7-Phoenix-Final.zip *
          else
            echo "Build failed! Analizează erorile de compilare de mai sus."
            exit 1
          fi

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-R5Q-Phoenix-Final
          path: R5Q-OneUI7-Phoenix-Final.zip
