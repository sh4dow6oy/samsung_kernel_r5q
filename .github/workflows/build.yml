name: Build Roynas R5Q - Neutron Clang
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: Roynas-Android-Playground/kernel_samsung_r3q
          ref: master
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev \
          ccache python3 python-is-python3 libarchive-tools wget libtinfo5 zstd

      - name: Setup Neutron Clang
        run: |
          mkdir neutron
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C neutron
          rm neutron-clang-10032024.tar.zst

      - name: Setup GCC Prebuilts (Firefly)
        run: |
          git clone https://github.com/Firefly-rk-linux/prebuilts-gcc-linux-x86-aarch64-gcc-arm-10.3-2021.07-x86_64-aarch64-none-linux-gnu.git --depth=1 gcc64
          git clone https://github.com/Firefly-rk-linux/prebuilts-gcc-linux-x86-arm-gcc-arm-10.3-2021.07-x86_64-arm-none-linux-gnueabihf.git --depth=1 gcc32

      - name: Build Kernel
        run: |
          N_PATH=$GITHUB_WORKSPACE/neutron/bin
          G64_PATH=$GITHUB_WORKSPACE/gcc64/bin
          G32_PATH=$GITHUB_WORKSPACE/gcc32/bin
          export PATH="$N_PATH:$G64_PATH:$G32_PATH:$PATH"

          # NUCLEAR CLEANUP: Eliminăm flag-urile Polly care nu sunt standard în Neutron
          find . -type f -name "Makefile*" -exec sed -i 's/-polly-loopfusion-greedy=1//g' {} +
          find . -type f -name "Makefile*" -exec sed -i 's/-mllvm -polly//g' {} +
          
          # Fix Kconfig
          sed -i '/kernelsu/d' drivers/android/Kconfig

          # Argumente Build
          MAKE_ARGS="ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-none-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-none-linux-gnueabihf- \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            LD=ld.lld \
            LLVM=1 \
            LLVM_IAS=1 \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            O=out"

          # 1. Config
          make $MAKE_ARGS r5q_defconfig

          # 2. Patch .config (Android 15 eBPF Support)
          ./scripts/config --file out/.config \
            -d CONFIG_KNOX_KAP \
            -d CONFIG_SECURITY_SAMSUNG_KNOX \
            -d CONFIG_RKP_KDP \
            -d CONFIG_SAMSUNG_PRODUCT_SHIP \
            -d CONFIG_SECURITY_DEFEX \
            -d CONFIG_CC_STACKPROTECTOR_STRONG \
            -e CONFIG_CC_STACKPROTECTOR_NONE \
            -e CONFIG_BPF -e CONFIG_BPF_SYSCALL -e CONFIG_BPF_JIT \
            -e CONFIG_CGROUP_BPF -e CONFIG_NET_CLS_BPF -e CONFIG_NET_ACT_BPF

          make $MAKE_ARGS olddefconfig

          # 3. Compile
          # Neutron Clang suportă optimizări avansate, dar folosim KCFLAGS pentru siguranță
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-fcommon -Wno-error -Wno-unused-command-line-argument"

      - name: Upload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-Neutron-A15
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/dtbo.img
