name: Lumi Kernel R5Q Raw Build (DTC Optimized)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential bison flex libssl-dev libelf-dev \
          clang lld llvm-dev python3 python3-dev git python-is-python3 zstd libncurses6 \
          libncursesw6 wget curl libtinfo6 || true
          
          # Fix biblioteci Neutron Clang
          sudo ln -s /usr/lib/x86_64-linux-gnu/libncurses.so.6 /usr/lib/x86_64-linux-gnu/libncurses.so.5 || true
          sudo ln -s /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5 || true

      - name: 2. Setup Neutron Clang Toolchain
        run: |
          mkdir -p clang
          wget -q --show-progress https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang
          echo "$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_PATH
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/clang/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: 3. Checkout LumiPlayground (rawr-bpf branch)
        uses: actions/checkout@v4
        with:
          repository: 'LumiPlayground/android_kernel_samsung_sm8150'
          ref: 'rawr-bpf'
          path: kernel

      - name: 4. Build Prep (DTC & Warnings Fix)
        working-directory: kernel
        run: |
          # Dezactivăm -Werror pentru a trece de avertismentele stricte ale Neutron Clang
          find . -name Makefile -exec sed -i 's/-Werror//g' {} +
          # Dezactivăm verificarea stack-protector care blochează build-ul
          sed -i 's/$(error Cannot use CONFIG_CC_STACKPROTECTOR_STRONG.*/$(warning Stack protector check bypassed)/g' Makefile

      - name: 5. Compilare Kernel (r5q_eur_open_defconfig)
        working-directory: kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/clang/lib:$LD_LIBRARY_PATH"
          
          # Mediul de compilare solicitat + deactivare stack protector din argumente pentru siguranță
          KERNEL_MAKE_ENV="DTC_EXT=$(pwd)/scripts/dtc CONFIG_BUILD_ARM64_DT_OVERLAY=y CONFIG_CC_STACKPROTECTOR_NONE=y"
          
          MAKE_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang AS=clang LD=ld.lld \
          CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- O=out"
          
          # 1. Generare Config
          make $MAKE_ARGS $KERNEL_MAKE_ENV r5q_eur_open_defconfig

          # 2. Compilare propriu-zisă
          make $MAKE_ARGS $KERNEL_MAKE_ENV -j$(nproc --all) Image.gz-dtb

      - name: 6. Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Lumi-Kernel-R5Q-Raw-DTC
          path: |
            kernel/out/arch/arm64/boot/Image.gz-dtb
            kernel/out/.config
