name: S10 Lite Kernel - Android 15 Hybrid (Tracing No-Op Fix)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves libncurses-dev git wget make python2 python3 pahole

      - name: Cache Toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: toolchain/proton-clang
          key: ${{ runner.os }}-proton-clang-v1

      - name: Download Proton Clang
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang

      - name: Upstream from Kernel.org (Linux 4.14.y)
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          
          git remote add linux-stable https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git || true
          git fetch linux-stable linux-4.14.y --depth=1
          
          PATHS=(
            "kernel/bpf/"
            "drivers/android/"
            "include/linux/bpf.h"
            "include/linux/filter.h"
            "include/linux/bpf_verifier.h"
            "include/linux/bpf-cgroup.h"
            "include/uapi/linux/bpf.h"
            "include/uapi/linux/bpf_common.h"
            "include/uapi/linux/filter.h"
            "arch/arm64/net/"
          )

          for path in "${PATHS[@]}"; do
            git checkout FETCH_HEAD -- "$path" || echo "Skip: $path"
          done

      - name: Pre-build Fixes & BPF Patching
        run: |
          # 1. Fix Assembler
          sed -i '/#define _UAPI_LINUX_TYPES_H/a #ifndef __poll_t\n#ifndef __ASSEMBLY__\ntypedef unsigned int __poll_t;\n#endif\n#define __poll_t __poll_t\n#endif' include/uapi/linux/types.h

          # 2. Fix Cgroup Bridge
          if [ -f kernel/cgroup/cgroup.c ]; then
            sed -i 's/ret = cgroup_bpf_inherit(root_cgrp)/cgroup_bpf_inherit(root_cgrp, NULL)/g' kernel/cgroup/cgroup.c
            sed -i 's/ret = cgroup_bpf_inherit(cgrp)/cgroup_bpf_inherit(cgrp, NULL)/g' kernel/cgroup/cgroup.c
            sed -i 's/__cgroup_bpf_attach/cgroup_bpf_attach/g' kernel/cgroup/cgroup.c
            sed -i 's/__cgroup_bpf_detach/cgroup_bpf_detach/g' kernel/cgroup/cgroup.c
          fi

          # 3. Fix BPF Tracing (Neutralizam functiile problematice)
          if [ -f kernel/trace/bpf_trace.c ]; then
            # Definim macro-urile lipsa ca fiind operatii goale (0)
            sed -i '1i #define BPF_PROG_RUN_ARRAY(array, ctx, func) 0' kernel/trace/bpf_trace.c
            sed -i '1i #define BPF_PROG_RUN 0' kernel/trace/bpf_trace.c
            
            # Inlocuim apelurile de functii cu asignari simple ca sa nu mai folosim parantezele
            sed -i 's/bpf_prog_array_copy(old_array, NULL, prog, \&new_array)/-1; \/\/ /g' kernel/trace/bpf_trace.c
            sed -i 's/bpf_prog_array_copy(old_array, event->prog, NULL, \&new_array)/-1; \/\/ /g' kernel/trace/bpf_trace.c
            sed -i 's/bpf_prog_array_free(old_array)/0; \/\/ /g' kernel/trace/bpf_trace.c
            sed -i 's/bpf_prog_array_delete_safe(old_array, event->prog)/0; \/\/ /g' kernel/trace/bpf_trace.c
          fi

          # 4. Fix Cgroup.c macro conflict
          if [ -f kernel/bpf/cgroup.c ]; then
            sed -i 's/BPF_PROG_RUN(prog, sk)/((*prog->bpf_func)(sk, prog->insnsi))/g' kernel/bpf/cgroup.c
            sed -i 's/BPF_PROG_RUN(prog, sock_ops)/((*prog->bpf_func)(sock_ops, prog->insnsi))/g' kernel/bpf/cgroup.c
          fi

          # 5. Bypass SELinux BPF
          if [ -f security/selinux/hooks.c ]; then
            sed -i 's/if (file->f_op == \&bpf_map_fops)/if (0)/g' security/selinux/hooks.c
            sed -i 's/} else if (file->f_op == \&bpf_prog_fops)/} else if (0)/g' security/selinux/hooks.c
            sed -i '/prog->aux->security/s/^/\/\//' security/selinux/hooks.c
            sed -i '/aux->security =/s/^/\/\//' security/selinux/hooks.c
          fi

          # 6. Injectare ALU
          echo "#define BPF_ALU_IMMEDIATE 1" >> include/linux/filter.h
          echo "#define BPF_ALU_NON_IMM 0" >> include/linux/filter.h

          # 7. Samsung specific fixes
          mkdir -p system/core/liblog/include/log system/logging/liblog/include/log
          echo -e "#ifndef _PERFLOG_H\n#define _PERFLOG_H\n#endif" > system/core/liblog/include/log/perflog.h
          sudo sh -c 'echo "#!/bin/bash" > /usr/bin/secgetspf'
          sudo chmod +x /usr/bin/secgetspf
          [ -f scripts/gcc-wrapper.py ] && mv scripts/gcc-wrapper.py scripts/gcc-wrapper.py.disabled || true
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Build Kernel
        run: |
          export PATH=$(pwd)/toolchain/proton-clang/bin:$PATH
          MAKE_ARGS="O=out ARCH=arm64 CC=clang HOSTCC=gcc HOSTCXX=g++ LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1 KCFLAGS=-Wno-error TECHPACK=true"

          rm -rf out && mkdir -p out
          make $MAKE_ARGS r5q_eur_open_defconfig
          ./scripts/config --file out/.config --enable CONFIG_BPF_SYSCALL --enable CONFIG_BPF_JIT --enable CONFIG_ANDROID_BINDERFS --enable CONFIG_ANDROID_BINDER_IPC --disable CONFIG_DEBUG_INFO_BTF
          make $MAKE_ARGS olddefconfig
          
          make -j$(nproc --all) $MAKE_ARGS || (echo "DIAGNOSTIC J1..." && make -j1 $MAKE_ARGS)

          if [ -f out/arch/arm64/boot/Image ]; then
            echo "KERNEL_READY=true" >> $GITHUB_ENV
            cp out/arch/arm64/boot/Image .
            [ -f out/arch/arm64/boot/dtbo.img ] && cp out/arch/arm64/boot/dtbo.img .
          else
            echo "ERROR: Image not generated!"
            exit 1
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: env.KERNEL_READY == 'true'
        with:
          name: Kernel-S10Lite-A15-Hybrid
          path: |
            Image
            dtbo.img
