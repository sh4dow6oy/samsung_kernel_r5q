name: S10 Lite - Core eBPF for Android 15

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # 1️⃣ Checkout kernel source
      - name: Checkout S10 Lite Kernel
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 2️⃣ Setup Clang toolchain
      - name: Setup Proton Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves make python3 lz4
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang

      # 3️⃣ Backport core eBPF + real BTF headers
      - name: Core eBPF & BTF Backport
        run: |
          git remote add linux-stable https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git || true
          git fetch linux-stable linux-5.1.y --depth=1

          PATHS=(
            "kernel/bpf/"
            "include/linux/bpf.h"
            "include/linux/filter.h"
            "include/linux/bpf_verifier.h"
            "include/linux/tnum.h"
            "include/linux/btf.h"        # real header
            "include/uapi/linux/bpf.h"
            "include/uapi/linux/btf.h"   # real header
            "include/uapi/linux/bpf_common.h"
            "include/linux/bpf-cgroup.h"
          )
          for path in "${PATHS[@]}"; do
            git checkout FETCH_HEAD -- "$path"
          done

      # 4️⃣ Neutralize incompatible modules (optional)
      - name: Disable incompatible BPF modules
        run: |
          echo "/* Neutralized */" > kernel/bpf/devmap.c
          echo "/* Neutralized */" > kernel/bpf/cpumap.c
          echo "/* Neutralized */" > kernel/bpf/offload.c
          echo "/* Neutralized */" > kernel/bpf/bpf_lirc.c
          echo "/* Neutralized */" > kernel/bpf/reuseport_array.c

      # 5️⃣ Build kernel
      - name: Build Kernel
        run: |
          export PATH=$(pwd)/toolchain/proton-clang/bin:$PATH
          MAKE_ARGS="O=out ARCH=arm64 CC=clang HOSTCC=gcc CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1"
          export KCFLAGS="-Wno-error -Wno-incompatible-pointer-types -Wno-int-conversion -Wno-implicit-function-declaration -Wno-return-type -Wno-unused-variable -Wno-unused-function"

          make $MAKE_ARGS r5q_eur_open_defconfig

          # Enable core Android 15 eBPF options
          ./scripts/config --file out/.config --enable CONFIG_BPF_SYSCALL
          ./scripts/config --file out/.config --enable CONFIG_BPF_JIT
          ./scripts/config --file out/.config --enable CONFIG_CGROUP_BPF
          
          # Disable modules that break boot on non-Pascua base
          ./scripts/config --file out/.config --disable CONFIG_KPERFMON
          ./scripts/config --file out/.config --disable CONFIG_MODVERSIONS
          ./scripts/config --file out/.config --disable CONFIG_SAMSUNG_PRODUCT_SHIP
          ./scripts/config --file out/.config --disable CONFIG_DEFEX
          
          make $MAKE_ARGS olddefconfig
          make -j$(nproc --all) $MAKE_ARGS Image.gz-dtb || make -j1 $MAKE_ARGS Image.gz-dtb

      # 6️⃣ Upload built kernel
      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-Core-eBPF-A15
          path: out/arch/arm64/boot/Image.gz-dtb
