name: Build Roynas R5Q - SM8150 Final Fix
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: sh4dow6oy/android_kernel_samsung_sm7150
          ref: sixteen
          path: kernel
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev \
          ccache python3 python-is-python3 libarchive-tools wget zstd zip \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libncurses-dev libtinfo6

      - name: Setup Neutron Clang
        run: |
          mkdir clang
          wget -q https://github.com/Ylarod/setup-ndk-clang/releases/download/prebuilt/clang-linux-x86-ndk-r29-r563880c.tar.zst
          tar -I zstd -xf clang-linux-x86-ndk-r29-r563880c.tar.zst -C clang

      - name: Build Kernel
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export KBUILD_BUILD_USER="Roynas"
          export KBUILD_BUILD_HOST="S10Lite-Vendor"

          # 1. GENERARE HEADERE
          make ARCH=arm64 O=out headers_install

          # 2. FIX-URI SURSĂ
          sed -i 's/initcall_sec_debug/initcall_debug/g' init/main.c
          sed -i '0,/struct perf_event \*event;/! s/struct perf_event \*event;/\/\/ duplicat/g' kernel/trace/trace_event_perf.c
          
          # --- FIX BLKTRACE (u64 vs kernfs_node_id) ---
          sed -i 's/u64 cgid/union kernfs_node_id *cgid/g' kernel/trace/blktrace.c
          
          # --- FIX AUDIO ---
          find techpack/audio -name "wcd-mbhc-adc.c" -exec sed -i 's/mbhc->slow_insertion/0/g' {} +
          
          # --- FIX TOUCH ---
          find drivers/input/touchscreen -name "*.c" -exec sed -i 's/dump_callbacks.inform_dump = dump_tsp_log;/\/\/ fix_touch/g' {} +

          # --- FIX BATERIE (Comentăm liniile problematice în loc de 0 = true) ---
          find drivers/battery_v2 -type f -exec sed -i 's/.*now_isApdo.*/\/\/ fix_apdo/g' {} +
          find drivers/battery_v2 -type f -exec sed -i 's/.*num_apdo.*/\/\/ fix_apdo/g' {} +
          find drivers/battery_v2 -type f -exec sed -i 's/.*has_apdo.*/\/\/ fix_apdo/g' {} +
          sed -i 's/psy_do_property.*POWER_SUPPLY_EXT_PROP_DIRECT_CLEAR_ERR.*/\/\/ fix void*/g' drivers/battery_v2/sec_battery.c

          # 3. CONFIGURARE (R5Q + Vendor SM8150)
          MAKE_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- O=out"
          
          scripts/kconfig/merge_config.sh -m -O out \
            arch/arm64/configs/r5q_defconfig \
            arch/arm64/configs/vendor/sm8150_defconfig
          
          ./scripts/config --file out/.config \
            -d CONFIG_SEC_DEBUG \
            -d CONFIG_SECURITY_SMACK \
            -d CONFIG_KSU -d CONFIG_KSU_NEXT \
            -d CONFIG_LTO -d CONFIG_LTO_CLANG -e CONFIG_LTO_NONE \
            -e CONFIG_SECTION_MISMATCH_WARN_ONLY
            
          make $MAKE_ARGS olddefconfig

          # 4. COMPILARE
          KCFLAGS_BASE="-fcommon -w -Wno-error -DPON_RESTART_REASON_CROSS_FAIL=0 -I$(pwd)/out/usr/include"
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="$KCFLAGS_BASE" Image.gz

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          cp kernel/out/arch/arm64/boot/Image.gz AnyKernel3/
          sed -i 's/device.name1=maguro/device.name1=r5q/g' AnyKernel3/anykernel.sh
          cd AnyKernel3 && zip -r9 ../Kernel-R5Q-SM8150-Final.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-R5Q-Stable
          path: Kernel-R5Q-SM8150-Final.zip
