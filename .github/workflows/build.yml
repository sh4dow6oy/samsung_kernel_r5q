name: Build S10 Lite Kernel (4.14) A15-BPF Backport

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev dwarves \
            libncurses-dev git wget unzip make python2 \
            python3 python3-minimal lz4 xz-utils gcc g++ pahole

      - name: Download Proton Clang
        run: |
          mkdir -p toolchain
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang

      - name: Backport BPF Headers (Pascua28 sixteen)
        run: |
          # Clonăm specific branch-ul 'sixteen'
          git clone --depth=1 https://github.com/pascua28/android_kernel_samsung_sm8250 -b sixteen tmp_repo
          
          mkdir -p include/uapi/linux/
          mkdir -p include/linux/
          
          # Copiem fișierele critice BTF și BPF din sursa lui Pascua28
          cp -f tmp_repo/include/uapi/linux/btf.h include/uapi/linux/btf.h || true
          cp -f tmp_repo/include/linux/btf.h include/linux/btf.h || cp -f tmp_repo/include/uapi/linux/btf.h include/linux/btf.h
          cp -f tmp_repo/include/uapi/linux/bpf.h include/uapi/linux/bpf.h || true
          cp -f tmp_repo/include/linux/bpf.h include/linux/bpf.h || true
          
          # Curățăm repo-ul temporar
          rm -rf tmp_repo
          echo "Backport din branch-ul 'sixteen' finalizat."

      - name: Pre-build Fixes
        run: |
          # 1. Rezolvăm eroarea 'btf.h file not found' în kernel/bpf/core.c
          # Schimbăm includerea pentru a căuta în calea de sistem corectă
          sed -i 's|<uapi/linux/btf.h>|<linux/btf.h>|g' kernel/bpf/core.c || true
          
          # 2. Fix log-uri Samsung (perflog.h)
          mkdir -p system/core/liblog/include/log
          mkdir -p system/logging/liblog/include/log
          touch system/core/liblog/include/log/perflog.h
          touch system/logging/liblog/include/log/perflog.h
          
          # 3. Dezactivăm wrapper-ul Samsung și setăm Python
          [ -f scripts/gcc-wrapper.py ] && mv scripts/gcc-wrapper.py scripts/gcc-wrapper.py.disabled || true
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Build Kernel
        run: |
          export PATH=$(pwd)/toolchain/proton-clang/bin:$PATH
          
          MAKE_ARGS="
            O=out \
            ARCH=arm64 \
            CC=clang \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1 \
            KCFLAGS=-Wno-error \
            TECHPACK=true
          "

          mkdir -p out
          make $MAKE_ARGS r5q_eur_open_defconfig

          # Activăm manual suportul BPF cerut de Android 15
          ./scripts/config --file out/.config --enable CONFIG_BPF_SYSCALL
          ./scripts/config --file out/.config --enable CONFIG_BPF_JIT
          ./scripts/config --file out/.config --enable CONFIG_HAVE_EBPF_JIT
          ./scripts/config --file out/.config --enable CONFIG_NET_CLS_BPF
          ./scripts/config --file out/.config --enable CONFIG_NET_ACT_BPF
          ./scripts/config --file out/.config --enable CONFIG_CGROUP_BPF
          ./scripts/config --file out/.config --enable CONFIG_DEBUG_INFO_BTF

          # Rezolvăm automat noile opțiuni din config
          make $MAKE_ARGS olddefconfig

          # Start compilare
          make -j$(nproc --all) $MAKE_ARGS

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-S10Lite-A15-Ready
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dtbo.img
            out/arch/arm64/boot/dts/vendor/qcom/*.dtb
