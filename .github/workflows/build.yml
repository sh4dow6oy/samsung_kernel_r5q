name: Samsung SM8150 (r5q) - Full Hardware Integration - V32

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: sh4dow6oy/android_kernel_samsung_sm8150-5.4
          path: kernel
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libncurses-dev git zstd python3 gzip

      - name: Download & Extract Neutron Clang
        run: |
          mkdir -p neutron
          wget https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C neutron/

      - name: Patch Source Code
        run: |
          cd kernel
          # 1. Fix Section Mismatch (Samsung Debug)
          sed -i 's/__init //g' drivers/samsung/debug/sec_debug_summary.c 2>/dev/null || true
          sed -i 's/__init //g' include/linux/sec_debug.h 2>/dev/null || true
          
          # 2. Fix IOMMU Header (MHI/Modem fix)
          find drivers/bus/mhi/ -type f -name "*.c" -exec sed -i 's/asm\/dma-iommu.h/linux\/dma-iommu.h/g' {} +
          
          # 3. Patch Duplicate Symbols
          FLOW_FILE=$(find net/ -name flow.c)
          [ ! -z "$FLOW_FILE" ] && sed -i 's/^void flow_cache_ops_register/void __attribute__((weak)) flow_cache_ops_register/g' "$FLOW_FILE"

      - name: Compile Kernel
        run: |
          cd kernel
          export PATH=$GITHUB_WORKSPACE/neutron/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export LD=ld.lld
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          # 1. Aplicăm Config-ul tău
          make O=out vendor/r5q_eur_open_defconfig
          
          # 2. FORȚĂM ACTIVAREA DRIVERELOR (Built-in 'y')
          # Touchscreen - Activăm toate variantele posibile pentru Samsung SM8150
          scripts/config --file out/.config -e CONFIG_INPUT_TOUCHSCREEN
          scripts/config --file out/.config -e CONFIG_TOUCHSCREEN_SAMSUNG
          scripts/config --file out/.config -e CONFIG_TOUCHSCREEN_SEC_TS_Y771_R5
          scripts/config --file out/.config -e CONFIG_TOUCHSCREEN_SEC_TS_FTS
          scripts/config --file out/.config -e CONFIG_TOUCHSCREEN_SEC_TS_ZINITIX
          
          # Magistrale de date (Fără ele nu comunică ecranul)
          scripts/config --file out/.config -e CONFIG_I2C_QCOM_GENI
          scripts/config --file out/.config -e CONFIG_SPI_QCOM_GENI
          scripts/config --file out/.config -e CONFIG_I2C_CHARDEV
          
          # Senzori și alte piese
          scripts/config --file out/.config -e CONFIG_SENSORS_SSC
          scripts/config --file out/.config -e CONFIG_INPUT_SENSORS
          scripts/config --file out/.config -e CONFIG_MSM_CAMERA
          
          # 3. Eliminăm blocajele de securitate Samsung
          scripts/config --file out/.config -d CONFIG_SDP
          scripts/config --file out/.config -d CONFIG_SAMSUNG_PRODUCT_SHIP
          scripts/config --file out/.config -d CONFIG_DEFEX
          scripts/config --file out/.config -d CONFIG_SECURITY_DSMS
          
          # Finalizare config
          make O=out ARCH=arm64 olddefconfig

          # 4. Build Image
          make -j$(nproc --all) O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 \
                      KCFLAGS="-Wno-error -w -fcommon -fno-stack-protector" \
                      Image

      - name: Prepare Artifacts
        run: |
          if [ -f kernel/out/arch/arm64/boot/Image ]; then
            gzip -n -c kernel/out/arch/arm64/boot/Image > kernel/Image.gz
            echo "Kernel Image.gz generat cu succes!"
          else
            echo "Kernel Image not found!"
            exit 1
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-r5q-V32-FinalFix
          path: kernel/Image.gz
