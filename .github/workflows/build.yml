name: Build Roynas R5Q - Proton Clang Full BPF
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Free Disk Space (The Heavy Cleanup)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf /etc/apt/sources.list.d/*
          sudo docker image prune -a -f
          sudo apt-get clean
          df -h # Afișează spațiul rămas pentru verificare

      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: sh4dow6oy/android_kernel_qcom_sm8150_419
          ref: master
          path: kernel
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves make python3 lz4 rsync libncurses5-dev git build-essential wget zip

      - name: Setup Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang

      - name: Build Kernel
        run: |
          cd kernel
          TC_PATH="$GITHUB_WORKSPACE/toolchain/proton-clang/bin"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/toolchain/proton-clang/lib:$LD_LIBRARY_PATH"
          export PATH="$TC_PATH:$PATH"
          
          mkdir -p out
          cp arch/arm64/configs/r5q_defconfig out/.config

          # Patch Makefile
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-mllvm -polly[^ ]*//g' {} +
          sed -i 's/ifneq ($(wildcard $(srctree)\/scripts\/gcc-wrapper.py),)/ifeq (0,1)/g' Makefile

          MAKE_ARGS="ARCH=arm64 \
            O=out \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1 \
            HOSTCC=gcc \
            HOSTCXX=g++"

          # Config eBPF
          ./scripts/config --file out/.config \
            -e CONFIG_BPF \
            -e CONFIG_BPF_SYSCALL \
            -e CONFIG_BPF_JIT \
            -e CONFIG_HAVE_EBPF_JIT \
            -e CONFIG_CGROUP_BPF \
            -d CONFIG_SECURITY_SAMSUNG_RKP
            
          make $MAKE_ARGS olddefconfig

          # Compilare
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-fcommon -Wno-error -Wno-everything"

      - name: Package with AnyKernel3
        if: success()
        run: |
          cd kernel
          [ -f "out/arch/arm64/boot/Image.gz-dtb" ] && IMG="out/arch/arm64/boot/Image.gz-dtb" || IMG="out/arch/arm64/boot/Image.gz"
          
          git clone https://github.com/osm0sis/AnyKernel3.git
          cp $IMG AnyKernel3/Image.gz
          [ -f "out/arch/arm64/boot/dtbo.img" ] && cp out/arch/arm64/boot/dtbo.img AnyKernel3/dtbo.img

          sed -i 's/^device.name1=.*/device.name1=r5q/' AnyKernel3/anykernel.sh
          sed -i 's/^device.name2=.*/device.name2=SM-G770F/' AnyKernel3/anykernel.sh
          
          cd AnyKernel3
          zip -r9 ../Kernel-S10Lite-R5Q-BPF.zip *

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-S10Lite-R5Q
          path: Kernel-S10Lite-R5Q-BPF.zip
