name: Build Samsung SM8150 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v5
        with:
          repository: LumiPlayground/android_kernel_samsung_sm8150
          ref: auriana
          path: kernel

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential bison flex libssl-dev libelf-dev xz-utils libncurses5-dev

      - name: Download Toolchains
        run: |
          # Clang-ul cerut de tine
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b clang
          # Adăugăm GCC/Binutils pentru a furniza aarch64-linux-gnu-ld și altele
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 gcc-arm64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 gcc-arm

      - name: Merge Config and Build
        run: |
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          
          # Setăm căile către toolchain-uri
          CLANG_BIN=$(pwd)/../clang/bin
          GCC64_BIN=$(pwd)/../gcc-arm64/bin
          GCC32_BIN=$(pwd)/../gcc-arm/bin
          
          # Adăugăm totul în PATH
          export PATH="$CLANG_BIN:$GCC64_BIN:$GCC32_BIN:$PATH"
          
          # Definirea flag-urilor pentru compilare
          MAKE_FLAGS=(
              ARCH=arm64
              O=out
              CC=clang
              CLANG_TRIPLE=aarch64-linux-gnu-
              CROSS_COMPILE=aarch64-linux-android-
              CROSS_COMPILE_ARM32=arm-linux-androideabi-
              LD=ld.lld
              AR=llvm-ar
              NM=llvm-nm
              OBJCOPY=llvm-objcopy
              OBJDUMP=llvm-objdump
              STRIP=llvm-strip
          )

          # 1. Creare director
          mkdir -p out
          
          # 2. Merge Config
          bash scripts/kconfig/merge_config.sh -O out \
              arch/arm64/configs/sm8150_sec_defconfig \
              arch/arm64/configs/sm8150_sec_r5q_eur_open.config
          
          # 3. Build propriu-zis
          make -j$(nproc --all) "${MAKE_FLAGS[@]}"

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v5
        with:
          name: Image.gz-dtb
          path: kernel/out/arch/arm64/boot/Image.gz-dtb
