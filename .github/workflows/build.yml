name: Build r5q Kernel - eBPF & Samsung Fixes

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex gcc-aarch64-linux-gnu git libssl-dev python3 clang llvm lld

      - name: Clone Mainey Kernel (Base lineage-19.0)
        run: |
          git clone --depth=500 https://github.com/mainey/android_kernel_samsung_r5q.git -b lineage-19.0 kernel
          cd kernel
          git config user.email "wizard@build.com"
          git config user.name "Kernel-Wizard"

      - name: Fetch and Apply eBPF Patch (Gerrit 387879)
        run: |
          cd kernel
          git fetch https://github.com/LineageOS/android_kernel_samsung_sm7125 refs/changes/79/387879/1
          
          # Aplicăm patch-ul cu prioritate pentru codul LineageOS
          git cherry-pick FETCH_HEAD -X theirs || {
            echo "Forțăm fișierele eBPF critice..."
            git checkout FETCH_HEAD -- include/uapi/linux/bpf.h
            git checkout FETCH_HEAD -- include/linux/bpf.h
            git checkout FETCH_HEAD -- net/core/filter.c
            git add .
            git cherry-pick --continue --no-edit
          }

      - name: Hotfix Samsung Traps & BPF Identifiers
        run: |
          cd kernel
          # 1. Definim constanta BPF lipsă
          sed -i '/#define _UAPI__LINUX_BPF_H/a \
          \
          #ifndef BPF_OBJ_NAME_LEN\
          #define BPF_OBJ_NAME_LEN 16U\
          #endif' include/uapi/linux/bpf.h

          # 2. Comentăm apelurile Samsung Debug care crapă (implicit declaration)
          sed -i 's/sec_debug_sched_msg/\/\/ sec_debug_sched_msg/g' arch/arm64/kernel/traps.c
          sed -i 's/sec_debug_summary/\/\/ sec_debug_summary/g' arch/arm64/kernel/traps.c
          sed -i 's/sec_debug_save_badmode/\/\/ sec_debug_save_badmode/g' arch/arm64/kernel/traps.c

          # 3. Eliminăm orice marcaj de conflict rămas accidental
          find . -type f -name "*.h" -o -name "*.c" | xargs sed -i '/^<<<<<<< /d; /^=======/d; /^>>>>>>> /d' || true

      - name: Configure Defconfig
        run: |
          cd kernel
          mkdir -p out
          make O=out r5q_defconfig
          
          # Fix pentru NR_CPUS (Snapdragon 855 are 8 nuclee)
          scripts/config --file out/.config --set-val NR_CPUS 8
          
          # Dezactivăm Samsung Debug care intră în conflict cu eBPF/RT
          scripts/config --file out/.config -d SEC_DEBUG
          scripts/config --file out/.config -d SEC_DEBUG_SCHED_LOG
          
          # Activăm suportul eBPF obligatoriu pentru Android 13/14
          scripts/config --file out/.config -e BPF
          scripts/config --file out/.config -e BPF_SYSCALL
          scripts/config --file out/.config -e BPF_JIT
          scripts/config --file out/.config -e CGROUP_BPF
          scripts/config --file out/.config -e NETFILTER_XT_MATCH_BPF
          scripts/config --file out/.config -e NETFILTER_XT_TARGET_BPF

      - name: Build Kernel (Clang Toolchain)
        run: |
          cd kernel
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          
          # KCFLAGS Explicație:
          # -Wno-error: Nu opri build-ul la warning-uri
          # -Wno-implicit-function-declaration: Ignoră funcțiile Samsung Debug lipsă
          # -fcommon: Permite definiții multiple de variabile (specific kernel 4.14)
          # -DNR_CPUS=8: Forțează numărul de nuclee pentru a trece de eroarea din fork.c
          make -j$(nproc --all) O=out KCFLAGS="-Wno-error -Wno-implicit-function-declaration -fcommon -DNR_CPUS=8"

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-r5q-eBPF-Final-Fixed
          path: |
            kernel/out/arch/arm64/boot/Image.gz-dtb
            kernel/out/arch/arm64/boot/dtbo.img
