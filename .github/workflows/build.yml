name: Build Roynas R5Q - OneUI 7 (Android 15)

on:
  workflow_dispatch:

env:
  SUBLEVEL: "356"
  AUTHOR: "sh4dow6oy"
  DEVICE: "r5q"
  DEFCONFIG: "r5q_defconfig"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: Roynas-Android-Playground/kernel_samsung_r3q
          ref: master
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev \
          ccache python3 python-is-python3 libarchive-tools wget zstd libtinfo6 zip rsync

      - name: Setup Neutron Clang
        run: |
          mkdir clang
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang

      - name: Pull Exynos9611 Patch Commit
        run: |
          echo "Aplicăm toate fișierele din commit-ul Android 15 (842 fișiere)..."
          git clone --depth=1 --branch bd7d6490a278cea619f533e7eb7a1056fb01e02e https://github.com/Exynos9611Development/android_kernel_samsung_universal9611 temp_commit
          rsync -a --exclude='.git' temp_commit/ ./   # Copiază tot conținutul commit-ului în workspace
          rm -rf temp_commit

      - name: Apply OneUI7 & Android 15 fixes
        run: |
          # Fix sublevel
          sed -i "s/^SUBLEVEL =.*/SUBLEVEL = ${{ env.SUBLEVEL }}/" Makefile
          
          # Remove kernelsu
          sed -i '/kernelsu/d' drivers/android/Kconfig || true
          sed -i '/kernelsu/d' drivers/android/Makefile || true
          rm -rf drivers/kernelsu

          # vDSO Fix
          find arch/arm64/kernel/vdso -name "Makefile*" -exec sed -i 's/-Wl,-n//g' {} +
          find arch/arm64/kernel/vdso -name "Makefile*" -exec sed -i 's/-Wl,-T//g' {} +

      - name: Build Kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          sed -i "s/^EXTRAVERSION =.*/EXTRAVERSION = -${{ env.AUTHOR }}-OneUI7/" Makefile

          MAKE_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- O=out"
          
          make $MAKE_ARGS ${{ env.DEFCONFIG }}
          
          ./scripts/config --file out/.config \
            -e CONFIG_BPF -e CONFIG_BPF_SYSCALL -e CONFIG_BPF_JIT -e CONFIG_BPF_JIT_ALWAYS_ON \
            -e CONFIG_NET_CLS_BPF -e CONFIG_CGROUP_BPF \
            -e CONFIG_ANDROID_BINDERFS \
            -e CONFIG_OVERLAY_FS \
            -d CONFIG_KSU -d CONFIG_ASSIST_KSU \
            -d CONFIG_LTO -d CONFIG_LTO_CLANG -e CONFIG_LTO_NONE
          
          make $MAKE_ARGS olddefconfig
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-fcommon -Wno-error -Wno-unused-variable -Wno-unused-function -Wno-implicit-function-declaration"

      - name: Package for Recovery
        run: |
          IMAGE="$GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz-dtb"
          if [ ! -f "$IMAGE" ]; then IMAGE="$GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz"; fi
          git clone https://github.com/osm0sis/AnyKernel3.git
          cp $IMAGE AnyKernel3/Image.gz
          sed -i 's/device.name1=maguro/device.name1=${{ env.DEVICE }}/g' AnyKernel3/anykernel.sh
          cd AnyKernel3 && zip -r9 ../Kernel-OneUI7-Ready.zip *

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-OneUI7-R5Q
          path: "*.zip"
