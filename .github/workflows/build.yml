name: S10 Lite Kernel Build - v113

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: mainey/android_kernel_samsung_r5q
          ref: lineage-18.1
          path: kernel-res
          fetch-depth: 0

      - name: Setup Proton Clang
          # Proton este cel mai stabil pentru 4.14.x
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves make python3 lz4 perl git curl
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang

      - name: Upstream Integration (The Safe Way)
        run: |
          cd kernel-res
          git config user.email "ai@gemini.com"
          git config user.name "Gemini"
          git remote add stable https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux-stable.git
          git fetch stable linux-4.14.y --tags
          
          # Forțăm merge-ul chiar dacă istoriile par diferite
          # Folosim 'ours' pentru a păstra fișierele Samsung intacte în caz de conflict major
          git merge v4.14.356 --no-edit -X ours || echo "Merge partial finalizat cu prioritate pe sursa Samsung"

      - name: Compiler & Camera Hotfixes
        run: |
          cd kernel-res
          
          # 1. FIX COMPILER-CLANG (Eliminăm redefinirea care a blocat v112)
          # Aplicăm sed pe ambele variante posibile de macro
          sed -i '/#define __builtin_assume_aligned/d' include/linux/compiler-clang.h
          
          # 2. FIX CAMERA ISP (Variabila 'i')
          find drivers/media -name "cam_vfe_bus_ver3.c" -exec sed -i 's/uint32_t                     i;/uint32_t                     i = 0;/g' {} +

          # 3. FIX SEC_DEBUG & BPF
          find arch/arm64 -name "sec_debug.h" -exec sed -i 's/extern void sec_debug_check_sum_interrupted/static inline void sec_debug_check_sum_interrupted/g' {} +
          
          # Injectăm cerințele de rețea Android 15
          sed -i 's/CONFIG_BPF_SYSCALL=n/CONFIG_BPF_SYSCALL=y/' arch/arm64/configs/r5q_eur_open_defconfig
          {
            echo "CONFIG_BPF_JIT=y"
            echo "CONFIG_CGROUP_BPF=y"
            echo "CONFIG_NETFILTER_XT_MATCH_BPF=y"
            echo "CONFIG_BPF_STREAM_PARSER=y"
          } >> arch/arm64/configs/r5q_eur_open_defconfig

      - name: Build Kernel
        run: |
          cd kernel-res
          export PATH=$(pwd)/../toolchain/proton-clang/bin:$PATH
          
          # Definim argumentele de build pentru Proton
          MAKE_ARGS="ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1"
          
          # Dezactivăm erorile care opresc build-ul la codul Samsung vechi
          export KCFLAGS="-Wno-everything -Wno-error -Wno-macro-redefined -Wno-incompatible-pointer-types"

          make $MAKE_ARGS r5q_eur_open_defconfig
          # Încercăm build-ul Image.gz-dtb, dacă eșuează la DTB, scoatem măcar Image.gz
          make -j$(nproc --all) $MAKE_ARGS Image.gz-dtb || make -j$(nproc --all) $MAKE_ARGS Image.gz

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-S10Lite-v113
          path: |
            kernel-res/arch/arm64/boot/Image.gz-dtb
            kernel-res/arch/arm64/boot/Image.gz
