name: Build Lumi R5Q - Lineage BPF + Peripheral Merge

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LineageOS Base
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_qcom_sm8150
          ref: lineage-20
          path: kernel
          fetch-depth: 1

      - name: Checkout Samsung Source (for config extraction)
        uses: actions/checkout@v4
        with:
          repository: sh4dow6oy/android_kernel_samsung_sm8150
          ref: rawr-bpf
          path: samsung_src
          fetch-depth: 1

      - name: Merge BPF & Peripheral Config
        run: |
          LINEAGE_CONF="kernel/arch/arm64/configs/defconfig"
          SAMSUNG_CONF="samsung_src/arch/arm64/configs/r5q_eur_open_defconfig"
          MERGED_CONF="kernel/arch/arm64/configs/lumi_defconfig"

          # Pornim de la baza LineageOS
          cp $LINEAGE_CONF $MERGED_CONF

          echo "" >> $MERGED_CONF
          echo "# --- LUMI INJECTED CONFIGS ---" >> $MERGED_CONF
          
          # 1. INJECTARE SUPORT BPF (Extras din sursa ta)
          grep "CONFIG_BPF" $SAMSUNG_CONF >> $MERGED_CONF || true
          grep "CONFIG_NETFILTER_XT_MATCH_BPF" $SAMSUNG_CONF >> $MERGED_CONF || true
          grep "CONFIG_CGROUP_BPF" $SAMSUNG_CONF >> $MERGED_CONF || true
          
          # 2. INJECTARE PERIFERICE & SAMSUNG SPECIFIC
          grep "CONFIG_INPUT_TOUCHSCREEN" $SAMSUNG_CONF >> $MERGED_CONF || true
          grep "CONFIG_SENSORS_SSC" $SAMSUNG_CONF >> $MERGED_CONF || true
          grep "CONFIG_SND_SOC_SAMSUNG" $SAMSUNG_CONF >> $MERGED_CONF || true
          
          # 3. SETĂRI BOOT & SECURITY
          echo "CONFIG_SECURITY_SELINUX_BOOTPARAM=y" >> $MERGED_CONF
          echo "CONFIG_SECURITY_SELINUX_BOOTPARAM_VALUE=0" >> $MERGED_CONF
          echo "CONFIG_MODULE_SIG=n" >> $MERGED_CONF
          echo "CONFIG_ANDROID_PARANOID_NETWORK=n" >> $MERGED_CONF

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev \
          ccache python3 python-is-python3 libarchive-tools wget zstd zip \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi clang

      - name: Setup Toolchain (NDK Clang)
        run: |
          mkdir -p clang
          wget -q https://github.com/Ylarod/setup-ndk-clang/releases/download/prebuilt/clang-linux-x86-ndk-r29-r563880c.tar.zst
          tar -I zstd -xf clang-linux-x86-ndk-r29-r563880c.tar.zst -C clang

      - name: Build Kernel
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          
          export MAKE_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD=ld.lld \
            O=out"

          make $MAKE_ARGS lumi_defconfig
          make $MAKE_ARGS olddefconfig
          
          # Compilăm Kernel + DTB (fără DTBO extern)
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-Wno-error -w" O=out Image.gz-dtb

      - name: AnyKernel3 Packaging (Safe Mode)
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/Image.gz-dtb
          
          cd AnyKernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          sed -i 's|block=auto;|block=/dev/block/by-name/boot;|g' anykernel.sh
          sed -i 's/kernel.type=inline/kernel.type=gzip-dtb/g' anykernel.sh
          sed -i 's/patch_vbmeta_flag=auto/patch_vbmeta_flag=1/g' anykernel.sh
          
          # Nu flash-uim DTBO, lăsăm hardware-ul să folosească tabelul original
          zip -r9 ../Lumi-Lineage-BPF-r5q.zip *

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Lumi-BPF-Kernel
          path: Lumi-Lineage-BPF-r5q.zip
