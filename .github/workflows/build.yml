name: Build Roynas R5Q - Kernel.org 4.14.356 Upstream

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Samsung Source
        uses: actions/checkout@v4
        with:
          repository: Roynas-Android-Playground/kernel_samsung_r3q
          ref: master
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev \
          ccache python3 python-is-python3 libarchive-tools wget zstd libtinfo6 zip tar

      - name: Inject Kernel.org 4.14.356 Upstream
        run: |
          echo "Descarcăm sursa oficială v4.14.356 de pe Kernel.org..."
          wget https://mirrors.edge.kernel.org/pub/linux/kernel/v4.x/linux-4.14.356.tar.gz
          
          echo "Aplicăm Upstream-ul peste sursa Samsung..."
          # Extragem arhiva peste codul existent. 
          # Fișierele noi le vor înlocui pe cele vechi, dar driverele Samsung rămân intacte.
          tar -xzf linux-4.14.356.tar.gz --strip-components=1
          
          # Restaurăm defconfig-ul Samsung pentru a nu fi suprascris de cel generic
          git checkout arch/arm64/configs/r5q_defconfig || echo "Păstrăm config-ul existent."

      - name: Setup Neutron Clang
        run: |
          mkdir clang
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang

      - name: Build Kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          
          # 1. FIX-URI CRITICE PENTRU CLANG (Polly & LLVM cleanup)
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-mllvm -polly[^ ]*//g' {} +
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-mllvm//g' {} +
          
          # 2. VDSO & GCC WRAPPER FIX
          [ -f arch/arm64/kernel/vdso/Makefile ] && sed -i 's/-static//g' arch/arm64/kernel/vdso/Makefile
          sed -i 's/ifneq ($(wildcard $(srctree)\/scripts\/gcc-wrapper.py),)/ifeq (0,1)/g' Makefile

          # 3. KERNELSU/SAMSUNG CLEANUP
          sed -i '/kernelsu/d' drivers/android/Kconfig || true
          sed -i '/kernelsu/d' drivers/android/Makefile || true
          rm -rf drivers/kernelsu

          # 4. ARGUMENTE BUILD
          MAKE_ARGS="ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            O=out"

          # 5. CONFIGURARE
          make $MAKE_ARGS r5q_defconfig
          
          # Optimizări pentru boot și Clang
          ./scripts/config --file out/.config \
            -d CONFIG_LTO -d CONFIG_LTO_CLANG -e CONFIG_LTO_NONE \
            -d CONFIG_CC_STACKPROTECTOR_STRONG -e CONFIG_CC_STACKPROTECTOR_NONE \
            -d CONFIG_SHADOW_CALL_STACK -d CONFIG_KNOX_KAP -d CONFIG_SECURITY_SAMSUNG_KNOX \
            -d CONFIG_ASSIST_KSU -d CONFIG_KSU
            
          make $MAKE_ARGS olddefconfig

          # 6. COMPILARE
          # Folosim -fcommon pentru a gestiona posibilele coliziuni de definiții între Kernel.org și Samsung
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-fcommon -Wno-error -Wno-unknown-warning-option -Wno-unused-command-line-argument"

      - name: Package with AnyKernel3
        run: |
          IMAGE="$GITHUB_WORKSPACE/out/arch/
