name: S10 Lite - Pascua Hybrid (Final Stability)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves make python3 lz4
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang

      - name: Apply Pascua eBPF 5.1 Backport
        run: |
          git remote add linux-stable https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git || true
          git fetch linux-stable linux-5.1.y --depth=1
          PATHS=("kernel/bpf/" "include/linux/bpf.h" "include/linux/filter.h" "include/uapi/linux/bpf.h" "include/linux/bpf-cgroup.h")
          for path in "${PATHS[@]}"; do git checkout FETCH_HEAD -- "$path" || echo "Skip: $path"; done

      - name: Integration Patches
        run: |
          # 1. Ne asigurăm că nu există duplicate (curățăm orice încercare anterioară)
          # Nu adăugăm manual 'security', eBPF 5.1 îl are deja.
          
          # 2. Fix cgroup_bpf_inherit - semnătură 5.1 (2 argumente)
          if [ -f kernel/cgroup/cgroup.c ]; then
            sed -i 's/cgroup_bpf_inherit(root_cgrp)/cgroup_bpf_inherit(root_cgrp, NULL)/g' kernel/cgroup/cgroup.c
            sed -i 's/cgroup_bpf_inherit(cgrp)/cgroup_bpf_inherit(cgrp, NULL)/g' kernel/cgroup/cgroup.c
          fi

          # 3. Injectare stub-uri Linker direct în core.c (Metoda Pascua Safe)
          # Verificăm dacă nu cumva am scris deja asta
          grep -q "cgroup_bpf_update" kernel/bpf/core.c || cat <<EOF >> kernel/bpf/core.c
          #include <linux/bpf-cgroup.h>
          int cgroup_bpf_update(struct cgroup *cgrp, struct bpf_prog *prog, struct bpf_prog *old_prog, enum bpf_attach_type type) { return 0; }
          EOF

          # 4. Samsung Fixes
          mkdir -p include/linux/ && touch include/linux/perflog.h
          echo -e "#ifndef _LINUX_PERFLOG_H\n#define _LINUX_PERFLOG_H\n#endif" > include/linux/perflog.h

      - name: Build S10 Lite Hybrid
        run: |
          export PATH=$(pwd)/toolchain/proton-clang/bin:$PATH
          # Adăugăm HOSTCFLAGS pentru a ignora avertismentele OpenSSL 3.0 de pe Ubuntu 22.04
          MAKE_ARGS="O=out ARCH=arm64 CC=clang HOSTCC=gcc HOSTCFLAGS='-Wno-deprecated-declarations' CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1"
          
          # KCFLAGS relaxate pentru a permite mixul de cod 4.14/5.1
          export KCFLAGS="-Wno-error -Wno-incompatible-pointer-types -Wno-implicit-function-declaration -Wno-return-type"

          make $MAKE_ARGS r5q_eur_open_defconfig
          
          ./scripts/config --file out/.config --disable CONFIG_MODVERSIONS
          ./scripts/config --file out/.config --enable CONFIG_BPF_SYSCALL
          ./scripts/config --file out/.config --enable CONFIG_CGROUP_BPF
          ./scripts/config --file out/.config --disable CONFIG_SAMSUNG_PRODUCT_SHIP
          ./scripts/config --file out/.config --disable CONFIG_DEFEX
          
          make $MAKE_ARGS olddefconfig
          
          # Compilăm cu log-uri vizibile în caz de eroare, limitând job-urile la final dacă eșuează
          make -j$(nproc --all) $MAKE_ARGS Image.gz-dtb || make -j1 $MAKE_ARGS Image.gz-dtb

      - name: Upload Build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-Final-Hybrid
          path: out/arch/arm64/boot/Image.gz-dtb
