name: Build Roynas R5Q - Neutron Clang Raw
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: sh4dow6oy/android_kernel_samsung_sm7150
          ref: sixteen
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev \
          ccache python3 python-is-python3 libarchive-tools wget zstd zip \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libncurses-dev libtinfo6

      - name: Setup Neutron Clang
        run: |
          mkdir clang
          wget -q https://github.com/Ylarod/setup-ndk-clang/releases/download/prebuilt/clang-linux-x86-ndk-r29-r563880c.tar.zst
          tar -I zstd -xf clang-linux-x86-ndk-r29-r563880c.tar.zst -C clang

      - name: Build Kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export KBUILD_BUILD_USER="Roynas"
          export KBUILD_BUILD_HOST="GithubActions"

          # 1. PREGĂTIRE HEADERE SAMSUNG (Fără a modifica codul sursă)
          # Creăm link-uri simbolice pentru a ajuta init/main.c și driverele de input
          mkdir -p include/linux
          find drivers/samsung -name "sec_debug.h" -exec ln -sf ../../{} include/linux/sec_debug.h \;
          find drivers/samsung -name "sec_class.h" -exec ln -sf ../../{} include/linux/sec_class.h \;
          
          # Fix DTC (necesar pentru orice build de kernel pe Ubuntu recent)
          [ -f scripts/dtc/dtc-lexer.lex.c_shipped ] && sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' scripts/dtc/dtc-lexer.lex.c_shipped || true

          # 2. ARGUMENTE BUILD
          MAKE_ARGS="ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            O=out"

          # 3. GENERARE CONFIG
          make $MAKE_ARGS r5q_defconfig

          # 4. AJUSTĂRI CONFIG PENTRU COMPILATOARE MODERNE
          # Dezactivăm LTO deoarece Neutron Clang 19/20 are incompatibilități cu LLVM-ul vechi din sursa 4.19
          ./scripts/config --file out/.config \
            -d CONFIG_LTO \
            -d CONFIG_LTO_CLANG \
            -e CONFIG_LTO_NONE \
            -d CONFIG_CC_STACKPROTECTOR_STRONG \
            -e CONFIG_CC_STACKPROTECTOR_NONE \
            -e CONFIG_SECTION_MISMATCH_WARN_ONLY
            -d CONFIG_SEC_DEBUG
            -d CONFIG_SEC_DEBUG_SCHED_LOG
            -d CONFIG_SEC_DEBUG_AUTO_SUMMARY
            -d CONFIG_SEC_DEBUG_SOFTDOG

          make $MAKE_ARGS olddefconfig

          # 5. COMPILARE FINALĂ
          # Folosim KCFLAGS pentru a forța toleranța la erori de sintaxă Samsung
          # -fcommon: rezolvă erorile de tip "multiple definition"
          # -w: dezactivează toate warning-urile (Neutron este extrem de strict altfel)
          # -Wno-error: asigură că niciun warning nu este tratat ca eroare
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-fcommon -w -Wno-error -Wno-implicit-function-declaration -Wno-int-conversion"

      - name: Package with AnyKernel3
        run: |
          IMAGE="$GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz-dtb"
          if [ ! -f "$IMAGE" ]; then IMAGE="$GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz"; fi
          DTBO="$GITHUB_WORKSPACE/out/arch/arm64/boot/dtbo.img"
          
          git clone https://github.com/osm0sis/AnyKernel3.git
          rm -rf AnyKernel3/.git
          cp $IMAGE AnyKernel3/Image.gz
          [ -f "$DTBO" ] && cp $DTBO AnyKernel3/dtbo.img
          
          sed -i 's/device.name1=maguro/device.name1=r5q/g' AnyKernel3/anykernel.sh
          cd AnyKernel3 && zip -r9 ../Kernel-S10Lite-R5Q-Neutron.zip *

      - name: Upload Flashable Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-S10Lite-R5Q
          path: Kernel-S10Lite-R5Q-Neutron.zip
