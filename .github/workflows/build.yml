name: R5Q - Android 15 (Image Only)
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pascua28 Base (Source)
        uses: actions/checkout@v4
        with:
          repository: pascua28/android_kernel_samsung_sm7150
          ref: sixteen
          path: kernel

      - name: Checkout Roynas (Hardware Config)
        uses: actions/checkout@v4
        with:
          repository: Roynas-Android-Playground/kernel_samsung_r3q
          ref: master
          path: roynas_source

      - name: Smart Config Merge & Fixes
        run: |
          cd kernel
          # 1. Baza modernă sm8150
          cp arch/arm64/configs/vendor/sm8150_defconfig arch/arm64/configs/r5q_final_defconfig
          
          # 2. Injectăm driverele hardware Samsung (Display, Touch, Baterie)
          grep "CONFIG_SAMSUNG" ../roynas_source/arch/arm64/configs/r5q_defconfig >> arch/arm64/configs/r5q_final_defconfig
          grep "CONFIG_TOUCHSCREEN_SAMSUNG" ../roynas_source/arch/arm64/configs/r5q_defconfig >> arch/arm64/configs/r5q_final_defconfig
          grep "CONFIG_BATTERY_SAMSUNG" ../roynas_source/arch/arm64/configs/r5q_defconfig >> arch/arm64/configs/r5q_final_defconfig
          grep "CONFIG_PANEL_SAMSUNG" ../roynas_source/arch/arm64/configs/r5q_defconfig >> arch/arm64/configs/r5q_final_defconfig
          grep "CONFIG_SENSORS_SSC" ../roynas_source/arch/arm64/configs/r5q_defconfig >> arch/arm64/configs/r5q_final_defconfig
          
          # 3. Identificatori R5Q
          echo "CONFIG_MACH_SAMSUNG_R5Q=y" >> arch/arm64/configs/r5q_final_defconfig
          echo "CONFIG_LWB=y" >> arch/arm64/configs/r5q_final_defconfig
          
          # 4. Configurare BPF & BinderFS pentru Android 15
          scripts/config --file arch/arm64/configs/r5q_final_defconfig --enable CONFIG_BPF
          scripts/config --file arch/arm64/configs/r5q_final_defconfig --enable CONFIG_BPF_SYSCALL
          scripts/config --file arch/arm64/configs/r5q_final_defconfig --enable CONFIG_BPF_JIT
          scripts/config --file arch/arm64/configs/r5q_final_defconfig --enable CONFIG_ANDROID_BINDERFS
          
          # 5. Fix preventiv Type-C
          sed -i 's/DEVID(typec_device_id);/\/\/DEVID(typec_device_id);/g' scripts/mod/devicetable-offsets.c

      - name: Setup Toolchain (Modern NDK Clang)
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev zstd zip gcc-aarch64-linux-gnu
          mkdir -p clang
          wget -q https://github.com/Ylarod/setup-ndk-clang/releases/download/prebuilt/clang-linux-x86-ndk-r29-r563880c.tar.zst
          tar -I zstd -xf clang-linux-x86-ndk-r29-r563880c.tar.zst -C clang

      - name: Build Kernel Image
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export MAKE_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=0 CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LD=ld.lld O=out"
          
          make $MAKE_ARGS r5q_final_defconfig
          
          # Dezactivăm restricțiile Samsung care pot bloca boot-ul pe AOSP
          scripts/config --file out/.config --disable CONFIG_SAMSUNG_PRODUCT_SHIP
          scripts/config --file out/.config --disable CONFIG_SEC_RESTRICT_FORK
          
          yes "" | make $MAKE_ARGS olddefconfig
          
          # Compilăm doar imaginea cu DTB inclus
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-w" O=out Image.gz-dtb

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          
          cd AnyKernel3
          # Configurare minimală AnyKernel
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          # Ștergem orice referință la flash_dtbo pentru a evita erorile la instalare
          sed -i '/flash_dtbo/d' anykernel.sh
          
          zip -r9 ../Kernel-R5Q-A15-OnlyImage.zip *

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Image-R5Q
          path: Kernel-R5Q-A15-OnlyImage.zip
