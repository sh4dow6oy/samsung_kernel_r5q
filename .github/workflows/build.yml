name: Build Samsung Kernel r5q (Clang)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Install tar (required for checkout)
        run: |
          sudo apt-get update
          sudo apt-get install -y tar

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev dwarves \
            libncurses-dev git wget unzip make \
            python3 python3.12-distutils

      - name: Download Android NDK
        run: |
          mkdir -p toolchain
          cd toolchain
          wget https://dl.google.com/android/repository/android-ndk-r25b-linux.zip -O ndk.zip
          unzip ndk.zip -d ndk
          rm ndk.zip

      - name: Disable gcc-wrapper
        run: |
          mv scripts/gcc-wrapper.py scripts/gcc-wrapper.py.disabled || true

      - name: Make defconfig
        run: |
          make O=out ARCH=arm64 r5q_eur_open_defconfig

      - name: Build kernel
        env:
          PATH: ${{ github.workspace }}/toolchain/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin:${{ env.PATH }}
        run: |
          make -j$(nproc) O=out ARCH=arm64 LLVM=1 \
            CC=clang LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu-

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-artifacts
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dts/*.dtb
