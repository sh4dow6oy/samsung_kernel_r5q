name: Build sh4dow6oy Kernel - R5Q (OpenELA Activity Upstream)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Samsung Source
        uses: actions/checkout@v4
        with:
          repository: Roynas-Android-Playground/kernel_samsung_r3q
          ref: master

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev \
          ccache python3 python-is-python3 libarchive-tools wget zstd libtinfo6 zip \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi device-tree-compiler rsync git

      - name: Setup Toolchain (Neutron Clang)
        run: |
          mkdir -p clang
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang

      - name: Merge OpenELA Activity (4.14-v6)
        run: |
          # Adăugăm OpenELA ca remote și facem merge la ramura lor activă
          git remote add openela https://github.com/openela/kernel-lts.git
          git fetch openela 4.14-v6
          
          # Facem un merge "soft" pentru a evita conflictele masive de structură
          # Strategia: păstrăm fișierele Samsung unde există conflicte (ours)
          git config user.email "sh4dow6oy@build.com"
          git config user.name "sh4dow6oy"
          git merge -X ours openela/4.14-v6 --allow-unrelated-histories || echo "Merge conflict handled"

      - name: Surgical Fixes (Hardware & SCSI)
        run: |
          # 1. KernelSU Fix
          sed -i '/kernelsu/d' drivers/android/Kconfig
          
          # 2. SCSI Hex Fix (Surgical)
          sed -i 's/case SCSI_IOCTL_GET_IDLUN:/case 0x5382:/g' drivers/scsi/scsi_ioctl.c
          sed -i 's/case SCSI_IOCTL_GET_BUS_NUMBER:/case 0x5386:/g' drivers/scsi/scsi_ioctl.c
          sed -i 's/case SCSI_IOCTL_PROBE_HOST:/case 0x5385:/g' drivers/scsi/scsi_ioctl.c
          sed -i 's/case SCSI_IOCTL_GET_PCI:/case 0x5387:/g' drivers/scsi/scsi_ioctl.c
          
          # 3. Samsung Stub (Nuclear Symbol fix)
          echo 'void dma_contiguous_early_fixup(void *res_cma) { }' > drivers/base/samsung_stub.c
          echo 'obj-y += samsung_stub.o' >> drivers/base/Makefile
          
          # 4. Forțăm restaurarea DTS (Hardware-ul tău e sfânt)
          git checkout HEAD -- arch/arm64/boot/dts

      - name: Build Kernel Core
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          MAKE_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- O=out"
          
          make $MAKE_ARGS r5q_defconfig
          
          # Optimizări și activare DTB Image
          ./scripts/config --file out/.config \
            -e CONFIG_SAMSUNG_PRODUCT_SHIP \
            -e CONFIG_BUILD_ARM64_DTB_IMAGE \
            -e CONFIG_OF_OVERLAY \
            -d CONFIG_LTO -d CONFIG_LTO_CLANG -e CONFIG_LTO_NONE \
            -d CONFIG_WERROR
            
          make $MAKE_ARGS olddefconfig
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-Wno-error -fno-common"
          make $MAKE_ARGS dtbs

      - name: Manual Hardware Packaging
        run: |
          # Căutăm fișierul DTB pentru sm8150 (S10 Lite)
          DTB_FILE=$(find out/arch/arm64/boot/dts -name "sm8150-r5q*.dtb" | head -n 1)
          if [ -n "$DTB_FILE" ]; then
            cat out/arch/arm64/boot/Image.gz "$DTB_FILE" > out/arch/arm64/boot/Image.gz-dtb
            echo "SUCCESS: Image.gz-dtb creat."
          fi
          
          # Căutăm și generăm DTBO.img
          MKDTBOIMG=$(find . -name "mkdtboimg.py" | head -n 1)
          DTBOS=$(find out/arch/arm64/boot/dts -name "*.dtbo")
          [ -n "$DTBOS" ] && [ -n "$MKDTBOIMG" ] && python3 $MKDTBOIMG create out/dtbo.img $DTBOS

      - name: AnyKernel3 (Final Zip)
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          rm -rf AnyKernel3/.git
          
          # Alegem cea mai bună imagine disponibilă
          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/Image.gz
          else
            cp out/arch/arm64/boot/Image.gz AnyKernel3/Image.gz
          fi
          
          [ -f out/dtbo.img ] && cp out/dtbo.img AnyKernel3/dtbo.img
          
          sed -i 's/device.name1=maguro/device.name1=r5q/g' AnyKernel3/anykernel.sh
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
          
          cd AnyKernel3 && zip -r9 ../sh4dow6oy-OpenELA-Activity-R5Q.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-OpenELA-Activity-R5Q
          path: sh4dow6oy-OpenELA-Activity-R5Q.zip
