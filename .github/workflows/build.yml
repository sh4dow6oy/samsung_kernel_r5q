name: S10 Lite Kernel Build - v128 (Pascua28 Logic)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: mainey/android_kernel_samsung_r5q
          ref: lineage-18.1
          path: kernel-res
          fetch-depth: 1

      - name: Setup Proton Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves make python3 lz4 perl git curl
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang

      - name: Backport BPF & PELT (Surgical Pick)
        run: |
          cd kernel-res
          # Luam logica de BPF stabila si optimizarile de Scheduler (PELT)
          git clone --depth=1 -b lineage-22.0 https://github.com/LineageOS/android_kernel_google_msm-4.14 google-msm
          
          # 1. ACTUALIZARE BPF (Netd fix pentru A15)
          cp -rv google-msm/kernel/bpf/* kernel/bpf/
          cp -v google-msm/net/core/filter.c net/core/filter.c
          
          # 2. INJECTARE PELT UPSTREAM (Inspirat din Pascua28)
          # PELT asigura ca procesele de fundal nu "omoara" UI-ul in Android 15
          cp -v google-msm/kernel/sched/pelt.c kernel/sched/pelt.c || echo "PELT not found, skipping"
          cp -v google-msm/kernel/sched/pelt.h kernel/sched/pelt.h || echo "PELT header not found"
          
          # 3. FIX CRITICAL BPF MEMORY (Rezolva crash-uri in Android 15)
          # Adaugam verificarile de memorie bpf_jit din 5.x
          sed -i 's/return bpf_prog_select_runtime(fp, err)/fp->jited = 1; return bpf_prog_select_runtime(fp, err)/g' kernel/bpf/core.c || echo "JIT fix failed"

      - name: Architect's Surgical Prep
        run: |
          cd kernel-res
          # Eliminam modulele de debug Samsung care crapa la compilare (ss_dsi si hid-trace)
          find drivers/gpu/drm/msm/samsung -name Makefile -exec sed -i 's/obj-y += ss_dsi_panel_debug.o/#/g' {} +
          sed -i 's/obj-$(CONFIG_HID_TRACE)/#/g' drivers/hid/Makefile
          
          # Stubbing firmware obligatoriu
          mkdir -p firmware/tsp_sec
          touch firmware/tsp_sec/y771_r5.bin
          touch firmware/tsp_sec/y771_r5_1l.bin
          
          # Fix variabila 'i' si compiler definitions
          find . -type f -name "cam_vfe_bus_ver3.c" -exec sed -i 's/uint32_t                     i;/uint32_t                     i = 0;/g' {} +
          echo "#define __builtin_assume_aligned(x, ...) (x)" >> include/linux/compiler-clang.h

      - name: Hardcode Android 15 + Performance
        run: |
          cd kernel-res
          export PATH=$(pwd)/../toolchain/proton-clang/bin:$PATH
          make ARCH=arm64 CC=clang r5q_eur_open_defconfig
          
          # BPF Obligatoriu
          ./scripts/config --enable CONFIG_BPF_SYSCALL
          ./scripts/config --enable CONFIG_BPF_JIT
          ./scripts/config --enable CONFIG_CGROUP_BPF
          ./scripts/config --enable CONFIG_NETFILTER_XT_MATCH_BPF
          
          # Optimizari PELT si Scheduler (stil Pascua28)
          ./scripts/config --enable CONFIG_SCHED_WALT
          ./scripts/config --enable CONFIG_SCHED_PELT
          
          # Dezactivare Knox/RKP
          ./scripts/config --disable CONFIG_SECURITY_SAMSUNG_RKP
          
          make ARCH=arm64 CC=clang olddefconfig

      - name: Build Kernel
        run: |
          cd kernel-res
          export PATH=$(pwd)/../toolchain/proton-clang/bin:$PATH
          MAKE_ARGS="ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1"
          export KCFLAGS="-Wno-everything -Wno-error -Wno-macro-redefined -Wno-unused-variable -Wno-implicit-function-declaration"

          make -j$(nproc --all) $MAKE_ARGS Image.gz-dtb || make -j$(nproc --all) $MAKE_ARGS Image.gz

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-A15-Pascua-Upstream-v128
          path: |
            kernel-res/arch/arm64/boot/Image.gz-dtb
            kernel-res/arch/arm64/boot/Image.gz
