name: S10 Lite - Safe eBPF v3 (Build Fix)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: mainey/android_kernel_samsung_r5q
          ref: lineage-19.0
          path: kernel
          fetch-depth: 1

      - name: Setup Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves make python3 lz4
          mkdir -p toolchain
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang

      - name: Apply Safe eBPF Injection & Build Fixes
        run: |
          cd kernel
          # 1. Fix BPF Syntax (Injectare corectă în enum)
          # Adăugăm flag-urile cu virgulă la final pentru a nu strica enumerarea
          sed -i '/enum bpf_cmd/i #define BPF_OBJ_NAME_LEN 16U' include/uapi/linux/bpf.h
          sed -i '/BPF_F_WRONLY/a \	BPF_F_RDONLY_PROG = (1U << 7),\n	BPF_F_WRONLY_PROG = (1U << 8),' include/uapi/linux/bapi/linux/bpf.h || true
          sed -i '/BPF_F_WRONLY/a \	BPF_F_RDONLY_PROG = (1U << 7),\n	BPF_F_WRONLY_PROG = (1U << 8),' include/uapi/linux/bpf.h

          # 2. Bypass Samsung Security (SPF)
          echo -e "#!/bin/sh\necho '00000000000000000000000000000000'\nexit 0" > secgetspf
          chmod +x secgetspf

          # 3. Clean Makefile (Remove hardcoded Samsung toolchain paths)
          # Înlocuim căile fixe către GCC 4.9 cu variabilele de mediu standard
          sed -i 's|$(srctree)/../toolchain/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin/aarch64-linux-android-||g' Makefile

          # 4. Fix access_ok & Structs
          sed -i '1i #include <linux/version.h>\n#include <linux/types.h>' include/linux/bpf.h
          echo 'struct bpf_raw_event_map { struct bpf_map map; };' >> include/linux/bpf.h

      - name: Configure & Build
        run: |
          cd kernel
          # Adăugăm toolchain-ul în PATH și scriptul secgetspf în rădăcină
          export PATH=$(pwd):$(pwd)/../toolchain/proton-clang/bin:$PATH
          
          # Parametrii de build pentru Proton Clang
          export MAKE_ARGS="ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1"
          
          make $MAKE_ARGS r5q_eur_open_defconfig
          
          # Activare eBPF minimală pentru Android 15
          ./scripts/config --enable CONFIG_BPF_SYSCALL
          ./scripts/config --enable CONFIG_BPF_JIT
          ./scripts/config --enable CONFIG_CGROUP_BPF
          ./scripts/config --disable CONFIG_DEBUG_INFO_BTF
          ./scripts/config --disable CONFIG_SECURITY_SAMSUNG_RKP
          
          make $MAKE_ARGS olddefconfig
          
          # Build final cu suprimarea warning-urilor
          export KCFLAGS="-O2 -Wno-everything -Wno-error -fcommon"
          make -j$(nproc --all) $MAKE_ARGS Image.gz-dtb

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: s10-lite-ebpf-fix-v19
          path: kernel/arch/arm64/boot/Image.gz-dtb
