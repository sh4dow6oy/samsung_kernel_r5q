name: Build S10 Lite (Lineage 23.0 + Neutron + BPF Fix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source (nzlnice 23.0)
        uses: actions/checkout@v4
        with:
          repository: nzlnice/kernel_qcom_sm8150
          ref: lineage-23.0
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex git libssl-dev libelf-dev clang llvm lld zstd curl libarchive-tools

      - name: Download and Extract Neutron Clang
        run: |
          mkdir clang-neutron
          wget https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang-neutron
          echo "$GITHUB_WORKSPACE/clang-neutron/bin" >> $GITHUB_PATH

      - name: Inject Samsung r5q Config & Enable BPF
        run: |
          # 1. Luăm configurația de bază pentru S10 Lite
          curl -LSs https://raw.githubusercontent.com/mainey/android_kernel_samsung_r5q/lineage-19.0/arch/arm64/configs/r5q_eur_open_defconfig > arch/arm64/configs/vendor/r5q_samsung_defconfig
          
          # 2. Activăm flag-urile BPF necesare pentru a repara eroarea din verifier.c și pentru compatibilitate Android 14+
          KCONFIG=arch/arm64/configs/vendor/r5q_samsung_defconfig
          echo "CONFIG_BPF=y" >> $KCONFIG
          echo "CONFIG_BPF_SYSCALL=y" >> $KCONFIG
          echo "CONFIG_BPF_JIT=y" >> $KCONFIG
          echo "CONFIG_HAVE_EBPF_JIT=y" >> $KCONFIG
          echo "CONFIG_BPF_JIT_ALWAYS_ON=y" >> $KCONFIG
          echo "CONFIG_CGROUP_BPF=y" >> $KCONFIG
          echo "CONFIG_NETFILTER_XT_MATCH_BPF=y" >> $KCONFIG

      - name: Patch Source and Makefile
        run: |
          # Eliminăm -Werror global (Neutron e prea strict cu avertismentele)
          find . -name Makefile -exec sed -i 's/-Werror//g' {} +
          
          # Fix pentru Makefile-urile care caută GCC-ul vechi de Android
          sed -i 's/CROSS_COMPILE_ARM32 := arm-linux-androideabi-/CROSS_COMPILE_ARM32 := arm-linux-gnueabi-/g' Makefile
          sed -i 's/CROSS_COMPILE := aarch64-linux-android-/CROSS_COMPILE := aarch64-linux-gnu-/g' Makefile
          
          # Forțăm includerea filter.h în verifier.c pentru a găsi bpf_jit_blinding_enabled
          sed -i '1i #include <linux/filter.h>' kernel/bpf/verifier.c

      - name: Configure Kernel
        run: |
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1 \
            vendor/r5q_samsung_defconfig
          
          # Actualizăm configurația cu noile opțiuni din Lineage 23.0
          make -j$(nproc --all) O=out ARCH=arm64 LLVM=1 olddefconfig

      - name: Build Kernel Image
        run: |
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1 \
            2>&1 | tee build.log

      - name: Upload Kernel Image & DTBO
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-L23-Kernel
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/dtbo.img
            build.log
