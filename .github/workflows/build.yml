name: Samsung SM8150 Kernel Build (Neutron Clang) - V2

on:
  workflow_dispatch:

jobs:
  build_kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: sh4dow6oy/android_kernel_samsung_sm8150-5.4
          path: kernel
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libncurses-dev git zstd python3

      - name: Download & Extract Neutron Clang
        run: |
          mkdir neutron
          wget https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C neutron/

      - name: Compile Kernel
        run: |
          cd kernel
          export PATH=$GITHUB_WORKSPACE/neutron/bin:$PATH
          
          # Variabile mediu
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          export AR=llvm-ar
          export LD=ld.lld
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          # 1. Config
          make O=out vendor/b2q_eur_openx_defconfig

          # 2. Fix Section Mismatch (Prevent Error 2)
          sed -i 's/CONFIG_SECTION_MISMATCH_WARN_ONLY is not set/CONFIG_SECTION_MISMATCH_WARN_ONLY=y/g' out/.config
          
          # 3. Build - Incercăm să compilăm țintele pe rând pentru siguranță
          # Mai întâi Image, apoi Image.gz, apoi DTB-urile
          make -j$(nproc --all) O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 \
                      KCFLAGS="-Wno-error -w" HOSTCFLAGS="-Wno-error" HOSTCXXFLAGS="-Wno-error" \
                      Image.gz dtbs dtbo

      - name: Debug - Find Generated Files
        run: |
          echo "Căutăm fișierele rezultate..."
          find kernel/out/arch/arm64/boot/ -name "Image*"
          find kernel/out/arch/arm64/boot/dts/ -name "*.dtbo" || echo "Nu s-au găsit dtbo-uri"

      - name: Create Image.gz-dtb (Manual merge if needed)
        run: |
          cd kernel/out/arch/arm64/boot/
          # Dacă Image.gz-dtb nu există, îl creăm prin concatenarea Image.gz cu toate DTB-urile compilate
          if [ ! -f Image.gz-dtb ]; then
            echo "Concatenăm manual Image.gz cu DTB-urile..."
            cat Image.gz dts/vendor/qcom/*.dtb > Image.gz-dtb || echo "Nu s-a putut face concatenarea"
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-SM8150-Final
          path: |
            kernel/out/arch/arm64/boot/Image*
            kernel/out/arch/arm64/boot/dts/vendor/qcom/*.dtbo
            kernel/out/.config
