name: Build Samsung SM8150 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        repository: LumiPlayground/android_kernel_samsung_sm8150
        ref: auriana
        path: kernel

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm libncurses-dev wget git

    - name: Download AOSP Clang
      run: |
        # Descarcă Clang r383902 (Android 11) - stabil și compatibil cu SM8150
        mkdir -p clang
        wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-r383902.tar.gz
        tar -xf clang-r383902.tar.gz -C clang
        echo "CLANG_BIN=$(pwd)/clang/bin" >> $GITHUB_ENV

    - name: Download AOSP GCC (Binutils)
      run: |
        # Avem nevoie de binutils pentru asamblare (aarch64 4.9 pentru compatibilitate arm64)
        git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 gcc-arm64
        git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 gcc-arm32
        echo "GCC64_BIN=$(pwd)/gcc-arm64/bin" >> $GITHUB_ENV
        echo "GCC32_BIN=$(pwd)/gcc-arm32/bin" >> $GITHUB_ENV

    - name: Build Kernel
      run: |
        cd kernel
        
        # Setează PATH-ul corect (Clang primul, apoi GCC)
        export PATH="${{ env.CLANG_BIN }}:${{ env.GCC64_BIN }}:${{ env.GCC32_BIN }}:$PATH"
        
        export ARCH=arm64
        export SUBARCH=arm64
        
        # Variabile de build pentru AOSP Toolchain
        export KERNEL_MAKE_ENV="O=out \
                                DTC_EXT=$(pwd)/scripts/dtc/dtc \
                                CONFIG_BUILD_ARM64_DT_OVERLAY=y \
                                CC=clang \
                                HOSTCC=gcc \
                                CROSS_COMPILE=aarch64-linux-android- \
                                CROSS_COMPILE_ARM32=arm-linux-androideabi- \
                                CLANG_TRIPLE=aarch64-linux-gnu- \
                                LD=ld.lld"

        # 2. Configurare
        cat arch/arm64/configs/sm8150_sec_defconfig arch/arm64/configs/sm8150_sec_r5q_eur_open.config > arch/arm64/configs/combined_defconfig
        make $KERNEL_MAKE_ENV combined_defconfig
        make $KERNEL_MAKE_ENV olddefconfig

        # 3. Compilare
        # Folosim HOSTCC=gcc din sistem pentru a evita eroarea de libc pe care ai avut-o
        make -j$(nproc --all) $KERNEL_MAKE_ENV KCFLAGS="-w"
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-SM8150-r5q
        path: |
          kernel/out/arch/arm64/boot/Image.gz-dtb
          kernel/out/arch/arm64/boot/dtbo.img
          kernel/out/.config
