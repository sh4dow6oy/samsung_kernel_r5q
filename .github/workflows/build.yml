name: S10 Lite (r5q) - Kernel 4.14.x + Safe eBPF (Android 15)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source (Lineage 19.0 r5q)
        uses: actions/checkout@v4
        with:
          repository: mainey/android_kernel_samsung_r5q
          ref: lineage-19.0
          path: kernel

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex git make python3 \
            libssl-dev libelf-dev dwarves \
            lz4 ccache clang llvm

      - name: Setup Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git $HOME/proton-clang

      - name: Configure kernel (r5q + SAFE eBPF)
        run: |
          cd kernel
          export PATH=$HOME/proton-clang/bin:$PATH

          make ARCH=arm64 r5q_defconfig

          # === ENABLE SAFE eBPF (4.14 COMPATIBLE) ===
          scripts/config --enable CONFIG_BPF
          scripts/config --enable CONFIG_BPF_SYSCALL
          scripts/config --enable CONFIG_BPF_JIT
          scripts/config --enable CONFIG_HAVE_EBPF_JIT
          scripts/config --enable CONFIG_BPF_EVENTS

          scripts/config --enable CONFIG_CGROUPS
          scripts/config --enable CONFIG_CGROUP_BPF

          scripts/config --enable CONFIG_NET
          scripts/config --enable CONFIG_NETFILTER
          scripts/config --enable CONFIG_NETFILTER_XT_MATCH_BPF

          scripts/config --enable CONFIG_BPF_JIT_ALWAYS_ON
          scripts/config --enable CONFIG_BPF_JIT_DEFAULT_ON

          # === DISABLE FEATURES NOT SUPPORTED ON 4.14 ===
          scripts/config --disable CONFIG_XDP_SOCKETS
          scripts/config --disable CONFIG_XDP_SOCKETS_DIAG
          scripts/config --disable CONFIG_BPF_STREAM_PARSER
          scripts/config --disable CONFIG_BPF_LSM
          scripts/config --disable CONFIG_DEBUG_INFO_BTF
          scripts/config --disable CONFIG_BPF_PRELOAD
          scripts/config --disable CONFIG_BPF_RAW_TRACEPOINTS
          scripts/config --disable CONFIG_BPF_KPROBE_OVERRIDE
          scripts/config --disable CONFIG_FUNCTION_TRACER
          scripts/config --disable CONFIG_FTRACE_SYSCALLS

          make ARCH=arm64 olddefconfig

      - name: Build kernel
        run: |
          cd kernel
          export PATH=$HOME/proton-clang/bin:$PATH

          export ARCH=arm64
          export CC=clang
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          make -j$(nproc) Image.gz-dtb

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: r5q-kernel-4.14-ebpf-safe
          path: kernel/arch/arm64/boot/Image.gz-dtb
