name: Build Samsung S10 Lite (r5q) - Neutron Clang

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        repository: sh4dow6oy/android_kernel_samsung_a82xq
        ref: linux-4.14.285
        fetch-depth: 1

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential bison flex libssl-dev libelf-dev xz-utils wget git gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi zstd python3

    - name: Download and Setup Neutron Clang
      run: |
        mkdir -p neutron
        wget https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
        tar -I zstd -xf neutron-clang-10032024.tar.zst -C neutron
        echo "NEUTRON_BIN=$(pwd)/neutron/bin" >> $GITHUB_ENV

    - name: Surgical Source Patching
      run: |
        # 1. Eliminăm wrapper-ele de Python ale Samsung
        find . -name "Makefile*" -o -name "*.mak" -o -name "*.include" | xargs sed -i 's/python $(srctree)\/scripts\/gcc-wrapper.py//g'
        find . -name "Makefile*" -o -name "*.mak" -o -name "*.include" | xargs sed -i 's/$(srctree)\/scripts\/gcc-wrapper.py//g'
        sed -i 's/python / /g' Makefile scripts/Makefile.*

        # 2. Patch pentru drivers/clk/clk.c - METODA SIGURĂ
        # În loc să inserăm la linia 40 (unde rupem macro-uri), inserăm după ultimul #include
        last_include=$(grep -n "#include" drivers/clk/clk.c | tail -n 1 | cut -d: -f1)
        sed -i "${last_include}a #include <linux/msm-bus.h>\nstatic uint32_t clk_debugfs_bus_cl_id;" drivers/clk/clk.c

        # 3. Rezolvăm dependințele de fișiere lipsă (perflog.h)
        mkdir -p ../system/core/liblog/include/log/
        mkdir -p ../../system/core/liblog/include/log/
        mkdir -p ../../system/logging/liblog/include/log/
        echo "" > ../system/core/liblog/include/log/perflog.h
        echo "" > ../../system/core/liblog/include/log/perflog.h
        echo "" > ../../system/logging/liblog/include/log/perflog.h
        
        # 4. Bypass utilitare securitate Samsung
        echo -e "#!/bin/bash\nexit 0" > scripts/secgetspf
        chmod +x scripts/secgetspf
        sudo cp scripts/secgetspf /usr/local/bin/secgetspf

    - name: Build Kernel
      run: |
        export PATH="${{ env.NEUTRON_BIN }}:$PATH"
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        
        # Unelte LLVM
        export CC=clang
        export LD=ld.lld
        export AR=llvm-ar
        export NM=llvm-nm
        export OBJCOPY=llvm-objcopy
        export OBJDUMP=llvm-objdump
        export STRIP=llvm-strip

        make clean
        make mrproper
        make r5q_eur_open_defconfig
        
        # Compilare cu ignorare warning-uri și forțare LLVM
        make -j$(nproc --all) \
                      ARCH=arm64 \
                      CC=clang \
                      LD=ld.lld \
                      AR=llvm-ar \
                      NM=llvm-nm \
                      OBJCOPY=llvm-objcopy \
                      OBJDUMP=llvm-objdump \
                      STRIP=llvm-strip \
                      CLANG_TRIPLE=aarch64-linux-gnu- \
                      CROSS_COMPILE=aarch64-linux-gnu- \
                      CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
                      LLVM=1 \
                      LLVM_IAS=1 \
                      KCFLAGS="-w" \
                      DTC_EXT=dtc

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-S10Lite-Neutron
        path: |
          arch/arm64/boot/Image.gz*
          arch/arm64/boot/dtbo.img
