name: S10 Lite - 4.19 Hybrid (Native Audio + Samsung Display)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves libncurses-dev git wget make python2 python3 pahole tar xz-utils lib32z1

      - name: Setup Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang
          echo "PROTON_PATH=$(pwd)/toolchain/proton-clang/bin" >> $GITHUB_ENV

      - name: Hybrid Source Preparation
        run: |
          # 1. Clonare baze
          git clone --depth=1 https://github.com/duckyduckG/android_kernel_qcom_sm8150_419.git kernel_source
          git clone --depth=1 https://github.com/mainey/android_kernel_samsung_r5q.git samsung_source
          
          # 2. Injectare Config & DTS (Esențiale pentru R5Q)
          cp samsung_source/arch/arm64/configs/r5q_eur_open_defconfig kernel_source/arch/arm64/configs/r5q_defconfig
          mkdir -p kernel_source/arch/arm64/boot/dts/vendor/qcom/
          find samsung_source/arch/arm64/boot/dts/ -name "*r5q*" -exec cp {} kernel_source/arch/arm64/boot/dts/vendor/qcom/ \;
          
          cd kernel_source

          # 3. Injectare DISPLAY Techpack (Samsung specific)
          rm -rf techpack/display
          cp -r ../samsung_source/techpack/display techpack/
          
          # 4. Injectare TOUCHSCREEN Driver
          # Samsung de obicei ține touchscreen-ul în drivers/input/touchscreen/
          # Identificăm driverul sec_ts sau similar și îl copiem
          mkdir -p drivers/input/touchscreen/samsung
          cp -r ../samsung_source/drivers/input/touchscreen/* drivers/input/touchscreen/ || true

          # 5. FIX Kconfig/Makefile pentru Display Techpack
          # Ne asigurăm că sistemul de build vede techpack-ul de display
          if ! grep -q "techpack" Makefile; then
            sed -i 's/^core-y[[:space:]]*:=/core-y := techpack\/ /' Makefile
          fi
          
          # Creăm/Fixăm techpack/Kconfig
          echo 'source "techpack/display/Kconfig"' > techpack/Kconfig
          # Dacă există deja un Kconfig în techpack care include audio, îl extindem
          if [ -f techpack/Kconfig.old ]; then cat techpack/Kconfig.old >> techpack/Kconfig; fi

          # 6. FIX COMPATIBILITATE DISPLAY (4.9 -> 4.19)
          # Driverele de display Samsung pot avea referințe vechi la msm_drv.h
          find techpack/display/ -type f -name "*.h" -exec sed -i 's/struct drm_device \*ddev/struct drm_device *dev/g' {} +

          # 7. MISC FIXES (SMCInvoke & L1SS)
          if [ -f drivers/soc/qcom/smcinvoke.c ]; then
            sed -i '/static inline size_t size_add/,/}/ s/^/\/\//' drivers/soc/qcom/smcinvoke.c
          fi

          # Fix Samsung SecTools (Prevent error: 'secgetspf' not found)
          echo -e '#!/bin/bash\necho "0"' > /tmp/secgetspf
          chmod +x /tmp/secgetspf
          sudo mv /tmp/secgetspf /usr/bin/secgetspf

      - name: Build Kernel
        run: |
          export PATH="${{ env.PROTON_PATH }}:$PATH"
          cd kernel_source
          ARGS="ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1"
          
          # Flag-uri de ignorare pentru a trece de eventualele incompatibilități de display
          export KCFLAGS="-Wno-error -Wno-implicit-function-declaration -Wno-int-conversion -Wno-incompatible-pointer-types -Wno-unused-variable -Wno-return-type"

          make $ARGS r5q_defconfig
          
          # Dezactivare LTO/BTF pentru viteză și stabilitate la prima bootare
          sed -i 's/CONFIG_LTO_CLANG=y/CONFIG_LTO_CLANG=n/g' .config
          sed -i 's/CONFIG_LTO=y/CONFIG_LTO=n/g' .config
          sed -i 's/CONFIG_DEBUG_INFO_BTF=y/CONFIG_DEBUG_INFO_BTF=n/g' .config
          
          make $ARGS olddefconfig
          make -j$(nproc --all) $ARGS

          if [ -f arch/arm64/boot/Image ]; then
            cp arch/arm64/boot/Image ../
            find arch/arm64/boot/dts/ -name "*.dtbo" -exec cp {} ../ \; || true
            echo "SUCCESS=true" >> $GITHUB_ENV
          fi

      - name: Upload
        if: env.SUCCESS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-4.19-DisplayTouch-Kernel
          path: |
            Image
            *.dtbo
