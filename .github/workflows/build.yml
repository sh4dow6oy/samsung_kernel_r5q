name: Build R5Q Hybrid AOSP
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: pascua28/android_kernel_samsung_sm7150
          ref: sixteen
          path: kernel
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev \
          ccache python3 python-is-python3 libarchive-tools wget zstd zip \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libncurses-dev libtinfo6

      - name: Setup Toolchain (Neutron Clang)
        run: |
          mkdir clang
          wget -q https://github.com/Ylarod/setup-ndk-clang/releases/download/prebuilt/clang-linux-x86-ndk-r29-r563880c.tar.zst
          tar -I zstd -xf clang-linux-x86-ndk-r29-r563880c.tar.zst -C clang

      - name: Prepare Sources & Fixes
        run: |
          cd kernel
          # 1. Import R3Q Display Drivers (Roynas)
          rm -rf drivers/gpu/drm/msm/sde drivers/gpu/drm/msm/samsung drivers/gpu/drm/msm/dsi-staging
          git clone https://github.com/Roynas-Android-Playground/kernel_samsung_r3q -b master ../r3q_source
          cp -r ../r3q_source/drivers/gpu/drm/msm/sde drivers/gpu/drm/msm/
          cp -r ../r3q_source/drivers/gpu/drm/msm/samsung drivers/gpu/drm/msm/
          cp -r ../r3q_source/drivers/gpu/drm/msm/dsi-staging drivers/gpu/drm/msm/

          # 2. Fix Audio "slow_insertion" error
          find techpack/audio -name "wcd-mbhc-adc.c" -exec sed -i 's/mbhc->slow_insertion/0/g' {} +

          # 3. Create Global Samsung Fix Header
          mkdir -p include/samsung
          cat <<EOF > include/samsung/samsung_fix.h
          #ifndef __SAMSUNG_FIX_H__
          #define __SAMSUNG_FIX_H__
          #define SS_DSI_CMD_SET_MAX 60
          #define SS_DSI_CMD_SET_START 0
          #define SUPPORT_PANEL_REVISION 20
          #define CD_MAP_TABLE_MAX 15
          #define RX_CMD_START 0
          #define RX_CMD_END 150
          #define RX_SELF_DISP_DEBUG 1
          #define RX_SELF_MASK_CHECK 2
          #define TX_AID_SUBDIVISION 0
          #define TX_PAC_AID_SUBDIVISION 1
          #define TX_IRC_SUBDIVISION 2
          #define TX_PAC_IRC_SUBDIVISION 3
          static const bool is_aosp = true;
          #endif
          EOF

          # 4. Create Hybrid Defconfig (AOSP Focused)
          cp arch/arm64/configs/vendor/sm8150-perf_defconfig arch/arm64/configs/r5q_hybrid_defconfig
          cat <<EOF >> arch/arm64/configs/r5q_hybrid_defconfig
          # Security Bypass (Ata-kaner style)
          CONFIG_SEC_DEBUG=n
          CONFIG_SECURITY_SMACK=n
          CONFIG_SECURITY_DEFEX=n
          CONFIG_KNOX_KAP=n
          CONFIG_FIVE=n
          # Display & Audio Techpack
          CONFIG_DRM_SDE_R3Q=y
          # Fix Stack Protector Compiler Error
          CONFIG_CC_STACKPROTECTOR=n
          CONFIG_CC_STACKPROTECTOR_NONE=y
          CONFIG_CC_STACKPROTECTOR_STRONG=n
          # Warnings
          CONFIG_SECTION_MISMATCH_WARN_ONLY=y
          EOF

          # 5. Fix Samsung Scripts (secgetspf dummy)
          mkdir -p out
          touch out/secgetspf
          chmod +x out/secgetspf

      - name: Build Kernel
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export MAKE_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- O=out"
          
          # Initialize Config
          make $MAKE_ARGS r5q_hybrid_defconfig
          
          # Force Include our Fix Header & Path
          export KCFLAGS="-fcommon -w -Wno-error -I$(pwd)/include -include samsung/samsung_fix.h"
          
          # Start Compilation
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="$KCFLAGS" O=out Image.gz

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          cp kernel/out/arch/arm64/boot/Image.gz AnyKernel3/
          cd AnyKernel3
          # Change device names to R5Q (S10 Lite)
          sed -i 's/device.name1=maguro/device.name1=r5q/g' anykernel.sh
          sed -i 's/device.name2=panda/device.name2=SM-G770F/g' anykernel.sh
          zip -r9 ../Kernel-R5Q-AOSP-Hybrid.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-S10Lite-R5Q
          path: Kernel-R5Q-AOSP-Hybrid.zip
