name: Build Roynas R5Q - Android 15 BPF Ready
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: Roynas-Android-Playground/kernel_samsung_r3q
          ref: master
          fetch-depth: 0 # Avem nevoie de istoric pentru cherry-pick

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev \
          ccache python3 python-is-python3 libarchive-tools wget zstd libtinfo6 zip git

      - name: Cherry-pick BPF Patches
        run: |
          git config --global user.email "bot@example.com"
          git config --global user.name "Kernel Bot"
          
          # Adăugăm sursa LineageOS ca remote
          git remote add lineage https://github.com/LineageOS/android_kernel_google_msm-4.14
          git fetch lineage lineag-21.0 # Sau ramura corespunzătoare pentru A14/A15
          
          # Lista de commit-uri critice pentru BPF (Android 12+)
          # Notă: ID-urile de commit pot varia, de obicei se face merge la ramura de BPF
          # Vom încerca să facem merge la schimburile specifice de rețea/bpf
          git cherry-pick 162985f67b55 || git cherry-pick --skip
          git cherry-pick 68b20063251c || git cherry-pick --skip
          git cherry-pick 2f00a40a876a || git cherry-pick --skip

      - name: Setup Neutron Clang
        run: |
          mkdir clang
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang

      - name: Build Kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          
          # Fix VDSO & Cleanup (Păstrăm logica de succes anterioară)
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-mllvm -polly[^ ]*//g' {} +
          if [ -f arch/arm64/kernel/vdso/Makefile ]; then
            sed -i 's/$(LDFLAGS)/$(filter-out -static,$(LDFLAGS))/g' arch/arm64/kernel/vdso/Makefile
          fi

          MAKE_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- O=out"

          make $MAKE_ARGS r5q_defconfig
          
          # ACTIVARE BPF ÎN CONFIG (Esențial pentru Android 15)
          ./scripts/config --file out/.config \
            -e CONFIG_BPF \
            -e CONFIG_BPF_SYSCALL \
            -e CONFIG_NETFILTER_XT_MATCH_BPF \
            -e CONFIG_AF_KCM \
            -e CONFIG_BPF_JIT \
            -e CONFIG_BPF_JIT_ALWAYS_ON \
            -e CONFIG_NET_CLS_BPF \
            -e CONFIG_NET_ACT_BPF \
            -d CONFIG_LTO_CLANG -e CONFIG_LTO_NONE

          make $MAKE_ARGS olddefconfig
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-fcommon -Wno-error"

      - name: Package AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          cp out/arch/arm64/boot/Image.gz AnyKernel3/
          [ -f out/arch/arm64/boot/dtbo.img ] && cp out/arch/arm64/boot/dtbo.img AnyKernel3/
          cd AnyKernel3 && zip -r9 ../Kernel-R5Q-A15-BPF.zip *

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-BPF-Ready
          path: Kernel-R5Q-A15-BPF.zip
