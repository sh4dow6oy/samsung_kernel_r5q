name: S10 Lite - OneUI 7 Ready v31.1

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves make python3 lz4 perl
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang

      - name: Upstream to 4.14.356
        run: |
          git config user.email "bot@example.com"
          git config user.name "KernelBot"
          git remote add stable https://kernel.googlesource.com/pub/scm/linux/kernel/git/stable/linux-stable.git || true
          git fetch stable linux-4.14.y --depth=1
          git merge v4.14.356 -m "Upstream to 4.14.356" || echo "Merge OK"

      - name: Precise eBPF Backport
        run: |
          git remote add lineage-bpf https://github.com/LineageOS/android_kernel_google_msm-4.14.git || true
          git fetch lineage-bpf lineage-21 --depth=1
          git checkout FETCH_HEAD -- kernel/bpf/ include/linux/bpf.h include/uapi/linux/bpf.h include/linux/bpf_verifier.h

      - name: Global Fixes (No Conflict)
        run: |
          # 1. FIX: _perflog (Neutralizăm macro-ul Samsung direct în ologk.h)
          # Asta transformă orice apel perflog(...) în nimic, eliminând eroarea din psi.c și fs
          sed -i 's/#define perflog(...).*/#define perflog(...) do {} while (0)/g' include/linux/ologk.h

          # 2. FIX: access_ok (Standard Samsung 3-args pentru kernel/bpf)
          find kernel/bpf/ -type f -name "*.c" -exec sed -i 's/access_ok(\([^,]*\), \([^)]*\))/access_ok(VERIFY_READ, \1, \2)/g' {} +

          # 3. FIX: Samsung Security & RTIC
          sed -i 's/CONFIG_RTIC=y/CONFIG_RTIC=n/g' arch/arm64/configs/r5q_eur_open_defconfig || true
          sed -i 's/CONFIG_SECURITY_DEFEX=y/CONFIG_SECURITY_DEFEX=n/g' arch/arm64/configs/r5q_eur_open_defconfig || true

      - name: Build Kernel
        run: |
          export PATH=$(pwd)/toolchain/proton-clang/bin:$PATH
          MAKE_ARGS="O=out ARCH=arm64 CC=clang HOSTCC=gcc CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1"
          export KCFLAGS="-Wno-error -Wno-implicit-function-declaration -fno-pic"

          make $MAKE_ARGS r5q_eur_open_defconfig
          
          # Creăm dummy secgetspf pentru a preveni eroarea de scripts
          mkdir -p out/scripts
          echo -e "#!/bin/bash\necho 0" > out/scripts/secgetspf
          chmod +x out/scripts/secgetspf
          sudo cp out/scripts/secgetspf /usr/bin/secgetspf

          # Config OneUI 7
          ./scripts/config --file out/.config --enable CONFIG_BPF_SYSCALL
          ./scripts/config --file out/.config --enable CONFIG_BPF_JIT
          ./scripts/config --file out/.config --disable CONFIG_RTIC
          ./scripts/config --file out/.config --disable CONFIG_MODVERSIONS
          
          make $MAKE_ARGS olddefconfig
          make -j$(nproc --all) $MAKE_ARGS Image.gz-dtb
