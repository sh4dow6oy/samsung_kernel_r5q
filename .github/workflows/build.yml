name: S10 Lite - Kernel 4.14.356 + Lineage BPF

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout S10 Lite Kernel (Lineage 19 base)
        uses: actions/checkout@v4
        with:
          repository: mainey/android_kernel_samsung_r5q
          ref: lineage-19.0
          path: kernel
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev \
            dwarves python3 lz4 make \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Setup Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang

      - name: Add Linux Stable 4.14.y
        run: |
          cd kernel
          git remote add linux-stable https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git || true
          git fetch linux-stable linux-4.14.y --depth=1

      - name: Upstream Kernel to 4.14.356
        run: |
          cd kernel
          git cherry-pick \
            $(git rev-list --reverse v4.14.191..v4.14.356) || true

      - name: Fetch LineageOS BPF Source
        run: |
          git clone --depth=1 \
            https://github.com/LineageOS/android_kernel_xiaomi_sm6150 \
            -b lineage-23.2 lineage-bpf

      - name: Port Lineage BPF Core (SAFE)
        run: |
          cd kernel

          # kernel/bpf (doar fisierele compatibile 4.14)
          rsync -av --ignore-existing \
            ../lineage-bpf/kernel/bpf/ kernel/bpf/

          # headers
          rsync -av \
            ../lineage-bpf/include/linux/bpf*.h include/linux/

          rsync -av \
            ../lineage-bpf/include/uapi/linux/bpf*.h include/uapi/linux/

          rsync -av \
            ../lineage-bpf/include/linux/filter.h include/linux/

          rsync -av \
            ../lineage-bpf/include/linux/tnum.h include/linux/

      - name: Fix Known 4.14 BPF Conflicts
        run: |
          cd kernel

          # access_ok compat
          sed -i 's/access_ok(/access_ok(VERIFY_READ, /g' kernel/bpf/syscall.c || true

          # Disable unsupported perf hooks
          sed -i 's/PERF_BPF_EVENT_PROG_LOAD/0/g' kernel/bpf/syscall.c || true
          sed -i 's/PERF_BPF_EVENT_PROG_UNLOAD/0/g' kernel/bpf/syscall.c || true

          # Disable raw tracepoint if missing
          sed -i 's/bpf_get_raw_tracepoint/NULL/g' kernel/bpf/syscall.c || true

      - name: Configure Kernel
        run: |
          cd kernel
          export PATH=$(pwd)/../toolchain/proton-clang/bin:$PATH

          make ARCH=arm64 r5q_eur_open_defconfig

          ./scripts/config --enable CONFIG_BPF
          ./scripts/config --enable CONFIG_BPF_SYSCALL
          ./scripts/config --enable CONFIG_BPF_JIT
          ./scripts/config --enable CONFIG_CGROUP_BPF

          ./scripts/config --disable CONFIG_SECURITY_SAMSUNG_RKP
          ./scripts/config --disable CONFIG_DEFEX
          ./scripts/config --disable CONFIG_KPERFMON

          make ARCH=arm64 olddefconfig

      - name: Build Kernel
        run: |
          cd kernel
          export PATH=$(pwd)/../toolchain/proton-clang/bin:$PATH

          export KCFLAGS="-Wno-error -Wno-incompatible-pointer-types -Wno-int-conversion"

          make -j$(nproc) \
            ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 LLVM_IAS=1 \
            Image.gz-dtb

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-4.14.356-LineageBPF
          path: kernel/arch/arm64/boot/Image.gz-dtb
