name: Merge LineageOS SM7125 Base

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Samsung Source
        uses: actions/checkout@v4
        with:
          repository: sh4dow6oy/kernel_samsung_r5q
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

      - name: Fetch and Merge LineageOS Commit
        run: |
          # Adăugăm repo-ul oficial de GitHub pentru a evita eroarea 403 de pe Gerrit
          git remote add lineage_github https://github.com/LineageOS/android_kernel_samsung_sm7125.git
          git fetch lineage_github 1db3840e4d743768892374dc395a1a4c930a97dd
          
          echo "Începem merge-ul commit-ului LineageOS..."
          # Folosim 'allow-unrelated-histories' pentru că importurile inițiale pot părea ramuri diferite
          # Folosim strategia 'ours' pentru a nu lăsa Lineage să rescrie fișierele critice de r5q
          git merge FETCH_HEAD --allow-unrelated-histories -m "Merge SM7125 LineageOS Base" || echo "Conflicte detectate, dar continuăm..."

      - name: Disable Samsung Security (KNP/RKP)
        run: |
          DEFCONFIG="arch/arm64/configs/r5q_defconfig"
          # Curățăm defconfig-ul de orice ar putea bloca boot-ul
          sed -i 's/CONFIG_KNP=y/CONFIG_KNP=n/g' $DEFCONFIG
          sed -i 's/CONFIG_RKP=y/CONFIG_RKP=n/g' $DEFCONFIG
          sed -i 's/CONFIG_SEC_RESTRICT_FORK=y/CONFIG_SEC_RESTRICT_FORK=n/g' $DEFCONFIG

      - name: Setup Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang clang-llvm

      - name: Build Kernel
        run: |
          export PATH=$(pwd)/clang-llvm/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          
          mkdir -p out
          make O=out r5q_defconfig
          
          # Compilăm cu LLVM=1 (Standard pentru LineageOS modern)
          make -j$(nproc --all) O=out \
               CC=clang \
               CLANG_TRIPLE=aarch64-linux-gnu- \
               CROSS_COMPILE=aarch64-linux-gnu- \
               CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
               LLVM=1 LLVM_IAS=1

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: r5q-Lineage-SM7125-Merged
          path: out/arch/arm64/boot/Image.gz-dtb
