name: R5Q LumiBPF - V31 Final JIT-DTBO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Lumi Kernel
        uses: actions/checkout@v4
        with:
          repository: LumiPlayground/android_kernel_samsung_sm8150
          ref: rawr-bpf
          path: kernel

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev \
          ccache python3 python-is-python3 libarchive-tools wget zstd libtinfo6 zip \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi device-tree-compiler rsync git

      - name: Setup Toolchain (Neutron Clang)
        run: |
          mkdir -p clang
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang

      - name: Build Kernel & DTBO
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          
          # Argumente de compilare standard
          MAKE_ARGS="ARCH=arm64 \
                     LLVM=1 \
                     LLVM_IAS=1 \
                     CC=clang \
                     LD=ld.lld \
                     CROSS_COMPILE=aarch64-linux-gnu- \
                     CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
                     O=out"

          # 1. Aplicăm defconfig-ul nativ r5q
          make $MAKE_ARGS r5q_eur_open_defconfig

          # 2. HARD-ENFORCE eBPF JIT & PROJECT FLAGS
          # Folosim flag-ul CONFIG_SEC_R5Q_PROJECT pentru a activa Makefile-ul de DTBO 
          ./scripts/config --file out/.config \
            -e CONFIG_SEC_R5Q_PROJECT \
            -e CONFIG_BPF \
            -e CONFIG_BPF_SYSCALL \
            -e CONFIG_BPF_JIT \
            -e CONFIG_BPF_JIT_ALWAYS_ON \
            -e CONFIG_HAVE_EBPF_JIT \
            -e CONFIG_NET_CLS_BPF \
            -e CONFIG_NET_ACT_BPF \
            -e CONFIG_CGROUP_BPF \
            -e CONFIG_BPF_EVENTS \
            -e CONFIG_BUILD_ARM64_DT_OVERLAY \
            -e CONFIG_OF_LIBFDT_OVERLAY \
            -d CONFIG_UNMAP_KERNEL_AT_EL0 \
            -d CONFIG_WERROR \
            -e CONFIG_LTO_NONE

          make $MAKE_ARGS olddefconfig

          # 3. Compilare efectivă
          # Folosim -fcommon pentru a evita erorile de redefinire bool/true/false
          make -j$(nproc --all) $MAKE_ARGS Image.gz dtbs KCFLAGS="-w -fcommon"

      - name: Assemble AnyKernel3
        run: |
          # Definim calea de bază a build-ului
          BUILD_OUT="kernel/out"
          BOOT_OUT="$BUILD_OUT/arch/arm64/boot"
          IMAGE="$BOOT_OUT/Image.gz"
          
          if [ ! -f "$IMAGE" ]; then 
            echo "ERROR: Kernel image not found. Build failed."
            exit 1
          fi

          git clone https://github.com/osm0sis/AnyKernel3.git AK3
          
          # Căutăm DTB-ul principal R5Q în tot folderul out
          echo "Căutăm DTB-ul principal..."
          DTB=$(find $BUILD_OUT -name "*r5q*.dtb" -type f | head -n 1)
          
          if [ -f "$DTB" ]; then
            cat "$IMAGE" "$DTB" > AK3/Image.gz
            echo "SUCCESS: Appended R5Q DTB ($DTB) to Image.gz"
          else
            cp "$IMAGE" AK3/Image.gz
            echo "WARNING: R5Q DTB not found, using raw Image.gz"
          fi

          # COLECTARE DTBO (Căutare globală în folderul out)
          echo "Colectăm fișierele DTBO pentru Samsung..."
          # Folosim o căutare mai permisivă pentru a găsi fișierele indiferent de folderul exact
          find $BUILD_OUT -name "sm8150-sec-r5q-overlay-*.dtbo" -exec cp {} AK3/ \;
          
          # Verificăm dacă s-au copiat fișiere
          COUNT=$(ls AK3/*.dtbo 2>/dev/null | wc -l)
          echo "Am găsit și copiat $COUNT fișiere DTBO."

          # Verificăm imaginea unitară dtbo.img
          DTBO_IMG=$(find $BUILD_OUT -name "dtbo.img" -type f | head -n 1)
          [ -f "$DTBO_IMG" ] && cp "$DTBO_IMG" AK3/dtbo.img

          # Patch AnyKernel3
          cd AK3
          sed -i 's/device.name1=maguro/device.name1=r5q/g' anykernel.sh
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          
          zip -r9 ../R5Q_Lumi_V32_Final.zip *

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-Lumi-V32
          path: R5Q_Lumi_V32_Final.zip
