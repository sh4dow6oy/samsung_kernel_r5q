name: Build Samsung A82xq Kernel

on:
  workflow_dispatch: # Permite pornirea manuală a compilării

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        repository: Andy2660/android_kernel_samsung_a82xq
        ref: linux-4.14.285
        fetch-depth: 1

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential bison flex libssl-dev libelf-dev xz-utils wget git gcc-aarch64-linux-gnu

    - name: Download Toolchain (Clang/GCC)
      run: |
        mkdir clang
        cd clang
        # Descărcăm un toolchain stabil (AOSP Clang este recomandat pentru kernel-uri noi)
        wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-r416183b.tar.gz
        tar -xf clang-r416183b.tar.gz
        cd ..

    - name: Build Kernel
      run: |
        # Setăm variabilele de mediu
        export PATH=$(pwd)/clang/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CC=clang
        export CLANG_TRIPLE=aarch64-linux-gnu-
        
        # Configurare și Compilare
        make O=out r5q_eur_open_defconfig
        make -j$(nproc --all) O=out \
                      ARCH=arm64 \
                      CC=clang \
                      CROSS_COMPILE=aarch64-linux-gnu- \
                      CLANG_TRIPLE=aarch64-linux-gnu-

    - name: Check for Image.gz
      run: |
        if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "Kernel compiled successfully!"
        else
            echo "Kernel build failed!"
            exit 1
        fi

    - name: Upload Kernel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-S10Lite-r5q
        path: out/arch/arm64/boot/Image.gz-dtb
