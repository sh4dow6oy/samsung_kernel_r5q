name: R5Q - Android 15 Hybrid Build (A70Q Optimized)
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pascua28 Base
        uses: actions/checkout@v4
        with:
          repository: pascua28/android_kernel_samsung_sm7150
          ref: sixteen
          path: kernel

      - name: Checkout Roynas (S10 Lite Drivers)
        uses: actions/checkout@v4
        with:
          repository: Roynas-Android-Playground/kernel_samsung_r3q
          ref: master
          path: roynas_source

      - name: Sync Drivers & Fixes
        run: |
          # 1. Transplant Audio (Roynas -> Pascua)
          rm -rf kernel/techpack/audio
          cp -r roynas_source/techpack/audio kernel/techpack/
          
          # 2. Resetăm fișierele de sistem care au dat erori
          # Folosim originalele din Pascua care sunt compatibile cu ramura 'sixteen'
          cd kernel
          git checkout drivers/gpu/drm/msm/sde/sde_crtc.c
          
          # 3. Fix chirurgical Audio (L1SS_AUDIO fix)
          sed -i '1i #define L1SS_AUDIO 0' techpack/audio/asoc/msm-pcm-q6-noirq.c
          sed -i 's/sec_pcie_l1ss_disable(L1SS_AUDIO);//g' techpack/audio/asoc/msm-pcm-q6-noirq.c
          sed -i 's/sec_pcie_l1ss_enable(L1SS_AUDIO);//g' techpack/audio/asoc/msm-pcm-q6-noirq.c

      - name: Smart Config Merge (A70Q + A71 + R5Q)
        run: |
          cd kernel
          # Baza SM8150
          cp arch/arm64/configs/vendor/sm8150_defconfig arch/arm64/configs/r5q_final_defconfig
          
          # Aplicăm fragmentele de la Pascua (A71 și A70Q)
          # A70Q aduce setările de senzori și baterie critice pentru SM7150/8150 Samsung
          cat arch/arm64/configs/a71.config >> arch/arm64/configs/r5q_final_defconfig
          cat arch/arm64/configs/a70q.config >> arch/arm64/configs/r5q_final_defconfig
          
          # Identitate S10 Lite
          echo "CONFIG_MACH_SAMSUNG_R5Q=y" >> arch/arm64/configs/r5q_final_defconfig
          echo "CONFIG_LWB=y" >> arch/arm64/configs/r5q_final_defconfig
          
          # Ajustări Android 15 și Curățenie
          ./scripts/config --file arch/arm64/configs/r5q_final_defconfig \
            --enable CONFIG_BPF \
            --enable CONFIG_BPF_SYSCALL \
            --enable CONFIG_BPF_JIT \
            --enable CONFIG_ANDROID_BINDERFS \
            --enable CONFIG_TECHPACK_AUDIO \
            --disable CONFIG_MSM_GPU_CORESIGHT \
            --disable CONFIG_SECURITY_SMACK \
            --disable CONFIG_SECURITY_SEL_FLASK_EXPORT \
            --disable CONFIG_SAMSUNG_PRODUCT_SHIP \
            --disable CONFIG_SEC_RESTRICT_FORK \
            --set-str CONFIG_LSM "lockdown,yama,loadpin,safesetid,selinux,bpf"

      - name: Setup Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev zstd zip gcc-aarch64-linux-gnu
          mkdir -p clang
          wget -q https://github.com/Ylarod/setup-ndk-clang/releases/download/prebuilt/clang-linux-x86-ndk-r29-r563880c.tar.zst
          tar -I zstd -xf clang-linux-x86-ndk-r29-r563880c.tar.zst -C clang

      - name: Build Kernel Image
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export MAKE_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=0 CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LD=ld.lld O=out"
          
          make $MAKE_ARGS r5q_final_defconfig
          yes "" | make $MAKE_ARGS olddefconfig
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-w" O=out Image.gz-dtb

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          sed -i '/flash_dtbo/d' anykernel.sh
          zip -r9 ../Kernel-R5Q-A15-A70Q-Hybrid.zip *

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Image-R5Q
          path: Kernel-R5Q-A15-A70Q-Hybrid.zip
