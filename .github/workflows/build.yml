name: Build Samsung SM8150 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        repository: LumiPlayground/android_kernel_samsung_sm8150
        ref: auriana
        path: kernel

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm libncurses-dev

    - name: Download Me2 Toolchain
      run: |
        git clone https://github.com/mk7x7/Me2.git toolchain
        # Verificăm structura reală a folderului bin
        ls -d $(pwd)/toolchain/toolchain/bin || echo "Folderul bin nu e unde credeam!"
        echo "TC_BIN=$(pwd)/toolchain/toolchain/bin" >> $GITHUB_ENV

    - name: Build Kernel
      run: |
        cd kernel
        
        # Setăm PATH-ul să includă toolchain-ul
        export PATH="${{ env.TC_BIN }}:$PATH"
        
        export ARCH=arm64
        export SUBARCH=arm64
        
        # Definim prefixele
        # Verifică dacă în folderul bin fișierele încep cu aarch64-linux-android-
        CC_PREFIX="aarch64-linux-android-"
        
        export KERNEL_MAKE_ENV="DTC_EXT=$(pwd)/scripts/dtc/dtc \
                                CONFIG_BUILD_ARM64_DT_OVERLAY=y \
                                CC=clang \
                                CLANG_TRIPLE=aarch64-linux-gnu- \
                                CROSS_COMPILE=${{ env.TC_BIN }}/$CC_PREFIX \
                                CROSS_COMPILE_ARM32=${{ env.TC_BIN }}/arm-linux-androideabi- \
                                LD=ld.lld \
                                AR=llvm-ar \
                                NM=llvm-nm \
                                OBJCOPY=llvm-objcopy \
                                OBJDUMP=llvm-objdump \
                                STRIP=llvm-strip"

        # 1. Config
        make O=out $KERNEL_MAKE_ENV sm8150_sec_defconfig
        
        # Aplicăm fragmentul Samsung r5q (S10 Lite)
        # Folosim -n pentru a ignora erorile de verificare a valorilor cerute (cele din log-ul tău)
        scripts/kconfig/merge_config.sh -O out -n out/.config arch/arm64/configs/sm8150_sec_r5q_eur_open.config
        
        make O=out $KERNEL_MAKE_ENV olddefconfig
        
        # 2. Build
        make -j$(nproc --all) O=out $KERNEL_MAKE_ENV
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-SM8150-r5q
        path: |
          kernel/out/arch/arm64/boot/Image.gz-dtb
          kernel/out/arch/arm64/boot/dtbo.img
          kernel/out/.config
