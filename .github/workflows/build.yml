name: R5Q LumiBPF - V31 Final JIT-DTBO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Lumi Kernel
        uses: actions/checkout@v4
        with:
          repository: LumiPlayground/android_kernel_samsung_sm8150
          ref: rawr-bpf
          path: kernel

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev \
          ccache python3 python-is-python3 libarchive-tools wget zstd libtinfo6 zip \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi device-tree-compiler rsync git

      - name: Setup Toolchain (Neutron Clang)
        run: |
          mkdir -p clang
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang

      - name: Build Kernel & DTBO
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          
          # Argumente de compilare standard
          MAKE_ARGS="ARCH=arm64 \
                     LLVM=1 \
                     LLVM_IAS=1 \
                     CC=clang \
                     LD=ld.lld \
                     CROSS_COMPILE=aarch64-linux-gnu- \
                     CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
                     O=out"

          # 1. Aplicăm defconfig-ul nativ r5q
          make $MAKE_ARGS r5q_eur_open_defconfig

          # 2. HARD-ENFORCE eBPF JIT & PROJECT FLAGS
          # Folosim flag-ul CONFIG_SEC_R5Q_PROJECT pentru a activa Makefile-ul de DTBO 
          ./scripts/config --file out/.config \
            -e CONFIG_SEC_R5Q_PROJECT \
            -e CONFIG_BPF \
            -e CONFIG_BPF_SYSCALL \
            -e CONFIG_BPF_JIT \
            -e CONFIG_BPF_JIT_ALWAYS_ON \
            -e CONFIG_HAVE_EBPF_JIT \
            -e CONFIG_NET_CLS_BPF \
            -e CONFIG_NET_ACT_BPF \
            -e CONFIG_CGROUP_BPF \
            -e CONFIG_BPF_EVENTS \
            -e CONFIG_BUILD_ARM64_DT_OVERLAY \
            -e CONFIG_OF_LIBFDT_OVERLAY \
            -d CONFIG_UNMAP_KERNEL_AT_EL0 \
            -d CONFIG_WERROR \
            -e CONFIG_LTO_NONE

          make $MAKE_ARGS olddefconfig

          # 3. Compilare efectivă
          # Folosim -fcommon pentru a evita erorile de redefinire bool/true/false
          make -j$(nproc --all) $MAKE_ARGS Image.gz dtbs KCFLAGS="-w -fcommon"

      - name: Package with AnyKernel3
        run: |
          # Identificăm fișierele generate
          IMAGE="$GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz-dtb"
          if [ ! -f "$IMAGE" ]; then
            IMAGE="$GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz"
          fi
          DTBO="$GITHUB_WORKSPACE/out/arch/arm64/boot/dtbo.img"
          # Clonăm AnyKernel3 pentru ambalare
          git clone https://github.com/osm0sis/AnyKernel3.git
          rm -rf AnyKernel3/.git
          
          # Copiem kernelul și DTBO în folderul AnyKernel
          cp $IMAGE AnyKernel3/Image.gz
          [ -f "$DTBO" ] && cp $DTBO AnyKernel3/dtbo.img
          # Configurăm anykernel.sh pentru S10 Lite (r5q)
          sed -i 's/device.name1=maguro/device.name1=r5q/g' AnyKernel3/anykernel.sh
          sed -i 's/device.name2=toroplus/device.name2=SM-G770F/g' AnyKernel3/anykernel.sh
          sed -i 's/device.name3=toro/device.name3=r5q/g' AnyKernel3/anykernel.sh
          
          # Creăm arhiva ZIP finală
          cd AnyKernel3
          zip -r9 ../Kernel-S10Lite-R5Q-Neutron.zip *
      - name: Upload Flashable Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-S10Lite-R5Q
          path: Kernel-S10Lite-R5Q-Neutron.zip
