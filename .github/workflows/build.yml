name: Build Samsung Kernel r5q (Proton Clang)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev dwarves \
            libncurses-dev git wget unzip make python3 \
            python3-minimal lz4 xz-utils

      - name: Download Proton Clang
        run: |
          mkdir -p toolchain
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang

      - name: Disable gcc-wrapper
        run: |
          # Samsung forțează adesea utilizarea GCC prin acest script; îl redenumim pentru a-l ignora
          [ -f scripts/gcc-wrapper.py ] && mv scripts/gcc-wrapper.py scripts/gcc-wrapper.py.disabled || true

      - name: Build Kernel
        run: |
          # Setări variabile de mediu
          export PATH=$(pwd)/toolchain/proton-clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export HEADER_ARCH=arm64
          
          # Parametrii pentru compilare
          MAKE_ARGS="
            O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1
          "
          
          # 1. Creare director out
          mkdir -p out
          
          # 2. Generare defconfig
          make $MAKE_ARGS r5q_eur_open_defconfig
          
          # 3. Compilare (folosim toți nucleii disponibili)
          make -j$(nproc --all) $MAKE_ARGS

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: Image-r5q
          path: out/arch/arm64/boot/Image

      - name: Upload DTBs & Modules
        uses: actions/upload-artifact@v4
        with:
          name: dtbs-and-modules
          path: |
            out/arch/arm64/boot/dts/vendor/*.dtb
            out/vmlinux
