name: Build Prime Kernel R5Q (BPF Fixed)

on:
  workflow_dispatch:
    inputs:
      release:
          description: 'Upload release'
          type: boolean
          required: true
          default: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_ts: ${{ steps.ts.outputs.release_ts }}
    steps:
      - name: Generate release date
        id: ts
        run: echo "release_ts=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

  build:
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      # MODIFICARE: Descarcă sursa de pe branch-ul specific rawr-bpf
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: LumiPlayground/android_kernel_samsung_sm8150
          ref: rawr-bpf
          fetch-depth: 1

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git curl unzip wget zip zstd \
            bc bison flex libssl-dev libelf-dev python3 python-is-python3 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Download Proton Clang
        run: |
          mkdir clang-stable
          wget https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.tar.gz -O clang.tar.gz
          tar -xf clang.tar.gz -C clang-stable --strip-components=1
          chmod -R +x clang-stable/bin/

      - name: Build kernel
        run: |
          CLANG_DIR="$(pwd)/clang-stable"
          
          # Fix Samsung scripts
          mkdir -p out
          echo "#!/bin/bash" > secgetspf
          echo "exit 0" >> secgetspf
          chmod +x secgetspf
          cp secgetspf out/
          export PATH="$(pwd):$PATH"

          # Fix asm-goto
          echo "exit 0" > scripts/gcc-goto.sh
          chmod +x scripts/gcc-goto.sh

          # Parametrii de build
          # Observație: Pe ramura rawr-bpf, s-ar putea să nu mai avem nevoie de -Wno- flags,
          # dar le păstrăm pentru siguranță.
          MAKE_ARGS="ARCH=arm64 \
            O=out \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            CC=${CLANG_DIR}/bin/clang \
            LD=${CLANG_DIR}/bin/ld.lld \
            AR=${CLANG_DIR}/bin/llvm-ar \
            NM=${CLANG_DIR}/bin/llvm-nm \
            OBJCOPY=${CLANG_DIR}/bin/llvm-objcopy \
            OBJDUMP=${CLANG_DIR}/bin/llvm-objdump \
            STRIP=${CLANG_DIR}/bin/llvm-strip \
            OBJSIZE=${CLANG_DIR}/bin/llvm-size \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            DTC_EXT=$(pwd)/scripts/dtc \
            KCFLAGS='-Wno-implicit-function-declaration -Wno-incompatible-pointer-types -fno-stack-protector' \
            KCPPFLAGS='-Wno-unknown-warning-option'"

          # Generare config pentru R5Q (S10 Lite / SM8150)
          make $MAKE_ARGS r5q_eur_open_defconfig

          # Patch .config
          sed -i 's/CONFIG_SEC_DEBUG=y/CONFIG_SEC_DEBUG=n/g' out/.config || true
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/CONFIG_CC_STACKPROTECTOR_NONE=y/g' out/.config || true
          echo "CONFIG_CC_HAVE_ASM_GOTO=y" >> out/.config

          # Compilare
          make $MAKE_ARGS olddefconfig
          make $MAKE_ARGS -j$(nproc --all) Image.gz-dtb

          # Rezultat
          if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
            echo "Kernel built successfully!"
          else
            echo "Build failed!"
            exit 1
          fi

      - name: Upload Image.gz-dtb
        uses: actions/upload-artifact@v4
        with:
          name: PrimeKernel-R5Q-BPF-${{ needs.prepare.outputs.release_ts }}
          path: out/arch/arm64/boot/Image.gz-dtb
