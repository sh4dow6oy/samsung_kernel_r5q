name: R5Q - Android 15 Pure Build
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pascua28 Base
        uses: actions/checkout@v4
        with:
          repository: pascua28/android_kernel_samsung_sm7150
          ref: sixteen
          path: kernel

      - name: Smart Config Setup
        run: |
          cd kernel
          # 1. Luăm defconfig-ul de bază pe care mi l-ai arătat
          cp arch/arm64/configs/defconfig arch/arm64/configs/r5q_pure_defconfig
          
          # 2. Aplicăm fragmentele pentru A71 și A70Q (A70Q e cheia pentru R5Q)
          echo "" >> arch/arm64/configs/r5q_pure_defconfig
          cat arch/arm64/configs/a71.config >> arch/arm64/configs/r5q_pure_defconfig
          cat arch/arm64/configs/a70q.config >> arch/arm64/configs/r5q_pure_defconfig
          
          # 3. Activăm manual suportul pentru hardware-ul S10 Lite (R5Q)
          # Aceste flag-uri spun kernelului să folosească driverele deja existente în sursă
          ./scripts/config --file arch/arm64/configs/r5q_pure_defconfig \
            --enable CONFIG_MACH_SAMSUNG_R5Q \
            --enable CONFIG_LWB \
            --enable CONFIG_SEC_ABC \
            --enable CONFIG_SAMSUNG_TUI \
            --enable CONFIG_BPF \
            --enable CONFIG_BPF_SYSCALL \
            --enable CONFIG_ANDROID_BINDERFS \
            --disable CONFIG_KVM \
            --disable CONFIG_VIRTUALIZATION \
            --disable CONFIG_MSM_GPU_CORESIGHT

      - name: Code Fixes (Rezolvăm doar erorile bazei)
        run: |
          cd kernel
          # Fix KVM/Sched error (pids)
          sed -i 's/current->pids\[PIDTYPE_PID\].pid/current->pid/g' virt/kvm/kvm_main.c 2>/dev/null || true
          # Fix Hugetlb Typo (ptep vs pte)
          sed -i 's/ptep = huge_pmd_share/pte = huge_pmd_share/g' arch/arm64/mm/hugetlbpage.c

      - name: Build Kernel
        run: |
          # Instalăm dependențele necesare
          sudo apt-get update && sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev zstd zip gcc-aarch64-linux-gnu

          mkdir -p clang
          wget -q https://github.com/Ylarod/setup-ndk-clang/releases/download/prebuilt/clang-linux-x86-ndk-r29-r563880c.tar.zst
          tar -I zstd -xf clang-linux-x86-ndk-r29-r563880c.tar.zst -C clang
          
          cd kernel
          # Setăm calea către toolchain
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          
          # Definim argumentele de build. 
          # CRUCIAL: LLVM_IAS=1 activează Integrated Assembler-ul Clang, evitând eroarea cu /usr/bin/as
          export MAKE_ARGS="ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            O=out"
          
          # 1. Generăm .config-ul
          make $MAKE_ARGS r5q_pure_defconfig
          
          # 2. Curățăm orice conflict în config (opțional dar recomandat)
          make $MAKE_ARGS olddefconfig
          
          # 3. Compilăm
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-w" O=out Image.gz-dtb

      - name: Package
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          zip -r9 ../Lumi-Kernel-Pure-A15.zip *
