name: Build R5Q - Hybrid AOSP Configuration
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: pascua28/android_kernel_samsung_sm7150
          ref: sixteen
          path: kernel
          fetch-depth: 1

      - name: Setup Toolchain (Neutron Clang)
        run: |
          sudo apt-get update && sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev zstd zip gcc-aarch64-linux-gnu
          mkdir clang
          wget -q https://github.com/Ylarod/setup-ndk-clang/releases/download/prebuilt/clang-linux-x86-ndk-r29-r563880c.tar.zst
          tar -I zstd -xf clang-linux-x86-ndk-r29-r563880c.tar.zst -C clang

      - name: Generate Hybrid Config
        run: |
          cd kernel
          # Folosim config-ul de baza R5Q de la Roynas
          cp arch/arm64/configs/vendor/sm8150-perf_defconfig out_config
          
          # Aplicam "Tratamentul Ata-kaner" (Curatare Samsung)
          cat <<EOF >> out_config
          # --- AOSP / LINEAGE OPTIMIZATIONS ---
          CONFIG_SEC_DEBUG=n
          CONFIG_SEC_LOG=n
          CONFIG_SECURITY_DEFEX=n
          CONFIG_SECURITY_SMACK=n
          CONFIG_KNOX_KAP=n
          CONFIG_FIVE=n
          CONFIG_SEC_RESTRICT_SETUID=n
          CONFIG_DEBUG_RODATA_TEST=n
          # --- DISPLAY & GPU ---
          CONFIG_DRM_SDE_R3Q=y
          CONFIG_DRM_MSM_REGISTER_LOGGING=n
          # --- ANDROID 14/15 CORE ---
          CONFIG_SCHED_WALT=y
          CONFIG_COMMON_CLK_QCOM=y
          CONFIG_QCOM_COMMAND_DB=y
          CONFIG_RPMSG_QCOM_GLINK_SMEM=y
          EOF
          
          mv out_config arch/arm64/configs/r5q_aosp_hybrid_defconfig

      - name: Build with Hybrid Config
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export MAKE_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld AR=llvm-ar CROSS_COMPILE=aarch64-linux-gnu- O=out"
          
          # 1. IMPORT R3Q DISPLAY (Ca in pasii anteriori)
          rm -rf drivers/gpu/drm/msm/sde drivers/gpu/drm/msm/samsung
          git clone https://github.com/Roynas-Android-Playground/kernel_samsung_r3q -b master ../r3q_source
          cp -r ../r3q_source/drivers/gpu/drm/msm/sde drivers/gpu/drm/msm/
          cp -r ../r3q_source/drivers/gpu/drm/msm/samsung drivers/gpu/drm/msm/

          # 2. FIX HEADERS & STUBS (Esential pentru succes)
          cat <<EOF > drivers/gpu/drm/msm/samsung_fix.h
          #ifndef __SAMSUNG_FIX_H__
          #define __SAMSUNG_FIX_H__
          #define SS_DSI_CMD_SET_MAX 60
          #define SUPPORT_PANEL_REVISION 20
          #define CD_MAP_TABLE_MAX 15
          #define RX_CMD_START 0
          #define RX_CMD_END 150
          #define RX_SELF_DISP_DEBUG 1
          #define RX_SELF_MASK_CHECK 2
          static const bool is_aosp = true;
          #endif
          EOF
          echo "ccflags-y += -include drivers/gpu/drm/msm/samsung_fix.h -Idrivers/gpu/drm/msm/samsung" >> drivers/gpu/drm/msm/Makefile

          # 3. COMPILE
          make $MAKE_ARGS r5q_aosp_hybrid_defconfig
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-fcommon -w" O=out Image.gz

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-R5Q-AOSP-Hybrid
          path: kernel/out/arch/arm64/boot/Image.gz
