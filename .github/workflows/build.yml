name: Build Lumi R5Q - Final Fix
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel (Roynas 4.14)
        uses: actions/checkout@v4
        with:
          repository: Roynas-Android-Playground/kernel_samsung_r3q
          ref: master
          path: kernel
          fetch-depth: 1

      - name: Clone Erstrom ath Tree (v5.2)
        run: |
          git clone https://github.com/erstrom/linux-ath.git ath-tree
          cd ath-tree
          git checkout v5.2-ath10k-sdio-v2 || git checkout v5.2-ath10k-sdio

      - name: Replace ath10k Driver & Fix KernelSU
        run: |
          # 1. Înlocuim folderul ath10k cu cel nou (Backport 5.2)
          rm -rf kernel/drivers/net/wireless/ath/ath10k
          cp -r ath-tree/drivers/net/wireless/ath/ath10k kernel/drivers/net/wireless/ath/
          
          cd kernel
          # 2. FIX EROARE Kconfig: Eliminăm referința la KernelSU care oprea build-ul
          sed -i '/kernelsu/d' drivers/android/Kconfig
          
          # 3. FIX Taskstats (eroarea de #elif)
          sed -i 's/#elif defined(CONFIG_POSIX_MQUEUE)/#else\n#if defined(CONFIG_POSIX_MQUEUE)/' kernel/taskstats.c || true
          echo "#endif" >> kernel/taskstats.c

      - name: Configure & BPF Inject
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          CONF="arch/arm64/configs/r5q_defconfig"
          
          # Injectăm suportul BPF pentru Android 12+
          {
            echo "CONFIG_BPF=y"
            echo "CONFIG_BPF_SYSCALL=y"
            echo "CONFIG_NETFILTER_XT_MATCH_BPF=y"
            echo "CONFIG_CGROUP_BPF=y"
            echo "CONFIG_BPF_JIT=y"
            echo "CONFIG_DTC_WERROR=n"
          } >> $CONF

      - name: Setup NDK Clang (r29)
        run: |
          mkdir -p clang
          wget -q https://github.com/Ylarod/setup-ndk-clang/releases/download/prebuilt/clang-linux-x86-ndk-r29-r563880c.tar.zst
          tar -I zstd -xf clang-linux-x86-ndk-r29-r563880c.tar.zst -C clang

      - name: Build Kernel
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export MAKE_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=0 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD=ld.lld \
            O=out"
          
          # Creăm config-ul r5q
          make $MAKE_ARGS r5q_defconfig
          
          # Compilăm Kernelul
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-Wno-error -w" O=out Image.gz-dtb

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          if [ -f kernel/out/arch/arm64/boot/Image.gz-dtb ]; then
            cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          else
            echo "EROARE: Imaginea kernelului nu a fost găsită!" && exit 1
          fi
          
          cd AnyKernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          sed -i 's|block=auto;|block=/dev/block/by-name/boot;|g' anykernel.sh
          zip -r9 ../Lumi-R5Q-Final-Fixed.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lumi-Kernel-R5Q
          path: Lumi-R5Q-Final-Fixed.zip
