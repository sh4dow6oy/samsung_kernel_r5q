name: R5Q - Lineage Base + Mainey Drivers & Config
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LineageOS Base
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_google_msm-4.14
          path: kernel

      - name: Checkout Mainey Source
        uses: actions/checkout@v4
        with:
          repository: mainey/android_kernel_samsung_r5q
          ref: lineage-19.0
          path: mainey_source

      - name: Surgical Injection & Sched Repair
        run: |
          # 1. Restaurăm folderul sched original
          cd kernel && git checkout HEAD -- kernel/sched/ && cd ..

          # 2. Injectăm driverele, techpack și INCLUDE de la Mainey
          rm -rf kernel/drivers kernel/techpack kernel/include
          cp -r mainey_source/drivers kernel/
          cp -r mainey_source/techpack kernel/
          cp -r mainey_source/include kernel/
          
          # 3. FIX TYPE-C (Eroarea de sizeof)
          sed -i 's/DEVID(typec_device_id);/\/\/DEVID(typec_device_id);/g' kernel/scripts/mod/devicetable-offsets.c
          sed -i 's/DEVID_FIELD(typec_device_id, svid);/\/\/DEVID_FIELD(typec_device_id, svid);/g' kernel/scripts/mod/devicetable-offsets.c
          sed -i 's/DEVID_FIELD(typec_device_id, mode);/\/\/DEVID_FIELD(typec_device_id, mode);/g' kernel/scripts/mod/devicetable-offsets.c

          # 4. FIX KERNELSU & SCHED
          sed -i '/kernelsu/d' kernel/drivers/android/Kconfig
          sed -i 's/unsigned long capacity_margin_freq/unsigned int capacity_margin_freq/g' kernel/kernel/sched/core.c 2>/dev/null || true

          # 5. Config Mainey
          cp mainey_source/arch/arm64/configs/r5q_eur_open_defconfig kernel/arch/arm64/configs/r5q_hybrid_defconfig

      - name: Setup Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev zstd zip gcc-aarch64-linux-gnu
          mkdir -p clang
          wget -q https://github.com/Ylarod/setup-ndk-clang/releases/download/prebuilt/clang-linux-x86-ndk-r29-r563880c.tar.zst
          tar -I zstd -xf clang-linux-x86-ndk-r29-r563880c.tar.zst -C clang
          wget -q https://raw.githubusercontent.com/LumiPlayground/android_kernel_samsung_sm8150/rawr-bpf/tools/mkdtimg -O mkdtimg
          chmod +x mkdtimg

      - name: Build Kernel
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export MAKE_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=0 CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LD=ld.lld O=out"
          
          # 1. Aplicăm defconfig-ul lui Mainey
          make $MAKE_ARGS r5q_hybrid_defconfig
          
          # 2. ADAPTĂRI PENTRU LINEAGE 4.14 (OneUI 7 / Android 15 Ready)
          # Dezactivăm securitățile Samsung care fac conflict cu Lineage
          scripts/config --file out/.config --disable CONFIG_SAMSUNG_PRODUCT_SHIP
          scripts/config --file out/.config --disable CONFIG_SEC_RESTRICT_FORK
          scripts/config --file out/.config --disable CONFIG_KNOX_KAP
          scripts/config --file out/.config --disable CONFIG_SECURITY_DEFEX
          
          # Activăm suportul de storage modern (OneUI 7 folosește EROFS adesea)
          scripts/config --file out/.config --enable CONFIG_EROFS_FS
          scripts/config --file out/.config --enable CONFIG_EROFS_FS_ZIP
          
          # 3. Rezolvăm conflictele de tip "New Config Options"
          yes "" | make $MAKE_ARGS olddefconfig
          
          # 4. Compilare cu ignorare warning-uri (KCFLAGS="-w")
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-w" O=out Image.gz-dtb dtbs

      - name: Generate DTBO Image
        run: |
          DTBO_FILES=$(find kernel/out/arch/arm64/boot/dts -name "*.dtbo")
          if [ -n "$DTBO_FILES" ]; then
            ./mkdtimg create dtbo.img $DTBO_FILES
            echo "✅ dtbo.img creat."
          else
            echo "❌ Eroare: Nu s-au găsit fișiere DTBO."
            exit 1
          fi

      - name: AnyKernel3 Packaging
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cp dtbo.img AnyKernel3/
          
          cd AnyKernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          # Mapare specifică R5Q (S10 Lite)
          sed -i '/device.name1=r5q/a dtbo_block=/dev/block/by-name/dtbo;' anykernel.sh
          echo 'flash_dtbo;' >> anykernel.sh
          zip -r9 ../Lumi-Mainey-Hybrid.zip *

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-R5Q-Hybrid
          path: Lumi-Mainey-Hybrid.zip
