name: Build S10 Lite (r5q) Kernel - Neutron Clang

on:
  workflow_dispatch: # Permite pornirea manuală din interfața GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Base (pascua28)
        uses: actions/checkout@v4
        with:
          repository: pascua28/android_kernel_samsung_sm7150
          ref: sixteen
          path: kernel

      - name: Checkout S10 Lite DTS (Roynas Source)
        uses: actions/checkout@v4
        with:
          repository: Roynas-Android-Playground/kernel_samsung_r3q
          ref: master
          path: roynas_source
          sparse-checkout: |
            arch/arm64/boot/dts/samsung/renovation

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential bison flex libssl-dev libelf-dev clang lld llvm
          mkdir -p bin

      - name: Install Neutron Clang
        run: |
          curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
          chmod +x antman
          ./antman -S
          echo "$GITHUB_WORKSPACE/neutron-clang/bin" >> $GITHUB_PATH

      - name: Patch Kernel and Inject r5q Specifics
        run: |
          cd kernel
          # 1. Creăm config-ul r5q din baza A71
          cp arch/arm64/configs/a71.config arch/arm64/configs/r5q.config
          
          # 2. Injectăm configurația hardware S10 Lite (văzută în r5q_defconfig)
          cat <<EOF >> arch/arm64/configs/r5q.config
          # S10 Lite Hardware Specifics
          CONFIG_MACH_SAMSUNG_R5Q=y
          CONFIG_PANEL_S6E3HA8=y
          CONFIG_TOUCHSCREEN_ST_STSA354=y
          CONFIG_TOUCHSCREEN_SEC_TS=y
          CONFIG_FUELGAUGE_MAX17055=y
          CONFIG_CHARGER_MAX77705=y
          CONFIG_BATTERY_SAMSUNG_V2=y
          CONFIG_SND_SOC_WCD937X=y
          CONFIG_SND_SOC_SAMSUNG_AUDIO=y
          CONFIG_SEC_ABC=n
          CONFIG_SEC_DEBUG=y
          EOF
          
          # Dezactivăm identitatea de A71
          sed -i 's/CONFIG_MACH_SAMSUNG_A71=y/# CONFIG_MACH_SAMSUNG_A71 is not set/g' arch/arm64/configs/r5q.config

          # 3. Injectăm fișierele DTS/DTBO de S10 Lite
          mkdir -p arch/arm64/boot/dts/samsung/renovation
          cp -r ../roynas_source/arch/arm64/boot/dts/samsung/renovation/* arch/arm64/boot/dts/samsung/renovation/
          
          # 4. Adăugăm Overlay-ul în Makefile-ul Samsung
          echo 'dtbo-$(CONFIG_ARCH_SM7150) += renovation/sm8150-sec-r5q-overlay-r00.dtbo' >> arch/arm64/boot/dts/samsung/Makefile

      - name: Build Kernel
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/neutron-clang/bin:$PATH"
          
          # Inițializăm config-ul
          make O=out ARCH=arm64 r5q.config
          
          # Compilăm (Dezactivăm LTO pentru prima rulare ca să evităm erori de linkuire)
          make -j$(nproc --all) O=out \
               ARCH=arm64 \
               CC=clang \
               CLANG_TRIPLE=aarch64-linux-gnu- \
               CROSS_COMPILE=aarch64-linux-gnu- \
               CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
               LD=ld.lld \
               AR=llvm-ar \
               NM=llvm-nm \
               OBJCOPY=llvm-objcopy \
               OBJDUMP=llvm-objdump \
               STRIP=llvm-strip \
               CONFIG_LTO_CLANG_NONE=y

      - name: Prepare AnyKernel3 (Create Zip)
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          # Copiem și DTBO-ul generat pentru S10 Lite
          cp kernel/out/arch/arm64/boot/dts/samsung/renovation/sm8150-sec-r5q-overlay-r00.dtbo AnyKernel3/dtbo.img
          cd AnyKernel3
          # Configurare rapidă AnyKernel3
          sed -i 's/device.name1=maguro/device.name1=r5q/g' anykernel.sh
          sed -i 's/device.name2=toro/device.name2=r5q/g' anykernel.sh
          zip -r ../S10Lite-Kernel-Neutron.zip *

      - name: Upload Flashable Kernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-Kernel-Flashable
          path: S10Lite-Kernel-Neutron.zip
