name: Build Samsung SM8150 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        repository: LumiPlayground/android_kernel_samsung_sm8150
        ref: auriana
        path: kernel

    - name: Install Build Dependencies & Legacy Libs
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm libncurses-dev wget
        wget http://security.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2ubuntu0.1_amd64.deb
        wget http://security.ubuntu.com/ubuntu/pool/universe/n/ncurses/libncurses5_6.3-2ubuntu0.1_amd64.deb
        sudo apt install -y ./libtinfo5_6.3-2ubuntu0.1_amd64.deb ./libncurses5_6.3-2ubuntu0.1_amd64.deb

    - name: Download Me2 Toolchain
      run: |
        git clone https://github.com/mk7x7/Me2.git toolchain
        echo "GCC_64_BIN=$(pwd)/toolchain/toolchain/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin" >> $GITHUB_ENV
        echo "LLVM_BIN=$(pwd)/toolchain/toolchain/llvm-arm-toolchain-ship/10.0/bin" >> $GITHUB_ENV

    - name: Build Kernel
      run: |
        cd kernel
        
        # Setup PATH
        export PATH="${{ env.LLVM_BIN }}:${{ env.GCC_64_BIN }}:$PATH"
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=${{ env.GCC_64_BIN }}/aarch64-linux-android-
        export CROSS_COMPILE_ARM32=${{ env.GCC_64_BIN }}/arm-linux-androideabi-
        export CC=clang
        export HOSTCC=clang
        export CLANG_TRIPLE=aarch64-linux-gnu-
        
        # --- FIX: ELIMINARE FLAG-URI MODERNE ---
        # Dezactivăm warnings-as-errors și scoatem flag-urile pe care Clang 10 nu le știe
        sed -i 's/-Werror//g' Makefile
        sed -i 's/-Wno-enum-compare-conditional//g' Makefile
        sed -i 's/-Wno-enum-enum-conversion//g' Makefile
        sed -i 's/-ftrivial-auto-var-init=zero//g' Makefile

        # Variabile pentru compilare
        MAKE_ARGS="O=out \
                   DTC_EXT=$(pwd)/scripts/dtc/dtc \
                   CONFIG_BUILD_ARM64_DT_OVERLAY=y \
                   CONFIG_WLAN_VARIANT=samsung \
                   LD=ld.lld \
                   AR=llvm-ar \
                   NM=llvm-nm \
                   OBJCOPY=llvm-objcopy \
                   OBJDUMP=llvm-objdump \
                   STRIP=llvm-strip"

        # 1. Configurare
        cat arch/arm64/configs/sm8150_sec_defconfig arch/arm64/configs/sm8150_sec_r5q_eur_open.config > arch/arm64/configs/combined_defconfig
        
        echo "CONFIG_CC_STACKPROTECTOR_NONE=y" >> arch/arm64/configs/combined_defconfig
        echo "# CONFIG_CC_STACKPROTECTOR_STRONG is not set" >> arch/arm64/configs/combined_defconfig
        echo "# CONFIG_INIT_STACK_ALL_ZERO is not set" >> arch/arm64/configs/combined_defconfig

        make $MAKE_ARGS combined_defconfig
        make $MAKE_ARGS olddefconfig

        # 2. Compilare
        # Adăugăm flag-uri globale de ignorare a erorilor de warning pentru a fi siguri
        make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-w -Wno-error -Wno-unknown-warning-option" HOSTCFLAGS="-w"
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-SM8150-r5q
        path: |
          kernel/out/arch/arm64/boot/Image.gz-dtb
          kernel/out/arch/arm64/boot/dtbo.img
          kernel/out/.config
