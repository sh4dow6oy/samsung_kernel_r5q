name: Build Prime Kernel R5Q

on:
  workflow_dispatch:
    inputs:
      release:
          description: 'Upload release'
          type: boolean
          required: true
          default: false
      changelog:
          description: 'Changelog'
          type: string
          required: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_ts: ${{ steps.ts.outputs.release_ts }}
    steps:
      - name: Generate release date
        id: ts
        run: echo "release_ts=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

  build:
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git curl unzip wget zip zstd \
            bc bison flex libssl-dev libelf-dev python3 python-is-python3

      - name: Download Google clang (NDK r29)
        run: |
          wget -O llvm.tar.zst https://github.com/Ylarod/setup-ndk-clang/releases/download/prebuilt/clang-linux-x86-ndk-r29-r563880c.tar.zst
          mkdir llvm-21; cd llvm-21
          tar -I unzstd -xf ../llvm.tar.zst
          rm ../llvm.tar.zst
          cd ..

      - name: Build kernel
        run: |
          # 1. Setup Toolchain Path
          export PATH="$(pwd)/llvm-21/bin:$PATH"
          export CLANG_TRIPLE=aarch64-linux-gnu-

          # 2. NUCLEAR CLEAN & SEGFAULT FIX
          # Dezactivăm scriptul care cauzează Segmentation Fault
          echo "exit 0" > scripts/gcc-goto.sh
          
          # Curățăm flag-urile problematice
          grep -rl "implicit-function-declaration" . | xargs sed -i 's/-Werror=implicit-function-declaration//g' || true
          grep -rl "unknown-warning-option" . | xargs sed -i 's/-Wno-unknown-warning-option//g' || true
          
          # Eliminăm Werror global
          find . -name Makefile -exec sed -i 's/-Werror//g' {} +
          find scripts -name Makefile* -exec sed -i 's/-Werror//g' {} +

          # 3. Hard-Patch pentru bypass Stack Protector
          sed -i 's/$(error Cannot use CONFIG_CC_STACKPROTECTOR_STRONG.*/$(warning Bypassed)/g' Makefile
          
          # 4. Fix 'secgetspf'
          echo "#!/bin/bash" > secgetspf
          echo "exit 0" >> secgetspf
          chmod +x secgetspf
          export PATH="$PATH:$(pwd)"

          # 5. Configurare mediu
          # Adăugăm shell=/bin/bash pentru a stabiliza execuția scripturilor
          export KERNEL_MAKE_ENV="DTC_EXT=$(pwd)/scripts/dtc CONFIG_BUILD_ARM64_DT_OVERLAY=y CONFIG_CC_STACKPROTECTOR_NONE=y SHELL=/bin/bash"
          
          MAKE_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang AS=clang LD=ld.lld \
          CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- O=out"

          # 6. Generare Config
          make $MAKE_ARGS $KERNEL_MAKE_ENV r5q_eur_open_defconfig

          # 7. Patch .config pentru a preveni crash-ul la compilare
          ./scripts/config --file out/.config \
            -e CONFIG_CC_HAVE_ASM_GOTO \
            -d CONFIG_SEC_DEBUG \
            -d CONFIG_CC_STACKPROTECTOR_STRONG \
            -e CONFIG_CC_STACKPROTECTOR_NONE \
            -d CONFIG_SAMSUNG_PRODUCT_SHIP

          # 8. Compilare finală
          make $MAKE_ARGS $KERNEL_MAKE_ENV olddefconfig
          make $MAKE_ARGS $KERNEL_MAKE_ENV -j$(nproc --all) Image.gz-dtb

          if [ -d "AnyKernel3" ]; then
            cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrimeKernel-R5Q-${{ needs.prepare.outputs.release_ts }}
          path: AnyKernel3/

  release:
    needs: [prepare, build]
    if: github.event.inputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
      - name: Zip and Release
        run: |
          cd artifacts
          for dir in PrimeKernel-*; do
            if [ -d "$dir" ]; then
              (cd "$dir" && zip -r "../${dir}.zip" .)
            fi
          done
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ needs.prepare.outputs.release_ts }}"
          name: "PrimeKernel-R5Q-${{ needs.prepare.outputs.release_ts }}"
          body: "${{ github.event.inputs.changelog }}"
          files: artifacts/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
