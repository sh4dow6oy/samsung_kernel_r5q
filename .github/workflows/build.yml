name: Build Roynas R5Q 4.14.334
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: Roynas-Android-Playground/kernel_samsung_r3q
          ref: master
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev \
          ccache python3 python-is-python3 libarchive-tools wget gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi libtinfo5 # Adăugat libtinfo5 pentru Clang

      - name: Setup Proton Clang
        run: |
          git clone https://github.com/kdrag0n/proton-clang.git --depth=1 proton-clang

      - name: Build Kernel
        run: |
          # 1. Pregătire mediu și fix Kconfig
          P_PATH=$GITHUB_WORKSPACE/proton-clang/bin
          export PATH="$P_PATH:$PATH" # Adăugăm Clang în PATH-ul global al shell-ului
          
          sed -i '/kernelsu/d' drivers/android/Kconfig

          # 2. Definire argumente
          # Am adăugat LLVM=1 și LLVM_IAS=1 pentru a forța folosirea toolchain-ului integrat
          MAKE_ARGS="ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            LD=ld.lld \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            HOSTLDFLAGS=-fuse-ld=bfd \
            O=out"

          # 3. Configurare
          make $MAKE_ARGS r5q_defconfig

          # 4. Patching .config (Android 15 + Fix Stack Protector)
          ./scripts/config --file out/.config \
            -d CONFIG_KNOX_KAP \
            -d CONFIG_SECURITY_SAMSUNG_KNOX \
            -d CONFIG_RKP_KDP \
            -d CONFIG_SAMSUNG_PRODUCT_SHIP \
            -d CONFIG_SECURITY_DEFEX \
            -d CONFIG_CC_STACKPROTECTOR_STRONG \
            -e CONFIG_CC_STACKPROTECTOR_NONE \
            -e CONFIG_BPF -e CONFIG_BPF_SYSCALL -e CONFIG_BPF_JIT \
            -e CONFIG_CGROUP_BPF -e CONFIG_NET_CLS_BPF -e CONFIG_NET_ACT_BPF

          make $MAKE_ARGS olddefconfig

          # 5. Compilare
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-Wno-error -fcommon"

      - name: Upload Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-Roynas-R5Q-A15
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/dtbo.img
