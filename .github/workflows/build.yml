name: Build ONLY DTBO - Ultra Fast

on:
  workflow_dispatch:

jobs:
  build_dtbo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: sh4dow6oy/android_kernel_samsung_sm8150
          ref: rawr-bpf
          path: kernel
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison python3 wget device-tree-compiler clang

      - name: Fast DTBO Compilation
        run: |
          # 1. Setup Utilities
          wget -q https://raw.githubusercontent.com/LineageOS/android_system_libufdt/lineage-18.1/utils/src/mkdtboimg.py -O mkdtboimg.py
          chmod +x mkdtboimg.py
          
          # 2. Setup AnyKernel3 (fără kernel de data asta, doar pentru structură)
          git clone https://github.com/osm0sis/AnyKernel3.git
          
          # 3. Compilare DTBO (Fix-ul pentru reg_format inclus)
          RENO_PATH="kernel/arch/arm64/boot/dts/samsung/renovation"
          DTS_ROOT="kernel/arch/arm64/boot/dts/samsung"
          mkdir -p dtbo_manual
          
          FILES_TO_BUILD=(
            "sm8150-sec-r5q-overlay-r00.dts"
            "sm8150-sec-r5q-overlay-r01.dts"
            "sm8150-sec-r5q-overlay-r07.dts"
            "sm8150-sec-r5q-overlay-r08.dts"
            "sm8150-sec-r5q-overlay-r09.dts"
            "sm8150-sec-system-update-overlay.dts"
          )
          
          for dts_name in "${FILES_TO_BUILD[@]}"; do
            target_file="$RENO_PATH/$dts_name"
            if [ -f "$target_file" ]; then
              dtbo_out=$(basename "$dts_name" .dts).dtbo
              # Preprocesare RAPIDĂ (folosim headerele direct din sursa checkout-uită)
              clang -E -nostdinc -undef -D__DTS__ -x assembler-with-cpp \
                -I kernel/include \
                -I kernel/arch/arm64/boot/dts/qcom \
                -I kernel/scripts/dtc/include-prefixes \
                -I "$DTS_ROOT" \
                -I "$RENO_PATH" \
                "$target_file" -o "dtbo_manual/tmp.dts"
              
              # Folosim DTC-ul sistemului pentru viteză (nu cel din kernel out)
              dtc -@ -I dts -O dtb -o "dtbo_manual/$dtbo_out" "dtbo_manual/tmp.dts"
            fi
          done
          
          # 4. Creare DTBO.img
          DTBO_LIST=$(ls dtbo_manual/*.dtbo 2>/dev/null)
          if [ -n "$DTBO_LIST" ]; then
            python3 mkdtboimg.py create AnyKernel3/dtbo.img --version=2 $DTBO_LIST
          else
            echo "EROARE: Niciun fisier .dtbo generat!" && exit 1
          fi
          
          # 5. Configurare AnyKernel3 (Doar flash DTBO)
          cd AnyKernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          # Stergem liniile de kernel block deoarece acum flash-uim DOAR DTBO
          sed -i 's|block=auto;|block=none;|g' anykernel.sh
          sed -i '/block=none;/a dtbo_block=/dev/block/by-name/dtbo;' anykernel.sh
          
          # Ștergem placeholder-ul de kernel din zip ca să nu facă flash la nimic gol
          rm -f Image*
          
          zip -r9 ../DTBO-Only-r5q.zip *

      - name: Upload DTBO Only
        uses: actions/upload-artifact@v4
        with:
          name: DTBO-Only-Package
          path: DTBO-Only-r5q.zip
