name: Build r5q Kernel

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libncurses-dev \
            curl \
            unzip \
            git \
            python3

      - name: Download Android NDK r25b
        run: |
          mkdir -p toolchain
          cd toolchain
          curl -L -o ndk.zip https://dl.google.com/android/repository/android-ndk-r25b-linux.zip
          unzip ndk.zip
          rm ndk.zip

      - name: Export NDK Path
        run: |
          echo "NDK_PATH=$PWD/toolchain/android-ndk-r25b" >> $GITHUB_ENV
          echo "PATH=$PWD/toolchain/android-ndk-r25b/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH" >> $GITHUB_ENV

      - name: Set build env variables
        run: |
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "LLVM=1" >> $GITHUB_ENV
          echo "CLANG_TRIPLE=aarch64-linux-android" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-android-" >> $GITHUB_ENV
          echo "CC=aarch64-linux-android21-clang" >> $GITHUB_ENV
          echo "LD=ld.lld" >> $GITHUB_ENV

      - name: Configure kernel
        run: |
          make ARCH=arm64 r5q_eur_open_defconfig

      - name: Build kernel
        run: |
          make -j$(nproc) ARCH=arm64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-artifacts
          path: |
            arch/arm64/boot/Image
            arch/arm64/boot/dts/*
            *.ko
