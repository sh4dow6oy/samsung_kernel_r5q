name: Build R5Q - LineageOS V62 (Python Fix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LineageOS SM8150
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_qcom_sm8150
          ref: lineage-20
          path: kernel

      - name: Download r5q_defconfig
        run: |
          wget -O kernel/arch/arm64/configs/r5q_defconfig https://raw.githubusercontent.com/Roynas-Android-Playground/kernel_samsung_r3q/master/arch/arm64/configs/r5q_defconfig

      - name: Install Build Tools & Python 2 Fix
        run: |
          sudo apt-get update
          # Instalăm dependențele fără python2 momentan
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu bc libssl-dev python3 bison flex libncurses5
          
          # Instalăm manual Python 2 pentru scripturile de procesare DTB
          sudo apt-get install -y python2-minimal || (wget http://archive.ubuntu.com/ubuntu/pool/universe/p/python2.7/python2.7-minimal_2.7.18-13ubuntu1.1_amd64.deb && sudo apt install ./python2.7-minimal_2.7.18-13ubuntu1.1_amd64.deb)
          
          # Creăm link simbolic dacă scripturile caută pur și simplu 'python'
          sudo ln -sf /usr/bin/python3 /usr/bin/python

          mkdir -p clang
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang

      - name: Build Kernel & DTBs
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          MAKE_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CLANG_TRIPLE=aarch64-linux-gnu- O=out"
          
          make $MAKE_ARGS r5q_defconfig
          
          # Dezactivăm WERROR pentru a trece de faza unde s-a blocat la WLAN anterior 
          ./scripts/config --file out/.config \
            -d CONFIG_SAMSUNG_RTIC \
            -d CONFIG_WERROR \
            -e CONFIG_BUILD_ARM64_DT_OVERLAY \
            -d CONFIG_SECURITY_DEFX
            
          make $MAKE_ARGS olddefconfig
          
          # Compilare Image.gz și DTBs
          make -j$(nproc --all) $MAKE_ARGS Image.gz dtbs KCFLAGS="-w -fcommon"

      - name: Assemble AnyKernel3
        run: |
          OUT="kernel/out/arch/arm64/boot"
          git clone https://github.com/osm0sis/AnyKernel3.git AK3
          
          # Copiem Image.gz
          cp $OUT/Image.gz AK3/
          
          # Căutăm și copiem DTBO dacă a fost generat
          find kernel/out -name "dtbo.img" -exec cp {} AK3/dtbo.img \;
          
          # Concatenăm DTB-ul SM8150 la Image (vital pentru S10 Lite) [cite: 3, 4]
          DTB=$(find $OUT/dts -name "*sm8150*.dtb" -o -name "*r5q*.dtb" | head -n 1)
          if [ -f "$DTB" ]; then
            cat $OUT/Image.gz $DTB > AK3/Image.gz
          fi
          
          cd AK3
          sed -i 's/device.name1=maguro/device.name1=r5q/g' anykernel.sh
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          zip -r9 ../R5Q_Lineage_V62.zip *

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-R5Q-V62
          path: R5Q_Lineage_V62.zip
