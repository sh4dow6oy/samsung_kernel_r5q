name: Build Roynas R5Q - Pascua eBPF Surgical
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: Roynas-Android-Playground/kernel_samsung_r3q
          ref: master
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev \
          ccache python3 python-is-python3 libarchive-tools wget zstd libtinfo6 zip git

      - name: Setup Neutron Clang
        run: |
          mkdir clang
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang

      - name: Surgical Cherry-Pick from Pascua
        run: |
          git config --global user.email "bot@github.com"
          git config --global user.name "Kernel-Builder"
          
          # Adăugăm sursa lui pascua28
          git remote add pascua https://github.com/pascua28/android_kernel_samsung_sm8250.git
          git fetch pascua sixteen
          
          echo "Extracting Samsung-specific eBPF logic..."
          
          # Căutăm commit-urile care au modificat subsistemele BPF și Net în branch-ul lui Pascua
          # Filtrăm să luăm doar ce e relevant pentru eBPF
          PASCUA_COMMITS=$(git log pascua/sixteen --grep="bpf" --oneline --reverse -n 50 | awk '{print $1}')
          
          for commit in $PASCUA_COMMITS; do
            echo "Surgical picking: $commit"
            # Aplicăm commit-ul dar resetăm orice modificare care atinge folderele de hardware/drivers
            git cherry-pick -n $commit || true
            git checkout HEAD -- drivers/
            git checkout HEAD -- arch/arm64/boot/dts/
            git add .
            git commit -m "Pascua eBPF Port: $commit" || echo "Nothing to commit for $commit"
          done

      - name: Build Kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export KBUILD_BUILD_USER="Roynas"
          export KBUILD_BUILD_HOST="Neutron-CI"
          
          # 1. Fix-uri Neutron Clang
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-mllvm -polly[^ ]*//g' {} +
          [ -f arch/arm64/kernel/vdso/Makefile ] && sed -i 's/-static//g' arch/arm64/kernel/vdso/Makefile

          # 2. Argumente Build
          MAKE_ARGS="ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            O=out"

          # 3. Configurare eBPF (Folosim setările optimizate pentru Samsung)
          make $MAKE_ARGS r5q_defconfig
          
          ./scripts/config --file out/.config \
            -e CONFIG_BPF \
            -e CONFIG_BPF_SYSCALL \
            -e CONFIG_BPF_JIT \
            -e CONFIG_HAVE_EBPF_JIT \
            -e CONFIG_BPF_EVENTS \
            -e CONFIG_NET_CLS_BPF \
            -e CONFIG_NET_ACT_BPF \
            -e CONFIG_CGROUP_BPF \
            -e CONFIG_NET_SCH_INGRESS \
            -d CONFIG_LTO -d CONFIG_LTO_CLANG -e CONFIG_LTO_NONE \
            -d CONFIG_KNOX_KAP -d CONFIG_SECURITY_SAMSUNG_KNOX \
            -d CONFIG_ASSIST_KSU -d CONFIG_KSU
            
          make $MAKE_ARGS olddefconfig

          # 4. Compilare
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-fcommon -Wno-error -Wno-implicit-function-declaration -Wno-unused-command-line-argument -Wno-incompatible-pointer-types -Wno-int-conversion"

      - name: Package with AnyKernel3
        run: |
          IMAGE="$GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz-dtb"
          [ ! -f "$IMAGE" ] && IMAGE="$GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz"
          DTBO="$GITHUB_WORKSPACE/out/arch/arm64/boot/dtbo.img"
          
          git clone https://github.com/osm0sis/AnyKernel3.git
          rm -rf AnyKernel3/.git
          cp $IMAGE AnyKernel3/Image.gz
          [ -f "$DTBO" ] && cp $DTBO AnyKernel3/dtbo.img
          
          sed -i 's/device.name1=maguro/device.name1=r5q/g' AnyKernel3/anykernel.sh
          sed -i 's/device.name2=toroplus/device.name2=SM-G770F/g' AnyKernel3/anykernel.sh
          
          cd AnyKernel3 && zip -r9 ../Kernel-R5Q-Samsung-eBPF.zip *

      - name: Upload Flashable Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-S10Lite-R5Q
          path: Kernel-R5Q-Samsung-eBPF.zip
