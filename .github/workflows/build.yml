name: Build Roynas R5Q - OpenELA 4.14.356 RC1 (Ubuntu 24.04)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Samsung Source
        uses: actions/checkout@v4
        with:
          repository: Roynas-Android-Playground/kernel_samsung_r3q
          ref: master
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev \
          ccache python3 python-is-python3 libarchive-tools wget zstd libtinfo6 zip \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Setup Neutron Clang
        run: |
          mkdir clang
          # Descarcă Neutron Clang
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang

      - name: Inject OpenELA 4.14.356 RC1
        run: |
          wget -q https://github.com/openela/kernel-lts/archive/refs/tags/v4.14.356-openela-rc1.tar.gz
          # Suprascriem sursa Samsung cu kernel-ul LTS OpenELA
          tar -xzf v4.14.356-openela-rc1.tar.gz --strip-components=1
          echo "OpenELA 4.14.356-rc1 injectat."

      - name: Build Kernel
        run: |
          # Setăm calea către toolchain-ul Neutron
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export KBUILD_BUILD_USER="Roynas"
          export KBUILD_BUILD_HOST="Android-Playground"
          
          # 1. CLEANUP EXTREM (Neutron tinde să forțeze Polly în Makefiles)
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-mllvm -polly[^ ]*//g' {} +
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-mllvm//g' {} +
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-polly[^ ]*//g' {} +
          
          # 2. FIX VDSO (Ubuntu 24.04 + modern LLVM urăsc link-ul static aici)
          if [ -f arch/arm64/kernel/vdso/Makefile ]; then
            sed -i 's/-static//g' arch/arm64/kernel/vdso/Makefile
            sed -i 's/$(LDFLAGS)/$(filter-out -static,$(LDFLAGS))/g' arch/arm64/kernel/vdso/Makefile
          fi

          # 3. ELIMINARE KERNELSU & SAMSUNG BLOAT (Evităm conflicte de definiții)
          sed -i '/kernelsu/d' drivers/android/Kconfig || true
          sed -i '/kernelsu/d' drivers/android/Makefile || true
          rm -rf drivers/kernelsu
          # Fix pentru wrapper-ul de python Samsung care e incompatibil cu Python 3.12 din Ubuntu 24
          sed -i 's/ifneq ($(wildcard $(srctree)\/scripts\/gcc-wrapper.py),)/ifeq (0,1)/g' Makefile

          # 4. ARGUMENTE BUILD
          MAKE_ARGS="ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            O=out"

          # 5. CONFIGURARE
          make $MAKE_ARGS r5q_defconfig
          
          # Ajustări obligatorii pentru Upstream pe r5q
          ./scripts/config --file out/.config \
            -d CONFIG_LTO -d CONFIG_LTO_CLANG -e CONFIG_LTO_NONE \
            -d CONFIG_CC_STACKPROTECTOR_STRONG -e CONFIG_CC_STACKPROTECTOR_NONE \
            -d CONFIG_SHADOW_CALL_STACK -d CONFIG_KNOX_KAP -d CONFIG_SECURITY_SAMSUNG_KNOX \
            -d CONFIG_ASSIST_KSU -d CONFIG_KSU \
            -e CONFIG_SECTION_MISMATCH_WARN_ONLY \
            -d CONFIG_WERROR
          
          make $MAKE_ARGS olddefconfig

          # 6. COMPILARE (Ubuntu 24.04 e rapid, folosim nproc complet)
          # KCFLAGS conțin fixuri pentru "stpcpy" și alte funcții care crapă cu LLVM 18+
          make -j$(nproc --all) $MAKE_ARGS \
            KCFLAGS="-fcommon -fno-builtin-stpcpy -Wno-error -Wno-unknown-warning-option -Wno-unused-command-line-argument -Wno-implicit-function-declaration -Wno-int-conversion"

      - name: Package with AnyKernel3
        run: |
          IMAGE="out/arch/arm64/boot/Image.gz"
          [ -f out/arch/arm64/boot/Image.gz-dtb ] && IMAGE="out/arch/arm64/boot/Image.gz-dtb"
          DTBO="out/arch/arm64/boot/dtbo.img"

          git clone https://github.com/osm0sis/AnyKernel3.git
          rm -rf AnyKernel3/.git

          cp $IMAGE AnyKernel3/Image.gz
          [ -f "$DTBO" ] && cp $DTBO AnyKernel3/dtbo.img

          # Config r5q
          sed -i 's/device.name1=maguro/device.name1=r5q/g' AnyKernel3/anykernel.sh
          sed -i 's/device.name2=toroplus/device.name2=SM-G770F/g' AnyKernel3/anykernel.sh
          sed -i 's/device.name3=toro/device.name3=r5q/g' AnyKernel3/anykernel.sh

          cd AnyKernel3
          zip -r9 ../Kernel-R5Q-OpenELA-U24.zip *

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-S10Lite-OpenELA
          path: Kernel-R5Q-OpenELA-U24.zip
