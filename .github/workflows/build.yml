name: Build R5Q - Ducky 4.19 Neutron V106

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel
        uses: actions/checkout@v4
        with:
          repository: duckyduckG/android_kernel_qcom_sm8150_419
          ref: lineage-23.2
          path: kernel

      - name: Maximize Space & Install Toolchain
        run: |
          # Curățare spațiu pentru LTO
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update
          sudo apt-get install -y bc libssl-dev python3 bison flex libncurses6 libncurses-dev git gcc-aarch64-linux-gnu zstd device-tree-compiler
          sudo ln -sf /usr/bin/python3 /usr/bin/python
          
          # Setup Neutron Clang Manual
          mkdir -p clang
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang
          rm neutron-clang-10032024.tar.zst

      - name: Smart Config & Build
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          
          # Argumente Build
          MAKE_ARGS="ARCH=arm64 \
                     LLVM=1 \
                     LLVM_IAS=1 \
                     CC=clang \
                     LD=ld.lld \
                     CROSS_COMPILE=aarch64-linux-gnu- \
                     CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
                     O=out"
          
          # 1. Generăm config-ul de bază (sm8150-perf)
          make $MAKE_ARGS vendor/sm8150-perf_defconfig
          
          # 2. Injectăm ADN-ul de Samsung și forțăm generarea DTBO
          ./scripts/config --file out/.config \
            -e CONFIG_MACH_SAMSUNG \
            -e CONFIG_MACH_R5Q \
            -e CONFIG_BUILD_ARM64_DT_OVERLAY \
            -e CONFIG_OF_LIBFDT_OVERLAY \
            -e CONFIG_DTC \
            -e CONFIG_LTO_CLANG_THIN \
            -d CONFIG_LTO_NONE \
            -d CONFIG_SAMSUNG_RTIC \
            -d CONFIG_WERROR \
            -d CONFIG_PANIC_ON_RECURSIVE_FAULT
            
          make $MAKE_ARGS olddefconfig
          
          # 3. Build Kernel + DTB + DTBO (Target explicit)
          # Încercăm să compilăm totul, dacă dtbo.img e definit în Makefile va ieși direct
          make -j$(nproc --all) $MAKE_ARGS V=1 Image.gz dtbs dtbo.img || make -j$(nproc --all) $MAKE_ARGS V=1 Image.gz dtbs

      - name: Assemble AnyKernel3
        run: |
          OUT="kernel/out/arch/arm64/boot"
          if [ -f "$OUT/Image.gz" ]; then
            git clone https://github.com/osm0sis/AnyKernel3.git AK3
            cp $OUT/Image.gz AK3/
            
            # Căutăm DTB-ul principal (specific R5Q sau SM8150-V2)
            DTB=$(find $OUT/dts -name "*r5q*.dtb" -o -name "*sm8150-v2.dtb" | head -n 1)
            if [ -f "$DTB" ]; then
                cat $OUT/Image.gz $DTB > AK3/Image.gz
                echo "DTB integrat în Image.gz: $DTB"
            fi
            
            # Căutăm DTBO.img
            DTBO_IMG=$(find kernel/out -name "dtbo.img" | head -n 1)
            if [ -f "$DTBO_IMG" ]; then
                cp $DTBO_IMG AK3/dtbo.img
                echo "Binar DTBO.img găsit!"
            else
                echo "Binarul dtbo.img lipsește. Colectăm fragmentele .dtbo manual..."
                find kernel/out -name "*.dtbo" -exec cp {} AK3/ \;
            fi
            
            cd AK3 && zip -r9 ../R5Q_Ducky_Neutron_V106.zip *
          else
            echo "Eroare: Compilarea Image.gz a eșuat!"
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-R5Q-V106
          path: R5Q_Ducky_Neutron_V106.zip
