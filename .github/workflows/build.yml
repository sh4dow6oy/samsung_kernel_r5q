name: S10 Lite - 4.19 Hybrid (Deep Audio Fix)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves libncurses-dev git wget make python2 python3 pahole tar xz-utils lib32z1

      - name: Setup Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang
          echo "PROTON_PATH=$(pwd)/toolchain/proton-clang/bin" >> $GITHUB_ENV

      - name: Hybrid Source Preparation
        run: |
          # 1. Clonare baze
          git clone --depth=1 https://github.com/duckyduckG/android_kernel_qcom_sm8150_419.git kernel_source
          git clone --depth=1 https://github.com/mainey/android_kernel_samsung_r5q.git samsung_source
          
          # 2. Injectare Techpack & Config
          rm -rf kernel_source/techpack
          cp -r samsung_source/techpack kernel_source/
          cp samsung_source/arch/arm64/configs/r5q_eur_open_defconfig kernel_source/arch/arm64/configs/r5q_defconfig
          
          # 3. Injectare DTS
          mkdir -p kernel_source/arch/arm64/boot/dts/vendor/qcom/
          find samsung_source/arch/arm64/boot/dts/ -name "*r5q*" -exec cp {} kernel_source/arch/arm64/boot/dts/vendor/qcom/ \;
          
          cd kernel_source

          # === FIX KCONFIG & MAKEFILE ===
          sed -i '/techpack/d' Kconfig
          if [ -f techpack/audio/Kconfig ]; then
            echo 'source "techpack/audio/Kconfig"' >> Kconfig
          fi
          sed -i '/techpack/d' Makefile
          sed -i 's/^core-y[[:space:]]*:=/core-y := techpack\/ /' Makefile

          # === FIX COMPATIBILITATE AUDIO DEEP MAPPING ===
          echo "Applying Deep ASoC structure mapping..."
          
          # Inlocuim structura de baza in tot techpack-ul
          find techpack/audio/ -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's/struct snd_soc_codec/struct snd_soc_component/g' {} +
          
          # FIX CRITIC: Eliminam accesarea .component (Ex: codec->component.card devine codec->card)
          # Deoarece am transformat deja 'codec' in 'component', 'component->component' ar fi eronat.
          find techpack/audio/ -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's/->component\./->/g' {} +
          
          # Inlocuim functiile de drvdata
          find techpack/audio/ -type f -name "*.c" -exec sed -i 's/snd_soc_codec_get_drvdata/snd_soc_component_get_drvdata/g' {} +
          find techpack/audio/ -type f -name "*.c" -exec sed -i 's/snd_soc_codec_set_drvdata/snd_soc_component_set_drvdata/g' {} +
          
          # Alias pentru preprocesor pentru a mentine compatibilitatea numelui 'codec'
          find techpack/audio/asoc/codecs/wcd934x/ -name "*.h" -exec sed -i '20i #define codec component' {} +
          find techpack/audio/asoc/codecs/wcd934x/ -name "*.c" -exec sed -i '25i #define codec component' {} +

          # Fix structura snd_soc_component_driver pentru 4.19
          # get_regmap si definitia imbricata a component_driver nu mai exista
          find techpack/audio/asoc/codecs/wcd934x/wcd934x.c -exec sed -i 's/\.get_regmap = tavil_get_regmap,//g' {} +
          sed -i '/\.component_driver = {/,/},/ s/^/\/\//' techpack/audio/asoc/codecs/wcd934x/wcd934x.c

          # === FIX-URI RAMASE ===
          find techpack/audio/ -name "msm-pcm-q6-noirq.c" -exec sed -i '20i #define L1SS_AUDIO 0' {} +
          find techpack/audio/ -name "*.h" -o -name "*.c" -exec sed -i 's/SND_JACK_MICROPHONE2/SND_JACK_MICROPHONE/g' {} +
          
          if [ -f drivers/soc/qcom/smcinvoke.c ]; then
            sed -i '/static inline size_t size_add/,/}/ s/^/\/\//' drivers/soc/qcom/smcinvoke.c
          fi

          # Fix Samsung SecTools
          echo -e '#!/bin/bash\necho "0"' > /tmp/secgetspf
          chmod +x /tmp/secgetspf
          sudo mv /tmp/secgetspf /usr/bin/secgetspf

      - name: Build Kernel
        run: |
          export PATH="${{ env.PROTON_PATH }}:$PATH"
          cd kernel_source
          
          ARGS="ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1"
          
          # Flag-uri extinse pentru a ignora warning-urile generate de hack-urile de compatibilitate
          export KCFLAGS="-Wno-error -Wno-implicit-function-declaration -Wno-int-conversion -Wno-incompatible-pointer-types -Wno-unused-variable -Wno-format-security -Wno-strict-prototypes -Wno-visibility -Wno-unused-parameter -Wno-unused-function"

          make $ARGS r5q_defconfig
          
          sed -i 's/CONFIG_LTO_CLANG=y/CONFIG_LTO_CLANG=n/g' .config
          sed -i 's/CONFIG_LTO=y/CONFIG_LTO=n/g' .config
          sed -i 's/CONFIG_DEBUG_INFO_BTF=y/CONFIG_DEBUG_INFO_BTF=n/g' .config
          
          make $ARGS olddefconfig
          make -j2 $ARGS

          if [ -f arch/arm64/boot/Image ]; then
            cp arch/arm64/boot/Image ../
            find arch/arm64/boot/dts/ -name "*.dtbo" -exec cp {} ../ \; || true
            echo "SUCCESS=true" >> $GITHUB_ENV
          fi

      - name: Upload
        if: env.SUCCESS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-4.19-DeepFixed-Kernel
          path: |
            Image
            *.dtbo
