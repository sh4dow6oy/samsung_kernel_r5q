name: Build Samsung SM8150 (Fixed Neutron)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: sh4dow6oy/android_kernel_samsung_sm8150-5.4
          path: kernel

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libncurses-dev git zstd

      - name: Download & Extract Neutron Clang
        run: |
          mkdir neutron
          wget https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C neutron/

      - name: Compile Kernel
        run: |
          cd kernel
          # Calea către binarele Neutron
          export PATH=$GITHUB_WORKSPACE/neutron/bin:$PATH
          
          # Setup compilator
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          export AR=llvm-ar
          export LD=ld.lld
          
          # Cross-compilation triples
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          # 1. Generare Config
          make O=out vendor/b2q_eur_openx_defconfig

          # 2. Build (Folosim LLVM=1 pentru a activa tot setul de unelte Neutron)
          make -j$(nproc --all) O=out \
                      ARCH=arm64 \
                      CC=clang \
                      LLVM=1 \
                      LLVM_IAS=1 \
                      KCFLAGS="-Wno-error -w" \
                      HOSTCFLAGS="-Wno-error" \
                      HOSTCXXFLAGS="-Wno-error"

      - name: Check Results
        run: |
          ls -l kernel/out/arch/arm64/boot/
          if [ -f kernel/out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "SUCCESS: Kernel built!"
          else
            echo "ERROR: Kernel image not found."
            exit 1
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-SM8150-Neutron-Fixed
          path: |
            kernel/out/arch/arm64/boot/Image.gz-dtb
            kernel/out/arch/arm64/boot/Image
            kernel/out/arch/arm64/boot/dtbo.img
