name: S10 Lite - Xceed eBPF Integration v25

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Kernel S10 Lite (r5q)
        uses: actions/checkout@v4
        with:
          repository: mainey/android_kernel_samsung_r5q
          ref: lineage-19.0
          path: kernel
          fetch-depth: 1

      - name: Setup Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves make python3 lz4 rsync
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang

      - name: Fetch Xceed BPF Source (SM8250)
        run: |
          git clone --depth=1 https://github.com/pascua28/android_kernel_samsung_sm8250.git -b sixteen xceed-source

      - name: Port Xceed eBPF (Surgical Sync)
        run: |
          cd kernel
          # Sincronizam subsistemul BPF si Netfilter Match
          rsync -av --delete ../xceed-source/kernel/bpf/ kernel/bpf/
          rsync -av ../xceed-source/include/linux/bpf* include/linux/
          rsync -av ../xceed-source/include/uapi/linux/bpf* include/uapi/linux/
          rsync -av ../xceed-source/net/netfilter/xt_bpf.c net/netfilter/xt_bpf.c || true

      - name: Fix Samsung Specific Conflicts
        run: |
          cd kernel
          # Bypass Samsung Security (SPF)
          echo "int main() { return 0; }" > secgetspf.c
          gcc secgetspf.c -o secgetspf
          chmod +x secgetspf
          
          # Curatare Makefile Samsung
          sed -i 's|$(srctree)/../toolchain/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin/aarch64-linux-android-||g' Makefile
          
          # Fix pentru task_struct->__state (necesar pentru kernel 4.14 modernizat)
          find drivers/soc/samsung/ -type f -name "*.c" -exec sed -i 's/->state/->__state/g' {} + || true

      - name: Configure & Build
        run: |
          cd kernel
          export PATH=$(pwd):$(pwd)/../toolchain/proton-clang/bin:$PATH
          export MAKE_ARGS="ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1"
          
          make $MAKE_ARGS r5q_eur_open_defconfig
          
          # Activare BPF completa din configuratia Xceed
          ./scripts/config --enable CONFIG_BPF
          ./scripts/config --enable CONFIG_BPF_SYSCALL
          ./scripts/config --enable CONFIG_BPF_JIT
          ./scripts/config --enable CONFIG_CGROUP_BPF
          ./scripts/config --enable CONFIG_NETFILTER_XT_MATCH_BPF
          ./scripts/config --disable CONFIG_DEBUG_INFO_BTF
          ./scripts/config --disable CONFIG_SECURITY_SAMSUNG_RKP
          
          make $MAKE_ARGS olddefconfig
          
          # Compilare cu flag-uri de compatibilitate
          export KCFLAGS="-O2 -Wno-everything -Wno-error -fcommon"
          make -j$(nproc --all) $MAKE_ARGS Image.gz-dtb

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-Xceed-eBPF-v25
          path: kernel/arch/arm64/boot/Image.gz-dtb
