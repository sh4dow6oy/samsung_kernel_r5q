name: S10 Lite (Sixteen - Argument Fix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sixteen Base (Pascua)
        uses: actions/checkout@v4
        with:
          repository: pascua28/android_kernel_samsung_sm7150
          ref: sixteen
          path: main

      - name: Checkout Royna (For R5Q Defconfig)
        uses: actions/checkout@v4
        with:
          repository: Roynas-Android-Playground/kernel_samsung_r3q
          ref: master
          path: royna

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex git libssl-dev libelf-dev clang llvm lld zstd curl python3

      - name: Download Neutron Clang
        run: |
          mkdir -p main/clang
          wget https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C main/clang

      - name: Inject R5Q & Surgical Patching
        run: |
          cp royna/arch/arm64/configs/r5q_defconfig main/arch/arm64/configs/r5q_defconfig
          cd main
          
          # 1. FIX PENTRU setup_arch (Eroarea: too few arguments)
          # Fortam apelul setup_arch sa aiba al doilea argument (NULL sau dummy) daca e nevoie
          # Dar de cele mai multe ori, in Sixteen, definitia asteapta (char **cmdline_p)
          # Daca cere 2, al doilea este de obicei pointerul catre DTB sau ceva similar.
          # O vom "pacali" redirectionand-o catre o variabila locala.
          sed -i 's/setup_arch(&command_line);/setup_arch(&command_line, NULL);/g' init/main.c
          
          # 2. FIX PENTRU initcall_sec_debug & frozen
          sed -i 's/initcall_sec_debug/initcall_debug/g' init/main.c
          find include/linux -name "cgroup.h" -exec sed -i 's/task->frozen/0/g' {} +
          
          # 3. FIX REDEFINITION (SAMSUNG_PRODUCT_SHIP)
          # In loc sa o adaugam in Makefile (unde cauzeaza duplicate), o definim doar daca nu exista
          sed -i '1i #ifndef SAMSUNG_PRODUCT_SHIP\n#define SAMSUNG_PRODUCT_SHIP\n#endif' init/main.c
          sed -i 's/secgetspf//g' Makefile

          # 4. NUCLEAR CLEANUP
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-mllvm -polly[^ ]*//g' {} +
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-mllvm//g' {} +
          sed -i 's/ifneq ($(wildcard $(srctree)\/scripts\/gcc-wrapper.py),)/ifeq (0,1)/g' Makefile
          
          # 5. VDSO & ASM Fixes
          if [ -f arch/arm64/kernel/vdso/Makefile ]; then
            sed -i 's/-static//g' arch/arm64/kernel/vdso/Makefile
          fi
          find arch/arm64 -name "*.S" -exec sed -i 's/\.inst\.w/.inst/g' {} +

      - name: Configure and Build
        run: |
          cd main
          export PATH="$GITHUB_WORKSPACE/main/clang/bin:$PATH"

          MAKE_ARGS="ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            O=out"

          make $MAKE_ARGS r5q_defconfig
          
          # Optimizari de stabilitate
          ./scripts/config --file out/.config \
            -e CONFIG_BPF_SYSCALL -e CONFIG_BPF_JIT \
            -d CONFIG_LTO -d CONFIG_LTO_CLANG -e CONFIG_LTO_NONE \
            -d CONFIG_SHADOW_CALL_STACK \
            -d CONFIG_SECURITY_SAMSUNG_KNOX -d CONFIG_KNOX_KAP \
            -d CONFIG_SEC_DEBUG

          make $MAKE_ARGS olddefconfig

          # Build final
          make -j$(nproc --all) $MAKE_ARGS \
            KCFLAGS="-fcommon -Wno-error -Wno-implicit-function-declaration -Wno-int-conversion -Wno-incompatible-pointer-types -Wno-macro-redefined" \
            2>&1 | tee build.log

      - name: Upload Kernel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-Sixteen-v2
          path: |
            main/out/arch/arm64/boot/Image.gz-dtb
            main/out/arch/arm64/boot/dtbo.img
            main/build.log
