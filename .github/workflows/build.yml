name: Samsung SM8150 (r5q) - Scheduler Fix - V34

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: sh4dow6oy/android_kernel_samsung_sm8150-5.4
          path: kernel
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libncurses-dev git zstd python3 gzip

      - name: Download & Extract Neutron Clang
        run: |
          mkdir -p neutron
          wget https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C neutron/

      - name: Patch Source Code
        run: |
          cd kernel
          # 1. FIX SCHEDULER ERROR (sched_energy_present)
          # Înlocuim macro-ul static_branch cu apelul direct de funcție care există în sched.h
          sed -i 's/static_branch_unlikely(&sched_energy_present)/sched_energy_enabled()/g' kernel/sched/fair.c
          
          # 2. Fix Section Mismatch (Samsung Debug)
          sed -i 's/__init //g' drivers/samsung/debug/sec_debug_summary.c 2>/dev/null || true
          sed -i 's/__init //g' include/linux/sec_debug.h 2>/dev/null || true
          
          # 3. Fix IOMMU Header (MHI/Modem fix)
          find drivers/bus/mhi/ -type f -name "*.c" -exec sed -i 's/asm\/dma-iommu.h/linux\/dma-iommu.h/g' {} +

      - name: Compile Kernel
        run: |
          cd kernel
          export PATH=$GITHUB_WORKSPACE/neutron/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export LD=ld.lld
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          # 1. Config
          make O=out vendor/r5q_eur_open_defconfig
          
          # 2. Hardware & Linker Adjustments
          scripts/config --file out/.config -e CONFIG_TOUCHSCREEN_SAMSUNG
          scripts/config --file out/.config -e CONFIG_TOUCHSCREEN_SEC_TS_Y771_R5
          scripts/config --file out/.config -e CONFIG_I2C_QCOM_GENI
          scripts/config --file out/.config -d CONFIG_SDP
          scripts/config --file out/.config -d CONFIG_DEFEX
          
          # Dezactivăm manual EAS dacă provoacă erori de compilare, dar sed-ul de mai sus ar trebui să rezolve
          # scripts/config --file out/.config -d CONFIG_ENERGY_MODEL
          
          make O=out ARCH=arm64 olddefconfig

          # 3. Build Final
          # Folosim -fcommon pentru a evita "duplicate symbol" de data trecută
          make -j$(nproc --all) O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 \
                      KCFLAGS="-Wno-error -w -fcommon -fno-stack-protector -Wno-implicit-function-declaration" \
                      Image

      - name: Prepare Artifacts
        run: |
          if [ -f kernel/out/arch/arm64/boot/Image ]; then
            gzip -n -c kernel/out/arch/arm64/boot/Image > kernel/Image.gz
          else
            echo "Kernel Image not found!"
            exit 1
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-r5q-V34-SchedFix
          path: kernel/Image.gz
