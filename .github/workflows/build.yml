name: Build Kernel r5q (S10 Lite) Generic Video

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Setup Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential zip curl libssl-dev flex bison libelf-dev binutils-aarch64-linux-gnu python3 git

      - name: Checkout Base (SM8150 4.19)
        uses: actions/checkout@v4
        with:
          repository: sh4dow6oy/android_kernel_qcom_sm8150_419
          path: kernel
          fetch-depth: 1

      - name: Integrate Samsung r5q Config & Core Drivers
        run: |
          cd kernel
          git remote add samsung https://github.com/sh4dow6oy/kernel_samsung_r3q
          git fetch samsung master --depth=1
          
          # Luăm config-ul r5q specific pentru S10 Lite
          git checkout samsung/master -- arch/arm64/configs/r5q_defconfig
          
          # Importăm doar driverele periferice necesare (fără video)
          git checkout samsung/master -- drivers/input/touchscreen/
          git checkout samsung/master -- drivers/battery_v2/
          git checkout samsung/master -- drivers/sensors/
          git checkout samsung/master -- drivers/motor/

      - name: Setup KernelSU
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main

      - name: Setup Proton Clang
        run: |
          git clone https://github.com/kdrag0n/proton-clang --depth=1 clang

      - name: Compile Kernel
        run: |
          cd kernel
          export PATH=$(pwd)/../clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          # 1. Aplicăm configurația r5q
          make O=out r5q_defconfig
          
          # 2. Injectăm optimizări de performanță și KernelSU
          echo "CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y" >> out/.config
          echo "CONFIG_KSU=y" >> out/.config
          
          # 3. Aliniere config pentru a evita conflictele
          make O=out olddefconfig
          
          # 4. Build folosind toate resursele runner-ului
          make -j$(nproc --all) O=out \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1
          # Identificăm bzImage sau Image.gz-dtb
          if [ -f kernel/out/arch/arm64/boot/Image.gz-dtb ]; then
            cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          elif [ -f kernel/out/arch/arm64/boot/Image.gz ]; then
            cp kernel/out/arch/arm64/boot/Image.gz AnyKernel3/
          else
            cp kernel/out/arch/arm64/boot/Image AnyKernel3/
          fi
          
          cd AnyKernel3
          sed -i 's/device.name1=/device.name1=r5q/' anykernel.sh
          zip -r9 ../r5q-Kernel-Generic-Video.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-Kernel-r5q
          path: r5q-Kernel-Generic-Video.zip
