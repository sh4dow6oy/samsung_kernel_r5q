name: S10 Lite - Hybrid v14.1

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves make python3 lz4 perl
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang

      - name: Core Pascua Backport (eBPF 5.1 Full)
        run: |
          git remote add linux-stable https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git || true
          git fetch linux-stable linux-5.1.y --depth=1
          PATHS=("kernel/bpf/" "include/linux/bpf.h" "include/linux/filter.h" "include/linux/bpf_verifier.h" "include/linux/tnum.h" "include/linux/btf.h" "include/uapi/linux/bpf.h" "include/uapi/linux/btf.h" "include/uapi/linux/bpf_common.h" "include/linux/bpf-cgroup.h")
          for path in "${PATHS[@]}"; do git checkout FETCH_HEAD -- "$path"; done

      - name: Apply Glue Patches (The Fixes)
        run: |
          # A. Fix secgetspf (Samsung Bypass)
          mkdir -p scripts
          echo -e "#!/bin/bash\necho 0" > scripts/secgetspf
          chmod +x scripts/secgetspf
          sudo cp scripts/secgetspf /usr/bin/secgetspf

          # B. Fix Header Inconsistencies (LIRC & Signature)
          mkdir -p include/linux/ include/uapi/linux/
          printf "#ifndef _BPF_LIRC_H\n#define _BPF_LIRC_H\n#endif\n" > include/linux/bpf_lirc.h
          cp include/linux/bpf_lirc.h include/uapi/linux/bpf_lirc.h
          
          # C. Fix bpf_ctx_narrow_access_ok (Pascua expects 4 args)
          sed -i 's/bpf_ctx_narrow_access_ok(u32 off, u32 size, u32 size_default)/bpf_ctx_narrow_access_ok(int type, u32 off, u32 size, u32 size_default)/g' include/linux/filter.h

          # D. Neutralizare fișiere 5.1 care cer headere lipsă
          for f in devmap.c cpumap.c offload.c bpf_lirc.c reuseport_array.c; do echo "/* Nulled */" > kernel/bpf/$f; done

          # E. Aliniere Net Core (din v14 original)
          sed -i 's/static const struct bpf_func_proto bpf_sk_redirect_map_proto/const struct bpf_func_proto bpf_sk_redirect_map_proto/g' net/core/filter.c
          perl -0777 -pi -e 's/int xdp_do_generic_redirect\s*\(\s*struct net_device\s*\*dev\s*,\s*struct sk_buff\s*\*skb\s*,\s*const struct bpf_func_proto\s*\*proto\s*\)/int xdp_do_generic_redirect(struct net_device *dev, struct sk_buff *skb, struct bpf_prog *prog, const struct bpf_func_proto *proto)/g' net/core/filter.c
          perl -0777 -pi -e 's/xdp_do_generic_redirect\s*\(\s*([^,]+)\s*,\s*([^,]+)\s*,\s*([^)]+)\s*\)/xdp_do_generic_redirect($1, $2, NULL, $3)/g' net/core/dev.c

      - name: Build Kernel
        run: |
          export PATH=$(pwd)/toolchain/proton-clang/bin:$PATH
          MAKE_ARGS="O=out ARCH=arm64 CC=clang HOSTCC=gcc CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1"
          
          # Injectăm secgetspf și în OUT
          mkdir -p out/scripts
          cp scripts/secgetspf out/scripts/

          make $MAKE_ARGS r5q_eur_open_defconfig
          ./scripts/config --file out/.config --enable CONFIG_BPF_SYSCALL
          ./scripts/config --file out/.config --disable CONFIG_KPERFMON
          
          make $MAKE_ARGS olddefconfig
          export KCFLAGS="-Wno-error -Wno-incompatible-pointer-types -Wno-implicit-function-declaration"
          make -j$(nproc --all) $MAKE_ARGS Image.gz-dtb || make -j1 $MAKE_ARGS Image.gz-dtb

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-sh4dow6oy-v14.1
          path: out/arch/arm64/boot/Image.gz-dtb
