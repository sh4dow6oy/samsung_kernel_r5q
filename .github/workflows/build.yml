name: Samsung SM8150 (r5q) - Inversat - V73

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout SM6150 Kernel (Source Baza)
      - name: Checkout SM6150 Kernel
        uses: actions/checkout@v4
        with:
          repository: crdroidandroid/android_kernel_samsung_sm6150
          ref: refs/heads/15.0
          path: kernel
          fetch-depth: 1

      # 2. Checkout R5Q Kernel (Target Specifics)
      - name: Checkout R5Q Kernel (pentru DTS/Defconfig/Drivers)
        uses: actions/checkout@v4
        with:
          repository: mainey/android_kernel_samsung_r5q
          ref: lineage-18.1
          path: r5q_specifics
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libncurses-dev git zstd python3 gzip dwarves wget

      - name: Download Neutron Clang
        run: |
          mkdir -p neutron
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C neutron/

      - name: Inversare si Injectare Specifics - V73
        run: |
          # 1. Injectam Device Tree specific R5Q
          cp -r $GITHUB_WORKSPACE/r5q_specifics/arch/arm64/boot/dts/samsung/* $GITHUB_WORKSPACE/kernel/arch/arm64/boot/dts/samsung/

          # 2. Injectam Defconfig R5Q
          cp $GITHUB_WORKSPACE/r5q_specifics/arch/arm64/configs/r5q_eur_open_defconfig $GITHUB_WORKSPACE/kernel/arch/arm64/configs/

          # 3. Injectam Drivere specifice necesare (Samsung & fs/sdfat)
          cp -r $GITHUB_WORKSPACE/r5q_specifics/drivers/misc/samsung/* $GITHUB_WORKSPACE/kernel/drivers/misc/samsung/ || true
          cp -r $GITHUB_WORKSPACE/r5q_specifics/fs/sdfat/* $GITHUB_WORKSPACE/kernel/fs/sdfat/ || true

          # 4. FIX eCryptfs Incompatibility (V72 Patch)
          sed -i 's/struct crypto_blkcipher \*\*tfm/struct crypto_skcipher \*\*tfm/g' $GITHUB_WORKSPACE/kernel/fs/ecryptfs/ecryptfs_kernel.h

          # 5. Fix driver compilation (V73 Patch)
          # Exemplu: daca un fisier .c nou din r5q nu e in Makefile-ul sm6150, il adaugam
          # In acest caz, analizam log-ul pentru a vedea ce fisier lipsește (exemplu generic)
          # echo "obj-y += fisier_nou.o" >> $GITHUB_WORKSPACE/kernel/drivers/misc/samsung/Makefile

      - name: Configure R5Q Kernel (Inversat)
        run: |
          cd kernel
          export PATH=$GITHUB_WORKSPACE/neutron/bin:$PATH
          export ARCH=arm64
          mkdir -p out

          # Folosim defconfig-ul R5Q injectat
          make O=out ARCH=arm64 r5q_eur_open_defconfig

          # Asiguram activarea eBPF in noul config
          scripts/config --file out/.config -e CONFIG_BPF
          scripts/config --file out/.config -e CONFIG_BPF_SYSCALL
          scripts/config --file out/.config -e CONFIG_BPF_JIT
          scripts/config --file out/.config -e CONFIG_BPF_JIT_ALWAYS_ON
          scripts/config --file out/.config -e CONFIG_CGROUP_BPF
          scripts/config --file out/.config -e CONFIG_DEBUG_INFO_BTF

          make O=out ARCH=arm64 olddefconfig

      - name: Build Kernel
        run: |
          cd kernel
          export PATH=$GITHUB_WORKSPACE/neutron/bin:$PATH
          export ARCH=arm64
          export CC=clang
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export LD=ld.lld
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          # Adaugam -Wno-error pentru a trece de warning-urile care devin erori
          make -j$(nproc --all) O=out ARCH=arm64 \
               CC=clang LLVM=1 LLVM_IAS=1 \
               KCFLAGS="-Wno-error -Wno-unused-function -Wno-unused-variable -Wno-int-conversion -Wno-implicit-function-declaration"

      - name: Prepare Artifact
        run: |
          cd kernel
          if [ -f out/arch/arm64/boot/Image ]; then
            gzip -n -c out/arch/arm64/boot/Image > Image.gz
          else
            echo "Build failed!"
            exit 1
          fi

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: r5q-ebpf-V73
          path: kernel/Image.gz
