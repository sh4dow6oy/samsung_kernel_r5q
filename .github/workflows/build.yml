name: Build Samsung SM8150 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v5
        with:
          repository: sh4dow6oy/android_kernel_samsung_sm8150
          ref: auriana
          path: kernel

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential bison flex libssl-dev libelf-dev xz-utils libncurses5-dev

      - name: Download Toolchains
        run: |
          # Clang-ul cerut de tine
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b clang
          # Adăugăm GCC/Binutils pentru a furniza aarch64-linux-gnu-ld și altele
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 gcc-arm64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 gcc-arm

      - name: Merge Config and Build
        run: |
          cd kernel
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          
          mkdir -p out

          # 1. Combinăm fișierele manual într-un singur fișier temporar
          cat arch/arm64/configs/sm8150_sec_defconfig > out/.config
          echo "" >> out/.config
          cat arch/arm64/configs/sm8150_sec_r5q_eur_open.config >> out/.config

          # 2. Rulăm 'olddefconfig' pentru a valida mixul și a activa dependențele implicite
          # Folosim PATH-ul către toolchain-ul descărcat anterior
          export PATH="$(pwd)/../clang/bin:$(pwd)/../gcc-arm64/bin:$(pwd)/../gcc-arm/bin:$PATH"
          
          make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- olddefconfig

          # 3. Build cu toate flag-urile necesare (inclusiv fix-ul pentru WLAN)
          make -j$(nproc --all) O=out \
              ARCH=arm64 \
              CC=clang \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              CROSS_COMPILE=aarch64-linux-android- \
              CROSS_COMPILE_ARM32=arm-linux-androideabi- \
              LD=ld.lld \
              AR=llvm-ar \
              NM=llvm-nm \
              OBJCOPY=llvm-objcopy \
              OBJDUMP=llvm-objdump \
              STRIP=llvm-strip
          )

          # 1. Creare director
          mkdir -p out
          
          # 2. Merge Config
          bash scripts/kconfig/merge_config.sh -O out \
              arch/arm64/configs/sm8150_sec_defconfig \
              arch/arm64/configs/sm8150_sec_r5q_eur_open.config
          
          # 3. Build propriu-zis
          make -j$(nproc --all) "${MAKE_FLAGS[@]}"

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v5
        with:
          name: Image.gz-dtb
          path: kernel/out/arch/arm64/boot/Image.gz-dtb
