name: Build Samsung SM8150 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        repository: LumiPlayground/android_kernel_samsung_sm8150
        ref: auriana
        path: kernel

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm libncurses-dev

    - name: Download Me2 Toolchain
      run: |
        git clone https://github.com/mk7x7/Me2.git toolchain
        echo "TC_BIN=$(pwd)/toolchain/toolchain/bin" >> $GITHUB_ENV

    - name: Build Kernel
      run: |
        cd kernel
        export ARCH=arm64
        export SUBARCH=arm64
        export PATH="${{ env.TC_BIN }}:$PATH"
        
        # Variabilele tale solicitate
        CLANG_TRIPLE=aarch64-linux-gnu-
        CROSS_COMPILE=${{ env.TC_BIN }}/aarch64-linux-android-
        CROSS_COMPILE_ARM32=${{ env.TC_BIN }}/arm-linux-androideabi-
        
        export KERNEL_MAKE_ENV="DTC_EXT=$(pwd)/scripts/dtc/dtc \
                                CONFIG_BUILD_ARM64_DT_OVERLAY=y \
                                CC=clang \
                                CLANG_TRIPLE=$CLANG_TRIPLE \
                                CROSS_COMPILE=$CROSS_COMPILE \
                                CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32"

        # Generare config
        make O=out $KERNEL_MAKE_ENV sm8150_sec_defconfig
        scripts/kconfig/merge_config.sh -O out out/.config arch/arm64/configs/sm8150_sec_r5q_eur_open.config
        make O=out $KERNEL_MAKE_ENV olddefconfig
        
        # Compilare
        make -j$(nproc --all) O=out $KERNEL_MAKE_ENV || exit 1

    - name: Debug Output (Check if files exist)
      run: |
        echo "Verificăm prezența fișierelor în kernel/out/arch/arm64/boot/:"
        ls -R kernel/out/arch/arm64/boot/ || echo "Fișierele nu au fost găsite!"

    - name: Upload Artifacts
      if: success()
      uses: upload-artifact@v4
      with:
        name: Kernel_SM8150_Final
        path: |
          kernel/out/arch/arm64/boot/Image*
          kernel/out/arch/arm64/boot/*.img
          kernel/out/.config
        if-no-files-found: error
