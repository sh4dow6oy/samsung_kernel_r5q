name: S10 Lite (Royna + BPF - Full Scrub)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Royna Base
        uses: actions/checkout@v4
        with:
          repository: Roynas-Android-Playground/kernel_samsung_r3q
          ref: master
          path: main

      - name: Checkout Pascua BPF
        uses: actions/checkout@v4
        with:
          repository: pascua28/android_kernel_samsung_sm7150
          ref: bpf
          path: bpf_source

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex git libssl-dev libelf-dev clang llvm lld zstd curl python3

      - name: Download Neutron Clang
        run: |
          mkdir clang-neutron
          wget https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang-neutron
          echo "$GITHUB_WORKSPACE/clang-neutron/bin" >> $GITHUB_PATH

      - name: BPF Merge
        run: |
          rm -rf main/kernel/bpf main/include/linux/bpf* main/include/uapi/linux/bpf*
          cp -r bpf_source/kernel/bpf main/kernel/
          cp bpf_source/include/linux/bpf* main/include/linux/
          cp bpf_source/include/uapi/linux/bpf* main/include/uapi/linux/
          cp bpf_source/include/linux/filter.h main/include/linux/

      - name: Full Scrub Patching
        run: |
          cd main
          # Elimină KernelSU
          find . -name "Kconfig" -exec sed -i '/kernelsu/d' {} +
          find . -name "Makefile" -exec sed -i '/kernelsu/d' {} +
          
          # Fix Clang Arguments (Scrubbing common offenders)
          find . -type f -name "Makefile*" -exec sed -i 's/-implicit-function-declaration//g' {} +
          find . -type f -name "Makefile*" -exec sed -i 's/-Wunknown-warning-option//g' {} +
          find . -type f -name "Makefile*" -exec sed -i 's/=unknown-warning-option//g' {} +
          
          # Force assembly compatibility
          find arch/arm64 -name "*.S" -exec sed -i 's/\.inst\.w/.inst/g' {} +
          sed -i 's/prepare-compiler-check//g' Makefile

      - name: Build
        run: |
          cd main
          export ARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export LLVM=1
          export LLVM_IAS=0
          
          # Defconfig Fixes
          KCONFIG=arch/arm64/configs/r5q_defconfig
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/CONFIG_CC_STACKPROTECTOR_STRONG=n/g' $KCONFIG
          echo "CONFIG_BPF_SYSCALL=y" >> $KCONFIG
          echo "CONFIG_BPF_JIT=y" >> $KCONFIG

          make -j$(nproc --all) O=out r5q_defconfig
          make -j$(nproc --all) O=out 2>&1 | tee build.log

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-Royna-Full-Scrub
          path: |
            main/out/arch/arm64/boot/Image.gz-dtb
            main/build.log
