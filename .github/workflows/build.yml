name: R5Q Android 15 - Final BPF Fix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout LumiPlayground Source (rawr-bpf)
        uses: actions/checkout@v4
        with:
          repository: sh4dow6oy/android_kernel_samsung_sm8150
          ref: rawr-bpf
          fetch-depth: 1

      - name: Setup & Architecture Patch
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd bc build-essential gcc-aarch64-linux-gnu libssl-dev libelf-dev python3 python-is-python3
          sudo ln -sf /usr/bin/python3 /usr/bin/python2
          
          # 1. FIX RELOCATION (Rezolvă eroarea 'out of range' din LOG.txt)
          # Injectăm flag-ul mcmodel=large direct în Makefile-ul arhitecturii
          sed -i 's/KBUILD_CFLAGS   += -fno-pic/KBUILD_CFLAGS   += -fno-pic -mcmodel=large/g' arch/arm64/Makefile || true
          
          # 2. FIX Samsung Memory Boosting Inline Error
          sed -i 's/extern inline bool need_memory_boosting/extern bool need_memory_boosting/g' include/linux/mm.h
          
          # 3. FIX KVMALLOC (Compatibilitate BPF)
          if ! grep -q "kvmalloc" include/linux/mm.h; then
            echo -e "\n#include <linux/slab.h>\n#include <linux/vmalloc.h>\nstatic inline void *kvmalloc(size_t size, gfp_t flags)\n{\n\tif (size > PAGE_SIZE)\n\t\treturn vmalloc(size);\n\treturn kmalloc(size, flags);\n}\n" >> include/linux/mm.h
          fi
          
          # 4. FIX PYTHON (Reparăm wrapper-ul dacă există)
          if [ -f scripts/gcc-wrapper.py ]; then
            sed -i 's/print >> sys.stderr, \(.*\)/print(\1, file=sys.stderr)/g' scripts/gcc-wrapper.py
            sed -i 's/python/python3/g' scripts/gcc-wrapper.py
          fi
          
          # 5. Descărcare Neutron Toolchain
          mkdir clang-neutron
          wget https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang-neutron

      - name: Build Kernel (R5Q Config with Kallsyms Fix)
        run: |
          export PATH=$(pwd)/clang-neutron/bin:$PATH
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          KERNEL_LLVM_BIN=$(pwd)/clang-neutron/bin/clang
          CLANG_TRIPLE=aarch64-linux-gnu-
          
          # Fix headere Samsung hardcoded
          mkdir -p system/core/liblog/include/log/
          touch system/core/liblog/include/log/perflog.h

          # 1. Configurare
          make O=out ARCH=arm64 CROSS_COMPILE=$CROSS_COMPILE REAL_CC=$KERNEL_LLVM_BIN CLANG_TRIPLE=$CLANG_TRIPLE r5q_eur_open_defconfig
          
          # 2. FIX CRITIC PENTRU KALLSYMS (Elimină eroarea de link-uire din LOG.txt)
          # Dezactivăm adresele relative pentru a permite kernelului să fie mai mare
          ./scripts/config --file out/.config --disable KALLSYMS_BASE_RELATIVE
          ./scripts/config --file out/.config --disable KPROBES
          
          # Actualizăm fișierul .config
          make O=out ARCH=arm64 CROSS_COMPILE=$CROSS_COMPILE REAL_CC=$KERNEL_LLVM_BIN CLANG_TRIPLE=$CLANG_TRIPLE olddefconfig

          # 3. Compilare principală
          echo "--- START FINAL COMPILATION ---"
          make -j$(nproc --all) O=out ARCH=arm64 \
               CROSS_COMPILE=$CROSS_COMPILE \
               REAL_CC=$KERNEL_LLVM_BIN \
               CLANG_TRIPLE=$CLANG_TRIPLE \
               KCFLAGS="-w -mcmodel=large -Wno-error"

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3
          find out/arch/arm64/boot/ -name "Image.gz*" -exec cp {} AnyKernel3/ \;
          cd AnyKernel3 && zip -r9 ../R5Q-A15-BPF-Final.zip * -x .git README.md

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-R5Q-A15-Success
          path: R5Q-A15-BPF-Final.zip
