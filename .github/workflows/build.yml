name: R5Q - Android 15 Full Hybrid Build
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pascua28 Base (Source)
        uses: actions/checkout@v4
        with:
          repository: pascua28/android_kernel_samsung_sm7150
          ref: sixteen
          path: kernel

      - name: Checkout Roynas (Hardware Drivers)
        uses: actions/checkout@v4
        with:
          repository: Roynas-Android-Playground/kernel_samsung_r3q
          ref: master
          path: roynas_source

      - name: Sync Hardware Drivers (Transplant Roynas -> Pascua)
        run: |
          # 1. AUDIO: Înlocuim techpack-ul de audio cu cel de la Roynas (fix slow_insertion)
          rm -rf kernel/techpack/audio
          cp -r roynas_source/techpack/audio kernel/techpack/
          
          # 2. DISPLAY: Copiem headerele de panel lipsă
          cp roynas_source/drivers/gpu/drm/msm/sde/*.h kernel/drivers/gpu/drm/msm/sde/ 2>/dev/null || true
          
          # 3. TOUCHSCREEN: Înlocuim driverul de touch Samsung
          rm -rf kernel/drivers/input/touchscreen/sec_ts
          cp -r roynas_source/drivers/input/touchscreen/sec_ts kernel/drivers/input/touchscreen/
          
          # 4. UAPI: Sincronizăm headerele de display pentru utilizator
          mkdir -p kernel/include/uapi/display
          cp -r roynas_source/include/uapi/display/*.h kernel/include/uapi/display/ 2>/dev/null || true

      - name: Smart Config Merge & Fixes
        run: |
          cd kernel
          # 1. Baza: Config generic SM8150 + Fragment Sixteen
          cp arch/arm64/configs/vendor/sm8150_defconfig arch/arm64/configs/r5q_final_defconfig
          echo "" >> arch/arm64/configs/r5q_final_defconfig
          cat arch/arm64/configs/a71.config >> arch/arm64/configs/r5q_final_defconfig
          
          # 2. Injectăm specificul R5Q
          if [ -f "../roynas_source/arch/arm64/configs/r5q_defconfig" ]; then
            grep "CONFIG_PANEL_SAMSUNG" ../roynas_source/arch/arm64/configs/r5q_defconfig >> arch/arm64/configs/r5q_final_defconfig || true
            grep "CONFIG_TOUCHSCREEN_SAMSUNG" ../roynas_source/arch/arm64/configs/r5q_defconfig >> arch/arm64/configs/r5q_final_defconfig || true
            echo "CONFIG_MACH_SAMSUNG_R5Q=y" >> arch/arm64/configs/r5q_final_defconfig
          fi

          # 3. FIX CHIRURGICAL AUDIO (Rezolvă L1SS_AUDIO undeclared)
          # Definim L1SS_AUDIO ca 0 dacă lipsește, pentru a permite compilarea
          sed -i '1i #define L1SS_AUDIO 0' techpack/audio/asoc/msm-pcm-q6-noirq.c
          # Ștergem apelurile către funcțiile PCIe Samsung care nu există în baza asta
          sed -i 's/sec_pcie_l1ss_disable(L1SS_AUDIO);//g' techpack/audio/asoc/msm-pcm-q6-noirq.c
          sed -i 's/sec_pcie_l1ss_enable(L1SS_AUDIO);//g' techpack/audio/asoc/msm-pcm-q6-noirq.c

          # 4. FIX DISPLAY (Rezolvă fatal error: 'ss_dsi_panel_common.h' file not found)
          # Dacă fișierul lipsește, creăm un header gol sau îl simulăm pentru a nu opri procesul
          touch drivers/gpu/drm/msm/sde/ss_dsi_panel_common.h
          # Sau, dacă îl avem în roynas, îl forțăm (calea sigură):
          cp ../roynas_source/drivers/gpu/drm/msm/sde/ss_dsi_panel_common.h drivers/gpu/drm/msm/sde/ 2>/dev/null || true

          # 5. CONFIGURARE FINALA (BPF & Dezactivare Coresight GPU)
          ./scripts/config --file arch/arm64/configs/r5q_final_defconfig \
            --enable CONFIG_BPF \
            --enable CONFIG_BPF_SYSCALL \
            --enable CONFIG_BPF_JIT \
            --enable CONFIG_ANDROID_BINDERFS \
            --enable CONFIG_TECHPACK_AUDIO \
            --disable CONFIG_MSM_GPU_CORESIGHT \
            --disable CONFIG_SECURITY_SMACK \
            --disable CONFIG_SECURITY_SEL_FLASK_EXPORT \
            --disable CONFIG_SAMSUNG_PRODUCT_SHIP \
            --disable CONFIG_SEC_RESTRICT_FORK \
            --set-str CONFIG_LSM "lockdown,yama,loadpin,safesetid,selinux,bpf"

          # 6. FIX SEC_CLASS & TYPE-C
          sed -i 's/device_create(sec_class/device_create(NULL/g' drivers/input/touchscreen/sec_ts/y771/sec_ts_only_vendor.c 2>/dev/null || true
          [ -f "scripts/mod/devicetable-offsets.c" ] && sed -i 's/DEVID(typec_device_id);/\/\/DEVID(typec_device_id);/g' scripts/mod/devicetable-offsets.c || true

      - name: Setup Toolchain (NDK Clang)
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev zstd zip gcc-aarch64-linux-gnu
          mkdir -p clang
          wget -q https://github.com/Ylarod/setup-ndk-clang/releases/download/prebuilt/clang-linux-x86-ndk-r29-r563880c.tar.zst
          tar -I zstd -xf clang-linux-x86-ndk-r29-r563880c.tar.zst -C clang

      - name: Build Kernel Image
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export MAKE_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=0 CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LD=ld.lld O=out"
          
          make $MAKE_ARGS r5q_final_defconfig
          yes "" | make $MAKE_ARGS olddefconfig
          
          # Compilăm imaginea cu DTB concatenat
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-w" O=out Image.gz-dtb

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          
          cd AnyKernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          # S10 Lite specific block
          sed -i 's/block=\/dev\/block\/td/block=\/dev\/block\/by-name\/boot/g' anykernel.sh
          sed -i '/flash_dtbo/d' anykernel.sh
          
          zip -r9 ../Lumi-R5Q-A15-Hybrid.zip *

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-R5Q-A15
          path: Lumi-R5Q-A15-Hybrid.zip
