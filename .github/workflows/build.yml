name: S10 Lite (r5q) - Kernel 4.14 + Safe eBPF

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source (r5q)
        uses: actions/checkout@v4
        with:
          repository: mainey/android_kernel_samsung_r5q
          ref: lineage-19.0
          path: kernel

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex git make python3 \
            libssl-dev libelf-dev lz4 \
            gcc g++ wget tar

      - name: Setup Android GCC 4.9 (Samsung required)
        run: |
          mkdir -p kernel/toolchain/gcc/linux-x86/aarch64
          cd kernel/toolchain/gcc/linux-x86/aarch64

          wget -q https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/heads/master.tar.gz
          tar -xzf master.tar.gz

      - name: Configure kernel (r5q_eur_open + SAFE eBPF)
        run: |
          cd kernel

          export ARCH=arm64
          export CROSS_COMPILE=toolchain/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin/aarch64-linux-android-

          make r5q_eur_open_defconfig

          # ===== SAFE eBPF (4.14 compatible) =====
          scripts/config --enable CONFIG_BPF
          scripts/config --enable CONFIG_BPF_SYSCALL
          scripts/config --enable CONFIG_BPF_JIT
          scripts/config --enable CONFIG_HAVE_EBPF_JIT
          scripts/config --enable CONFIG_BPF_EVENTS
          scripts/config --enable CONFIG_CGROUP_BPF

          # ===== Disable unsupported / crashy features =====
          scripts/config --disable CONFIG_XDP_SOCKETS
          scripts/config --disable CONFIG_DEBUG_INFO_BTF
          scripts/config --disable CONFIG_BPF_LSM
          scripts/config --disable CONFIG_BPF_PRELOAD
          scripts/config --disable CONFIG_BPF_RAW_TRACEPOINTS
          scripts/config --disable CONFIG_FUNCTION_TRACER
          scripts/config --disable CONFIG_FTRACE_SYSCALLS

          make olddefconfig

      - name: Build kernel Image.gz-dtb
        run: |
          cd kernel

          export ARCH=arm64
          export CROSS_COMPILE=toolchain/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin/aarch64-linux-android-

          make -j$(nproc) Image.gz-dtb

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: r5q-kernel-4.14-ebpf-safe
          path: kernel/arch/arm64/boot/Image.gz-dtb
