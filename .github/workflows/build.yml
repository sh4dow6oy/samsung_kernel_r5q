name: Build Kernel r5q (S10 Lite) - Fix MMU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: 1. Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev wget zstd zip git python3 curl

      - name: 2. Checkout AOSP Base (SM8150 4.19)
        uses: actions/checkout@v4
        with:
          repository: sh4dow6oy/android_kernel_qcom_sm8150_419
          path: kernel
          fetch-depth: 1

      - name: 3. Setup Neutron Clang Toolchain
        run: |
          mkdir clang
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang
          echo "$(pwd)/clang/bin" >> $GITHUB_PATH

      - name: 4. Merge Config & Fix Header Errors
        run: |
          cd kernel
          git remote add samsung https://github.com/sh4dow6oy/kernel_samsung_r3q
          git fetch samsung master --depth=1
          git checkout samsung/master -- arch/arm64/configs/r5q_defconfig
          
          # REPARAȚIE MMU NOTIFIER (Eroarea ta): 
          # Forțăm includerea mmu_notifier.h să recunoască enum-ul corect
          sed -i 's/enum mmu_notifier_event event/int event/g' include/linux/mmu_notifier.h
          
          # Merge Config
          mkdir -p out
          ARCH=arm64 scripts/kconfig/merge_config.sh -O out/ \
            arch/arm64/configs/r5q_defconfig \
            arch/arm64/configs/defconfig

      - name: 5. Setup KernelSU
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main

      - name: 6. Build Process
        run: |
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          
          # Adăugăm -Wno-error pentru a trece de avertismentele stricte ale Neutron Clang
          KCFLAGS="-Wno-implicit-function-declaration -Wno-strict-prototypes -Wno-format -Wno-visibility"
          
          MAKE_PARAMS=(
              O=out
              CC=clang
              LD=ld.lld
              AR=llvm-ar
              NM=llvm-nm
              OBJCOPY=llvm-objcopy
              OBJDUMP=llvm-objdump
              STRIP=llvm-strip
              HOSTCC=gcc
              HOSTCXX=g++
              CROSS_COMPILE=aarch64-linux-gnu-
              CROSS_COMPILE_ARM32=arm-linux-gnueabi-
              LLVM=1
              LLVM_IAS=1
              KCFLAGS="$KCFLAGS"
          )

          # Activăm KernelSU și optimizări
          echo "CONFIG_KSU=y" >> out/.config
          echo "CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y" >> out/.config
          
          make "${MAKE_PARAMS[@]}" olddefconfig
          make -j$(nproc --all) "${MAKE_PARAMS[@]}"

      - name: 7. AnyKernel3 Packaging
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1
          find kernel/out/arch/arm64/boot/ -name "Image.gz-dtb" -exec cp {} AnyKernel3/ \; || \
          find kernel/out/arch/arm64/boot/ -name "Image.gz" -exec cp {} AnyKernel3/ \;
          
          cd AnyKernel3
          sed -i 's/device.name1=/device.name1=r5q/' anykernel.sh
          zip -r9 ../r5q-Fixed-Kernel.zip *

      - name: 8. Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-Fixed-Kernel
          path: r5q-Fixed-Kernel.zip
