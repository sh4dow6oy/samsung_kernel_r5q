name: Build R5Q Kernel - FULL FINAL

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: sh4dow6oy/android_kernel_samsung_sm7150
          ref: sixteen
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev \
          ccache python3 python-is-python3 libarchive-tools wget zstd zip \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libncurses-dev

      - name: Setup Clang 17
        run: |
          mkdir clang
          wget -q https://github.com/llvm/llvm-project/releases/download/llvmorg-17.0.6/clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz
          tar -xf clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz -C clang --strip-components=1

      - name: Fix Samsung Scripts
        run: |
          echo -e "#!/bin/bash\necho 0" > scripts/secgetspf
          chmod +x scripts/secgetspf

      - name: Add Sec Debug Compatibility Layer
        run: |
          mkdir -p include/linux
          cat << 'EOF' > include/linux/sec_debug_compat.h
          #pragma once

          #define initcall_sec_debug 0

          static inline int do_one_initcall_sec_debug(void *fn)
          {
              return 0;
          }

          static inline void sec_debug_sched_msg(const char *msg) {}
          static inline void sec_debug_summary_save_die_info(const char *str, void *regs) {}
          EOF

      - name: Add Minimal Dummy Symbols
        run: |
          mkdir -p drivers/misc
          cat << 'EOF' > drivers/misc/dummy_symbols.c
          #include <linux/kernel.h>

          void sec_debug_store_bug_string(const char *s) {}
          int sec_debug_is_enabled(void) { return 0; }
          int is_boot_recovery(void) { return 0; }

          void scsi_trace_parse_cdb() {}
          EOF

          echo 'obj-y += dummy_symbols.o' >> drivers/misc/Makefile

      - name: Build Kernel
        run: |
          set -e

          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export PATH="$GITHUB_WORKSPACE/scripts:$PATH"

          export KBUILD_BUILD_USER="Roynas"
          export KBUILD_BUILD_HOST="GitHub"

          export KCFLAGS="-include linux/sec_debug_compat.h"

          MAKE_ARGS="ARCH=arm64 \
            LLVM=1 LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            HOSTCC=gcc \
            HOSTLD=ld \
            AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            O=out"

          # CONFIG
          make $MAKE_ARGS r5q_defconfig

          ./scripts/config --file out/.config \
            -d CONFIG_SEC_DEBUG \
            -d CONFIG_USB_CONFIGFS \
            -d CONFIG_USB_G_ANDROID \
            -d CONFIG_SAMSUNG_BATTERY \
            -d CONFIG_MOTOR \
            -d CONFIG_ADSP_FACTORY \
            -e CONFIG_SECTION_MISMATCH_WARN_ONLY

          make $MAKE_ARGS olddefconfig

          # BUILD
          make -j4 $MAKE_ARGS Image.gz 2>&1 | tee build.log

      - name: Package AnyKernel3
        run: |
          if [ -f out/arch/arm64/boot/Image.gz ]; then
            git clone https://github.com/osm0sis/AnyKernel3.git
            cp out/arch/arm64/boot/Image.gz AnyKernel3/

            sed -i 's/device.name1=.*/device.name1=r5q/' AnyKernel3/anykernel.sh

            cd AnyKernel3
            zip -r9 ../Kernel-R5Q-FULL.zip *
          else
            echo "Build failed!"
            cat build.log
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-R5Q-FULL
          path: Kernel-R5Q-FULL.zip
