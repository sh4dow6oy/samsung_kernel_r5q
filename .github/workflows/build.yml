name: Build sh4dow6oy Kernel - R5Q (Android 15 Ready - 4.14.356)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Samsung Source
        uses: actions/checkout@v4
        with:
          repository: sh4dow6oy/kernel_samsung_r5q
          ref: master

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev \
          ccache python3 python-is-python3 libarchive-tools wget zstd libtinfo6 zip \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi device-tree-compiler rsync

      - name: Setup Neutron Clang
        run: |
          mkdir -p clang
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang

      - name: OpenELA Upstream & Android 15 Patches
        run: |
          # 1. Descarcă Upstream-ul final 4.14.356
          wget -q https://github.com/openela/kernel-lts/archive/refs/tags/v4.14.356-openela-rc1.tar.gz -O openela.tar.gz
          mkdir openela_src
          tar -xzf openela.tar.gz -C openela_src --strip-components=1
          rsync -av --ignore-existing openela_src/ .
          
          # 2. Ștergere conflicte Techpack (pentru succesul linkării vmlinux)
          rm -f techpack/devfreq/drivers/governor_bw_hwmon.c
          rm -f techpack/devfreq/drivers/governor_memlat.c
          
          # 3. Patch pentru Android 15 (eBPF & PSI Support)
          # Forțăm activarea PSI în codul sursă dacă lipsește
          sed -i 's/default n/default y/g' init/Kconfig | grep "config PSI" -A 5 || true
          
          # 4. Fix-uri chirurgicale (SCSI & Compat IOCTL)
          find . -type f -name "*.c" -exec sed -i 's/SCSI_IOCTL_GET_IDLUN/0x5382/g' {} +
          sed -i '1515,1525c\return 0;' fs/compat_ioctl.c
          sed -i '1630,1640c\return 0;' fs/compat_ioctl.c

          # 5. Samsung Stub Fix (Eroarea dma_contiguous)
          echo 'void dma_contiguous_early_fixup(void *res_cma) { }' > drivers/base/samsung_stub.c
          [ -f drivers/base/Makefile ] && echo 'obj-y += samsung_stub.o' >> drivers/base/Makefile
          
          # Restaurăm DTS-ul Samsung original pentru SM8150
          git checkout HEAD -- arch/arm64/boot/dts

      - name: Build Kernel for SM8150
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          MAKE_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- O=out"
          
          make $MAKE_ARGS r5q_defconfig
          
          # [CRITICAL] Configurări pentru Android 15
          ./scripts/config --file out/.config \
            -e CONFIG_SAMSUNG_PRODUCT_SHIP \
            -e CONFIG_BUILD_ARM64_DTB_IMAGE \
            -e CONFIG_PSI \
            -e CONFIG_BPF_SYSCALL \
            -e CONFIG_NETFILTER_XT_MATCH_BPF \
            -e CONFIG_CGROUP_BPF \
            -e CONFIG_MEMBARRIER \
            -d CONFIG_LTO -d CONFIG_LTO_CLANG -e CONFIG_LTO_NONE \
            -d CONFIG_WERROR -d CONFIG_DEVFREQ_GOV_BW_HWMON -d CONFIG_TARGET_CORE
            
          make $MAKE_ARGS olddefconfig
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-Wno-error -fcommon -Wno-implicit-function-declaration -Wno-sizeof-array-argument"
          make $MAKE_ARGS dtbs

      - name: Hardware Packaging (SM8150)
        run: |
          # Căutăm DTB-ul specific r5q (SM8150)
          DTB_FILE=$(find out/arch/arm64/boot/dts -name "sm8150-r5q*.dtb" | head -n 1)
          if [ -n "$DTB_FILE" ]; then
            cat out/arch/arm64/boot/Image.gz "$DTB_FILE" > out/arch/arm64/boot/Image.gz-dtb
            echo "SUCCESS: Image.gz-dtb generated for SM8150."
          fi
          
          # Generăm DTBO-ul Samsung
          MKDTBOIMG=$(find . -name "mkdtboimg.py" | head -n 1)
          DTBOS=$(find out/arch/arm64/boot/dts -name "*.dtbo")
          [ -n "$DTBOS" ] && [ -n "$MKDTBOIMG" ] && python3 $MKDTBOIMG create out/dtbo.img $DTBOS

      - name: AnyKernel3 (Android 15 Edition)
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          rm -rf AnyKernel3/.git
          
          # Folosim imaginea cu DTB concatenat
          [ -f out/arch/arm64/boot/Image.gz-dtb ] && cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/Image.gz
          [ -f out/dtbo.img ] && cp out/dtbo.img AnyKernel3/dtbo.img
          
          sed -i 's/device.name1=maguro/device.name1=r5q/g' AnyKernel3/anykernel.sh
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
          
          cd AnyKernel3 && zip -r9 ../Kernel-OpenELA-A15-R5Q.zip *

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-OpenELA-A15-R5Q
          path: Kernel-OpenELA-A15-R5Q.zip
