name: Build Roynas R5Q - Neutron Clang + OneUI 7 BPF ExtremeXT Patched
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: Roynas-Android-Playground/kernel_samsung_r3q
          ref: master
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc build-essential flex bison lz4 libssl-dev libelf-dev \
            ccache python3 python-is-python3 libarchive-tools wget zstd \
            libtinfo6 zip rsync gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi git

      - name: Setup Neutron Clang
        run: |
          mkdir clang
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang

      # 🔹 Clone ExtremeXT kernel for BPF
      - name: Clone ExtremeXT Kernel BPF Reference
        run: |
          git clone --depth=1 https://github.com/ExtremeXT/android_kernel_samsung_exynos9820.git xtremext

      # 🔹 Copy BPF subsystem and headers
      - name: Import ExtremeXT BPF Components
        run: |
          rsync -av xtremext/include/uapi/linux/bpf.h include/uapi/linux/
          rsync -av xtremext/include/linux/bpf*.h include/linux/
          rsync -av --exclude='*.o' xtremext/kernel/bpf/ kernel/bpf/

      # 🔹 Apply automatic patches for BPF 4.14 compatibility
      - name: Patch BPF minimal for 4.14
        run: |
          # Fix bpf_jit_blinding_enabled calls
          find kernel/bpf/ -type f -name "*.c" -exec sed -i 's/bpf_jit_blinding_enabled()/bpf_jit_blinding_enabled(prog)/g' {} +
          # Remove lines referencing expected_attach_type (not present in 4.14)
          sed -i '/expected_attach_type/d' kernel/bpf/syscall.c

      - name: Build Kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export KBUILD_BUILD_USER=Roynas
          export KBUILD_BUILD_HOST=GitHub
          export KBUILD_COMPILER_STRING="Neutron Clang OneUI7-BPF-XTREMXT-Patched"

          # Remove polly flags
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) \
            -exec sed -i 's/-mllvm -polly[^ ]*//g' {} +

          # Fix VDSO -static
          if [ -f arch/arm64/kernel/vdso/Makefile ]; then
            sed -i 's/\b-static\b//g' arch/arm64/kernel/vdso/Makefile
          fi

          # KernelSU safe disable
          sed -i '/kernelsu/d' drivers/android/Kconfig || true
          sed -i '/kernelsu/d' drivers/android/Makefile || true

          # Disable gcc wrapper
          sed -i 's/ifneq ($(wildcard $(srctree)\/scripts\/gcc-wrapper.py),)/ifeq (0,1)/g' Makefile

          MAKE_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=1 O=out"

          make $MAKE_ARGS r5q_defconfig

          # Enable BPF minimal + OneUI7 extra configs
          ./scripts/config --file out/.config \
            -e CONFIG_BPF \
            -e CONFIG_BPF_SYSCALL \
            -e CONFIG_BPF_JIT \
            -e CONFIG_HAVE_EBPF_JIT \
            -e CONFIG_CGROUP_BPF \
            -e CONFIG_NET_CLS_BPF \
            -e CONFIG_NET_ACT_BPF \
            -e CONFIG_FTRACE \
            -e CONFIG_FUNCTION_TRACER \
            -e CONFIG_DYNAMIC_FTRACE \
            -e CONFIG_UPROBE_EVENTS \
            -e CONFIG_KPROBE_EVENTS \
            -e CONFIG_NAMESPACES \
            -e CONFIG_CGROUPS \
            -e CONFIG_CGROUP_FREEZER \
            -e CONFIG_CGROUP_SCHED \
            -e CONFIG_USER_NS

          make $MAKE_ARGS olddefconfig

          # Compile kernel
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-Wno-error"

      - name: Package with AnyKernel3
        run: |
          IMAGE="$GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz-dtb"
          if [ ! -f "$IMAGE" ]; then
            IMAGE="$GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz"
          fi
          DTBO="$GITHUB_WORKSPACE/out/arch/arm64/boot/dtbo.img"

          git clone https://github.com/osm0sis/AnyKernel3.git
          rm -rf AnyKernel3/.git

          cp $IMAGE AnyKernel3/Image.gz
          [ -f "$DTBO" ] && cp $DTBO AnyKernel3/dtbo.img

          sed -i 's/^device.name1=.*/device.name1=r5q/' AnyKernel3/anykernel.sh
          sed -i 's/^device.name2=.*/device.name2=SM-G770F/' AnyKernel3/anykernel.sh
          sed -i 's/^device.name3=.*/device.name3=r5q/' AnyKernel3/anykernel.sh

          cd AnyKernel3
          zip -r9 ../Kernel-S10Lite-R5Q-OneUI7-BPF-XTREMXT-Final.zip *

      - name: Upload Flashable Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-S10Lite-R5Q-OneUI7-BPF-XTREMXT-Final
          path: Kernel-S10Lite-R5Q-OneUI7-BPF-XTREMXT-Final.zip
