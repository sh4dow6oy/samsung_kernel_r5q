name: Build R5Q - LineageOS V96 (Proton Clang Fix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout LineageOS SM8150
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_qcom_sm8150
          ref: lineage-20
          path: kernel

      - name: Maximize Build Space
        run: |
          sudo swapoff -a || true
          sudo dd if=/dev/zero of=/swapfile bs=1M count=8192
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Download Mainey EUR Defconfig
        run: |
          wget -O kernel/arch/arm64/configs/r5q_defconfig https://raw.githubusercontent.com/mainey/android_kernel_samsung_r5q/lineage-19.0/arch/arm64/configs/r5q_eur_open_defconfig

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc libssl-dev python3 bison flex libncurses6 libncurses-dev zstd git
          sudo ln -sf /usr/bin/python3 /usr/bin/python
          # Clone Proton Clang
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang-proton

      - name: vDSO Surgical Patch
        run: |
          cd kernel/arch/arm64/kernel/vdso
          # Redenumim simbolurile pentru a evita redefinirea în Clang
          sed -i 's/\bmemcpy\b/vdso_memcpy/g' *.[cS] || true
          sed -i 's/\bmemset\b/vdso_memset/g' *.[cS] || true
          sed -i 's/\bmemmove\b/vdso_memmove/g' *.[cS] || true
          # Fix anti-static în Makefile-ul vDSO
          sed -i 's/-static//g' Makefile || true

      - name: Build Kernel
        run: |
          cd kernel
          # Adăugăm toolchain-ul în PATH
          export PATH="$GITHUB_WORKSPACE/clang-proton/bin:$PATH"
          
          # Definim argumentele de build. Proton Clang folosește de obicei acest setup:
          MAKE_ARGS="ARCH=arm64 \
                     LLVM=1 \
                     LLVM_IAS=1 \
                     CC=clang \
                     LD=ld.lld \
                     AR=llvm-ar \
                     NM=llvm-nm \
                     OBJCOPY=llvm-objcopy \
                     OBJDUMP=llvm-objdump \
                     STRIP=llvm-strip \
                     CROSS_COMPILE=aarch64-linux-gnu- \
                     CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
                     O=out"
          
          # Configurare
          make $MAKE_ARGS r5q_defconfig
          ./scripts/config --file out/.config -d CONFIG_SAMSUNG_RTIC -d CONFIG_WERROR -d CONFIG_LTO_CLANG -d CONFIG_CFI_CLANG -e CONFIG_BUILD_ARM64_DT_OVERLAY
          make $MAKE_ARGS olddefconfig

          # Build propriu-zis
          make -j$(nproc --all) $MAKE_ARGS V=1 Image.gz dtbs \
            KCFLAGS="-w -fcommon -fno-builtin -D__NO_FORTIFY" \
            LDFLAGS="--allow-multiple-definition"

      - name: Assemble AnyKernel3
        run: |
          OUT="kernel/out/arch/arm64/boot"
          if [ -f "$OUT/Image.gz" ]; then
            git clone https://github.com/osm0sis/AnyKernel3.git AK3
            cp $OUT/Image.gz AK3/
            DTB=$(find $OUT/dts -name "*r5q*.dtb" -o -name "*sm8150*.dtb" | head -n 1)
            [ -f "$DTB" ] && cat $OUT/Image.gz $DTB > AK3/Image.gz
            find kernel/out -name "dtbo.img" -exec cp {} AK3/dtbo.img \;
            cd AK3 && zip -r9 ../R5Q_Proton_Fixed.zip *
          else
            echo "Build failed. Check the logs for vDSO or Path errors."
            exit 1
          fi

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-R5Q-Proton
          path: R5Q_Proton_Fixed.zip
