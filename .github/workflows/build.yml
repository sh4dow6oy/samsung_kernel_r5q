name: S10 Lite - Pascua Hybrid (API & Access Fix)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves make python3 lz4
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang

      - name: Apply Pascua eBPF 5.1 & BTF
        run: |
          git remote add linux-stable https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git || true
          git fetch linux-stable linux-5.1.y --depth=1
          PATHS=(
            "kernel/bpf/" 
            "include/linux/bpf.h" 
            "include/linux/filter.h" 
            "include/uapi/linux/bpf.h" 
            "include/uapi/linux/btf.h"
            "include/linux/btf.h"
            "include/linux/bpf-cgroup.h"
          )
          for path in "${PATHS[@]}"; do git checkout FETCH_HEAD -- "$path" || echo "Skip: $path"; done

      - name: Integration Patches (Shim Layer 2.0)
        run: |
          # 1. Fix access_ok mismatch (3 args in 4.14 vs 2 args in 5.1)
          # Injectăm un macro care ignoră tipul (de obicei VERIFY_READ/WRITE)
          sed -i '1i #define access_ok(addr, size) __range_ok((unsigned long)(addr), size)' kernel/bpf/syscall.c
          
          # 2. Neutralizare PERF_BPF_EVENT (lipsesc în 4.14)
          sed -i 's/PERF_BPF_EVENT_PROG_UNLOAD/0/g' kernel/bpf/syscall.c
          sed -i 's/PERF_BPF_EVENT_PROG_LOAD/0/g' kernel/bpf/syscall.c
          sed -i 's/perf_event_bpf_event/ (void) /g' kernel/bpf/syscall.c

          # 3. Fix struct bpf_raw_event_map (Forward declaration conflict)
          # Pascua dezactivează funcțiile de raw tracepoints dacă nu sunt suportate
          sed -i 's/btp->tp->name/""/g' kernel/bpf/syscall.c
          
          # 4. Fix cgroup_bpf_inherit & stub-uri
          if [ -f kernel/cgroup/cgroup.c ]; then
            sed -i 's/cgroup_bpf_inherit(root_cgrp)/cgroup_bpf_inherit(root_cgrp, NULL)/g' kernel/cgroup/cgroup.c
            sed -i 's/cgroup_bpf_inherit(cgrp)/cgroup_bpf_inherit(cgrp, NULL)/g' kernel/cgroup/cgroup.c
          fi

          # 5. Missing Headers Dummy
          mkdir -p include/linux/
          touch include/linux/bpf_lirc.h
          echo -e "#ifndef _LINUX_PERFLOG_H\n#define _LINUX_PERFLOG_H\n#endif" > include/linux/perflog.h

      - name: Build S10 Lite Hybrid
        run: |
          export PATH=$(pwd)/toolchain/proton-clang/bin:$PATH
          MAKE_ARGS="O=out ARCH=arm64 CC=clang HOSTCC=gcc HOSTCFLAGS='-Wno-deprecated-declarations' CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1"
          # Adăugăm -Wno-error pentru a lăsa linker-ul să decidă
          export KCFLAGS="-Wno-error -Wno-incompatible-pointer-types -Wno-implicit-function-declaration -Wno-return-type -Wno-typedef-redefinition"

          make $MAKE_ARGS r5q_eur_open_defconfig
          
          ./scripts/config --file out/.config --disable CONFIG_MODVERSIONS
          ./scripts/config --file out/.config --enable CONFIG_BPF_SYSCALL
          ./scripts/config --file out/.config --enable CONFIG_CGROUP_BPF
          ./scripts/config --file out/.config --disable CONFIG_SAMSUNG_PRODUCT_SHIP
          ./scripts/config --file out/.config --disable CONFIG_DEFEX
          
          make $MAKE_ARGS olddefconfig
          make -j$(nproc --all) $MAKE_ARGS Image.gz-dtb || make -j1 $MAKE_ARGS Image.gz-dtb

      - name: Upload Build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-A15-Hybrid-v4
          path: out/arch/arm64/boot/Image.gz-dtb

          make $MAKE_ARGS r5q_eur_open_defconfig
          
          # Dezactivăm mizeriile care cer semnături de module vechi
          ./scripts/config --file out/.config --disable CONFIG_MODVERSIONS
          ./scripts/config --file out/.config --enable CONFIG_BPF_SYSCALL
          ./scripts/config --file out/.config --enable CONFIG_CGROUP_BPF
          ./scripts/config --file out/.config --disable CONFIG_SAMSUNG_PRODUCT_SHIP
          ./scripts/config --file out/.config --disable CONFIG_DEFEX
          
          make $MAKE_ARGS olddefconfig
          make -j$(nproc --all) $MAKE_ARGS Image.gz-dtb || make -j1 $MAKE_ARGS Image.gz-dtb

      - name: Upload Build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-A15-Hybrid-v3
          path: out/arch/arm64/boot/Image.gz-dtb
          
