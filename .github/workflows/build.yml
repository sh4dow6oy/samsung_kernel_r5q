name: Build R5Q - Lumi BPF V42 (Kernel 5.4 Final Fix)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: sh4dow6oy/android_kernel_samsung_sm8150-5.4
          ref: master
          path: kernel

      - name: Install Build Essentials
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
          bc libssl-dev flex bison libelf-dev pahole zstd python3 llvm

      - name: Setup Neutron Clang
        run: |
          mkdir -p clang
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang

      - name: Build Kernel
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          
          # Argumente Build pentru LLVM
          MAKE_ARGS="ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            O=out"

          mkdir -p out

          # 1. Încărcăm baza defconfig
          make $MAKE_ARGS vendor/r5q_eur_open_defconfig

          # 2. Fuzionăm fragmentul Samsung (sm8150_sec_r5q_eur_open.config)
          # Aceasta este piesa lipsă care activează tot ce e specific S10 Lite EUR
          ./scripts/kconfig/merge_config.sh -O out out/.config arch/arm64/configs/vendor/sm8150_sec_r5q_eur_open.config

          # 3. Dezactivare Knox/Security (Esențial pentru ca BPF să ruleze)
          ./scripts/config --file out/.config \
            -d CONFIG_SAMSUNG_RTIC -d CONFIG_SAMSUNG_RTIC_AMP \
            -d CONFIG_SECURITY_DEFEX -d CONFIG_SECURITY_RKP \
            -d CONFIG_SAMSUNG_PRODUCT_SHIP \
            -d CONFIG_WERROR

          # 4. Finalizare Config
          make $MAKE_ARGS olddefconfig

          # 5. Compilare Image.gz și DTBs
          # DTC_FLAGS="-i" ignoră eroarea "slim_aud not found" (unresolved label)
          # LDFLAGS rezolvă segmentele Read-Only pentru bootloader-ul Samsung
          make -j$(nproc --all) $MAKE_ARGS Image.gz dtbs \
            KCFLAGS="-w -fcommon" \
            LDFLAGS="--no-rosegment --strip-debug" \
            DTC_FLAGS="-i"

      - name: Assemble AnyKernel3
        run: |
          OUT="kernel/out/arch/arm64/boot"
          IMAGE="$OUT/Image.gz"
          # Căutăm DTB-ul corect pentru r5q
          DTB=$(find $OUT/dts -name "*r5q*.dtb" -type f | head -n 1)
          
          git clone https://github.com/osm0sis/AnyKernel3.git AK3
          
          # Concatenăm Image.gz + DTB (Metoda standard pentru bootloader Samsung SM8150)
          if [ -f "$DTB" ]; then
            cat "$IMAGE" "$DTB" > AK3/Image.gz
          else
            echo "DTB not found, using only Image.gz"
            cp "$IMAGE" AK3/Image.gz
          fi
          
          cd AK3
          # Setăm numele dispozitivului în scriptul de instalare
          sed -i 's/device.name1=maguro/device.name1=r5q/g' anykernel.sh
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          zip -r9 ../S10Lite_5.4_Final_BPF.zip *

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-Lumi-Kernel
          path: S10Lite_5.4_Final_BPF.zip
