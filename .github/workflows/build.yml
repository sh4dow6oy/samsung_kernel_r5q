name: Build Roynas R5Q - Pascua eBPF Exact Sync
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: Roynas-Android-Playground/kernel_samsung_r3q
          ref: master
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev \
          ccache python3 python-is-python3 libarchive-tools wget zstd libtinfo6 zip git

      - name: Setup Neutron Clang
        run: |
          mkdir clang
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang

      - name: Exact eBPF Sync (Based on Pascua File List)
        run: |
          git config --global user.email "bot@github.com"
          git config --global user.name "Kernel-Builder"
          
          git remote add pascua https://github.com/pascua28/android_kernel_samsung_sm8250.git
          git fetch pascua sixteen --depth=1
          
          echo "Sincronizare fișiere confirmate din lista Pascua..."
          
          # 1. Folderele Core
          git checkout pascua/sixteen -- kernel/bpf/
          
          # 2. Toate headerele confirmate din include/linux/
          git checkout pascua/sixteen -- include/linux/bpf.h
          git checkout pascua/sixteen -- include/linux/bpf-cgroup.h
          git checkout pascua/sixteen -- include/linux/bpf-netns.h
          git checkout pascua/sixteen -- include/linux/bpf_lirc.h
          git checkout pascua/sixteen -- include/linux/bpf_local_storage.h
          git checkout pascua/sixteen -- include/linux/bpf_lsm.h
          git checkout pascua/sixteen -- include/linux/bpf_trace.h
          git checkout pascua/sixteen -- include/linux/bpf_types.h
          git checkout pascua/sixteen -- include/linux/bpf_verifier.h
          git checkout pascua/sixteen -- include/linux/bpfilter.h
          git checkout pascua/sixteen -- include/linux/filter.h
          
          # 3. UAPI Headers (Foarte importante pentru Android 12+)
          git checkout pascua/sixteen -- include/uapi/linux/bpf.h
          git checkout pascua/sixteen -- include/uapi/linux/bpf_common.h
          git checkout pascua/sixteen -- include/uapi/linux/filter.h
          
          # 4. Networking Core Fix
          git checkout pascua/sixteen -- net/core/filter.c
          
          # FIX: Curățare KernelSU (Prevenire eroare Kconfig)
          sed -i '/kernelsu/d' drivers/android/Kconfig || true
          sed -i '/kernelsu/d' drivers/android/Makefile || true
          
          git add .
          git commit -m "eBPF: Exact structural sync from Pascua" || echo "No changes"

      - name: Build Kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export KBUILD_BUILD_USER="Roynas"
          export KBUILD_BUILD_HOST="Neutron-CI"
          
          # Fix-uri Neutron & vDSO
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-mllvm -polly[^ ]*//g' {} +
          [ -f arch/arm64/kernel/vdso/Makefile ] && sed -i 's/-static//g' arch/arm64/kernel/vdso/Makefile

          MAKE_ARGS="ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            O=out"

          # Configurare r5q
          mkdir -p out
          make $MAKE_ARGS r5q_defconfig
          
          ./scripts/config --file out/.config \
            -e CONFIG_BPF -e CONFIG_BPF_SYSCALL -e CONFIG_BPF_JIT \
            -e CONFIG_HAVE_EBPF_JIT -e CONFIG_BPF_EVENTS \
            -e CONFIG_NET_CLS_BPF -e CONFIG_NET_ACT_BPF -e CONFIG_CGROUP_BPF \
            -e CONFIG_NET_SCH_INGRESS \
            -d CONFIG_LTO -d CONFIG_LTO_CLANG -e CONFIG_LTO_NONE \
            -d CONFIG_KNOX_KAP -d CONFIG_SECURITY_SAMSUNG_KNOX
            
          make $MAKE_ARGS olddefconfig

          # Compilare cu flag-uri de suprimare erori (Esential pentru Backport)
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-fcommon -Wno-error -Wno-implicit-function-declaration -Wno-unused-command-line-argument -Wno-incompatible-pointer-types -Wno-int-conversion -Wno-macro-redefined -Wno-typedef-redefinition -Wno-unused-but-set-variable -Wno-enum-conversion"

      - name: Package with AnyKernel3
        run: |
          IMAGE="$GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz-dtb"
          [ ! -f "$IMAGE" ] && IMAGE="$GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz"
          
          git clone https://github.com/osm0sis/AnyKernel3.git
          rm -rf AnyKernel3/.git
          cp $IMAGE AnyKernel3/Image.gz
          [ -f "$GITHUB_WORKSPACE/out/arch/arm64/boot/dtbo.img" ] && cp "$GITHUB_WORKSPACE/out/arch/arm64/boot/dtbo.img" AnyKernel3/dtbo.img
          
          sed -i 's/device.name1=maguro/device.name1=r5q/g' AnyKernel3/anykernel.sh
          cd AnyKernel3 && zip -r9 ../Kernel-R5Q-eBPF-Complete.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-S10Lite-R5Q
          path: Kernel-R5Q-eBPF-Complete.zip
