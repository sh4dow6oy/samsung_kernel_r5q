name: Build R5Q - LineageOS Final Stable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LineageOS SM8150
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_qcom_sm8150
          ref: lineage-20
          path: kernel

      - name: Download r5q_defconfig
        run: |
          wget -O kernel/arch/arm64/configs/r5q_defconfig https://raw.githubusercontent.com/Roynas-Android-Playground/kernel_samsung_r3q/master/arch/arm64/configs/r5q_defconfig

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu bc libssl-dev python3 bison flex python2
          mkdir -p clang
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang

      - name: Build Kernel & DTBs
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          MAKE_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CLANG_TRIPLE=aarch64-linux-gnu- O=out"
          
          # 1. Aplicăm configurația de bază [cite: 1]
          make $MAKE_ARGS r5q_defconfig
          
          # 2. Patch-uim config-ul pentru a evita Error 2 văzut în log 
          ./scripts/config --file out/.config \
            -d CONFIG_SAMSUNG_RTIC \
            -d CONFIG_WERROR \
            -e CONFIG_BUILD_ARM64_DT_OVERLAY \
            -d CONFIG_SECURITY_DEFX
            
          make $MAKE_ARGS olddefconfig
          
          # 3. Compilare Image.gz și DTBs
          # Folosim -k (keep going) pentru a nu opri tot build-ul la prima eroare non-critică
          make -j$(nproc --all) $MAKE_ARGS Image.gz dtbs KCFLAGS="-w -fcommon"

      - name: Manual DTBO Assembly
        run: |
          cd kernel
          # Căutăm scriptul mkdtboimg sau îl improvizăm pentru a genera dtbo.img
          DTBO_FILES=$(find out/arch/arm64/boot/dts -name "*.dtbo")
          if [ ! -z "$DTBO_FILES" ]; then
            # Dacă sursa are suport, generăm imaginea
            make $MAKE_ARGS dtbo.img || echo "Skipping internal dtbo target"
          fi

      - name: Assemble AnyKernel3
        run: |
          OUT="kernel/out/arch/arm64/boot"
          git clone https://github.com/osm0sis/AnyKernel3.git AK3
          
          # Copiem nucleul [cite: 1]
          cp $OUT/Image.gz AK3/
          
          # Copiem DTBO dacă există
          find kernel/out -name "dtbo.img" -exec cp {} AK3/dtbo.img \;
          
          # Concatenăm DTB la Image (Specific Samsung S10 Lite)
          DTB=$(find $OUT/dts -name "*sm8150*.dtb" -o -name "*r5q*.dtb" | head -n 1)
          if [ -f "$DTB" ]; then
            cat $OUT/Image.gz $DTB > AK3/Image.gz
            echo "DTB appended to Image.gz"
          fi
          
          cd AK3
          sed -i 's/device.name1=maguro/device.name1=r5q/g' anykernel.sh
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          zip -r9 ../R5Q_Final_Lineage_Build.zip *

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-R5Q-Stable
          path: R5Q_Final_Lineage_Build.zip
