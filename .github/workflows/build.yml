name: Build Roynas R5Q - Neutron Clang Final

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest # Folosim 24.04 pentru compatibilitate cu Neutron Clang
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: sh4dow6oy/android_kernel_qcom_sm8150_419
          ref: master
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev \
          ccache python3 python-is-python3 libarchive-tools wget zstd libtinfo6 zip \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libncurses5

      - name: Setup Neutron Clang
        run: |
          mkdir clang
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang

      - name: Build Kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export KBUILD_BUILD_USER="Roynas"
          export KBUILD_BUILD_HOST="GithubActions"

          # 1. FIX PENTRU EROAREA USBPD (ERR_PTR & ENODEV)
          # Aceasta a fost eroarea care a oprit compilarea anterior
          sed -i '1i #include <linux/err.h>' include/linux/usb/usbpd.h
          sed -i '1i #include <linux/errno.h>' include/linux/usb/usbpd.h

          # 2. FIX PENTRU DTC (Eroare yylloc specifică Ubuntu 24.04)
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' scripts/dtc/dtc-lexer.lex.c_shipped || true

          # 3. NUCLEAR CLEANUP
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-mllvm -polly[^ ]*//g' {} +
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-mllvm//g' {} +
          
          # 4. VDSO FIX (Previne erorile de linking static)
          if [ -f arch/arm64/kernel/vdso/Makefile ]; then
            sed -i 's/-static//g' arch/arm64/kernel/vdso/Makefile
          fi

          # 5. Argumente Build
          # Am adăugat HOSTCC/HOSTCXX pentru a rezolva eroarea de GLIBC
          MAKE_ARGS="ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            O=out"

          # 6. Configurare
          make $MAKE_ARGS r5q_defconfig
          
          # Dezactivăm LTO și Knox care pot cauza crash-uri la boot sau erori de compilare
          ./scripts/config --file out/.config \
            -d CONFIG_LTO -d CONFIG_LTO_CLANG -e CONFIG_LTO_NONE \
            -d CONFIG_CC_STACKPROTECTOR_STRONG -e CONFIG_CC_STACKPROTECTOR_NONE \
            -d CONFIG_SHADOW_CALL_STACK -d CONFIG_KNOX_KAP -d CONFIG_SECURITY_SAMSUNG_KNOX \
            -e CONFIG_SECTION_MISMATCH_WARN_ONLY
            
          make $MAKE_ARGS olddefconfig

          # 7. Compilare Propriu-zisă
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-fcommon -Wno-error -Wno-implicit-function-declaration -Wno-unknown-warning-option"

      - name: Package with AnyKernel3
        run: |
          IMAGE="$GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz-dtb"
          if [ ! -f "$IMAGE" ]; then
            IMAGE="$GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz"
          fi
          DTBO="$GITHUB_WORKSPACE/out/arch/arm64/boot/dtbo.img"
          
          git clone https://github.com/osm0sis/AnyKernel3.git
          rm -rf AnyKernel3/.git
          
          cp $IMAGE AnyKernel3/Image.gz
          [ -f "$DTBO" ] && cp $DTBO AnyKernel3/dtbo.img
          
          # Ajustăm anykernel.sh pentru S10 Lite (r5q)
          sed -i 's/device.name1=maguro/device.name1=r5q/g' AnyKernel3/anykernel.sh
          sed -i 's/device.name2=toroplus/device.name2=SM-G770F/g' AnyKernel3/anykernel.sh
          sed -i 's/device.name3=toro/device.name3=r5q/g' AnyKernel3/anykernel.sh
          
          cd AnyKernel3
          zip -r9 ../Kernel-S10Lite-R5Q-Neutron.zip *

      - name: Upload Flashable Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-S10Lite-R5Q
          path: Kernel-S10Lite-R5Q-Neutron.zip
