name: Lumi Kernel R5Q - BPF Phase 1.8 (Cgroup-BPF Sync)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: 1. Checkout Base (Roynas R3Q)
        uses: actions/checkout@v4
        with:
          repository: Roynas-Android-Playground/kernel_samsung_r3q
          ref: master
          fetch-depth: 0

      - name: 2. Upstream Merge BPF & Cgroup Logic (Pascua28)
        run: |
          git config --global user.email "gh-actions@github.com"
          git config --global user.name "GitHub Actions"
          
          git remote add pascua https://github.com/pascua28/android_kernel_samsung_sm7150.git
          git fetch pascua fifteen
          
          echo "--- Splicing BPF 5.4 & Cgroup-BPF Definitions ---"
          # 1. BPF Core & Verifier (Motorul)
          git checkout pascua/fifteen -- kernel/bpf/
          git checkout pascua/fifteen -- include/linux/bpf.h
          git checkout pascua/fifteen -- include/uapi/linux/bpf.h
          git checkout pascua/fifteen -- include/linux/bpf_verifier.h
          git checkout pascua/fifteen -- include/linux/filter.h
          
          # 2. CGROUP-BPF BRIDGE (Rezolvă eroarea refcnt și declarea statică)
          git checkout pascua/fifteen -- include/linux/bpf-cgroup.h
          git checkout pascua/fifteen -- include/uapi/linux/bpf_cgroup.h
          git checkout pascua/fifteen -- include/linux/cgroup.h
          git checkout pascua/fifteen -- include/linux/cgroup-defs.h
          
          # 3. TASK & SCHED SYNC (Rezolvă task->frozen)
          git checkout pascua/fifteen -- include/linux/sched.h
          git checkout pascua/fifteen -- include/linux/sched/task.h
          git checkout pascua/fifteen -- include/linux/sched/signal.h
          git checkout pascua/fifteen -- include/linux/sched/jobctl.h
          
          # 4. MEMORY MANAGEMENT & TYPES (Rezolvă vm_fault_t și pgtables_bytes)
          git checkout pascua/fifteen -- include/linux/mm.h
          git checkout pascua/fifteen -- include/linux/mm_types.h
          git checkout pascua/fifteen -- include/linux/mmzone.h
          git checkout pascua/fifteen -- include/linux/types.h
          
          # 5. NETWORK & LIRC (Rezolvă skb_metadata_len și missing headers)
          git checkout pascua/fifteen -- include/linux/skbuff.h
          git checkout pascua/fifteen -- include/linux/bpf_lirc.h || touch include/linux/bpf_lirc.h
          
          git add .
          git commit -m "BPF Phase 1.8: Sync bpf-cgroup bridge and task refs" || echo "No changes"

      - name: 3. Setup Neutron Clang & Path Fix (Assembler Fix)
        run: |
          sudo apt-get update && sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev wget zstd zip
          mkdir clang && wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang
          
          # Fix critic pentru eroarea -EL: Forțăm Integrated Assembler
          mkdir -p bin-force
          ln -sf $(pwd)/clang/bin/clang bin-force/as
          ln -sf $(pwd)/clang/bin/ld.lld bin-force/ld
          echo "$(pwd)/bin-force" >> $GITHUB_PATH

      - name: 4. Build & Verify BPF Subsystem
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/bin-force:$PATH"
          
          # FIX: Eliminăm referințele la KernelSU care blochează defconfig
          sed -i '/kernelsu/d' drivers/android/Kconfig || true
          sed -i '/kernelsu/d' drivers/android/Makefile || true
          
          # FIX: Curățăm flag-urile Polly/LTO incompatibile cu Neutron
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-mllvm -polly[^ ]*//g' {} +
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-mllvm//g' {} +
          
          MAKE_ARGS="ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            AS=clang \
            LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            O=out"

          # Generăm config-ul r5q
          make $MAKE_ARGS r5q_defconfig
          
          # Setări necesare pentru eBPF Android 15
          ./scripts/config --file out/.config \
            -e CONFIG_BPF_SYSCALL \
            -e CONFIG_BPF_JIT \
            -e CONFIG_BPF_EVENTS \
            -e CONFIG_CGROUP_BPF \
            -d CONFIG_CC_STACKPROTECTOR_STRONG \
            -e CONFIG_CC_STACKPROTECTOR_NONE \
            -d CONFIG_LOCALVERSION_AUTO
            
          make $MAKE_ARGS olddefconfig

          # COMPILARE SELECTIVĂ: Verificăm dacă subsistemul BPF trece de compilator
          echo "--- Compiling kernel/bpf/ to verify integration ---"
          make -j$(nproc --all) $MAKE_ARGS kernel/bpf/
