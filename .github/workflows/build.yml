name: S10 Lite - Safe Core eBPF Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout S10 Lite Kernel Source
        uses: actions/checkout@v4
        with:
          repository: sh4dow6oy/samsung_kernel_r5q
          path: kernel-res
          fetch-depth: 1

      - name: Setup Proton Clang Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves make python3 lz4
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang

      - name: Apply Core eBPF Patches from Pascua
        run: |
          mkdir -p kernel-res/include/linux
          mkdir -p kernel-res/include/uapi/linux
          mkdir -p kernel-res/kernel/bpf

          # Fișierele core eBPF și patch-urile minime
          cp -v ../pascua28/android_kernel_samsung_sm8250/tree/sixteen/kernel/bpf/core.c kernel-res/kernel/bpf/
          cp -v ../pascua28/android_kernel_samsung_sm8250/tree/sixteen/kernel/bpf/syscall.c kernel-res/kernel/bpf/
          cp -v ../pascua28/android_kernel_samsung_sm8250/tree/sixteen/include/linux/bpf.h kernel-res/include/linux/
          cp -v ../pascua28/android_kernel_samsung_sm8250/tree/sixteen/include/linux/btf.h kernel-res/include/linux/
          cp -v ../pascua28/android_kernel_samsung_sm8250/tree/sixteen/include/linux/tnum.h kernel-res/include/linux/
          cp -v ../pascua28/android_kernel_samsung_sm8250/tree/sixteen/include/uapi/linux/bpf.h kernel-res/include/uapi/linux/
          cp -v ../pascua28/android_kernel_samsung_sm8250/tree/sixteen/include/uapi/linux/btf.h kernel-res/include/uapi/linux/

          # Patch minime syscall.c (Pascua style)
          sed -i 's/access_ok(\([^,]*\), \([^)]*\))/access_ok(VERIFY_READ, \1, \2)/g' kernel-res/kernel/bpf/syscall.c
          sed -i 's/__cgroup_bpf_detach(cgrp, prog, type, flags)/__cgroup_bpf_detach(cgrp, prog, type)/g' kernel-res/kernel/bpf/syscall.c
          sed -i 's/cgroup_bpf_inherit(\([^,]*\), [^)]*)/cgroup_bpf_inherit(\1)/g' kernel-res/kernel/bpf/syscall.c
          sed -i '/struct xdp_buff/d' kernel-res/include/linux/bpf.h

      - name: Configure Kernel for Android 15
        run: |
          cd kernel-res
          export PATH=$(pwd)/../toolchain/proton-clang/bin:$PATH
          make ARCH=arm64 CC=clang r5q_eur_open_defconfig
          ./scripts/config --file .config --enable CONFIG_BPF_SYSCALL
          ./scripts/config --file .config --enable CONFIG_BPF_JIT
          ./scripts/config --file .config --enable CONFIG_CGROUP_BPF
          ./scripts/config --file .config --disable CONFIG_KPERFMON
          ./scripts/config --file .config --disable CONFIG_SAMSUNG_PRODUCT_SHIP
          make ARCH=arm64 CC=clang olddefconfig

      - name: Build Kernel
        run: |
          cd kernel-res
          MAKE_ARGS="ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1"
          export KCFLAGS="-Wno-error -Wno-incompatible-pointer-types -Wno-int-conversion -Wno-implicit-function-declaration -Wno-unused-variable -Wno-unused-function"
          make -j$(nproc --all) $MAKE_ARGS Image.gz-dtb || make -j1 $MAKE_ARGS Image.gz-dtb

      - name: Upload Kernel Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-Android15-eBPF-Safe
          path: kernel-res/arch/arm64/boot/Image.gz-dtb
