name: Build r5q Kernel - eBPF Final Force

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi git libssl-dev python3 clang llvm lld

      - name: Clone Mainey Kernel
        run: |
          git clone --depth=100 https://github.com/mainey/android_kernel_samsung_r5q.git -b lineage-19.0 kernel
          cd kernel
          git config user.email "wizard@build.com"
          git config user.name "Kernel-Wizard"

      - name: Apply eBPF Logic (Safe Patching)
        run: |
          cd kernel
          # Luăm patch-ul de eBPF de la LineageOS
          git fetch https://github.com/LineageOS/android_kernel_samsung_sm7125 refs/changes/79/387879/1
          
          # În loc de checkout (care suprascrie tot), încercăm să aplicăm doar diferențele
          # Dacă cherry-pick eșuează, forțăm doar fișierele de rețea care NU au duplicate în kernel/bpf/
          git cherry-pick FETCH_HEAD -X theirs || {
            echo "Conflict detectat, aplicăm doar patch-urile esențiale..."
            git checkout FETCH_HEAD -- net/core/filter.c
            git add .
            git cherry-pick --continue --no-edit || echo "Skipping problematic commits"
          }

      - name: Patch Header Duplicates
        run: |
          cd kernel
          # REZOLVARE REDEFINIRE: Ștergem manual definițiile duplicat din header-ul UAPI 
          # dacă acestea sunt deja prezente în structurile interne ale kernelului
          sed -i '/struct bpf_line_info {/,/};/d' include/uapi/linux/bpf.h
          sed -i '/struct bpf_func_info {/,/};/d' include/uapi/linux/bpf.h
          
          # Fix BPF_OBJ_NAME_LEN
          sed -i '/#define _UAPI__LINUX_BPF_H/a #ifndef BPF_OBJ_NAME_LEN\n#define BPF_OBJ_NAME_LEN 16U\n#endif' include/uapi/linux/bpf.h

          # Fix Samsung Debug & secgetspf
          sed -i 's/sec_debug_sched_msg/\/\/ sec_debug_sched_msg/g' arch/arm64/kernel/traps.c
          echo -e "#!/bin/sh\necho '00000000000000000000000000000000'\nexit 0" > secgetspf
          chmod +x secgetspf

      - name: Configure and Build
        run: |
          cd kernel
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export PATH=$PATH:$(pwd)

          mkdir -p out
          make O=out ARCH=arm64 r5q_eur_open_defconfig
          
          # Forțăm activarea BPF în config
          scripts/config --file out/.config -e BPF -e BPF_SYSCALL -e BPF_JIT -e CGROUP_BPF -e NETFILTER_XT_MATCH_BPF
          scripts/config --file out/.config --set-val NR_CPUS 8
          scripts/config --file out/.config -d SEC_DEBUG
          
          yes "" | make O=out ARCH=arm64 oldconfig
          
          # BUILD: Adăugăm flag-uri pentru a ignora DECLARAȚIILE DUPLICATE și REDEFINIRILE
          # -Wno-implicit-function-declaration: ignoră funcțiile lipsă
          # -fcommon: rezolvă multiplele definiții de variabile globale
          make -j$(nproc --all) O=out ARCH=arm64 \
            LD=ld.lld \
            KCFLAGS="-Wno-error -Wno-implicit-function-declaration -fcommon -DNR_CPUS=8"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-r5q-eBPF-Final
          path: |
            kernel/out/arch/arm64/boot/Image.gz-dtb
            kernel/out/arch/arm64/boot/dtbo.img
