name: Samsung SM8150 Kernel Build (Neutron Clang)

on:
  workflow_dispatch: # Permite pornirea manuală din interfața GitHub

jobs:
  build_kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          # Repository-ul tău cu sursele kernel
          repository: sh4dow6oy/android_kernel_samsung_sm8150-5.4
          path: kernel
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libncurses-dev git zstd

      - name: Download & Extract Neutron Clang (10032024)
        run: |
          mkdir neutron
          # Descarcă versiunea specificată de tine
          wget https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C neutron/

      - name: Compile Kernel
        run: |
          cd kernel
          
          # Setăm calea către binarele Neutron
          export PATH=$GITHUB_WORKSPACE/neutron/bin:$PATH
          
          # Exportăm variabilele de mediu pentru compilare
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          export AR=llvm-ar
          export LD=ld.lld
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          # 1. Crearea fișierului .config
          make O=out vendor/b2q_eur_openx_defconfig

          # 2. REPARARE ERORI: Forțăm ignorarea Section Mismatch și alte blocaje tipice Samsung
          sed -i 's/CONFIG_SECTION_MISMATCH_WARN_ONLY is not set/CONFIG_SECTION_MISMATCH_WARN_ONLY=y/g' out/.config
          echo "CONFIG_SECTION_MISMATCH_WARN_ONLY=y" >> out/.config
          
          # 3. Compilarea propriu-zisă
          # LLVM=1 și LLVM_IAS=1 asigură folosirea setului complet de unelte Neutron
          make -j$(nproc --all) O=out \
                      ARCH=arm64 \
                      CC=clang \
                      LLVM=1 \
                      LLVM_IAS=1 \
                      KCFLAGS="-Wno-error -w" \
                      HOSTCFLAGS="-Wno-error" \
                      HOSTCXXFLAGS="-Wno-error"

      - name: Verify Output
        run: |
          # Verificăm dacă fișierele au fost generate înainte de upload
          echo "Verificăm prezența fișierelor bootabile..."
          ls -l kernel/out/arch/arm64/boot/Image.gz-dtb || echo "Image.gz-dtb LIPSEȘTE!"
          ls -l kernel/out/arch/arm64/boot/dtbo.img || echo "DTBO LIPSEȘTE!"

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-SM8150-Neutron
          path: |
            kernel/out/arch/arm64/boot/Image.gz-dtb
            kernel/out/arch/arm64/boot/Image
            kernel/out/arch/arm64/boot/dtbo.img
            kernel/out/.config
