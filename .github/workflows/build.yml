name: S10 Lite - OneUI 7 Ready v33

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source (Pascua28 v4.0)
        uses: actions/checkout@v4
        with:
          repository: pascua28/android_kernel_samsung_sm7150
          ref: v4.0
          fetch-depth: 1

      - name: Setup Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves make python3 lz4 perl
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang

      - name: Kernel Customization & Fixes
        run: |
          # 1. Identitate Kernel (Va apărea în Setări -> Despre Telefon)
          sed -i 's/CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-OneUI7-v33"/g' arch/arm64/configs/r5q_eur_open_defconfig

          # 2. Samsung Security Bypass (Esențial pentru boot pe OneUI custom/Android 15)
          ./scripts/config --file arch/arm64/configs/r5q_eur_open_defconfig --disable CONFIG_RTIC
          ./scripts/config --file arch/arm64/configs/r5q_eur_open_defconfig --disable CONFIG_SECURITY_DEFEX
          ./scripts/config --file arch/arm64/configs/r5q_eur_open_defconfig --disable CONFIG_SECURITY_RTIC
          
          # 3. Asigurare eBPF (Pascua v4.0 le are, dar forțăm pentru siguranță)
          ./scripts/config --file arch/arm64/configs/r5q_eur_open_defconfig --enable CONFIG_BPF_SYSCALL
          ./scripts/config --file arch/arm64/configs/r5q_eur_open_defconfig --enable CONFIG_BPF_JIT

      - name: Build Kernel
        run: |
          export PATH=$(pwd)/toolchain/proton-clang/bin:$PATH
          MAKE_ARGS="O=out ARCH=arm64 CC=clang HOSTCC=gcc CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1"
          
          # KCFLAGS optimizate pentru Clang/Proton
          export KCFLAGS="-Wno-error -fno-pic -fno-strict-aliasing"

          make $MAKE_ARGS r5q_eur_open_defconfig
          
          # Fix pentru scriptul de securitate Samsung în timpul compilării
          mkdir -p out/scripts
          echo -e "#!/bin/bash\necho 0" > out/scripts/secgetspf
          chmod +x out/scripts/secgetspf
          
          make $MAKE_ARGS olddefconfig
          make -j$(nproc --all) $MAKE_ARGS Image.gz-dtb

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-OneUI7-v33-Final
          path: out/arch/arm64/boot/Image.gz-dtb
