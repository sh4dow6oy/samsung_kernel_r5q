name: S10 Lite (V23 - Full Pure Build Fix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Your Kernel Source
        uses: actions/checkout@v4
        with:
          repository: sh4dow6oy/samsung_kernel_r5q
          ref: master
          fetch-depth: 1

      - name: Setup Build Cache
        uses: actions/cache@v4
        with:
          path: |
            clang
            out
          key: ${{ runner.os }}-r5q-v23-${{ hashFiles('arch/arm64/configs/g770f_defconfig') }}
          restore-keys: |
            ${{ runner.os }}-r5q-v23-

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex git libssl-dev libelf-dev clang llvm lld zstd curl python3 device-tree-compiler

      - name: Download Neutron Clang (Cached)
        run: |
          if [ ! -d "clang/bin" ]; then
            mkdir -p clang
            wget https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
            tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang
          fi

      - name: Build Kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          
          MAKE_ARGS="ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            DTC=dtc \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            O=out"

          # 1. Curățăm Makefile-ul de mizeriile Samsung (secgetspf)
          # Acesta este motivul pentru care primeai "No such file or directory"
          sed -i 's/$(shell secgetspf)//g' Makefile || true
          sed -i 's/$(shell secgetspf)//g' arch/arm64/Makefile || true

          # 2. Generăm .config din sursa ta
          make $MAKE_ARGS g770f_defconfig

          # 3. Rezolvăm eroarea CONFIG_CC_STACKPROTECTOR_STRONG
          # Clang are nevoie de flag-uri diferite sau de dezactivare pentru a trece de check
          ./scripts/config --file out/.config \
            -d CONFIG_CC_STACKPROTECTOR_STRONG \
            -e CONFIG_CC_STACKPROTECTOR_NONE \
            -d CONFIG_CC_WERROR

          # Aplicăm schimbările în config
          make $MAKE_ARGS olddefconfig

          # 4. Compilare efectivă
          # Folosim KCFLAGS pentru a ignora stack-protector-ul la nivel de compiler check
          make -j$(nproc --all) $MAKE_ARGS \
            KCFLAGS="-fcommon -fno-stack-protector -Wno-error -Wno-implicit-function-declaration" \
            2>&1 | tee build.log

      - name: Package with AnyKernel3
        if: success()
        run: |
          git clone https://github.com/osm0sis/AnyKernel3
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/ || echo "No Image found"
          cp out/arch/arm64/boot/dtbo.img AnyKernel3/ || echo "No DTBO found"
          
          cd AnyKernel3
          sed -i 's/device.name1=maguro/device.name1=r5q/' anykernel.sh
          sed -i 's/device.name2=toroplus/device.name2=SM-G770F/' anykernel.sh
          # Setăm calea corectă pentru boot block pe Snapdragon 855
          sed -i 's|block=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot|block=/dev/block/bootdevice/by-name/boot|' anykernel.sh
          
          zip -r ../S10Lite-G770F-V23.zip *

      - name: Upload Kernel Zip
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-Build-V23
          path: |
            S10Lite-G770F-V23.zip
            build.log
