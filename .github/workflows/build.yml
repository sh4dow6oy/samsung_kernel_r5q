name: Build R5Q - LineageOS V87 (Final vDSO Stand)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LineageOS SM8150
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_qcom_sm8150
          ref: lineage-20
          path: kernel

      - name: Maximize Build Space & Swap
        run: |
          sudo swapoff -a || true
          sudo dd if=/dev/zero of=/swapfile bs=1M count=4096
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Download Mainey EUR Defconfig
        run: |
          wget -O kernel/arch/arm64/configs/r5q_defconfig https://raw.githubusercontent.com/mainey/android_kernel_samsung_r5q/lineage-19.0/arch/arm64/configs/r5q_eur_open_defconfig

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu gcc-arm-linux-gnueabi bc libssl-dev python3 bison flex libncurses6 libncurses-dev zstd
          sudo ln -sf /usr/bin/python3 /usr/bin/python
          mkdir -p clang
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang

      - name: Surgical Patching
        run: |
          cd kernel
          # Patch Makefile vDSO - Injectăm flag-urile de eroare direct în variabila de compilare a vDSO
          VDSO_MAKE="arch/arm64/kernel/vdso/Makefile"
          if [ -f "$VDSO_MAKE" ]; then
            echo "Injecting flags into $VDSO_MAKE"
            # Adăugăm flag-urile la începutul fișierului pentru a fi sigur că sunt luate în calcul
            sed -i '1i ccflags-y := -fno-builtin -fno-builtin-memcpy -fno-builtin-memset -fno-builtin-memmove' "$VDSO_MAKE"
            sed -i 's/-Werror//g' "$VDSO_MAKE"
          fi

          # Patch surse vDSO - căutăm în tot subdirectorul de arhitectură
          echo "Patching vDSO source files..."
          find arch/arm64/kernel/vdso -type f -name "*.[chS]" -exec sed -i 's/\bmemmove\b/vdso_memmove/g' {} +
          find arch/arm64/kernel/vdso -type f -name "*.[chS]" -exec sed -i 's/\bmemcpy\b/vdso_memcpy/g' {} +
          find arch/arm64/kernel/vdso -type f -name "*.[chS]" -exec sed -i 's/\bmemset\b/vdso_memset/g' {} +

      - name: Build Kernel
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          MAKE_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=0 CC=clang LD=ld.lld CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CLANG_TRIPLE=aarch64-linux-gnu- O=out"
          
          make $MAKE_ARGS r5q_defconfig
          ./scripts/config --file out/.config -d CONFIG_SAMSUNG_RTIC -d CONFIG_WERROR -d CONFIG_LTO_CLANG -d CONFIG_CFI_CLANG -e CONFIG_BUILD_ARM64_DT_OVERLAY
          make $MAKE_ARGS olddefconfig

          (while true; do echo "[KEEP-ALIVE] Building... RAM: $(free -m | awk '/^Mem:/{print $3}')MB"; sleep 60; done) &

          make -j$(nproc --all) $MAKE_ARGS V=1 Image.gz dtbs \
            KCFLAGS="-w -fcommon -fno-builtin -D__NO_FORTIFY -D__LINUX_ARM_ARCH__=8" \
            LDFLAGS="--allow-multiple-definition --defsym=__aeabi_unwind_cpp_pr0=0 --defsym=__aeabi_unwind_cpp_pr1=0"

      - name: Assemble
        run: |
          OUT="kernel/out/arch/arm64/boot"
          git clone https://github.com/osm0sis/AnyKernel3.git AK3
          if [ -f "$OUT/Image.gz" ]; then
            cp $OUT/Image.gz AK3/
            DTB=$(find $OUT/dts -name "*r5q*.dtb" -o -name "*sm8150*.dtb" | head -n 1)
            [ -f "$DTB" ] && cat $OUT/Image.gz $DTB > AK3/Image.gz
            find kernel/out -name "dtbo.img" -exec cp {} AK3/dtbo.img \;
            cd AK3 && zip -r9 ../R5Q_Build_V87.zip *
          else
            echo "Build failed. See logs above for vDSO/linker errors."
            exit 1
          fi

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-R5Q-V87
          path: R5Q_Build_V87.zip
