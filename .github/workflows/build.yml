name: Merge LineageOS Patch & Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Samsung Source
        uses: actions/checkout@v4
        with:
          repository: sh4dow6oy/kernel_samsung_r5q
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

      - name: Fetch and Apply LineageOS Patch
        run: |
          # Adăugăm remote-ul LineageOS pentru SM7125
          git remote add lineage https://github.com/LineageOS/android_kernel_samsung_sm7125 || true
          
          # Luăm schimburile de pe Gerrit (review.lineageos.org)
          # Folosim referința specifică pentru commit-ul 469879
          git fetch https://review.lineageos.org/LineageOS/android_kernel_samsung_sm7125 refs/changes/79/469879/1
          
          echo "Aplicăm patch-ul LineageOS..."
          # Aplicăm modificările. Dacă sunt conflicte, folosim strategia de a păstra ce avem, dar commit-ul acesta e de obicei curat.
          git cherry-pick FETCH_HEAD || (git cherry-pick --abort && echo "Cherry-pick eșuat, probabil patch-ul este deja aplicat sau incompatibil")

      - name: Disable Samsung Security (KNP/RKP)
        run: |
          DEFCONFIG="arch/arm64/configs/r5q_defconfig"
          sed -i 's/CONFIG_KNP=y/CONFIG_KNP=n/g' $DEFCONFIG
          sed -i 's/CONFIG_RKP=y/CONFIG_RKP=n/g' $DEFCONFIG
          sed -i 's/CONFIG_SEC_RESTRICT_FORK=y/CONFIG_SEC_RESTRICT_FORK=n/g' $DEFCONFIG

      - name: Setup Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang clang-llvm

      - name: Build Kernel
        run: |
          export PATH=$(pwd)/clang-llvm/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          
          mkdir -p out
          make O=out r5q_defconfig
          
          make -j$(nproc --all) O=out \
               CC=clang \
               CLANG_TRIPLE=aarch64-linux-gnu- \
               CROSS_COMPILE=aarch64-linux-gnu- \
               CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
               LLVM=1 LLVM_IAS=1

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: r5q-Lineage-Patched
          path: out/arch/arm64/boot/Image.gz-dtb
