name: Build R5Q - LineageOS V67 (EUR Stable)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LineageOS SM8150
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_qcom_sm8150
          ref: lineage-20
          path: kernel

      - name: Download Correct Defconfig
        run: |
          # Descarcă r5q_eur_open_defconfig și îl pregătește
          wget -O kernel/arch/arm64/configs/r5q_defconfig https://raw.githubusercontent.com/mainey/android_kernel_samsung_r5q/lineage-19.0/arch/arm64/configs/r5q_eur_open_defconfig

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu bc libssl-dev python3 bison flex libncurses6 libncurses-dev
          
          # Fix-uri biblioteci pentru compatibilitate unelte build
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libncurses.so.6 /usr/lib/x86_64-linux-gnu/libncurses.so.5
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5
          sudo ln -sf /usr/bin/python3 /usr/bin/python

          mkdir -p clang
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang

      - name: Build Kernel
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          # Reducem numărul de job-uri la nproc-1 pentru a evita OOM (Out of Memory) la linkarea WLAN
          JOBS=$(($(nproc) - 1))
          MAKE_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CLANG_TRIPLE=aarch64-linux-gnu- O=out"
          
          make $MAKE_ARGS r5q_defconfig
          
          # Dezactivăm protecțiile care cauzează Error 2 la linkarea finală
          ./scripts/config --file out/.config \
            -d CONFIG_SAMSUNG_RTIC \
            -d CONFIG_WERROR \
            -e CONFIG_BUILD_ARM64_DT_OVERLAY \
            -d CONFIG_LTO_CLANG \
            -d CONFIG_CFI_CLANG \
            -d CONFIG_DEBUG_SECTION_MISMATCH
            
          make $MAKE_ARGS olddefconfig
          
          # Compilare cu flag-uri de toleranță pentru linker
          # --allow-multiple-definition rezolvă conflictele din qcacld-3.0
          make -j$JOBS $MAKE_ARGS Image.gz dtbs \
            KCFLAGS="-w -fcommon" \
            LDFLAGS="--allow-multiple-definition --no-fatal-warnings"

      - name: Assemble AnyKernel3
        run: |
          OUT="kernel/out/arch/arm64/boot"
          git clone https://github.com/osm0sis/AnyKernel3.git AK3
          
          if [ -f "$OUT/Image.gz" ]; then
            cp $OUT/Image.gz AK3/
            
            # Concatenare DTB (esențial pentru bootloader-ul Samsung EUR)
            DTB=$(find $OUT/dts -name "*sm8150*.dtb" -o -name "*r5q*.dtb" | head -n 1)
            [ -f "$DTB" ] && cat $OUT/Image.gz $DTB > AK3/Image.gz
            
            # Preluare DTBO
            find kernel/out -name "dtbo.img" -exec cp {} AK3/dtbo.img \;
            
            cd AK3
            sed -i 's/device.name1=maguro/device.name1=r5q/g' anykernel.sh
            sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
            zip -r9 ../R5Q_Lineage20_EUR_V67.zip *
          else
            echo "Eroare: Imaginea kernel nu a fost creată. Verifică log-ul de linkare."
            exit 1
          fi

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-R5Q-V67
          path: R5Q_Lineage20_EUR_V67.zip
