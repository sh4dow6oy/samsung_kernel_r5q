name: Build R5Q - Lumi BPF V42 (Kernel 5.4 Final)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: sh4dow6oy/android_kernel_samsung_sm8150-5.4
          ref: master
          path: kernel

      - name: Install Build Essentials
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
          bc libssl-dev flex bison libelf-dev pahole zstd python3 llvm

      - name: Setup Neutron Clang
        run: |
          mkdir -p clang
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang

      - name: Build Kernel
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          
          MAKE_ARGS="ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            O=out"

          mkdir -p out

          # Pasul crucial: Încărcăm config-ul din folderul vendor
          # Kbuild va căuta automat în arch/arm64/configs/vendor/
          make $MAKE_ARGS vendor/sm8150_sec_r5q_eur_open.config

          # Curățăm setările Samsung care pot intra în conflict cu BPF
          ./scripts/config --file out/.config \
            -d CONFIG_SAMSUNG_RTIC -d CONFIG_SAMSUNG_RTIC_AMP \
            -d CONFIG_SECURITY_DEFEX -d CONFIG_SECURITY_RKP \
            -d CONFIG_SAMSUNG_PRODUCT_SHIP \
            -d CONFIG_WERROR

          # Validăm noul .config generat
          make $MAKE_ARGS olddefconfig

          # Compilare Image.gz și Device Tree Blobs
          # Adăugăm LDFLAGS pentru a rezolva problemele de linker pe Samsung
          make -j$(nproc --all) $MAKE_ARGS Image.gz dtbs \
            KCFLAGS="-w -fcommon" \
            LDFLAGS="--no-rosegment --strip-debug"

      - name: Assemble AnyKernel3
        run: |
          OUT="kernel/out/arch/arm64/boot"
          IMAGE="$OUT/Image.gz"
          # Căutăm DTB-ul generat pentru r5q
          DTB=$(find $OUT/dts -name "*r5q*.dtb" -type f | head -n 1)
          
          git clone https://github.com/osm0sis/AnyKernel3.git AK3
          
          # Combinăm Kernel-ul cu DTB-ul pentru bootloader-ul S10 Lite
          if [ -f "$DTB" ]; then
            cat "$IMAGE" "$DTB" > AK3/Image.gz
          else
            cp "$IMAGE" AK3/Image.gz
          fi
          
          cd AK3
          # Configurăm scriptul de instalare pentru r5q
          sed -i 's/device.name1=maguro/device.name1=r5q/g' anykernel.sh
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          zip -r9 ../S10Lite_5.4_Lumi_V42.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-5.4-Final
          path: S10Lite_5.4_Lumi_V42.zip
