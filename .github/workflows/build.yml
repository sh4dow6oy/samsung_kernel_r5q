name: S10 Lite - LineageOS Upstream Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves libncurses-dev git wget make python2 python3 pahole tar xz-utils lib32z1

      - name: Setup Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang
          echo "PROTON_PATH=$(pwd)/toolchain/proton-clang/bin" >> $GITHUB_ENV

      - name: Fetch LineageOS Kernel Source
        run: |
          # Clonăm doar ultimul commit pentru viteză (--depth=1)
          git clone --depth=1 https://github.com/LineageOS/android_kernel_qcom_sm8150.git kernel_source
          
      - name: Sync Samsung Config
        run: |
          # Copiem defconfig-ul tău din sursa actuală în sursa LineageOS
          # Presupunem că defconfig-ul tău este în arch/arm64/configs/r5q_eur_open_defconfig
          mkdir -p kernel_source/arch/arm64/configs/
          cp arch/arm64/configs/r5q_eur_open_defconfig kernel_source/arch/arm64/configs/r5q_lineage_defconfig || true

      - name: Build Kernel
        run: |
          export PATH="${{ env.PROTON_PATH }}:$PATH"
          cd kernel_source
          
          # Fix pentru utilitarele Samsung care s-ar putea să fie apelate în defconfig
          echo -e '#!/bin/bash\necho "0"' > /tmp/secgetspf
          chmod +x /tmp/secgetspf
          sudo mv /tmp/secgetspf /usr/bin/secgetspf
          sudo ln -sf /usr/bin/python2 /usr/bin/python

          MAKE_ARGS="
            O=out \
            ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1
          "
          
          # Pe LineageOS sursa e mai stabilă, deci nu avem nevoie de atâtea ignorări de erori
          export KCFLAGS="-Wno-error -Wno-implicit-function-declaration"

          mkdir -p out
          
          # Folosim defconfig-ul de SM8150 de la Lineage (mai sigur pentru upstream)
          # sau defconfig-ul tău dacă l-ai copiat corect
          make $MAKE_ARGS vendor/sm8150-perf_defconfig
          
          # Dezactivăm BTF care dădea erori anterior
          sed -i 's/CONFIG_DEBUG_INFO_BTF=y/CONFIG_DEBUG_INFO_BTF=n/g' out/.config
          make $MAKE_ARGS olddefconfig
          
          # Compilăm
          make -j$(nproc --all) $MAKE_ARGS

          if [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image ../
            [ -f out/arch/arm64/boot/dtbo.img ] && cp out/arch/arm64/boot/dtbo.img ../
            echo "SUCCESS=true" >> $GITHUB_ENV
          fi

      - name: Upload Kernel
        if: env.SUCCESS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-Upstream-Kernel
          path: |
            Image
            dtbo.img
