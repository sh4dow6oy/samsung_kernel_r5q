name: S10 Lite - Full Pascua Integration v16.0

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves make python3 lz4 perl
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang

      - name: Core Pascua Backport (eBPF 5.1 Full)
        run: |
          git remote add linux-stable https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git || true
          git fetch linux-stable linux-5.1.y --depth=1
          
          PATHS=(
            "kernel/bpf/" "include/linux/bpf.h" "include/linux/filter.h" 
            "include/linux/bpf_verifier.h" "include/linux/tnum.h" "include/linux/btf.h"
            "include/uapi/linux/bpf.h" "include/uapi/linux/btf.h"
            "include/uapi/linux/bpf_common.h" "include/linux/bpf-cgroup.h"
          )
          for path in "${PATHS[@]}"; do git checkout FETCH_HEAD -- "$path"; done

      - name: Apply Glue Patches (Final Linker Fix)
        run: |
          # 1. Neutralizare Module BPF problematice
          for f in devmap.c cpumap.c offload.c bpf_lirc.c reuseport_array.c; do
            echo "/* Neutralized */" > kernel/bpf/$f
          done
          
          # 2. Fix Prototip xdp_do_generic_redirect (Sincronizare 4.14 -> 5.1)
          sed -i 's/int xdp_do_generic_redirect(struct net_device \*dev, struct sk_buff \*skb, const struct bpf_func_proto \*proto);/int xdp_do_generic_redirect(struct net_device *dev, struct sk_buff *skb, struct bpf_prog *prog, const struct bpf_func_proto *proto);/g' include/linux/filter.h
          perl -0777 -pi -e 's/int xdp_do_generic_redirect\(struct net_device \*dev, struct sk_buff \*skb,\s+const struct bpf_func_proto \*proto\)/int xdp_do_generic_redirect(struct net_device *dev, struct sk_buff *skb, struct bpf_prog *prog, const struct bpf_func_proto *proto)/g' net/core/filter.c

          # 3. Dummy Headers & Samsung Security Path Fix
          mkdir -p include/linux/ include/uapi/linux/ include/log/
          printf "#ifndef _BPF_LIRC_H\n#define _BPF_LIRC_H\n#endif\n" > include/linux/bpf_lirc.h
          printf "#ifndef _PERFLOG_H\n#define _PERFLOG_H\n#endif\n" > include/linux/perflog.h
          mkdir -p system/core/liblog/include/log/
          cp include/linux/perflog.h system/core/liblog/include/log/perflog.h

          # 4. FIX: access_ok & Atomic Ops
          grep -rl "access_ok(" kernel/bpf/ | xargs sed -i 's/access_ok(\([^,]*\), \([^)]*\))/access_ok(VERIFY_READ, \1, \2)/g'
          sed -i 's/atomic_cond_read_relaxed(l, !VAL);/while (atomic_read(l));/g' kernel/bpf/helpers.c

          # 5. FIX: Net Core & Cgroup
          sed -i 's/static const struct bpf_func_proto bpf_sk_redirect_map_proto/const struct bpf_func_proto bpf_sk_redirect_map_proto/g' net/core/filter.c
          sed -i 's/\.test_run/\/\/ .test_run/g' net/core/filter.c
          perl -0777 -pi -e 's/xdp_do_generic_redirect\s*\(\s*([^,]+)\s*,\s*([^,]+)\s*,\s*([^)]+)\s*\)/xdp_do_generic_redirect($1, $2, NULL, $3)/g' net/core/dev.c

          # 6. FIX: secgetspf (The Linker Ghost)
          mkdir -p scripts
          echo -e "#!/bin/bash\necho 0" > scripts/secgetspf
          chmod +x scripts/secgetspf
          sudo cp scripts/secgetspf /usr/bin/secgetspf
          cp scripts/secgetspf ./secgetspf

      - name: Build Kernel
        run: |
          export PATH=$(pwd)/toolchain/proton-clang/bin:$PATH
          MAKE_ARGS="O=out ARCH=arm64 CC=clang HOSTCC=gcc CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1"
          export KCFLAGS="-Wno-error -Wno-incompatible-pointer-types -Wno-int-conversion -Wno-implicit-function-declaration -Wno-return-type"

          # Pregătim folderul out înainte de config
          make $MAKE_ARGS r5q_eur_open_defconfig
          
          mkdir -p out/scripts
          cp scripts/secgetspf out/scripts/
          cp scripts/secgetspf out/

          # Optimizări Android 15 & Dezactivare Securitate Samsung (RKP/CFP)
          ./scripts/config --file out/.config --enable CONFIG_BPF_SYSCALL
          ./scripts/config --file out/.config --enable CONFIG_BPF_JIT
          ./scripts/config --file out/.config --disable CONFIG_KPERFMON
          ./scripts/config --file out/.config --disable CONFIG_DEFEX
          ./scripts/config --file out/.config --disable CONFIG_RKP_KDP
          ./scripts/config --file out/.config --disable CONFIG_RKP_CFP
          ./scripts/config --file out/.config --disable CONFIG_SAMSUNG_PRODUCT_SHIP
          
          make $MAKE_ARGS olddefconfig
          # Dacă eșuează, forțăm j1 pentru a vedea eroarea de linkare exactă
          make -j$(nproc --all) $MAKE_ARGS Image.gz-dtb || make -j1 $MAKE_ARGS Image.gz-dtb

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-A15-Hybrid-Final
          path: out/arch/arm64/boot/Image.gz-dtb
          
