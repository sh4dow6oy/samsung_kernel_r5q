name: Build Roynas R5Q with Polly
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: Roynas-Android-Playground/kernel_samsung_r3q
          ref: master
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev \
          ccache python3 python-is-python3 libarchive-tools wget gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi libtinfo5

      - name: Setup ZyC Clang (Polly Enabled)
        run: |
          # Descărcăm ZyC Clang - un toolchain renumit pentru optimizările Polly
          mkdir zyc-clang
          cd zyc-clang
          wget https://github.com/ZyCromerZ/Clang/releases/download/14.0.6-20220902/Clang-14.0.6-20220902.tar.gz
          tar -xf Clang-*.tar.gz
          rm Clang-*.tar.gz

      - name: Build Kernel
        run: |
          # Setăm căile către noul toolchain
          Z_PATH=$GITHUB_WORKSPACE/zyc-clang/bin
          export PATH="$Z_PATH:$PATH"
          
          # Fix Kconfig (KernelSU missing)
          sed -i '/kernelsu/d' drivers/android/Kconfig

          # Argumente de compilare pentru ZyC
          # Adăugăm LLVM=1 pentru a folosi întreg setul de unelte LLVM (ar, nm, lld)
          MAKE_ARGS="ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            O=out"

          # 1. Config
          make $MAKE_ARGS r5q_defconfig

          # 2. Patch .config (Android 15 + eBPF)
          ./scripts/config --file out/.config \
            -d CONFIG_KNOX_KAP \
            -d CONFIG_SECURITY_SAMSUNG_KNOX \
            -d CONFIG_RKP_KDP \
            -d CONFIG_SAMSUNG_PRODUCT_SHIP \
            -d CONFIG_CC_STACKPROTECTOR_STRONG \
            -e CONFIG_CC_STACKPROTECTOR_NONE \
            -e CONFIG_BPF -e CONFIG_BPF_SYSCALL -e CONFIG_BPF_JIT \
            -e CONFIG_CGROUP_BPF -e CONFIG_NET_CLS_BPF -e CONFIG_NET_ACT_BPF

          make $MAKE_ARGS olddefconfig

          # 3. Compilare cu Polly
          # ZyC recunoaște flag-urile Polly fără erori
          clang --version
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-Wno-error -fcommon"

      - name: Upload Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-Polly-Kernel
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/dtbo.img
