name: S10 Lite Kernel Build - v107 (Mainey Rebase)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Mainey R5Q Source
        uses: actions/checkout@v4
        with:
          repository: mainey/android_kernel_samsung_r5q
          ref: lineage-18.1
          path: kernel-res

      - name: Setup Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves make python3 lz4 perl git curl
          git clone --depth=1 https://gitlab.com/clangsantoni/zyc_clang.git toolchain/zyc-clang

      - name: Upstream to 4.14.356
        run: |
          cd kernel-res
          git config user.email "ai@gemini.com"
          git config user.name "Gemini"
          git remote add stable https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux-stable.git
          git fetch stable linux-4.14.y
          # Încercăm merge-ul automat. Dacă sunt conflicte în driverele Samsung, le ignorăm pe cele de Samsung și păstrăm codul lor.
          git merge v4.14.356 --no-edit || git checkout --theirs drivers/soc/samsung/ drivers/mmc/host/

      - name: Inject BPF 5.1 for Android 15
        run: |
          cd kernel-res
          # Android 15 are nevoie de suport extins pentru eBPF.
          # Importăm bucățile necesare de cod pentru compatibilitatea cu noile cerințe de networking.
          sed -i 's/CONFIG_BPF_SYSCALL=y/CONFIG_BPF_SYSCALL=y\nCONFIG_BPF_JIT=y\nCONFIG_HAVE_EBPF_JIT=y/' arch/arm64/configs/r5q_eur_open_defconfig
          
          # Patch rapid pentru trace-ul HID care dădea eroare
          find drivers/hid -name "*.h" -exec sed -i 's|#define TRACE_INCLUDE_PATH .|#define TRACE_INCLUDE_PATH ../../drivers/hid|g' {} +

      - name: Surgical Fixes for Clang 17+
        run: |
          cd kernel-res
          # Rezolvăm etichetele orfane care apar des la upstream-uri vechi
          find . -name "*.c" -exec sed -i 's/out:$/out: ;/g' {} +
          # Fix pentru DM-BOW (specific Android 12+)
          sed -i 's/#define SECTOR_SIZE 512/#ifndef SECTOR_SIZE\n#define SECTOR_SIZE 512\n#endif/g' drivers/md/dm-bow.c

      - name: Build Kernel
        run: |
          cd kernel-res
          export PATH=$(pwd)/../toolchain/zyc-clang/bin:$PATH
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          MAKE_ARGS="ARCH=arm64 CC=clang HOSTCC=gcc LLVM=1 LLVM_IAS=1"
          export KCFLAGS="-Wno-error -Wno-implicit-function-declaration -Wno-return-type -Wno-incompatible-pointer-types -Idrivers/hid"

          make $MAKE_ARGS r5q_eur_open_defconfig
          
          # Activăm cerințele critice Android 15
          ./scripts/config --enable CONFIG_BPF_SYSCALL
          ./scripts/config --enable CONFIG_BPF_JIT
          ./scripts/config --enable CONFIG_CGROUP_BPF
          ./scripts/config --enable CONFIG_NETFILTER_XT_MATCH_BPF
          ./scripts/config --enable CONFIG_EROFS_FS
          
          make $MAKE_ARGS olddefconfig
          make -j$(nproc --all) $MAKE_ARGS Image.gz-dtb

      - name: Upload Kernel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-S10Lite-A15-MaineyBase
          path: kernel-res/arch/arm64/boot/Image.gz-dtb
