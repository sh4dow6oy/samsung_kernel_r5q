name: Build R5Q - Mega Upstream BPF Universal
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Your Kernel (r5q)
        uses: actions/checkout@v4
        with:
          repository: Roynas-Android-Playground/kernel_samsung_r3q
          ref: master
          path: kernel
          fetch-depth: 0

      - name: Hard Upstream from Universal9611 (Commit bd7d649)
        run: |
          cd kernel
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          
          # 1. Adăugăm sursa upstream ca remote
          git remote add upstream https://github.com/Exynos9611Development/android_kernel_samsung_universal9611.git
          git fetch upstream master
          
          echo "Applying Total Upstream from commit bd7d649..."
          
          # 2. Transplantează toate fișierele modificate în acel commit peste codul tău
          # Această comandă forțează 'starea' fișierelor să fie identică cu cea din upstream
          git checkout bd7d6490a278cea619f533e7eb7a1056fb01e02e -- .
          
          # 3. REPARARE COMPILATOR (Clang specific)
          # Commit-ul bd7d649 are câteva linii pe care Clang le respinge în 4.14
          # Fix pentru 'struct page' în fs/proc/base.c
          sed -i 's/page = (char \*)__get_free_page/struct page *page_ptr; page = (char *)__get_free_page/g' fs/proc/base.c || true
          
          # 4. Sincronizarea finală a structurilor de memorie
          # Ne asigurăm că mm_struct și task_struct sunt cele noi care au arg_lock
          git checkout bd7d6490a278cea619f533e7eb7a1056fb01e02e -- include/linux/mm_types.h
          git checkout bd7d6490a278cea619f533e7eb7a1056fb01e02e -- include/linux/sched.h
          git checkout bd7d6490a278cea619f533e7eb7a1056fb01e02e -- kernel/fork.c

          git add .
          git commit -m "Upstream Sync: Applied all files from Universal9611 bd7d649" || echo "No changes"

      - name: Setup Neutron Clang
        run: |
          sudo apt-get update && sudo apt-get install -y zstd libssl-dev
          mkdir clang
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang
          echo "$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_PATH

      - name: Build Kernel
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          
          # Curățăm flag-urile problematice care pot apărea la import
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-mllvm -polly[^ ]*//g' {} +
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-fstack-protector-strong//g' {} +

          MAKE_ARGS="ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            O=out"

          mkdir -p out
          make $MAKE_ARGS r5q_defconfig

          # ACTIVARE BPF & LSM (Configurația necesară pentru ca transplantul să funcționeze)
          ./scripts/config --file out/.config \
            -e CONFIG_BPF \
            -e CONFIG_BPF_SYSCALL \
            -e CONFIG_BPF_JIT \
            -e CONFIG_BPF_LSM \
            -e CONFIG_BPF_EVENTS \
            -e CONFIG_CGROUP_BPF \
            -e CONFIG_NET_CLS_BPF \
            -e CONFIG_NET_ACT_BPF \
            -e CONFIG_LSM_MMAP_MIN_ADDR \
            -d CONFIG_SAMSUNG_RTIC \
            -d CONFIG_SECURITY_RKP \
            -d CONFIG_WERROR

          make $MAKE_ARGS olddefconfig

          # Compilare finală
          # Folosim KCFLAGS pentru a ignora avertismentele ce pot apărea din cauza codului hibrid
          make -j$(nproc --all) $MAKE_ARGS Image.gz \
            KCFLAGS="-w -fcommon -fno-stack-protector" \
            HOSTCFLAGS="-w"

      - name: Package with AnyKernel3
        run: |
          if [ -f kernel/out/arch/arm64/boot/Image.gz ]; then
            git clone https://github.com/osm0sis/AnyKernel3.git AK3
            cp kernel/out/arch/arm64/boot/Image.gz AK3/
            cd AK3
            sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
            zip -r9 ../R5Q-BPF-Mega-Upstream.zip *
          else
            echo "Build failed! Check the logs above for C errors."
            exit 1
          fi

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: R5Q-OneUI7-Upstream
          path: R5Q-BPF-Mega-Upstream.zip
