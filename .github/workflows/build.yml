name: Build Lumi R5Q - OneUI 7 PRO
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel (Roynas 4.14)
        uses: actions/checkout@v4
        with:
          repository: Roynas-Android-Playground/kernel_samsung_r3q
          ref: master
          path: kernel
          fetch-depth: 1

      - name: Nuclear Cleanup & Init Sixteen Integration
        run: |
          # 1. Backup la init_task.c original
          cp kernel/init/init_task.c kernel/init_task.c.bak
          
          # 2. Integrăm folderul INIT de la pascua28
          git clone --depth=1 -b sixteen https://github.com/pascua28/android_kernel_samsung_sm7150 pascua_tree
          rm -rf kernel/init
          cp -r pascua_tree/init kernel/
          cp pascua_tree/scripts/gen_initramfs_list.sh kernel/scripts/
          
          # 3. RESTAURARE init_task.c (Esențial)
          cp kernel/init_task.c.bak kernel/init/init_task.c
          
          # 4. CURĂȚARE RADICALĂ main.c (Linker Error Fix)
          cd kernel/init
          
          # Eliminăm apelurile de memsize (set_memsize / unset_memsize)
          sed -i '/_memsize_reserved_name/d' main.c
          sed -i '/set_memsize_kernel_type/d' main.c
          
          # Eliminăm apelurile de trace_initcall (start/finish/level)
          sed -i '/trace_initcall_/d' main.c
          
          # Eliminăm pid_idr_init (nu există în 4.14, cauzează Kernel Panic sau Link Error)
          sed -i '/pid_idr_init()/d' main.c
          
          # Fix-urile de tipuri de date anterioare
          sed -i '/trace\/events\/initcall.h/d' main.c
          sed -i '40i typedef int (*initcall_t)(void);' main.c
          sed -i '41i typedef initcall_t initcall_entry_t;' main.c
          sed -i 's/initcall_sec_debug/initcall_debug/g' main.c
          sed -i 's/initcall_from_entry(fn)/fn/g' main.c
          
          # 5. Fix Kconfig (BPF error)
          sed -i '/kernel\/bpf\/preload\/Kconfig/d' Kconfig
          sed -i '/kernelsu/d' drivers/android/Kconfig
          
          # Revenim în rădăcină pentru restul fix-urilor
          cd ../..
          
          # 6. Restul fix-urilor tale (LTO, VDSO, etc.)
          cd kernel
          find . -type f \( -name "Makefile*" -o -name "*.mk" -o -name "*.include" \) -exec sed -i 's/-mllvm -polly[^ ]*//g' {} +

      - name: Setup Neutron Clang
        run: |
          mkdir clang
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang

      - name: Build Kernel
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          
          # Adăugăm HOSTCC pentru a evita blocajul la scripts/kconfig/conf
          MAKE_ARGS="ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            HOSTCC=clang \
            HOSTCXX=clang++ \
            HOSTLD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            O=out"
          
          mkdir -p out
          make $MAKE_ARGS r5q_defconfig
          
          # --- INJECTĂM SUPORTUL PENTRU ANDROID 15 (ONEUI 7) ---
          {
            # System-as-Root (SAR) - Fix pentru mount error /system
            echo "CONFIG_ANDROID_SAR_RAMDISK=y"
            echo "CONFIG_BLK_DEV_INITRD=y"
            
            # File Systems (EROFS este formatul OneUI 7)
            echo "CONFIG_EROFS_FS=y"
            echo "CONFIG_EROFS_FS_ZIP=y"
            echo "CONFIG_INCREMENTAL_FS=y"
            
            # Cgroups V2 & BPF (Fix pentru freeze la Powered by Android)
            echo "CONFIG_CGROUPS=y"
            echo "CONFIG_CGROUP_BPF=y"
            echo "CONFIG_BPF_SYSCALL=y"
            echo "CONFIG_CPUSETS=y"
            echo "CONFIG_CGROUP_CPUACCT=y"
            echo "CONFIG_CGROUP_FREEZER=y"
            
            # Logical Partitions & DM
            echo "CONFIG_BLK_DEV_DM=y"
            echo "CONFIG_DM_BOW=y"
            
            # WiFi ath10k Modules
            echo "CONFIG_ATH10K=m"
            echo "CONFIG_ATH10K_SDIO=m"
            
            # Cmdline Permissive
            echo 'CONFIG_CMDLINE="androidboot.selinux=permissive androidboot.fips=0"'
            echo "CONFIG_CMDLINE_EXTEND=y"
          } >> out/.config
          
          make $MAKE_ARGS olddefconfig
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-fcommon -Wno-error -w" O=out Image.gz-dtb dtbo.img modules

      - name: Package AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cp kernel/out/arch/arm64/boot/dtbo.img AnyKernel3/
          
          mkdir -p AnyKernel3/modules/vendor/lib/modules
          find kernel/out -name "*.ko" -exec cp {} AnyKernel3/modules/vendor/lib/modules/ \;
          
          cd AnyKernel3
          sed -i 's/kernel.string=.*/kernel.string=Lumi-OneUI7-R5Q-Nuclear/g' anykernel.sh
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          sed -i 's/supported.versions=.*/supported.versions=11, 12, 13, 14, 15/g' anykernel.sh
          sed -i 's|block=auto;|block=/dev/block/by-name/boot;|g' anykernel.sh
          
          # Patch VBMETA (Elimină blocajul la logo-ul Samsung)
          sed -i 's/PATCH_VBMETA_FLAG=auto/PATCH_VBMETA_FLAG=1/g' anykernel.sh || echo "PATCH_VBMETA_FLAG=1" >> anykernel.sh
          
          # Injectăm instalarea DTBO
          sed -i '/dump_boot;/a BLOCK=/dev/block/by-name/dtbo; reset_ak; split_boot; flash_boot;' anykernel.sh

          zip -r9 ../Lumi-R5Q-OneUI7-PRO.zip *

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: Lumi-OneUI7-Kernel
          path: Lumi-R5Q-OneUI7-PRO.zip
