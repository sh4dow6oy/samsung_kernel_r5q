name: S10 Lite Kernel - Android 15 Hybrid (Ultimate Fix)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves libncurses-dev git wget make python2 python3 pahole

      - name: Cache Toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: toolchain/proton-clang
          key: ${{ runner.os }}-proton-clang-v1

      - name: Download Proton Clang
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang

      - name: Upstream from Kernel.org (Linux 4.14.y)
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          
          git remote add linux-stable https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git || true
          git fetch linux-stable linux-4.14.y --depth=1
          
          # Sincronizăm tot setul de headere necesar pentru noul Verifier BPF
          PATHS=(
            "kernel/bpf/"
            "drivers/android/"
            "include/linux/bpf.h"
            "include/linux/filter.h"
            "include/linux/bpf_verifier.h"
            "include/linux/bpf-cgroup.h"
            "include/uapi/linux/bpf.h"
            "include/uapi/linux/bpf_common.h"
            "include/uapi/linux/filter.h"
            "arch/arm64/net/"
          )

          for path in "${PATHS[@]}"; do
            git checkout FETCH_HEAD -- "$path" || echo "Skip: $path nu a fost găsit"
          done

      - name: Pre-build Fixes & BPF Patching
        run: |
          # 1. Rezolvăm eroarea Assembler (unknown mnemonic typedef)
          sed -i '/#define _UAPI_LINUX_TYPES_H/a \
          #ifndef __poll_t \
          #ifndef __ASSEMBLY__ \
          typedef unsigned int __poll_t; \
          #endif \
          #define __poll_t __poll_t \
          #endif' include/uapi/linux/types.h

          # 2. Bypass SELinux BPF (Păcălim SELinux Samsung să ignore noile structuri)
          if [ -f security/selinux/hooks.c ]; then
            sed -i 's/if (file->f_op == \&bpf_map_fops)/if (0) \/\/ bypass/g' security/selinux/hooks.c
            sed -i 's/} else if (file->f_op == \&bpf_prog_fops)/} else if (0) \/\/ bypass/g' security/selinux/hooks.c
            sed -i '/prog->aux->security/s/^/\/\//' security/selinux/hooks.c
            sed -i '/aux->security =/s/^/\/\//' security/selinux/hooks.c
            sed -i '/struct bpf_security_struct \*bpfsec = aux->security;/s/^/\/\//' security/selinux/hooks.c
          fi

          # 3. Forțăm definițiile BPF care lipseau în verifier.c
          # Adăugăm BPF_ALU_IMMEDIATE manual dacă filter.h are probleme
          echo "#define BPF_ALU_IMMEDIATE 1" >> include/linux/filter.h
          echo "#define BPF_ALU_NON_IMM 0" >> include/linux/filter.h

          # 4. Fix Samsung Log Headers & Dummy Binaries
          mkdir -p system/core/liblog/include/log system/logging/liblog/include/log
          echo -e "#ifndef _PERFLOG_H\n#define _PERFLOG_H\n#endif" > system/core/liblog/include/log/perflog.h
          sudo sh -c 'echo "#!/bin/bash" > /usr/bin/secgetspf'
          sudo chmod +x /usr/bin/secgetspf

          # 5. Patch pentru headere BTF
          find kernel/bpf/ -name "*.c" | xargs sed -i 's|<uapi/linux/btf.h>|<linux/btf.h>|g' || true
          
          # 6. Python symlink
          [ -f scripts/gcc-wrapper.py ] && mv scripts/gcc-wrapper.py scripts/gcc-wrapper.py.disabled || true
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Build Kernel
        run: |
          export PATH=$(pwd)/toolchain/proton-clang/bin:$PATH
          
          MAKE_ARGS="
            O=out \
            ARCH=arm64 \
            CC=clang \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1 \
            KCFLAGS=-Wno-error \
            TECHPACK=true
          "

          rm -rf out && mkdir -p out
          make $MAKE_ARGS r5q_eur_open_defconfig
          
          # Forțăm activarea eBPF & BinderFS (Android 15 Requirments)
          ./scripts/config --file out/.config --enable CONFIG_BPF_SYSCALL
          ./scripts/config --file out/.config --enable CONFIG_BPF_JIT
          ./scripts/config --file out/.config --enable CONFIG_HAVE_EBPF_JIT
          ./scripts/config --file out/.config --enable CONFIG_ANDROID_BINDERFS
          ./scripts/config --file out/.config --enable CONFIG_ANDROID_BINDER_IPC
          ./scripts/config --file out/.config --disable CONFIG_DEBUG_INFO_BTF
          
          make $MAKE_ARGS olddefconfig
          
          # Build principal. J1 este folosit doar dacă j$(nproc) eșuează.
          make -j$(nproc --all) $MAKE_ARGS || (echo "Eroare detectată. Rulăm cu J1 pentru log-uri clare..." && make -j1 $MAKE_ARGS)

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Kernel-S10Lite-Final-Image
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dtbo.img
