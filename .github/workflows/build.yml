name: Build Roynas R5Q - A15 BPF Sixteen Clean
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: Roynas-Android-Playground/kernel_samsung_r3q
          ref: master
          fetch-depth: 0

      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev ccache python3 wget zstd zip git

      - name: Clean and Port BPF from Sixteen
        run: |
          git config --global user.email "bot@example.com"
          git config --global user.name "Kernel Bot"
          
          # Ștergem complet fișierele vechi BPF pentru a evita redefinirile (duplicatele)
          rm -rf kernel/bpf/
          rm -f include/linux/bpf.h include/linux/bpf_types.h include/linux/filter.h
          rm -f include/uapi/linux/bpf.h include/uapi/linux/bpf_common.h
          rm -f net/core/filter.c

          git remote add sixteen https://github.com/pascua28/android_kernel_samsung_sm8250.git
          git fetch sixteen sixteen
          
          # Importăm versiunea curată din Sixteen
          git checkout sixteen/sixteen -f -- \
            kernel/bpf/ \
            include/linux/bpf.h \
            include/linux/bpf_types.h \
            include/linux/filter.h \
            include/uapi/linux/bpf.h \
            include/uapi/linux/bpf_common.h \
            net/core/filter.c
          
          # Patch critic pentru sk_buff (Samsung r5q are o structură sk_buff ușor diferită)
          sed -i '/cb->data_meta = skb->data - skb_metadata_len(skb);/d' include/linux/filter.h
          sed -i 's/return skb_metadata_len(skb);/return 0;/g' include/linux/filter.h
          
          git add .
          git commit -m "Clean port of BPF from Sixteen SM8250" || echo "No changes"

      - name: Setup Toolchain & Build
        run: |
          mkdir clang
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          
          # Fix Samsung standard
          sed -i '/kernelsu\/Kconfig/d' drivers/android/Kconfig || true
          sed -i '/kernelsu/d' drivers/android/Makefile || true
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-mllvm -polly[^ ]*//g' {} +
          [ -f arch/arm64/kernel/vdso/Makefile ] && sed -i 's/$(LDFLAGS)/$(filter-out -static,$(LDFLAGS))/g' arch/arm64/kernel/vdso/Makefile

          MAKE_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- O=out"

          make $MAKE_ARGS r5q_defconfig
          ./scripts/config --file out/.config -e CONFIG_BPF -e CONFIG_BPF_SYSCALL -e CONFIG_BPF_JIT -e CONFIG_CGROUP_BPF -d CONFIG_LTO_CLANG -e CONFIG_LTO_NONE -d CONFIG_WERROR
          make $MAKE_ARGS olddefconfig
          
          # Compilăm cu toleranță la pointeri incompatibili (specific portărilor hibride)
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-fcommon -Wno-error -Wno-implicit-function-declaration -Wno-incompatible-pointer-types -Wno-format"

      - name: Package
        if: always()
        run: |
          if [ -f out/arch/arm64/boot/Image.gz ]; then
            git clone https://github.com/osm0sis/AnyKernel3.git
            cp out/arch/arm64/boot/Image.gz AnyKernel3/
            cd AnyKernel3 && zip -r9 ../Kernel-R5Q-A15-Sixteen-Clean.zip *
          fi

      - name: Publish
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-S10Lite-A15-Sixteen
          path: "*.zip"
