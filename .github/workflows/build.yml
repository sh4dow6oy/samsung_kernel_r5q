name: S10 Lite Kernel - Android 15 Hybrid (Ultimate Fix)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves libncurses-dev git wget make python2 python3 pahole

      - name: Cache Toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: toolchain/proton-clang
          key: ${{ runner.os }}-proton-clang-v1

      - name: Download Proton Clang
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang

      - name: Upstream from Kernel.org (Linux 4.14.y)
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          
          git remote add linux-stable https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git || true
          git fetch linux-stable linux-4.14.y --depth=1
          
          # Sincronizăm tot setul de headere necesar pentru noul Verifier BPF
          PATHS=(
            "kernel/bpf/"
            "drivers/android/"
            "include/linux/bpf.h"
            "include/linux/filter.h"
            "include/linux/bpf_verifier.h"
            "include/linux/bpf-cgroup.h"
            "include/uapi/linux/bpf.h"
            "include/uapi/linux/bpf_common.h"
            "include/uapi/linux/filter.h"
            "arch/arm64/net/"
          )

          for path in "${PATHS[@]}"; do
            git checkout FETCH_HEAD -- "$path" || echo "Skip: $path nu a fost găsit"
          done

      - name: Pre-build Fixes & BPF Patching
        run: |
          # 1. Rezolvăm eroarea Assembler (unknown mnemonic typedef)
          sed -i '/#define _UAPI_LINUX_TYPES_H/a \
          #ifndef __poll_t \
          #ifndef __ASSEMBLY__ \
          typedef unsigned int __poll_t; \
          #endif \
          #define __poll_t __poll_t \
          #endif' include/uapi/linux/types.h

          # 2. Bypass SELinux BPF (Păcălim SELinux Samsung să ignore noile structuri)
          if [ -f security/selinux/hooks.c ]; then
            sed -i 's/if (file->f_op == \&bpf_map_fops)/if (0) \/\/ bypass/g' security/selinux/hooks.c
            sed -i 's/} else if (file->f_op == \&bpf_prog_fops)/} else if (0) \/\/ bypass/g' security/selinux/hooks.c
            sed -i '/prog->aux->security/s/^/\/\//' security/selinux/hooks.c
            sed -i '/aux->security =/s/^/\/\//' security/selinux/hooks.c
            sed -i '/struct bpf_security_struct \*bpfsec = aux->security;/s/^/\/\//' security/selinux/hooks.c
          fi

          # 3. Forțăm definițiile BPF care lipseau
