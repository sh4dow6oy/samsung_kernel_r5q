name: Samsung SM8150 (r5q) - eBPF Final Fix - V52

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout R5Q Kernel (Target)
      - name: Checkout R5Q Kernel
        uses: actions/checkout@v4
        with:
          repository: mainey/android_kernel_samsung_r5q
          ref: lineage-18.1
          path: kernel
          fetch-depth: 1

      # 2. Checkout SM6150 Kernel (Source) - FIX REFERINȚĂ
      - name: Checkout SM6150 Kernel
        uses: actions/checkout@v4
        with:
          repository: crdroidandroid/android_kernel_samsung_sm6150
          ref: refs/heads/15.0 # FORȚĂM BRANCH-UL CORECT
          path: sm6150
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libncurses-dev git zstd python3 gzip dwarves wget

      - name: Download Neutron Clang
        run: |
          mkdir -p neutron
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C neutron/

      - name: Patch & Backport eBPF Structurat
        run: |
          K_R5Q="$GITHUB_WORKSPACE/kernel"
          K_SM6150="$GITHUB_WORKSPACE/sm6150"

          # 1. Copiem structura de bpf
          cp -r $K_SM6150/kernel/bpf $K_R5Q/kernel/

          # 2. Actualizam Include-urile esențiale pentru eBPF
          cp $K_SM6150/include/linux/bpf.h $K_R5Q/include/linux/bpf.h
          cp $K_SM6150/include/linux/bpf_types.h $K_R5Q/include/linux/bpf_types.h
          cp -r $K_SM6150/include/uapi/linux/bpf.h $K_R5Q/include/uapi/linux/bpf.h
          cp -r $K_SM6150/include/uapi/linux/bpf_common.h $K_R5Q/include/uapi/linux/bpf_common.h

          # 3. Actualizam Makefile-ul principal pentru a include bpf/
          echo "obj-y += bpf/" >> $K_R5Q/kernel/Makefile

          # 4. Actualizam Kconfig-ul central
          if ! grep -q "source \"kernel/bpf/Kconfig\"" $K_R5Q/init/Kconfig; then
            echo "source \"kernel/bpf/Kconfig\"" >> $K_R5Q/init/Kconfig
          fi

      - name: Configure R5Q Kernel
        run: |
          cd kernel
          export PATH=$GITHUB_WORKSPACE/neutron/bin:$PATH
          export ARCH=arm64
          mkdir -p out

          make O=out ARCH=arm64 r5q_eur_open_defconfig

          # Activează eBPF, JIT și BTF
          scripts/config --file out/.config -e CONFIG_BPF
          scripts/config --file out/.config -e CONFIG_BPF_SYSCALL
          scripts/config --file out/.config -e CONFIG_BPF_JIT
          scripts/config --file out/.config -e CONFIG_BPF_JIT_ALWAYS_ON
          scripts/config --file out/.config -e CONFIG_CGROUP_BPF
          scripts/config --file out/.config -e CONFIG_DEBUG_INFO_BTF

          make O=out ARCH=arm64 olddefconfig

      - name: Build Kernel
        run: |
          cd kernel
          export PATH=$GITHUB_WORKSPACE/neutron/bin:$PATH
          export ARCH=arm64
          export CC=clang
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export LD=ld.lld
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          make -j$(nproc --all) O=out ARCH=arm64 \
               CC=clang LLVM=1 LLVM_IAS=1 \
               KCFLAGS="-Wno-error -Wno-unused-function -Wno-unused-variable -Wno-int-conversion -Wno-implicit-function-declaration"

      - name: Prepare Artifact
        run: |
          cd kernel
          if [ -f out/arch/arm64/boot/Image ]; then
            gzip -n -c out/arch/arm64/boot/Image > Image.gz
          else
            echo "Build failed!"
            exit 1
          fi

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: r5q-ebpf-V52
          path: kernel/Image.gz
