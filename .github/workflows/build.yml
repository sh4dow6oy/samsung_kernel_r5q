name: R5Q - Android 15 (Final Symbol Sanitizer)
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pascua28 Base
        uses: actions/checkout@v4
        with:
          repository: pascua28/android_kernel_samsung_sm7150
          ref: sixteen
          path: kernel

      - name: Hybrid Config & Symbol Sanitization
        run: |
          cd kernel
          # 1. CONFIG HIBRID
          cp arch/arm64/configs/vendor/sdmmagpie_defconfig arch/arm64/configs/r5q_hybrid_defconfig
          curl -s https://raw.githubusercontent.com/Roynas-Android-Playground/kernel_samsung_r3q/master/arch/arm64/configs/r5q_defconfig > roynas_r5q.config
          echo "" >> arch/arm64/configs/r5q_hybrid_defconfig
          cat roynas_r5q.config >> arch/arm64/configs/r5q_hybrid_defconfig

          # 2. DEZACTIVARE MODULE PROBLEMATICE
          ./scripts/config --file arch/arm64/configs/r5q_hybrid_defconfig \
            --disable CONFIG_SND_SOC_SM6150 \
            --disable CONFIG_SND_SOC_SM7150 \
            --enable CONFIG_SND_SOC_SM8150 \
            --disable CONFIG_SECURITY_SMACK \
            --disable CONFIG_BPFILTER \
            --enable CONFIG_BPF \
            --enable CONFIG_BPF_SYSCALL \
            --set-val CONFIG_NR_CPUS 8 \
            --enable CONFIG_MACH_SAMSUNG_R5Q

          # 3. ELIMINARE REFERINȚE SYMBOL "UNDEFINED" (Chirurgie pe cod)
          
          # Fix Scheduler missing symbols (sysctl)
          sed -i '/sysctl_sched_conservative_pl/d' kernel/sched/tune.c 2>/dev/null || true
          sed -i '/sysctl_sched_many_wakeup_threshold/d' kernel/sched/tune.c 2>/dev/null || true
          
          # Fix Camera/OIS missing symbols
          sed -i 's/cam_actuator_do_soft_landing/(void)/g' drivers/media/platform/msm/camera/cam_sensor_module/cam_actuator/cam_actuator_core.c 2>/dev/null || true
          sed -i 's/ois_reset_register/(void)/g' drivers/media/platform/msm/camera/cam_sensor_module/cam_ois/cam_ois_core.c 2>/dev/null || true
          
          # Fix Audio Callback missing symbols
          sed -i 's/audio_register_wdsp_state_cb/(void)/g' techpack/audio/asoc/sm8150.c 2>/dev/null || true
          sed -i 's/audio_register_mad_mic_state_cb/(void)/g' techpack/audio/asoc/sm8150.c 2>/dev/null || true
          
          # Fix Factory/Sensors missing symbols
          sed -i '/accel_factory_init_work/d' drivers/sensors/factory_test.c 2>/dev/null || true
          sed -i '/prox_factory_init_work/d' drivers/sensors/factory_test.c 2>/dev/null || true
          sed -i 's/setSensorCallback/(void)/g' drivers/motor/vibrator_zeus.c 2>/dev/null || true

          # 4. FIX-URI ANTERIOARE (Stabilite)
          sed -i 's/void swrm_wcd_notify/__attribute__((weak)) void swrm_wcd_notify/g' techpack/audio/soc/swr-wcd-ctrl.c
          sed -i 's/!mbhc->slow_insertion/1/g' techpack/audio/asoc/codecs/wcd-mbhc-adc.c
          sed -i 's/&& mbhc->slow_insertion//g' techpack/audio/asoc/codecs/wcd-mbhc-adc.c
          sed -i 's/PD_NOTI_ATTACH_TYPEDEF/CC_NOTI_ATTACH_TYPEDEF/g' drivers/sensors/sx9360.c
          sed -i 's/PDIC_NOTIFY_ID_ATTACH/CCIC_NOTIFY_ID_ATTACH/g' drivers/sensors/sx9360.c
          sed -i 's/try_to_unmap(page, ttu_flags)/try_to_unmap(page, ttu_flags, NULL)/g' mm/huge_memory.c
          sed -i 's/split_huge_pmd(vma, addr, pmd);/__split_huge_pmd(vma, (pmd_t *)pmd, addr, false, NULL);/g' fs/proc/task_mmu.c
          sed -i 's/.proc_handler   = bpf_stats_handler,/\/\/ .proc_handler = bpf_stats_handler,/g' kernel/sysctl.c
          sed -i 's/#elif$/#else/g' kernel/taskstats.c
          sed -i '433d' kernel/trace/trace_event_perf.c
          echo "/* Golit */" > drivers/gpu/msm/adreno_coresight.c

      - name: Setup Toolchain
        run: |
          sudo apt-get update && sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev zstd zip gcc-aarch64-linux-gnu
          mkdir -p clang
          wget -q https://github.com/Ylarod/setup-ndk-clang/releases/download/prebuilt/clang-linux-x86-ndk-r29-r563880c.tar.zst
          tar -I zstd -xf clang-linux-x86-ndk-r29-r563880c.tar.zst -C clang

      - name: Build Kernel Image
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export MAKE_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- O=out"
          
          make $MAKE_ARGS r5q_hybrid_defconfig
          make $MAKE_ARGS olddefconfig
          
          # Folosim LDFLAGS forțat pentru a ignora orice alt simbol lipsă minor
          make -j$(nproc --all) $MAKE_ARGS \
            KCFLAGS="-w" \
            LDFLAGS="--allow-multiple-definition --undefined-version" \
            O=out Image.gz-dtb

      - name: Package
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          # Căutăm imaginea oriunde s-a generat
          find kernel/out -name "Image.gz*" -exec cp {} AnyKernel3/ \;
          cd AnyKernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          zip -r9 ../Lumi-Kernel-R5Q-A15.zip *

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Lumi-Kernel
          path: Lumi-Kernel-R5Q-A15.zip
