name: Build r5q Kernel

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libncurses-dev \
            curl \
            unzip \
            git \
            python3 \
            wget

      - name: Install python2 (Debian package + deps)
        run: |
          mkdir -p /tmp/python2
          cd /tmp/python2

          # Dependencies
          wget http://ftp.debian.org/debian/pool/main/o/openssl1.1/libssl1.1_1.1.1n-0+deb11u4_amd64.deb
          wget http://ftp.debian.org/debian/pool/main/libf/libffi/libffi7_3.3-6_amd64.deb
          wget http://ftp.debian.org/debian/pool/main/n/nsl/libnsl2_2.0.0-2_amd64.deb
          wget http://ftp.debian.org/debian/pool/main/m/mime-support/mime-support_3.68_all.deb

          # Python2 packages
          wget http://ftp.debian.org/debian/pool/main/p/python2.7/python2.7_2.7.18-8+deb11u1_amd64.deb
          wget http://ftp.debian.org/debian/pool/main/p/python2.7/python2.7-minimal_2.7.18-8+deb11u1_amd64.deb
          wget http://ftp.debian.org/debian/pool/main/p/python2.7/libpython2.7-stdlib_2.7.18-8+deb11u1_amd64.deb
          wget http://ftp.debian.org/debian/pool/main/p/python2.7/libpython2.7-minimal_2.7.18-8+deb11u1_amd64.deb

          # Install dependencies
          sudo dpkg -i libssl1.1_1.1.1n-0+deb11u4_amd64.deb
          sudo dpkg -i libffi7_3.3-6_amd64.deb
          sudo dpkg -i libnsl2_2.0.0-2_amd64.deb
          sudo dpkg -i mime-support_3.68_all.deb

          # Install Python2
          sudo dpkg -i libpython2.7-minimal_2.7.18-8+deb11u1_amd64.deb
          sudo dpkg -i python2.7-minimal_2.7.18-8+deb11u1_amd64.deb
          sudo dpkg -i libpython2.7-stdlib_2.7.18-8+deb11u1_amd64.deb
          sudo dpkg -i python2.7_2.7.18-8+deb11u1_amd64.deb

          sudo ln -sf /usr/bin/python2.7 /usr/bin/python2

      - name: Download Android NDK r25b
        run: |
          mkdir -p toolchain
          cd toolchain
          curl -L -o ndk.zip https://dl.google.com/android/repository/android-ndk-r25b-linux.zip
          unzip ndk.zip
          rm ndk.zip

      - name: Export NDK Path
        run: |
          echo "NDK_PATH=$PWD/toolchain/android-ndk-r25b" >> $GITHUB_ENV
          echo "PATH=$PWD/toolchain/android-ndk-r25b/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH" >> $GITHUB_ENV

      - name: Set build env variables
        run: |
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "LLVM=1" >> $GITHUB_ENV
          echo "CLANG_TRIPLE=aarch64-linux-android" >> $GITHUB_ENV
          echo "CROSS_COMPILE=" >> $GITHUB_ENV
          echo "CC=aarch64-linux-android21-clang" >> $GITHUB_ENV
          echo "LD=ld.lld" >> $GITHUB_ENV
          echo "AR=llvm-ar" >> $GITHUB_ENV
          echo "NM=llvm-nm" >> $GITHUB_ENV
          echo "OBJCOPY=llvm-objcopy" >> $GITHUB_ENV
          echo "OBJDUMP=llvm-objdump" >> $GITHUB_ENV
          echo "STRIP=llvm-strip" >> $GITHUB_ENV

      - name: Configure kernel
        run: |
          make ARCH=arm64 r5q_eur_open_defconfig

      - name: Build kernel
        run: |
          make -j$(nproc) ARCH=arm64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-artifacts
          path: |
            arch/arm64/boot/Image
            arch/arm64/boot/dts/*
