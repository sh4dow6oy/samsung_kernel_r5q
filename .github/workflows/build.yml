name: S10 Lite – Android 15 eBPF (Kernel 4.14 SAFE)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout S10 Lite Kernel
        uses: actions/checkout@v4
        with:
          repository: sh4dow6oy/samsung_kernel_r5q
          path: kernel
          fetch-depth: 1

      - name: Setup Toolchain
        run: |
          sudo apt update
          sudo apt install -y bc bison flex libssl-dev libelf-dev make python3 lz4
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang

      - name: Configure Kernel (SAFE eBPF)
        run: |
          cd kernel
          export PATH=$(pwd)/../toolchain/proton-clang/bin:$PATH

          make ARCH=arm64 CC=clang r5q_eur_open_defconfig

          # eBPF MINIM (kernel 4.14)
          ./scripts/config --enable CONFIG_BPF
          ./scripts/config --enable CONFIG_BPF_SYSCALL
          ./scripts/config --enable CONFIG_BPF_JIT
          ./scripts/config --enable CONFIG_CGROUP_BPF

          # OPRIM TOT ce NU există în 4.14
          ./scripts/config --disable CONFIG_DEBUG_INFO_BTF
          ./scripts/config --disable CONFIG_BPF_LIRC_MODE2
          ./scripts/config --disable CONFIG_BPF_EVENTS
          ./scripts/config --disable CONFIG_BPF_PRELOAD
          ./scripts/config --disable CONFIG_KPROBES
          ./scripts/config --disable CONFIG_PERF_EVENTS

          # Samsung security (altfel NU bootează A15)
          ./scripts/config --disable CONFIG_SECURITY_SAMSUNG_RKP
          ./scripts/config --disable CONFIG_TIMA
          ./scripts/config --disable CONFIG_DEFEX
          ./scripts/config --disable CONFIG_SAMSUNG_PRODUCT_SHIP

          make ARCH=arm64 CC=clang olddefconfig

      - name: Build Kernel
        run: |
          cd kernel
          export PATH=$(pwd)/../toolchain/proton-clang/bin:$PATH

          MAKE_ARGS="ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1"
          export KCFLAGS="-Wno-error -Wno-implicit-function-declaration -Wno-int-conversion"

          make -j$(nproc --all) $MAKE_ARGS Image.gz-dtb

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-A15-eBPF-k4.14
          path: kernel/arch/arm64/boot/Image.gz-dtb
