name: Ultimate Kernel Builder (Neutron + SM8150)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Samsung Source
        uses: actions/checkout@v4
        with:
          repository: sh4dow6oy/kernel_samsung_r5q
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

      - name: Smart Merge Lineage-20
        run: |
          git remote add lineage_8150 https://github.com/LineageOS/android_kernel_qcom_sm8150.git
          git fetch lineage_8150 lineage-20
          
          # Strategia 'ours' la nivel de merge previne erorile de tip rename/delete
          # prin prioritizarea structurii Samsung r5q.
          git merge -X ours lineage_8150/lineage-20 -m "Merge Lineage-20" --allow-unrelated-histories || true
          
          # Curățăm conflictele de tip rename/delete care au oprit workflow-ul anterior
          git add -u
          git add .
          git commit -m "Fix: Resolve rename/delete conflicts by keeping r5q structure" || echo "No changes to commit"

      - name: Setup Neutron Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd
          mkdir clang-neutron
          wget https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang-neutron

      - name: Kernel Patching & Security Stripping
        run: |
          # Restaurăm Makefile-ul original ca să evităm eroarea "extraneous endif"
          git checkout HEAD -- Makefile
          
          DEFCONFIG="arch/arm64/configs/r5q_defconfig"
          
          # Dezactivăm protectiile Samsung care dau Kernel Panic pe custom builds
          sed -i 's/CONFIG_KNP=y/CONFIG_KNP=n/g' $DEFCONFIG
          sed -i 's/CONFIG_RKP=y/CONFIG_RKP=n/g' $DEFCONFIG
          sed -i 's/CONFIG_TIMA=y/CONFIG_TIMA=n/g' $DEFCONFIG
          sed -i 's/CONFIG_SEC_RESTRICT_FORK=y/CONFIG_SEC_RESTRICT_FORK=n/g' $DEFCONFIG
          
          # Optimizare: Activăm suportul pentru noi versiuni de Clang
          echo "CONFIG_LLVM_POLLY=y" >> $DEFCONFIG

      - name: Build Kernel
        run: |
          export PATH=$(pwd)/clang-neutron/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          
          # Neutron Toolchain Setup
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          
          mkdir -p out
          make O=out r5q_defconfig
          
          # Compilăm folosind LLVM complet și ignorăm warning-urile de tip "unknown option"
          # care apar din cauza diferenței de vârstă între cod și compilator.
          make -j$(nproc --all) O=out \
               LLVM=1 \
               LLVM_IAS=1 \
               CROSS_COMPILE=aarch64-linux-gnu- \
               CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
               CLANG_TRIPLE=aarch64-linux-gnu- \
               KCFLAGS="-w -Wno-error"

      - name: Create Flashable Zip (AnyKernel3)
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3
          zip -r9 ../r5q-Kernel-Neutron-L20.zip *

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: r5q-Optimized-Kernel
          path: r5q-Kernel-Neutron-L20.zip
