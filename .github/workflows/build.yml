name: S10 Lite (Lineage Base - No Jack Fix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LineageOS Base
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_oneplus_sm8150
          ref: lineage-23.2
          path: main

      - name: Checkout Mainey (R5Q Source)
        uses: actions/checkout@v4
        with:
          repository: mainey/android_kernel_samsung_r5q
          path: mainey

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex git libssl-dev libelf-dev clang llvm lld zstd curl python3 device-tree-compiler

      - name: Download Neutron Clang
        run: |
          mkdir -p main/clang
          wget https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C main/clang

      - name: Surgical Grafting (DTS, No-Jack Audio & Shims)
        run: |
          # 1. Config R5Q EUR
          cp mainey/arch/arm64/configs/r5q_eur_open_defconfig main/arch/arm64/configs/r5q_defconfig
          
          # 2. DTS & Makefile Grafting
          mkdir -p main/arch/arm64/boot/dts/samsung
          cp -r mainey/arch/arm64/boot/dts/samsung/* main/arch/arm64/boot/dts/samsung/
          cp mainey/arch/arm64/boot/dts/Makefile main/arch/arm64/boot/dts/Makefile
          
          cd main
          # 3. CREARE FISIER SHIMS (FARA switch_headset_state)
          cat << 'EOF' > drivers/misc/r5q_shims.c
          #include <linux/kernel.h>
          #include <linux/module.h>
          #include <linux/types.h>

          void push_component_info(const char *name, const char *version) {}
          int get_boot_mode(void) { return 0; }
          void register_device_proc(const char *name, void *read_proc, void *write_proc) {}
          void sys_reset_dev(void) {}
          int pmicwd_init(void) { return 0; }
          int kpdpwr_init(void) { return 0; }
          int get_PCB_Version(void) { return 0; }
          int is_project(int project) { return 0; }
          int get_project(void) { return 0; }
          int qpnp_is_power_off_charging(void) { return 0; }
          void opticalfp_irq_handler_register(void *handler) {}
          
          int tp_gesture_enable_flag_oncell = 0;
          int tp_fp_enable_flag = 0;
          
          EXPORT_SYMBOL(push_component_info);
          EXPORT_SYMBOL(get_boot_mode);
          EOF
          
          echo "obj-y += r5q_shims.o" >> drivers/misc/Makefile

          # 4. AUDIO PATCH: Dezactivam apelul catre switch_headset_state in sursa
          # Comentam linia care cauzeaza eroarea in techpack/audio
          find techpack/audio -name "wcd-mbhc-v2.c" -exec sed -i 's/switch_headset_state(state);//g' {} +

          # 5. Global Guards
          sed -i '/#define _LINUX_COMPILER_H/a #define SAMSUNG_PRODUCT_SHIP 1\n#define initcall_sec_debug 0' include/linux/compiler.h
          
          # 6. Fix DTC Lexer
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' scripts/dtc/dtc-lexer.lex.c_shipped || true

      - name: Configure and Build
        run: |
          cd main
          export PATH="$GITHUB_WORKSPACE/main/clang/bin:$PATH"

          MAKE_ARGS="ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            DTC=dtc \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            O=out"

          make $MAKE_ARGS r5q_defconfig
          
          # Ajustări pentru a elimina dependințele de Jack Audio
          ./scripts/config --file out/.config \
            -e CONFIG_BPF_SYSCALL -e CONFIG_BPF_JIT \
            -d CONFIG_LTO -d CONFIG_LTO_CLANG -e CONFIG_LTO_NONE \
            -d CONFIG_SECURITY_SAMSUNG_KNOX -d CONFIG_KNOX_KAP \
            -d CONFIG_SEC_ABC -d CONFIG_SEC_DEBUG \
            -d CONFIG_SAMSUNG_TUI \
            -d CONFIG_SND_SOC_WCD_MBHC # Dezactivam MBHC complet

          make $MAKE_ARGS olddefconfig

          # Build Final
          make -j$(nproc --all) $MAKE_ARGS \
            KCFLAGS="-fcommon -fno-common -Wno-error -Wno-implicit-function-declaration -Wno-macro-redefined" \
            2>&1 | tee build.log

      - name: Upload Kernel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-Lineage-V16-NoJack
          path: |
            main/out/arch/arm64/boot/Image.gz-dtb
            main/out/arch/arm64/boot/dtbo.img
            main/build.log
