name: S10 Lite (V28 - Relaxed C Standards)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex git libssl-dev libelf-dev clang llvm lld zstd curl python3 device-tree-compiler gcc-aarch64-linux-gnu

      - name: Download Neutron Clang
        run: |
          mkdir -p clang
          wget https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang

      - name: Surgical Source Fix
        run: |
          # 1. Permisiuni si curatenie Makefile
          chmod -R 777 scripts/
          grep -rl "secgetspf" . | xargs sed -i 's/$(shell secgetspf)//g' 2>/dev/null || true
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' scripts/dtc/dtc-lexer.lex.c_shipped || true
          
          # 2. Mock Headers pentru Samsung Logging
          mkdir -p system/core/liblog/include/log
          mkdir -p system/logging/liblog/include/log
          touch system/core/liblog/include/log/perflog.h
          touch system/logging/liblog/include/log/perflog.h
          
          # 3. Dezactivare Samsung gcc-wrapper
          sed -i 's/exec /#exec /g' scripts/gcc-wrapper.py || true
          echo 'exec "$@"' >> scripts/gcc-wrapper.py

      - name: Build Kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          
          # Fortam toolchain-ul LLVM
          MAKE_ARGS="ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            O=out"

          # Configurare
          make $MAKE_ARGS g770f_defconfig

          # Patch config: eliminam WERROR si fixam Stack Protector
          ./scripts/config --file out/.config \
            -d CONFIG_CC_WERROR \
            -d CONFIG_CC_STACKPROTECTOR_STRONG \
            -e CONFIG_CC_STACKPROTECTOR_NONE

          make $MAKE_ARGS olddefconfig

          # COMPILARE cu flag-uri de relaxare pentru Clang
          # -Wno-strict-prototypes rezolva eroarea din dd_core.c
          # -Wno-unused-but-set-variable curata log-ul de warning-uri inutile
          make -j$(nproc --all) $MAKE_ARGS \
            KCFLAGS="--target=aarch64-linux-gnu \
                     -fcommon \
                     -fno-stack-protector \
                     -Wno-error \
                     -Wno-strict-prototypes \
                     -Wno-unused-but-set-variable \
                     -Wno-implicit-function-declaration \
                     -Wno-incompatible-pointer-types-discards-qualifiers" \
            2>&1 | tee build.log

      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-V28-Build
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/dtbo.img
            build.log
