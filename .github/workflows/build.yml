name: Build Roynas R5Q - Ravindu Smart Path
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: Roynas-Android-Playground/kernel_samsung_r3q
          ref: master
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev \
          ccache python3 python-is-python3 libarchive-tools wget libtinfo5

      - name: Setup Toolchains
        run: |
          mkdir clang gcc-cfp
          wget -q https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/clang-4639204-cfp-jopp.tar.gz
          tar -xf clang-4639204-cfp-jopp.tar.gz -C clang
          wget -q https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/gcc-cfp-jopp-only.tar.gz
          tar -xf gcc-cfp-jopp-only.tar.gz -C gcc-cfp

      - name: Build Kernel
        run: |
          # 1. Găsim automat unde sunt binarele (Auto-Discovery)
          CLANG_BIN=$(find $GITHUB_WORKSPACE/clang -name clang -type f -printf '%h\n' | head -n 1)
          GCC_BIN=$(find $GITHUB_WORKSPACE/gcc-cfp -name "aarch64-linux-android-gcc" -type f -printf '%h\n' | head -n 1)
          GOLD_LD=$(find $GITHUB_WORKSPACE/gcc-cfp -name "ld.gold" -type f -printf '%p\n' | head -n 1)
          
          echo "Clang found in: $CLANG_BIN"
          echo "GCC found in: $GCC_BIN"
          echo "Gold LD found at: $GOLD_LD"

          # 2. Exportăm PATH
          export PATH="$CLANG_BIN:$GCC_BIN:$PATH"

          # 3. FIX: Creăm link-ul simbolic folosind calea găsită de find
          # Asta va crea aarch64-linux-gnu-ld.gold în folderul de binare GCC
          ln -sf "$GOLD_LD" "$GCC_BIN/aarch64-linux-gnu-ld.gold"
          ln -sf "$GOLD_LD" "$GCC_BIN/aarch64-linux-gnu-ld"
          ln -sf "$GOLD_LD" "$GCC_BIN/aarch64-linux-android-ld.gold"

          # 4. Cleanup & Fixes
          find . -type f \( -name "Makefile*" -o -name "*.mk" -o -name "Kconfig*" \) -exec sed -i 's/-polly-loopfusion-greedy=1//g' {} +
          find . -type f \( -name "Makefile*" -o -name "*.mk" -o -name "Kconfig*" \) -exec sed -i 's/-mllvm -polly//g' {} +
          sed -i '/kernelsu/d' drivers/android/Kconfig
          sed -i '/kernelsu/d' drivers/android/Makefile
          sed -i 's/ifneq ($(wildcard $(srctree)\/scripts\/gcc-wrapper.py),)/ifeq (0,1)/g' Makefile

          # 5. Argumente Build
          MAKE_ARGS="ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-android- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            LD=aarch64-linux-android-ld.gold \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            O=out"

          # 6. Execuție
          make $MAKE_ARGS r5q_defconfig
          
          ./scripts/config --file out/.config \
            -d CONFIG_KNOX_KAP \
            -d CONFIG_SECURITY_SAMSUNG_KNOX \
            -d CONFIG_RKP_KDP \
            -d CONFIG_SAMSUNG_PRODUCT_SHIP \
            -d CONFIG_SECURITY_DEFEX \
            -d CONFIG_CC_STACKPROTECTOR_STRONG \
            -e CONFIG_CC_STACKPROTECTOR_NONE \
            -e CONFIG_BPF -e CONFIG_BPF_SYSCALL -e CONFIG_BPF_JIT \
            -e CONFIG_CGROUP_BPF -e CONFIG_NET_CLS_BPF -e CONFIG_NET_ACT_BPF

          make $MAKE_ARGS olddefconfig
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-fcommon -Wno-error -Wno-unused-command-line-argument"

      - name: Upload Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-Ravindu-AutoPath
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/dtbo.img
