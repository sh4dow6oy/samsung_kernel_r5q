name: S10 Lite - Final Header Fix

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves libncurses-dev git wget make python2 python3 pahole tar xz-utils lib32z1

      - name: Setup Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang
          echo "PROTON_PATH=$(pwd)/toolchain/proton-clang/bin" >> $GITHUB_ENV

      - name: Force Fix Headers
        run: |
          # 1. Creăm directoarele necesare în sursă
          mkdir -p include/linux
          mkdir -p include/uapi/linux
          
          # 2. Generăm un btf.h minimal dacă nu există (pentru a satisface compilatorul)
          if [ ! -f include/linux/btf.h ]; then
            echo -e "#ifndef _LINUX_BTF_H\n#define _LINUX_BTF_H\n#include <linux/types.h>\n#endif" > include/linux/btf.h
          fi
          
          # 3. Copiem peste tot unde e căutat
          cp include/linux/btf.h include/uapi/linux/btf.h
          
          # 4. Fix Samsung scripts & Python
          echo -e '#!/bin/bash\necho "0"' > /tmp/secgetspf
          chmod +x /tmp/secgetspf
          sudo mv /tmp/secgetspf /usr/bin/secgetspf
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Build Kernel
        run: |
          export PATH="${{ env.PROTON_PATH }}:$PATH"
          
          # Sincronizăm headerul și în folderul de build (O=out)
          mkdir -p out/include/linux
          mkdir -p out/include/uapi/linux
          cp include/linux/btf.h out/include/linux/
          cp include/linux/btf.h out/include/uapi/linux/

          MAKE_ARGS="
            O=out \
            ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1
          "
          
          # Adăugăm flag-ul de sistem pentru a include folderul local cu prioritate
          export KCFLAGS="-Wno-error -Wno-implicit-function-declaration -Wno-unknown-warning-option -I$(pwd)/include"

          # Configurare
          make $MAKE_ARGS r5q_eur_open_defconfig
          
          # Dezactivăm BTF și LTO pentru stabilitate
          sed -i 's/CONFIG_DEBUG_INFO_BTF=y/CONFIG_DEBUG_INFO_BTF=n/g' out/.config
          sed -i 's/CONFIG_LTO_CLANG=y/CONFIG_LTO_CLANG=n/g' out/.config
          sed -i 's/CONFIG_LTO=y/CONFIG_LTO=n/g' out/.config
          
          make $MAKE_ARGS olddefconfig
          
          # Build cu 3 thread-uri (echilibru între viteză și RAM)
          make -j3 $MAKE_ARGS

          if [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image .
            echo "SUCCESS=true" >> $GITHUB_ENV
          fi

      - name: Upload Artifact
        if: env.SUCCESS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-Kernel-Fixed
          path: Image
