name: Build Samsung S10 Lite (r5q) - Neutron Clang

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        repository: sh4dow6oy/android_kernel_samsung_a82xq
        ref: linux-4.14.285
        fetch-depth: 1

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential bison flex libssl-dev libelf-dev xz-utils wget git gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi zstd python3

    - name: Download and Setup Neutron Clang
      run: |
        mkdir -p neutron
        wget https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
        tar -I zstd -xf neutron-clang-10032024.tar.zst -C neutron
        echo "NEUTRON_BIN=$(pwd)/neutron/bin" >> $GITHUB_ENV

    - name: Brutal Source Patching (Samsung & Clang Fixes)
      run: |
        # 1. Eliminăm orice referință la gcc-wrapper.py care forțează Python
        find . -name "Makefile*" -o -name "*.mak" -o -name "*.include" | xargs sed -i 's/python $(srctree)\/scripts\/gcc-wrapper.py//g'
        find . -name "Makefile*" -o -name "*.mak" -o -name "*.include" | xargs sed -i 's/$(srctree)\/scripts\/gcc-wrapper.py//g'
        sed -i 's/python / /g' Makefile scripts/Makefile.*

        # 2. Fix pentru eroarea 'clk_debugfs_bus_cl_id' în drivers/clk/clk.c
        # Injectăm declarația variabilei la începutul fișierului
        sed -i '40i static uint32_t clk_debugfs_bus_cl_id;' drivers/clk/clk.c
        sed -i '41i #include <linux/msm-bus.h>' drivers/clk/clk.c

        # 3. Rezolvăm dependințele de fișiere lipsă (perflog.h) pe care Samsung le caută în afara sursei
        mkdir -p ../system/core/liblog/include/log/
        mkdir -p ../../system/core/liblog/include/log/
        mkdir -p ../../system/logging/liblog/include/log/
        echo "" > ../system/core/liblog/include/log/perflog.h
        echo "" > ../../system/core/liblog/include/log/perflog.h
        echo "" > ../../system/logging/liblog/include/log/perflog.h
        
        # 4. Bypass secgetspf (utilitar de securitate Samsung)
        echo -e "#!/bin/bash\nexit 0" > scripts/secgetspf
        chmod +x scripts/secgetspf
        sudo cp scripts/secgetspf /usr/local/bin/secgetspf

    - name: Build Kernel
      run: |
        # Adăugăm Clang în PATH
        export PATH="${{ env.NEUTRON_BIN }}:$PATH"
        
        # Variabile mediu
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        
        # Setăm CC și LD pentru Neutron
        export CC=clang
        export LD=ld.lld
        export AR=llvm-ar
        export NM=llvm-nm
        export OBJCOPY=llvm-objcopy
        export OBJDUMP=llvm-objdump
        export STRIP=llvm-strip

        # Configurare
        make clean
        make mrproper
        make r5q_eur_open_defconfig
        
        # Compilare cu LLVM=1 și ignorarea warning-urilor (-w)
        make -j$(nproc --all) \
                      ARCH=arm64 \
                      CC=clang \
                      LD=ld.lld \
                      AR=llvm-ar \
                      NM=llvm-nm \
                      OBJCOPY=llvm-objcopy \
                      OBJDUMP=llvm-objdump \
                      STRIP=llvm-strip \
                      CLANG_TRIPLE=aarch64-linux-gnu- \
                      CROSS_COMPILE=aarch64-linux-gnu- \
                      CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
                      LLVM=1 \
                      LLVM_IAS=1 \
                      KCFLAGS="-w" \
                      DTC_EXT=dtc

    - name: Check Results
      run: |
        echo "Căutăm fișierul Image.gz în arch/arm64/boot/..."
        ls -l arch/arm64/boot/
        if [ -f arch/arm64/boot/Image.gz-dtb ] || [ -f arch/arm64/boot/Image.gz ]; then
            echo "SUCCESS: Kernel built!"
        else
            echo "ERROR: Kernel image not found."
            exit 1
        fi

    - name: Upload Kernel Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-S10Lite-Neutron-R5Q
        path: |
          arch/arm64/boot/Image.gz*
          arch/arm64/boot/dtbo.img
