name: Build S10 Lite (L23 + Neutron Hard Clean)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: nzlnice/kernel_qcom_sm8150
          ref: lineage-23.0
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex git libssl-dev libelf-dev clang llvm lld zstd curl libarchive-tools

      - name: Download and Extract Neutron Clang
        run: |
          mkdir clang-neutron
          wget https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang-neutron
          echo "$GITHUB_WORKSPACE/clang-neutron/bin" >> $GITHUB_PATH

      - name: Inject Samsung r5q Config & Enable BPF
        run: |
          curl -LSs https://raw.githubusercontent.com/mainey/android_kernel_samsung_r5q/lineage-19.0/arch/arm64/configs/r5q_eur_open_defconfig > arch/arm64/configs/vendor/r5q_samsung_defconfig
          KCONFIG=arch/arm64/configs/vendor/r5q_samsung_defconfig
          {
            echo "CONFIG_BPF=y"
            echo "CONFIG_BPF_SYSCALL=y"
            echo "CONFIG_BPF_JIT=y"
            echo "CONFIG_HAVE_EBPF_JIT=y"
            echo "CONFIG_BPF_JIT_ALWAYS_ON=y"
          } >> $KCONFIG

      - name: Patch Source and Makefile (Hard Cleaning Flags)
        run: |
          # 1. Eliminăm flag-urile de eroare care blochează Clang (Regex Power)
          # Aceasta șterge tot argumentul care conține termenii de eroare, evitând resturi de tipul "-Wno-error="
          find . -type f -name "Makefile*" -exec sed -i 's/-W[^ ]*unknown-warning-option//g' {} +
          find . -type f -name "Makefile*" -exec sed -i 's/-W[^ ]*return-type//g' {} +
          find . -type f -name "Makefile*" -exec sed -i 's/-W[^ ]*implicit-function-declaration//g' {} +
          find . -type f -name "Makefile*" -exec sed -i 's/-W[^ ]*maybe-uninitialized//g' {} +
          find . -type f -name "Makefile*" -exec sed -i 's/-Werror//g' {} +
          
          # 2. Fix pentru căile de compilare vechi
          sed -i 's/CROSS_COMPILE_ARM32 := arm-linux-androideabi-/CROSS_COMPILE_ARM32 := arm-linux-gnueabi-/g' Makefile
          sed -i 's/CROSS_COMPILE := aarch64-linux-android-/CROSS_COMPILE := aarch64-linux-gnu-/g' Makefile
          
          # 3. Fix BPF Header Include
          sed -i '1i #include <linux/filter.h>' kernel/bpf/verifier.c

      - name: Configure Kernel
        run: |
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=0 \
            vendor/r5q_samsung_defconfig
          
          # Aplicăm noutățile din Lineage 23
          make -j$(nproc --all) O=out ARCH=arm64 LLVM=1 LLVM_IAS=0 olddefconfig

      - name: Build Kernel Image
        run: |
          # Folosim LLVM_IAS=0 pentru a folosi asamblorul extern (GNU as) din toolchain, mai permisiv
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=0 \
            V=1 2>&1 | tee build.log

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-L23-HardClean
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/dtbo.img
            build.log
