name: S10 Lite - 4.19 Hybrid (Mainey Drivers)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Maximize RAM (Swap)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc "/usr/local/share/boost"
          sudo fallocate -l 4G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves libncurses-dev git wget make python2 python3 pahole tar xz-utils lib32z1

      - name: Setup Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang
          echo "PROTON_PATH=$(pwd)/toolchain/proton-clang/bin" >> $GITHUB_ENV

      - name: Hybrid Source Preparation
        run: |
          # 1. Baza 4.19 (Upstream Target)
          git clone --depth=1 https://github.com/duckyduckG/android_kernel_qcom_sm8150_419.git kernel_source
          
          # 2. Driverele Mainey (Samsung r5q Optimized)
          git clone --depth=1 https://github.com/mainey/android_kernel_samsung_r5q.git samsung_source
          
          # 3. Injectare Techpack & Config
          # Nota: techpack-ul lui mainey este esențial pentru sunet și display pe S10 Lite
          rm -rf kernel_source/techpack
          cp -r samsung_source/techpack kernel_source/
          cp samsung_source/arch/arm64/configs/r5q_eur_open_defconfig kernel_source/arch/arm64/configs/r5q_defconfig
          
          # 4. Injectare DTS (Device Tree)
          # Folosim find pentru a nu suprascrie pm8150.dtsi-ul bazei 4.19
          find samsung_source/arch/arm64/boot/dts/vendor/qcom/ -name "*r5q*" -exec cp {} kernel_source/arch/arm64/boot/dts/vendor/qcom/ \;
          
          cd kernel_source

          # === FIX-URI PENTRU COMPATIBILITATE 4.19 ===
          # Fix Audio (L1SS s-ar putea să dea erori în pcm-q6)
          sed -i '20i #define L1SS_AUDIO 0' techpack/audio/asoc/msm-pcm-q6-noirq.c || true
          
          # Fix redefinire jack (Audio)
          sed -i 's/SND_JACK_MICROPHONE2/SND_JACK_MICROPHONE/g' techpack/audio/asoc/codecs/wcd-mbhc-v2.h || true

          # Fix Samsung Tools
          echo -e '#!/bin/bash\necho "0"' > /tmp/secgetspf
          chmod +x /tmp/secgetspf
          sudo mv /tmp/secgetspf /usr/bin/secgetspf

      - name: Build Kernel
        run: |
          export PATH="${{ env.PROTON_PATH }}:$PATH"
          cd kernel_source
          
          MAKE_ARGS="
            O=out \
            ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1
          "
          
          # Flag-uri de suprimare erori (Esential pentru drivere 4.14 pe baza 4.19)
          export KCFLAGS="-Wno-error -Wno-implicit-function-declaration -Wno-int-conversion -Wno-incompatible-pointer-types -Wno-unused-variable -Wno-format-security"

          mkdir -p out
          make $MAKE_ARGS r5q_defconfig
          
          # Dezactivam chestiile care blocheaza linking-ul
          sed -i 's/CONFIG_LTO_CLANG=y/CONFIG_LTO_CLANG=n/g' out/.config
          sed -i 's/CONFIG_DEBUG_INFO_BTF=y/CONFIG_DEBUG_INFO_BTF=n/g' out/.config
          
          make $MAKE_ARGS olddefconfig
          
          # Build cu monitorizare RAM
          make -j2 $MAKE_ARGS || make -j1 $MAKE_ARGS

          if [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image ../
            find out/arch/arm64/boot/dts/ -name "*.dtbo" -exec cp {} ../ \; || true
            echo "SUCCESS=true" >> $GITHUB_ENV
          fi

      - name: Upload
        if: env.SUCCESS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-4.19-Mainey-Hybrid
          path: |
            Image
            *.dtbo
