name: Build r5q Kernel - Xiaomi BPF Final Fix v11

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev python3 clang llvm lld

      - name: Clone Mainey Kernel
        run: |
          git clone --depth=500 https://github.com/mainey/android_kernel_samsung_r5q.git -b lineage-19.0 kernel
          cd kernel
          git config user.email "wizard@build.com"
          git config user.name "Kernel-Wizard"

      - name: 1. Upstream & Xiaomi eBPF Integration
        run: |
          cd kernel
          git remote add clo https://git.codelinaro.org/clo/la/kernel/msm.git
          git fetch clo aosp-common/android-4.14-stable --depth=50
          git merge FETCH_HEAD -m "Upstream CLO" -X ours --allow-unrelated-histories || echo "Merge handled"
          git reset --mixed
          
          git fetch https://github.com/LineageOS/android_kernel_xiaomi_sm6150 refs/changes/08/469808/1
          git checkout FETCH_HEAD -f -- \
            include/linux/bpf.h \
            include/linux/filter.h \
            include/uapi/linux/bpf.h \
            kernel/bpf/core.c \
            kernel/bpf/verifier.c \
            kernel/bpf/syscall.c \
            net/core/filter.c
          
          git fetch https://github.com/LineageOS/android_kernel_xiaomi_sm6150 f623fe3c3acf869236649d2bb16191899c44ca6f
          git cherry-pick FETCH_HEAD || git checkout FETCH_HEAD -f -- kernel/bpf/syscall.c include/linux/bpf.h
          
          git add .
          git commit -m "BPF Core & Memory Fix Integrated"

      - name: 2. Nuclear Conflict Resolution (v11)
        run: |
          cd kernel
          # 1. Fix 'bool' in filter.h
          sed -i 's/#ifndef _LINUX_FILTER_H/#ifndef _LINUX_FILTER_H\n#include <linux/types.h>/g' include/linux/filter.h
          
          # 2. Fix bpf_map_area_alloc visibility
          sed -i 's/static void \*bpf_map_area_alloc/void \*bpf_map_area_alloc/g' kernel/bpf/syscall.c
          sed -i 's/static void bpf_map_area_free/void bpf_map_area_free/g' kernel/bpf/syscall.c
          
          # 3. Clean verifier.c from duplicates
          sed -i '/struct bpf_verifier_log {/,/};/d' kernel/bpf/verifier.c
          sed -i '/struct bpf_line_info {/,/};/d' kernel/bpf/verifier.c
          sed -i '/struct bpf_func_info {/,/};/d' kernel/bpf/verifier.c
          sed -i '1i #include <linux/bpf.h>' kernel/bpf/verifier.c
          
          # 4. Clean global headers
          sed -i '/struct bpf_verifier_env {/,/};/d' include/linux/bpf_verifier.h || true
          sed -i '/struct bpf_prog_offload_ols {/,/};/d' kernel/bpf/core.c
          
          # 5. Fix UAPI BPF_PROG_TYPE_NETFILTER (Single Injection)
          # Stergem orice tentativa anterioara si injectam curat
          sed -i '/BPF_PROG_TYPE_NETFILTER/d' include/uapi/linux/bpf.h
          sed -i '/BPF_PROG_TYPE_LWT_SEG6LOCAL,/a \	BPF_PROG_TYPE_NETFILTER,' include/uapi/linux/bpf.h
          
          # 6. Fix Connectivity & Samsung
          sed -i 's/dev_get_by_index_rcu/dev_get_by_index/g' net/core/filter.c
          sed -i 's/sec_debug_sched_msg/\/\/ sec_debug_sched_msg/g' arch/arm64/kernel/traps.c
          sed -i 's|$(srctree)/../toolchain/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin/aarch64-linux-android-||g' Makefile
          echo -e "#!/bin/sh\necho '00000000000000000000000000000000'\nexit 0" > secgetspf
          chmod +x secgetspf

      - name: 3. Configure and Build
        run: |
          cd kernel
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export PATH=$PATH:$(pwd)

          mkdir -p out
          make O=out ARCH=arm64 r5q_eur_open_defconfig
          
          # SM8150 eBPF Connectivity Config
          scripts/config --file out/.config -e BPF -e BPF_SYSCALL -e BPF_JIT -e CGROUP_BPF
          scripts/config --file out/.config -e NETFILTER_XT_MATCH_BPF -e NET_ACT_BPF -e BPF_STREAM_PARSER
          scripts/config --file out/.config -e NET_CLS_ACT -e NET_CLS_BPF -e STREAM_PARSER
          scripts/config --file out/.config --set-val NR_CPUS 8
          scripts/config --file out/.config -d SEC_DEBUG
          
          yes "" | make O=out ARCH=arm64 oldconfig
          
          make -j$(nproc --all) O=out ARCH=arm64 \
            LD=ld.lld \
            KCFLAGS="-Wno-error -Wno-implicit-function-declaration -fcommon -DNR_CPUS=8"

      - name: Upload Kernel
        uses: upload-artifact@v4
        with:
          name: Kernel-r5q-Xiaomi-BPF-v11
          path: |
            kernel/out/arch/arm64/boot/Image.gz-dtb
            kernel/out/arch/arm64/boot/dtbo.img
