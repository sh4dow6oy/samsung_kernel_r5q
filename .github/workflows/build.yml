name: Build R5Q - Android 15 Hybrid V26
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Your Kernel (r5q)
        uses: actions/checkout@v4
        with:
          repository: Roynas-Android-Playground/kernel_samsung_r3q
          ref: master
          path: kernel
          fetch-depth: 0

      - name: Android 15 BPF Surgical Injection (V26)
        run: |
          cd kernel
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          
          git remote add phoenix https://github.com/PhoenixKernel/linux.git
          git fetch phoenix android-4.14-phoenix --depth=1
          git fetch phoenix android12-5.10-phoenix --depth=1
          
          echo "Nuclear Clean of KernelSU..."
          find . -name "Kconfig" -type f -exec sed -i '/kernelsu/d' {} +
          
          echo "Syncing 5.10 BPF Subsystem..."
          git checkout phoenix/android12-5.10-phoenix -- kernel/bpf/
          git checkout phoenix/android12-5.10-phoenix -- include/linux/bpf.h
          git checkout phoenix/android12-5.10-phoenix -- include/linux/btf.h
          git checkout phoenix/android12-5.10-phoenix -- include/uapi/linux/bpf.h
          git checkout phoenix/android12-5.10-phoenix -- include/linux/tnum.h
          git checkout phoenix/android12-5.10-phoenix -- include/linux/bpf_verifier.h

          echo "Creating Dedicated BPF Compatibility Header..."
          cat <<EOF > kernel/bpf/bpf_compat.h
          #ifndef __BPF_COMPAT_H
          #define __BPF_COMPAT_H
          #include <linux/mm.h>
          #include <linux/rwsem.h>

          /* Map 5.10 mmap_lock to 4.14 mmap_sem */
          #ifndef mmap_lock
          #define mmap_lock mmap_sem
          #endif

          #define mmap_read_lock(mm) down_read(&(mm)->mmap_sem)
          #define mmap_read_unlock(mm) up_read(&(mm)->mmap_sem)
          #define mmap_write_lock(mm) down_write(&(mm)->mmap_sem)
          #define mmap_write_unlock(mm) up_write(&(mm)->mmap_sem)

          #ifndef vfree_atomic
          #define vfree_atomic(addr) vfree(addr)
          #endif

          /* Missing BTF Constants for Android 15 */
          #ifndef BTF_KIND_FLOAT
          #define BTF_KIND_FLOAT 16
          #define BTF_KIND_DECL_TAG 17
          #define BTF_KIND_TYPE_TAG 18
          #endif

          struct bpf_verifier_log;
          struct bpf_map_memory { uint32_t pages; void *user; };
          
          static inline void bpf_map_put_uref(void *map) {}
          static inline int bpf_jit_charge_modmem(void *p, int s) { return 0; }
          static inline void bpf_jit_uncharge_modmem(void *p, int s) {}
          #endif
          EOF

          # Injectăm compatibilitatea în toate fișierele .c din kernel/bpf/
          for f in kernel/bpf/*.c; do
            sed -i '1i #include "bpf_compat.h"' "$f"
          done

          echo "Expanding Structs in bpf.h..."
          sed -i '/struct bpf_map {/a \	void *memcg;\n\tvoid *offload;\n\tstruct bpf_map_memory memory;' include/linux/bpf.h
          sed -i '/struct bpf_prog_aux {/a \	void *vm;' include/linux/bpf.h

          echo "Fixing Network & Security..."
          sed -i 's/NF_HOOK(plat, hook, in, out, okfn)/NF_HOOK(plat, hook, net, sk, in, out, okfn)/g' include/linux/netfilter.h
          
          git checkout phoenix/android-4.14-phoenix -- security/security.c
          git checkout phoenix/android-4.14-phoenix -- include/linux/lsm_hooks.h
          sed -i '/struct lsm_id \*id;/a \	void *bpf_lsm_hooks;' include/linux/lsm_hooks.h
          
          # Fix MM types for arg_lock (Android 15 requirement)
          sed -i '1i #include <uapi/linux/auxvec.h>' include/linux/mm_types.h
          sed -i '/struct task_struct \*owner;/a \	spinlock_t arg_lock;\n\tunsigned long saved_auxv[AT_VECTOR_SIZE];' include/linux/mm_types.h

          git add .
          git commit -m "Hybrid V26: Targeted BPF compatibility and BTF constants" || echo "No changes"

      - name: Setup Toolchain
        run: |
          sudo apt-get update && sudo apt-get install -y zstd libssl-dev bc bison flex
          mkdir clang && wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang
          echo "$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_PATH

      - name: Build Kernel
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          MAKE_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- O=out"

          mkdir -p out
          make $MAKE_ARGS r5q_defconfig
          ./scripts/config --file out/.config \
            -e CONFIG_BPF -e CONFIG_BPF_SYSCALL -e CONFIG_BPF_JIT -e CONFIG_BPF_LSM \
            -d CONFIG_SAMSUNG_RTIC -d CONFIG_SECURITY_RKP -d CONFIG_WERROR
          make $MAKE_ARGS olddefconfig
          
          make -j$(nproc --all) $MAKE_ARGS Image.gz \
            KCFLAGS="-w -fcommon -fno-stack-protector -fintegrated-as -Wno-implicit-function-declaration -Wno-error=int-conversion -Wno-error=return-type -Wno-typedef-redefinition"
