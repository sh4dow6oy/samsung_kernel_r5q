name: Build Lumi R5Q - Ultimate BPF Fixed
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: LumiPlayground/android_kernel_samsung_sm8150
          ref: rawr-bpf
          path: kernel
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev \
          ccache python3 python-is-python3 libarchive-tools wget zstd zip \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libncurses-dev libtinfo6 \
          device-tree-compiler clang

      - name: Setup Toolchain (Neutron Clang)
        run: |
          mkdir -p clang
          wget -q https://github.com/Ylarod/setup-ndk-clang/releases/download/prebuilt/clang-linux-x86-ndk-r29-r563880c.tar.zst
          tar -I zstd -xf clang-linux-x86-ndk-r29-r563880c.tar.zst -C clang

      - name: Build Kernel
        run: |
          cd kernel
          chmod -R +x tools/
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          
          # Fix Multiple Definition Error
          grep -r "bool main_ext_ss_not_working" . | cut -d: -f1 | xargs sed -i 's/bool main_ext_ss_not_working/static bool main_ext_ss_not_working/g' || true
          
          export MAKE_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang \
            DTC_EXT=$(pwd)/tools/dtc \
            CONFIG_BUILD_ARM64_DT_OVERLAY=y \
            CONFIG_PROJECT_R5Q=y \
            CONFIG_SEC_R5Q_PROJECT=y \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD=ld.lld \
            O=out"

          make $MAKE_ARGS r5q_eur_open_defconfig
          
          # Activare BPF completa & Dezactivare Samsung Security (RTIC)
          ./scripts/config --file out/.config \
            -e CONFIG_BPF_SYSCALL -e CONFIG_BPF_JIT -e CONFIG_CGROUP_BPF \
            -e CONFIG_NETFILTER_XT_MATCH_BPF -d CONFIG_RTIC \
            -e CONFIG_BUILD_ARM64_DT_OVERLAY -e CONFIG_SEC_R5Q_PROJECT \
            -e CONFIG_PROJECT_R5Q -e CONFIG_SAMSUNG_PRODUCT_SHIP \
            -e CONFIG_LTO_CLANG_NONE
            
          make $MAKE_ARGS olddefconfig
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-fcommon -w" O=out Image.gz-dtb dtbs

      - name: Proper DTBO Packaging & AnyKernel3 Config
        run: |
          # 1. Setup AnyKernel3
          git clone https://github.com/osm0sis/AnyKernel3.git
          cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/Image.gz
          
          # 2. Compilare Manuala DTBO cu Preprocesare
          mkdir -p dtbo_manual
          DTS_ROOT="kernel/arch/arm64/boot/dts"
          
          find "$DTS_ROOT/samsung/renovation" -name "sm8150-sec-r5q-overlay*.dts" | while read -r dts_file; do
            dtbo_name=$(basename "$dts_file" .dts).dtbo
            clang -E -nostdinc -undef -D__DTS__ -x assembler-with-cpp \
              -I kernel/include -I "$DTS_ROOT" -I "$DTS_ROOT/qcom" \
              -I "$DTS_ROOT/samsung" -I "$DTS_ROOT/samsung/renovation" \
              "$dts_file" -o "dtbo_manual/tmp.dts"
            kernel/tools/dtc -@ -I dts -O dtb -o "dtbo_manual/$dtbo_name" "dtbo_manual/tmp.dts"
          done

          # 3. MKDTBOIMG - Creeaza imaginea cu TABELA DE INDEX (Fix-ul pentru Bootloop)
          wget https://raw.githubusercontent.com/LineageOS/android_system_libufdt/lineage-21.0/utils/src/mkdtboimg.py
          python3 mkdtboimg.py create AnyKernel3/dtbo.img dtbo_manual/*.dtbo

          # 4. Configurare AnyKernel3 pentru S10 Lite (R5Q)
          cd AnyKernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          # Setam partitiile corecte
          sed -i 's|block=auto;|block=/dev/block/by-name/boot;|g' anykernel.sh
          sed -i '/block=\/dev\/block\/by-name\/boot;/a dtbo_block=/dev/block/by-name/dtbo;' anykernel.sh
          # Patch VBMeta pentru a trece de Verified Boot
          sed -i 's/patch_vbmeta_flag=auto/patch_vbmeta_flag=1/g' anykernel.sh
          
          zip -r9 ../Lumi-R5Q-BPF-Final-V2.zip *

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Lumi-R5Q-Kernel
          path: Lumi-R5Q-BPF-Final-V2.zip
