name: Build r5q Kernel - eBPF & Offload Final

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi git libssl-dev python3 clang llvm lld

      - name: Clone Mainey Kernel (Base lineage-19.0)
        run: |
          git clone --depth=100 https://github.com/mainey/android_kernel_samsung_r5q.git -b lineage-19.0 kernel
          cd kernel
          git config user.email "wizard@build.com"
          git config user.name "Kernel-Wizard"

      - name: Fetch and Hard-Apply eBPF & Offload
        run: |
          cd kernel
          # 1. Fetch baza de eBPF (Gerrit 387879)
          git fetch https://github.com/LineageOS/android_kernel_samsung_sm7125 refs/changes/79/387879/1
          
          echo "Forțăm checkout pe fișierele eBPF..."
          git checkout FETCH_HEAD -- include/linux/bpf.h \
                                     include/linux/bpf_verifier.h \
                                     include/linux/netdevice.h \
                                     include/uapi/linux/bpf.h \
                                     kernel/bpf/core.c \
                                     kernel/bpf/Makefile \
                                     kernel/bpf/offload.c \
                                     kernel/bpf/syscall.c \
                                     kernel/bpf/verifier.c \
                                     net/core/filter.c

          # PAS CRITIC: Facem commit la schimbările de checkout pentru a lăsa mediul curat
          git add .
          git commit -m "Import eBPF base files from sm7125"

          # 2. Fetch și aplicare commit specific pentru Offload (c3a78a9)
          git fetch https://github.com/LineageOS/android_kernel_samsung_sm7125 c3a78a941a2f57ba2d65923b7c2bdf704f1cef98
          
          # Încercăm cherry-pick. Dacă eșuează, folosim 'theirs' pentru a rezolva automat
          git cherry-pick FETCH_HEAD -X theirs || {
            echo "Conflict la cherry-pick, forțăm resetarea..."
            git cherry-pick --abort
            git checkout FETCH_HEAD -- .
            git add .
            git commit --allow-empty -m "Hard merge offload commit"
          }

      - name: Nuclear Path & Samsung Debug Fix
        run: |
          cd kernel
          # Eliminăm căile hardcoded către toolchain-ul local Google
          sed -i 's|$(srctree)/../toolchain/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin/aarch64-linux-android-||g' Makefile
          sed -i 's|CROSS_COMPILE_ARM32 :=.*|CROSS_COMPILE_ARM32 := arm-linux-gnueabi-|g' Makefile
          
          # Fix BPF_OBJ_NAME_LEN
          sed -i '/#define _UAPI__LINUX_BPF_H/a #ifndef BPF_OBJ_NAME_LEN\n#define BPF_OBJ_NAME_LEN 16U\n#endif' include/uapi/linux/bpf.h

          # Comentăm debug-ul Samsung care dă erori
          sed -i 's/sec_debug_sched_msg/\/\/ sec_debug_sched_msg/g' arch/arm64/kernel/traps.c
          sed -i 's/sec_debug_summary/\/\/ sec_debug_summary/g' arch/arm64/kernel/traps.c
          sed -i 's/sec_debug_save_badmode/\/\/ sec_debug_save_badmode/g' arch/arm64/kernel/traps.c

      - name: Configure and Build
        run: |
          cd kernel
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          
          mkdir -p out
          make O=out ARCH=arm64 r5q_eur_open_defconfig
          
          # Configurații finale
          scripts/config --file out/.config --set-val NR_CPUS 8
          scripts/config --file out/.config -d SEC_DEBUG
          scripts/config --file out/.config -e BPF -e BPF_SYSCALL -e BPF_JIT -e CGROUP_BPF -e NETFILTER_XT_MATCH_BPF
          
          # Build cu Linker modern
          make -j$(nproc --all) O=out ARCH=arm64 \
            LD=ld.lld \
            KCFLAGS="-Wno-error -Wno-implicit-function-declaration -fcommon -DNR_CPUS=8"

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-r5q-eBPF-Final-Build
          path: |
            kernel/out/arch/arm64/boot/Image.gz-dtb
            kernel/out/arch/arm64/boot/dtbo.img
