name: Lumi Kernel R5Q - Clean Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: rawr-rebase
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev \
          python3 python-is-python3 device-tree-compiler clang zip wget zstd

      - name: Setup Toolchain (Neutron Clang)
        run: |
          mkdir -p clang
          wget -q https://github.com/Ylarod/setup-ndk-clang/releases/download/prebuilt/clang-linux-x86-ndk-r29-r563880c.tar.zst
          tar -I zstd -xf clang-linux-x86-ndk-r29-r563880c.tar.zst -C clang

      - name: Build Kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          mkdir -p out
          
          # Fix eroare definitie multipla
          find . -type f -name "*.c" -o -name "*.h" | xargs grep -l "bool main_ext_ss_not_working" | xargs sed -i 's/bool main_ext_ss_not_working/static bool main_ext_ss_not_working/g' || true
          
          export MAKE_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld \
            CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- O=out"

          # 1. Configurare (Baza + R5Q)
          make $MAKE_ARGS sm8150_sec_defconfig
          if [ -f "arch/arm64/configs/r5q.config" ]; then
            ARCH=arm64 scripts/kconfig/merge_config.sh -O out out/.config arch/arm64/configs/r5q.config
          fi
          
          # 2. DEZACTIVARE KERNELSU SI SECURITATE SAMSUNG
          # Dezactivam CONFIG_KSU daca exista si fortam setarile de preventie
          ./scripts/config --file out/.config \
            -d CONFIG_KSU \
            -e CONFIG_BPF_SYSCALL -e CONFIG_BPF_JIT -e CONFIG_CGROUP_BPF \
            -d CONFIG_RTIC -d CONFIG_SECURITY_DEFEX -d CONFIG_SECURITY_SAMSUNG_KNOX \
            -e CONFIG_BUILD_ARM64_DT_OVERLAY -e CONFIG_SEC_R5Q_PROJECT \
            -e CONFIG_SAMSUNG_PRODUCT_SHIP -d CONFIG_RKP_KDP -d CONFIG_KDP_NS
            
          # 3. Compilare
          make $MAKE_ARGS olddefconfig
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-fcommon -w" Image.gz-dtb dtbs

      - name: Package AnyKernel3
        run: |
          # Build DTBO.img
          DTBO_DIR="out/arch/arm64/boot/dts/samsung/renovation"
          DTBO_FILES=$(find "$DTBO_DIR" -name "sm8150-sec-r5q-overlay*.dtbo" | sort)
          ./tools/mkdtimg create out/dtbo.img --page_size=4096 ${DTBO_FILES}

          # Setup AnyKernel
          git clone https://github.com/osm0sis/AnyKernel3.git
          cd AnyKernel3
          mv ../out/dtbo.img dtbo.img
          mv ../out/arch/arm64/boot/Image.gz-dtb Image.gz
          
          # Configurare anykernel.sh (Fix Bootloop Samsung)
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          sed -i 's|block=auto;|block=/dev/block/by-name/boot;|g' anykernel.sh
          sed -i 's/patch_vbmeta_flag=auto/patch_vbmeta_flag=1/g' anykernel.sh
          
          # Metoda flash direct (Sari peste ramdisk)
          sed -i 's/dump_boot;/split_boot;/g' anykernel.sh
          sed -i 's/write_boot;/flash_boot;/g' anykernel.sh
          
          # Injectare Flash DTBO
          sed -i '/flash_boot;/a \
          if [ -f "dtbo.img" ]; then \
            dtbo_block=/dev/block/by-name/dtbo; \
            ui_print "- Flashing DTBO.img..."; \
            flash_generic dtbo; \
          fi' anykernel.sh
          
          zip -r9 ../Lumi-Kernel-R5Q-NoKSU.zip *

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Lumi-Kernel-NoKSU
          path: Lumi-Kernel-R5Q-NoKSU.zip
