name: Build Samsung SM8150 (Auriana)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Cleanup and Install Dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo add-apt-repository universe -y
          sudo apt-get update
          sudo apt-get install -y python2-minimal bc build-essential flex bison ncurses-dev libssl-dev libelf-dev xz-utils libfl-dev git-core ccache zip zstd binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi gcc-multilib libc6:i386 libstdc++6:i386

      - name: Clone Kernel Source
        run: git clone --depth=1 -b auriana https://github.com/sh4dow6oy/android_kernel_samsung_sm8150.git s

      - name: Download Proton Clang
        run: git clone --depth=1 https://github.com/kdrag0n/proton-clang.git llvm-proton

      - name: Build and Patch Kernel
        run: |
          # 1. Identificăm automat unde se află sursele kernelului
          if [ -d "s/drivers" ]; then
            KERNEL_SRC_DIR="s"
          else
            KERNEL_SRC_DIR="."
          fi
          echo "Sursele kernelului au fost găsite în: $KERNEL_SRC_DIR"
          
          # 2. Configurare mediu toolchain (Proton Clang)
          export ARCH=arm64
          TOOLCHAIN_PATH="${{ github.workspace }}/llvm-proton/bin"
          export PATH="$TOOLCHAIN_PATH:$PATH"
          
          chmod +x $KERNEL_SRC_DIR/tools/mkdtimg
          
          # --- FIX PERMISIUNI secgetspf ORIGINAL ---
          ORIGINAL_SPF=$(find . -name "secgetspf" -type f | head -n 1)
          if [ -z "$ORIGINAL_SPF" ]; then
            echo "⚠️ secgetspf nu a fost găsit în surse! Fallback la dummy..."
            echo -e '#!/bin/sh\nexit 0' > $TOOLCHAIN_PATH/secgetspf
            chmod 755 $TOOLCHAIN_PATH/secgetspf
          else
            echo "✅ Găsit secgetspf original la: $ORIGINAL_SPF"
            cp "$ORIGINAL_SPF" $TOOLCHAIN_PATH/secgetspf
            chmod 755 $TOOLCHAIN_PATH/secgetspf
          fi
          
          # 3. PATCH-URI DIRECTE ÎN CODUL SURSĂ
          # A) Patch pentru msleep în usbpd_manager.c
          sed -i '1s/^/#include <linux\/delay.h>\n/' $KERNEL_SRC_DIR/drivers/ccic/usbpd_manager.c
          
          # B) Patch pentru dwc3-msm.c (Ocolim variabila lipsă restarting_host_mode)
          sed -i 's/enable, id, mdwc->restarting_host_mode/enable, id, 0/g' $KERNEL_SRC_DIR/drivers/usb/dwc3/dwc3-msm.c
          sed -i 's/while (mdwc->restarting_host_mode)/while (0)/g' $KERNEL_SRC_DIR/drivers/usb/dwc3/dwc3-msm.c
          
          # C) Patch avansat pentru usb_notify.c (Golim funcția defectă în loc să dezactivăm fișierul)
          # Acest lucru păstrează simbolurile globale funcționale pentru f_ss_mon_gadget.c
          if [ -f "$KERNEL_SRC_DIR/drivers/usb/notify/usb_notify.c" ]; then
            # Căutăm zona funcției cu erori de sintaxă (în mod normal se numește otg_notify_block_set sau similar)
            # Pentru siguranță absolută, comentăm doar liniile problematice specifice indicate în log
            sed -i 's/usb_notify = NOTIFY_EVENT_ALL_DISABLE;/\/\/ usb_notify = NOTIFY_EVENT_ALL_DISABLE;/g' $KERNEL_SRC_DIR/drivers/usb/notify/usb_notify.c
            sed -i 's/usb_notify_state = NOTIFY_EVENT_BLOCKED;/\/\/ usb_notify_state = NOTIFY_EVENT_BLOCKED;/g' $KERNEL_SRC_DIR/drivers/usb/notify/usb_notify.c
            sed -i 's/usb_notify = NOTIFY_EVENT_HOST_DISABLE;/\/\/ usb_notify = NOTIFY_EVENT_HOST_DISABLE;/g' $KERNEL_SRC_DIR/drivers/usb/notify/usb_notify.c
            sed -i 's/usb_notify = NOTIFY_EVENT_CLIENT_DISABLE;/\/\/ usb_notify = NOTIFY_EVENT_CLIENT_DISABLE;/g' $KERNEL_SRC_DIR/drivers/usb/notify/usb_notify.c
            sed -i 's/usb_notify_state = NOTIFY_EVENT_DISABLED;/\/\/ usb_notify_state = NOTIFY_EVENT_DISABLED;/g' $KERNEL_SRC_DIR/drivers/usb/notify/usb_notify.c
            # Eliminăm apelurile cu pointeri denaturați
            sed -i 's/(void \*)&usb_notify, (void \*)&usb_notify_state/\/\/ (void \*)&usb_notify, (void \*)&usb_notify_state/g' $KERNEL_SRC_DIR/drivers/usb/notify/usb_notify.c
          fi

          # D) Patch pentru sec_debug.c (Înlocuim constanta lipsă de DRAM test cu Power Reset)
          if [ -f "$KERNEL_SRC_DIR/drivers/samsung/debug/sec_debug.c" ]; then
            sed -i 's/PON_RESTART_REASON_USER_DRAM_TEST/PON_RESTART_REASON_POWER_RESET/g' $KERNEL_SRC_DIR/drivers/samsung/debug/sec_debug.c
          fi

          # --- ARGUMENTE COMPILARE ---
          MAKE_ARGS="ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            READELF=llvm-readelf \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=0 \
            PYTHON=python2"
          
          # Intrăm în folderul fizic al surselor kernelului
          cd $KERNEL_SRC_DIR
          
          # 4. Generare Configurație EUR_OPEN
          mkdir -p out
          make $MAKE_ARGS O=out sm8150_sec_r5q_eur_open_defconfig
          
          # 5. Modificare Configurație (.config) - Optimizări + Eliminare drivere blocaj Samsung
          ./scripts/config --file out/.config \
            -d CONFIG_LTO_CLANG \
            -d CONFIG_THINLTO \
            -d CONFIG_WERROR \
            -e CONFIG_LTO_NONE \
            -e CONFIG_USB_NOTIFY_LAYER \
            -e CONFIG_USB_TYPEC_MANAGER_NOTIFIER \
            -d CONFIG_USB_ANDROID_SAMSUNG_COMPOSITE \
            -d CONFIG_USB_HOST_NOTIFY \
            -d CONFIG_USB_NOTIFIER \
            -d CONFIG_USB_DEBUG_DETAILED_LOG \
            -d CONFIG_USB_HMT_SAMSUNG_INPUT \
            -d CONFIG_USB_EXTERNAL_NOTIFY \
            -d CONFIG_USB_NOTIFY_PROC_LOG \
            -d CONFIG_USB_HOST_SAMSUNG_FEATURE \
            -d CONFIG_USB_HW_PARAM \
            -d CONFIG_UFS_DATA_LOG \
            -d CONFIG_UFS_DATA_LOG_MAGIC_CODE \
            -d CONFIG_SCSI_UFSHCD_CMD_LOGGING \
            -d CONFIG_SCSI_UFS_PM_QOS \
            -d CONFIG_SEC_ABC \
            -d CONFIG_SEC_ABC_DEBUG \
            -e CONFIG_CMDLINE_FORCE \
            --set-str CONFIG_CMDLINE "rcupdate.rcu_expedited=1 rcu_nocbs=0-7 cgroup.memory=nokmem,nosocket console=null androidboot.hardware=qcom androidboot.console=ttyMSM0 androidboot.memcg=1 lpm_levels.sleep_disabled=1 video=vfb:640x400,bpp=32,memsize=3072000 msm_rtb.filter=0x237 service_locator.enable=1 swiotlb=2048 androidboot.usbcontroller=a600000.dwc3 firmware_class.path=/vendor/firmware_mnt/image androidboot.selinux=permissive buildvariant=userdebug androidboot.verifiedbootstate=orange androidboot.keymaster=1 androidboot.ulcnt=3 androidboot.bootdevice=1d84000.ufshc androidboot.fstab_suffix=default androidboot.boot_devices=soc/1d84000.ufshc androidboot.serialno=RF8N6195TND androidboot.baseband=msm msm_drm.dsi_display0=ss_dsi_panel_S6E3FA9_AMB667UM01_FHD: lcd_id=0x814001 window_color= androidboot.dtbo_idx=4 androidboot.dtb_idx=1 androidboot.sec_atd.tty=/dev/ttyHS8 androidboot.revision=9 androidboot.subpcb=0 androidboot.ap_serial=0xEFB622C5 ccic_info=1 fg_reset=0 sec_log=0x200000@0xC1600000 sec_dbg=0x1FF000@0xC1400000 sec_dbg_ex_info=0x1000@0xC15FF000 androidboot.debug_level=0x4f4c sec_debug.enable=0 sec_debug.enable_user=0 msm_rtb.enable=0 androidboot.cp_debug_level=0x55FF sec_debug.enable_cp_debug=0 softdog.soft_margin=100 softdog.soft_panic=1 androidboot.cp_reserved_mem=off androidboot.reserve_mem_region=0x0 androidboot.force_upload=0x0 androidboot.upload_offset=9438196 sec_debug.dump_sink=0x0 sec_debug.reboot_multicmd=0x1 signoff=0x7277 androidboot.boot_recovery=0 androidboot.force_normal_boot=1 ufshcd.skip_pm_qos=1 androidboot.carrierid.param.offset=9437644 androidboot.carrierid=DBT androidboot.sales.param.offset=9437648 androidboot.sales_code=XSG androidboot.prototype.param.offset=9437660 androidboot.im.param.offset=9437232 androidboot.me.param.offset=9437312 androidboot.sn.param.offset=9437392 androidboot.pr.param.offset=9437472 androidboot.sku.param.offset=9437552 androidboot.prodcode.param.offset=9445416 androidboot.windowcolor.param.offset=9445496 androidboot.fastbootd=false androidboot.warranty_bit=1 androidboot.wb.hs=30C androidboot.wb.snapQB=76443505R androidboot.ucs_mode=0 androidboot.swp_config=0 androidboot.rp=9 androidboot.svb.ver=SVB1.0 androidboot.em.did=2030A5EFB622C511 androidboot.em.model=SM-G770F androidboot.em.status=0x0 androidboot.sb.debug0=0x0 androidboot.em.rdx_dump=false androidboot.bootloader=G770FXXS9HXA1 androidboot.edtbo=0 charging_mode=0x00 afc_disable=0x30 uart_sel=0x02 sapa=0 androidboot.ddr_start_type=1 androidboot.dram_info=01,07,00,8G androidboot.usrf=9438192 sec_dqa=0220 factory_mode=0 androidboot.hardware.sku=hcesimese"
            
          # Sincronizăm configurațiile cu fișierul modificat
          make $MAKE_ARGS O=out olddefconfig
          
          # 6. Compilare Finală stabilă
          make -j$(nproc --all) $MAKE_ARGS O=out KCFLAGS="-fcommon -Wno-error" Image.gz-dtb dtbs

      - name: Create Flashable Package
        run: |
          MKDTIMG="${{ github.workspace }}/s/tools/mkdtimg"
          chmod +x $MKDTIMG
          DTBO_FILES=$(find s/out/arch/arm64/boot/dts/ -name "*.dtbo")
          $MKDTIMG create dtbo.img --version=1 --page_size=4096 $DTBO_FILES
          
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel
          cp s/out/arch/arm64/boot/Image.gz-dtb AnyKernel/Image.gz
          cp dtbo.img AnyKernel/dtbo.img
          
          cd AnyKernel
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          sed -i 's/header_version=0/header_version=2/g' anykernel.sh
          sed -i 's/IS_SLOT_DEVICE=0/IS_SLOT_DEVICE=1/g' anykernel.sh || true
          sed -i 's|BLOCK=/dev/block/bootdevice/by-name/boot;|BLOCK=boot;|g' anykernel.sh || true
          sed -i 's/PATCH_VBMETA_FLAG=auto/PATCH_VBMETA_FLAG=0/g' anykernel.sh || true
          sed -i 's/RAMDISK_COMPRESSION=.*/RAMDISK_COMPRESSION=auto;/g' anykernel.sh || true
          sed -i 's/device.name1=.*/device.name1=r5q/g' anykernel.sh || true
          sed -i 's/device.name2=.*/device.name2=r5qxxx/g' anykernel.sh || true
          sed -i 's/do.modules=1/do.modules=0/g' anykernel.sh || true
          zip -r9 ../Kernel-Auriana-Final.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Auriana-SM8150
          path: Kernel-Auriana-Final.zip
