name: Build sh4dow6oy Kernel - OpenELA 4.14.356 RC1 (DTBO Final Fix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Samsung Source
        uses: actions/checkout@v4
        with:
          repository: Roynas-Android-Playground/kernel_samsung_r3q
          ref: master
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev \
          ccache python3 python-is-python3 libarchive-tools wget zstd libtinfo6 zip \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi device-tree-compiler

      - name: Setup Neutron Clang
        run: |
          mkdir -p clang
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang

      - name: Inject OpenELA 4.14.356 RC1
        run: |
          wget -q https://github.com/openela/kernel-lts/archive/refs/tags/v4.14.356-openela-rc1.tar.gz -O openela.tar.gz
          mkdir openela_tmp
          tar -xzf openela.tar.gz -C openela_tmp --strip-components=1
          cp -rf openela_tmp/* .
          rm -rf openela_tmp openela.tar.gz
          
          # [FIX] Nuclear Symbol Fix
          echo 'void dma_contiguous_early_fixup(void *res_cma) { }' > drivers/base/samsung_stub.c
          echo 'obj-y += samsung_stub.o' >> drivers/base/Makefile
          
          # [FIX] Common Symbol Fix
          sed -i 's/KBUILD_CFLAGS   += $(call cc-option,-fno-delete-null-pointer-checks,)/KBUILD_CFLAGS   += $(call cc-option,-fno-delete-null-pointer-checks,)\nKBUILD_CFLAGS   += -fno-common/g' Makefile

      - name: Build Kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export KBUILD_BUILD_USER="sh4dow6oy"
          export KBUILD_BUILD_HOST="OpenELA-Build"
          
          # Fix-uri mediu build
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-mllvm -polly[^ ]*//g' {} +
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-mllvm//g' {} +
          [ -f arch/arm64/kernel/vdso/Makefile ] && sed -i 's/-static//g' arch/arm64/kernel/vdso/Makefile
          sed -i 's/ifneq ($(wildcard $(srctree)\/scripts\/gcc-wrapper.py),)/ifeq (0,1)/g' Makefile

          MAKE_ARGS="ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            O=out"

          make $MAKE_ARGS r5q_defconfig
          
          # [CONFIG] Activare suport DTBO Samsung
          ./scripts/config --file out/.config \
            --set-str CONFIG_LOCALVERSION "-sh4dow6oy" \
            -e CONFIG_SAMSUNG_PRODUCT_SHIP \
            -e CONFIG_BUILD_ARM64_DTB_IMAGE \
            -e CONFIG_DTC \
            -e CONFIG_OF_OVERLAY \
            -d CONFIG_LTO -d CONFIG_LTO_CLANG -e CONFIG_LTO_NONE \
            -d CONFIG_KNOX_KAP -d CONFIG_SECURITY_SAMSUNG_KNOX \
            -d CONFIG_WERROR
          
          make $MAKE_ARGS olddefconfig

          # Build Kernel
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-fno-common -Wno-error -Wno-implicit-function-declaration -Wno-int-conversion"
          
          # Build DTBs (Aici se nasc fragmentele de DTBO)
          make $MAKE_ARGS dtbs

      - name: Manual DTBO Creation
        run: |
          # Găsim scriptul Samsung de generare img sau folosim mkdtboimg dacă există
          MKDTBOIMG=$(find scripts -name "mkdtboimg.py" | head -n 1)
          # Căutăm toate fișierele .dtbo (overlays) generate în out
          DTBO_FILES=$(find out/arch/arm64/boot/dts -name "*.dtbo")
          
          if [ -n "$DTBO_FILES" ] && [ -n "$MKDTBOIMG" ]; then
            echo "Generăm dtbo.img manual din fișierele găsite..."
            python3 $MKDTBOIMG create out/dtbo.img $DTBO_FILES
          elif [ -n "$DTBO_FILES" ]; then
            echo "Am găsit fișiere .dtbo dar nu și scriptul. Încercăm o metodă alternativă..."
            # Unele ramuri au utilitarul în out/scripts
            [ -f out/scripts/dtc/mkdtboimg ] && out/scripts/dtc/mkdtboimg create out/dtbo.img $DTBO_FILES
          fi

      - name: Package with AnyKernel3
        run: |
          IMAGE=$(find out/arch/arm64/boot -name "Image.gz-dtb" -o -name "Image.gz" | head -n 1)
          # Căutăm orice fișier rezultat care seamănă cu dtbo
          DTBO_FINAL=$(find out -name "dtbo.img" -o -name "dtbo" | head -n 1)

          git clone https://github.com/osm0sis/AnyKernel3.git
          rm -rf AnyKernel3/.git

          cp "$IMAGE" AnyKernel3/Image.gz
          if [ -f "$DTBO_FINAL" ]; then
            cp "$DTBO_FINAL" AnyKernel3/dtbo.img
            echo "SUCCESS: DTBO ($DTBO_FINAL) a fost inclus."
          else
            echo "WARNING: DTBO nu a fost găsit nici acum!"
            echo "Fișierele generate în boot/dts sunt:"
            ls -R out/arch/arm64/boot/dts/ || echo "Folder dts gol"
          fi

          # Config AnyKernel r5q
          sed -i 's/device.name1=maguro/device.name1=r5q/g' AnyKernel3/anykernel.sh
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
          
          cd AnyKernel3
          zip -r9 ../sh4dow6oy-Kernel-R5Q-OpenELA.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sh4dow6oy-Kernel
          path: sh4dow6oy-Kernel-R5Q-OpenELA.zip
