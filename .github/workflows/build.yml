name: R5Q Android 15 BPF Builder

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Base Source (R5Q)
        uses: actions/checkout@v4
        with:
          repository: sh4dow6oy/kernel_samsung_r5q
          ref: master
          fetch-depth: 0

      - name: Setup Git & Merge BPF Backport
        run: |
          git config --global user.name "sh4dow6oy"
          git config --global user.email "109531621+sh4dow6oy@users.noreply.github.com"
          
          # Adăugăm sursa lui Pascua28 pentru SM7150 (BPF 5.10 backport)
          git remote add bpf_source https://github.com/pascua28/android_kernel_samsung_sm7150.git
          git fetch bpf_source bpf-5.10
          
          echo "Începe procesul de Merge pentru eBPF..."
          # Folosim strategia 'ours' pentru a nu strica driverele specifice r5q
          git merge -X ours bpf_source/bpf-5.10 -m "Merge eBPF backport for Android 15" --allow-unrelated-histories || true
          
          # Curățăm eventualele conflicte rămase
          git add .
          git commit -m "Fix: Resolve merge conflicts for BPF" || echo "No changes"

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd bc build-essential gcc-aarch64-linux-gnu libssl-dev python3-minimal libelf-dev libssl-dev
          mkdir clang-neutron
          wget https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang-neutron

      - name: Build Kernel
        run: |
          # 1. Exportăm mediul Neutron
          export PATH=$(pwd)/clang-neutron/bin:$PATH
          export ARCH=arm64
          export CC="clang --target=aarch64-linux-gnu"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          # 2. Păcălim Makefile-ul Samsung (Symlink trick)
          mkdir -p toolchain/llvm-arm-toolchain-ship/10.0/bin
          ln -sf $(pwd)/clang-neutron/bin/clang toolchain/llvm-arm-toolchain-ship/10.0/bin/clang
          
          # 3. Pregătim Config-ul
          make O=out r5q_defconfig
          
          # 4. ACTIVARE eBPF (Crucial pentru Android 15)
          scripts/config --file out/.config --enable BPF
          scripts/config --file out/.config --enable BPF_SYSCALL
          scripts/config --file out/.config --enable BPF_JIT
          scripts/config --file out/.config --enable BPF_JIT_ALWAYS_ON
          scripts/config --file out/.config --enable CGROUP_BPF
          scripts/config --file out/.config --enable NETFILTER_XT_MATCH_BPF
          scripts/config --file out/.config --enable NET_CLS_BPF
          scripts/config --file out/.config --enable NET_ACT_BPF
          scripts/config --file out/.config --enable BPF_EVENTS
          
          # 5. Dezactivăm securitatea Samsung care blochează Clang/BPF
          scripts/config --file out/.config --disable SEC_DEBUG
          scripts/config --file out/.config --disable CC_STACKPROTECTOR_STRONG
          scripts/config --file out/.config --enable CC_STACKPROTECTOR_NONE
          
          # 6. Compilare
          echo "--- Pornim compilarea cu suport BPF ---"
          make -j$(nproc --all) O=out \
               LLVM=1 LLVM_IAS=1 \
               KCFLAGS="-w -Wno-error -Wno-implicit-function-declaration"

      - name: Create Flashable Zip
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3
          # Căutăm imaginea generată
          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          else
            cp out/arch/arm64/boot/Image.gz AnyKernel3/ || cp out/arch/arm64/boot/Image AnyKernel3/
          fi
          cd AnyKernel3
          zip -r9 ../R5Q-BPF-A15-Neutron.zip * -x .git README.md

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-R5Q-A15-BPF
          path: R5Q-BPF-A15-Neutron.zip
