name: Build S10 Lite Kernel (Neutron Clang)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Base (pascua28)
        uses: actions/checkout@v4
        with:
          repository: pascua28/android_kernel_samsung_sm7150
          ref: sixteen
          path: kernel

      - name: Checkout S10 Lite DTS (Roynas Source)
        uses: actions/checkout@v4
        with:
          repository: Roynas-Android-Playground/kernel_samsung_r3q
          ref: master
          path: roynas_source
          sparse-checkout: |
            arch/arm64/boot/dts/samsung/renovation

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential bison flex libssl-dev libelf-dev clang lld llvm
          mkdir -p bin

      - name: Install Neutron Clang
        run: |
          curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
          chmod +x antman
          ./antman -S
          echo "$GITHUB_WORKSPACE/neutron-clang/bin" >> $GITHUB_PATH

      - name: Patch Kernel and Inject DTS
        run: |
          cd kernel
          # 1. Copiem config-ul de A71 ca baza
          cp arch/arm64/configs/a71.config arch/arm64/configs/r5q.config
          
          # 2. Injectam folderul renovation in structura pascua28
          mkdir -p arch/arm64/boot/dts/samsung/renovation
          cp -r ../roynas_source/arch/arm64/boot/dts/samsung/renovation/* arch/arm64/boot/dts/samsung/renovation/
          
          # 3. Adaugam S10 Lite in Makefile-ul din folderul samsung
          # Folosim numele overlay-ului identificat de tine
          echo 'dtbo-$(CONFIG_ARCH_SM7150) += renovation/sm8150-sec-r5q-overlay-r00.dtbo' >> arch/arm64/boot/dts/samsung/Makefile

      - name: Build Kernel with Neutron
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/neutron-clang/bin:$PATH"
          
          # Configuram kernel-ul
          make O=out ARCH=arm64 r5q.config
          
          # Compilam folosind Neutron Clang si dezactivam LTO pentru stabilitate initiala
          make -j$(nproc --all) O=out \
               ARCH=arm64 \
               CC=clang \
               CLANG_TRIPLE=aarch64-linux-gnu- \
               CROSS_COMPILE=aarch64-linux-gnu- \
               CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
               LD=ld.lld \
               AR=llvm-ar \
               NM=llvm-nm \
               OBJCOPY=llvm-objcopy \
               OBJDUMP=llvm-objdump \
               STRIP=llvm-strip \
               CONFIG_LTO_CLANG_NONE=y

      - name: Upload Kernel Image & DTBO
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-Neutron-Kernel
          path: |
            kernel/out/arch/arm64/boot/Image.gz-dtb
            kernel/out/arch/arm64/boot/dts/samsung/renovation/*.dtbo
