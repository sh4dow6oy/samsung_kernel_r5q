name: Build R3Q - BPF 5.10 (Sixteen) & Kconfig Fix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Base (Roynas)
        uses: actions/checkout@v4
        with:
          repository: Roynas-Android-Playground/kernel_samsung_r3q
          ref: master
          path: kernel

      - name: Download BPF Backport (pascua28)
        run: |
          git clone --depth 1 -b sixteen https://github.com/pascua28/android_kernel_samsung_sm7150 backport
          
          # Injectare BPF modern v6
          rm -rf kernel/kernel/bpf kernel/net/core/filter.c
          cp -r backport/kernel/bpf kernel/kernel/
          cp backport/net/core/filter.c kernel/net/core/filter.c
          cp -r backport/include/linux/bpf* kernel/include/linux/

      - name: Fix KernelSU Dependency Error
        run: |
          cd kernel
          # Eliminăm linia care încearcă să încarce Kconfig-ul KernelSU lipsă
          sed -i '/kernelsu\/Kconfig/d' drivers/android/Kconfig
          # De asemenea, eliminăm referința din Makefile-ul android dacă există
          sed -i '/kernelsu/d' drivers/android/Makefile

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu bc libssl-dev python3 bison flex

      - name: Setup Neutron Clang
        run: |
          mkdir -p clang
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang

      - name: Build Kernel
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          
          # Am scos -fuse-ld=lld din argumentele HOST pentru a evita avertismentele
          MAKE_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CLANG_TRIPLE=aarch64-linux-gnu- O=out"
          
          make $MAKE_ARGS r3q_eur_open_defconfig
          
          # ACTIVARE BPF 5.10+ (Specificații Sixteen)
          ./scripts/config --file out/.config \
            -e CONFIG_BPF -e CONFIG_BPF_SYSCALL -e CONFIG_BPF_JIT -e CONFIG_BPF_JIT_ALWAYS_ON \
            -e CONFIG_HAVE_EBPF_JIT -e CONFIG_NET_CLS_BPF -e CONFIG_NET_ACT_BPF \
            -e CONFIG_BPF_EVENTS -e CONFIG_CGROUP_BPF -e CONFIG_BPF_STREAM_PARSER \
            -e CONFIG_LWTUNNEL_BPF \
            -d CONFIG_SAMSUNG_RTIC -d CONFIG_SAMSUNG_RTIC_AMP \
            -d CONFIG_CC_STACKPROTECTOR_STRONG -e CONFIG_CC_STACKPROTECTOR_NONE \
            -d CONFIG_WERROR
            
          make $MAKE_ARGS olddefconfig
          
          # Compilăm. Folosim -fcommon pentru a gestiona eventualele conflicte de tipuri din backport
          make -j$(nproc --all) $MAKE_ARGS Image.gz dtbs KCFLAGS="-w -fcommon"

      - name: Assemble AnyKernel3
        run: |
          OUT="kernel/out/arch/arm64/boot"
          IMAGE="$OUT/Image.gz"
          DTB=$(find $OUT/dts/samsung -name "exynos9810-r3q*.dtb" -type f | head -n 1)
          
          git clone https://github.com/osm0sis/AnyKernel3.git AK3
          [ -f "$DTB" ] && cat "$IMAGE" "$DTB" > AK3/Image.gz || cp "$IMAGE" AK3/Image.gz
          
          cd AK3
          sed -i 's/device.name1=maguro/device.name1=r3q/g' anykernel.sh
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          zip -r9 ../R3Q_Sixteen_v6_NoKSU.zip *

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-R3Q-Sixteen
          path: R3Q_Sixteen_v6_NoKSU.zip
