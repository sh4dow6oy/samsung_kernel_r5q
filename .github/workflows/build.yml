name: Build Roynas R5Q - A15 BPF Repair
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: Roynas-Android-Playground/kernel_samsung_r3q
          ref: master
          fetch-depth: 0

      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev ccache python3 wget zstd zip git

      - name: Integrate A15 BPF & Network Fixes
        run: |
          git config --global user.email "bot@example.com"
          git config --global user.name "Kernel Bot"
          git remote add lineage https://github.com/LineageOS/android_kernel_google_msm-4.14.git
          git fetch lineage lineage-23.0
          
          # Importăm întregul nucleu BPF și dependențele de filtrare rețea
          git checkout lineage/lineage-23.0 -f -- \
            kernel/bpf/ \
            include/linux/bpf.h \
            include/linux/bpf_types.h \
            include/linux/filter.h \
            include/uapi/linux/bpf.h \
            include/uapi/linux/bpf_common.h \
            net/core/filter.c \
            kernel/events/core.c
            
          git add .
          git commit -m "Full BPF stack update for Android 15" || echo "No changes"

      - name: Setup Neutron Clang
        run: |
          mkdir clang
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang

      - name: Build Kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          
          # --- FIXURI ANTERIOARE ---
          sed -i '/kernelsu\/Kconfig/d' drivers/android/Kconfig || true
          sed -i '/kernelsu/d' drivers/android/Makefile || true
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-mllvm -polly[^ ]*//g' {} +
          if [ -f arch/arm64/kernel/vdso/Makefile ]; then
            sed -i 's/$(LDFLAGS)/$(filter-out -static,$(LDFLAGS))/g' arch/arm64/kernel/vdso/Makefile
          fi

          MAKE_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- O=out"

          # --- CONFIGURARE ---
          make $MAKE_ARGS r5q_defconfig
          
          # DEZACTIVĂM NFS (Cauza erorilor din log-ul tău)
          ./scripts/config --file out/.config \
            -d CONFIG_NFS_FS -d CONFIG_NFS_V3 -d CONFIG_NFS_V4 -d CONFIG_ROOT_NFS \
            -e CONFIG_BPF -e CONFIG_BPF_SYSCALL -e CONFIG_BPF_JIT -e CONFIG_CGROUP_BPF \
            -d CONFIG_LTO_CLANG -e CONFIG_LTO_NONE \
            -d CONFIG_WERROR

          make $MAKE_ARGS olddefconfig
          
          # --- COMPILARE CU FLAG-URI DE TOLERANȚĂ ---
          # Ignorăm pointerii incompatibili rezultați din mixul de cod Samsung/Lineage
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-fcommon -Wno-error -Wno-implicit-function-declaration -Wno-incompatible-pointer-types -Wno-implicit-int"

      - name: Package AnyKernel3
        run: |
          if [ -f out/arch/arm64/boot/Image.gz ]; then
            git clone https://github.com/osm0sis/AnyKernel3.git
            cp out/arch/arm64/boot/Image.gz AnyKernel3/
            # Setăm numele device-ului
            sed -i 's/device.name1=maguro/device.name1=r5q/g' AnyKernel3/anykernel.sh
            cd AnyKernel3 && zip -r9 ../Kernel-R5Q-A15-Ultimate.zip *
          else
            echo "Build failed" && exit 1
          fi

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-S10Lite-A15-Ultimate
          path: Kernel-R5Q-A15-Ultimate.zip
