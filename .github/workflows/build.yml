name: Build R5Q - Phoenix Hybrid BPF V6
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Your Kernel (r5q)
        uses: actions/checkout@v4
        with:
          repository: Roynas-Android-Playground/kernel_samsung_r3q
          ref: master
          path: kernel
          fetch-depth: 0

      - name: Phoenix Hybrid Transplant
        run: |
          cd kernel
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          
          git remote add phoenix https://github.com/PhoenixKernel/linux.git
          git fetch phoenix android-4.14-phoenix --depth=1
          git fetch phoenix android12-5.10-phoenix --depth=1
          
          echo "Syncing Headers..."
          git checkout phoenix/android12-5.10-phoenix -- include/linux/mm_types.h include/linux/sched.h include/linux/android_kabi.h include/linux/sched/task_stack.h include/linux/mm.h include/linux/ratelimit.h include/linux/ratelimit_types.h include/linux/page-flags.h include/linux/mmzone.h include/linux/kbuild.h include/linux/spinlock_types.h include/linux/printk.h include/uapi/linux/rseq.h include/linux/security.h include/linux/lsm_hooks.h include/linux/lsm_hook_defs.h include/linux/bpf.h include/uapi/linux/bpf.h
          
          git checkout phoenix/android-4.14-phoenix -- include/linux/kernel_read_file.h || echo "Falling back"

          echo "Syncing Core Logic..."
          git checkout phoenix/android-4.14-phoenix -- kernel/bpf/ security/ kernel/fork.c fs/proc/base.c
          
          # Fix Clang compliance
          sed -i 's/char \*page = (char \*)__get_free_page/struct page *page_ptr; char *page = (char *)__get_free_page/g' fs/proc/base.c || true
          
          git add .
          git commit -m "Hybrid Sync V6" || echo "No changes"

      - name: Setup Toolchain & Legacy Libs
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd libssl-dev bc bison flex python3
          
          # Workaround pentru libtinfo5/libncurses5 pe Ubuntu 24.04
          wget http://azure.archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.4-2_amd64.deb
          wget http://azure.archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libncurses5_6.4-2_amd64.deb
          sudo dpkg -i libtinfo5_6.4-2_amd64.deb
          sudo dpkg -i libncurses5_6.4-2_amd64.deb

          mkdir clang
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang
          echo "$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_PATH

      - name: Build Kernel
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"

          MAKE_ARGS="ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            O=out"

          mkdir -p out
          make $MAKE_ARGS r5q_defconfig

          ./scripts/config --file out/.config \
            -e CONFIG_BPF -e CONFIG_BPF_SYSCALL -e CONFIG_BPF_JIT -e CONFIG_BPF_LSM \
            -d CONFIG_SAMSUNG_RTIC -d CONFIG_SECURITY_RKP -d CONFIG_SECURITY_RKP_KDP -d CONFIG_UH_RKP -d CONFIG_WERROR

          make $MAKE_ARGS olddefconfig
          
          # Build cu ignorare erori de structură
          make -j$(nproc --all) $MAKE_ARGS Image.gz \
            KCFLAGS="-w -fcommon -fno-stack-protector -Wno-error -Wno-incompatible-pointer-types" \
            HOSTCFLAGS="-w"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-R5Q-V6
          path: kernel/out/arch/arm64/boot/Image.gz
