name: Build Samsung SM8150 (Auriana)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Cleanup Environment
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc "/usr/local/share/boost" "$AGENT_TOOLSDIRECTORY"
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison ncurses-dev libssl-dev libelf-dev xz-utils libfl-dev python3 git-core ccache gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Clone Kernel Source
        run: |
          git clone --depth=1 -b auriana https://github.com/sh4dow6oy/android_kernel_samsung_sm8150.git source
          
      - name: Setup Proton Clang
        run: |
          mkdir clang
          cd clang
          wget https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.tar.gz
          tar -xf master.tar.gz
          # NU adăugăm încă folderul în GITHUB_PATH global pentru a evita conflictele la HOSTCC

      - name: Build Kernel
        run: |
          cd source
          
          # Calea către toolchain
          CLANG_BIN=$(pwd)/../clang/proton-clang-master/bin
          
          # Setări arhitectură
          export ARCH=arm64
          export SUBARCH=arm64
          
          # FIX CRITIC: Definim compilatoarele cu căi absolute
          # Folosim GCC-ul sistemului pentru HOST (unelte de build)
          # Folosim Proton Clang doar pentru cross-compilare
          export HOSTCC=/usr/bin/gcc
          export HOSTCXX=/usr/bin/g++
          
          mkdir -p out
          
          # 1. Configurația de bază
          make O=out ARCH=arm64 \
               HOSTCC=$HOSTCC \
               HOSTCXX=$HOSTCXX \
               sm8150_sec_defconfig
          
          # 2. Merge config (r5q_eur)
          scripts/kconfig/merge_config.sh -O out/ out/.config arch/arm64/configs/sm8150_sec_r5q_eur_open.config

          # 3. Compilarea efectivă
          # Adăugăm toolchain-ul în PATH doar aici
          export PATH="$CLANG_BIN:$PATH"
          
          make -j$(nproc --all) O=out \
                      ARCH=arm64 \
                      CC=clang \
                      HOSTCC=$HOSTCC \
                      HOSTCXX=$HOSTCXX \
                      CROSS_COMPILE=aarch64-linux-gnu- \
                      CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
                      NM=llvm-nm \
                      OBJCOPY=llvm-objcopy \
                      OBJDUMP=llvm-objdump \
                      STRIP=llvm-strip \
                      OBJSIZE=llvm-size \
                      LD=ld.lld \
                      AR=llvm-ar

      - name: Check and Upload Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Auriana-SM8150
          path: |
            source/out/arch/arm64/boot/Image.gz
            source/out/arch/arm64/boot/Image.gz-dtb
            source/out/arch/arm64/boot/dtbo.img
