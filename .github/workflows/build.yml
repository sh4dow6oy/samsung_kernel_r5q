name: S10 Lite - 4.19 Hybrid (Kbuild Strategy)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves libncurses-dev git wget make python2 python3 pahole tar xz-utils lib32z1

      - name: Setup Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang
          echo "PROTON_PATH=$(pwd)/toolchain/proton-clang/bin" >> $GITHUB_ENV

      - name: Hybrid Source Preparation
        run: |
          # 1. Clonare Baze
          git clone --depth=1 https://github.com/duckyduckG/android_kernel_qcom_sm8150_419.git kernel_source
          git clone --depth=1 https://github.com/mainey/android_kernel_samsung_r5q.git samsung_source
          
          # 2. Injectare Techpack & Config
          rm -rf kernel_source/techpack
          cp -r samsung_source/techpack kernel_source/
          cp samsung_source/arch/arm64/configs/r5q_eur_open_defconfig kernel_source/arch/arm64/configs/r5q_defconfig
          
          # 3. Injectare DTS
          mkdir -p kernel_source/arch/arm64/boot/dts/vendor/qcom/
          find samsung_source/arch/arm64/boot/dts/ -name "*r5q*" -exec cp {} kernel_source/arch/arm64/boot/dts/vendor/qcom/ \;
          
          cd kernel_source

          # === FIX KCONFIG (Direct Linking Strategy) ===
          # Deoarece techpack/Kconfig NU există, legăm direct subfolderele audio/display în Kconfig-ul principal
          sed -i '/techpack/d' Kconfig # Curățăm încercările vechi
          
          # Inserăm link-urile către Kconfig-urile reale din interiorul techpack
          # Verificăm unde există fișiere Kconfig reale în techpack și le includem
          if [ -f techpack/audio/Kconfig ]; then
            sed -i 's|^# end of kernel config|source "techpack/audio/Kconfig"\n# end of kernel config|' Kconfig
          fi
          
          # === FIX MAKEFILE ===
          sed -i '/techpack/d' Makefile
          echo "obj-y += techpack/" >> Makefile

          # === FIX-URI COD (L1SS & Jack) ===
          find techpack/audio/ -name "msm-pcm-q6-noirq.c" -exec sed -i '20i #define L1SS_AUDIO 0' {} +
          find techpack/audio/ -name "*.h" -o -name "*.c" -exec sed -i 's/SND_JACK_MICROPHONE2/SND_JACK_MICROPHONE/g' {} +
          
          if [ -f drivers/soc/qcom/smcinvoke.c ]; then
            sed -i '/static inline size_t size_add/,/}/ s/^/\/\//' drivers/soc/qcom/smcinvoke.c
          fi

          # Fix Samsung SecTools
          echo -e '#!/bin/bash\necho "0"' > /tmp/secgetspf
          chmod +x /tmp/secgetspf
          sudo mv /tmp/secgetspf /usr/bin/secgetspf

      - name: Build Kernel
        run: |
          export PATH="${{ env.PROTON_PATH }}:$PATH"
          cd kernel_source
          
          rm -rf out && mkdir -p out

          MAKE_ARGS="
            ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1 \
            O=out
          "
          
          export KCFLAGS="-Wno-error -Wno-implicit-function-declaration -Wno-int-conversion -Wno-incompatible-pointer-types -Wno-unused-variable -Wno-format-security -Wno-strict-prototypes"

          # 1. Defconfig
          make $MAKE_ARGS r5q_defconfig
          
          # 2. Config Tweaks (Dezactivare LTO/BTF)
          sed -i 's/CONFIG_LTO_CLANG=y/CONFIG_LTO_CLANG=n/g' out/.config
          sed -i 's/CONFIG_LTO=y/CONFIG_LTO=n/g' out/.config
          sed -i 's/CONFIG_DEBUG_INFO_BTF=y/CONFIG_DEBUG_INFO_BTF=n/g' out/.config
          
          # 3. Build
          make $MAKE_ARGS olddefconfig
          make -j$(nproc --all) $MAKE_ARGS || make -j1 $MAKE_ARGS

          if [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image ../
            find out/arch/arm64/boot/dts/ -name "*.dtbo" -exec cp {} ../ \; || true
            echo "SUCCESS=true" >> $GITHUB_ENV
          fi

      - name: Upload
        if: env.SUCCESS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-4.19-Hybrid-Fixed
          path: |
            Image
            *.dtbo
