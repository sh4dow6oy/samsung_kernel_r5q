name: S10 Lite - 4.19 Hybrid (Audio Kbuild Fixed)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves libncurses-dev git wget make python2 python3 pahole tar xz-utils lib32z1

      - name: Setup Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang
          echo "PROTON_PATH=$(pwd)/toolchain/proton-clang/bin" >> $GITHUB_ENV

      - name: Hybrid Source Preparation
        run: |
          # 1. Clonare baze
          git clone --depth=1 https://github.com/duckyduckG/android_kernel_qcom_sm8150_419.git kernel_source
          git clone --depth=1 https://github.com/mainey/android_kernel_samsung_r5q.git samsung_source
          
          # 2. Injectare Techpack & Config
          rm -rf kernel_source/techpack
          cp -r samsung_source/techpack kernel_source/
          cp samsung_source/arch/arm64/configs/r5q_eur_open_defconfig kernel_source/arch/arm64/configs/r5q_defconfig
          
          # 3. Injectare DTS
          mkdir -p kernel_source/arch/arm64/boot/dts/vendor/qcom/
          find samsung_source/arch/arm64/boot/dts/ -name "*r5q*" -exec cp {} kernel_source/arch/arm64/boot/dts/vendor/qcom/ \;
          
          cd kernel_source

          # === FIX TECHPACK LINKING (Missing Kbuild) ===
          echo "obj-y += audio/" > techpack/Kbuild
          echo "obj-y += audio/" > techpack/Makefile
          
          # Fix Kconfig/Makefile in root
          sed -i '/techpack/d' Kconfig && echo 'source "techpack/Kconfig"' >> Kconfig
          echo 'source "techpack/audio/Kconfig"' > techpack/Kconfig
          
          sed -i '/techpack/d' Makefile
          sed -i 's/^core-y[[:space:]]*:=/core-y := techpack\/ /' Makefile

          # === 4.19 ASOC REFACTORING ===
          echo "Patching ASoC for 4.19..."
          
          # Fix structuri globale
          find techpack/audio/ -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's/struct snd_soc_codec/struct snd_soc_component/g' {} +
          find techpack/audio/ -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's/->component\./->/g' {} +
          find techpack/audio/ -type f -name "*.c" -exec sed -i 's/dai->codec/dai->component/g' {} +
          
          # Platform access (rtd->platform fix)
          find techpack/audio/asoc/ -type f -name "*.c" -exec sed -i 's/rtd->platform/asoc_rtd_to_platform(rtd, 0)/g' {} +
          find techpack/audio/asoc/ -type f -name "*.c" -exec sed -i 's/soc_prtd->platform/asoc_rtd_to_platform(soc_prtd, 0)/g' {} +

          # Dolby DDP Inject
          sed -i '30i struct snd_dec_ddp { uint32_t params_length; uint32_t params_id[18]; uint32_t params_value[18]; };' techpack/audio/asoc/msm-compress-q6-v2.c

          # === WCD934X REGMAP FIX ===
          # Stergem linia get_regmap care bloca build-ul
          sed -i '/\.get_regmap = tavil_get_regmap,/d' techpack/audio/asoc/codecs/wcd934x/wcd934x.c
          
          # Nuke MBHC/Jack (No use for Jack on S10 Lite)
          find techpack/audio/asoc/codecs/ -name "Kbuild" -exec sed -i 's/obj-y += wcd-mbhc-v2.o/\# obj-y += wcd-mbhc-v2.o/g' {} +
          sed -i 's/wcd_mbhc_init(/\/\/ wcd_mbhc_init(/g' techpack/audio/asoc/codecs/wcd934x/wcd934x.c
          sed -i 's/wcd_mbhc_deinit(/\/\/ wcd_mbhc_deinit(/g' techpack/audio/asoc/codecs/wcd934x/wcd934x.c

          # === MISC FIXES ===
          find techpack/audio/ -name "msm-pcm-q6-noirq.c" -exec sed -i '20i #define L1SS_AUDIO 0' {} +
          if [ -f drivers/soc/qcom/smcinvoke.c ]; then
            sed -i '/static inline size_t size_add/,/}/ s/^/\/\//' drivers/soc/qcom/smcinvoke.c
          fi

          # Fix Samsung SecTools
          echo -e '#!/bin/bash\necho "0"' > /tmp/secgetspf
          chmod +x /tmp/secgetspf
          sudo mv /tmp/secgetspf /usr/bin/secgetspf

      - name: Build Kernel
        run: |
          export PATH="${{ env.PROTON_PATH }}:$PATH"
          cd kernel_source
          ARGS="ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1"
          export KCFLAGS="-Wno-error -Wno-implicit-function-declaration -Wno-int-conversion -Wno-incompatible-pointer-types -Wno-unused-variable -Wno-format-security -Wno-strict-prototypes -Wno-visibility -Wno-unused-parameter -Wno-unused-function -Wno-return-type"

          make $ARGS r5q_defconfig
          
          # Disable LTO for stability
          sed -i 's/CONFIG_LTO_CLANG=y/CONFIG_LTO_CLANG=n/g' .config
          sed -i 's/CONFIG_LTO=y/CONFIG_LTO=n/g' .config
          sed -i 's/CONFIG_DEBUG_INFO_BTF=y/CONFIG_DEBUG_INFO_BTF=n/g' .config
          
          make $ARGS olddefconfig
          make -j2 $ARGS

          if [ -f arch/arm64/boot/Image ]; then
            cp arch/arm64/boot/Image ../
            find arch/arm64/boot/dts/ -name "*.dtbo" -exec cp {} ../ \; || true
            echo "SUCCESS=true" >> $GITHUB_ENV
          fi

      - name: Upload
        if: env.SUCCESS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-4.19-AudioKbuild-Kernel
          path: |
            Image
            *.dtbo
