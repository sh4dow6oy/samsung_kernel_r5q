name: Build Lumi R5Q - Professional Fix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: sh4dow6oy/android_kernel_samsung_sm8150
          ref: rawr-bpf
          path: kernel
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev \
          ccache python3 python-is-python3 libarchive-tools wget zstd zip \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi device-tree-compiler clang

      - name: Setup Toolchain (NDK Clang)
        run: |
          mkdir -p clang
          wget -q https://github.com/Ylarod/setup-ndk-clang/releases/download/prebuilt/clang-linux-x86-ndk-r29-r563880c.tar.zst
          tar -I zstd -xf clang-linux-x86-ndk-r29-r563880c.tar.zst -C clang

      - name: Build Kernel
        run: |
          cd kernel
          chmod -R +x tools/
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          
          # Rezolvare conflict Multiple Definition (identificat in log-uri)
          grep -r "bool main_ext_ss_not_working" . | cut -d: -f1 | xargs sed -i 's/bool main_ext_ss_not_working/static bool main_ext_ss_not_working/g' || true
          
          export MAKE_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang \
            DTC_EXT=$(pwd)/tools/dtc \
            CONFIG_BUILD_ARM64_DT_OVERLAY=y \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD=ld.lld \
            O=out"

          make $MAKE_ARGS r5q_eur_open_defconfig
          make $MAKE_ARGS olddefconfig
          # KCFLAGS fix pentru stabilitatea simbolurilor
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-fno-common -Wno-error -w" O=out Image.gz-dtb dtbs

      - name: Professional DTBO Packaging
        run: |
          # 1. Download utilitar oficial (LineageOS version)
          wget -q https://raw.githubusercontent.com/LineageOS/android_system_libufdt/lineage-18.1/utils/src/mkdtboimg.py -O mkdtboimg.py
          chmod +x mkdtboimg.py
          
          # 2. Setup AnyKernel3
          git clone https://github.com/osm0sis/AnyKernel3.git
          cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/Image.gz-dtb
          
          # 3. Compilare DTBO (Fix pentru reg_format si address-cells)
          RENO_PATH="kernel/arch/arm64/boot/dts/samsung/renovation"
          DTS_ROOT="kernel/arch/arm64/boot/dts/samsung"
          mkdir -p dtbo_manual
          
          FILES_TO_BUILD=(
            "sm8150-sec-r5q-overlay-r00.dts"
            "sm8150-sec-r5q-overlay-r01.dts"
            "sm8150-sec-r5q-overlay-r07.dts"
            "sm8150-sec-r5q-overlay-r08.dts"
            "sm8150-sec-r5q-overlay-r09.dts"
            "sm8150-sec-system-update-overlay.dts"
          )
          
          for dts_name in "${FILES_TO_BUILD[@]}"; do
            target_file="$RENO_PATH/$dts_name"
            if [ -f "$target_file" ]; then
              dtbo_out=$(basename "$dts_name" .dts).dtbo
              # Adaugam include-ul qcom pentru a fixa lungimea "reg" (invalid length 16 bytes)
              clang -E -nostdinc -undef -D__DTS__ -x assembler-with-cpp \
                -I kernel/include \
                -I kernel/arch/arm64/boot/dts/qcom \
                -I kernel/scripts/dtc/include-prefixes \
                -I "$DTS_ROOT" \
                -I "$RENO_PATH" \
                "$target_file" -o "dtbo_manual/tmp.dts"
              
              kernel/tools/dtc -@ -I dts -O dtb -o "dtbo_manual/$dtbo_out" "dtbo_manual/tmp.dts"
            fi
          done
          
          # 4. Creare DTBO.img (Fix TypeError: asigura ca lista nu este goala)
          DTBO_LIST=$(ls dtbo_manual/*.dtbo 2>/dev/null)
          if [ -n "$DTBO_LIST" ]; then
            python3 mkdtboimg.py create AnyKernel3/dtbo.img --version=2 $DTBO_LIST
          else
            echo "EROARE: Niciun fisier .dtbo nu a fost generat!" && exit 1
          fi
          
          # 5. Configurare AnyKernel3 (Cai specifice Samsung r5q)
          cd AnyKernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          sed -i 's|block=auto;|block=/dev/block/by-name/boot;|g' anykernel.sh
          # Setam tipul corect pentru Image.gz-dtb
          sed -i 's/kernel.type=inline/kernel.type=gzip-dtb/g' anykernel.sh
          sed -i 's/patch_vbmeta_flag=auto/patch_vbmeta_flag=1/g' anykernel.sh
          # Injectam partitia DTBO
          sed -i '/block=\/dev\/block\/by-name\/boot;/a dtbo_block=/dev/block/by-name/dtbo;' anykernel.sh
          
          zip -r9 ../Lumi-R5Q-Complete-BPF.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lumi-R5Q-Kernel-Fixed
          path: Lumi-R5Q-Complete-BPF.zip
