name: Build Lumi R5Q - Fix DTBS Syntax

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LineageOS Base (SM8150)
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_qcom_sm8150
          ref: lineage-20
          path: kernel
          fetch-depth: 1

      - name: Download r5q Optimized Defconfig
        run: |
          wget https://raw.githubusercontent.com/mainey/android_kernel_samsung_r5q/lineage-19.0/arch/arm64/configs/r5q_eur_open_defconfig -O kernel/arch/arm64/configs/r5q_optimized_defconfig

      - name: Config & BPF Inject
        run: |
          CONF="kernel/arch/arm64/configs/r5q_optimized_defconfig"
          echo "CONFIG_BPF=y" >> $CONF
          echo "CONFIG_BPF_SYSCALL=y" >> $CONF
          echo "CONFIG_NETFILTER_XT_MATCH_BPF=y" >> $CONF
          echo "CONFIG_CGROUP_BPF=y" >> $CONF
          # Dezactivăm avertismentele care opresc build-ul
          echo "CONFIG_DTC_WERROR=n" >> $CONF

      - name: Source Code Hotfixes
        run: |
          cd kernel
          # 1. Fix eroarea de sintaxă ptep/pte
          sed -i 's/ptep = huge_pmd_share/pte = huge_pmd_share/g' arch/arm64/mm/hugetlbpage.c || true
          
          # 2. FIX CRITIC: pm8150.dtsi syntax error
          # Eroarea apare de obicei la nodurile de rețea sau de pini. 
          # Curățăm Makefile-ul de platformele auto care declanșează eroarea în pm8150.dtsi
          sed -i '/sa8155/d' arch/arm64/boot/dts/qcom/Makefile
          sed -i '/sa6155/d' arch/arm64/boot/dts/qcom/Makefile
          
          # 3. Fix taskstats (#elif gol)
          sed -i 's/#elif/#else/g' kernel/taskstats.c || true

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev \
          ccache python3 python-is-python3 libarchive-tools wget zstd zip \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi clang

      - name: Setup Toolchain (NDK Clang)
        run: |
          mkdir -p clang
          wget -q https://github.com/Ylarod/setup-ndk-clang/releases/download/prebuilt/clang-linux-x86-ndk-r29-r563880c.tar.zst
          tar -I zstd -xf clang-linux-x86-ndk-r29-r563880c.tar.zst -C clang

      - name: Build Kernel
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export MAKE_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD=ld.lld \
            O=out"

          make $MAKE_ARGS r5q_optimized_defconfig
          make $MAKE_ARGS olddefconfig
          
          # Folosim -k (keep going) pentru a trece de eventuale DTB-uri secundare corupte
          # Dar principala țintă este Image.gz-dtb
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-Wno-error -w" O=out Image.gz-dtb

      - name: AnyKernel3 Packaging
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          if [ -f kernel/out/arch/arm64/boot/Image.gz-dtb ]; then
            cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/Image.gz-dtb
          else
            echo "EROARE: Kernelul nu s-a compilat! Verifică log-urile de mai sus."
            exit 1
          fi
          
          cd AnyKernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          sed -i 's|block=auto;|block=/dev/block/by-name/boot;|g' anykernel.sh
          sed -i 's/kernel.type=inline/kernel.type=gzip-dtb/g' anykernel.sh
          sed -i 's/patch_vbmeta_flag=auto/patch_vbmeta_flag=1/g' anykernel.sh
          
          zip -r9 ../Lumi-R5Q-Fixed.zip *

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Lumi-Final-Kernel
          path: Lumi-R5Q-Fixed.zip
