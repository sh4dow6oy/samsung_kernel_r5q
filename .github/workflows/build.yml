name: Build Roynas R5Q - Android 15 Full BPF & Disable KSU
on:
  workflow_dispatch:

env:
  SUBLEVEL: "356"
  AUTHOR: "sh4dow6oy"
  DEVICE: "r5q"
  DEFCONFIG: "r5q_defconfig"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: Roynas-Android-Playground/kernel_samsung_r3q
          ref: master
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev \
          ccache python3 python-is-python3 libarchive-tools wget zstd libtinfo6 zip

      - name: Setup Neutron Clang
        run: |
          mkdir clang
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang

      - name: Apply Android 15 BPF Patches & Disable KernelSU
        run: |
          echo "Aplicăm patch-urile BPF și eliminăm KernelSU..."

          # --- 1. BPF UAPI & DEFS (Commit b825f17 + NUMA Fix) ---
          sed -i '/BPF_JSET/a \	BPF_JLT    = 0xa0, \/* LT */ \n	BPF_JLE    = 0xb0, \/* LE */ \n	BPF_JSLT   = 0xc0, \/* SLT */ \n	BPF_JSLE   = 0xd0, \/* SLE */' include/uapi/linux/bpf.h
          sed -i '/BPF_F_RDONLY/a #define BPF_F_NUMA_NODE (1U << 2)' include/uapi/linux/bpf.h

          # --- 2. BPF CORE VISIBILITY (Commit 263e252) ---
          sed -i 's/bool bpf_dump_raw_ok(void)/bool bpf_dump_raw_ok(void) { return true; } \/\/ /' kernel/bpf/core.c || true

          # --- 3. BPF VERIFIER (Commit 12733ea) ---
          sed -i '/check_helper_call(struct bpf_verifier_env/a \	if (env->prog->type == BPF_PROG_TYPE_UNSPEC) return -EINVAL;' kernel/bpf/verifier.c || true

          # --- 4. NET JIT ARM64 BACKPORT (Networking Fix) ---
          # 
          sed -i '/case BPF_JMP | BPF_JSET | BPF_X:/a \		case BPF_JMP | BPF_JLT | BPF_X:\n		case BPF_JMP | BPF_JLE | BPF_X:\n		case BPF_JMP | BPF_JSLT | BPF_X:\n		case BPF_JMP | BPF_JSLE | BPF_X:' arch/arm64/net/bpf_jit_comp.c || true

          # --- 5. DISABLE KERNELSU (Nuclear Clean) ---
          # Eliminăm liniile din Kconfig și Makefile care cauzează erori de parsare
          sed -i '/kernelsu/d' drivers/android/Kconfig || true
          sed -i '/kernelsu/d' drivers/android/Makefile || true
          sed -i '/ksu/d' drivers/android/Kconfig || true
          sed -i '/ksu/d' drivers/android/Makefile || true
          rm -rf drivers/kernelsu
          rm -rf drivers/android/kernelsu

          # --- 6. vDSO & CLEANUP ---
          find arch/arm64/kernel/vdso -name "Makefile*" -exec sed -i 's/-Wl,-n//g' {} +
          find arch/arm64/kernel/vdso -name "Makefile*" -exec sed -i 's/-Wl,-T//g' {} +

      - name: Build Kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          
          # Branding
          sed -i "s/^SUBLEVEL =.*/SUBLEVEL = ${{ env.SUBLEVEL }}/" Makefile
          sed -i "s/^EXTRAVERSION =.*/EXTRAVERSION = -${{ env.AUTHOR }}-A15/" Makefile
          
          MAKE_ARGS="ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            O=out"

          # Configurare Android 15 & BPF
          # 
          make $MAKE_ARGS ${{ env.DEFCONFIG }}
          
          ./scripts/config --file out/.config \
            -e CONFIG_BPF \
            -e CONFIG_BPF_SYSCALL \
            -e CONFIG_BPF_JIT \
            -e CONFIG_BPF_JIT_ALWAYS_ON \
            -e CONFIG_NET_CLS_BPF \
            -e CONFIG_NET_ACT_BPF \
            -e CONFIG_CGROUP_BPF \
            -d CONFIG_ASSIST_KSU \
            -d CONFIG_KSU \
            -d CONFIG_LTO -d CONFIG_LTO_CLANG -e CONFIG_LTO_NONE
          
          make $MAKE_ARGS olddefconfig

          # Compilare
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-fcommon -Wno-error -Wno-unused-variable -Wno-unused-function -Wno-implicit-function-declaration"

      - name: Package with AnyKernel3
        run: |
          IMAGE="$GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz-dtb"
          if [ ! -f "$IMAGE" ]; then IMAGE="$GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz"; fi
          git clone https://github.com/osm0sis/AnyKernel3.git
          cp $IMAGE AnyKernel3/Image.gz
          sed -i 's/device.name1=maguro/device.name1=${{ env.DEVICE }}/g' AnyKernel3/anykernel.sh
          cd AnyKernel3 && zip -r9 ../Kernel-R5Q-A15-FINAL.zip *

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-R5Q-A15-Ready
          path: "*.zip"
