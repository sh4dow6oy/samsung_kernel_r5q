name: Build Lumi R5Q - Final eBPF Fix
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: LumiPlayground/android_kernel_samsung_sm8150
          ref: rawr-bpf
          path: kernel
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev \
          python3 python-is-python3 device-tree-compiler clang zip wget

      - name: Setup Toolchain (Neutron Clang)
        run: |
          mkdir -p clang
          wget -q https://github.com/Ylarod/setup-ndk-clang/releases/download/prebuilt/clang-linux-x86-ndk-r29-r563880c.tar.zst
          tar -I zstd -xf clang-linux-x86-ndk-r29-r563880c.tar.zst -C clang

      - name: Build Kernel
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          # Fix multiple definition
          grep -r "bool main_ext_ss_not_working" . | cut -d: -f1 | xargs sed -i 's/bool main_ext_ss_not_working/static bool main_ext_ss_not_working/g' || true
          
          export MAKE_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- O=out"

          make $MAKE_ARGS r5q_eur_open_defconfig
          ./scripts/config --file out/.config -e CONFIG_BPF_SYSCALL -e CONFIG_BPF_JIT -e CONFIG_CGROUP_BPF -d CONFIG_RTIC
          make $MAKE_ARGS olddefconfig
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-fcommon -w" O=out Image.gz-dtb

      - name: Advanced Packaging (Fix for S10 Lite)
        run: |
          # 1. Download Tools
          wget -q https://raw.githubusercontent.com/LineageOS/android_system_libufdt/lineage-18.1/utils/src/mkdtboimg.py -O mkdtboimg.py
          git clone https://github.com/osm0sis/AnyKernel3.git
          
          # 2. Build DTBO.img (Revizia ta 09 + altele)
          mkdir -p dtbo_manual
          RENO_PATH=$(find kernel/arch/arm64/boot/dts -name "renovation" -type d | grep -v "out" | head -n 1)
          DTS_INC="kernel/arch/arm64/boot/dts"
          
          FILES=("sm8150-sec-r5q-overlay-r00.dts" "sm8150-sec-r5q-overlay-r01.dts" "sm8150-sec-r5q-overlay-r07.dts" "sm8150-sec-r5q-overlay-r08.dts" "sm8150-sec-r5q-overlay-r09.dts" "sm8150-sec-system-update-overlay.dts")
          
          for f in "${FILES[@]}"; do
            clang -E -nostdinc -undef -D__DTS__ -x assembler-with-cpp -I kernel/include -I kernel/scripts/dtc/include-prefixes -I "$DTS_INC" -I "$DTS_INC/qcom" -I "$DTS_INC/samsung" -I "$RENO_PATH" "$RENO_PATH/$f" -o tmp.dts
            kernel/tools/dtc -@ -I dts -O dtb -o "dtbo_manual/${f%.dts}.dtbo" tmp.dts
          done
          python3 mkdtboimg.py create AnyKernel3/dtbo.img dtbo_manual/*.dtbo

          # 3. Configure AnyKernel3 (FIX CRITIC PENTRU RESTART)
          cd AnyKernel3
          cp ../kernel/out/arch/arm64/boot/Image.gz-dtb Image.gz
          
          # Modificam anykernel.sh sa fie "Aggressive"
          cat <<EOF > anykernel.sh
          properties() { '
          kernel.string=Lumi Kernel eBPF for S10 Lite
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          device.name=r5q
          '; }
          BLOCK=/dev/block/by-name/boot;
          IS_SLOT_DEVICE=0;
          PATCH_VBMETA_FLAG=1;
          . tools/ak3-core.sh;
          
          # Folosim split_boot si flash_boot pentru a nu corupe ramdisk-ul Samsung
          split_boot;
          flash_boot;
          
          # Flash DTBO (Esential pentru Rev 09)
          if [ -f "dtbo.img" ]; then
            dtbo_block=/dev/block/by-name/dtbo;
            ui_print "- Flashing DTBO...";
            flash_generic dtbo;
          fi
          EOF
          
          zip -r9 ../Lumi-R5Q-Final.zip *

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Lumi-R5Q-Kernel
          path: Lumi-R5Q-Final.zip
