name: Build Roynas R5Q - A15 BPF Ultimate
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: Roynas-Android-Playground/kernel_samsung_r3q
          ref: master
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev \
          ccache python3 python-is-python3 libarchive-tools wget zstd libtinfo6 zip git

      - name: Integrate A15 BPF Support
        run: |
          git config --global user.email "bot@example.com"
          git config --global user.name "Kernel Bot"
          
          # Adăugăm LineageOS ca sursă pentru BPF Android 15
          git remote add lineage https://github.com/LineageOS/android_kernel_google_msm-4.14.git
          git fetch lineage lineage-23.0
          
          # Checkout selectiv pentru fișierele eBPF (Forțat peste Samsung)
          git checkout lineage/lineage-23.0 -f -- kernel/bpf/ net/core/filter.c include/linux/filter.h include/uapi/linux/bpf.h
          
          git add .
          git commit -m "Add Android 15 eBPF support from LineageOS 23.0" || echo "No changes to commit"

      - name: Setup Neutron Clang
        run: |
          mkdir clang
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang

      - name: Build Kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          
          # 1. FIX KCONFIG (KernelSU Error)
          sed -i '/kernelsu\/Kconfig/d' drivers/android/Kconfig || true
          sed -i '/kernelsu/d' drivers/android/Makefile || true
          rm -rf drivers/kernelsu
          
          # 2. NUCLEAR CLEANUP (Polly & LLVM Flags)
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-mllvm -polly[^ ]*//g' {} +
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-mllvm//g' {} +
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-polly[^ ]*//g' {} +
          
          # 3. FIX VDSO (Shared/Static Error)
          if [ -f arch/arm64/kernel/vdso/Makefile ]; then
            sed -i 's/$(LDFLAGS)/$(filter-out -static,$(LDFLAGS))/g' arch/arm64/kernel/vdso/Makefile
          fi
          
          # 4. SAMSUNG WRAPPER DISABLE
          sed -i 's/ifneq ($(wildcard $(srctree)\/scripts\/gcc-wrapper.py),)/ifeq (0,1)/g' Makefile

          # 5. ARGUMENTE BUILD (Neutron LLVM)
          MAKE_ARGS="ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            O=out"

          # 6. CONFIGURARE
          make $MAKE_ARGS r5q_defconfig
          
          # ACTIVARE EBPF PENTRU ANDROID 15
          ./scripts/config --file out/.config \
            -e CONFIG_BPF \
            -e CONFIG_BPF_SYSCALL \
            -e CONFIG_BPF_JIT \
            -e CONFIG_BPF_JIT_ALWAYS_ON \
            -e CONFIG_NETFILTER_XT_MATCH_BPF \
            -e CONFIG_NET_CLS_BPF \
            -e CONFIG_NET_ACT_BPF \
            -e CONFIG_CGROUP_BPF \
            -d CONFIG_LTO_CLANG -e CONFIG_LTO_NONE \
            -d CONFIG_CC_STACKPROTECTOR_STRONG -e CONFIG_CC_STACKPROTECTOR_NONE

          make $MAKE_ARGS olddefconfig
          
          # 7. COMPILARE FINALĂ
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-fcommon -Wno-error -Wno-unknown-warning-option"

      - name: Package AnyKernel3
        run: |
          if [ ! -f out/arch/arm64/boot/Image.gz ]; then
            echo "EROARE: Image.gz nu a fost gasit!"
            exit 1
          fi

          git clone https://github.com/osm0sis/AnyKernel3.git
          cp out/arch/arm64/boot/Image.gz AnyKernel3/
          [ -f out/arch/arm64/boot/dtbo.img ] && cp out/arch/arm64/boot/dtbo.img AnyKernel3/
          
          # Configurare pentru S10 Lite (r5q)
          sed -i 's/device.name1=maguro/device.name1=r5q/g' AnyKernel3/anykernel.sh
          sed -i 's/device.name2=toroplus/device.name2=SM-G770F/g' AnyKernel3/anykernel.sh
          
          cd AnyKernel3 && zip -r9 ../Kernel-S10Lite-A15-BPF-Final.zip *

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-S10Lite-R5Q-A15
          path: Kernel-S10Lite-A15-BPF-Final.zip
