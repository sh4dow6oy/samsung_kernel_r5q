name: Build Samsung SM8150 (Clang r522817)

on:
  workflow_dispatch:

jobs:
  build_kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: sh4dow6oy/android_kernel_samsung_sm8150-5.4
          path: kernel

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libncurses-dev

      - name: Download Specific Clang (r522817)
        run: |
          mkdir clang
          wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r522817.tar.gz
          tar -xf clang-r522817.tar.gz -C clang/

      - name: Compile Kernel
        run: |
          cd kernel
          # Setăm căile către toolchain
          CLANG_PATH=$GITHUB_WORKSPACE/clang/bin
          export PATH=$CLANG_PATH:$PATH
          
          # Variabile de mediu pentru compilare
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-

          # 1. Generare Config
          make O=out vendor/b2q_eur_openx_defconfig

          # 2. Build efectiv
          # Folosim LLVM=1 pentru a folosi tool-urile din Clang (readelf, objcopy, etc.)
          make -j$(nproc --all) O=out \
                      ARCH=arm64 \
                      CC=clang \
                      CLANG_TRIPLE=aarch64-linux-gnu- \
                      CROSS_COMPILE=aarch64-linux-gnu- \
                      CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
                      LLVM=1 \
                      LLVM_IAS=1

      - name: Check Output
        run: |
          if [ -f kernel/out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "Kernel built successfully!"
          else
            echo "Kernel build failed, Image.gz-dtb not found."
            exit 1
          fi

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_SM8150_r522817
          path: |
            kernel/out/arch/arm64/boot/Image.gz-dtb
            kernel/out/arch/arm64/boot/Image
            kernel/out/.config
