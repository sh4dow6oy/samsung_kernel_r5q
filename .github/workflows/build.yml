name: S10 Lite Kernel - Android 15 Hybrid (Header Fix)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves libncurses-dev git wget make python2 python3 pahole cpio lz4

      - name: Cache Toolchain
        uses: actions/cache@v4
        with:
          path: toolchain/proton-clang
          key: ${{ runner.os }}-proton-clang-v1

      - name: Download Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang || true

      - name: Upstream eBPF (Kernel.org 4.14.y)
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git remote add linux-stable https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git || true
          git fetch linux-stable linux-4.14.y --depth=1
          PATHS=("kernel/bpf/" "drivers/android/" "include/linux/bpf.h" "include/linux/filter.h" "include/linux/bpf_verifier.h" "include/linux/bpf-cgroup.h" "include/uapi/linux/bpf.h" "include/uapi/linux/bpf_common.h" "include/uapi/linux/filter.h" "arch/arm64/net/")
          for path in "${PATHS[@]}"; do git checkout FETCH_HEAD -- "$path" || echo "Skip: $path"; done

      - name: Pre-build Fixes (BPF Header Sanitization)
        run: |
          # 1. Fix Cgroup Symbols & Return Types
          if [ -f kernel/cgroup/cgroup.c ]; then
            sed -i 's/__cgroup_bpf_attach/cgroup_bpf_attach/g' kernel/cgroup/cgroup.c
            sed -i 's/__cgroup_bpf_detach/cgroup_bpf_detach/g' kernel/cgroup/cgroup.c
            sed -i 's/ret = cgroup_bpf_inherit(\([^,)]*\))/cgroup_bpf_inherit(\1, NULL)/g' kernel/cgroup/cgroup.c
          fi

          # 2. Fix Conflict in bpf-cgroup.h (Eliminăm declarația care se bate cu linker-ul)
          if [ -f include/linux/bpf-cgroup.h ]; then
            sed -i 's/int cgroup_bpf_update/static inline int cgroup_bpf_update_unused/g' include/linux/bpf-cgroup.h
          fi

          # 3. Injectare struct bpf_prog_aux security (Pascua Technique)
          sed -i '/struct bpf_prog_aux {/a \	void *security;' include/linux/bpf.h

          # 4. Fix bpf_trace.c
          if [ -f kernel/trace/bpf_trace.c ]; then
            sed -i '1i #include <linux/filter.h>' kernel/trace/bpf_trace.c
            sed -i 's/BPF_PROG_RUN_ARRAY_CHECK([^)]*)/0/g' kernel/trace/bpf_trace.c
            sed -i 's/BPF_PROG_RUN_ARRAY([^)]*)/0/g' kernel/trace/bpf_trace.c
            # Neutralizăm apelurile către funcțiile de array direct în C pentru a nu strica headerele
            sed -i 's/bpf_prog_array_copy/0 \/\/ /g' kernel/trace/bpf_trace.c
            sed -i 's/bpf_prog_array_free/(void) \/\/ /g' kernel/trace/bpf_trace.c
            sed -i 's/bpf_prog_array_delete_safe/(void) \/\/ /g' kernel/trace/bpf_trace.c
          fi

          # 5. Fix SELinux
          if [ -f security/selinux/hooks.c ]; then
            sed -i '/#include "layers.h"/a #include <linux/bpf.h>' security/selinux/hooks.c
            sed -i 's/file->f_op == \&bpf_map_fops/0/g' security/selinux/hooks.c
            sed -i 's/file->f_op == \&bpf_prog_fops/0/g' security/selinux/hooks.c
          fi

          # 6. Samsung Freecess Typo & Python Fix
          if [ -f drivers/staging/android/freecess_pkg.c ]; then
            sed -i 's/extern int binders_in_transcation;/int binders_in_transcation = 0;/g' drivers/staging/android/freecess_pkg.c
          fi
          sudo ln -sf /usr/bin/python3 /usr/bin/python
          mkdir -p system/core/liblog/include/log
          echo -e "#ifndef _PERFLOG_H\n#define _PERFLOG_H\n#endif" > system/core/liblog/include/log/perflog.h

      - name: Build Kernel & DTBs
        run: |
          export PATH=$(pwd)/toolchain/proton-clang/bin:$PATH
          MAKE_ARGS="O=out ARCH=arm64 CC=clang HOSTCC=gcc HOSTCXX=g++ LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1 TECHPACK=true"
          export KCFLAGS="-Wno-error -Wno-implicit-function-declaration -Wno-macro-redefined -Wno-incompatible-pointer-types -Wno-format-security"

          rm -rf out && mkdir -p out
          make $MAKE_ARGS r5q_eur_open_defconfig
          
          # Dezactivăm CONFIG_MODVERSIONS pentru a scăpa de eroarea CRC GSI
          ./scripts/config --file out/.config --disable CONFIG_MODVERSIONS
          ./scripts/config --file out/.config --enable CONFIG_BPF_SYSCALL --enable CONFIG_BPF_JIT --enable CONFIG_HAVE_EBPF_JIT --enable CONFIG_ANDROID_BINDERFS --disable CONFIG_SAMSUNG_PRODUCT_SHIP --disable CONFIG_DEFEX --disable CONFIG_CC_STACKPROTECTOR_STRONG
          
          make $MAKE_ARGS olddefconfig
          make -j$(nproc --all) $MAKE_ARGS Image.gz-dtb dtbs || make -j1 $MAKE_ARGS Image.gz-dtb dtbs

      - name: Prepare Artifacts
        run: |
          mkdir -p deploy
          cp out/arch/arm64/boot/Image.gz-dtb deploy/ 2>/dev/null || cp out/arch/arm64/boot/Image deploy/
          find out/arch/arm64/boot/dts/ -name "*.dtb" -exec cp {} deploy/ \;
          find out/arch/arm64/boot/dts/ -name "*.dtbo" -exec cp {} deploy/ \; 2>/dev/null || true

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-A15-Hybrid-Kernel
          path: deploy/*
