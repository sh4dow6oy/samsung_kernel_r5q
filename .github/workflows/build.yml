name: Build Prime Kernel R5Q

on:
  workflow_dispatch:
    inputs:
      release:
          description: 'Upload release'
          type: boolean
          required: true
          default: false
      changelog:
          description: 'Changelog'
          type: string
          required: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_ts: ${{ steps.ts.outputs.release_ts }}
    steps:
      - name: Generate release date
        id: ts
        run: echo "release_ts=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

  build:
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git curl unzip wget zip zstd \
            bc bison flex libssl-dev libelf-dev python3 python-is-python3

      - name: Download Stable AOSP Clang & GCC
        run: |
          # Folosim un mirror stabil pentru Clang r487747c
          mkdir clang-stable
          wget https://github.com/ZyCromerZ/Clang/releases/download/17.0.0-20230522-release/Clang-17.0.0-20230522.tar.gz
          tar -C clang-stable -xf Clang-17.0.0-20230522.tar.gz
          
          # GCC-urile necesare pentru cross-compiling (Legacy Samsung requirement)
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git --depth=1 gcc64
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git --depth=1 gcc32

      - name: Build kernel
        run: |
          # 1. Setup PATH
          export CLANG_PATH=$(pwd)/clang-stable/bin
          export GCC64_PATH=$(pwd)/gcc64/bin
          export GCC32_PATH=$(pwd)/gcc32/bin
          export PATH="$CLANG_PATH:$GCC64_PATH:$GCC32_PATH:$PATH"

          # 2. NUCLEAR CLEAN (Fix Segmentation Faults & Clang Issues)
          # Dezactivăm scriptul de test asm-goto care dă greș pe compilatoare noi
          echo "exit 0" > scripts/gcc-goto.sh
          
          # Eliminăm flag-urile care blochează compilarea pe Clang
          grep -rl "implicit-function-declaration" . | xargs sed -i 's/-Werror=implicit-function-declaration//g' || true
          grep -rl "unknown-warning-option" . | xargs sed -i 's/-Wno-unknown-warning-option//g' || true
          find . -name Makefile* -exec sed -i 's/-Werror//g' {} +

          # 3. Fix Samsung tools
          echo "#!/bin/bash" > secgetspf
          echo "exit 0" >> secgetspf
          chmod +x secgetspf
          export PATH="$PATH:$(pwd)"

          # 4. Mediul de compilare
          export KERNEL_MAKE_ENV="DTC_EXT=$(pwd)/scripts/dtc CONFIG_BUILD_ARM64_DT_OVERLAY=y SHELL=/bin/bash"
          
          MAKE_ARGS="ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            O=out"

          # 5. Generare Config (R5Q = S10 Lite)
          make $MAKE_ARGS $KERNEL_MAKE_ENV r5q_eur_open_defconfig

          # 6. Forțare Config (Dezactivare SEC_DEBUG și Stack Protector Strong)
          ./scripts/config --file out/.config \
            -d CONFIG_SEC_DEBUG \
            -d CONFIG_SEC_DEBUG_COMMON \
            -d CONFIG_SEC_DEBUG_EXTRA \
            -d CONFIG_CC_STACKPROTECTOR_STRONG \
            -e CONFIG_CC_STACKPROTECTOR_NONE \
            -d CONFIG_SAMSUNG_PRODUCT_SHIP \
            -e CONFIG_CC_HAVE_ASM_GOTO

          # 7. Compilare Finală
          make $MAKE_ARGS $KERNEL_MAKE_ENV olddefconfig
          make $MAKE_ARGS $KERNEL_MAKE_ENV -j$(nproc --all) Image.gz-dtb

          # 8. Copiere în AnyKernel3
          if [ -d "AnyKernel3" ]; then
            cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrimeKernel-R5Q-${{ needs.prepare.outputs.release_ts }}
          path: AnyKernel3/

  release:
    needs: [prepare, build]
    if: github.event.inputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
      - name: Zip and Release
        run: |
          cd artifacts
          for dir in PrimeKernel-*; do
            if [ -d "$dir" ]; then
              (cd "$dir" && zip -r "../${dir}.zip" .)
            fi
          done
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ needs.prepare.outputs.release_ts }}"
          name: "PrimeKernel-R5Q-${{ needs.prepare.outputs.release_ts }}"
          body: "${{ github.event.inputs.changelog }}"
          files: artifacts/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
