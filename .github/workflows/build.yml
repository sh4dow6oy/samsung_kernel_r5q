name: Build Samsung SM8150 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        repository: LumiPlayground/android_kernel_samsung_sm8150
        ref: auriana
        path: kernel

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm libncurses-dev

    - name: Download Me2 Toolchain
      run: |
        git clone https://github.com/mk7x7/Me2.git toolchain
        # Verificăm ce e în bin pentru a vedea numele reale ale linkere-lor
        ls toolchain/toolchain/bin
        echo "TC_BIN=$(pwd)/toolchain/toolchain/bin" >> $GITHUB_ENV

    - name: Build Kernel
      run: |
        cd kernel
        
        export PATH="${{ env.TC_BIN }}:$PATH"
        export ARCH=arm64
        export SUBARCH=arm64
        
        # Variabile esențiale pentru Samsung & Qualcomm Wi-Fi
        export KERNEL_MAKE_ENV="DTC_EXT=$(pwd)/scripts/dtc/dtc \
                                CONFIG_BUILD_ARM64_DT_OVERLAY=y \
                                CONFIG_WLAN_VARIANT=samsung \
                                CC=clang \
                                HOSTCC=clang \
                                CLANG_TRIPLE=aarch64-linux-gnu- \
                                CROSS_COMPILE=${{ env.TC_BIN }}/aarch64-linux-android- \
                                CROSS_COMPILE_ARM32=${{ env.TC_BIN }}/arm-linux-androideabi-"

        # 1. Configurare (CAT)
        cat arch/arm64/configs/sm8150_sec_defconfig arch/arm64/configs/sm8150_sec_r5q_eur_open.config > arch/arm64/configs/combined_defconfig
        
        # Patch rapid pentru Stack Protector dacă compilatorul e prea nou
        echo "CONFIG_CC_STACKPROTECTOR_NONE=y" >> arch/arm64/configs/combined_defconfig
        echo "# CONFIG_CC_STACKPROTECTOR_STRONG is not set" >> arch/arm64/configs/combined_defconfig

        make O=out $KERNEL_MAKE_ENV combined_defconfig
        make O=out $KERNEL_MAKE_ENV olddefconfig

        # 2. Build
        # Am scos LD=ld.lld manual. Clang va folosi automat ce are el în folderul bin.
        make -j$(nproc --all) O=out $KERNEL_MAKE_ENV KCFLAGS="-w"
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-SM8150-r5q
        path: |
          kernel/out/arch/arm64/boot/Image.gz-dtb
          kernel/out/arch/arm64/boot/dtbo.img
          kernel/out/.config
