name: Build Samsung SM8150 (Auriana)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Cleanup Environment
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc "/usr/local/share/boost" "$AGENT_TOOLSDIRECTORY"
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison ncurses-dev libssl-dev libelf-dev xz-utils libfl-dev python3 git-core ccache gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Clone Kernel Source
        run: |
          git clone --depth=1 -b auriana https://github.com/sh4dow6oy/android_kernel_samsung_sm8150.git source
          
      - name: Setup Proton Clang
        run: |
          mkdir clang
          cd clang
          wget https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.tar.gz
          tar -xf master.tar.gz
          # FIX RADICAL: Ștergem linker-ul care cauzează eroarea .relr.dyn
          # Asta forțează sistemul să folosească linker-ul nativ pentru uneltele HOST
          rm -f proton-clang-master/bin/ld
          echo "$(pwd)/proton-clang-master/bin" >> $GITHUB_PATH

      - name: Build Kernel
        run: |
          cd source
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export HOSTCC=gcc
          export HOSTCXX=g++
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          mkdir -p out
          
          # 1. Config de bază
          make O=out ARCH=arm64 HOSTCC=$HOSTCC HOSTCXX=$HOSTCXX sm8150_sec_defconfig
          
          # 2. Merge config pentru R5Q
          scripts/kconfig/merge_config.sh -O out/ out/.config arch/arm64/configs/sm8150_sec_r5q_eur_open.config

          # 3. Compilare finală
          # Specificăm LD=ld.lld pentru kernel (care e compatibil) 
          # în timp ce uneltele host vor folosi ld-ul de sistem automat
          make -j$(nproc --all) O=out \
                      ARCH=arm64 \
                      CC=clang \
                      HOSTCC=$HOSTCC \
                      HOSTCXX=$HOSTCXX \
                      CROSS_COMPILE=aarch64-linux-gnu- \
                      CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
                      NM=llvm-nm \
                      OBJCOPY=llvm-objcopy \
                      OBJDUMP=llvm-objdump \
                      STRIP=llvm-strip \
                      LD=ld.lld \
                      AR=llvm-ar

      - name: Check and Upload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Auriana-SM8150
          path: |
            source/out/arch/arm64/boot/Image.gz
            source/out/arch/arm64/boot/Image.gz-dtb
            source/out/arch/arm64/boot/dtbo.img
