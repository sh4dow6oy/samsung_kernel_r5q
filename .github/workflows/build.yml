name: Build R5Q - Phoenix BPF Final (OneUI 7 Ready)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Your Kernel (r5q)
        uses: actions/checkout@v4
        with:
          repository: Roynas-Android-Playground/kernel_samsung_r3q
          ref: master
          path: kernel
          fetch-depth: 0

      - name: Merge Phoenix BPF-5.10 (Commit 724a255)
        run: |
          cd kernel
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          
          git remote add phoenix https://github.com/PhoenixKernel/linux.git
          git fetch phoenix bpf-5.10
          
          echo "Merging Phoenix BPF-5.10 branch..."
          # Folosim strategia 'theirs' pentru a ne asigura că primim tot codul BPF nou
          git merge -X theirs phoenix/bpf-5.10 -m "Merge Phoenix BPF-5.10 for OneUI 7" || true
          
          # Fix-uri obligatorii:
          # 1. Păstrăm r5q_defconfig pentru a nu pierde driverele de display/camera Snapdragon
          git checkout --ours arch/arm64/configs/r5q_defconfig || echo "No config conflict"
          
          # 2. Ne asigurăm că fișierele din commit-ul 724a255 sunt prezente
          git checkout phoenix/bpf-5.10 -- kernel/bpf/ include/linux/bpf.h net/core/filter.c
          
          git add .
          git commit -m "Finalize BPF merge with focus on Phoenix helpers" || echo "No changes"

      - name: Install Build Essentials
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
          bc libssl-dev flex bison libelf-dev pahole zstd python3 llvm

      - name: Setup AOSP Clang
        run: |
          mkdir -p aosp-clang
          cd aosp-clang
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-r487747c.tar.gz
          tar -xf clang-r487747c.tar.gz
          echo "$GITHUB_WORKSPACE/aosp-clang/bin" >> $GITHUB_PATH

      - name: Build Kernel (r5q)
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/aosp-clang/bin:$PATH"
          
          MAKE_ARGS="ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            O=out"

          mkdir -p out
          make $MAKE_ARGS r5q_defconfig

          # Configurare BPF pentru Android 15
          ./scripts/config --file out/.config \
            -e CONFIG_BPF \
            -e CONFIG_BPF_SYSCALL \
            -e CONFIG_BPF_JIT \
            -e CONFIG_BPF_EVENTS \
            -e CONFIG_CGROUP_BPF \
            -e CONFIG_NET_CLS_BPF \
            -e CONFIG_NET_ACT_BPF \
            -d CONFIG_SAMSUNG_RTIC \
            -d CONFIG_SECURITY_RKP \
            -d CONFIG_SECURITY_DEFEX \
            -d CONFIG_KSU \
            -d CONFIG_WERROR

          make $MAKE_ARGS olddefconfig

          # Compilare
          make -j$(nproc --all) $MAKE_ARGS Image.gz \
            DTC_FLAGS="-i" \
            KCFLAGS="-w -fcommon"

      - name: Package AnyKernel3
        run: |
          IMAGE="kernel/out/arch/arm64/boot/Image.gz"
          git clone https://github.com/osm0sis/AnyKernel3.git AK3
          cp "$IMAGE" AK3/
          cd AK3
          sed -i 's/device.name1=maguro/device.name1=r5q/g' anykernel.sh
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          zip -r9 ../R5Q-OneUI7-Lumi.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: R5Q-OneUI7-Kernel
          path: R5Q-OneUI7-Lumi.zip
