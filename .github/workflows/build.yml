name: Build S10 Lite Kernel (Proton Clang)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest # Folosim latest pentru viteza, dar gestionam dependintele
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: sh4dow6oy/samsung_kernel_r5q
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev \
          ccache python3 python-is-python3 libarchive-tools libncurses-dev wget

      - name: Download Proton Clang
        run: |
          git clone https://github.com/kdrag0n/proton-clang.git --depth=1 proton-clang

      - name: Patch for Android 15 & No Knox
        run: |
          CONF="arch/arm64/configs/r5q_eur_open_defconfig"
          
          # Eliminam definitiile Knox care blocheaza boot-ul pe A15 custom
          sed -i '/CONFIG_KNOX/d' $CONF
          sed -i '/CONFIG_SECURITY_SAMSUNG/d' $CONF
          {
            echo "CONFIG_SECURITY_SAMSUNG_KNOX=n"
            echo "CONFIG_KNOX_KAP=n"
            echo "CONFIG_RKP_KDP=n"
            # Activare eBPF obligatorie pentru Android 15
            echo "CONFIG_BPF=y"
            echo "CONFIG_BPF_SYSCALL=y"
            echo "CONFIG_BPF_JIT=y"
            echo "CONFIG_CGROUP_BPF=y"
            echo "CONFIG_NET_CLS_BPF=y"
            echo "CONFIG_NET_ACT_BPF=y"
          } >> $CONF

      - name: Build Kernel
        run: |
          export PATH=$GITHUB_WORKSPACE/proton-clang/bin:$PATH
          
          # Fix critic pentru 'yylloc' (eroare comuna pe Clang nou la kernel vechi)
          export CFLAGS="-fcommon"
          export HOSTCFLAGS="-fcommon"

          MAKE_ARGS="ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            LD=ld.lld \
            HOSTCC=clang \
            HOSTCXX=clang++ \
            O=out"

          # Build cycle
          make $MAKE_ARGS clean
          make $MAKE_ARGS r5q_eur_open_defconfig
          # Dezactivam avertismentele ca erori pentru a trece de micile incompatibilitati
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-Wno-error" HOSTCFLAGS="-Wno-error"

      - name: Upload Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-Kernel-A15
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/dtbo.img
