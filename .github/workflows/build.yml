name: S10 Lite - Stock Build (Clang r416183b1)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves libncurses-dev git wget make python2 python3 pahole tar xz-utils lib32z1

      - name: Setup Toolchains
        run: |
          mkdir -p toolchain/clang toolchain/gcc
          
          # 1. Descarcăm Clang r416183b1 (Link-ul furnizat de tine)
          wget -L "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/7d21a2e4192728bc50841994d88637ccc45b5692.tar.gz" -O clang.tar.gz
          tar -xf clang.tar.gz -C toolchain/clang
          
          # 2. Descarcăm GCC 4.9 pentru binutils (necesar pentru linking)
          wget -L "https://github.com/sh4dow6oy/samsung_kernel_r5q/releases/download/GCC/prebuilts.tar" -O gcc.tar
          tar -xf gcc.tar -C toolchain/gcc
          
          # Detecție căi
          echo "CLANG_PATH=$(pwd)/toolchain/clang/bin" >> $GITHUB_ENV
          # Căutăm folderul bin pentru GCC 64-bit
          GCC64_BIN=$(find $(pwd)/toolchain/gcc -name "aarch64-linux-android-gcc" -type f -printf '%h\n' | head -n 1)
          echo "GCC_PATH=$GCC64_BIN" >> $GITHUB_ENV

      - name: Essential Samsung Fixes
        run: |
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          mkdir -p system/core/liblog/include/log
          echo -e "#ifndef _PERFLOG_H\n#define _PERFLOG_H\n#endif" > system/core/liblog/include/log/perflog.h
          
          # Eliminăm Werror pentru a trece de warning-urile de Techpack
          find . -name "Makefile" -o -name "Kbuild" | xargs sed -i 's/-Werror//g' || true
          
          # Fix pentru poll_t
          sed -i '/#define _UAPI_LINUX_TYPES_H/a #ifndef __poll_t\n#ifndef __ASSEMBLY__\ntypedef unsigned int __poll_t;\n#endif\n#define __poll_t __poll_t\n#endif' include/uapi/linux/types.h

      - name: Build Kernel
        run: |
          export PATH="${{ env.CLANG_PATH }}:${{ env.GCC_PATH }}:$PATH"
          
          # Verificăm dacă Clang rulează (pentru a evita exec format error)
          clang --version
          
          MAKE_ARGS="
            O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
          "

          rm -rf out && mkdir -p out
          
          # 1. Defconfig
          make $MAKE_ARGS r5q_eur_open_defconfig
          
          # 2. Bypass Stack Protector
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/CONFIG_CC_STACKPROTECTOR_NONE=y/g' out/.config
          make $MAKE_ARGS olddefconfig
          
          # 3. Prepare
          make $MAKE_ARGS prepare scripts -j$(nproc --all)
          
          # 4. Build
          make -j$(nproc --all) $MAKE_ARGS || make -j1 $MAKE_ARGS

          if [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image .
            [ -f out/arch/arm64/boot/dtbo.img ] && cp out/arch/arm64/boot/dtbo.img .
            echo "SUCCESS=true" >> $GITHUB_ENV
          fi

      - name: Upload Artifacts
        if: env.SUCCESS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-Kernel-r416183b
          path: |
            Image
            dtbo.img
