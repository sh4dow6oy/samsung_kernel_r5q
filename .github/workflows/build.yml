name: Build R5Q - Phoenix Hybrid BPF V7
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Your Kernel (r5q)
        uses: actions/checkout@v4
        with:
          repository: Roynas-Android-Playground/kernel_samsung_r3q
          ref: master
          path: kernel
          fetch-depth: 0

      - name: Phoenix Hybrid Transplant (Logic Alignment)
        run: |
          cd kernel
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          
          git remote add phoenix https://github.com/PhoenixKernel/linux.git
          git fetch phoenix android-4.14-phoenix --depth=1
          git fetch phoenix android12-5.10-phoenix --depth=1
          
          echo "Cleaning residues..."
          sed -i '/kernelsu\/Kconfig/d' drivers/android/Kconfig || true
          rm -rf kernel/bpf/ security/bpf/
          
          echo "Syncing 5.10 Foundations..."
          # Luăm structurile de bază din 5.10 pentru consistență cu BPF LSM
          git checkout phoenix/android12-5.10-phoenix -- include/linux/mm_types.h
          git checkout phoenix/android12-5.10-phoenix -- include/linux/sched.h
          git checkout phoenix/android12-5.10-phoenix -- include/linux/sched/task.h
          git checkout phoenix/android12-5.10-phoenix -- include/linux/mm.h
          git checkout phoenix/android12-5.10-phoenix -- include/linux/security.h
          git checkout phoenix/android12-5.10-phoenix -- include/linux/lsm_hooks.h
          git checkout phoenix/android12-5.10-phoenix -- include/linux/lsm_hook_defs.h
          git checkout phoenix/android12-5.10-phoenix -- include/linux/bpf.h
          git checkout phoenix/android12-5.10-phoenix -- include/uapi/linux/bpf.h
          git checkout phoenix/android12-5.10-phoenix -- include/linux/kernel_read_file.h || touch include/linux/kernel_read_file.h
          
          echo "Syncing Process Logic (Aligning fork/exit with 5.10 structs)..."
          # Importăm logica de procese din 5.10 ca să se potrivească cu task_struct redenumit
          git checkout phoenix/android12-5.10-phoenix -- kernel/fork.c
          git checkout phoenix/android12-5.10-phoenix -- kernel/exit.c
          
          # Păstrăm totuși BPF-ul din Phoenix 4.14 pentru compatibilitate JIT/ARM64
          git checkout phoenix/android-4.14-phoenix -- kernel/bpf/
          git checkout phoenix/android-4.14-phoenix -- security/
          git checkout phoenix/android-4.14-phoenix -- fs/proc/base.c

          # Fix Clang compliance
          sed -i 's/page = (char \*)__get_free_page/struct page *page_ptr; page = (char *)__get_free_page/g' fs/proc/base.c || true
          
          # Fix redenumire state -> __state pentru orice fișier .c rămas pe model vechi
          find . -name "*.c" -exec sed -i 's/\btask->state\b/task->__state/g' {} +
          find . -name "*.c" -exec sed -i 's/\bp->state\b/p->__state/g' {} +

          git add .
          git commit -m "Hybrid Sync V7: Aligned task_struct state and process logic" || echo "No changes"

      - name: Setup Toolchain
        run: |
          sudo apt-get update && sudo apt-get install -y zstd libssl-dev bc bison flex
          mkdir clang
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang
          echo "$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_PATH

      - name: Build Kernel
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"

          MAKE_ARGS="ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            O=out"

          mkdir -p out
          make $MAKE_ARGS r5q_defconfig

          ./scripts/config --file out/.config \
            -e CONFIG_BPF \
            -e CONFIG_BPF_SYSCALL \
            -e CONFIG_BPF_JIT \
            -e CONFIG_BPF_LSM \
            -d CONFIG_SAMSUNG_RTIC \
            -d CONFIG_SECURITY_RKP \
            -d CONFIG_WERROR

          make $MAKE_ARGS olddefconfig
          
          # KCFLAGS agresive pentru a ignora diferențele de tip hibride
          make -j$(nproc --all) $MAKE_ARGS Image.gz \
            KCFLAGS="-w -fcommon -fno-stack-protector -Wno-implicit-function-declaration -Wno-int-conversion -fintegrated-as" \
            HOSTCFLAGS="-w"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-R5Q-V7-Hybrid
          path: kernel/out/arch/arm64/boot/Image.gz
