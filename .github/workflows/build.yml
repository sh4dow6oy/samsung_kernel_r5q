name: R5Q - Android 15 (Input & Secure Fix)
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Andy2660 Base (4.14.283)
        uses: actions/checkout@v4
        with:
          repository: Andy2660/android_kernel_samsung_a82xq
          ref: linux-4.14.283
          path: kernel

      - name: Sparse Checkout Roynas Renovation
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/Roynas-Android-Playground/kernel_samsung_r3q.git roynas_tmp
          cd roynas_tmp
          git sparse-checkout init --cone
          git sparse-checkout set arch/arm64/boot/dts/samsung/renovation arch/arm64/configs/r5q_defconfig
          git checkout master
          
          mkdir -p ../kernel/arch/arm64/boot/dts/samsung/renovation
          mkdir -p ../kernel/arch/arm64/configs/vendor
          
          cp -r arch/arm64/boot/dts/samsung/renovation/* ../kernel/arch/arm64/boot/dts/samsung/renovation/
          cp arch/arm64/configs/r5q_defconfig ../kernel/arch/arm64/configs/vendor/r5q_stock_defconfig
          cd ..
          rm -rf roynas_tmp

      - name: Prep and Source Fixes
        run: |
          cd kernel
          # FIX 1: Crypto 'ci_iv_key' -> 'ci_raw_key'
          sed -i 's/ci->ci_iv_key/ci->ci_raw_key/g' fs/crypto/keysetup_v1.c
          
          # FIX 2: Fingerprint DVFS_FINGER_ID (Define ID for SM8150 context)
          sed -i '16i #define DVFS_FINGER_ID 1' drivers/fingerprint/et7xx-spi.c
          
          # FIX 3: Secure Touch of_match_ptr fix (Clang 17 compatibility)
          # Înlocuim .of_match_table = of_match_ptr(nume) cu .of_match_table = nume
          sed -i 's/of_match_ptr(sec_secure_touch_dt_match)/sec_secure_touch_dt_match/g' drivers/input/sec_secure_touch.c

      - name: Setup Toolchain (NDK Clang)
        run: |
          sudo apt-get update && sudo apt-get install -y bc build-essential flex bison lz4 zstd zip gcc-aarch64-linux-gnu
          mkdir -p clang
          wget -q https://github.com/Ylarod/setup-ndk-clang/releases/download/prebuilt/clang-linux-x86-ndk-r29-r563880c.tar.zst
          tar -I zstd -xf clang-linux-x86-ndk-r29-r563880c.tar.zst -C clang

      - name: Build Kernel (The "No-Error" Run)
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export MAKE_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=1 LD=ld.lld CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- O=out"
          
          make $MAKE_ARGS vendor/r5q_stock_defconfig
          
          # Menținem j2 pentru a evita crash-ul de memorie (OOM)
          make -j2 $MAKE_ARGS \
            KCFLAGS="-w" \
            LDFLAGS="--allow-multiple-definition" \
            CONFIG_BPFILTER=n \
            O=out Image.gz-dtb

      - name: Package
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          if [ -f kernel/out/arch/arm64/boot/Image.gz-dtb ]; then
            cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          else
            echo "Build failed - Image not found"
            exit 1
          fi
          cd AnyKernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          zip -r9 ../Lumi-Kernel-R5Q-v29.zip *

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Lumi-Kernel-v29
          path: Lumi-Kernel-R5Q-v29.zip
