name: Build r5q Kernel - Final eBPF Fix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex gcc-aarch64-linux-gnu git libssl-dev python3 clang llvm lld

      - name: Clone Mainey Kernel (Base lineage-19.0)
        run: |
          git clone --depth=500 https://github.com/mainey/android_kernel_samsung_r5q.git -b lineage-19.0 kernel
          cd kernel
          git config user.email "wizard@build.com"
          git config user.name "Kernel-Wizard"

      - name: Fetch and Apply eBPF Patch (Gerrit 387879)
        run: |
          cd kernel
          git fetch https://github.com/LineageOS/android_kernel_samsung_sm7125 refs/changes/79/387879/1
          
          # Aplicăm patch-ul cu prioritate pentru codul LineageOS
          git cherry-pick FETCH_HEAD -X theirs || {
            echo "Forțăm fișierele eBPF critice..."
            git checkout FETCH_HEAD -- include/uapi/linux/bpf.h
            git checkout FETCH_HEAD -- include/linux/bpf.h
            git checkout FETCH_HEAD -- net/core/filter.c
            git add .
            git cherry-pick --continue --no-edit
          }

      - name: Fix Missing BPF Identifiers & Conflict Markers
        run: |
          cd kernel
          # Definim constanta lipsă care a cauzat eroarea anterioară
          # O inserăm după primele definiții din bpf.h
          sed -i '/#define _UAPI__LINUX_BPF_H/a \
          \
          #ifndef BPF_OBJ_NAME_LEN\
          #define BPF_OBJ_NAME_LEN 16U\
          #endif' include/uapi/linux/bpf.h

          # Eliminăm restul marcajelor de conflict (safety)
          find . -type f -name "*.h" -o -name "*.c" | xargs sed -i '/^<<<<<<< /d; /^=======/d; /^>>>>>>> /d' || true

      - name: Configure Defconfig
        run: |
          cd kernel
          # Folosim scriptul intern pentru a activa modulele eBPF
          scripts/config --file arch/arm64/configs/r5q_defconfig -e BPF
          scripts/config --file arch/arm64/configs/r5q_defconfig -e BPF_SYSCALL
          scripts/config --file arch/arm64/configs/r5q_defconfig -e BPF_JIT
          scripts/config --file arch/arm64/configs/r5q_defconfig -e CGROUP_BPF
          scripts/config --file arch/arm64/configs/r5q_defconfig -e NETFILTER_XT_MATCH_BPF
          scripts/config --file arch/arm64/configs/r5q_defconfig -e NETFILTER_XT_TARGET_BPF
          scripts/config --file arch/arm64/configs/r5q_defconfig -e BPF_EVENTS

      - name: Build Kernel (Clang Toolchain)
        run: |
          cd kernel
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          
          mkdir -p out
          make O=out r5q_defconfig
          
          # Compilăm cu ignorarea warning-urilor transformate în erori (-Wno-error)
          # Adăugăm și -fcommon pentru a evita erorile de tip "multiple definition"
          make -j$(nproc --all) O=out KCFLAGS="-Wno-error -fcommon"

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-r5q-eBPF-Fixed
          path: |
            kernel/out/arch/arm64/boot/Image.gz-dtb
            kernel/out/arch/arm64/boot/dtbo.img
