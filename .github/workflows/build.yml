name: S10 Lite - Pascua Base v43

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout S10 Lite (Source)
        uses: actions/checkout@v4
        with:
          path: s10-lite-src

      - name: Setup Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves make python3 lz4 perl git
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang

      - name: Prepare Pascua Sixteen Base
        run: |
          # Clonăm baza lui Pascua care este deja optimizată pentru Android 15/16
          git clone --depth=1 -b sixteen https://github.com/pascua28/android_kernel_samsung_sm7150.git kernel-res

      - name: Inject S10 Lite Drivers & Config
        run: |
          # Injectăm driverele specifice de S10 Lite peste baza Pascua
          cp -r s10-lite-src/drivers/soc/samsung kernel-res/drivers/soc/ || true
          cp -r s10-lite-src/drivers/camera kernel-res/drivers/ || true
          cp -r s10-lite-src/drivers/fingerprint kernel-res/drivers/ || true
          cp -r s10-lite-src/drivers/sensors kernel-res/drivers/ || true
          
          # Injectăm Device Tree-ul de Samsung (r5q)
          cp -r s10-lite-src/arch/arm64/boot/dts/samsung kernel-res/arch/arm64/boot/dts/ || true
          
          # Injectăm Defconfig-ul tău
          cp s10-lite-src/arch/arm64/configs/r5q_eur_open_defconfig kernel-res/arch/arm64/configs/

      - name: Hybrid Optimization
        run: |
          cd kernel-res
          # Ajustăm SMB1390 (casting-ul care dădea eroare)
          sed -i 's/(int)of_device_get_match_data/(uintptr_t)of_device_get_match_data/g' drivers/power/supply/qcom/smb1390-charger-psy.c || true
          
          # Ne asigurăm că senzorii SSC nu blochează build-ul dacă lipsesc headerele ADSP
          sed -i 's/obj-$(CONFIG_SENSORS_SSC).*/obj-y -= sensors_ssc.o/g' drivers/sensors/Makefile || true

      - name: Build Kernel
        run: |
          cd kernel-res
          export PATH=$(pwd)/../toolchain/proton-clang/bin:$PATH
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          MAKE_ARGS="ARCH=arm64 CC=clang HOSTCC=gcc LLVM=1 LLVM_IAS=1"
          
          # Folosim steaguri relaxate pentru a trece de orice incompatibilitate minoră de cod Samsung
          export KCFLAGS="-Wno-error -Wno-implicit-function-declaration -Wno-void-pointer-to-int-cast -Wno-return-type -Wno-unused-variable -Wno-macro-redefined -Wno-frame-larger-than"

          make $MAKE_ARGS r5q_eur_open_defconfig
          
          # Optimizări obligatorii pentru Android 15
          ./scripts/config --disable CONFIG_RKP_KDP
          ./scripts/config --disable CONFIG_DEFEX
          ./scripts/config --enable CONFIG_BPF_SYSCALL
          
          make $MAKE_ARGS olddefconfig
          make -j$(nproc --all) $MAKE_ARGS Image.gz-dtb

      - name: Upload Hybrid Kernel
        uses: actions/upload-artifact@v4
        with:
          name: kernel-r5q-pascua-hybrid
          path: kernel-res/arch/arm64/boot/Image.gz-dtb
