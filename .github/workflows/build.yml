name: S10 Lite (V25 - Path & Wrapper Fix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Cache
        uses: actions/cache@v4
        with:
          path: |
            clang
            out
          key: ${{ runner.os }}-r5q-v25-final
          restore-keys: |
            ${{ runner.os }}-r5q-v25-

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex git libssl-dev libelf-dev clang llvm lld zstd curl python3 device-tree-compiler gcc-aarch64-linux-gnu

      - name: Download Neutron Clang
        run: |
          if [ ! -d "clang/bin" ]; then
            mkdir -p clang
            wget https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
            tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang
          fi

      - name: Fix Source & Wrappers
        run: |
          # 1. Dezactivăm gcc-wrapper.py (Samsung hack) care caută căi greșite
          # Îl facem să returneze direct comanda fără să mai verifice căi hardcodate
          sed -i 's/exec /#exec /g' scripts/gcc-wrapper.py || true
          echo 'exec "$@"' >> scripts/gcc-wrapper.py

          # 2. Fix DTC Lexer (Eroarea yylloc din log-ul tău)
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' scripts/dtc/dtc-lexer.lex.c_shipped || true
          
          # 3. Ștergem secgetspf care dădea "No such file or directory"
          find . -name "Makefile*" -exec sed -i 's/$(shell secgetspf)//g' {} +

          # 4. Mock Headers pentru perflog
          mkdir -p system/core/liblog/include/log
          touch system/core/liblog/include/log/perflog.h

      - name: Build Kernel
        run: |
          # Setăm calea ABSOLUTĂ către Clang
          export CLANG_PATH=$GITHUB_WORKSPACE/clang/bin
          export PATH="$CLANG_PATH:$PATH"
          
          MAKE_ARGS="ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            O=out"

          # Configurare
          make $MAKE_ARGS g770f_defconfig

          # Bypass Stack Protector Check care eșua în log
          ./scripts/config --file out/.config \
            -d CONFIG_CC_STACKPROTECTOR_STRONG \
            -e CONFIG_CC_STACKPROTECTOR_NONE \
            -d CONFIG_CC_WERROR

          make $MAKE_ARGS olddefconfig

          # Compilare cu target explicit pentru a evita /usr/bin/as
          make -j$(nproc --all) $MAKE_ARGS \
            KCFLAGS="--target=aarch64-linux-gnu -fcommon -fno-stack-protector -Wno-error" \
            2>&1 | tee build.log

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-Build-V25
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/dtbo.img
            build.log
