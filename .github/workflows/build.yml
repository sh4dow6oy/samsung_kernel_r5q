name: Build Samsung SM8150 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        repository: LumiPlayground/android_kernel_samsung_sm8150
        ref: auriana
        path: kernel

    - name: Install Build Dependencies & Legacy Libs
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm libncurses-dev
        
        # Descarcă și instalează manual librăriile legacy necesare pentru Clang 10
        wget http://security.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2ubuntu0.1_amd64.deb
        wget http://security.ubuntu.com/ubuntu/pool/universe/n/ncurses/libncurses5_6.3-2ubuntu0.1_amd64.deb
        sudo apt install -y ./libtinfo5_6.3-2ubuntu0.1_amd64.deb ./libncurses5_6.3-2ubuntu0.1_amd64.deb

    - name: Download Me2 Toolchain
      run: |
        git clone https://github.com/mk7x7/Me2.git toolchain
        
        # Setează căile conform structurii Me2
        echo "GCC_64_BIN=$(pwd)/toolchain/toolchain/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin" >> $GITHUB_ENV
        echo "LLVM_BIN=$(pwd)/toolchain/toolchain/llvm-arm-toolchain-ship/10.0/bin" >> $GITHUB_ENV

    - name: Build Kernel
      run: |
        cd kernel
        
        # Exportăm căile pentru compilator
        export PATH="${{ env.LLVM_BIN }}:${{ env.GCC_64_BIN }}:$PATH"
        export ARCH=arm64
        export SUBARCH=arm64
        
        # Definirea mediului de compilare
        export KERNEL_MAKE_ENV="DTC_EXT=$(pwd)/scripts/dtc/dtc \
                                CONFIG_BUILD_ARM64_DT_OVERLAY=y \
                                CONFIG_WLAN_VARIANT=samsung \
                                CC=clang \
                                HOSTCC=clang \
                                CLANG_TRIPLE=aarch64-linux-gnu- \
                                CROSS_COMPILE=${{ env.GCC_64_BIN }}/aarch64-linux-android- \
                                LD=${{ env.LLVM_BIN }}/ld.lld \
                                AR=${{ env.LLVM_BIN }}/llvm-ar \
                                NM=${{ env.LLVM_BIN }}/llvm-nm \
                                OBJCOPY=${{ env.LLVM_BIN }}/llvm-objcopy \
                                OBJDUMP=${{ env.LLVM_BIN }}/llvm-objdump \
                                STRIP=${{ env.LLVM_BIN }}/llvm-strip"

        # 1. Configurare Kernel
        cat arch/arm64/configs/sm8150_sec_defconfig arch/arm64/configs/sm8150_sec_r5q_eur_open.config > arch/arm64/configs/combined_defconfig
        
        # Dezactivăm manual Stack Protector pentru a evita erorile de compiler-check
        echo "CONFIG_CC_STACKPROTECTOR_NONE=y" >> arch/arm64/configs/combined_defconfig
        echo "# CONFIG_CC_STACKPROTECTOR_STRONG is not set" >> arch/arm64/configs/combined_defconfig

        make O=out $KERNEL_MAKE_ENV combined_defconfig
        make O=out $KERNEL_MAKE_ENV olddefconfig

        # 2. Compilare
        # -w dezactivează avertismentele care pot opri build-ul
        make -j$(nproc --all) O=out $KERNEL_MAKE_ENV KCFLAGS="-w"
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-SM8150-r5q
        path: |
          kernel/out/arch/arm64/boot/Image.gz-dtb
          kernel/out/arch/arm64/boot/dtbo.img
          kernel/out/.config
