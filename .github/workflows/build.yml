name: Build sh4dow6oy Kernel - OpenELA 4.14.356 RC1 (DTBO Deep Scan)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Samsung Source
        uses: actions/checkout@v4
        with:
          repository: Roynas-Android-Playground/kernel_samsung_r3q
          ref: master
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev \
          ccache python3 python-is-python3 libarchive-tools wget zstd libtinfo6 zip \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi device-tree-compiler

      - name: Setup Neutron Clang
        run: |
          mkdir -p clang
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang

      - name: Inject OpenELA 4.14.356 RC1
        run: |
          wget -q https://github.com/openela/kernel-lts/archive/refs/tags/v4.14.356-openela-rc1.tar.gz -O openela.tar.gz
          mkdir openela_tmp
          tar -xzf openela.tar.gz -C openela_tmp --strip-components=1
          cp -rf openela_tmp/* .
          rm -rf openela_tmp openela.tar.gz
          
          # Fix Nuclear Symbol
          echo 'void dma_contiguous_early_fixup(void *res_cma) { }' > drivers/base/samsung_stub.c
          echo 'obj-y += samsung_stub.o' >> drivers/base/Makefile
          
          # Fix Common Symbols
          sed -i 's/KBUILD_CFLAGS   += $(call cc-option,-fno-delete-null-pointer-checks,)/KBUILD_CFLAGS   += $(call cc-option,-fno-delete-null-pointer-checks,)\nKBUILD_CFLAGS   += -fno-common/g' Makefile

      - name: Build Kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export KBUILD_BUILD_USER="sh4dow6oy"
          export KBUILD_BUILD_HOST="OpenELA-Build"
          
          # Fix-uri mediu build
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-mllvm -polly[^ ]*//g' {} +
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-mllvm//g' {} +
          [ -f arch/arm64/kernel/vdso/Makefile ] && sed -i 's/-static//g' arch/arm64/kernel/vdso/Makefile
          sed -i 's/ifneq ($(wildcard $(srctree)\/scripts\/gcc-wrapper.py),)/ifeq (0,1)/g' Makefile

          MAKE_ARGS="ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            O=out"

          make $MAKE_ARGS r5q_defconfig
          
          # FORȚĂM CONFIGURAȚIILE DE PRODUCȚIE SAMSUNG
          ./scripts/config --file out/.config \
            --set-str CONFIG_LOCALVERSION "-sh4dow6oy" \
            -e CONFIG_SAMSUNG_PRODUCT_SHIP \
            -e CONFIG_BUILD_ARM64_DTB_IMAGE \
            -e CONFIG_DTC \
            -e CONFIG_OF_OVERLAY \
            -d CONFIG_LTO -d CONFIG_LTO_CLANG -e CONFIG_LTO_NONE \
            -d CONFIG_WERROR
          
          make $MAKE_ARGS olddefconfig

          # Build Kernel + DTBs
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-fno-common -Wno-error -Wno-implicit-function-declaration -Wno-int-conversion"
          make $MAKE_ARGS dtbs

      - name: Manual DTBO & DTB Merger
        run: |
          # [STEP 1] Căutăm utilitarele de împachetare
          MKDTBOIMG=$(find scripts -name "mkdtboimg.py" | head -n 1)
          DTBTOOL=$(find scripts -name "dtbtool" | head -n 1)
          
          # [STEP 2] Scanare totală după fragmente DTBO (overlays)
          # Multe surse Samsung le pun în out/arch/arm64/boot/dts/vendor/qcom/
          ALL_DTBOS=$(find out/arch/arm64/boot/dts -name "*.dtbo")
          
          if [ -n "$ALL_DTBOS" ] && [ -n "$MKDTBOIMG" ]; then
            echo "Am găsit fragmente DTBO. Generăm dtbo.img..."
            python3 $MKDTBOIMG create out/dtbo.img $ALL_DTBOS
          fi

      - name: Package with AnyKernel3
        run: |
          # Identificare imagine
          IMAGE=$(find out/arch/arm64/boot -name "Image.gz-dtb" -o -name "Image.gz" | head -n 1)
          DTBO_FINAL=$(find out -name "dtbo.img" | head -n 1)

          git clone https://github.com/osm0sis/AnyKernel3.git
          rm -rf AnyKernel3/.git

          cp "$IMAGE" AnyKernel3/Image.gz
          
          if [ -f "$DTBO_FINAL" ]; then
            cp "$DTBO_FINAL" AnyKernel3/dtbo.img
            echo "SUCCESS: DTBO integrat în zip."
          else
            echo "WARNING: DTBO.img nu a fost generat automat."
            # Dacă nu avem DTBO separat, încercăm să verificăm dacă există DTB-uri de adăugat
            echo "Verificăm dacă există DTB-uri brute..."
            ALL_DTBS=$(find out/arch/arm64/boot/dts -name "*.dtb" | grep "sm8150" || true)
            if [ -n "$ALL_DTBS" ]; then
               echo "S-au găsit DTB-uri specifice sm8150, dar nu au fost împachetate."
            fi
          fi

          # Config AnyKernel r5q
          sed -i 's/device.name1=maguro/device.name1=r5q/g' AnyKernel3/anykernel.sh
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
          
          cd AnyKernel3
          zip -r9 ../sh4dow6oy-Kernel-R5Q-OpenELA.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sh4dow6oy-Kernel-OpenELA
          path: sh4dow6oy-Kernel-R5Q-OpenELA.zip
