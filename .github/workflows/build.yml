name: Build Roynas R5Q - SM8150 Master Hybrid
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: sh4dow6oy/android_kernel_samsung_sm7150
          ref: sixteen
          path: kernel
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev \
          ccache python3 python-is-python3 libarchive-tools wget zstd zip \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libncurses-dev libtinfo6

      - name: Setup Neutron Clang
        run: |
          mkdir clang
          wget -q https://github.com/Ylarod/setup-ndk-clang/releases/download/prebuilt/clang-linux-x86-ndk-r29-r563880c.tar.zst
          tar -I zstd -xf clang-linux-x86-ndk-r29-r563880c.tar.zst -C clang

      - name: Build Kernel
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export KBUILD_BUILD_USER="Roynas"
          export KBUILD_BUILD_HOST="S10Lite-Hybrid"
          export MAKE_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- O=out"

          # 1. STUBBING (Păstrăm stub-urile pentru a preveni erorile de linker pe simboluri Samsung)
          mkdir -p out
          cat <<EOF > drivers/soc/qcom/stubs.c
          #include <linux/kernel.h>
          #include <linux/types.h>
          void sec_debug_store_bug_string(char *s) {}
          void enable_emergency_dload_mode(void) {}
          void audio_register_wdsp_state_cb(void *p) {}
          void audio_register_mad_mic_state_cb(void *p) {}
          void *get_wsa_sysfs_ptr(void) { return NULL; }
          void pm6150_set_pd_state(void *a, int b) {}
          void pm6150_set_cable(void *a, int b) {}
          void *pm6150_usbpd_create(void *a) { return NULL; }
          void pm6150_usbpd_destroy(void *a) {}
          void ccic_send_dock_intent(int a) {}
          void ccic_send_dock_uevent(int a) {}
          void set_usb_enable_state(int a) {}
          void set_usb_enumeration_state(int a) {}
          void *get_ccic_device(void) { return NULL; }
          void set_msg_header(void *a, int b, int c) {}
          void set_uvdm_header(void *a, int b, int c) {}
          void set_endian(void *a, int b) {}
          void set_uvdmset_count(void *a, int b) {}
          void set_sec_uvdm_header(void *a, int b, int c) {}
          void set_sec_uvdm_tx_header(void *a, int b) {}
          int get_data_size(void *a) { return 0; }
          void set_sec_uvdm_tx_tailer(void *a, int b) {}
          int get_checksum(void *a, int b) { return 0; }
          void set_sec_uvdm_rx_header(void *a, int b) {}
          void manager_notifier_register(void *a, void *b, void *c) {}
          void manager_notifier_unregister(void *a, void *b, void *c) {}
          void manager_hw_param_update(void *a, int b) {}
          void set_factory_force_usb(int a) {}
          void pm6150_ccic_event_work(void *a, int b) {}
          int get_is_usb(void) { return 0; }
          void sec_kn_register_notifier(void *a) {}
          void sec_cmd_set_default_result(void *a) {}
          void sec_cmd_set_cmd_result(void *a, char *b, int c) {}
          void sec_cmd_set_cmd_result_all(void *a, char *b, int c, char *d) {}
          void sec_cmd_exit(void *a) {}
          void sec_cmd_send_event_to_user(void *a, char *b) {}
          void sec_cmd_set_cmd_exit(void *a) {}
          void sec_cmd_init(void *a, void *b, void *c, char *d) {}
          void ois_reset_register(void *a) {}
          const char *scsi_trace_parse_cdb(void *a, void *b, int c) { return ""; }
          EOF
          echo "obj-y += stubs.o" >> drivers/soc/qcom/Makefile

          # 2. CONFIGURARE (Merge stratificat pentru SM8150 pe R5Q)
          ARCH=arm64 ./scripts/kconfig/merge_config.sh -m -O out \
            arch/arm64/configs/defconfig \
            arch/arm64/configs/r5q_defconfig \
            arch/arm64/configs/vendor/sm8150-perf_defconfig \
            arch/arm64/configs/a70q.config \

          ./scripts/config --file out/.config \
            -d CONFIG_SEC_DEBUG -d CONFIG_SEC_ABC \
            -d CONFIG_BLK_DEV_IO_TRACE -d CONFIG_SECURITY_SMACK \
            -d CONFIG_LTO_CLANG -e CONFIG_LTO_NONE \
            -e CONFIG_SECTION_MISMATCH_WARN_ONLY
            
          make $MAKE_ARGS olddefconfig

          # 3. FIX-URI PATCH (Sedi-uri pentru a repara conflictele de cod)
          sed -i 's/blk_trace_bio_get_cgid(q, bio)/(u64)0/g' kernel/trace/blktrace.c || true
          sed -i 's/initcall_sec_debug/initcall_debug/g' init/main.c
          find drivers/muic -name "muic_core.c" -exec sed -i 's/get_afc_mode/muic_get_afc_mode/g' {} +
          find drivers/power/supply/qcom_r1 -name "qg-util.c" -exec sed -i 's/is_input_present/qg_is_input_present/g' {} +
          find techpack/audio -name "wcd-mbhc-adc.c" -exec sed -i 's/mbhc->slow_insertion/0/g' {} +
          sed -i '30i #define SEC_DEBUG_MODEM_SEPARATE_EN 0' drivers/soc/qcom/subsystem_restart.c
          find drivers/battery_v2 -type f -exec sed -i '/now_isApdo\|num_apdo\|has_apdo/s/^/\/\//' {} +
          
          # 4. COMPILARE Image.gz
          KCFLAGS_BASE="-fcommon -w -Wno-error -I$(pwd)/out/usr/include"
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="$KCFLAGS_BASE" Image.gz

      - name: Package Kernel
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          cp kernel/out/arch/arm64/boot/Image.gz AnyKernel3/
          sed -i 's/device.name1=maguro/device.name1=r5q/g' AnyKernel3/anykernel.sh
          cd AnyKernel3 && zip -r9 ../Kernel-R5Q-SM8150-Final.zip *

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-R5Q-Master
          path: Kernel-R5Q-SM8150-Final.zip
