name: R5Q - Android 15 (Andy Base + Roynas DTS - NO FIXES)
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Andy2660 Base (4.14.283)
        uses: actions/checkout@v4
        with:
          repository: Andy2660/android_kernel_samsung_a82xq
          ref: linux-4.14.283
          path: kernel

      - name: Copy Renovation Folder & Config
        run: |
          cd kernel
          # 1. DESCĂRCARE FOLDER RENOVATION (Complet, fără modificări)
          sudo apt-get install -y subversion
          svn export https://github.com/Roynas-Android-Playground/kernel_samsung_r3q/trunk/arch/arm64/boot/dts/samsung/renovation arch/arm64/boot/dts/samsung/renovation

          # 2. IMPORT CONFIG ROYNAS
          curl -s https://raw.githubusercontent.com/Roynas-Android-Playground/kernel_samsung_r3q/master/arch/arm64/configs/r5q_defconfig > arch/arm64/configs/vendor/r5q_stock_defconfig

      - name: Setup Toolchain (NDK Clang)
        run: |
          sudo apt-get update && sudo apt-get install -y bc build-essential flex bison lz4 zstd zip gcc-aarch64-linux-gnu
          mkdir -p clang
          wget -q https://github.com/Ylarod/setup-ndk-clang/releases/download/prebuilt/clang-linux-x86-ndk-r29-r563880c.tar.zst
          tar -I zstd -xf clang-linux-x86-ndk-r29-r563880c.tar.zst -C clang

      - name: Build Kernel
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export MAKE_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- O=out"
          
          # Generăm config-ul stock r5q
          make $MAKE_ARGS r5q_stock_defconfig
          
          # Build fără KCFLAGS="-w" (va opri build-ul la orice warning/eroare stock)
          make -j$(nproc --all) $MAKE_ARGS \
            CONFIG_BPFILTER=n \
            O=out Image.gz-dtb

      - name: Package
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          # Încercăm să copiem rezultatul. Dacă build-ul a eșuat, acest pas va raporta eroare.
          cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/ || echo "Build failed, no image to copy"
          cd AnyKernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          zip -r9 ../Lumi-Kernel-R5Q-v21.zip *

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Lumi-Kernel-v21-Stock
          path: Lumi-Kernel-R5Q-v21.zip
