name: R5Q Android 15 - Final Rawr-BPF Logic

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Base Source
        uses: actions/checkout@v4
        with:
          repository: sh4dow6oy/samsung_kernel_r5q
          ref: master
          fetch-depth: 0

      - name: Sync BPF Logic & Rawr-Defconfig
        run: |
          git config --global user.name "sh4dow6oy"
          git config --global user.email "109531621+sh4dow6oy@users.noreply.github.com"
          
          # 1. Adăugăm sursa BPF (Pascua)
          git remote add bpf_src https://github.com/pascua28/android_kernel_samsung_sm7150.git
          git fetch bpf_src bpf-5.10
          
          # 2. Sync BPF Folders
          git checkout bpf_src/bpf-5.10 -- kernel/bpf/ include/uapi/linux/bpf.h include/linux/bpf.h net/core/filter.c
          
          # 3. Descărcăm Defconfig-ul optimizat pentru BPF din repo-ul LumiPlayground
          wget https://raw.githubusercontent.com/LumiPlayground/android_kernel_samsung_sm8150/rawr-bpf/arch/arm64/configs/r5q_eur_open_defconfig -O arch/arm64/configs/r5q_bpf_defconfig

          # 4. Patch Python syntax pentru Python 3
          sed -i 's/print >> sys.stderr, \(.*\)/print(\1, file=sys.stderr)/g' scripts/gcc-wrapper.py
          sed -i 's/python/python3/g' scripts/gcc-wrapper.py || true

          # 5. Injectare macro BPF obligatoriu
          printf '#ifndef __bpf_md_ptr\n#define __bpf_md_ptr(type, name) \\\n\tunion { \\\n\t\ttype name; \\\n\t\t__u64 name##_64; \\\n\t}\n#endif\n' | cat - include/uapi/linux/bpf.h > temp && mv temp include/uapi/linux/bpf.h

      - name: Setup Neutron Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd bc build-essential gcc-aarch64-linux-gnu libssl-dev libelf-dev python3 python-is-python3
          sudo ln -sf /usr/bin/python3 /usr/bin/python2
          
          mkdir clang-neutron
          wget https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang-neutron

      - name: Build Kernel (REAL_CC Method)
        run: |
          export PATH=$(pwd)/clang-neutron/bin:$PATH
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          # Parametrii Samsung din scriptul tău manual
          KERNEL_LLVM_BIN=$(pwd)/clang-neutron/bin/clang
          CLANG_TRIPLE=aarch64-linux-gnu-
          
          # Fix headere perflog.h
          mkdir -p system/core/liblog/include/log/
          touch system/core/liblog/include/log/perflog.h

          # 1. Folosim noul defconfig descărcat
          make O=out ARCH=arm64 CROSS_COMPILE=$CROSS_COMPILE REAL_CC=$KERNEL_LLVM_BIN CLANG_TRIPLE=$CLANG_TRIPLE r5q_bpf_defconfig
          
          # 2. Acceptăm noile opțiuni automat
          make O=out ARCH=arm64 CROSS_COMPILE=$CROSS_COMPILE REAL_CC=$KERNEL_LLVM_BIN CLANG_TRIPLE=$CLANG_TRIPLE olddefconfig

          # 3. Compilare principală
          make -j$(nproc --all) O=out ARCH=arm64 \
               CROSS_COMPILE=$CROSS_COMPILE \
               REAL_CC=$KERNEL_LLVM_BIN \
               CLANG_TRIPLE=$CLANG_TRIPLE \
               KCFLAGS="-w -Wno-error"

      - name: Package AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/ || cp out/arch/arm64/boot/Image.gz AnyKernel3/
          cd AnyKernel3 && zip -r9 ../R5Q-BPF-A15.zip * -x .git README.md

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-R5Q-Final
          path: R5Q-BPF-A15.zip
