name: Build S10 Lite Kernel (Proton Clang)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: sh4dow6oy/samsung_kernel_r5q
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev \
          ccache python3 python-is-python3 libarchive-tools libncurses-dev wget \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi # Adăugăm GCC-urile lipsă

      - name: Download Proton Clang
        run: |
          git clone https://github.com/kdrag0n/proton-clang.git --depth=1 proton-clang

      - name: Build Kernel
        run: |
          # Adăugăm Proton Clang în PATH
          export PATH=$GITHUB_WORKSPACE/proton-clang/bin:$PATH
          
          # Parametrii critici:
          # Folosim LD=ld.lld pentru kernel, dar forțăm HOSTLDFLAGS gol pentru a folosi linkerul sistemului la utilitarele interne
          MAKE_ARGS="ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            LD=ld.lld \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            O=out"

          # 1. Pregătim eBPF și scoatem Knox direct în comandă (mai sigur)
          make $MAKE_ARGS r5q_eur_open_defconfig
          
          scripts/config --file out/.config \
            -d CONFIG_KNOX_KAP \
            -d CONFIG_SECURITY_SAMSUNG_KNOX \
            -d CONFIG_RKP_KDP \
            -e CONFIG_BPF \
            -e CONFIG_BPF_SYSCALL \
            -e CONFIG_BPF_JIT \
            -e CONFIG_CGROUP_BPF \
            -e CONFIG_NET_CLS_BPF

          # 2. Compilare cu ignorarea warning-urilor (Proton e foarte strict)
          # Am scos HOSTCC=clang și am pus gcc pentru a evita eroarea de libc.so.6
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-Wno-error -fcommon"

      - name: Upload Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-Kernel-A15
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/dtbo.img
