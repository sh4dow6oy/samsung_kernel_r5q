name: S10 Lite - AOSP Clang v29

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup AOSP Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves make python3 lz4 perl
          # Descărcăm AOSP Clang (versiune stabilă pentru 4.14)
          mkdir -p toolchain/aosp-clang
          cd toolchain/aosp-clang
          wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-r450784d.tar.gz
          tar -xf clang-r450784d.tar.gz
          cd ../..
          # Toolchain pentru cross-compilation (binutils)
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 toolchain/gcc64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 toolchain/gcc32

      - name: Core Pascua Backport (eBPF 5.1)
        run: |
          git remote add linux-stable https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git || true
          git fetch linux-stable linux-5.1.y --depth=1
          PATHS=("kernel/bpf/" "include/linux/bpf.h" "include/linux/filter.h" "include/linux/bpf_verifier.h" "include/linux/tnum.h" "include/linux/btf.h" "include/uapi/linux/bpf.h" "include/uapi/linux/btf.h" "include/uapi/linux/bpf_common.h" "include/linux/bpf-cgroup.h")
          for path in "${PATHS[@]}"; do git checkout FETCH_HEAD -- "$path"; done

      - name: Apply Glue Patches (v29)
        run: |
          # Headere redundante pentru a evita eroarea "not found"
          mkdir -p include/linux include/uapi/linux
          printf "#ifndef _BPF_LIRC_H\n#define _BPF_LIRC_H\n#endif" > include/linux/bpf_lirc.h
          printf "#ifndef _BPF_LIRC_H\n#define _BPF_LIRC_H\n#endif" > include/uapi/linux/bpf_lirc.h
          
          # Nuke problematic includes
          sed -i '/bpf_lirc/d' kernel/bpf/syscall.c
          
          # Fix access_ok pentru Samsung (3 args)
          grep -rl "access_ok(" kernel/bpf/ | xargs sed -i 's/access_ok(\([^,]*\), \([^)]*\))/access_ok(VERIFY_READ, \1, \2)/g'

      - name: Build Kernel (AOSP Clang)
        run: |
          # Setăm căile către noul toolchain
          CLANG_PATH=$(pwd)/toolchain/aosp-clang/bin
          GCC64_PATH=$(pwd)/toolchain/gcc64/bin
          GCC32_PATH=$(pwd)/toolchain/gcc32/bin
          export PATH=$CLANG_PATH:$GCC64_PATH:$GCC32_PATH:$PATH
          
          MAKE_ARGS="O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi- LD=ld.lld"
          
          make $MAKE_ARGS r5q_eur_open_defconfig
          
          # Dezactivăm protecțiile Samsung care pot bloca compilarea pe Clang extern
          ./scripts/config --file out/.config --disable CONFIG_KPERFMON
          ./scripts/config --file out/.config --disable CONFIG_DEFEX
          
          make $MAKE_ARGS olddefconfig
          make -j$(nproc --all) $MAKE_ARGS Image.gz-dtb
