name: Samsung SM8150 (r5q) - eBPF Final Fix - V57

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout R5Q Kernel (Target)
      - name: Checkout R5Q Kernel
        uses: actions/checkout@v4
        with:
          repository: mainey/android_kernel_samsung_r5q
          ref: lineage-18.1
          path: kernel
          fetch-depth: 1

      # 2. Checkout SM6150 Kernel (Source)
      - name: Checkout SM6150 Kernel
        uses: actions/checkout@v4
        with:
          repository: crdroidandroid/android_kernel_samsung_sm6150
          ref: refs/heads/15.0
          path: sm6150
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libncurses-dev git zstd python3 gzip dwarves wget

      - name: Download Neutron Clang
        run: |
          mkdir -p neutron
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C neutron/

      - name: Patch & Backport eBPF Structurat - V57
        run: |
          # 1. Copiem structura de bpf (directoare și fișiere .c/.h/.mk)
          mkdir -p $GITHUB_WORKSPACE/kernel/kernel/bpf
          cp -r $GITHUB_WORKSPACE/sm6150/kernel/bpf/* $GITHUB_WORKSPACE/kernel/kernel/bpf/

          # 2. CREĂM MANUAL Kconfig în destinație
          echo "config BPF" > $GITHUB_WORKSPACE/kernel/kernel/bpf/Kconfig
          echo "	bool \"Extended BPF\"" >> $GITHUB_WORKSPACE/kernel/kernel/bpf/Kconfig
          echo "	default y" >> $GITHUB_WORKSPACE/kernel/kernel/bpf/Kconfig

          # 3. Actualizam Include-urile esențiale pentru eBPF
          cp $GITHUB_WORKSPACE/sm6150/include/linux/bpf.h $GITHUB_WORKSPACE/kernel/include/linux/bpf.h
          cp $GITHUB_WORKSPACE/sm6150/include/linux/bpf_types.h $GITHUB_WORKSPACE/kernel/include/linux/bpf_types.h
          cp -r $GITHUB_WORKSPACE/sm6150/include/uapi/linux/bpf.h $GITHUB_WORKSPACE/kernel/include/uapi/linux/bpf.h
          cp -r $GITHUB_WORKSPACE/sm6150/include/uapi/linux/bpf_common.h $GITHUB_WORKSPACE/kernel/include/uapi/linux/bpf_common.h

          # 4. Actualizam Makefile-ul principal pentru a include bpf/
          echo "obj-y += bpf/" >> $GITHUB_WORKSPACE/kernel/kernel/Makefile

          # 5. Asiguram Kconfig-ul (verificam existenta fisierului creat manual)
          if [ -f "$GITHUB_WORKSPACE/kernel/kernel/bpf/Kconfig" ]; then
            if ! grep -q "source \"kernel/bpf/Kconfig\"" $GITHUB_WORKSPACE/kernel/init/Kconfig; then
              echo "source \"kernel/bpf/Kconfig\"" >> $GITHUB_WORKSPACE/kernel/init/Kconfig
            fi
          else
            echo "EROARE CRITICA: kernel/bpf/Kconfig nu a putut fi creat!"
            exit 1
          fi

      - name: Configure R5Q Kernel
        run: |
          cd kernel
          export PATH=$GITHUB_WORKSPACE/neutron/bin:$PATH
          export ARCH=arm64
          mkdir -p out

          make O=out ARCH=arm64 r5q_eur_open_defconfig

          # Activează eBPF, JIT și BTF
          scripts/config --file out/.config -e CONFIG_BPF
          scripts/config --file out/.config -e CONFIG_BPF_SYSCALL
          scripts/config --file out/.config -e CONFIG_BPF_JIT
          scripts/config --file out/.config -e CONFIG_BPF_JIT_ALWAYS_ON
          scripts/config --file out/.config -e CONFIG_CGROUP_BPF
          scripts/config --file out/.config -e CONFIG_DEBUG_INFO_BTF

          make O=out ARCH=arm64 olddefconfig

      - name: Build Kernel
        run: |
          cd kernel
          export PATH=$GITHUB_WORKSPACE/neutron/bin:$PATH
          export ARCH=arm64
          export CC=clang
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export LD=ld.lld
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          make -j$(nproc --all) O=out ARCH=arm64 \
               CC=clang LLVM=1 LLVM_IAS=1 \
               KCFLAGS="-Wno-error -Wno-unused-function -Wno-unused-variable -Wno-int-conversion -Wno-implicit-function-declaration"

      - name: Prepare Artifact
        run: |
          cd kernel
          if [ -f out/arch/arm64/boot/Image ]; then
            gzip -n -c out/arch/arm64/boot/Image > Image.gz
          else
            echo "Build failed!"
            exit 1
          fi

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: r5q-ebpf-V57
          path: kernel/Image.gz
