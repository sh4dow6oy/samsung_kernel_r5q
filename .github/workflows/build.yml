name: Build R5Q - Lumi BPF V30 (Enforced JIT)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout LumiPlayground Kernel
        uses: actions/checkout@v4
        with:
          repository: LumiPlayground/android_kernel_samsung_sm8150
          ref: rawr-bpf
          path: kernel

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev \
          ccache python3 python-is-python3 libarchive-tools wget zstd libtinfo6 zip \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi device-tree-compiler rsync git

      - name: Setup Toolchain (Neutron Clang)
        run: |
          mkdir -p clang
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang

      - name: Verify JIT Source Presence
        run: |
          if [ -f "kernel/arch/arm64/net/bpf_jit_comp.c" ]; then
            echo "SUCCESS: BPF JIT Source found at arch/arm64/net/bpf_jit_comp.c"
          else
            echo "WARNING: BPF JIT Source NOT found! Check branch integrity."
          fi

      - name: Build Kernel
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          MAKE_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- O=out"
          
          make $MAKE_ARGS r5q_eur_open_defconfig
          
          # HARD-ENFORCE BPF & JIT
          ./scripts/config --file out/.config \
            -e CONFIG_BPF \
            -e CONFIG_BPF_SYSCALL \
            -e CONFIG_BPF_JIT \
            -e CONFIG_BPF_JIT_ALWAYS_ON \
            -e CONFIG_HAVE_EBPF_JIT \
            -e CONFIG_NET_CLS_BPF \
            -e CONFIG_NET_ACT_BPF \
            -e CONFIG_CGROUP_BPF \
            -e CONFIG_BPF_EVENTS \
            -d CONFIG_UNMAP_KERNEL_AT_EL0 \
            -d CONFIG_WERROR \
            -e CONFIG_LTO_NONE
            
          make $MAKE_ARGS olddefconfig
          
          # Verificăm config-ul după procesare
          grep "CONFIG_BPF_JIT" out/.config
          
          make -j$(nproc --all) $MAKE_ARGS Image.gz dtbs KCFLAGS="-w -fcommon"

      - name: Assemble AnyKernel3
        run: |
          OUT="kernel/out/arch/arm64/boot"
          IMAGE="$OUT/Image.gz"
          DTB=$(find $OUT/dts -name "*r5q*.dtb" -type f | head -n 1)

          if [ ! -f "$IMAGE" ]; then exit 1; fi

          git clone https://github.com/osm0sis/AnyKernel3.git AK3
          [ -f "$DTB" ] && cat "$IMAGE" "$DTB" > AK3/Image.gz || cp "$IMAGE" AK3/Image.gz

          # Adăugăm și fișierul .config pentru verificare
          cp kernel/out/.config ./build_config.txt

          cd AK3
          sed -i 's/device.name1=maguro/device.name1=r5q/g' anykernel.sh
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          zip -r9 ../S10Lite_V30_JIT_FIX.zip *

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-V30-Final
          path: |
            S10Lite_V30_JIT_FIX.zip
            build_config.txt
