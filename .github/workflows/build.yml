name: Samsung SM8150 (r5q) - Final Push - V16

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: sh4dow6oy/android_kernel_samsung_sm8150-5.4
          path: kernel
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libncurses-dev git zstd python3 gzip

      - name: Download & Extract Neutron Clang
        run: |
          mkdir neutron
          wget https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C neutron/

      - name: Patch Source Code
        run: |
          cd kernel
          sed -i 's/__init //g' drivers/samsung/debug/sec_debug_summary.c 2>/dev/null || true
          sed -i 's/__init //g' include/linux/sec_debug.h 2>/dev/null || true

      - name: Compile Kernel
        run: |
          cd kernel
          export PATH=$GITHUB_WORKSPACE/neutron/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          export AR=llvm-ar
          export LD=ld.lld
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          # 1. Config
          make O=out vendor/r5q_eur_open_defconfig
          
          # 2. Fix Config
          sed -i 's/CONFIG_HARDENED_USERCOPY=y/CONFIG_HARDENED_USERCOPY=n/g' out/.config
          sed -i 's/# CONFIG_SECTION_MISMATCH_WARN_ONLY is not set/CONFIG_SECTION_MISMATCH_WARN_ONLY=y/g' out/.config
          echo "CONFIG_SECTION_MISMATCH_WARN_ONLY=y" >> out/.config
          make O=out ARCH=arm64 olddefconfig

          # 3. Build cu fallback pe single-core în caz de eroare
          # Adăugăm -Wno-frame-address pentru a evita erori de securitate Clang
          make -j$(nproc --all) O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 \
                      KCFLAGS="-Wno-error -w -fcommon -Wno-cast-function-type -Wno-implicit-function-declaration -Wno-pointer-arith -Wno-frame-address" \
                      HOSTCFLAGS="-Wno-error -fcommon" \
                      Image || make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 KCFLAGS="-Wno-error -w" Image

      - name: Gzip and Export
        run: |
          # Verificăm în mai multe locuri unde ar putea fi Image
          IMAGE_PATH=$(find kernel/out -name Image | head -n 1)
          if [ -f "$IMAGE_PATH" ]; then
            gzip -n -c "$IMAGE_PATH" > kernel/out/Image.gz
            echo "Kernel găsit și comprimat!"
          else
            echo "EROARE: Image nu a fost generat. Verifică log-urile de mai sus pentru eroarea de compilare."
            exit 1
          fi

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-r5q-Final-V16
          path: kernel/out/Image.gz
