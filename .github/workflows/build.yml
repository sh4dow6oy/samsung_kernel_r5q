name: S10 Lite Kernel Build - v98

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout S10 Lite Source
        uses: actions/checkout@v4
        with:
          path: s10-lite-src

      - name: Setup Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves make python3 lz4 perl git curl
          git clone --depth=1 https://gitlab.com/clangsantoni/zyc_clang.git toolchain/zyc-clang

      - name: Prepare Base (Lineage 22)
        run: |
          git clone --depth=1 -b lineage-22.0 https://github.com/LineageOS/android_kernel_google_msm-4.14.git kernel-res
          cd kernel-res
          git remote add stable https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux-stable.git
          git fetch stable linux-4.14.y
          git merge FETCH_HEAD --no-edit || echo "Merge handled"

      - name: Inject Samsung Drivers & SDIO Fix
        run: |
          # Injectăm driverele tale
          cp -r s10-lite-src/drivers/soc/samsung kernel-res/drivers/soc/ || true
          cp -r s10-lite-src/drivers/camera kernel-res/drivers/ || true
          cp -r s10-lite-src/drivers/fingerprint kernel-res/drivers/ || true
          cp -r s10-lite-src/drivers/sensors kernel-res/drivers/ || true
          cp -r s10-lite-src/arch/arm64/boot/dts/samsung kernel-res/arch/arm64/boot/dts/ || true
          cp s10-lite-src/arch/arm64/configs/r5q_eur_open_defconfig kernel-res/arch/arm64/configs/

          # --- IMPORT SDIO.C DE LA SM6150 (FIX DEFINITIV) ---
          # Descărcăm varianta curată de la LineageOS
          curl -sSL https://raw.githubusercontent.com/LineageOS/android_kernel_samsung_sm6150/lineage-21.0/drivers/mmc/core/sdio.c > kernel-res/drivers/mmc/core/sdio.c
          echo "SDIO.c has been replaced with LineageOS version."

      - name: Surgical Fixes v98
        run: |
          cd kernel-res
          
          # Fix pentru DM-BOW (rămâne necesar)
          sed -i '15i #undef SECTOR_SIZE' drivers/md/dm-bow.c

          # Fix GPIO Alignment pentru driverele Samsung
          if ! grep -q "void \*gpio_dump;" include/linux/gpio/driver.h; then
            sed -i '/struct gpio_chip {/a \	void *gpio_dump;' include/linux/gpio/driver.h
          fi
          sed -i 's/\&list_gpios_fops/NULL/g' drivers/gpio/gpiolib.c
          sed -i 's/subsys_initcall(gpiolib_debugfs_init);/\/\/subsys_initcall(gpiolib_debugfs_init);/g' drivers/gpio/gpiolib.c

          # Neutralizăm Scheduler-ul vechi (WALT/CoreCtl)
          echo 'int core_ctl_init(void) { return 0; }' > kernel/sched/core_ctl.c
          echo '/* STUB */' > kernel/sched/walt.c

      - name: Build Kernel
        run: |
          cd kernel-res
          export PATH=$(pwd)/../toolchain/zyc-clang/bin:$PATH
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          MAKE_ARGS="ARCH=arm64 CC=clang HOSTCC=gcc LLVM=1 LLVM_IAS=1"
          export KCFLAGS="-Wno-error -Wno-implicit-function-declaration -Wno-unused-label -Wno-return-type -Wno-incompatible-pointer-types"

          make $MAKE_ARGS r5q_eur_open_defconfig
          
          # Configurație PELT (LineageOS 22 standard)
          ./scripts/config --disable CONFIG_SCHED_WALT
          ./scripts/config --disable CONFIG_SCHED_CORE_CTL
          ./scripts/config --enable CONFIG_SCHED_PELT
          
          make $MAKE_ARGS olddefconfig
          make -j$(nproc --all) $MAKE_ARGS Image.gz-dtb

      - name: Upload Kernel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-S10Lite-L22-v98
          path: kernel-res/arch/arm64/boot/Image.gz-dtb
