name: Merge CLO Tag & Build (No KNP)

on:
  workflow_dispatch:

jobs:
  build-r5q:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: sh4dow6oy/kernel_samsung_r5q
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

      - name: Merge CLO Tag
        run: |
          git remote add clo https://git.codelinaro.org/clo/la/kernel/msm-4.14.git
          git fetch clo --tags
          # Încercăm merge-ul tag-ului QSSI13
          git merge LA.UM.9.12.c25-02400-SMxx50.QSSI13c28.0 --no-edit || echo "Conflicte detectate - mergem mai departe cu ce avem"

      - name: Patch Defconfig (Disable KNP/RKP/KSU)
        run: |
          DEFCONFIG="arch/arm64/configs/r5q_defconfig"
          
          # Dezactivăm KNP și alte protecții Samsung care dau erori la compile/boot
          sed -i 's/CONFIG_KNP=y/CONFIG_KNP=n/g' $DEFCONFIG
          sed -i 's/CONFIG_KNP_DEBUG=y/CONFIG_KNP_DEBUG=n/g' $DEFCONFIG
          sed -i 's/CONFIG_SEC_RESTRICT_FORK=y/CONFIG_SEC_RESTRICT_FORK=n/g' $DEFCONFIG
          
          # Opțional: Dacă ai KernelSU integrat și vrei să-l scoți
          sed -i 's/CONFIG_KSU=y/CONFIG_KSU=n/g' $DEFCONFIG
          
          echo "Defconfig patched! KNP is now disabled."

      - name: Setup Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang clang-llvm

      - name: Build Kernel
        run: |
          export PATH=$(pwd)/clang-llvm/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          
          # Creăm folderul de output
          mkdir -p out
          
          # Regenerăm config-ul
          make O=out r5q_defconfig
          
          # Build cu LLVM
          make -j$(nproc --all) O=out \
               CC=clang \
               CLANG_TRIPLE=aarch64-linux-gnu- \
               CROSS_COMPILE=aarch64-linux-gnu- \
               CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
               LLVM=1 LLVM_IAS=1 \
               | tee build_log.txt

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: r5q-kernel-no-knp
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            build_log.txt
