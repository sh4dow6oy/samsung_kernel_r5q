name: Build R5Q - BPF Lineage 23 Backport (v7)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Base (Roynas)
        uses: actions/checkout@v4
        with:
          repository: Roynas-Android-Playground/kernel_samsung_r3q
          ref: master
          path: kernel

      - name: Download BPF Backport (Lineage 23)
        run: |
          # Clonăm branch-ul specific de Android 15
          git clone --depth 1 -b bpf-lineage23 https://github.com/pascua28/android_kernel_samsung_sm7150 backport
          
          # 1. Injectare Cod Sursă (v7)
          rm -rf kernel/kernel/bpf kernel/net/core/filter.c
          cp -r backport/kernel/bpf kernel/kernel/
          cp backport/net/core/filter.c kernel/net/core/filter.c
          
          # 2. Injectare Headere - Esențial pentru eliminarea erorilor anterioare
          cp -r backport/include/linux/bpf* kernel/include/linux/
          cp -r backport/include/linux/btf* kernel/include/linux/
          cp -r backport/include/uapi/linux/bpf* kernel/include/uapi/linux/
          cp -r backport/include/uapi/linux/btf* kernel/include/uapi/linux/

      - name: Fix Compatibility & Dependencies
        run: |
          cd kernel
          # Definim __poll_t global pentru a evita eroarea "requires a specifier"
          # Aceasta este diferența între un kernel 4.14 și 5.x
          sed -i '1s/^/#include <linux\/types.h>\n#ifndef __poll_t\ntypedef unsigned int __poll_t;\n#endif\n/' include/linux/bpf.h
          
          # Reparăm referința la bpf_types.h care adesea lipsește în backport-uri
          # (Acest fișier este generat de obicei, dar îl "dummy-uim" dacă e nevoie)
          [ ! -f include/linux/bpf_types.h ] && touch include/linux/bpf_types.h
          
          # Eliminăm KSU (KernelSU) din config-ul Roynas
          sed -i '/kernelsu\/Kconfig/d' drivers/android/Kconfig
          sed -i '/kernelsu/d' drivers/android/Makefile

      - name: Install Build Essentials
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu bc libssl-dev python3 bison flex

      - name: Setup Neutron Clang
        run: |
          mkdir -p clang
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang

      - name: Build Kernel (r5q)
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          MAKE_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CLANG_TRIPLE=aarch64-linux-gnu- O=out"
          
          make $MAKE_ARGS r5q_defconfig
          
          ./scripts/config --file out/.config \
            -e CONFIG_BPF -e CONFIG_BPF_SYSCALL -e CONFIG_BPF_JIT -e CONFIG_BPF_JIT_ALWAYS_ON \
            -e CONFIG_HAVE_EBPF_JIT -e CONFIG_NET_CLS_BPF -e CONFIG_NET_ACT_BPF \
            -e CONFIG_BPF_EVENTS -e CONFIG_CGROUP_BPF -e CONFIG_BTF \
            -d CONFIG_SAMSUNG_RTIC -d CONFIG_CC_STACKPROTECTOR_STRONG \
            -e CONFIG_CC_STACKPROTECTOR_NONE -d CONFIG_WERROR
            
          make $MAKE_ARGS olddefconfig
          
          # Compilăm. Adăugăm -D__poll_t ca flag de compilare de siguranță
          make -j$(nproc --all) $MAKE_ARGS Image.gz dtbs KCFLAGS="-w -fcommon -D__poll_t=unsigned"

      - name: Assemble Zip
        run: |
          OUT="kernel/out/arch/arm64/boot"
          DTB=$(find $OUT/dts -name "*r5q*.dtb" -type f | head -n 1)
          git clone https://github.com/osm0sis/AnyKernel3.git AK3
          [ -f "$DTB" ] && cat "$OUT/Image.gz" "$DTB" > AK3/Image.gz || cp "$OUT/Image.gz" AK3/Image.gz
          cd AK3 && zip -r9 ../S10Lite_Android15_BPF_V50.zip *

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-R5Q-Android15
          path: S10Lite_Android15_BPF_V50.zip
