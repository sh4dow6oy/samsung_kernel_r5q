name: S10 Lite - Base Swap LOS23 v35

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Samsung Source
        uses: actions/checkout@v4
        with:
          path: samsung-src

      - name: Setup Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves make python3 lz4 perl
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang

      - name: Prepare LineageOS 23 Base
        run: |
          git clone --depth=1 -b lineage-23.0 https://github.com/LineageOS/android_kernel_google_msm-4.14.git kernel-res

      - name: Inject Samsung Components
        run: |
          cp -r samsung-src/drivers/soc/samsung kernel-res/drivers/soc/ || true
          cp -r samsung-src/drivers/camera kernel-res/drivers/ || true
          cp -r samsung-src/drivers/fingerprint kernel-res/drivers/ || true
          cp -r samsung-src/drivers/sensors kernel-res/drivers/ || true
          cp -r samsung-src/arch/arm64/boot/dts/samsung kernel-res/arch/arm64/boot/dts/ || true
          cp samsung-src/arch/arm64/configs/r5q_eur_open_defconfig kernel-res/arch/arm64/configs/

      - name: Advanced Patching (Final MMC & System Alignment)
        run: |
          cd kernel-res
          
          # 1. MMC/SDHCI Deep Alignment
          # Sincronizăm prototipul funcției în header pentru a evita Type Mismatch
          sed -i 's/void sdhci_cmd_irq(struct sdhci_host \*host, u32 intmask, u32 \*intmask_p);/void sdhci_cmd_irq(struct sdhci_host \*host, u32 intmask);/g' drivers/mmc/host/sdhci.h
          
          # Aplicăm fix-urile din v34 din nou (asigurare)
          sed -i 's/sdhci_cmd_irq(host, intmask & SDHCI_INT_CMD_MASK, \&intmask);/sdhci_cmd_irq(host, intmask \& SDHCI_INT_CMD_MASK);/g' drivers/mmc/host/sdhci.c
          sed -i '/\*intmask_p |= data_err_bit;/s/^/\/\//' drivers/mmc/host/sdhci.c
          sed -i '/(unsigned long long)dma/s/^/\/\//' drivers/mmc/host/sdhci.c
          sed -i '/return 0;/i out:' drivers/mmc/core/sdio.c

          # 2. HID & Trace Fix
          sed -i 's|#define TRACE_INCLUDE_PATH .|#define TRACE_INCLUDE_PATH ../../drivers/hid|' drivers/hid/hid-trace.h
          
          # 3. Variadic access_ok & Security Bypass
          UACCESS_FILE="arch/arm64/include/asm/uaccess.h"
          sed -i '/#define access_ok/d' $UACCESS_FILE
          sed -i '/#define __range_ok/i \
          #define _access_ok_2(addr, size)         __range_ok(addr, size) \
          #define _access_ok_3(type, addr, size)   __range_ok(addr, size) \
          #define _access_ok_X(x, y, z, FUNC, ...) FUNC \
          #define access_ok(...) _access_ok_X(__VA_ARGS__, _access_ok_3, _access_ok_2)(__VA_ARGS__)' $UACCESS_FILE

          mkdir -p scripts
          echo -e "#!/bin/bash\necho 0" > scripts/secgetspf
          chmod +x scripts/secgetspf

      - name: Build Kernel
        run: |
          cd kernel-res
          export PATH=$(pwd)/../toolchain/proton-clang/bin:$PATH
          MAKE_ARGS="ARCH=arm64 CC=clang HOSTCC=gcc CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1"
          
          # KCFLAGS optimizate: ignorăm warning-urile care blochează build-ul pe Clang 17+
          export KCFLAGS="-Wno-error -Wno-implicit-function-declaration -Wno-incompatible-pointer-types -Wno-return-type -Wno-macro-redefined -Wno-unused-variable -Wno-shift-count-overflow -Wno-frame-larger-than="

          make $MAKE_ARGS r5q_eur_open_defconfig
          
          ./scripts/config --disable CONFIG_SCHED_WALT
          ./scripts/config --disable CONFIG_SCHED_CORE_CTL
          ./scripts/config --disable CONFIG_RKP_KDP
          ./scripts/config --disable CONFIG_DEFEX
          
          # Force link drivers/soc/samsung
          echo "obj-y += samsung/" >> drivers/soc/Makefile || true
          
          make $MAKE_ARGS olddefconfig
          make -j$(nproc --all) $MAKE_ARGS Image.gz-dtb
