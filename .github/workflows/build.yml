name: S10 Lite Kernel Build - v132 (Fixing BPF Headers)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: mainey/android_kernel_samsung_r5q
          ref: lineage-18.1
          path: kernel-res
          fetch-depth: 1

      - name: Setup Proton Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves make python3 lz4 perl git curl
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang

      - name: Surgical Upstream & Header Fix
        run: |
          cd kernel-res
          # Luam sursa de referinta de la Pascua
          git clone --depth=1 -b upstream-ref https://github.com/pascua28/android_kernel_samsung_sm8250 upstream_src
          
          # 1. SINCRONIZARE COMPLETA BPF (Inclusiv UAPI)
          rm -rf kernel/bpf/*
          cp -rv upstream_src/kernel/bpf/* kernel/bpf/
          cp -v upstream_src/include/linux/bpf* include/linux/
          # ACESTA ESTE PASUL CRITIC: Sincronizam definitiile de interfata
          cp -v upstream_src/include/uapi/linux/bpf* include/uapi/linux/
          
          # 2. FIX __poll_t (Lipseste in 4.14, exista in 4.19+)
          # Injectam definitia in types.h daca nu exista
          grep -q "__poll_t" include/uapi/linux/types.h || echo "typedef unsigned int __poll_t;" >> include/uapi/linux/types.h
          
          # 3. FIX BPF_OBJ_NAME_LEN si restul constantelor
          # Ne asiguram ca header-ul principal de BPF are definitiile de baza
          sed -i 's/#define BPF_OBJ_NAME_LEN 16U/#define BPF_OBJ_NAME_LEN 16/g' include/uapi/linux/bpf.h 2>/dev/null || true

      - name: Architect's Surgical Prep
        run: |
          cd kernel-res
          # Eliminam modulele de debug Samsung care crapa la compilare
          sed -i 's/obj-y += ss_dsi_panel_debug.o/#/g' drivers/gpu/drm/msm/samsung/Makefile
          sed -i 's/obj-$(CONFIG_HID_TRACE)/#/g' drivers/hid/Makefile
          
          # Firmware Stubs
          mkdir -p firmware/tsp_sec
          touch firmware/tsp_sec/y771_r5.bin
          touch firmware/tsp_sec/y771_r5_1l.bin
          
          # Clang Alignments
          echo "#define __builtin_assume_aligned(x, ...) (x)" >> include/linux/compiler-clang.h
          find . -type f -name "cam_vfe_bus_ver3.c" -exec sed -i 's/uint32_t                     i;/uint32_t                     i = 0;/g' {} +

      - name: Hardcode Android 15/16 Compliance
        run: |
          cd kernel-res
          export PATH=$(pwd)/../toolchain/proton-clang/bin:$PATH
          make ARCH=arm64 CC=clang r5q_eur_open_defconfig
          
          # Activam suportul BPF complet
          ./scripts/config --enable CONFIG_BPF_SYSCALL
          ./scripts/config --enable CONFIG_BPF_JIT
          ./scripts/config --enable CONFIG_CGROUP_BPF
          ./scripts/config --enable CONFIG_NETFILTER_XT_MATCH_BPF
          
          # Dezactivam balastul Samsung care intra in conflict cu headerele noi
          ./scripts/config --disable CONFIG_SECURITY_SAMSUNG_RKP
          ./scripts/config --disable CONFIG_TIMA
          
          make ARCH=arm64 CC=clang olddefconfig

      - name: Build Kernel
        run: |
          cd kernel-res
          export PATH=$(pwd)/../toolchain/proton-clang/bin:$PATH
          MAKE_ARGS="ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1"
          
          # Ignoram erorile de tip mismatch ramase intre nuclee
          export KCFLAGS="-O3 -Wno-everything -Wno-error -Wno-implicit-function-declaration -Wno-incompatible-pointer-types -Wno-int-conversion -Wno-implicit-int"

          make -j$(nproc --all) $MAKE_ARGS Image.gz-dtb || make -j$(nproc --all) $MAKE_ARGS Image.gz

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-A15-A16-Fix-v132
          path: |
            kernel-res/arch/arm64/boot/Image.gz-dtb
            kernel-res/arch/arm64/boot/Image.gz
