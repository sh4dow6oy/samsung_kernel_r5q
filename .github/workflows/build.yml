name: S10 Lite - Safe Core eBPF v142

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout S10 Lite Kernel Source
        uses: actions/checkout@v4
        with:
          repository: sh4dow6oy/samsung_kernel_r5q
          path: kernel-res
          fetch-depth: 1

      - name: Setup Proton Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves make python3 lz4
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang

      - name: Patch Core eBPF (Header Fixes)
        run: |
          cd kernel-res

          # 1) Dummy header for bpf_lirc to fix missing include
          mkdir -p include/uapi/linux
          printf "#ifndef _LINUX_BPF_LIRC_H\n#define _LINUX_BPF_LIRC_H\n#endif\n" > include/uapi/linux/bpf_lirc.h

          # 2) Resolve xdp_buff redefinition — guard actual struct
          sed -i '/struct xdp_buff/ { s/struct xdp_buff/struct xdp_buff_bpf/ }' include/linux/filter.h

          # 3) Add missing BTF headers for BPF core
          mkdir -p include/uapi/linux
          printf "#ifndef _UAPI_LINUX_BTF_H\n#define _UAPI_LINUX_BTF_H\n#endif\n" > include/uapi/linux/btf.h

          # 4) Ensure access_ok macro works for BPF (inline compatibility)
          sed -i 's/access_ok(/__kernel_access_ok(/g' kernel/bpf/syscall.c || true

      - name: Configure & Build
        run: |
          cd kernel-res
          export PATH=$(pwd)/../toolchain/proton-clang/bin:$PATH

          # Base config
          make ARCH=arm64 CC=clang r5q_eur_open_defconfig

          # Enable eBPF for Android 15
          ./scripts/config --enable CONFIG_BPF_SYSCALL
          ./scripts/config --enable CONFIG_BPF_JIT
          ./scripts/config --enable CONFIG_CGROUP_BPF

          # Disable Samsung enforcement blockers
          ./scripts/config --disable CONFIG_SECURITY_SAMSUNG_RKP
          ./scripts/config --disable CONFIG_SAMSUNG_PRODUCT_SHIP
          ./scripts/config --disable CONFIG_SEC_DEBUG

          make ARCH=arm64 CC=clang olddefconfig

          export MAKE_ARGS="ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1"
          export KCFLAGS="-O3 -Wno-everything -Wno-error -Wno-implicit-function-declaration -Wno-int-conversion -Wno-incompatible-pointer-types"

          make -j$(nproc --all) $MAKE_ARGS Image.gz-dtb || make -j$(nproc --all) $MAKE_ARGS Image.gz

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-eBPF-Build-v142
          path: |
            kernel-res/arch/arm64/boot/Image.gz-dtb
            kernel-res/arch/arm64/boot/Image.gz
