name: S10 Lite - Hybrid Upstream (Smart Fix)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves libncurses-dev git wget make python2 python3 pahole tar xz-utils lib32z1

      - name: Setup Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang
          echo "PROTON_PATH=$(pwd)/toolchain/proton-clang/bin" >> $GITHUB_ENV

      - name: Hybrid Source Preparation
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_kernel_qcom_sm8150.git kernel_source
          git clone --depth=1 https://github.com/LineageOS/android_kernel_samsung_r5q.git samsung_source
          
          # Injectăm driverele și config-ul
          cp -r samsung_source/techpack kernel_source/ || true
          cp samsung_source/arch/arm64/configs/r5q_eur_open_defconfig kernel_source/arch/arm64/configs/r5q_defconfig
          mkdir -p kernel_source/arch/arm64/boot/dts/vendor/qcom/
          cp -r samsung_source/arch/arm64/boot/dts/vendor/qcom/r5q* kernel_source/arch/arm64/boot/dts/vendor/qcom/ || true

          cd kernel_source

          # === FIX AUDIO (L1SS_AUDIO Error) ===
          # Adăugăm definitia lipsă în header-ul de PCM
          sed -i '20i #define L1SS_AUDIO 0' techpack/audio/asoc/msm-pcm-q6-noirq.c
          
          # Redefinim jack-urile pentru Upstream
          sed -i 's/SND_JACK_MICROPHONE2/SND_JACK_MICROPHONE/g' techpack/audio/asoc/codecs/wcd-mbhc-v2.h
          sed -i 's/SND_JACK_ANC_HEADPHONE/SND_JACK_HEADPHONE/g' techpack/audio/asoc/codecs/wcd-mbhc-v2.c

          # === FIX SMCINVOKE (Redefinition of size_add) ===
          # Comentăm doar funcția problematică fără să stricăm restul fișierului
          sed -i '/static inline size_t size_add/,/}/ s/^/\/\//' drivers/soc/qcom/smcinvoke.c

          # Fix Samsung Tools
          echo -e '#!/bin/bash\necho "0"' > /tmp/secgetspf
          chmod +x /tmp/secgetspf
          sudo mv /tmp/secgetspf /usr/bin/secgetspf

      - name: Build Kernel
        run: |
          export PATH="${{ env.PROTON_PATH }}:$PATH"
          cd kernel_source
          
          MAKE_ARGS="
            O=out \
            ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1
          "
          
          export KCFLAGS="-Wno-error -Wno-implicit-function-declaration -Wno-int-conversion -Wno-incompatible-pointer-types -Wno-strict-prototypes"

          mkdir -p out
          make $MAKE_ARGS r5q_defconfig
          
          # Dezactivăm LTO/BTF pentru stabilitate RAM
          sed -i 's/CONFIG_LTO_CLANG=y/CONFIG_LTO_CLANG=n/g' out/.config
          sed -i 's/CONFIG_LTO=y/CONFIG_LTO=n/g' out/.config
          sed -i 's/CONFIG_DEBUG_INFO_BTF=y/CONFIG_DEBUG_INFO_BTF=n/g' out/.config
          
          make $MAKE_ARGS olddefconfig
          make -j2 $MAKE_ARGS

          if [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image ../
            find out/arch/arm64/boot/dts/ -name "*.dtbo" -exec cp {} ../ \; || true
            echo "SUCCESS=true" >> $GITHUB_ENV
          fi

      - name: Upload
        if: env.SUCCESS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-Upstream-Hybrid
          path: |
            Image
            *.dtbo
