name: Build Lumi R5Q - Ultimate BPF Fixed
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: LumiPlayground/android_kernel_samsung_sm8150
          ref: rawr-bpf
          path: kernel
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev \
          ccache python3 python-is-python3 libarchive-tools wget zstd zip \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libncurses-dev libtinfo6 \
          device-tree-compiler

      - name: Setup Toolchain (Neutron Clang)
        run: |
          mkdir clang
          wget -q https://github.com/Ylarod/setup-ndk-clang/releases/download/prebuilt/clang-linux-x86-ndk-r29-r563880c.tar.zst
          tar -I zstd -xf clang-linux-x86-ndk-r29-r563880c.tar.zst -C clang

      - name: Prepare Source & Fixes
        run: |
          cd kernel
          chmod -R +x tools/
          
          # Fix COMMON symbols pentru a evita erorile de linkare vmlinux
          grep -r "bool main_ext_ss_not_working" . | cut -d: -f1 | xargs sed -i 's/bool main_ext_ss_not_working/static bool main_ext_ss_not_working/g' || true
          
          # Configurare DEFCONFIG R5Q
          # Activam suportul eBPF si Overlay-urile Samsung
          ./scripts/config --file arch/arm64/configs/r5q_eur_open_defconfig \
            -d CONFIG_RTIC \
            -e CONFIG_BPF_SYSCALL \
            -e CONFIG_BUILD_ARM64_DT_OVERLAY \
            -e CONFIG_PROJECT_R5Q \
            -e CONFIG_SEC_R5Q_PROJECT \
            -e CONFIG_SAMSUNG_PRODUCT_SHIP \
            -e CONFIG_LTO_CLANG_NONE \
            -e CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE \
            -e CONFIG_IMG_GZ_DTB

      - name: Build Kernel
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          
          # Variabilele de proiect transmise direct catre Makefile.dtbo
          export MAKE_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang \
            DTC_EXT=$(pwd)/tools/dtc \
            CONFIG_BUILD_ARM64_DT_OVERLAY=y \
            CONFIG_PROJECT_R5Q=y \
            CONFIG_SEC_R5Q_PROJECT=y \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD=ld.lld \
            O=out"

          make $MAKE_ARGS r5q_eur_open_defconfig
          make $MAKE_ARGS olddefconfig
          
          # IMPORTANT: Rulam DOAR 'dtbs'. Scripts/Makefile.dtbo va fi invocat automat.
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-fcommon -w" O=out Image.gz-dtb dtbs

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          
          # 1. Image.gz (Kernel + DTB principal)
          cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/Image.gz
          
          # 2. Colectare DTBO (Metoda Deep Search)
          # Makefile.dtbo le genereaza de obicei in folderul dts/samsung/ sau dts/qcom/
          echo "Colectam DTBO-urile generate de scripts/Makefile.dtbo..."
          find kernel/out/arch/arm64/boot/dts/ -name "*.dtbo" -type f -exec cat {} + > AnyKernel3/dtbo.img
          
          # Fallback daca prima cautare esueaza
          if [ ! -s AnyKernel3/dtbo.img ]; then
            echo "Cautare secundara pentru DTBO..."
            find kernel/out/ -name "*.dtbo" -type f -exec cat {} + > AnyKernel3/dtbo.img
          fi

          # Debug: Dimensiuni finale
          echo "--- REZULTAT BUILD ---"
          ls -lh AnyKernel3/Image.gz
          du -sh AnyKernel3/dtbo.img || echo "EROARE: dtbo.img este gol!"
          echo "----------------------"

          cd AnyKernel3
          sed -i 's/device.name1=maguro/device.name1=r5q/g' anykernel.sh
          sed -i 's/device.name2=panda/device.name2=SM-G770F/g' anykernel.sh
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          zip -r9 ../Lumi-R5Q-Native-BPF-Final.zip *

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Lumi-R5Q-Native-BPF-Final
          path: Lumi-R5Q-Native-BPF-Final.zip
