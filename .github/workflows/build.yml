name: Lumi Kernel R5Q - Roynas Lineage Fusion (No KSU)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: 1. Checkout Roynas Base (R3Q)
        uses: actions/checkout@v4
        with:
          repository: Roynas-Android-Playground/kernel_samsung_r3q
          ref: master
          fetch-depth: 0

      - name: 2. Merge LineageOS 20 (Full Codebase Sync)
        run: |
          git config --global user.email "gh-actions@github.com"
          git config --global user.name "GitHub Actions"
          git remote add lineage https://github.com/LineageOS/android_kernel_qcom_sm8150.git
          git fetch lineage lineage-20
          
          echo "--- Merging LineageOS 20 into Roynas ---"
          # Folosim strategia 'theirs' pentru a prioritiza fix-urile Lineage în codul comun
          git merge lineage/lineage-20 -X theirs -m "Merge LineageOS 20 SM8150" || echo "Merge finished with some conflicts"

      - name: 3. Setup Neutron Clang
        run: |
          sudo apt-get update && sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev wget zstd zip
          mkdir clang && wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang
          mkdir -p bin-force
          ln -sf $(pwd)/clang/bin/clang bin-force/as
          ln -sf $(pwd)/clang/bin/ld.lld bin-force/ld
          echo "$(pwd)/bin-force" >> $GITHUB_PATH

      - name: 4. Professional Code Patching (LineageOS Backport Fix)
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/bin-force:$PATH"
          MAKE_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang AS=clang LD=ld.lld CROSS_COMPILE=aarch64-linux-gnu- O=out"

          echo "--- 1. Nuclear Removal of KernelSU ---"
          find . -type f -name "Kconfig*" -exec sed -i '/[kK][eE][rR][nN][eE][lL][sS][uU]/d' {} +
          find . -type f -name "Makefile*" -exec sed -i '/[kK][eE][rR][nN][eE][lL][sS][uU]/d' {} +
          rm -rf drivers/android/kernelsu && mkdir -p drivers/android/kernelsu
          touch drivers/android/kernelsu/Kconfig drivers/android/kernelsu/Makefile

          echo "--- 2. Injecting Missing Cgroup Headers (Fixing your errors properly) ---"
          # Adăugăm prototipurile funcțiilor lipsă în include/linux/cgroup.h ca să nu mai dea 'implicit declaration'
          # Folosim un bloc de tip 'static inline' ca să păcălim compilatorul dacă funcția nu e definită în .c
          cat >> include/linux/cgroup.h <<EOF

          /* Lumi Kernel Fix: Missing LineageOS Freezer definitions */
          static inline bool cgroup_task_frozen(struct task_struct *task) { return false; }
          static inline bool cgroup_task_freeze(struct task_struct *task) { return false; }
          static inline void cgroup_enter_frozen(void) { }
          static inline void cgroup_leave_frozen(bool b) { }
          static inline void cgroup_update_frozen(struct cgroup *cgrp) { }
          static inline void cgroup_freeze(struct cgroup *cgrp, bool freeze) { }
          static inline void cgroup_freezer_frozen_exit(struct task_struct *task) { }
          static inline void cgroup_freezer_migrate_task(struct task_struct *task, struct cgroup *from, struct cgroup *to) { }
          EOF

          echo "--- 3. Fixing CRC32 & VMSTAT ---"
          sed -i '/ARM64_HAS_CRC32/d' arch/arm64/kernel/cpufeature.c
          sed -i 's/CONFIG_VMSTAT_INTERVAL/1/g' mm/vmstat.c

          echo "--- 4. Generating Config ---"
          if [ -f "arch/arm64/configs/r5q_defconfig" ]; then
              CONF_PATH="r5q_defconfig"
          else
              CONF_PATH="vendor/r5q_defconfig"
          fi
          make $MAKE_ARGS $CONF_PATH

          echo "--- 5. Finalizing Config for A15 ---"
          ./scripts/config --file out/.config \
            -e CONFIG_BPF_SYSCALL -e CONFIG_BPF_JIT -e CONFIG_CGROUP_BPF \
            -e CONFIG_NET_CLS_BPF -e CONFIG_NET_ACT_BPF -e CONFIG_BPF_EVENTS \
            -d CONFIG_KSU -d CONFIG_KERNEL_SU -d CONFIG_CGROUP_FREEZER \
            -d CONFIG_SAMSUNG_PRODUCT_SHIP -e CONFIG_ARM64_CRC32 \
            --set-val CONFIG_VMSTAT_INTERVAL 1 \
            -d CONFIG_CC_STACKPROTECTOR_STRONG -e CONFIG_CC_STACKPROTECTOR_NONE \
            --set-str CONFIG_LOCALVERSION "-Lumi-Lineage-Clean"

          make $MAKE_ARGS olddefconfig
      - name: 5. Final Compilation
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/bin-force:$PATH"
          MAKE_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang AS=clang LD=ld.lld CROSS_COMPILE=aarch64-linux-gnu- O=out"
          
          echo "--- Starting Lineage-Roynas Fusion Build ---"
          make -j$(nproc --all) $MAKE_ARGS Image.gz-dtb

      - name: 6. Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lumi-Kernel-R5Q-A15-Ready
          path: out/arch/arm64/boot/Image.gz-dtb
