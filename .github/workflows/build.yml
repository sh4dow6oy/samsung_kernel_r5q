name: Build Roynas R5Q 4.14.334
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: Roynas-Android-Playground/kernel_samsung_r3q
          ref: master
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev \
          ccache python3 python-is-python3 libarchive-tools wget gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi pahole

      - name: Setup Proton Clang
        run: |
          git clone https://github.com/kdrag0n/proton-clang.git --depth=1 proton-clang

      - name: Build Kernel
        run: |
          P_PATH=$GITHUB_WORKSPACE/proton-clang/bin
          
          MAKE_ARGS="ARCH=arm64 \
            CC=$P_PATH/clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            AR=$P_PATH/llvm-ar \
            NM=$P_PATH/llvm-nm \
            OBJCOPY=$P_PATH/llvm-objcopy \
            OBJDUMP=$P_PATH/llvm-objdump \
            STRIP=$P_PATH/llvm-strip \
            LD=$P_PATH/ld.lld \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            HOSTLDFLAGS=-fuse-ld=bfd \
            O=out"

          # 1. Config
          make $MAKE_ARGS r5q_defconfig

          # 2. Android 15 specific tweaks
          ./scripts/config --file out/.config \
            -d CONFIG_KNOX_KAP \
            -d CONFIG_SECURITY_SAMSUNG_KNOX \
            -d CONFIG_RKP_KDP \
            -d CONFIG_SAMSUNG_PRODUCT_SHIP \
            -e CONFIG_BPF -e CONFIG_BPF_SYSCALL -e CONFIG_BPF_JIT \
            -e CONFIG_CGROUP_BPF -e CONFIG_NET_CLS_BPF -e CONFIG_NET_ACT_BPF \
            -e CONFIG_DEBUG_INFO_BTF

          make $MAKE_ARGS olddefconfig

          # 3. Compile
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-Wno-error -fcommon"

      - name: Upload Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-Roynas-A15
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/dtbo.img
