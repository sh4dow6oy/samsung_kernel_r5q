name: S10 Lite Kernel - OpenELA Hybrid - Fixed

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves libncurses-dev git wget make python2 python3 pahole

      - name: Cache Proton Clang
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: toolchain/proton-clang
          key: ${{ runner.os }}-proton-clang-v1

      - name: Download Proton Clang
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang

      - name: Upstream from OpenELA (Linux 4.14.y)
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          
          git remote add openela https://github.com/openela/kernel-lts.git || true
          git fetch openela linux-4.14.y --depth=1
          
          # Injectăm componentele OpenELA (sunt mult mai stabile decât 4.19 pe hardware S10 Lite)
          git checkout FETCH_HEAD -- kernel/bpf/
          git checkout FETCH_HEAD -- drivers/android/
          git checkout FETCH_HEAD -- include/uapi/linux/bpf.h
          git checkout FETCH_HEAD -- include/uapi/linux/btf.h
          git checkout FETCH_HEAD -- include/linux/bpf.h
          git checkout FETCH_HEAD -- arch/arm64/net/
          
          echo "Upstream via OpenELA finalizat."

      - name: Pre-build Fixes
        run: |
          # 1. Rezolvăm eroarea 'unknown mnemonic typedef' pentru Assembler
          # Introducem __poll_t cu protecție pentru fișierele .S
          sed -i '/#define _UAPI_LINUX_TYPES_H/a \
          #ifndef __poll_t \
          #ifndef __ASSEMBLY__ \
          typedef unsigned int __poll_t; \
          #endif \
          #define __poll_t __poll_t \
          #endif' include/uapi/linux/types.h

          # 2. Fix-uri pentru log-urile Samsung & secgetspf
          mkdir -p system/core/liblog/include/log system/logging/liblog/include/log
          echo -e "#ifndef _PERFLOG_H\n#define _PERFLOG_H\n#endif" > system/core/liblog/include/log/perflog.h
          echo -e "#ifndef _PERFLOG_H\n#define _PERFLOG_H\n#endif" > system/logging/liblog/include/log/perflog.h
          
          # Creăm dummy secgetspf pentru a trece de Makefile-ul Samsung
          sudo sh -c 'echo "#!/bin/bash" > /usr/bin/secgetspf'
          sudo chmod +x /usr/bin/secgetspf

          # 3. Patch pentru btf.h location
          find kernel/bpf/ -name "*.c" | xargs sed -i 's|<uapi/linux/btf.h>|<linux/btf.h>|g' || true
          
          # 4. Setup Python
          [ -f scripts/gcc-wrapper.py ] && mv scripts/gcc-wrapper.py scripts/gcc-wrapper.py.disabled || true
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Build Kernel
        run: |
          export PATH=$(pwd)/toolchain/proton-clang/bin:$PATH
          
          MAKE_ARGS="
            O=out \
            ARCH=arm64 \
            CC=clang \
            HOSTCC=gcc \
