name: Lumi R5Q - Roynas Arch with Lumi Entry.S Restore

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Lumi Base
        uses: actions/checkout@v4
        with:
          repository: LumiPlayground/android_kernel_samsung_sm8150
          ref: rawr-bpf
          path: kernel

      - name: Checkout Roynas Source
        uses: actions/checkout@v4
        with:
          repository: Roynas-Android-Playground/kernel_samsung_r3q
          ref: master
          path: r3q_source

      - name: Surgical Merge & Entry.S Restore
        run: |
          # 1. Backup fișierele critice din Lumi pe care vrem să le păstrăm
          mkdir -p lumi_backup
          cp -r kernel/arch/arm64/net lumi_backup/     # JIT-ul tău BPF
          cp kernel/arch/arm64/kernel/entry.S lumi_backup/  # Codul de entry original
          
          # 2. Swap Hardware & Arch (Drivers, Techpack, Arch/arm64 din Roynas)
          rm -rf kernel/drivers kernel/techpack kernel/arch/arm64
          cp -r r3q_source/drivers kernel/
          cp -r r3q_source/techpack kernel/
          cp -r r3q_source/arch/arm64 kernel/arch/
          
          # 3. RESTAURARE fișiere Lumi în arhitectura nouă
          # Restaurăm JIT-ul BPF
          rm -rf kernel/arch/arm64/net/*
          cp -r lumi_backup/net/* kernel/arch/arm64/net/
          
          # Restaurăm entry.S original (pentru a evita erorile SMCCC/Workaround)
          cp lumi_backup/entry.S kernel/arch/arm64/kernel/entry.S

      - name: Apply Hotfixes
        run: |
          cd kernel
          # Fix UL macro global
          sed -i '/#define _LINUX_CONST_H/a #ifndef UL\n#define UL(x) _AC(x, UL)\n#endif' include/uapi/linux/const.h
          
          # Fix THREAD_SIZE (VLA)
          sed -i 's/unsigned long stack\[THREAD_SIZE\/sizeof(long)\];/unsigned long stack\[0\]; \/* Fixed *\/ /g' include/linux/sched.h || true
          
          # Fix ptep (mm)
          sed -i 's/ptep = huge_pmd_share/pte = huge_pmd_share/g' arch/arm64/mm/hugetlbpage.c || true
          
          # Dezactivare KernelSU
          sed -i '/kernelsu/d' drivers/android/Kconfig || true
          
          # Fix DTC
          find arch/arm64/boot/dts -name "Makefile" -exec sed -i 's/-Werror//g' {} +

      - name: Setup Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev \
          ccache python3 python-is-python3 libarchive-tools wget zstd zip \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi clang
          
          mkdir -p clang
          wget -q https://github.com/Ylarod/setup-ndk-clang/releases/download/prebuilt/clang-linux-x86-ndk-r29-r563880c.tar.zst
          tar -I zstd -xf clang-linux-x86-ndk-r29-r563880c.tar.zst -C clang

      - name: Build Kernel
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export MAKE_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=0 CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD=ld.lld \
            O=out"

          make $MAKE_ARGS r5q_defconfig
          make $MAKE_ARGS olddefconfig
          
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-w -Wno-error -Wno-int-conversion" O=out Image.gz-dtb

      - name: AnyKernel3 Packaging
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          if [ -f kernel/out/arch/arm64/boot/Image.gz-dtb ]; then
            cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/Image.gz-dtb
          else
            echo "EROARE: Compilarea a eșuat!" && exit 1
          fi
          cd AnyKernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          sed -i 's|block=auto;|block=/dev/block/by-name/boot;|g' anykernel.sh
          sed -i 's/kernel.type=inline/kernel.type=gzip-dtb/g' anykernel.sh
          zip -r9 ../Lumi-R5Q-Restore-Final.zip *

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Lumi-Restore-Kernel
          path: Lumi-R5Q-Restore-Final.zip
          
