name: Build Roynas R5Q - V70 Final
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: sh4dow6oy/android_kernel_qcom_sm8150_419
          ref: master
          path: kernel

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev \
          ccache python3 python-is-python3 libarchive-tools wget zstd libtinfo6 zip

      - name: Setup Neutron Clang
        run: |
          mkdir clang
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang

      - name: Build Kernel
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          
          # 1. ELIMINĂM bit_count redefinit (Fix pentru eroarea anterioară fără a strica link-ul)
          # În loc de sed global, dezactivăm avertismentul la nivel de compilator
          
          # 2. FIX HARDCODE WERROR (Samsung are prostul obicei să pună -Werror în Makefile-uri secundare)
          find . -name Makefile -exec sed -i 's/-Werror//g' {} +

          # 3. CLEANUP FLAGS
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-mllvm -polly[^ ]*//g' {} +

          MAKE_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- O=out"

          # 4. CONFIG
          make $MAKE_ARGS r5q_defconfig
          ./scripts/config --file out/.config \
            -d CONFIG_LTO -d CONFIG_LTO_CLANG -e CONFIG_LTO_NONE \
            -e CONFIG_SEC_R5Q_PROJECT \
            -e CONFIG_BPF_JIT -e CONFIG_BPF_JIT_ALWAYS_ON \
            -e CONFIG_BUILD_ARM64_DT_OVERLAY \
            -d CONFIG_SAMSUNG_RTIC \
            -d CONFIG_WERROR
          
          make $MAKE_ARGS olddefconfig
          
          # 5. COMPILARE (Folosim flag-uri de ignorare totală a conflictelor de tipuri)
          # -Wno-everything e brutal, dar pe Ubuntu 24.04 cu Clang modern e singura cale pentru kernel 4.19
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-fcommon -fno-builtin -w -Wno-error -Wno-implicit-function-declaration"

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git AK3
          find kernel/out/arch/arm64/boot -name "Image.gz*" -exec cp {} AK3/Image.gz \;
          # Luăm DTB-ul corect
          find kernel/out/arch/arm64/boot/dts -name "*.dtb" -exec cp {} AK3/dtb \;
          # DTBO-ul generat
          [ -f kernel/out/arch/arm64/boot/dtbo.img ] && cp kernel/out/arch/arm64/boot/dtbo.img AK3/dtbo.img
          
          cd AK3
          sed -i 's/device.name1=maguro/device.name1=r5q/g' anykernel.sh
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          zip -r9 ../Kernel-S10Lite-R5Q-V70.zip *

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-S10Lite-V70
          path: Kernel-S10Lite-R5Q-V70.zip
