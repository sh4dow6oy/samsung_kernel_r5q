name: S10 Lite Kernel Build - v104 (sm8150-common)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          path: s10-lite-src

      - name: Setup Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves make python3 lz4 perl git curl
          git clone --depth=1 https://gitlab.com/clangsantoni/zyc_clang.git toolchain/zyc-clang

      - name: Prepare Base (Lineage 22)
        run: |
          git clone --depth=1 -b lineage-22.0 https://github.com/LineageOS/android_kernel_google_msm-4.14.git kernel-res
          cd kernel-res
          git remote add stable https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux-stable.git
          git fetch stable linux-4.14.y
          git merge FETCH_HEAD --no-edit || echo "Merge handled"

      - name: Driver Injection & sm8150 Fixes
        run: |
          # Injectăm driverele Samsung S10 Lite
          cp -r s10-lite-src/drivers/soc/samsung kernel-res/drivers/soc/ || true
          cp -r s10-lite-src/drivers/camera kernel-res/drivers/ || true
          cp -r s10-lite-src/drivers/fingerprint kernel-res/drivers/ || true
          cp -r s10-lite-src/drivers/sensors kernel-res/drivers/ || true
          cp -r s10-lite-src/arch/arm64/boot/dts/samsung kernel-res/arch/arm64/boot/dts/ || true
          cp s10-lite-src/arch/arm64/configs/r5q_eur_open_defconfig kernel-res/arch/arm64/configs/
          
          # FIX SDIO: Folosim varianta brută (raw) corectă
          curl -sSL "https://raw.githubusercontent.com/LineageOS/android_kernel_samsung_sm6150/lineage-21.0/drivers/mmc/core/sdio.c" -o kernel-res/drivers/mmc/core/sdio.c

      - name: Surgical Fixes v104 (sm8150 alignment)
        run: |
          cd kernel-res
          
          # 1. FIX SDHCI (Erorile anterioare de intmask_p și dma)
          # Folosim o abordare mai sigură: definim variabilele dacă lipsesc
          sed -i '/sdhci_cmd_irq(struct sdhci_host \*host, u32 intmask)/{N;s/intmask)/intmask, u32 *unused)/}' drivers/mmc/host/sdhci.c
          sed -i 's/sdhci_cmd_irq(host, intmask & SDHCI_INT_CMD_MASK, &intmask);/sdhci_cmd_irq(host, intmask \& SDHCI_INT_CMD_MASK, \&intmask);/g' drivers/mmc/host/sdhci.c
          
          # Fix dma undeclared: adăugăm un pointer dummy pentru a satisface log-urile
          sed -i '/sdhci_adma_show_error(struct sdhci_host \*host)/a \	dma_addr_t dma = 0;' drivers/mmc/host/sdhci.c

          # 2. HID TRACE & LABELS (Inspirat din sm8150-common patches)
          find drivers/hid -name "*.h" -exec sed -i 's|#define TRACE_INCLUDE_PATH .|#define TRACE_INCLUDE_PATH ../../drivers/hid|g' {} +
          find drivers/mmc/core/ -name "*.c" -exec sed -i 's/out:$/out: ;/g' {} +

          # 3. Audio/Haptics sm8150 specific
          # Samsung folosește un sistem de feedback haptic care deseori dă conflicte în kernel-ul Google
          sed -i 's/EXPORT_SYMBOL_GPL(input_event);/EXPORT_SYMBOL(input_event);/g' drivers/input/input.c

      - name: Build Kernel
        run: |
          cd kernel-res
          export PATH=$(pwd)/../toolchain/zyc-clang/bin:$PATH
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          MAKE_ARGS="ARCH=arm64 CC=clang HOSTCC=gcc LLVM=1 LLVM_IAS=1"
          export KCFLAGS="-Wno-error -Wno-implicit-function-declaration -Wno-unused-label -Wno-return-type -Wno-incompatible-pointer-types -Idrivers/hid"

          make $MAKE_ARGS r5q_eur_open_defconfig
          
          # Forțăm configurația corectă pentru SM8150 common
          ./scripts/config --enable CONFIG_MMC_SDHCI_MSM
          ./scripts/config --disable CONFIG_MMC_SDHCI_S3C
          ./scripts/config --enable CONFIG_EROFS_FS
          ./scripts/config --disable CONFIG_SCHED_WALT
          ./scripts/config --enable CONFIG_SCHED_PELT
          
          make $MAKE_ARGS olddefconfig
          make -j$(nproc --all) $MAKE_ARGS Image.gz-dtb

      - name: Upload Kernel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-S10Lite-v104-Common8150
          path: kernel-res/arch/arm64/boot/Image.gz-dtb
