name: Build R5Q - Lumi BPF V42 (Kernel 5.4 Final Fix)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: sh4dow6oy/android_kernel_samsung_sm8150-5.4
          ref: master
          path: kernel

      - name: Install Build Essentials
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
          bc libssl-dev flex bison libelf-dev pahole zstd python3 llvm

      - name: Setup Neutron Clang
        run: |
          mkdir -p clang
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang

      - name: Build Kernel
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          
          MAKE_ARGS="ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            O=out"

          mkdir -p out

          # 1. Aplicăm baza și fuzionăm fragmentul EUR
          make $MAKE_ARGS vendor/r5q_eur_open_defconfig
          ./scripts/kconfig/merge_config.sh -O out out/.config arch/arm64/configs/vendor/sm8150_sec_r5q_eur_open.config

          # 2. Curățăm Security (Knox/RKP/DEFEX) pentru suport BPF
          ./scripts/config --file out/.config \
            -d CONFIG_SAMSUNG_RTIC -d CONFIG_SAMSUNG_RTIC_AMP \
            -d CONFIG_SECURITY_DEFEX -d CONFIG_SECURITY_RKP \
            -d CONFIG_SAMSUNG_PRODUCT_SHIP \
            -d CONFIG_WERROR

          make $MAKE_ARGS olddefconfig

          # 3. COMPILARE: Ne concentrăm pe Image.gz pentru a evita erorile de DTB (slim_aud)
          # Dacă DTB-ul eșuează, scriptul continuă oricum.
          make -j$(nproc --all) $MAKE_ARGS Image.gz \
            KCFLAGS="-w -fcommon" \
            LDFLAGS="--no-rosegment --strip-debug" || exit 1

      - name: Assemble AnyKernel3
        run: |
          IMAGE="kernel/out/arch/arm64/boot/Image.gz"
          
          git clone https://github.com/osm0sis/AnyKernel3.git AK3
          cp "$IMAGE" AK3/
          
          cd AK3
          # Configurare AnyKernel3 pentru r5q (S10 Lite)
          # Deoarece nu punem DTB, AnyKernel3 va face "kernel-only" flash
          sed -i 's/device.name1=maguro/device.name1=r5q/g' anykernel.sh
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          
          # Instruim AnyKernel3 să păstreze DTB-ul original al telefonului
          sed -i 's/block=\/dev\/block\/platform\/omap\/omap_hsmmc.0\/by-name\/boot;/block=auto;/g' anykernel.sh
          
          zip -r9 ../S10Lite_5.4_BPF_Final.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-Kernel
          path: S10Lite_5.4_BPF_Final.zip
