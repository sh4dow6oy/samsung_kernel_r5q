name: R5Q Professional Upstream
on:
  workflow_dispatch:

jobs:
  upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: sh4dow6oy/samsung_kernel_r5q
          fetch-depth: 0

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev \
          ccache python3 python-is-python3 libarchive-tools wget gcc-aarch64-linux-gnu

      - name: Setup Proton Clang
        run: |
          git clone https://github.com/kdrag0n/proton-clang.git --depth=1 proton-clang

      - name: 🚀 Upstream Merge (The Stable Way)
        run: |
          git config --global user.email "bot@github.com"
          git config --global user.name "KernelBot"
          
          git remote add stable https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux-stable.git
          git fetch stable linux-4.14.y
          
          # Încercăm un merge limitat la core-ul kernelului pentru a evita conflicte în drivere
          # Documentația recomandă rezolvarea manuală, dar aici forțăm 'ours' pe conflicte 
          # pentru a nu rupe driverele Samsung.
          git merge stable/linux-4.14.y --no-edit -s recursive -X ours || echo "Conflicte gestionate prin păstrarea codului Samsung"

      - name: 🚀 Build with Upstream Base
        run: |
          P_PATH=$GITHUB_WORKSPACE/proton-clang/bin
          MAKE_ARGS="ARCH=arm64 \
            CC=$P_PATH/clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            AR=$P_PATH/llvm-ar \
            NM=$P_PATH/llvm-nm \
            OBJCOPY=$P_PATH/llvm-objcopy \
            OBJDUMP=$P_PATH/llvm-objdump \
            STRIP=$P_PATH/llvm-strip \
            LD=$P_PATH/ld.lld \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            HOSTLDFLAGS=-fuse-ld=bfd \
            O=out"

          # Configurare
          make $MAKE_ARGS r5q_eur_open_defconfig
          
          # Aplicăm Tips & Tricks: Dezactivăm Knox care dă conflicte cu upstream-ul în 4.14.300+
          ./scripts/config --file out/.config \
            -d CONFIG_KNOX_KAP \
            -d CONFIG_SECURITY_SAMSUNG_KNOX \
            -d CONFIG_RKP_KDP \
            -d CONFIG_SAMSUNG_PRODUCT_SHIP \
            -d CONFIG_SECURITY_DEFEX

          make $MAKE_ARGS olddefconfig

          # Compilare cu flag-uri de compatibilitate pentru noul cod upstream
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-Wno-error -fcommon"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-Upstream-4.14.356
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/dtbo.img
