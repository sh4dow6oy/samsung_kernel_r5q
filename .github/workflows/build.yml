name: Samsung SM8150 (r5q) Kernel Build - V10

on:
  workflow_dispatch:

jobs:
  build_kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: sh4dow6oy/android_kernel_samsung_sm8150-5.4
          path: kernel
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libncurses-dev git zstd python3

      - name: Download & Extract Neutron Clang
        run: |
          mkdir neutron
          wget https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C neutron/

      - name: Patch Source Code (Fix Section Mismatch)
        run: |
          cd kernel
          # Eliminăm marcajele __init care cauzează eroarea fatală în sec_debug
          # Acesta este fix-ul specific pentru erorile din log-ul tău
          sed -i 's/__init //g' drivers/samsung/debug/sec_debug_summary.c 2>/dev/null || true
          sed -i 's/__init //g' include/linux/sec_debug.h 2>/dev/null || true
          
          # Fix pentru pointer arithmetic (văzut în build-urile anterioare)
          sed -i 's/(void \*)ptr + offset/(char \*)ptr + offset/g' drivers/soc/qcom/icnss.c 2>/dev/null || true

      - name: Compile Kernel
        run: |
          cd kernel
          export PATH=$GITHUB_WORKSPACE/neutron/bin:$PATH
          
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          export AR=llvm-ar
          export LD=ld.lld
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          # 1. Config
          make O=out vendor/r5q_eur_open_defconfig

          # 2. Fix Config (Hardened Usercopy + Forced Warning Only)
          sed -i 's/CONFIG_HARDENED_USERCOPY=y/CONFIG_HARDENED_USERCOPY=n/g' out/.config
          sed -i 's/# CONFIG_SECTION_MISMATCH_WARN_ONLY is not set/CONFIG_SECTION_MISMATCH_WARN_ONLY=y/g' out/.config
          echo "CONFIG_SECTION_MISMATCH_WARN_ONLY=y" >> out/.config
          
          make O=out ARCH=arm64 olddefconfig

          # 3. Build Kernel
          make -j$(nproc --all) O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 \
                      KCFLAGS="-Wno-error -w -fcommon -Wno-cast-function-type -Wno-implicit-function-declaration -Wno-pointer-arith" \
                      HOSTCFLAGS="-Wno-error -fcommon" \
                      HOSTCXXFLAGS="-Wno-error" \
                      Image.gz dtbs

      - name: Create Image.gz-dtb
        run: |
          cd kernel/out/arch/arm64/boot/
          DTBS=$(find dts/vendor/qcom/ -name "*.dtb" 2>/dev/null)
          if [ -f Image.gz ] && [ ! -z "$DTBS" ]; then
            cat Image.gz $DTBS > Image.gz-dtb
            echo "Succes! Image.gz-dtb creat."
          else
            echo "Eroare: Componente lipsă."
            exit 1
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-r5q-Final-V10
          path: |
            kernel/out/arch/arm64/boot/Image.gz-dtb
            kernel/out/arch/arm64/boot/dts/vendor/qcom/*.dtbo
