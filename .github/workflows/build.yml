name: S10 Lite - Stock Build (Clang 7.0 AOSP)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves libncurses-dev git wget make python2 python3 pahole tar xz-utils lib32z1

      - name: Setup AOSP Clang 7.0 & GCC 4.9
        run: |
          mkdir -p toolchain/clang toolchain/gcc
          
          # Descarcam Clang 7.0 (echivalent 4639204) de pe o sursa stabila pentru Linux
          wget -L https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-4639204.tar.gz -O clang.tar.gz
          tar -xf clang.tar.gz -C toolchain/clang
          
          # Descarcam GCC 4.9 pentru binutils (esențial pentru Clang vechi)
          wget -L https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/heads/master.tar.gz -O gcc.tar.gz
          tar -xf gcc.tar.gz -C toolchain/gcc
          
          echo "CLANG_BIN=$(pwd)/toolchain/clang/bin" >> $GITHUB_ENV
          echo "GCC_BIN=$(pwd)/toolchain/gcc/bin" >> $GITHUB_ENV

      - name: Essential Samsung Fixes
        run: |
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          mkdir -p system/core/liblog/include/log
          echo -e "#ifndef _PERFLOG_H\n#define _PERFLOG_H\n#endif" > system/core/liblog/include/log/perflog.h
          
          # Scoatem Werror pentru a evita blocajele in Techpack
          find . -name "Makefile" -o -name "Kbuild" | xargs sed -i 's/-Werror//g' || true
          
          # Fix poll_t pentru Clang
          sed -i '/#define _UAPI_LINUX_TYPES_H/a #ifndef __poll_t\n#ifndef __ASSEMBLY__\ntypedef unsigned int __poll_t;\n#endif\n#define __poll_t __poll_t\n#endif' include/uapi/linux/types.h

      - name: Build Kernel
        run: |
          export PATH="${{ env.CLANG_BIN }}:${{ env.GCC_BIN }}:$PATH"
          
          # Argumente specifice pentru Clang 7.0
          MAKE_ARGS="
            O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
          "

          rm -rf out && mkdir -p out
          
          # 1. Configurare defconfig
          make $MAKE_ARGS r5q_eur_open_defconfig
          
          # 2. Bypass Stack Protector (necesar pentru combinatia Clang 7 / 4.14)
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/CONFIG_CC_STACKPROTECTOR_NONE=y/g' out/.config
          make $MAKE_ARGS olddefconfig
          
          # 3. Pregatire headere
          make $MAKE_ARGS prepare scripts -j$(nproc --all)
          
          # 4. Compilare finala
          make -j$(nproc --all) $MAKE_ARGS || make -j1 $MAKE_ARGS

          if [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image .
            [ -f out/arch/arm64/boot/dtbo.img ] && cp out/arch/arm64/boot/dtbo.img .
            echo "SUCCESS=true" >> $GITHUB_ENV
          fi

      - name: Upload
        if: env.SUCCESS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-Stock-Clang463
          path: |
            Image
            dtbo.img
