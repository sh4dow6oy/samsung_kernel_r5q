- name: Build Kernel
        run: |
          Z_PATH=$GITHUB_WORKSPACE/zyc-clang/bin
          export PATH="$Z_PATH:$PATH"
          
          # FIX: Eliminăm orice flag Polly specific care cauzează erori
          # Ștergem varianta cu loopfusion-greedy și varianta cu opt-fusion
          find . -name "Makefile*" -o -name "*.mk" | xargs sed -i 's/-polly-loopfusion-greedy=1//g'
          find . -name "Makefile*" -o -name "*.mk" | xargs sed -i 's/--polly-opt-fusion=1//g'
          find . -name "Makefile*" -o -name "*.mk" | xargs sed -i 's/-mllvm -polly//g' 
          
          # Reactivăm Polly curat (opțional, dar mai sigur fără flag-uri experimentale dacă dă erori)
          # Dacă vrei să fii 100% sigur că trece, lasă-l să folosească optimizările standard O3
          
          # Fix Kconfig
          sed -i '/kernelsu/d' drivers/android/Kconfig

          MAKE_ARGS="ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            O=out"

          # 1. Config
          make $MAKE_ARGS r5q_defconfig

          # 2. Patch .config
          ./scripts/config --file out/.config \
            -d CONFIG_KNOX_KAP \
            -d CONFIG_SECURITY_SAMSUNG_KNOX \
            -d CONFIG_RKP_KDP \
            -d CONFIG_SAMSUNG_PRODUCT_SHIP \
            -d CONFIG_SECURITY_DEFEX \
            -d CONFIG_CC_STACKPROTECTOR_STRONG \
            -e CONFIG_CC_STACKPROTECTOR_NONE \
            -e CONFIG_BPF -e CONFIG_BPF_SYSCALL -e CONFIG_BPF_JIT \
            -e CONFIG_CGROUP_BPF -e CONFIG_NET_CLS_BPF -e CONFIG_NET_ACT_BPF

          make $MAKE_ARGS olddefconfig

          # 3. Compilare
          clang --version
          # Adăugăm flag-ul de ignorare a erorilor de optimizare dacă mai apar în KCFLAGS
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-Wno-error -fcommon -Wno-unused-command-line-argument"
