name: Build Lumi R5Q - Only Image.gz
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel
        uses: actions/checkout@v4
        with:
          repository: Roynas-Android-Playground/kernel_samsung_r3q
          ref: master
          path: kernel
          fetch-depth: 1

      - name: Clone Erstrom ath Tree
        run: |
          git clone --depth=1 https://github.com/erstrom/linux-ath.git ath-tree
          cd ath-tree
          git checkout v5.2-ath10k-sdio-v2 || git checkout v5.2-ath10k-sdio

      - name: Nuclear Cleanup & Init Sixteen Integration
        run: |
          # Backup la init_task.c original
          cp kernel/init/init_task.c kernel/init_task.c.bak
          
          # Integrăm folderul INIT de la pascua28
          git clone --depth=1 -b sixteen https://github.com/pascua28/android_kernel_samsung_sm7150 pascua_tree
          rm -rf kernel/init
          cp -r pascua_tree/init kernel/
          cp pascua_tree/scripts/gen_initramfs_list.sh kernel/scripts/
          
          # Restaurare init_task.c
          cp kernel/init_task.c.bak kernel/init/init_task.c
          
          # Fix-uri chirurgicale main.c
          cd kernel/init
          sed -i '/_memsize_reserved_name/d' main.c
          sed -i '/set_memsize_kernel_type/d' main.c
          sed -i '/trace_initcall_/d' main.c
          sed -i '/pid_idr_init()/d' main.c
          sed -i '/trace\/events\/initcall.h/d' main.c
          sed -i '40i typedef int (*initcall_t)(void);' main.c
          sed -i '41i typedef initcall_t initcall_entry_t;' main.c
          sed -i 's/initcall_sec_debug/initcall_debug/g' main.c
          sed -i 's/initcall_from_entry(fn)/fn/g' main.c
          
          # Fix Kconfig BPF
          sed -i '/kernel\/bpf\/preload\/Kconfig/d' Kconfig
          
          # Cleanup global
          cd ../..
          sed -i '/kernelsu/d' kernel/drivers/android/Kconfig
          
          # --- FIX VDSO & LTO ---
          cd kernel
          # Eliminăm flag-ul -static care blochează linker-ul LLVM
          if [ -f arch/arm64/kernel/vdso/Makefile ]; then
            sed -i 's/-static//g' arch/arm64/kernel/vdso/Makefile
            sed -i 's/$(LDFLAGS)/$(filter-out -static,$(LDFLAGS))/g' arch/arm64/kernel/vdso/Makefile
          fi
          
          # Eliminăm Polly care dă erori de optimizare
          find . -type f \( -name "Makefile*" -o -name "*.mk" -o -name "*.include" \) -exec sed -i 's/-mllvm -polly[^ ]*//g' {} +
          
          # Force Permissive
          sed -i 's/selinux_enforcing_boot = 1/selinux_enforcing_boot = 0/g' security/selinux/hooks.c || true

      - name: Setup Neutron Clang
        run: |
          mkdir clang
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang

      - name: Build Only Image.gz-dtb
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          
          MAKE_ARGS="ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            HOSTCC=clang \
            HOSTCXX=clang++ \
            HOSTLD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            O=out"
          
          mkdir -p out
          make $MAKE_ARGS r5q_defconfig
          
          # Injectăm setările anti-bootloop (Fixed Syntax)
          printf "CONFIG_RKP_KDP=n\nCONFIG_KNOX_KAP=n\nCONFIG_SAMSUNG_PRODUCT_SHIP=y\nCONFIG_ANDROID_SAR_RAMDISK=y\nCONFIG_BLK_DEV_INITRD=y\nCONFIG_EROFS_FS=y\nCONFIG_EROFS_FS_ZIP=y\nCONFIG_DM_VERITY=n\nCONFIG_SEC_ABC=n\nCONFIG_CMDLINE=\"androidboot.selinux=permissive androidboot.veritymode=logging\"\nCONFIG_CMDLINE_EXTEND=y\n" >> out/.config
          
          make $MAKE_ARGS olddefconfig
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-fcommon -Wno-error -w" O=out Image.gz-dtb

      - name: Upload Image.gz-dtb
        uses: actions/upload-artifact@v4
        with:
          name: Image-Lumi-R5Q
          path: kernel/out/arch/arm64/boot/Image.gz-dtb
