name: R5Q LumiBPF - V37 Final Android 15

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Kernel (rawr-bpf)
        uses: actions/checkout@v4
        with:
          repository: sh4dow6oy/android_kernel_samsung_sm8150
          ref: rawr-bpf
          path: kernel

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev \
          ccache python3 python-is-python3 libarchive-tools wget zstd libtinfo6 zip \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi device-tree-compiler rsync git

      - name: Setup Toolchain (Neutron Clang)
        run: |
          mkdir -p clang
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang

      - name: Build Kernel & Fix DTBO Path
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          MAKE_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- O=out"
          
          # 1. INJECȚIE SUBDIR: Forțăm intrarea în folderul renovation
          echo "Injecție subdirector hardware..."
          grep -q "renovation" arch/arm64/boot/dts/samsung/Makefile || echo "subdir-y += renovation" >> arch/arm64/boot/dts/samsung/Makefile

          # 2. Configurare
          make $MAKE_ARGS r5q_eur_open_defconfig
          
          # 3. Optimizări Android 15 (eBPF JIT & Security)
          ./scripts/config --file out/.config \
            -e CONFIG_SEC_R5Q_PROJECT \
            -e CONFIG_BPF_JIT \
            -e CONFIG_BPF_JIT_ALWAYS_ON \
            -e CONFIG_HAVE_EBPF_JIT \
            -e CONFIG_NET_CLS_BPF \
            -e CONFIG_BUILD_ARM64_DT_OVERLAY \
            -d CONFIG_SAMSUNG_RTIC \
            -d CONFIG_WERROR
            
          make $MAKE_ARGS olddefconfig
          
          # 4. Compilare Image.gz și DTBS (Overlay-uri)
          make -j$(nproc --all) $MAKE_ARGS Image.gz dtbs KCFLAGS="-w -fcommon"

      - name: Assemble AnyKernel3
        run: |
          BUILD_OUT="kernel/out/arch/arm64/boot"
          AK3_DIR="AK3"
          git clone https://github.com/osm0sis/AnyKernel3.git $AK3_DIR
          
          # Kernel principal
          cp $BUILD_OUT/Image.gz $AK3_DIR/
          
          # Extracție DTB pentru Header V2 (esențial pentru bootloader Samsung)
          DTB=$(find kernel/out/arch/arm64/boot/dts -name "sm8150-v2.dtb" -o -name "sm8150.dtb" | head -n 1)
          [ -f "$DTB" ] && cp "$DTB" $AK3_DIR/dtb
          
          # Colectare DTBO (Hardware fragments)
          echo "Colectăm fragmentele DTBO din renovation..."
          find kernel/out/arch/arm64/boot/dts/samsung/renovation -name "*.dtbo" -exec cp {} $AK3_DIR/ \;
          
          # Verificare finală
          COUNT=$(ls $AK3_DIR/*.dtbo 2>/dev/null | wc -l)
          echo "Finalizat! Am găsit $COUNT fișiere DTBO."
          
          cd $AK3_DIR
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          zip -r9 ../R5Q_A15_Lumi_V37.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-Android15-Kernel
          path: R5Q_A15_Lumi_V37.zip
