name: Build r5q Kernel - Pure BPF (No Upstream)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev python3 clang llvm lld

      - name: Clone Mainey Kernel
        run: |
          git clone --depth=1 https://github.com/mainey/android_kernel_samsung_r5q.git -b lineage-19.0 kernel
          cd kernel
          git config user.email "wizard@build.com"
          git config user.name "Kernel-Wizard"

      - name: 1. Apply Xiaomi eBPF Backport
        run: |
          cd kernel
          # Importam doar ce ne trebuie pentru Android 14/15 Connectivity
          git fetch https://github.com/LineageOS/android_kernel_xiaomi_sm6150 refs/changes/08/469808/1
          git checkout FETCH_HEAD -f -- \
            include/linux/bpf.h \
            include/linux/filter.h \
            include/uapi/linux/bpf.h \
            kernel/bpf/core.c \
            kernel/bpf/verifier.c \
            kernel/bpf/syscall.c \
            net/core/filter.c
          
          # Fix Memorie (f623fe3) - Esential pentru Maps
          git fetch https://github.com/LineageOS/android_kernel_xiaomi_sm6150 f623fe3c3acf869236649d2bb16191899c44ca6f
          git checkout FETCH_HEAD -f -- kernel/bpf/syscall.c include/linux/bpf.h
          
          git add .
          git commit -m "Pure eBPF Backport applied"

      - name: 2. Minimal Fixes (No Conflict Edition)
        run: |
          cd kernel
          # 1. Fix 'bool' in filter.h
          sed -i 's/#define _LINUX_FILTER_H/#define _LINUX_FILTER_H\n#include <linux/types.h>/g' include/linux/filter.h
          
          # 2. Sincronizam alocatorul de memorie
          sed -i 's/static void \*bpf_map_area_alloc/void \*bpf_map_area_alloc/g' kernel/bpf/syscall.c
          sed -i 's/static void bpf_map_area_free/void bpf_map_area_free/g' kernel/bpf/syscall.c
          
          # 3. Injectam tipul BPF_PROG_TYPE_NETFILTER (Locul corect in UAPI)
          sed -i '/BPF_PROG_TYPE_LWT_SEG6LOCAL,/a \	BPF_PROG_TYPE_NETFILTER,' include/uapi/linux/bpf.h
          
          # 4. Fix Samsung Traps & Makefile
          sed -i 's/sec_debug_sched_msg/\/\/ sec_debug_sched_msg/g' arch/arm64/kernel/traps.c
          sed -i 's|$(srctree)/../toolchain/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin/aarch64-linux-android-||g' Makefile
          
          # Bypass Samsung Security
          echo -e "#!/bin/sh\necho '00000000000000000000000000000000'\nexit 0" > secgetspf
          chmod +x secgetspf

      - name: 3. Configure and Build
        run: |
          cd kernel
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export PATH=$PATH:$(pwd)

          mkdir -p out
          make O=out ARCH=arm64 r5q_eur_open_defconfig
          
          # BPF Flags pentru Android 15
          ./scripts/config --file out/.config -e BPF -e BPF_SYSCALL -e BPF_JIT -e CGROUP_BPF
          ./scripts/config --file out/.config -e NETFILTER_XT_MATCH_BPF -e NET_ACT_BPF -e BPF_STREAM_PARSER
          ./scripts/config --file out/.config -e NET_CLS_ACT -e NET_CLS_BPF -e STREAM_PARSER
          ./scripts/config --file out/.config --set-val NR_CPUS 8
          ./scripts/config --file out/.config -d SEC_DEBUG
          
          yes "" | make O=out ARCH=arm64 oldconfig
          
          make -j$(nproc --all) O=out ARCH=arm64 \
            LD=ld.lld \
            KCFLAGS="-Wno-error -Wno-implicit-function-declaration -fcommon -DNR_CPUS=8"

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-r5q-Pure-BPF
          path: |
            kernel/out/arch/arm64/boot/Image.gz-dtb
            kernel/out/arch/arm64/boot/dtbo.img
