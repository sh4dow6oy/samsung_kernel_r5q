name: Build r5q Kernel - Final eBPF & Toolchain Fix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi git libssl-dev python3 clang llvm lld

      - name: Clone Mainey Kernel (Base lineage-19.0)
        run: |
          git clone --depth=500 https://github.com/mainey/android_kernel_samsung_r5q.git -b lineage-19.0 kernel
          cd kernel
          git config user.email "wizard@build.com"
          git config user.name "Kernel-Wizard"

      - name: Fetch and Apply eBPF Patch (Gerrit 387879)
        run: |
          cd kernel
          git fetch https://github.com/LineageOS/android_kernel_samsung_sm7125 refs/changes/79/387879/1
          
          # Aplicăm patch-ul cu prioritate pentru codul LineageOS
          git cherry-pick FETCH_HEAD -X theirs || {
            echo "Forțăm fișierele eBPF critice..."
            git checkout FETCH_HEAD -- include/uapi/linux/bpf.h
            git checkout FETCH_HEAD -- include/linux/bpf.h
            git checkout FETCH_HEAD -- net/core/filter.c
            git add .
            git cherry-pick --continue --no-edit
          }

      - name: Hotfix Path & Samsung Traps
        run: |
          cd kernel
          # 1. Eliminăm referințele hardcoded către toolchain-ul local Samsung care nu există pe GitHub
          sed -i 's/CROSS_COMPILE_ARM32 :=/# CROSS_COMPILE_ARM32 :=/g' Makefile
          
          # 2. Definim constanta BPF_OBJ_NAME_LEN pentru a trece de eroarea de compilare
          sed -i '/#define _UAPI__LINUX_BPF_H/a \
          \
          #ifndef BPF_OBJ_NAME_LEN\
          #define BPF_OBJ_NAME_LEN 16U\
          #endif' include/uapi/linux/bpf.h

          # 3. Comentăm funcțiile Samsung Debug care blochează build-ul (Implicit Declaration)
          sed -i 's/sec_debug_sched_msg/\/\/ sec_debug_sched_msg/g' arch/arm64/kernel/traps.c
          sed -i 's/sec_debug_summary/\/\/ sec_debug_summary/g' arch/arm64/kernel/traps.c
          sed -i 's/sec_debug_save_badmode/\/\/ sec_debug_save_badmode/g' arch/arm64/kernel/traps.c

          # 4. Curățăm marcajele de conflict
          find . -type f -name "*.h" -o -name "*.c" | xargs sed -i '/^<<<<<<< /d; /^=======/d; /^>>>>>>> /d' || true

      - name: Configure Defconfig
        run: |
          cd kernel
          mkdir -p out
          # Forțăm ARCH=arm64 pentru a nu căuta config-ul în x86
          make O=out ARCH=arm64 r5q_defconfig
          
          # Ajustăm configurația pentru Android 13/14 și fixăm NR_CPUS
          scripts/config --file out/.config --set-val NR_CPUS 8
          scripts/config --file out/.config -d SEC_DEBUG
          scripts/config --file out/.config -e BPF -e BPF_SYSCALL -e BPF_JIT -e CGROUP_BPF -e NETFILTER_XT_MATCH_BPF -e NETFILTER_XT_TARGET_BPF

      - name: Build Kernel (Clang Toolchain)
        run: |
          cd kernel
          # Setăm variabilele necesare pentru cross-compilare
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          
          # Compilăm imaginea kernelului
          # KCFLAGS conține hack-urile de compatibilitate pentru a ignora warning-urile și erorile specifice Samsung
          make -j$(nproc --all) O=out ARCH=arm64 KCFLAGS="-Wno-error -Wno-implicit-function-declaration -fcommon -DNR_CPUS=8"

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-r5q-Final-Build
          path: |
            kernel/out/arch/arm64/boot/Image.gz-dtb
            kernel/out/arch/arm64/boot/dtbo.img
