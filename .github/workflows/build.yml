name: Build R5Q - Android 15 Shim BPF
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Your Kernel (r5q)
        uses: actions/checkout@v4
        with:
          repository: Roynas-Android-Playground/kernel_samsung_r3q
          ref: master
          path: kernel
          fetch-depth: 0

      - name: Android 15 BPF Shim Surgery (V17)
        run: |
          cd kernel
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          
          git remote add phoenix https://github.com/PhoenixKernel/linux.git
          git fetch phoenix android-4.14-phoenix --depth=1
          git fetch phoenix android12-5.10-phoenix --depth=1
          
          echo "Syncing 5.10 BPF Subsystem..."
          git checkout phoenix/android12-5.10-phoenix -- kernel/bpf/
          git checkout phoenix/android12-5.10-phoenix -- include/linux/bpf.h
          git checkout phoenix/android12-5.10-phoenix -- include/linux/bpf_types.h
          git checkout phoenix/android12-5.10-phoenix -- include/uapi/linux/bpf.h
          git checkout phoenix/android12-5.10-phoenix -- include/linux/lsm_hook_defs.h

          echo "Creating BPF-to-4.14 Compatibility Shim..."
          # Creăm un fișier de tip bridge pentru a gestiona diferențele de API
          cat <<EOF > kernel/bpf/bpf_shim.h
          #ifndef __BPF_SHIM_H
          #define __BPF_SHIM_H

          #include <linux/netfilter.h>

          /* Shim pentru NF_HOOK: 5.10 (7 args) -> 4.14 (5 args) */
          /* Ignorăm 'net' și 'sk' care nu există în semnătura NF_HOOK din 4.14 */
          #undef NF_HOOK
          #define NF_HOOK(pf, hook, net, sk, in, out, okfn) \\
                  nf_hook(pf, hook, in, out, okfn)

          /* Shim pentru bpf_jit_charge_modmem (nu există în 4.14) */
          static inline int bpf_jit_charge_modmem(struct bpf_prog *prog, int size) { return 0; }
          static inline void bpf_jit_uncharge_modmem(struct bpf_prog *prog, int size) { }

          #endif
          EOF

          # Injectăm Shim-ul în fișierele critice din kernel/bpf/
          sed -i '1i #include "bpf_shim.h"' kernel/bpf/cgroup.c
          sed -i '1i #include "bpf_shim.h"' kernel/bpf/core.c

          echo "Injecting LSM Hooks into 4.14 Core..."
          git checkout phoenix/android-4.14-phoenix -- security/security.c
          git checkout phoenix/android-4.14-phoenix -- kernel/fork.c
          git checkout phoenix/android-4.14-phoenix -- include/linux/lsm_hooks.h
          
          # Adăugăm câmpul bpf_lsm_hooks cerut de înregistrarea BPF
          sed -i '/struct lsm_id \*id;/a \	void *bpf_lsm_hooks;' include/linux/lsm_hooks.h

          echo "Fixing MM Structs for 5.10 Compatibility..."
          sed -i '1i #include <uapi/linux/auxvec.h>' include/linux/mm_types.h
          sed -i '/struct task_struct \*owner;/a \	spinlock_t arg_lock;\n\tunsigned long saved_auxv[AT_VECTOR_SIZE];' include/linux/mm_types.h
          sed -i '/spin_lock_init(&mm->page_table_lock);/a \	spin_lock_init(&mm->arg_lock);' kernel/fork.c

          # Fix Clang page cast
          git checkout phoenix/android-4.14-phoenix -- fs/proc/base.c
          sed -i 's/page = (char \*)__get_free_page/struct page *page_ptr; page = (char *)__get_free_page/g' fs/proc/base.c || true

          git add .
          git commit -m "Hybrid V17: Implemented BPF Shim for 4.14/5.10 API bridge" || echo "No changes"

      - name: Setup Toolchain
        run: |
          sudo apt-get update && sudo apt-get install -y zstd libssl-dev bc bison flex
          mkdir clang && wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang
          echo "$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_PATH

      - name: Build Kernel
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          MAKE_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- O=out"

          mkdir -p out
          make $MAKE_ARGS r5q_defconfig

          ./scripts/config --file out/.config \
            -e CONFIG_BPF -e CONFIG_BPF_SYSCALL -e CONFIG_BPF_JIT -e CONFIG_BPF_LSM \
            -d CONFIG_SAMSUNG_RTIC -d CONFIG_SECURITY_RKP -d CONFIG_WERROR

          make $MAKE_ARGS olddefconfig
          make -j$(nproc --all) $MAKE_ARGS Image.gz \
            KCFLAGS="-w -fcommon -fno-stack-protector -Wno-implicit-function-declaration -Wno-int-conversion -fintegrated-as"
