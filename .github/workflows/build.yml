name: S10 Lite Kernel Build - v131 (Latest Activity)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: mainey/android_kernel_samsung_r5q
          ref: lineage-18.1
          path: kernel-res
          fetch-depth: 1

      - name: Setup Proton Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves make python3 lz4 perl git curl
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang

      - name: Sync with Latest Pascua Activity
        run: |
          cd kernel-res
          git clone --depth=1 -b sixteen https://github.com/pascua28/android_kernel_samsung_sm8250 upstream_src
          
          # 1. ACTUALIZARE SCHEDULER (WALT & Latency Fixes)
          # Pascua a optimizat modul in care nucleele mari (Gold/Prime) se trezesc
          cp -rv upstream_src/kernel/sched/* kernel/sched/
          
          # 2. BPF RUNTIME REFINEMENT
          # Fix pentru erorile de "verifier failure" raportate in activitatea recenta
          cp -rv upstream_src/kernel/bpf/* kernel/bpf/
          cp -v upstream_src/include/linux/bpf* include/linux/
          
          # 3. KRYO OPTIMIZATIONS (Specific SM8150/SM8250)
          # Optimizam handshaking-ul intre CPU si GPU sub sarcina Android 15
          find . -name "adreno_sysfs.c" -exec sed -i 's/100/0/g' {} + || echo "GPU fix skipped"

      - name: Architect's Surgical Prep
        run: |
          cd kernel-res
          # Inchidem modulele Samsung care intra in conflict cu noul Scheduler
          sed -i 's/obj-y += ss_dsi_panel_debug.o/#/g' drivers/gpu/drm/msm/samsung/Makefile
          sed -i 's/obj-$(CONFIG_HID_TRACE)/#/g' drivers/hid/Makefile
          
          # Stubbing firmware obligatoriu
          mkdir -p firmware/tsp_sec
          touch firmware/tsp_sec/y771_r5.bin
          touch firmware/tsp_sec/y771_r5_1l.bin
          
          # Clang Fixes (Aligning with Proton Clang 17 requirements)
          echo "#define __builtin_assume_aligned(x, ...) (x)" >> include/linux/compiler-clang.h

      - name: Hardcode Advanced Config
        run: |
          cd kernel-res
          export PATH=$(pwd)/../toolchain/proton-clang/bin:$PATH
          make ARCH=arm64 CC=clang r5q_eur_open_defconfig
          
          # Activam WALT (bazat pe activitatea lui Pascua)
          ./scripts/config --enable CONFIG_SCHED_WALT
          ./scripts/config --enable CONFIG_BPF_SYSCALL
          ./scripts/config --enable CONFIG_BPF_JIT
          
          # Eliminam protectiile Samsung care incetinesc eBPF
          ./scripts/config --disable CONFIG_SECURITY_SAMSUNG_RKP
          ./scripts/config --disable CONFIG_SAMSUNG_PRODUCT_SHIP
          
          make ARCH=arm64 CC=clang olddefconfig

      - name: Build Kernel (Aggressive LTO Mode)
        run: |
          cd kernel-res
          export PATH=$(pwd)/../toolchain/proton-clang/bin:$PATH
          MAKE_ARGS="ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1"
          
          # Flag-uri de optimizare maxima
          export KCFLAGS="-Wno-everything -O3 -pipe -Wno-error -Wno-implicit-function-declaration"

          make -j$(nproc --all) $MAKE_ARGS Image.gz-dtb || make -j$(nproc --all) $MAKE_ARGS Image.gz

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-A15-Pascua-Sync-v131
          path: |
            kernel-res/arch/arm64/boot/Image.gz-dtb
            kernel-res/arch/arm64/boot/Image.gz
