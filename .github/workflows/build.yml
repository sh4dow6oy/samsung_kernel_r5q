name: Build SM8150 - Roynas Lineage-20 Final

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Cleanup and Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python2-minimal python3-pip bc build-essential flex bison ncurses-dev libssl-dev libelf-dev xz-utils libfl-dev git-core ccache zip zstd binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          pip3 install pycryptodome

      - name: Clone Roynas Kernel (Base)
        run: git clone --depth=100 https://github.com/Roynas-Android-Playground/kernel_samsung_r3q.git s

      - name: Fetch and Merge Lineage-20
        run: |
          cd s
          git config user.email "build@auriana.local"
          git config user.name "Builder"
          git remote add lineage https://github.com/LineageOS/android_kernel_qcom_sm8150.git
          git fetch lineage lineage-20
          git merge lineage/lineage-20 -s recursive -X ours --no-edit || echo "Merge partial cu conflicte rezolvate"

      - name: Download Proton Clang
        run: git clone --depth=1 https://github.com/kdrag0n/proton-clang.git llvm-proton

      - name: Build Kernel
        run: |
          export ARCH=arm64
          TOOLCHAIN_PATH="${{ github.workspace }}/llvm-proton/bin"
          export PATH="$TOOLCHAIN_PATH:$PATH"
          
          # Link-uri vitale pentru scripturile de securitate Samsung
          ln -sf $TOOLCHAIN_PATH/llvm-objdump $TOOLCHAIN_PATH/aarch64-linux-gnu-objdump
          ln -sf $TOOLCHAIN_PATH/llvm-readelf $TOOLCHAIN_PATH/aarch64-linux-gnu-readelf
          ln -sf $TOOLCHAIN_PATH/llvm-nm $TOOLCHAIN_PATH/aarch64-linux-gnu-nm
          
          cd s
          
          # --- 1. NUCLEAR CLEANUP (Prevenim Polly Errors) ---
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-mllvm -polly[^ ]*//g' {} +
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-mllvm//g' {} +
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-polly[^ ]*//g' {} +
          
          # --- 2. VDSO FIX (Anti-static link errors) ---
          if [ -f arch/arm64/kernel/vdso/Makefile ]; then
            sed -i 's/-static//g' arch/arm64/kernel/vdso/Makefile
            sed -i 's/$(LDFLAGS)/$(filter-out -static,$(LDFLAGS))/g' arch/arm64/kernel/vdso/Makefile
          fi

          # --- 3. KERNELSU & SAMSUNG CLEANUP ---
          sed -i '/kernelsu/d' drivers/android/Kconfig || true
          sed -i '/kernelsu/d' drivers/android/Makefile || true
          rm -rf drivers/kernelsu || true
          # Dezactivăm gcc-wrapper-ul Samsung care cauzează bug-uri de mediu
          sed -i 's/ifneq ($(wildcard $(srctree)\/scripts\/gcc-wrapper.py),)/ifeq (0,1)/g' Makefile

          # --- 4. CONFIGURARE ---
          make ARCH=arm64 O=out r5q_defconfig
          
          ./scripts/config --file out/.config \
            -d CONFIG_CC_STACKPROTECTOR_STRONG \
            -e CONFIG_CC_STACKPROTECTOR_NONE \
            -e CONFIG_LTO_CLANG \
            -e CONFIG_THINLTO \
            -d CONFIG_MODVERSIONS \
            -d CONFIG_RKP_CFP \
            -d CONFIG_SECURITY_DEFEX \
            -d CONFIG_WERROR

          make ARCH=arm64 O=out olddefconfig

          # --- 5. COMPILARE ---
          MAKE_ARGS="ARCH=arm64 O=out CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip READELF=aarch64-linux-gnu-readelf HOSTCC=clang HOSTCXX=clang++ CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LLVM=1 LLVM_IAS=0 PYTHON=python"

          make -j$(nproc --all) $MAKE_ARGS \
            LDFLAGS="-z notext --thinlto-cache-dir=../lto-cache" \
            KCFLAGS="-fcommon -fno-pic -fno-stack-protector -Wno-error -Wno-unused-command-line-argument" \
            Image.gz dtbs

      - name: Create and Sign Flashable Package
        run: |
          # Generare DTBO.img
          MKDTIMG="${{ github.workspace }}/s/tools/mkdtimg"
          chmod +x $MKDTIMG
          DTBO_FILES=$(find s/out/arch/arm64/boot/dts/ -name "*.dtbo")
          $MKDTIMG create dtbo-unsigned.img --version=2 --page_size=4096 $DTBO_FILES
          
          # AVB Sign (Fix Dtbo_Version = 0)
          wget https://raw.githubusercontent.com/tiann/avbtool/master/avbtool.py
          python3 avbtool.py add_hash_footer --image dtbo-unsigned.img --partition_size 8388608 --partition_name dtbo --output dtbo.img

          # AnyKernel3 Setup
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel
          cp s/out/arch/arm64/boot/Image.gz AnyKernel/Image.gz
          cp dtbo.img AnyKernel/dtbo.img
          
          cd AnyKernel
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          sed -i 's/header_version=0/header_version=2/g' anykernel.sh
          printf '\nflash_dtbo;\n' >> anykernel.sh
          
          zip -r9 ../Kernel-Auriana-Final.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Merged-Final
          path: Kernel-Auriana-Final.zip
