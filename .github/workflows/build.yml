name: Build Roynas R5Q - A15 BPF UAPI Fix
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: Roynas-Android-Playground/kernel_samsung_r3q
          ref: master
          fetch-depth: 0

      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev ccache python3 wget zstd zip git

      - name: BPF Deep Integration & UAPI Fix
        run: |
          git config --global user.email "bot@example.com"
          git config --global user.name "Kernel Bot"
          git remote add lineage https://github.com/LineageOS/android_kernel_google_msm-4.14.git
          git fetch lineage lineage-23.0
          
          # Importăm tot ce ține de BPF, inclusiv UAPI (interfața de utilizator)
          git checkout lineage/lineage-23.0 -f -- \
            include/linux/bpf.h \
            include/linux/filter.h \
            include/uapi/linux/bpf.h \
            include/linux/bpf_types.h \
            net/core/filter.c
          
          # --- FIX STRUCT BPF_SPIN_LOCK ---
          # Îl definim manual în bpf.h pentru a evita "incomplete type"
          sed -i '/struct bpf_map;/a struct bpf_spin_lock { u32 val; };' include/linux/bpf.h
          
          # --- FIX FLAG-URI LIPSĂ ---
          # Dacă flag-urile RDONLY/WRONLY nu sunt găsite, le injectăm manual
          sed -i '1i #define BPF_F_RDONLY_PROG (1U << 7)\n#define BPF_F_WRONLY_PROG (1U << 8)' include/linux/bpf.h

          # --- BYPASS BPF STATS (Python script din pasul anterior) ---
          python3 -c '
          import os
          path = "include/linux/filter.h"
          if os.path.exists(path):
              with open(path, "r") as f: content = f.read()
              import re
              simple_bpf_run = """#define BPF_PROG_RUN(prog, ctx) ({ \\
              uint32_t _ret; \\
              preempt_disable(); \\
              _ret = (*(prog)->bpf_func)(ctx, (prog)->insnsi); \\
              preempt_enable(); \\
              _ret; })"""
              content = re.sub(r"#define BPF_PROG_RUN\(prog, ctx\).*?preempt_enable\(\); \\.*?_ret; \}\)", simple_bpf_run, content, flags=re.DOTALL)
              with open(path, "w") as f: f.write(content)
          '

          # Alte fix-uri necesare pentru sk_buff
          sed -i '/cb->data_meta = skb->data - skb_metadata_len(skb);/d' include/linux/filter.h
          sed -i 's/return skb_metadata_len(skb);/return 0;/g' include/linux/filter.h
          
          git add .
          git commit -m "Fix BPF UAPI and spinlock structures" || echo "No changes"

      - name: Setup Toolchain & Build
        run: |
          mkdir clang
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          
          # Fix Samsung standard
          sed -i '/kernelsu\/Kconfig/d' drivers/android/Kconfig || true
          sed -i '/kernelsu/d' drivers/android/Makefile || true
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-mllvm -polly[^ ]*//g' {} +
          [ -f arch/arm64/kernel/vdso/Makefile ] && sed -i 's/$(LDFLAGS)/$(filter-out -static,$(LDFLAGS))/g' arch/arm64/kernel/vdso/Makefile

          MAKE_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- O=out"

          make $MAKE_ARGS r5q_defconfig
          ./scripts/config --file out/.config -e CONFIG_BPF -e CONFIG_BPF_SYSCALL -e CONFIG_BPF_JIT -e CONFIG_CGROUP_BPF -d CONFIG_LTO_CLANG -e CONFIG_LTO_NONE -d CONFIG_WERROR
          make $MAKE_ARGS olddefconfig
          
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-fcommon -Wno-error -Wno-implicit-function-declaration -Wno-incompatible-pointer-types"

      - name: Upload
        if: always()
        run: |
          if [ -f out/arch/arm64/boot/Image.gz ]; then
            git clone https://github.com/osm0sis/AnyKernel3.git
            cp out/arch/arm64/boot/Image.gz AnyKernel3/
            cd AnyKernel3 && zip -r9 ../Kernel-R5Q-A15-Fixed-UAPI.zip *
          fi
      - name: Publish
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-S10Lite-A15-Fixed
          path: "*.zip"
