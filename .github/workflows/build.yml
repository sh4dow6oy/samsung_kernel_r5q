name: Build Roynas R5Q - Neutron Clang Raw
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: sh4dow6oy/android_kernel_samsung_sm7150
          ref: sixteen
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev \
          ccache python3 python-is-python3 libarchive-tools wget zstd zip \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libncurses-dev libtinfo6 dtc

      - name: Setup Neutron Clang
        run: |
          mkdir clang
          wget -q https://github.com/Ylarod/setup-ndk-clang/releases/download/prebuilt/clang-linux-x86-ndk-r29-r563880c.tar.zst
          tar -I zstd -xf clang-linux-x86-ndk-r29-r563880c.tar.zst -C clang

      - name: Build Kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export KBUILD_BUILD_USER="Roynas"
          export KBUILD_BUILD_HOST="GithubActions"

          # --- FIX-URI CHIRURGICALE ---
          sed -i '30i bool msm_gpio_is_valid(int gpionum);' drivers/pinctrl/qcom/pinctrl-msm.c
          find drivers/gpu/drm/msm -name "ss_dsi_panel_debug.h" -exec sed -i 's/extern bool read_debug_partition/\/\/ extern bool read_debug_partition/g' {} +
          find drivers/gpu/drm/msm -name "ss_dsi_panel_debug.h" -exec sed -i 's/extern bool write_debug_partition/\/\/ extern bool write_debug_partition/g' {} +
          sed -i '433d' kernel/trace/trace_event_perf.c || true
          [ -f scripts/dtc/dtc-lexer.lex.c_shipped ] && sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' scripts/dtc/dtc-lexer.lex.c_shipped || true
          
          mkdir -p include/linux
          find drivers/samsung -name "sec_debug.h" -exec ln -sf ../../{} include/linux/sec_debug.h \;
          find drivers/samsung -name "sec_class.h" -exec ln -sf ../../{} include/linux/sec_class.h \;

          # --- ARGUMENTE BUILD ---
          # Am adaugat LD_LIBRARY_PATH pentru Clang si am forțat LDFLAGS pentru a ignora definitiile multiple la link-uire
          MAKE_ARGS="ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            O=out"

          # --- CONFIGURARE ---
          make $MAKE_ARGS r5q_defconfig
          ./scripts/config --file out/.config \
            -d CONFIG_LTO \
            -d CONFIG_LTO_CLANG \
            -e CONFIG_LTO_NONE \
            -d CONFIG_CC_STACKPROTECTOR_STRONG \
            -e CONFIG_CC_STACKPROTECTOR_NONE \
            -d CONFIG_SECURITY_SMACK \
            -d CONFIG_SEC_DEBUG \
            -d CONFIG_SEC_DEBUG_SOFTDOG \
            -e CONFIG_SECTION_MISMATCH_WARN_ONLY
          make $MAKE_ARGS olddefconfig

          # --- COMPILARE ---
          # Definim flag-urile de eroare direct in comanda make
          KCFLAGS_CUSTOM="-fcommon -w -Wno-error \
            -Dinitcall_sec_debug=initcall_debug \
            -DPON_RESTART_REASON_CROSS_FAIL=0 \
            -DPD_NOTI_ATTACH_TYPEDEF=CC_NOTI_ATTACH_TYPEDEF \
            -DPDIC_NOTIFY_ID_ATTACH=CCIC_NOTIFY_ID_ATTACH \
            -DSEC_DEBUG_MODEM_SEPARATE_EN=0"

          # Pasul 1: Compilăm DTB-urile (aici pare să fie blocajul)
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="$KCFLAGS_CUSTOM" dtbs
          
          # Pasul 2: Compilăm restul Kernel-ului
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="$KCFLAGS_CUSTOM"

      - name: Package with AnyKernel3
        run: |
          # Verificăm unde a generat Samsung fișierele (uneori sunt în out/arch/arm64/boot/dts/...)
          IMAGE="$GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz-dtb"
          if [ ! -f "$IMAGE" ]; then IMAGE="$GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz"; fi
          
          # Căutăm dtbo.img în tot folderul out
          DTBO=$(find out/ -name "dtbo.img" | head -n 1)
          
          git clone https://github.com/osm0sis/AnyKernel3.git
          rm -rf AnyKernel3/.git
          cp $IMAGE AnyKernel3/Image.gz
          [ -n "$DTBO" ] && cp "$DTBO" AnyKernel3/dtbo.img || echo "DTBO not found, skipping..."
          
          sed -i 's/device.name1=maguro/device.name1=r5q/g' AnyKernel3/anykernel.sh
          cd AnyKernel3 && zip -r9 ../Kernel-S10Lite-R5Q-Neutron.zip *

      - name: Upload Flashable Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-S10Lite-R5Q
          path: Kernel-S10Lite-R5Q-Neutron.zip
