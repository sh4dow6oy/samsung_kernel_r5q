name: Build Roynas R5Q - Ravindu Final Fixed
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: Roynas-Android-Playground/kernel_samsung_r3q
          ref: master
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev \
          ccache python3 python-is-python3 libarchive-tools wget libtinfo5

      - name: Setup Toolchains
        run: |
          mkdir clang gcc
          wget -q https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/clang-4639204-cfp-jopp.tar.gz
          tar -xf clang-4639204-cfp-jopp.tar.gz -C clang
          wget -q https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/gcc-cfp-jopp-only.tar.gz
          tar -xf gcc-cfp-jopp-only.tar.gz -C gcc

      - name: Build Kernel
        run: |
          # 1. Localizare binare
          CLANG_BIN=$(find $GITHUB_WORKSPACE/clang -name clang -type f -printf '%h\n' | head -n 1)
          GCC_BIN=$(find $GITHUB_WORKSPACE/gcc -name "aarch64-linux-android-gcc" -type f -printf '%h\n' | head -n 1)
          GOLD_LD=$(find $GITHUB_WORKSPACE/gcc -name "ld.gold" -type f -printf '%p\n' | head -n 1)
          
          export PATH="$CLANG_BIN:$GCC_BIN:$PATH"

          # 2. Fix Linker
          ln -sf "$GOLD_LD" "$GCC_BIN/aarch64-linux-gnu-ld.gold"
          ln -sf "$GOLD_LD" "$GCC_BIN/aarch64-linux-gnu-ld"

          # 3. DEEP CLEANUP - Eliminăm Polly și prefixele -mllvm
          # Această comandă șterge perechea "-mllvm -argument"
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-mllvm -polly[^ ]*//g' {} +
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-mllvm//g' {} +
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-polly[^ ]*//g' {} +
          
          # Eliminăm restul de flag-uri problematice raportate
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-ast-use-context//g' {} +
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-detect-keep-going//g' {} +
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-run-dce//g' {} +
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-run-inliner//g' {} +
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-vectorizer=stripmine//g' {} +
          
          # Fix VDSO
          sed -i 's/-static//g' arch/arm64/kernel/vdso/Makefile || true
          
          # Cleanup KernelSU & Wrapper
          sed -i '/kernelsu/d' drivers/android/Kconfig || true
          sed -i '/kernelsu/d' drivers/android/Makefile || true
          rm -rf drivers/kernelsu
          sed -i 's/ifneq ($(wildcard $(srctree)\/scripts\/gcc-wrapper.py),)/ifeq (0,1)/g' Makefile

          # 4. Argumente Build
          MAKE_ARGS="ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-android- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            LD=aarch64-linux-android-ld.gold \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            O=out"

          # 5. Build
          make $MAKE_ARGS r5q_defconfig
          
          ./scripts/config --file out/.config \
            -d CONFIG_CC_STACKPROTECTOR_STRONG \
            -d CONFIG_CC_STACKPROTECTOR \
            -e CONFIG_CC_STACKPROTECTOR_NONE \
            -d CONFIG_LTO -d CONFIG_LTO_CLANG -e CONFIG_LTO_NONE \
            -d CONFIG_SHADOW_CALL_STACK -d CONFIG_KNOX_KAP -d CONFIG_SECURITY_SAMSUNG_KNOX \
            -d CONFIG_ASSIST_KSU -d CONFIG_KSU

          make $MAKE_ARGS olddefconfig
          
          # Folosim KCFLAGS pentru a curăța orice argumente LLVM care ar putea veni din surse
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-fcommon -fno-stack-protector -Wno-error -Wno-unknown-warning-option -Wno-unused-command-line-argument"

      - name: Upload Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-Ravindu-Clean
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/dtbo.img
