name: S10 Lite - Kernel sh4dow6oy v24

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves make python3 lz4 perl
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang

      - name: Core Pascua Backport (eBPF 5.1)
        run: |
          git remote add linux-stable https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git || true
          git fetch linux-stable linux-5.1.y --depth=1
          PATHS=("kernel/bpf/" "include/linux/bpf.h" "include/linux/filter.h" "include/linux/bpf_verifier.h" "include/linux/tnum.h" "include/linux/btf.h" "include/uapi/linux/bpf.h" "include/uapi/linux/btf.h" "include/uapi/linux/bpf_common.h" "include/linux/bpf-cgroup.h")
          for path in "${PATHS[@]}"; do git checkout FETCH_HEAD -- "$path"; done

      - name: Apply Glue Patches (v24 - Security & Cleanup)
        run: |
          # 1. Bypass Samsung Security Tools (secgetspf fix)
          echo -e "#!/bin/bash\nexit 0" > scripts/secgetspf
          chmod +x scripts/secgetspf
          sudo cp scripts/secgetspf /usr/bin/secgetspf

          # 2. Nuke LIRC & BPF conflicts (Consistent with v23 success)
          sed -i '/bpf_lirc\.h/d' kernel/bpf/syscall.c
          rm -f kernel/bpf/bpf_lirc.c kernel/bpf/devmap.c kernel/bpf/cpumap.c kernel/bpf/offload.c kernel/bpf/reuseport_array.c
          touch kernel/bpf/bpf_lirc.c kernel/bpf/devmap.c kernel/bpf/cpumap.c kernel/bpf/offload.c kernel/bpf/reuseport_array.c

          # 3. Fix Header global (include/linux/filter.h)
          sed -i '/#include <linux\/skbuff.h>/a \
          #define PERF_BPF_EVENT_PROG_LOAD 0\
          #define PERF_BPF_EVENT_PROG_UNLOAD 0\
          static inline void perf_event_bpf_event(void *p, int e, int f) {}\
          static inline int skb_metadata_len(const struct sk_buff *skb) { return 0; }\
          #ifndef cant_sleep\n#define cant_sleep() do { } while (0)\n#endif\n\
          static inline bool kallsyms_show_value(void) { return false; }' include/linux/filter.h

          # 4. Global access_ok fix
          grep -rl "access_ok(" kernel/bpf/ | xargs sed -i 's/access_ok(\([^,]*\), \([^)]*\))/access_ok(VERIFY_READ, \1, \2)/g'

          # 5. Syscall Stubs (v23 optimized)
          sed -i '1i #include <linux/err.h>\n#include <linux/bpf.h>\nstruct bpf_raw_event_map { int dummy; };\nstatic inline void bpf_probe_unregister(void *a, void *b) {}\nstatic inline void bpf_put_raw_tracepoint(void *a) {}\nstatic inline void *bpf_get_raw_tracepoint(void *a) { return NULL; }\nstatic inline int bpf_probe_register(void *a, void *b) { return -1; }\nstatic inline int lirc_prog_attach(const void *a, void *b) { return -1; }\nstatic inline int lirc_prog_detach(const void *a) { return -1; }\nstatic inline int lirc_prog_query(const void *a, void *b) { return -1; }\nstatic inline int skb_flow_dissector_bpf_prog_attach(const void *a, void *b) { return -1; }\nstatic inline int skb_flow_dissector_bpf_prog_detach(const void *a) { return -1; }\nstatic inline void *perf_get_event(void *a) { return ERR_PTR(-1); }\nstatic inline int bpf_get_perf_event_info(void *a, void *b, void *c, void *d, void *e, void *f) { return -1; }' kernel/bpf/syscall.c

          # 6. Atomic & Network Sync
          sed -i 's/atomic_fetch_add_unless/atomic_add_unless/g' kernel/bpf/syscall.c
          sed -i '/int xdp_do_generic_redirect(/i #define xdp_do_generic_redirect(dev, skb, prog) __xdp_do_generic_redirect(dev, skb, NULL, prog)' include/linux/filter.h
          sed -i 's/int xdp_do_generic_redirect(/int __xdp_do_generic_redirect(/g' include/linux/filter.h
          sed -i 's/int xdp_do_generic_redirect(/int __xdp_do_generic_redirect(/g' net/core/filter.c

      - name: Build Kernel
        run: |
          export PATH=$(pwd)/toolchain/proton-clang/bin:$PATH
          MAKE_ARGS="O=out ARCH=arm64 CC=clang HOSTCC=gcc CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1"
          
          make $MAKE_ARGS r5q_eur_open_defconfig
          ./scripts/config --file out/.config --set-str CONFIG_LOCALVERSION "-sh4dow6oy"
          ./scripts/config --file out/.config --enable CONFIG_BPF_SYSCALL
          ./scripts/config --file out/.config --disable CONFIG_KPERFMON
          ./scripts/config --file out/.config --disable CONFIG_DEFEX
          
          make $MAKE_ARGS olddefconfig
          # Rulăm cu V=1 pentru a vedea exact unde crapă dacă se oprește
          make -j$(nproc --all) $MAKE_ARGS V=1 Image.gz-dtb

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-sh4dow6oy-v24
          path: out/arch/arm64/boot/Image.gz-dtb
