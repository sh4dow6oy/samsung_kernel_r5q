name: R5Q Android 15 Kernel + DTBO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: sh4dow6oy/android_kernel_samsung_sm8150
          ref: rawr-bpf
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential curl flex git libelf-dev libssl-dev python3 zstd gcc-aarch64-linux-gnu

      - name: Download Neutron Clang
        run: |
          mkdir clang
          wget https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang

      - name: Setup Environment
        run: |
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "CLANG_PATH=$(pwd)/clang/bin" >> $GITHUB_ENV

      - name: Configure Kernel
        run: |
          export PATH=$CLANG_PATH:$PATH
          make O=out \
            ARCH=arm64 \
            CROSS_COMPILE=$CROSS_COMPILE \
            CC=clang \
            r5q_eur_open_defconfig

      - name: Enable Android 15 BPF and KALLSYMS
        run: |
          ./scripts/config --file out/.config \
            --enable BPF \
            --enable BPF_SYSCALL \
            --enable BPF_JIT \
            --enable CGROUP_BPF \
            --enable NET_CLS_BPF \
            --enable NET_ACT_BPF \
            --disable RANDOMIZE_BASE \
            --disable KALLSYMS_BASE_RELATIVE \
            --enable KALLSYMS_ALL

          make O=out ARCH=arm64 olddefconfig

      - name: Build Kernel + DTBs
        run: |
          export PATH=$CLANG_PATH:$PATH
          make -j$(nproc) \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE=$CROSS_COMPILE \
            CC=clang \
            Image.gz-dtb dtbs

      - name: Generate DTBO.img
        run: |
          DTBO_FILES=$(find out/arch/arm64/boot/dts/samsung/renovation -name "*.dtbo")
          if [ -n "$DTBO_FILES" ]; then
            echo "Generating dtbo.img from: $DTBO_FILES"
            curl -Lo mkdtboimg.py "https://android.googlesource.com/platform/system/libufdt/+/refs/heads/master/utils/src/mkdtboimg.py?format=TEXT" | base64 --decode > mkdtboimg.py
            chmod +x mkdtboimg.py
            python3 mkdtboimg.py create out/arch/arm64/boot/dtbo.img $DTBO_FILES
          else
            echo "ERROR: No DTBO files found!"
          fi

      - name: Package AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          [ -f out/arch/arm64/boot/dtbo.img ] && cp out/arch/arm64/boot/dtbo.img AnyKernel3/
          find out/ -name "*.ko" -exec cp {} AnyKernel3/modules/system/lib/modules/ \; || true

          cd AnyKernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          [ -f dtbo.img ] && sed -i 's/dtbo_setup=0/dtbo_setup=1/g' anykernel.sh

          zip -r9 ../R5Q-A15-KERNEL.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: R5Q-Android15-Kernel
          path: R5Q-A15-KERNEL.zip
