name: Build Samsung Kernel R5Q

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
      CC: gcc
      KERNEL_DIR: ${{ github.workspace }}
      DEFCONFIG: r5q_eur_open_defconfig
      OUTPUT_DIR: ${{ github.workspace }}/out

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev dwarves \
            libncurses-dev git wget unzip make gcc g++ \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            python3 python3-venv python3-pip

      - name: Ensure distutils exists
        run: |
          python3 -m pip install --upgrade pip setuptools

      - name: Install Python 2.7 (Debian packages)
        run: |
          mkdir -p $HOME/python2
          cd $HOME/python2

          wget http://ftp.debian.org/debian/pool/main/o/openssl/libssl1.1_1.1.1w-0+deb11u1_amd64.deb
          wget http://ftp.debian.org/debian/pool/main/libf/libffi/libffi7_3.3-6_amd64.deb
          wget http://ftp.debian.org/debian/pool/main/libn/libnsl/libnsl2_1.3.0-2_amd64.deb
          wget http://ftp.debian.org/debian/pool/main/m/mime-support/mime-support_3.66_all.deb

          wget http://ftp.debian.org/debian/pool/main/p/python2.7/python2.7_2.7.18-8+deb11u1_amd64.deb
          wget http://ftp.debian.org/debian/pool/main/p/python2.7/python2.7-minimal_2.7.18-8+deb11u1_amd64.deb
          wget http://ftp.debian.org/debian/pool/main/p/python2.7/libpython2.7-stdlib_2.7.18-8+deb11u1_amd64.deb
          wget http://ftp.debian.org/debian/pool/main/p/python2.7/libpython2.7-minimal_2.7.18-8+deb11u1_amd64.deb

          sudo dpkg -i libssl1.1_1.1.1n-0+deb11u4_amd64.deb \
            libffi7_3.3-6_amd64.deb libnsl2_1.3.0-2_amd64.deb \
            mime-support_3.66_all.deb || true

          sudo dpkg -i python2.7-minimal_2.7.18-8+deb11u1_amd64.deb \
            libpython2.7-minimal_2.7.18-8+deb11u1_amd64.deb \
            libpython2.7-stdlib_2.7.18-8+deb11u1_amd64.deb \
            python2.7_2.7.18-8+deb11u1_amd64.deb || true

          sudo apt-get install -f -y
          sudo ln -sf /usr/bin/python2.7 /usr/bin/python2

      - name: Build Kernel
        run: |
          cd $KERNEL_DIR
          make O=$OUTPUT_DIR ARCH=$ARCH $DEFCONFIG
          make -j$(nproc) O=$OUTPUT_DIR ARCH=$ARCH
