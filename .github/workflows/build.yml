name: Build Kernel with Neutron Clang

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Samsung Source
        uses: actions/checkout@v4
        with:
          repository: sh4dow6oy/kernel_samsung_r5q
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

      - name: Fetch and Merge SM7125 (Strategy Ours)
        run: |
          git remote add lineage_github https://github.com/LineageOS/android_kernel_samsung_sm7125.git
          git fetch lineage_github 1db3840e4d743768892374dc395a1a4c930a97dd
          # Folosim -X ours pentru a evita coruperea Makefile-ului si a headerelor critice
          git merge -X ours FETCH_HEAD --allow-unrelated-histories -m "Merge SM7125 LineageOS Base"

      - name: Setup Neutron Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd
          mkdir clang-neutron
          # Descarcăm Neutron Toolchain
          wget https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          # Dezarhivăm .tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang-neutron
          echo "Neutron Clang is ready."

      - name: Build Kernel
        run: |
          # Setăm calea către Neutron
          export PATH=$(pwd)/clang-neutron/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          
          # Parametrii Neutron recomandați
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          
          # Fix rapid pentru Makefile dacă merge-ul a lăsat mizerie
          git checkout HEAD -- Makefile
          
          # Patch rapid defconfig
          DEFCONFIG="arch/arm64/configs/r5q_defconfig"
          sed -i 's/CONFIG_KNP=y/CONFIG_KNP=n/g' $DEFCONFIG
          sed -i 's/CONFIG_RKP=y/CONFIG_RKP=n/g' $DEFCONFIG

          mkdir -p out
          make O=out r5q_defconfig
          
          # Compilarea cu Neutron (folosind LLVM=1 pentru a activa tot setul de unelte)
          make -j$(nproc --all) O=out \
               LLVM=1 \
               LLVM_IAS=1 \
               CROSS_COMPILE=aarch64-linux-gnu- \
               CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
               CLANG_TRIPLE=aarch64-linux-gnu-

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: r5q-Neutron-Build
          path: out/arch/arm64/boot/Image.gz-dtb
