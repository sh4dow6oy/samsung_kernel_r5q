name: S10 Lite (Pure G770F Build)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Your Kernel Source
        uses: actions/checkout@v4
        with:
          repository: sh4dow6oy/samsung_kernel_r5q
          ref: master
          fetch-depth: 1

      - name: Setup Build Cache
        uses: actions/cache@v4
        with:
          path: |
            clang
            out
          key: ${{ runner.os }}-pure-g770f-v1
          restore-keys: |
            ${{ runner.os }}-pure-g770f-

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex git libssl-dev libelf-dev clang llvm lld zstd curl python3 device-tree-compiler

      - name: Download Neutron Clang
        run: |
          if [ ! -d "clang/bin" ]; then
            mkdir -p clang
            wget https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
            tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang
          fi

      - name: Build Kernel (No Extra Configs)
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          
          # Argumente standard pentru LLVM/Clang
          MAKE_ARGS="ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            DTC=dtc \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            O=out"

          # 1. Initializare cu defconfig-ul tau
          make $MAKE_ARGS g770f_defconfig

          # 2. Compilare efectiva
          # Folosim doar flag-uri de toleranta pentru compilator
          make -j$(nproc --all) $MAKE_ARGS \
            KCFLAGS="-fcommon -fno-common -Wno-error" \
            2>&1 | tee build.log

      - name: Package AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3
          # Copiem ce s-a compilat
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/ || echo "Image.gz-dtb missing"
          cp out/arch/arm64/boot/dtbo.img AnyKernel3/ || echo "dtbo.img missing"
          
          cd AnyKernel3
          # Setam numele device-ului pentru S10 Lite
          sed -i 's/device.name1=maguro/device.name1=r5q/' anykernel.sh
          sed -i 's/device.name2=toroplus/device.name2=SM-G770F/' anykernel.sh
          # Setam partitia de boot corecta pentru r5q
          sed -i 's|block=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot|block=/dev/block/bootdevice/by-name/boot|' anykernel.sh
          
          zip -r ../S10Lite-Pure-Kernel.zip *

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-Pure-Build
          path: |
            S10Lite-Pure-Kernel.zip
            build.log
