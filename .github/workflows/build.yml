name: R5Q - Lineage Base + Samsung Drivers
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LineageOS Base
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_google_msm-4.14
          path: kernel

      - name: Checkout Samsung Drivers (Sunmughan)
        uses: actions/checkout@v4
        with:
          repository: sunmughan/samsung_kernel_r5q
          path: sunmughan_source

      - name: Surgical Injection
        run: |
          # 1. Ștergem driverele generice și techpack-ul din Lineage
          rm -rf kernel/drivers kernel/techpack
          
          # 2. Injectăm driverele Samsung
          cp -r sunmughan_source/drivers kernel/
          cp -r sunmughan_source/techpack kernel/
          
          # 3. Descărcăm Config-ul Royna (R5Q)
          mkdir -p kernel/arch/arm64/configs
          wget -O kernel/arch/arm64/configs/r5q_defconfig https://raw.githubusercontent.com/Roynas-Android-Playground/kernel_samsung_r3q/master/arch/arm64/configs/r5q_defconfig

      - name: Apply Fixes for Lineage Base
        run: |
          cd kernel
          # Fix-uri obligatorii pentru drivere Samsung pe bază non-Samsung
          sed -i 's/IDR_INIT/{ 0 }/g' drivers/gpu/msm/kgsl_device.h
          # Eliminăm logging-ul care va lipsi din baza Lineage
          echo -e "\n#define _perflog(...) do {} while (0)" >> include/linux/kernel.h
          # Dezactivăm Werror pentru DTS
          find arch/arm64/boot/dts -name "Makefile" -exec sed -i 's/-Werror//g' {} +

      - name: Setup Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev zstd zip gcc-aarch64-linux-gnu
          mkdir -p clang
          wget -q https://github.com/Ylarod/setup-ndk-clang/releases/download/prebuilt/clang-linux-x86-ndk-r29-r563880c.tar.zst
          tar -I zstd -xf clang-linux-x86-ndk-r29-r563880c.tar.zst -C clang

      - name: Build Kernel
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export MAKE_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=0 CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LD=ld.lld O=out"
          
          make $MAKE_ARGS r5q_defconfig
          
          # Activăm suportul de OneUI 7 pe config-ul Royna
          printf "CONFIG_EROFS_FS=y\nCONFIG_EROFS_FS_ZIP=y\nCONFIG_ANDROID_BINDERFS=y\n" >> out/.config
          make $MAKE_ARGS olddefconfig
          
          # Compilare
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-w" O=out Image.gz-dtb dtbs
