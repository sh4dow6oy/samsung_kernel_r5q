name: Build R5Q - Proton Clang BPF Hybrid
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Your Kernel (r5q)
        uses: actions/checkout@v4
        with:
          repository: Roynas-Android-Playground/kernel_samsung_r3q
          ref: master
          path: kernel
          fetch-depth: 0

      - name: Force Merge BPF 5.4 from Cat658011
        run: |
          cd kernel
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          
          git remote add bpf_source https://github.com/cat658011/linux-bpf.git
          git fetch bpf_source bpf-5.4
          
          echo "Merging BPF-5.4 branch..."
          git merge -X theirs bpf_source/bpf-5.4 -m "Integrate BPF 5.4 Backports" || true
          
          # FORȚARE FIȘIERE CRITICE
          git checkout bpf_source/bpf-5.4 -- kernel/bpf/
          git checkout bpf_source/bpf-5.4 -- net/core/filter.c
          git checkout bpf_source/bpf-5.4 -- include/linux/bpf.h
          git checkout bpf_source/bpf-5.4 -- include/uapi/linux/bpf.h
          git checkout bpf_source/bpf-5.4 -- arch/arm64/net/bpf_jit_comp.c
          
          git checkout --ours arch/arm64/configs/r5q_defconfig || echo "No config conflict"
          
          git add .
          git commit -m "BPF Hybrid: Forced BPF 5.4 logic over Samsung R3Q" || echo "No changes"

      - name: Setup Proton Clang (kdrag0n)
        run: |
          mkdir -p proton-clang
          cd proton-clang
          # Descarcă ultima versiune stabilă de Proton Clang
          curl -LO https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.tar.gz
          tar -xf master.tar.gz --strip-components=1
          echo "$GITHUB_WORKSPACE/proton-clang/bin" >> $GITHUB_PATH

      - name: Install Build Essentials
        run: |
          sudo apt-get update
          sudo apt-get install -y bc libssl-dev flex bison libelf-dev pahole zstd python3 llvm lld

      - name: Build Kernel (r5q)
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/proton-clang/bin:$PATH"
          
          # Argumente optimizate pentru Proton Clang
          MAKE_ARGS="ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            O=out"

          mkdir -p out
          make $MAKE_ARGS r5q_defconfig

          # Configurare BPF (OneUI 7 / Android 15 Ready)
          ./scripts/config --file out/.config \
            -e CONFIG_BPF \
            -e CONFIG_BPF_SYSCALL \
            -e CONFIG_BPF_JIT \
            -e CONFIG_BPF_EVENTS \
            -e CONFIG_CGROUP_BPF \
            -e CONFIG_NET_CLS_BPF \
            -e CONFIG_NET_ACT_BPF \
            -d CONFIG_SAMSUNG_RTIC \
            -d CONFIG_SECURITY_RKP \
            -d CONFIG_SECURITY_DEFEX \
            -d CONFIG_KSU \
            -d CONFIG_WERROR

          make $MAKE_ARGS olddefconfig

          # Compilare
          make -j$(nproc --all) $MAKE_ARGS Image.gz \
            DTC_FLAGS="-i" \
            KCFLAGS="-w -fcommon"

      - name: Package with AnyKernel3
        run: |
          if [ -f kernel/out/arch/arm64/boot/Image.gz ]; then
            IMAGE="kernel/out/arch/arm64/boot/Image.gz"
            git clone https://github.com/osm0sis/AnyKernel3.git AK3
            cp "$IMAGE" AK3/
            cd AK3
            sed -i 's/device.name1=maguro/device.name1=r5q/g' anykernel.sh
            sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
            zip -r9 ../R5Q-Proton-BPF.zip *
          else
            echo "Build failed!"
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-Proton-Kernel
          path: R5Q-Proton-BPF.zip
