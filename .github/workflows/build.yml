name: Build Samsung SM8150 Kernel

on:
  workflow_dispatch: # Permite pornirea manuală a build-ului

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: rawr-bpf # Branch-ul menționat de tine

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison ncurses-dev libssl-dev libelf-dev xz-utils libfl-dev python3

      - name: Setup Clang
        run: |
          mkdir clang
          cd clang
          # Descarcă un toolchain Clang stabil (exemplu: Proton Clang)
          wget https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.tar.gz
          tar -xf master.tar.gz
          echo "$(pwd)/proton-clang-master/bin" >> $GITHUB_PATH

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          
          # Definirea fișierului de config
          make O=out r5q_eur_open_defconfig
          
          # Compilarea propriu-zisă (folosim toate thread-urile disponibile)
          make -j$(nproc --all) O=out \
                      ARCH=arm64 \
                      CC=clang \
                      CROSS_COMPILE=aarch64-linux-gnu- \
                      CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Check for Image
        run: |
          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
              echo "Build successful!"
          else
              echo "Build failed! Image.gz-dtb not found."
              exit 1
          fi

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-r5q-SM8150
          path: out/arch/arm64/boot/Image.gz-dtb
