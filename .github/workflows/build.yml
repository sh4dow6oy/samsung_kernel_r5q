name: Build Roynas R5Q - ZyC Clang 15
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: Roynas-Android-Playground/kernel_samsung_r3q
          ref: master
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev \
          ccache python3 python-is-python3 libarchive-tools wget gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi libtinfo5

      - name: Setup ZyC Clang 15
        run: |
          mkdir zyc-clang
          cd zyc-clang
          # Folosim link-ul furnizat de tine
          wget https://github.com/ZyCromerZ/Clang/releases/download/15.0.7-20260208-release/Clang-15.0.7-20260208.tar.gz
          tar -xf Clang-15.0.7-20260208.tar.gz
          rm Clang-15.0.7-20260208.tar.gz

      - name: Build Kernel
        run: |
          Z_PATH=$GITHUB_WORKSPACE/zyc-clang/bin
          export PATH="$Z_PATH:$PATH"
          
          # Fix Kconfig (KernelSU missing)
          sed -i '/kernelsu/d' drivers/android/Kconfig
          
          # În cazul în care Polly dă eroare de sintaxă, forțăm redenumirea flag-ului conform sugestiei Clang
          # Acest pas asigură că build-ul nu se oprește la eroarea 'Did you mean --polly-opt-fusion=1?'
          find . -name "Makefile*" -o -name "*.mk" | xargs sed -i 's/-polly-loopfusion-greedy=1/--polly-opt-fusion=1/g'

          MAKE_ARGS="ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            O=out"

          # 1. Config
          make $MAKE_ARGS r5q_defconfig

          # 2. Patch .config (Android 15 Compatibility)
          ./scripts/config --file out/.config \
            -d CONFIG_KNOX_KAP \
            -d CONFIG_SECURITY_SAMSUNG_KNOX \
            -d CONFIG_RKP_KDP \
            -d CONFIG_SAMSUNG_PRODUCT_SHIP \
            -d CONFIG_SECURITY_DEFEX \
            -d CONFIG_CC_STACKPROTECTOR_STRONG \
            -e CONFIG_CC_STACKPROTECTOR_NONE \
            -e CONFIG_BPF -e CONFIG_BPF_SYSCALL -e CONFIG_BPF_JIT \
            -e CONFIG_CGROUP_BPF -e CONFIG_NET_CLS_BPF -e CONFIG_NET_ACT_BPF

          make $MAKE_ARGS olddefconfig

          # 3. Compilare
          clang --version
          # Folosim KCFLAGS pentru a ignora warning-urile și a forța compatibilitatea tipurilor de date
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-Wno-error -fcommon -Wno-implicit-function-declaration"

      - name: Upload Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-R5Q-ZyC15-A15
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/dtbo.img
