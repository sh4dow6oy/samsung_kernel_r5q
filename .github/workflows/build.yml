name: S10 Lite - Hybrid Upstream Build (SM8150 + R5Q Drivers)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves libncurses-dev git wget make python2 python3 pahole tar xz-utils lib32z1

      - name: Setup Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang
          echo "PROTON_PATH=$(pwd)/toolchain/proton-clang/bin" >> $GITHUB_ENV

      - name: Merge Kernel Sources
        run: |
          # 1. Descarcă baza SM8150 (Upstream)
          git clone --depth=1 https://github.com/LineageOS/android_kernel_qcom_sm8150.git kernel_base
          
          # 2. Descarcă sursa Samsung r5q (pentru drivere)
          git clone --depth=1 https://github.com/LineageOS/android_kernel_samsung_r5q.git samsung_r5q
          
          # 3. Transferăm driverele specifice Samsung în baza SM8150
          # Samsung ține de obicei driverele critice în techpack sau subfoldere specifice
          cp -r samsung_r5q/arch/arm64/configs/. kernel_base/arch/arm64/configs/
          
          # Notă: Dacă build-ul eșuează din cauza driverelor lipsă, va trebui să facem 
          # un merge mai agresiv al folderelor 'drivers/soc/qcom' și 'techpack/'.
          # Pentru început, folosim defconfig-ul r5q pe baza SM8150.

      - name: Build Kernel
        run: |
          export PATH="${{ env.PROTON_PATH }}:$PATH"
          cd kernel_base
          
          # Fix-uri de mediu obligatorii
          echo -e '#!/bin/bash\necho "0"' > /tmp/secgetspf
          chmod +x /tmp/secgetspf
          sudo mv /tmp/secgetspf /usr/bin/secgetspf
          sudo ln -sf /usr/bin/python2 /usr/bin/python

          MAKE_ARGS="
            O=out \
            ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1
          "
          
          export KCFLAGS="-Wno-error -Wno-implicit-function-declaration -Wno-int-conversion -Wno-incompatible-pointer-types"

          mkdir -p out
          
          # Încercăm să folosim defconfig-ul de r5q pe baza de sm8150
          # Dacă 'r5q_defconfig' nu există, căutăm varianta corectă în arch/arm64/configs/
          make $MAKE_ARGS r5q_defconfig || make $MAKE_ARGS lineage_r5q_defconfig || make $MAKE_ARGS vendor/r5q_eur_open_defconfig
          
          # Dezactivăm LTO și BTF pentru a evita crash-urile pe GitHub Actions
          sed -i 's/CONFIG_LTO_CLANG=y/CONFIG_LTO_CLANG=n/g' out/.config
          sed -i 's/CONFIG_LTO=y/CONFIG_LTO=n/g' out/.config
          sed -i 's/CONFIG_DEBUG_INFO_BTF=y/CONFIG_DEBUG_INFO_BTF=n/g' out/.config
          
          make $MAKE_ARGS olddefconfig
          
          # Build cu j2 (siguranță RAM)
          make -j2 $MAKE_ARGS

          if [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image ../
            [ -f out/arch/arm64/boot/dtbo.img ] && cp out/arch/arm64/boot/dtbo.img ../
            echo "SUCCESS=true" >> $GITHUB_ENV
          fi

      - name: Upload Kernel
        if: env.SUCCESS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-Hybrid-Upstream
          path: |
            Image
            dtbo.img
