name: Build S10 Lite (Lineage 23.0 + Neutron + Fixes)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source (nzlnice 23.0)
        uses: actions/checkout@v4
        with:
          repository: nzlnice/kernel_qcom_sm8150
          ref: lineage-23.0
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex git libssl-dev libelf-dev clang llvm lld zstd curl libarchive-tools

      - name: Download and Extract Neutron Clang
        run: |
          mkdir clang-neutron
          wget https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang-neutron
          echo "$GITHUB_WORKSPACE/clang-neutron/bin" >> $GITHUB_PATH

      - name: Inject Samsung r5q Config & Enable BPF
        run: |
          # 1. Luăm configurația verificată pentru S10 Lite
          curl -LSs https://raw.githubusercontent.com/mainey/android_kernel_samsung_r5q/lineage-19.0/arch/arm64/configs/r5q_eur_open_defconfig > arch/arm64/configs/vendor/r5q_samsung_defconfig
          
          # 2. Activăm flag-urile BPF pentru a repara eroarea din verifier.c
          KCONFIG=arch/arm64/configs/vendor/r5q_samsung_defconfig
          {
            echo "CONFIG_BPF=y"
            echo "CONFIG_BPF_SYSCALL=y"
            echo "CONFIG_BPF_JIT=y"
            echo "CONFIG_HAVE_EBPF_JIT=y"
            echo "CONFIG_BPF_JIT_ALWAYS_ON=y"
            echo "CONFIG_CGROUP_BPF=y"
            echo "CONFIG_NETFILTER_XT_MATCH_BPF=y"
          } >> $KCONFIG

      - name: Patch Source and Makefile (Fix Clang Errors)
        run: |
          # Eliminăm flag-urile de GCC care blochează Clang
          find . -name Makefile -exec sed -i 's/-Werror//g' {} +
          find . -name Makefile -exec sed -i 's/-implicit-function-declaration//g' {} +
          find . -name Makefile -exec sed -i 's/-unknown-warning-option//g' {} +
          find . -name Makefile -exec sed -i 's/-return-type//g' {} +
          find . -name Makefile -exec sed -i 's/-fno-var-tracking-assignments//g' {} +
          
          # Fix pentru Makefile-urile care caută GCC-ul vechi de Android
          sed -i 's/CROSS_COMPILE_ARM32 := arm-linux-androideabi-/CROSS_COMPILE_ARM32 := arm-linux-gnueabi-/g' Makefile
          sed -i 's/CROSS_COMPILE := aarch64-linux-android-/CROSS_COMPILE := aarch64-linux-gnu-/g' Makefile
          
          # Fix pentru eroarea BPF prin forțarea header-ului filter.h
          sed -i '1i #include <linux/filter.h>' kernel/bpf/verifier.c

      - name: Configure Kernel
        run: |
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=0 \
            vendor/r5q_samsung_defconfig
          
          # Aplicăm setările default pentru restul opțiunilor din L23
          make -j$(nproc --all) O=out ARCH=arm64 LLVM=1 LLVM_IAS=0 olddefconfig

      - name: Build Kernel Image
        run: |
          # Setăm LLVM_IAS=0 pentru a folosi asamblorul clasic (evită eroarea .inst)
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=0 \
            2>&1 | tee build.log

      - name: Check Build Result
        run: |
          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "SUCCESS: Image.gz-dtb created."
          else
            echo "ERROR: Kernel image not found. Check build.log"
            exit 1
          fi

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-Neutron-L23
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/dtbo.img
            build.log
