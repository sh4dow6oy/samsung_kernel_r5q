name: R5Q LumiBPF - V5 Project R5Q

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Lumi Kernel
        uses: actions/checkout@v4
        with:
          repository: LumiPlayground/android_kernel_samsung_sm8150
          ref: rawr-bpf
          path: kernel

      - name: Setup Toolchain (Neutron Clang)
        run: |
          sudo apt-get update
          sudo apt-get install -y bc libssl-dev python3 bison flex libncurses6 libncurses-dev git gcc-aarch64-linux-gnu zstd device-tree-compiler
          sudo ln -sf /usr/bin/python3 /usr/bin/python
          
          mkdir -p clang
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang

      - name: Build Phase
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          
          MAKE_ARGS="ARCH=arm64 \
                     LLVM=1 \
                     LLVM_IAS=1 \
                     CC=clang \
                     LD=ld.lld \
                     CROSS_COMPILE=aarch64-linux-gnu- \
                     CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
                     O=out"
          
          # 1. Inițializăm config-ul nativ pentru S10 Lite
          make $MAKE_ARGS r5q_eur_open_defconfig
          
          # 2. Injectăm flag-urile necesare conform Makefile-ului tău
          ./scripts/config --file out/.config \
            -e CONFIG_SEC_R5Q_PROJECT \
            -e CONFIG_BUILD_ARM64_DT_OVERLAY \
            -e CONFIG_OF_LIBFDT_OVERLAY \
            -d CONFIG_SAMSUNG_RTIC \
            -d CONFIG_WERROR
            
          make $MAKE_ARGS olddefconfig
          
          # 3. Build: Image.gz + DTBs
          # Makefile-ul tău spune că dtbo-y depinde de CONFIG_SEC_R5Q_PROJECT 
          # Compilând target-ul dtbs, Makefile-ul va genera automate fișierele .dtbo 
          make -j$(nproc --all) $MAKE_ARGS V=1 Image.gz dtbs

      - name: Assemble AnyKernel3
        run: |
          OUT="kernel/out/arch/arm64/boot"
          if [ -f "$OUT/Image.gz" ]; then
            git clone https://github.com/osm0sis/AnyKernel3.git AK3
            cp $OUT/Image.gz AK3/
            
            # Căutăm DTB-ul principal R5Q
            DTB=$(find $OUT/dts -name "*r5q*.dtb" | head -n 1)
            if [ -f "$DTB" ]; then
                cat $OUT/Image.gz $DTB > AK3/Image.gz
            fi
            
            # Colectăm overlay-urile generate conform Makefile 
            # Căutăm fișierele sm8150-sec-r5q-overlay-*.dtbo
            echo "Colectăm fișierele DTBO specifice R5Q..."
            find kernel/out/arch/arm64/boot/dts/samsung/renovation -name "sm8150-sec-r5q-overlay-*.dtbo" -exec cp {} AK3/ \;
            
            # În caz că Makefile-ul a reușit să asambleze dtbo.img
            DTBO_IMG=$(find kernel/out -name "dtbo.img" | head -n 1)
            [ -f "$DTBO_IMG" ] && cp $DTBO_IMG AK3/dtbo.img
            
            cd AK3 && zip -r9 ../R5Q_Renovation_Final.zip *
          else
            echo "Eroare: Kernel-ul nu s-a compilat!"
            exit 1
          fi

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-R5Q-Final
          path: R5Q_Renovation_Final.zip
