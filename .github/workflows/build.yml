name: S10 Lite - Hybrid Upstream (Manual Config Path)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves libncurses-dev git wget make python2 python3 pahole tar xz-utils lib32z1

      - name: Setup Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang
          echo "PROTON_PATH=$(pwd)/toolchain/proton-clang/bin" >> $GITHUB_ENV

      - name: Sync Sources
        run: |
          # 1. Clonăm baza Upstream (Lineage SM8150)
          git clone --depth=1 https://github.com/LineageOS/android_kernel_qcom_sm8150.git kernel_base
          
          # 2. Clonăm sursa Samsung r5q (pentru drivere și config)
          git clone --depth=1 https://github.com/LineageOS/android_kernel_samsung_r5q.git samsung_source
          
          # 3. Copiem manual defconfig-ul indicat de tine în baza nouă
          mkdir -p kernel_base/arch/arm64/configs/
          cp samsung_source/arch/arm64/configs/r5q_eur_open_defconfig kernel_base/arch/arm64/configs/r5q_defconfig
          
          # 4. Transferăm folderele critice pentru Samsung (Display/Camera/Battery)
          # Acestea sunt adesea în techpack sau drivers/vendor
          [ -d samsung_source/techpack ] && cp -r samsung_source/techpack kernel_base/
          echo "Configurarea r5q_defconfig a fost injectată cu succes."

      - name: Build Kernel
        run: |
          export PATH="${{ env.PROTON_PATH }}:$PATH"
          cd kernel_base
          
          # Fix Samsung Tools
          echo -e '#!/bin/bash\necho "0"' > /tmp/secgetspf
          chmod +x /tmp/secgetspf
          sudo mv /tmp/secgetspf /usr/bin/secgetspf
          sudo ln -sf /usr/bin/python2 /usr/bin/python

          MAKE_ARGS="
            O=out \
            ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1
          "
          
          export KCFLAGS="-Wno-error -Wno-implicit-function-declaration -Wno-int-conversion -Wno-incompatible-pointer-types"

          mkdir -p out
          
          # Generăm .config folosind fișierul copiat anterior
          make $MAKE_ARGS r5q_defconfig
          
          # Patch config pentru a trece de restricțiile GitHub Actions
          sed -i 's/CONFIG_LTO_CLANG=y/CONFIG_LTO_CLANG=n/g' out/.config
          sed -i 's/CONFIG_LTO=y/CONFIG_LTO=n/g' out/.config
          sed -i 's/CONFIG_DEBUG_INFO_BTF=y/CONFIG_DEBUG_INFO_BTF=n/g' out/.config
          
          make $MAKE_ARGS olddefconfig
          
          # Compilăm cu j2 (echilibru RAM/Viteză)
          make -j2 $MAKE_ARGS

          if [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image ../
            find out/arch/arm64/boot/dts/ -name "*.dtbo" -exec cp {} ../ \; || true
            echo "SUCCESS=true" >> $GITHUB_ENV
          fi

      - name: Upload Artifacts
        if: env.SUCCESS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-Hybrid-Kernel
          path: |
            Image
            *.dtbo
