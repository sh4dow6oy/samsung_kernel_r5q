name: Lumi Kernel R5Q - BPF Phase 2.2.1 (UAPI Fix & SKB)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: 1. Checkout Base (Roynas R3Q)
        uses: actions/checkout@v4
        with:
          repository: Roynas-Android-Playground/kernel_samsung_r3q
          ref: master
          fetch-depth: 0

      - name: 2. Upstream Merge BPF & Net (Fixed UAPI)
        run: |
          git config --global user.email "gh-actions@github.com"
          git config --global user.name "GitHub Actions"
          
          git remote add pascua https://github.com/pascua28/android_kernel_samsung_sm7150.git
          git fetch pascua fifteen
          
          echo "--- Splicing BPF 5.4 & Network Infrastructure ---"
          # 1. BPF CORE
          git checkout pascua/fifteen -- kernel/bpf/
          git checkout pascua/fifteen -- include/linux/bpf.h
          git checkout pascua/fifteen -- include/uapi/linux/bpf.h
          git checkout pascua/fifteen -- include/linux/filter.h
          
          # 2. NETWORKING (Rezolvă skb_metadata_len - FĂRĂ UAPI SKBUFF)
          git checkout pascua/fifteen -- include/linux/skbuff.h
          git checkout pascua/fifteen -- include/linux/netdevice.h
          git checkout pascua/fifteen -- include/uapi/linux/netdevice.h
          
          # 3. EVENTS & TRACEPOINTS (Rezolvă erorile din syscall.c)
          git checkout pascua/fifteen -- include/linux/perf_event.h
          git checkout pascua/fifteen -- include/uapi/linux/perf_event.h
          git checkout pascua/fifteen -- include/linux/tracepoint.h
          git checkout pascua/fifteen -- include/linux/bpf_trace.h
          
          # 4. CORE DEPS (MM, Cgroup, Sched)
          git checkout pascua/fifteen -- include/linux/cgroup.h
          git checkout pascua/fifteen -- include/linux/bpf-cgroup.h
          git checkout pascua/fifteen -- include/linux/mm.h
          git checkout pascua/fifteen -- include/linux/percpu.h
          git checkout pascua/fifteen -- include/linux/percpu-refcount.h
          git checkout pascua/fifteen -- include/linux/sched.h
          
          # 5. STUBS PENTRU COMPILARE
          git checkout pascua/fifteen -- include/linux/bpf_lirc.h || touch include/linux/bpf_lirc.h
          git checkout pascua/fifteen -- include/linux/psi_types.h || touch include/linux/psi_types.h
          
          git add .
          git commit -m "BPF Phase 2.2.1: Fix skbuff sync and core deps" || echo "No changes"

      - name: 3. Setup Neutron Clang
        run: |
          sudo apt-get update && sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev wget zstd zip
          mkdir clang && wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang
          
          mkdir -p bin-force
          ln -sf $(pwd)/clang/bin/clang bin-force/as
          ln -sf $(pwd)/clang/bin/ld.lld bin-force/ld
          echo "$(pwd)/bin-force" >> $GITHUB_PATH

      - name: 4. Build & Verify
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/bin-force:$PATH"
          
          # Fix KernelSU removal
          sed -i '/kernelsu/d' drivers/android/Kconfig || true
          sed -i '/kernelsu/d' drivers/android/Makefile || true
          
          # Fix flag-uri Polly
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-mllvm -polly[^ ]*//g' {} +
          
          MAKE_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang AS=clang LD=ld.lld CROSS_COMPILE=aarch64-linux-gnu- O=out"

          make $MAKE_ARGS r5q_defconfig
          
          ./scripts/config --file out/.config \
            -e CONFIG_BPF_SYSCALL \
            -e CONFIG_BPF_JIT \
            -e CONFIG_BPF_EVENTS \
            -e CONFIG_CGROUP_BPF \
            -d CONFIG_CC_STACKPROTECTOR_STRONG \
            -e CONFIG_CC_STACKPROTECTOR_NONE \
            -d CONFIG_LOCALVERSION_AUTO
            
          make $MAKE_ARGS olddefconfig

          echo "--- Compiling kernel/bpf/ ---"
          make -j$(nproc --all) $MAKE_ARGS kernel/bpf/
