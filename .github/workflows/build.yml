name: Build Roynas R5Q - Ravindu Toolchain
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: Roynas-Android-Playground/kernel_samsung_r3q
          ref: master
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev \
          ccache python3 python-is-python3 libarchive-tools wget libtinfo5

      - name: Setup Toolchains
        run: |
          # Descarcă Clang-ul recomandat (CFP Support)
          mkdir clang
          wget -q https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/clang-4639204-cfp-jopp.tar.gz
          tar -xf clang-4639204-cfp-jopp.tar.gz -C clang
          
          # Descarcă GCC-ul pentru linking și componentele de 32-bit
          mkdir gcc
          wget -q https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/gcc-cfp-jopp-only.tar.gz
          tar -xf gcc-cfp-jopp-only.tar.gz -C gcc

      - name: Build Kernel
        run: |
          # 1. Localizare dinamică a binarelor
          CLANG_BIN=$(find $GITHUB_WORKSPACE/clang -name clang -type f -printf '%h\n' | head -n 1)
          GCC_BIN=$(find $GITHUB_WORKSPACE/gcc -name "aarch64-linux-android-gcc" -type f -printf '%h\n' | head -n 1)
          GCC_32_BIN=$(find $GITHUB_WORKSPACE/gcc -name "arm-linux-androideabi-gcc" -type f -printf '%h\n' | head -n 1)
          # Linker-ul Gold (esențial pentru VDSO)
          GOLD_LD=$(find $GITHUB_WORKSPACE/gcc -name "ld.gold" -type f -printf '%p\n' | head -n 1)
          
          export PATH="$CLANG_BIN:$GCC_BIN:$GCC_32_BIN:$PATH"

          # 2. Fix Linker (Samsung caută prefixul gnu-)
          ln -sf "$GOLD_LD" "$GCC_BIN/aarch64-linux-gnu-ld.gold"
          ln -sf "$GOLD_LD" "$GCC_BIN/aarch64-linux-gnu-ld"
          ln -sf "$GOLD_LD" "$GCC_BIN/aarch64-linux-android-ld.gold"

          # 3. Nuclear Cleanup - Eliminăm flag-urile care fac Clang 6.0 să crăpe
          find . -type f \( -name "Makefile*" -o -name "*.mk" -o -name "Kconfig*" \) -exec sed -i 's/-run-dce//g' {} +
          find . -type f \( -name "Makefile*" -o -name "*.mk" -o -name "Kconfig*" \) -exec sed -i 's/-run-inliner//g' {} +
          find . -type f \( -name "Makefile*" -o -name "*.mk" -o -name "Kconfig*" \) -exec sed -i 's/-vectorizer=stripmine//g' {} +
          find . -type f \( -name "Makefile*" -o -name "*.mk" -o -name "Kconfig*" \) -exec sed -i 's/-mllvm -polly//g' {} +
          
          # Fix VDSO (Shared vs Static conflict)
          find . -type f -name "Makefile*" -exec sed -i 's/--thinlto-cache-dir=.thinlto-cache//g' {} +
          if [ -f arch/arm64/kernel/vdso/Makefile ]; then
            sed -i 's/$(disable-lto)//g' arch/arm64/kernel/vdso/Makefile
            sed -i 's/-static//g' arch/arm64/kernel/vdso/Makefile
          fi

          # Dezactivăm wrapper-ul Samsung
          sed -i 's/ifneq ($(wildcard $(srctree)\/scripts\/gcc-wrapper.py),)/ifeq (0,1)/g' Makefile

          # 4. Argumente Build (Standard Ravindu)
          MAKE_ARGS="ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-android- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            LD=aarch64-linux-android-ld.gold \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            O=out"

          # 5. Execuție Build
          make $MAKE_ARGS r5q_defconfig
          
          # Configurație pentru Android 15 (No LTO, No Knox)
          ./scripts/config --file out/.config \
            -d CONFIG_LTO -d CONFIG_LTO_CLANG -e CONFIG_LTO_NONE \
            -d CONFIG_SHADOW_CALL_STACK -d CONFIG_KNOX_KAP -d CONFIG_SECURITY_SAMSUNG_KNOX \
            -d CONFIG_SAMSUNG_PRODUCT_SHIP -d CONFIG_SECURITY_DEFEX \
            -e CONFIG_BPF -e CONFIG_BPF_SYSCALL -e CONFIG_BPF_JIT

          make $MAKE_ARGS olddefconfig
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-fcommon -fno-lto -Wno-error -Wno-unknown-warning-option"

      - name: Upload Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-Ravindu-Final
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/dtbo.img
