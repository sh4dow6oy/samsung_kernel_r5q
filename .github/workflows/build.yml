name: Samsung SM8150 Kernel Build

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04

    steps:
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev \
          ccache libncurses5-dev libncursesw5-dev zip python2 python3 python-is-python3 \
          lib32z1 wget xz-utils

      - name: Setup LLVM 10
        run: |
          wget https://github.com/llvm/llvm-project/releases/download/llvmorg-10.0.0/clang+llvm-10.0.0-x86_64-linux-gnu-ubuntu-18.04.tar.xz
          tar -xf clang+llvm-10.0.0-x86_64-linux-gnu-ubuntu-18.04.tar.xz
          mv clang+llvm-10.0.0-x86_64-linux-gnu-ubuntu-18.04 llvm-toolchain
          echo "$(pwd)/llvm-toolchain/bin" >> $GITHUB_PATH

      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: LumiPlayground/android_kernel_samsung_sm8150
          ref: rawr-bpf
          path: kernel

      - name: Checkout GCC Toolchain
        uses: actions/checkout@v4
        with:
          repository: Adrilaw/aarch64-linux-android-4.9-toolchain
          ref: master
          path: toolchain

      - name: Patch Source Code
        run: |
          cd kernel
          sed -i 's/#elif$/#else/g' kernel/taskstats.c
          sed -i 's/extern inline bool need_memory_boosting/static inline bool need_memory_boosting/g' include/linux/mm.h
          sed -i 's/%u|%u rec:%lu|%lu/%llu|%u rec:%lu|%lu/g' mm/page_alloc.c

      - name: Compile Kernel
        run: |
          cd kernel
          mkdir -p out
          
          export KERNEL_ROOT=$(pwd)
          export BUILD_CROSS_COMPILE=$KERNEL_ROOT/../toolchain/bin/aarch64-linux-android-
          export KERNEL_LLVM_BIN=$KERNEL_ROOT/../llvm-toolchain/bin/clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export KCFLAGS="-Wno-error -Wno-format -Wno-deprecated-declarations -Wno-incompatible-pointer-types -D_FORTIFY_SOURCE=0"
          
          KERNEL_MAKE_ENV="DTC_EXT=$KERNEL_ROOT/scripts/dtc/dtc CONFIG_BUILD_ARM64_DT_OVERLAY=y"

          make -j$(nproc) -C $KERNEL_ROOT O=$KERNEL_ROOT/out $KERNEL_MAKE_ENV \
            ARCH=arm64 CROSS_COMPILE=$BUILD_CROSS_COMPILE REAL_CC=$KERNEL_LLVM_BIN \
            CLANG_TRIPLE=$CLANG_TRIPLE r5q_eur_open_defconfig

          scripts/config --file out/.config --enable CONFIG_BPF_SYSCALL
          scripts/config --file out/.config --enable CONFIG_TASKSTATS
          scripts/config --file out/.config --enable CONFIG_TASK_DELAY_ACCT
          scripts/config --file out/.config --enable CONFIG_TASK_XACCT
          scripts/config --file out/.config --enable CONFIG_TASK_IO_ACCOUNTING
          
          make -j$(nproc) -C $KERNEL_ROOT O=$KERNEL_ROOT/out $KERNEL_MAKE_ENV \
            ARCH=arm64 CROSS_COMPILE=$BUILD_CROSS_COMPILE REAL_CC=$KERNEL_LLVM_BIN \
            CLANG_TRIPLE=$CLANG_TRIPLE olddefconfig

          make -j$(nproc) -C $KERNEL_ROOT O=$KERNEL_ROOT/out $KERNEL_MAKE_ENV \
            ARCH=arm64 CROSS_COMPILE=$BUILD_CROSS_COMPILE REAL_CC=$KERNEL_LLVM_BIN \
            CLANG_TRIPLE=$CLANG_TRIPLE KCFLAGS="$KCFLAGS"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-SM8150-r5q
          path: |
            kernel/out/arch/arm64/boot/Image.gz*
            kernel/out/arch/arm64/boot/dtbo.img
