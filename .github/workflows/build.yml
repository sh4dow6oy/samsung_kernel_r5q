name: S10 Lite - 4.19 Hybrid (Techpack Injection)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves libncurses-dev git wget make python2 python3 pahole tar xz-utils lib32z1

      - name: Setup Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang
          echo "PROTON_PATH=$(pwd)/toolchain/proton-clang/bin" >> $GITHUB_ENV

      - name: Hybrid Source Preparation
        run: |
          # 1. Clonare Baza de Kernel 4.19 (Motorul)
          git clone --depth=1 https://github.com/duckyduckG/android_kernel_qcom_sm8150_419.git kernel_source
          
          # 2. Clonare Sursa de Drivere (Techpack-ul optimizat)
          git clone --depth=1 https://github.com/sh4dow6oy/samsung_kernel_r5q.git drivers_source
          
          # 3. Clonare Sursa Samsung (doar pentru Config si DTS)
          git clone --depth=1 https://github.com/mainey/android_kernel_samsung_r5q.git samsung_ref
          
          # 4. Inlocuire Techpack (Injectam driverele bune peste cele vechi)
          rm -rf kernel_source/techpack
          cp -r drivers_source/techpack kernel_source/
          
          # 5. Injectare Config si DTS
          cp samsung_ref/arch/arm64/configs/r5q_eur_open_defconfig kernel_source/arch/arm64/configs/r5q_defconfig
          mkdir -p kernel_source/arch/arm64/boot/dts/vendor/qcom/
          find samsung_ref/arch/arm64/boot/dts/ -maxdepth 1 -type f -name "*.dts*" -exec cp {} kernel_source/arch/arm64/boot/dts/vendor/qcom/ \;
          
          cd kernel_source

          # === FIX CLK-DEBUG TRACE ===
          sed -i 's|#define TRACE_INCLUDE_PATH .|#define TRACE_INCLUDE_PATH ../../drivers/clk/qcom|g' drivers/clk/qcom/clk-debug.c

          # === FIX DISPLAY USBPD (Missing errno.h) ===
          sed -i '15i #include <linux/errno.h>' include/linux/usb/usbpd.h
          # Cautam si fixam in noul techpack injectat
          find techpack/display/ -name "dp_usbpd.c" -exec sed -i '10i #include <linux/errno.h>' {} +

          # === LINKING TECHPACK IN MAKEFILE ===
          # Ne asiguram ca Makefile-ul bazei 4.19 stie sa compileze noul folder techpack
          if ! grep -q "techpack" Makefile; then
            sed -i 's/^core-y[[:space:]]*:=/core-y := techpack\/ /' Makefile
          fi
          
          # Fix Samsung SecTools
          echo -e '#!/bin/bash\necho "0"' > /tmp/secgetspf
          chmod +x /tmp/secgetspf
          sudo mv /tmp/secgetspf /usr/bin/secgetspf

      - name: Build Kernel
        run: |
          export PATH="${{ env.PROTON_PATH }}:$PATH"
          cd kernel_source
          ARGS="ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1"
          export KCFLAGS="-Wno-error -Wno-implicit-function-declaration -Wno-int-conversion -Wno-incompatible-pointer-types -Wno-unused-variable -Wno-unused-function -Wno-return-type"

          make $ARGS r5q_defconfig
          
          # Dezactivare LTO/BTF pentru viteza
          sed -i 's/CONFIG_LTO_CLANG=y/CONFIG_LTO_CLANG=n/g' .config
          sed -i 's/CONFIG_LTO=y/CONFIG_LTO=n/g' .config
          sed -i 's/CONFIG_DEBUG_INFO_BTF=y/CONFIG_DEBUG_INFO_BTF=n/g' .config
          
          make $ARGS olddefconfig
          make -j$(nproc --all) $ARGS

          if [ -f arch/arm64/boot/Image ]; then
            cp arch/arm64/boot/Image ../
            find arch/arm64/boot/dts/vendor/qcom/ -name "*.dtbo" -exec cp {} ../ \; || true
            echo "SUCCESS=true" >> $GITHUB_ENV
          fi

      - name: Upload
        if: env.SUCCESS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-4.19-Techpack-Injected
          path: |
            Image
            *.dtbo
