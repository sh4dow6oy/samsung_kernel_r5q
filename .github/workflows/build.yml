name: Build Samsung SM8150 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        repository: LumiPlayground/android_kernel_samsung_sm8150
        ref: auriana
        path: kernel

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm libncurses-dev

    - name: Download Me2 Toolchain
      run: |
        git clone https://github.com/mk7x7/Me2.git toolchain
        # Extragem calea absolută
        echo "TC_BIN=$(pwd)/toolchain/toolchain/bin" >> $GITHUB_ENV

    - name: Build Kernel
      run: |
        cd kernel
        
        TC_BIN=${{ env.TC_BIN }}
        # Adăugăm toolchain-ul la începutul PATH-ului în mod agresiv
        export PATH="$TC_BIN:$PATH"
        
        export ARCH=arm64
        export SUBARCH=arm64
        
        # Definirea riguroasă a uneltelor
        # Notă: Am adăugat LD, AS, AR, etc. pentru a nu lăsa kernelul să le caute în sistem
        export KERNEL_MAKE_ENV="DTC_EXT=$(pwd)/scripts/dtc/dtc \
                                CONFIG_BUILD_ARM64_DT_OVERLAY=y \
                                CC=clang \
                                HOSTCC=clang \
                                CLANG_TRIPLE=aarch64-linux-gnu- \
                                CROSS_COMPILE=$TC_BIN/aarch64-linux-android- \
                                CROSS_COMPILE_ARM32=$TC_BIN/arm-linux-androideabi- \
                                LD=$TC_BIN/ld.lld \
                                AS=$TC_BIN/llvm-as \
                                AR=$TC_BIN/llvm-ar \
                                NM=$TC_BIN/llvm-nm \
                                OBJCOPY=$TC_BIN/llvm-objcopy \
                                OBJDUMP=$TC_BIN/llvm-objdump \
                                STRIP=$TC_BIN/llvm-strip"

        # 1. Configurare prin CAT
        cat arch/arm64/configs/sm8150_sec_defconfig arch/arm64/configs/sm8150_sec_r5q_eur_open.config > arch/arm64/configs/combined_defconfig
        
        # Dezactivăm manual STACKPROTECTOR dacă toolchain-ul e încăpățânat
        # Multe kernel-uri vechi dau eroarea asta cu compilatoare noi
        echo "CONFIG_CC_STACKPROTECTOR_NONE=y" >> arch/arm64/configs/combined_defconfig
        echo "# CONFIG_CC_STACKPROTECTOR_STRONG is not set" >> arch/arm64/configs/combined_defconfig
        
        make O=out $KERNEL_MAKE_ENV combined_defconfig
        make O=out $KERNEL_MAKE_ENV olddefconfig
        
        # 2. Build
        # Folosim -i pentru a ignora erorile minore de asamblare și KCFLAGS pentru compatibilitate
        make -j$(nproc --all) O=out $KERNEL_MAKE_ENV KCFLAGS="-w -fno-stack-protector"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-SM8150-r5q
        path: |
          kernel/out/arch/arm64/boot/Image.gz-dtb
          kernel/out/arch/arm64/boot/dtbo.img
          kernel/out/.config
