name: S10 Lite (Royna + Pascua BPF Backport)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Royna (S10 Lite Base)
        uses: actions/checkout@v4
        with:
          repository: Roynas-Android-Playground/kernel_samsung_r3q
          ref: master
          path: main

      - name: Checkout Pascua BPF Branch
        uses: actions/checkout@v4
        with:
          repository: pascua28/android_kernel_samsung_sm7150
          ref: bpf
          path: bpf_source

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex git libssl-dev libelf-dev clang llvm lld zstd curl libarchive-tools

      - name: Download Neutron Clang
        run: |
          mkdir clang-neutron
          wget https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang-neutron
          echo "$GITHUB_WORKSPACE/clang-neutron/bin" >> $GITHUB_PATH

      - name: Advanced BPF Backport Merge
        run: |
          # Curățăm vechiul subsistem BPF din Royna
          rm -rf main/kernel/bpf
          rm -rf main/include/linux/bpf*
          rm -rf main/include/uapi/linux/bpf*
          
          # Injectăm noul cod de backport de la Pascua
          cp -r bpf_source/kernel/bpf main/kernel/
          cp bpf_source/include/linux/bpf* main/include/linux/
          cp bpf_source/include/uapi/linux/bpf* main/include/uapi/linux/
          cp bpf_source/include/linux/filter.h main/include/linux/
          
          # Important: Copiem și scripturile de generare BPF dacă există
          cp bpf_source/scripts/bpf_helpers_doc.py main/scripts/ 2>/dev/null || true

      - name: Nuclear Patching (Neutron Fixes)
        run: |
          cd main
          # Eliminăm wrapper-ul problematic
          rm -f scripts/gcc-wrapper.py
          
          # Fix pentru directivele de asamblare .inst care crapă în Neutron
          find arch/arm64 -name "*.S" -exec sed -i 's/\.inst\.w/.inst/g' {} +
          
          # Curățăm Makefile-urile de flag-uri GCC invalide
          find . -type f -name "Makefile*" -exec sed -i 's/-Werror//g' {} +
          find . -type f -name "Makefile*" -exec sed -i 's/-W[^ ]*unknown-warning-option//g' {} +
          find . -type f -name "Makefile*" -exec sed -i 's/-W[^ ]*return-type//g' {} +

      - name: Configure and Build
        run: |
          cd main
          export ARGS="ARCH=arm64 \
                O=out \
                CC=clang \
                LD=ld.lld \
                AR=llvm-ar \
                NM=llvm-nm \
                OBJCOPY=llvm-objcopy \
                OBJDUMP=llvm-objdump \
                STRIP=llvm-strip \
                CLANG_TRIPLE=aarch64-linux-gnu- \
                CROSS_COMPILE=aarch64-linux-gnu- \
                CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
                LLVM=1 \
                LLVM_IAS=0"

          # Activăm suportul BPF complet în defconfig-ul r5q
          KCONFIG=arch/arm64/configs/r5q_defconfig
          sed -i '/CONFIG_BPF/d' $KCONFIG
          {
            echo "CONFIG_BPF=y"
            echo "CONFIG_BPF_SYSCALL=y"
            echo "CONFIG_BPF_JIT=y"
            echo "CONFIG_HAVE_EBPF_JIT=y"
            echo "CONFIG_BPF_JIT_ALWAYS_ON=y"
            echo "CONFIG_NET_CLS_BPF=y"
          } >> $KCONFIG

          make -j$(nproc --all) $ARGS r5q_defconfig
          make -j$(nproc --all) $ARGS 2>&1 | tee build.log

      - name: Upload Kernel Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-Royna-Pascua-BPF
          path: |
            main/out/arch/arm64/boot/Image.gz-dtb
            main/out/arch/arm64/boot/dtbo.img
            main/build.log
