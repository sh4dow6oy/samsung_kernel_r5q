name: S10 Lite - Pascua Hybrid (Headers & Path Fix)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves make python3 lz4
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang

      - name: Apply Pascua eBPF 5.1 (Full)
        run: |
          git remote add linux-stable https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git || true
          git fetch linux-stable linux-5.1.y --depth=1
          PATHS=(
            "kernel/bpf/" 
            "include/linux/bpf.h" 
            "include/linux/filter.h" 
            "include/linux/bpf_verifier.h"
            "include/linux/tnum.h"
            "include/uapi/linux/bpf.h" 
            "include/uapi/linux/btf.h"
            "include/linux/btf.h"
            "include/linux/bpf-cgroup.h"
          )
          for path in "${PATHS[@]}"; do git checkout FETCH_HEAD -- "$path" || echo "Skip: $path"; done

      - name: Manual Header Injection (Fix missing LIRC)
        run: |
          # Creăm headerele lipsă direct în sursă pentru a fi vizibile de orice build stage
          mkdir -p include/linux/
          echo "/* Dummy Header */" > include/linux/bpf_lirc.h
          echo "/* Dummy Header */" > include/linux/perflog.h
          
          # Fix access_ok mismatch (3 args vs 2 args)
          # Aplicăm sed direct pe fișierul syscall.c descărcat
          sed -i 's/access_ok(uaddr, actual_size)/__access_ok_bpf(uaddr, actual_size)/g' kernel/bpf/syscall.c
          sed -i 's/access_ok(uattr, size)/__access_ok_bpf(uattr, size)/g' kernel/bpf/syscall.c
          # Injectăm definitia imediat după headerele standard
          sed -i '/#include <linux\/uaccess.h>/a #define __access_ok_bpf(addr, size) __range_ok((unsigned long)(addr), size)' kernel/bpf/syscall.c

          # Bypass erori structură Verifier (btp)
          sed -i 's/btp->tp->name/""/g' kernel/bpf/syscall.c
          sed -i 's/btp = bpf_get_raw_tracepoint(tp_name);/btp = (void *)0;/g' kernel/bpf/syscall.c
          
          # Fix tnum mismatch
          sed -i '1i #include <linux/tnum.h>' kernel/bpf/verifier.c
          sed -i '1i #include <linux/bpf_verifier.h>' kernel/bpf/verifier.c

      - name: Build S10 Lite Hybrid
        run: |
          export PATH=$(pwd)/toolchain/proton-clang/bin:$PATH
          # O=out tinde să ignore headerele noi dacă nu sunt în rădăcina sursei
          MAKE_ARGS="O=out ARCH=arm64 CC=clang HOSTCC=gcc CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1"
          export KCFLAGS="-Wno-error -Wno-incompatible-pointer-types -Wno-int-conversion -Wno-implicit-function-declaration -Wno-return-type -Wno-macro-redefined"

          make $MAKE_ARGS r5q_eur_open_defconfig
          
          # Configurații necesare pentru BPF în Android 15
          ./scripts/config --file out/.config --disable CONFIG_MODVERSIONS
          ./scripts/config --file out/.config --enable CONFIG_BPF_SYSCALL
          ./scripts/config --file out/.config --enable CONFIG_BPF_JIT
          ./scripts/config --file out/.config --enable CONFIG_CGROUP_BPF
          ./scripts/config --file out/.config --disable CONFIG_SAMSUNG_PRODUCT_SHIP
          
          make $MAKE_ARGS olddefconfig
          # Forțăm build-ul; dacă pică, j1 ne va arăta exact linia
          make -j$(nproc --all) $MAKE_ARGS Image.gz-dtb || make -j1 $MAKE_ARGS Image.gz-dtb

      - name: Upload Build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-A15-Hybrid-Final
          path: out/arch/arm64/boot/Image.gz-dtb
          
