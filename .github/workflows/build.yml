name: S10 Lite Kernel Build - v118 (A15 BPF Source)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Mainey Source
        uses: actions/checkout@v4
        with:
          repository: mainey/android_kernel_samsung_r5q
          ref: lineage-18.1
          path: kernel-res
          fetch-depth: 1

      - name: Setup Proton Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves make python3 lz4 perl git curl
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang

      - name: Sync BPF from Lineage 22 (msm-4.14)
        run: |
          # Clonăm doar folderele critice de BPF din repo-ul menționat de tine
          git clone --depth=1 -b lineage-22.0 https://github.com/LineageOS/android_kernel_google_msm-4.14 bpf_source
          
          cd kernel-res
          # Înlocuim subsistemul BPF vechi cu cel compatibil Android 15
          rm -rf kernel/bpf/ net/core/filter.c
          cp -r ../bpf_source/kernel/bpf/ kernel/
          cp ../bpf_source/net/core/filter.c net/core/filter.c
          cp ../bpf_source/include/linux/bpf* include/linux/
          cp ../bpf_source/include/uapi/linux/bpf* include/uapi/linux/

      - name: Fix Camera & Compiler
        run: |
          cd kernel-res
          # Fix variabila 'i' ISP
          find drivers/media -name "cam_vfe_bus_ver3.c" -exec sed -i 's/uint32_t                     i;/uint32_t                     i = 0;/g' {} +
          # Fix redefinire macro
          sed -i '/#define __builtin_assume_aligned/d' include/linux/compiler-clang.h

      - name: Configure for Android 15
        run: |
          cd kernel-res
          # Activăm setările obligatorii pentru noul cod BPF
          ./scripts/config --file arch/arm64/configs/r5q_eur_open_defconfig --enable CONFIG_BPF_SYSCALL
          ./scripts/config --file arch/arm64/configs/r5q_eur_open_defconfig --enable CONFIG_BPF_JIT
          ./scripts/config --file arch/arm64/configs/r5q_eur_open_defconfig --enable CONFIG_CGROUP_BPF
          ./scripts/config --file arch/arm64/configs/r5q_eur_open_defconfig --enable CONFIG_NETFILTER_XT_MATCH_BPF
          ./scripts/config --file arch/arm64/configs/r5q_eur_open_defconfig --enable CONFIG_BPF_STREAM_PARSER
          ./scripts/config --file arch/arm64/configs/r5q_eur_open_defconfig --enable CONFIG_NET_CLS_BPF
          
          # Dezactivăm Samsung Knox/RKP care ar putea intra în conflict cu noul BPF
          ./scripts/config --file arch/arm64/configs/r5q_eur_open_defconfig --disable CONFIG_SECURITY_SAMSUNG_RKP

      - name: Build Kernel
        run: |
          cd kernel-res
          export PATH=$(pwd)/../toolchain/proton-clang/bin:$PATH
          MAKE_ARGS="ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1"
          export KCFLAGS="-Wno-everything -Wno-error -Wno-macro-redefined -Wno-implicit-function-declaration"

          make $MAKE_ARGS r5q_eur_open_defconfig
          make -j$(nproc --all) $MAKE_ARGS Image.gz-dtb || make -j$(nproc --all) $MAKE_ARGS Image.gz

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-A15-BPF-Lineage22
          path: |
            kernel-res/arch/arm64/boot/Image.gz-dtb
            kernel-res/arch/arm64/boot/Image.gz
