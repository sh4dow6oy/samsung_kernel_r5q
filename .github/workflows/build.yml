name: R5Q LumiBPF - V53 Permissions Fix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Kernel
        uses: actions/checkout@v4
        with:
          repository: sh4dow6oy/android_kernel_samsung_sm8150
          ref: rawr-bpf
          path: kernel

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev \
          ccache python3 python-is-python3 libarchive-tools wget zstd libtinfo6 zip \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi device-tree-compiler rsync git

      - name: Setup Toolchain (Neutron Clang)
        run: |
          mkdir -p clang
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang

      - name: Build Kernel & Permission Fix
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          MAKE_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- O=out"
          
          make $MAKE_ARGS r5q_eur_open_defconfig
          
          # Suport Android 15
          ./scripts/config --file out/.config \
            -e CONFIG_SEC_R5Q_PROJECT \
            -e CONFIG_BPF_JIT \
            -e CONFIG_BPF_JIT_ALWAYS_ON \
            -e CONFIG_BUILD_ARM64_DT_OVERLAY \
            -d CONFIG_SAMSUNG_RTIC
            
          make $MAKE_ARGS olddefconfig
          make -j$(nproc --all) $MAKE_ARGS Image.gz dtbs KCFLAGS="-w -fcommon"

          # --- FIX PERMISIUNI ȘI GENERARE MANUALA ---
          echo "Reparăm permisiunile pentru scripturile de build..."
          find scripts -name "*.py" -exec chmod +x {} \;
          find scripts -name "*.sh" -exec chmod +x {} \;

          echo "Colectăm toate fișierele .dtbo generate..."
          # Căutăm recursiv în folderul 'out' pentru a găsi toate fragmentele hardware
          DTBO_FILES=$(find out -name "*.dtbo")
          
          if [ -n "$DTBO_FILES" ]; then
            MKDTBOIMG=$(find scripts -name "mkdtboimg.py" | head -n 1)
            if [ -n "$MKDTBOIMG" ]; then
              python3 "$MKDTBOIMG" create out/arch/arm64/boot/dtbo.img $DTBO_FILES
              echo "SUCCESS: dtbo.img a fost creat."
            fi
          else
            echo "AVERTISMENT: Nu s-au găsit fișiere .dtbo pentru a crea imaginea!"
          fi

      - name: Assemble AnyKernel3
        run: |
          AK3_DIR="AK3"
          git clone https://github.com/osm0sis/AnyKernel3.git $AK3_DIR
          
          # 1. Kernel
          find kernel/out -name "Image.gz" -exec cp {} $AK3_DIR/ \;
          
          # 2. DTBO (Imagine sau fișiere individuale ca Fallback)
          if [ -f "kernel/out/arch/arm64/boot/dtbo.img" ]; then
            cp kernel/out/arch/arm64/boot/dtbo.img $AK3_DIR/
          else
            find kernel/out -name "*.dtbo" -exec cp {} $AK3_DIR/ \;
          fi
          
          # 3. DTB principal
          DTB_PATH=$(find kernel/out -name "sm8150-v2.dtb" -o -name "sm8150.dtb" | head -n 1)
          [ -f "$DTB_PATH" ] && cp "$DTB_PATH" $AK3_DIR/dtb
          
          cd $AK3_DIR
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          zip -r9 ../R5Q_A15_V53_Final.zip *

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-A15-V53
          path: R5Q_A15_V53_Final.zip
