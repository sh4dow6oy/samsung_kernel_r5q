name: S10 Lite Kernel Build - v133 (Precise Patching)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: mainey/android_kernel_samsung_r5q
          ref: lineage-18.1
          path: kernel-res
          fetch-depth: 1

      - name: Setup Proton Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves make python3 lz4 perl git curl
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang

      - name: Manual eBPF Definitions (Fixing the 20 Errors)
        run: |
          cd kernel-res
          # In loc sa copiem fisiere, injectam DOAR ce a lipsit in log-ul tau:
          
          # 1. Definitii de baza in bpf.h
          sed -i '/#define _LINUX_BPF_H/a #include <linux/types.h>\ntypedef unsigned int __poll_t;' include/linux/bpf.h
          
          # 2. Adaugam constantele care au dat "undeclared identifier"
          echo "#define BPF_OBJ_NAME_LEN 16U" >> include/uapi/linux/bpf.h
          echo "#define BPF_F_RDONLY_PROG (1U << 7)" >> include/uapi/linux/bpf.h
          echo "#define BPF_F_WRONLY_PROG (1U << 8)" >> include/uapi/linux/bpf.h
          
          # 3. Fix structural pentru spin_lock (forward declaration)
          sed -i '/struct bpf_map {/i struct bpf_spin_lock { u32 val; };' include/linux/bpf.h

      - name: Architect's Surgical Prep
        run: |
          cd kernel-res
          # Dezactivam modulele de debug care au dat erori
          find drivers/gpu/drm/msm/samsung -name Makefile -exec sed -i 's/obj-y += ss_dsi_panel_debug.o/#/g' {} +
          sed -i 's/obj-$(CONFIG_HID_TRACE)/#/g' drivers/hid/Makefile
          
          # Firmware Stubs (y771)
          mkdir -p firmware/tsp_sec
          touch firmware/tsp_sec/y771_r5.bin
          touch firmware/tsp_sec/y771_r5_1l.bin
          
          # Clang Compiler Fix
          echo "#define __builtin_assume_aligned(x, ...) (x)" >> include/linux/compiler-clang.h

      - name: Build Kernel (Safe Mode)
        run: |
          cd kernel-res
          export PATH=$(pwd)/../toolchain/proton-clang/bin:$PATH
          make ARCH=arm64 CC=clang r5q_eur_open_defconfig
          
          # Activam doar strictul necesar pentru boot
          ./scripts/config --enable CONFIG_BPF_SYSCALL
          ./scripts/config --enable CONFIG_BPF_JIT
          ./scripts/config --disable CONFIG_SECURITY_SAMSUNG_RKP
          
          make ARCH=arm64 CC=clang olddefconfig
          
          MAKE_ARGS="ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1"
          # Ignoram erorile OpenSSL si warning-urile de tip
          export KCFLAGS="-Wno-everything -Wno-error -Wno-implicit-function-declaration"

          make -j$(nproc --all) $MAKE_ARGS Image.gz-dtb || make -j$(nproc --all) $MAKE_ARGS Image.gz

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-A15-Minimalist-v133
          path: |
            kernel-res/arch/arm64/boot/Image.gz-dtb
            kernel-res/arch/arm64/boot/Image.gz
