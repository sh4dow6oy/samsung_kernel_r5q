name: Build Roynas R5Q - Neutron A15
on:
  workflow_dispatch:

jobs:
  build:
    # Schimbăm pe 24.04 pentru a avea GLIBC 2.38+ necesar pentru Neutron
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: Roynas-Android-Playground/kernel_samsung_r3q
          ref: master
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev \
          ccache python3 libarchive-tools wget libtinfo6 zstd

      - name: Setup Neutron Clang
        run: |
          mkdir neutron
          # Versiunea ta de Neutron (10032024)
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C neutron
          rm neutron-clang-10032024.tar.zst

      - name: Setup GCC Prebuilts (Firefly)
        run: |
          git clone https://github.com/Firefly-rk-linux/prebuilts-gcc-linux-x86-aarch64-gcc-arm-10.3-2021.07-x86_64-aarch64-none-linux-gnu.git --depth=1 gcc64
          git clone https://github.com/Firefly-rk-linux/prebuilts-gcc-linux-x86-arm-gcc-arm-10.3-2021.07-x86_64-arm-none-linux-gnueabihf.git --depth=1 gcc32

      - name: Build Kernel
        run: |
          TOOLCHAIN_DIR=$GITHUB_WORKSPACE/neutron/bin
          GCC64_DIR=$GITHUB_WORKSPACE/gcc64/bin
          GCC32_DIR=$GITHUB_WORKSPACE/gcc32/bin

          # Symlinks necesare pentru wrapper-ul Samsung
          ln -s ${GCC64_DIR}/aarch64-none-linux-gnu-gcc ${GCC64_DIR}/aarch64-linux-gnu-gcc
          ln -s ${GCC32_DIR}/arm-none-linux-gnueabihf-gcc ${GCC32_DIR}/arm-linux-gnueabi-gcc

          # Cleanup Polly & KernelSU
          find . -type f \( -name "Makefile*" -o -name "*.mk" -o -name "Kconfig*" \) -exec sed -i 's/-polly-loopfusion-greedy=1//g' {} +
          find . -type f \( -name "Makefile*" -o -name "*.mk" -o -name "Kconfig*" \) -exec sed -i 's/-mllvm -polly//g' {} +
          sed -i '/kernelsu/d' drivers/android/Kconfig
          sed -i '/kernelsu/d' drivers/android/Makefile
          sed -i 's/ifneq ($(wildcard $(srctree)\/scripts\/gcc-wrapper.py),)/ifeq (0,1)/g' Makefile

          MAKE_ARGS="ARCH=arm64 \
            CC=${TOOLCHAIN_DIR}/clang \
            LD=${TOOLCHAIN_DIR}/ld.lld \
            AR=${TOOLCHAIN_DIR}/llvm-ar \
            NM=${TOOLCHAIN_DIR}/llvm-nm \
            OBJCOPY=${TOOLCHAIN_DIR}/llvm-objcopy \
            OBJDUMP=${TOOLCHAIN_DIR}/llvm-objdump \
            STRIP=${TOOLCHAIN_DIR}/llvm-strip \
            CROSS_COMPILE=${GCC64_DIR}/aarch64-none-linux-gnu- \
            CROSS_COMPILE_ARM32=${GCC32_DIR}/arm-none-linux-gnueabihf- \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            O=out"

          # Config & Patch
          make $MAKE_ARGS r5q_defconfig
          
          ./scripts/config --file out/.config \
            -d CONFIG_KNOX_KAP \
            -d CONFIG_SECURITY_SAMSUNG_KNOX \
            -d CONFIG_RKP_KDP \
            -d CONFIG_SAMSUNG_PRODUCT_SHIP \
            -d CONFIG_SECURITY_DEFEX \
            -d CONFIG_CC_STACKPROTECTOR_STRONG \
            -e CONFIG_CC_STACKPROTECTOR_NONE \
            -e CONFIG_BPF -e CONFIG_BPF_SYSCALL -e CONFIG_BPF_JIT \
            -e CONFIG_CGROUP_BPF -e CONFIG_NET_CLS_BPF -e CONFIG_NET_ACT_BPF

          make $MAKE_ARGS olddefconfig
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-fcommon -Wno-error -Wno-unused-command-line-argument"

      - name: Upload Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-Neutron-A15-Success
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/dtbo.img
