name: Build Roynas R5Q - Proton Clang Full BPF
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc "/usr/local/share/boost"
          sudo docker image prune -a -f
          sudo apt-get clean

      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: sh4dow6oy/android_kernel_qcom_sm8150_419
          ref: master
          path: kernel
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves make python3 lz4 rsync libncurses5-dev git build-essential wget zip

      - name: Setup Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang

      - name: Build Kernel
        run: |
          cd kernel
          # Setam PATH si variabilele de mediu global pentru acest pas
          export TC_PATH="$GITHUB_WORKSPACE/toolchain/proton-clang/bin"
          export PATH="$TC_PATH:$PATH"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/toolchain/proton-clang/lib:$LD_LIBRARY_PATH"
          
          # Parametrii de Build - Mutam definitiile in variabile de mediu EXPORTATE
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER=Roynas
          export KBUILD_BUILD_HOST=Github-Actions
          
          # Fix pentru eroarea CC_HAS_K_CONSTRAINT: forțăm Makefile să vadă Clang
          export REAL_CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          # Definim argumentele de make (fără duplicate)
          MAKE_ARGS="O=out \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            LLVM=1 \
            LLVM_IAS=1 \
            HOSTCC=gcc \
            HOSTCXX=g++"

          # 1. Cleanup Makefile-uri
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-mllvm -polly[^ ]*//g' {} +
          sed -i 's/ifneq ($(wildcard $(srctree)\/scripts\/gcc-wrapper.py),)/ifeq (0,1)/g' Makefile

          # 2. Configurare
          mkdir -p out
          make $MAKE_ARGS r5q_defconfig

          # 3. Config eBPF
          ./scripts/config --file out/.config \
            -e CONFIG_BPF \
            -e CONFIG_BPF_SYSCALL \
            -e CONFIG_BPF_JIT \
            -e CONFIG_HAVE_EBPF_JIT \
            -e CONFIG_CGROUP_BPF \
            -d CONFIG_SECURITY_SAMSUNG_RKP
            
          make $MAKE_ARGS olddefconfig

          # 4. Compilare
          # Adăugăm -Wno-error pentru a trece de orice avertisment în codul Qualcomm
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-fcommon -Wno-error -Wno-everything"

      - name: Package with AnyKernel3
        if: success()
        run: |
          cd kernel
          [ -f "out/arch/arm64/boot/Image.gz-dtb" ] && IMG="out/arch/arm64/boot/Image.gz-dtb" || IMG="out/arch/arm64/boot/Image.gz"
          
          git clone https://github.com/osm0sis/AnyKernel3.git
          cp $IMG AnyKernel3/Image.gz
          [ -f "out/arch/arm64/boot/dtbo.img" ] && cp out/arch/arm64/boot/dtbo.img AnyKernel3/dtbo.img

          sed -i 's/^device.name1=.*/device.name1=r5q/' AnyKernel3/anykernel.sh
          sed -i 's/^device.name2=.*/device.name2=SM-G770F/' AnyKernel3/anykernel.sh
          
          cd AnyKernel3
          zip -r9 ../Kernel-S10Lite-R5Q-BPF.zip *

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-S10Lite-R5Q
          path: Kernel-S10Lite-R5Q-BPF.zip
