name: R5Q BPF Cherry-Pick Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Base (R5Q 4.14)
        uses: actions/checkout@v4
        with:
          repository: sh4dow6oy/kernel_samsung_r5q
          ref: master
          fetch-depth: 0

      - name: Fetch & Sync BPF Folders
        run: |
          git config --global user.name "sh4dow6oy"
          git config --global user.email "109531621+sh4dow6oy@users.noreply.github.com"
          
          # Adăugăm sursa BPF
          git remote add bpf_provider https://github.com/pascua28/android_kernel_samsung_sm7150.git
          git fetch bpf_provider bpf-5.10
          
          # În loc de merge, forțăm folderele critice pentru BPF să fie ca în sursa de 4.14.355
          # Asta aduce suportul eBPF fără a atinge mm.h (evităm eroarea vm_sequence)
          git checkout bpf_provider/bpf-5.10 -- kernel/bpf/
          git checkout bpf_provider/bpf-5.10 -- net/core/filter.c
          git checkout bpf_provider/bpf-5.10 -- include/linux/bpf.h
          git checkout bpf_provider/bpf-5.10 -- include/uapi/linux/bpf.h
          git checkout bpf_provider/bpf-5.10 -- include/linux/filter.h
          
          git commit -m "Add eBPF support via folder sync" || echo "No changes"

      - name: Setup Toolchain (Neutron)
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd bc build-essential gcc-aarch64-linux-gnu libssl-dev libelf-dev python3
          mkdir clang-neutron
          wget https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang-neutron

      - name: Build Kernel
        run: |
          export PATH=$(pwd)/clang-neutron/bin:$PATH
          export ARCH=arm64
          export CC="clang --target=aarch64-linux-gnu"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          # Fix rapid pentru macro-ul de pointeri eBPF
          sed -i '/#define _UAPI__LINUX_BPF_H/a #ifndef __bpf_md_ptr\n#define __bpf_md_ptr(type, name) \\\n\tunion { \\\n\t\ttype name; \\\n\t\t__u64 name##_64; \\\n\t}\n#endif' include/uapi/linux/bpf.h

          # Symlink trick Samsung
          mkdir -p toolchain/llvm-arm-toolchain-ship/10.0/bin
          ln -sf $(pwd)/clang-neutron/bin/clang toolchain/llvm-arm-toolchain-ship/10.0/bin/clang

          # Configurația de bază
          make O=out r5q_defconfig

          # Activare BPF
          scripts/config --file out/.config --enable BPF --enable BPF_SYSCALL --enable BPF_JIT --enable CGROUP_BPF --enable NET_CLS_BPF --enable NET_ACT_BPF
          
          # Dezactivare Knox/Security
          scripts/config --file out/.config --disable SEC_DEBUG --disable CC_STACKPROTECTOR_STRONG --enable CC_STACKPROTECTOR_NONE

          # Compilare
          make -j$(nproc --all) O=out LLVM=1 LLVM_IAS=1 KCFLAGS="-w -Wno-error"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-R5Q-BPF-Cherry
          path: out/arch/arm64/boot/Image.gz-dtb
