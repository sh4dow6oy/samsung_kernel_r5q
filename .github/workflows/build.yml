name: S10 Lite Kernel Build - v120

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Fast Checkout Mainey (Depth 1)
        uses: actions/checkout@v4
        with:
          repository: mainey/android_kernel_samsung_r5q
          ref: lineage-18.1
          path: kernel-res
          fetch-depth: 1

      - name: Setup Proton Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves make python3 lz4 perl git curl
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang

      - name: Transplant A15 eBPF & Logic
        run: |
          cd kernel-res
          # Luam doar ce ne trebuie din LineageOS 22 (Google MSM 4.14) fara sa descarcam tot repo-ul
          # Asta aduce suportul real pentru Android 15 Networking
          curl -L https://github.com/LineageOS/android_kernel_google_msm-4.14/archive/refs/heads/lineage-22.0.tar.gz -o a15_source.tar.gz
          tar -xzf a15_source.tar.gz --strip-components=1 android_kernel_google_msm-4.14-lineage-22.0/kernel/bpf \
                                             android_kernel_google_msm-4.14-lineage-22.0/net/core/filter.c \
                                             android_kernel_google_msm-4.14-lineage-22.0/include/linux/bpf.h \
                                             android_kernel_google_msm-4.14-lineage-22.0/include/uapi/linux/bpf.h
          
          # Curatam arhiva
          rm a15_source.tar.gz

      - name: Surgical Fixes (Camera & Compiler)
        run: |
          cd kernel-res
          # Fix Camera ISP (Folosim o metoda mai agresiva de cautare)
          find . -type f -name "cam_vfe_bus_ver3.c" -exec sed -i 's/uint32_t                     i;/uint32_t                     i = 0;/g' {} +
          
          # Rezolvam redefinirea macro-ului care "crapa" build-ul pe Proton
          sed -i '/#define __builtin_assume_aligned/d' include/linux/compiler-clang.h
          
          # Fix etichete vide (Label errors in Samsung drivers)
          find drivers/soc/samsung -name "*.c" -exec sed -i 's/out:$/out: ;/g' {} +

      - name: Configure for Android 15
        run: |
          cd kernel-res
          # Activam suportul BPF cerut de Android 15
          ./scripts/config --file arch/arm64/configs/r5q_eur_open_defconfig --enable CONFIG_BPF_SYSCALL
          ./scripts/config --file arch/arm64/configs/r5q_eur_open_defconfig --enable CONFIG_BPF_JIT
          ./scripts/config --file arch/arm64/configs/r5q_eur_open_defconfig --enable CONFIG_CGROUP_BPF
          ./scripts/config --file arch/arm64/configs/r5q_eur_open_defconfig --enable CONFIG_NETFILTER_XT_MATCH_BPF
          ./scripts/config --file arch/arm64/configs/r5q_eur_open_defconfig --enable CONFIG_BPF_STREAM_PARSER
          
          # Dezactivam chestiile de securitate Samsung care blocheaza boot-ul pe AOSP
          ./scripts/config --file arch/arm64/configs/r5q_eur_open_defconfig --disable CONFIG_SECURITY_SAMSUNG_RKP
          ./scripts/config --file arch/arm64/configs/r5q_eur_open_defconfig --disable CONFIG_TIMA

      - name: Build Kernel
        run: |
          cd kernel-res
          export PATH=$(pwd)/../toolchain/proton-clang/bin:$PATH
          MAKE_ARGS="ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1"
          
          # Flag-uri de relaxare pentru compilator
          export KCFLAGS="-Wno-everything -Wno-error -Wno-macro-redefined -Wno-unused-but-set-variable"

          make $MAKE_ARGS r5q_eur_open_defconfig
          make -j$(nproc --all) $MAKE_ARGS Image.gz-dtb || make -j$(nproc --all) $MAKE_ARGS Image.gz

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-S10Lite-A15-Hybrid
          path: |
            kernel-res/arch/arm64/boot/Image.gz-dtb
            kernel-res/arch/arm64/boot/Image.gz
