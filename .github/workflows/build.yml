name: Lumi Kernel R5Q Neutron Fusion (AOSP 15 Fix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential bison flex libssl-dev libelf-dev \
          clang lld llvm-dev python3 python3-dev git python-is-python3 zstd libncurses6 \
          libncursesw6 wget curl libtinfo6 || true
          
          # Fix pentru bibliotecile Neutron Clang
          sudo ln -s /usr/lib/x86_64-linux-gnu/libncurses.so.6 /usr/lib/x86_64-linux-gnu/libncurses.so.5 || true
          sudo ln -s /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5 || true

      - name: 2. Setup Neutron Clang Toolchain
        run: |
          mkdir -p clang
          wget -q --show-progress https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang
          echo "$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_PATH
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/clang/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: 3. Checkout Roynas Base
        uses: actions/checkout@v4
        with:
          repository: 'Roynas-Android-Playground/kernel_samsung_r3q'
          ref: 'master'
          path: kernel
          fetch-depth: 0

      - name: 4. Merge LineageOS SM8150 (Anti-Conflict Strategy)
        working-directory: kernel
        run: |
          git config --global user.email "lumi@kernel.build"
          git config --global user.name "LumiBuilder"
          git remote add lineage https://github.com/LineageOS/android_kernel_qcom_sm8150
          git fetch lineage lineage-20

          echo "--- Starting Merge ---"
          # Încercăm merge-ul standard cu prioritate pe Lineage pe cât posibil
          git merge -X theirs lineage/lineage-20 --allow-unrelated-histories -m "Merge LineageOS SM8150" || true
          
          echo "--- Resolving Conflicts (Prioritizing LineageOS Core) ---"
          # Rezolvăm manual fișierele care dau erori de scheduler și cgroups
          git checkout lineage/lineage-20 -- kernel/sched/core.c
          git checkout lineage/lineage-20 -- kernel/sched/fair.c
          git checkout lineage/lineage-20 -- kernel/cgroup/cgroup.c
          git checkout lineage/lineage-20 -- include/linux/sched.h
          
          # Finalizăm merge-ul
          git add .
          git commit -m "Auto-resolve merge conflicts by prioritizing LineageOS core" || echo "No changes to commit"

      - name: 5. Professional Patching (Final Fix for Fork.c)
        working-directory: kernel
        run: |
          echo "--- 1. Nuclear Removal of KernelSU ---"
          find . -type f -name "Kconfig*" -exec sed -i '/[kK][eE][rR][nN][eE][lL][sS][uU]/d' {} +
          find . -type f -name "Makefile*" -exec sed -i '/[kK][eE][rR][nN][eE][lL][sS][uU]/d' {} +
          rm -rf drivers/android/kernelsu && mkdir -p drivers/android/kernelsu
          touch drivers/android/kernelsu/Kconfig drivers/android/kernelsu/Makefile

          echo "--- 2. Injecting Freezer Definitions (Global Visibility) ---"
          # Adăugăm definițiile la începutul include/linux/cgroup.h după header guards
          # Folosim static inline pentru a evita conflictele de linkare
          sed -i '/#define _LINUX_CGROUP_H/a \
          static inline void cgroup_enter_frozen(void) { }\
          static inline void cgroup_leave_frozen(bool b) { }\
          static inline bool cgroup_task_frozen(struct task_struct *task) { return false; }\
          static inline bool cgroup_task_freeze(struct task_struct *task) { return false; }\
          static inline void cgroup_update_frozen(struct cgroup *cgrp) { }\
          static inline void cgroup_freeze(struct cgroup *cgrp, bool freeze) { }\
          static inline void cgroup_freezer_frozen_exit(struct task_struct *task) { }\
          static inline void cgroup_freezer_migrate_task(struct task_struct *task, struct cgroup *from, struct cgroup *to) { }' include/linux/cgroup.h

          echo "--- 3. Miscellaneous Build Fixes ---"
          sed -i '/ARM64_HAS_CRC32/d' arch/arm64/kernel/cpufeature.c || true
          # Fix pentru redefinirea VMSTAT_INTERVAL
          sed -i 's/#define CONFIG_VMSTAT_INTERVAL 1/\/* CONFIG_VMSTAT_INTERVAL removed *\//g' include/linux/vmstat.h || true
          echo "#define CONFIG_VMSTAT_INTERVAL 1" >> include/linux/vmstat.h
      - name: 6. Build Kernel with Neutron Clang (R5Q)
        working-directory: kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/clang/lib:$LD_LIBRARY_PATH"
          
          MAKE_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang AS=clang LD=ld.lld \
          CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- O=out"
          
          # Generare Config R5Q
          make $MAKE_ARGS r5q_defconfig

          # Configurare eBPF pentru Android 15 & Clean Bloat
          ./scripts/config --file out/.config \
            -e CONFIG_BPF_SYSCALL -e CONFIG_BPF_JIT -e CONFIG_CGROUP_BPF \
            -e CONFIG_NET_CLS_BPF -e CONFIG_NET_ACT_BPF -e CONFIG_BPF_EVENTS \
            -e CONFIG_IKCONFIG -e CONFIG_IKCONFIG_PROC \
            -d CONFIG_KSU -d CONFIG_KERNEL_SU -d CONFIG_SAMSUNG_PRODUCT_SHIP \
            -d CONFIG_KNOX_KAP -d CONFIG_SEC_RESTRICT_SETID \
            -e CONFIG_CGROUP_FREEZER -e CONFIG_FREEZER \
            --set-val CONFIG_VMSTAT_INTERVAL 1 \
            -d CONFIG_CC_STACKPROTECTOR_STRONG -e CONFIG_CC_STACKPROTECTOR_NONE \
            --set-str CONFIG_LOCALVERSION "-Lumi-Fusion-V2"

          # Compilare
          make $MAKE_ARGS olddefconfig
          make $MAKE_ARGS -j$(nproc --all) Image.gz-dtb

      - name: 7. Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Lumi-Kernel-R5Q-AOSP15
          path: |
            kernel/out/arch/arm64/boot/Image.gz-dtb
            kernel/out/.config
