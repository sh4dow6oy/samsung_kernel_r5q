name: Build R5Q - Phoenix Merge BPF (OneUI 7 Ready)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Your Kernel (r5q)
        uses: actions/checkout@v4
        with:
          repository: Roynas-Android-Playground/kernel_samsung_r3q
          ref: master
          path: kernel
          fetch-depth: 0

      - name: Merge Phoenix Kernel (BPF Backports)
        run: |
          cd kernel
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          
          echo "Adding Phoenix remote..."
          git remote add phoenix https://github.com/PhoenixKernel/linux.git
          git fetch phoenix 4.14
          
          echo "Starting merge - bringing BPF logic from Phoenix"
          # Încercăm un merge. Dacă sunt conflicte (ceea ce e sigur), le rezolvăm manual mai jos.
          git merge phoenix/4.14 -m "Merge Phoenix Kernel BPF backports" || true
          
          # REZOLVARE CONFLICTE CRITICE
          # 1. Păstrăm defconfig-ul tău exact așa cum este (r5q_defconfig)
          git checkout --ours arch/arm64/configs/r5q_defconfig
          
          # 2. Forțăm subsistemul BPF și Networking de la Phoenix
          # Acesta este "creierul" necesar pentru Android 15
          git checkout --theirs kernel/bpf/
          git checkout --theirs include/linux/bpf.h
          git checkout --theirs include/uapi/linux/bpf.h
          git checkout --theirs net/core/filter.c
          
          # 3. Finalizăm merge-ul
          git add .
          git commit -m "Fix merge conflicts: Kept r5q_defconfig, updated BPF from Phoenix" || echo "No conflicts to commit"

      - name: Install Build Essentials
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
          bc libssl-dev flex bison libelf-dev pahole zstd python3 llvm

      - name: Setup AOSP Clang
        run: |
          mkdir -p aosp-clang
          cd aosp-clang
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-r487747c.tar.gz
          tar -xf clang-r487747c.tar.gz
          echo "$GITHUB_WORKSPACE/aosp-clang/bin" >> $GITHUB_PATH

      - name: Build Kernel
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/aosp-clang/bin:$PATH"
          
          MAKE_ARGS="ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            O=out"

          mkdir -p out
          
          # 1. Configurare folosind calea indicată de tine
          make $MAKE_ARGS r5q_defconfig

          # 2. Injectare flag-uri BPF pentru OneUI 7 / Android 15
          # Dezactivăm și protecțiile Samsung care ar putea bloca noile apeluri BPF
          ./scripts/config --file out/.config \
            -e CONFIG_BPF \
            -e CONFIG_BPF_SYSCALL \
            -e CONFIG_BPF_JIT \
            -e CONFIG_CGROUP_BPF \
            -e CONFIG_NET_CLS_BPF \
            -e CONFIG_NET_ACT_BPF \
            -d CONFIG_SAMSUNG_RTIC \
            -d CONFIG_SECURITY_DEFEX \
            -d CONFIG_SECURITY_RKP \
            -d CONFIG_WERROR

          make $MAKE_ARGS olddefconfig

          # 3. Compilare Image.gz
          # Folosim -i în DTC_FLAGS în caz că merge-ul a afectat DT-urile (deși nu ar trebui)
          make -j$(nproc --all) $MAKE_ARGS Image.gz \
            DTC_FLAGS="-i" \
            KCFLAGS="-w -fcommon"

      - name: Package AnyKernel3
        run: |
          IMAGE="kernel/out/arch/arm64/boot/Image.gz"
          git clone https://github.com/osm0sis/AnyKernel3.git AK3
          cp "$IMAGE" AK3/
          cd AK3
          sed -i 's/device.name1=maguro/device.name1=r5q/g' anykernel.sh
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          zip -r9 ../R5Q-Phoenix-BPF-V42.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: R5Q-Lumi-Phoenix
          path: R5Q-Phoenix-BPF-V42.zip
