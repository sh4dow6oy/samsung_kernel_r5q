name: Build Roynas R5Q - Pascua eBPF Surgical Final
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: Roynas-Android-Playground/kernel_samsung_r3q
          ref: master
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev \
          ccache python3 python-is-python3 libarchive-tools wget zstd libtinfo6 zip git

      - name: Setup Neutron Clang
        run: |
          mkdir clang
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang

      - name: Surgical Sync eBPF & KernelSU Cleanup
        run: |
          git config --global user.email "bot@github.com"
          git config --global user.name "Kernel-Builder"
          
          # 1. Portăm eBPF chirurgical de la Pascua (Samsung-optimized)
          git remote add pascua https://github.com/pascua28/android_kernel_samsung_sm8250.git
          git fetch pascua sixteen --depth=1
          
          echo "Sincronizare fișiere critice eBPF..."
          git checkout pascua/sixteen -- kernel/bpf/
          git checkout pascua/sixteen -- net/core/filter.c
          git checkout pascua/sixteen -- include/linux/filter.h
          git checkout pascua/sixteen -- include/uapi/linux/bpf.h
          git checkout pascua/sixteen -- include/linux/bpf.h
          
          # 2. FIX CRITIC: Eliminăm referințele moarte către KernelSU care opresc 'make defconfig'
          echo "Curățare referințe KernelSU din Kconfig și Makefile..."
          sed -i '/kernelsu/d' drivers/android/Kconfig || true
          sed -i '/kernelsu/d' drivers/android/Makefile || true
          
          git add .
          git commit -m "eBPF Surgical Sync & Kconfig Cleanup" || echo "No changes to commit"

      - name: Build Kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export KBUILD_BUILD_USER="Roynas"
          export KBUILD_BUILD_HOST="Neutron-CI"
          
          # 1. Pregătire mediu (Polly removal & vDSO fix)
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-mllvm -polly[^ ]*//g' {} +
          [ -f arch/arm64/kernel/vdso/Makefile ] && sed -i 's/-static//g' arch/arm64/kernel/vdso/Makefile

          MAKE_ARGS="ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            O=out"

          # 2. Generare Configurație
          mkdir -p out
          make $MAKE_ARGS r5q_defconfig
          
          # Activăm suportul eBPF necesar pentru Android 12-14+
          ./scripts/config --file out/.config \
            -e CONFIG_BPF \
            -e CONFIG_BPF_SYSCALL \
            -e CONFIG_BPF_JIT \
            -e CONFIG_HAVE_EBPF_JIT \
            -e CONFIG_BPF_EVENTS \
            -e CONFIG_NET_CLS_BPF \
            -e CONFIG_NET_ACT_BPF \
            -e CONFIG_CGROUP_BPF \
            -e CONFIG_NET_SCH_INGRESS \
            -d CONFIG_LTO -d CONFIG_LTO_CLANG -e CONFIG_LTO_NONE \
            -d CONFIG_KNOX_KAP -d CONFIG_SECURITY_SAMSUNG_KNOX
            
          make $MAKE_ARGS olddefconfig

          # 3. Compilare (Ignorăm warning-urile stricte ale Clang 18/19)
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-fcommon -Wno-error -Wno-implicit-function-declaration -Wno-unused-command-line-argument -Wno-incompatible-pointer-types -Wno-int-conversion -Wno-macro-redefined"

      - name: Package with AnyKernel3
        run: |
          # Identificăm imaginea kernelului
          IMAGE="$GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz-dtb"
          [ ! -f "$IMAGE" ] && IMAGE="$GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz"
          DTBO="$GITHUB_WORKSPACE/out/arch/arm64/boot/dtbo.img"
          
          git clone https://github.com/osm0sis/AnyKernel3.git
          rm -rf AnyKernel3/.git
          
          cp $IMAGE AnyKernel3/Image.gz
          [ -f "$DTBO" ] && cp $DTBO AnyKernel3/dtbo.img
          
          # Configurare AnyKernel pentru R5Q
          sed -i 's/device.name1=maguro/device.name1=r5q/g' AnyKernel3/anykernel.sh
          sed -i 's/device.name2=toroplus/device.name2=SM-G770F/g' AnyKernel3/anykernel.sh
          
          cd AnyKernel3 && zip -r9 ../Kernel-R5Q-eBPF-Final.zip *

      - name: Upload Flashable Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-S10Lite-R5Q
          path: Kernel-R5Q-eBPF-Final.zip
