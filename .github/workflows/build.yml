name: Build Samsung R5Q Kernel (AOSP ASB Merge)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

# Clone kernel
    - name: Checkout Samsung Kernel
      uses: actions/checkout@v4
      with:
        repository: Roynas-Android-Playground/kernel_samsung_r3q
        fetch-depth: 0

# Install deps
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
        bc bison build-essential curl flex git lz4 \
        libssl-dev libelf-dev zip unzip \
        python3 python-is-python3 \
        zstd ccache

# Setup clang
    - name: Setup Clang
      run: |
        git clone https://github.com/llvm/llvm-project --depth=1 clang-src
        cd clang-src
        mkdir build
        cd build
        cmake -G "Unix Makefiles" -DLLVM_ENABLE_PROJECTS=clang ../llvm
        make -j$(nproc)
        sudo make install

# Merge AOSP kernel
    - name: Merge Android ASB kernel
      run: |

        git remote add aosp https://android.googlesource.com/kernel/common

        git fetch aosp refs/tags/ASB-2024-01-05_4.14-stable

        git checkout -b merge-aosp

        git merge aosp/ASB-2024-01-05_4.14-stable \
        --allow-unrelated-histories \
        -X theirs \
        -m "Merge Android ASB 2024-01-05"

# Restore Samsung parts
    - name: Restore Samsung configs
      run: |

        git checkout HEAD -- arch/arm64/configs/r5q_defconfig || true
        git checkout HEAD -- drivers/samsung || true
        git checkout HEAD -- arch/arm64/boot/dts/samsung || true

# Build kernel
    - name: Build kernel
      run: |

        export ARCH=arm64
        export SUBARCH=arm64

        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

        mkdir out

        make O=out r5q_defconfig

        make -j$(nproc) O=out \
        CC=clang \
        LD=ld.lld \
        AR=llvm-ar \
        NM=llvm-nm \
        OBJCOPY=llvm-objcopy \
        OBJDUMP=llvm-objdump \
        STRIP=llvm-strip

# Upload result
    - name: Upload kernel image
      uses: actions/upload-artifact@v4
      with:
        name: R5Q-Kernel-Image
        path: |
          out/arch/arm64/boot/Image*
