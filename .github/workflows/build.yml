name: R5Q Android 15 - BPF DTBO Appended Final

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: LumiPlayground/android_kernel_samsung_sm8150
          ref: rawr-bpf
          fetch-depth: 0

      - name: Setup & Brutal Patching
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd bc build-essential gcc-aarch64-linux-gnu libssl-dev libelf-dev python3 python-is-python3 curl
          sudo ln -sf /usr/bin/python3 /usr/bin/python2
          
          # 1. FIX KALLSYMS (Elimină 'out of range' pentru kernel-ul BPF mare)
          sed -i 's/if (base_relative)/if (0)/g' scripts/kallsyms.c
          sed -i 's/--kallsyms-base-relative//g' scripts/link-vmlinux.sh
          
          # 2. FORCE SELINUX PERMISSIVE (Sursă + Cmdline)
          sed -i 's/static int selinux_enforcing = 1;/static int selinux_enforcing = 0;/g' security/selinux/hooks.c || true
          
          # 3. FIX MCMODEL LARGE & MEMORY
          sed -i 's/KBUILD_CFLAGS   += -fno-pic/KBUILD_CFLAGS   += -fno-pic -mcmodel=large/g' arch/arm64/Makefile
          sed -i 's/extern inline bool need_memory_boosting/extern bool need_memory_boosting/g' include/linux/mm.h

      - name: Download Neutron & DTBO Tool
        run: |
          mkdir clang-neutron
          wget https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang-neutron
          
          # Descarcă utilitarul oficial mkdtboimg
          curl -Lo mkdtboimg.py "https://android.googlesource.com/platform/system/libufdt/+/refs/heads/master/utils/src/mkdtboimg.py?format=TEXT" | base64 --decode > mkdtboimg.py
          chmod +x mkdtboimg.py

      - name: Build Kernel + BPF + DTBO
        run: |
          export PATH=$(pwd)/clang-neutron/bin:$PATH
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          KERNEL_LLVM_BIN=$(pwd)/clang-neutron/bin/clang
          
          make O=out ARCH=arm64 CROSS_COMPILE=$CROSS_COMPILE REAL_CC=$KERNEL_LLVM_BIN r5q_eur_open_defconfig
          
          # 4. FORȚARE GENERARE DTBO (Fix pentru eroarea ta)
          ./scripts/config --file out/.config --enable CONFIG_BUILD_ARM64_DT_OVERLAY
          ./scripts/config --file out/.config --enable CONFIG_DTC
          ./scripts/config --file out/.config --enable CONFIG_OF_OVERLAY
          ./scripts/config --file out/.config --enable CONFIG_OF_CONFIGFS
          
          # 5. FORȚARE BPF (Fix Rețea Android 15)
          ./scripts/config --file out/.config --enable BPF --enable BPF_SYSCALL --enable BPF_JIT --enable CGROUP_BPF --enable NET_CLS_BPF --enable NET_ACT_BPF
          
          # 6. FORȚARE APPENDED DTB & KALLSYMS FIX
          ./scripts/config --file out/.config --enable CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE
          ./scripts/config --file out/.config --disable KALLSYMS_BASE_RELATIVE --disable RANDOMIZE_BASE --enable KALLSYMS_ALL
          
          make O=out ARCH=arm64 CROSS_COMPILE=$CROSS_COMPILE REAL_CC=$KERNEL_LLVM_BIN olddefconfig

          # Compilare finală
          make -j$(nproc) O=out ARCH=arm64 CROSS_COMPILE=$CROSS_COMPILE REAL_CC=$KERNEL_LLVM_BIN KCFLAGS="-w -mcmodel=large" Image.gz-dtb dtbs

      - name: Generate DTBO.img
        run: |
          # Căutăm toate .dtbo-urile generate (acum vor fi prezente)
          DTBO_FILES=$(find out/arch/arm64/boot/dts/ -name "*.dtbo")
          
          if [ -n "$DTBO_FILES" ]; then
            echo "Fișiere găsite: $DTBO_FILES"
            python3 mkdtboimg.py create out/arch/arm64/boot/dtbo.img $DTBO_FILES
            echo "DTBO.img generat cu succes."
          else
            echo "EROARE CRITICĂ: Fișierele .dtbo tot nu au fost generate! Verifică sursa."
            exit 1
          fi

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          [ -f out/arch/arm64/boot/dtbo.img ] && cp out/arch/arm64/boot/dtbo.img AnyKernel3/
          
          # Colectare drivere (.ko)
          find out/ -name "*.ko" -exec cp {} AnyKernel3/modules/system/lib/modules/ \; || true

          cd AnyKernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          # Cmdline fix pentru Permissive & BPF
          sed -i '/cmdline=/ s/$/ androidboot.selinux=permissive/' anykernel.sh
          [ -f dtbo.img ] && sed -i 's/dtbo_setup=0/dtbo_setup=1/g' anykernel.sh

          zip -r9 ../R5Q-A15-KERNEL-ULTIMATE.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_R5Q_A15_Final
          path: R5Q-A15-KERNEL-ULTIMATE.zip
