name: Build r5q Kernel - CLO & Xiaomi BPF

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev python3 clang llvm lld

      - name: Clone Mainey Kernel
        run: |
          git clone --depth=500 https://github.com/mainey/android_kernel_samsung_r5q.git -b lineage-19.0 kernel
          cd kernel
          git config user.email "wizard@build.com"
          git config user.name "Kernel-Wizard"

      - name: 1. Upstream CLO (Baza Stabilă)
        run: |
          cd kernel
          git remote add clo https://git.codelinaro.org/clo/la/kernel/msm.git
          git fetch clo aosp-common/android-4.14-stable --depth=50
          git merge FETCH_HEAD -m "Upstream CLO" -X ours --allow-unrelated-histories || echo "Merge handled"
          git reset --mixed
          git add .
          git commit -m "Post-upstream clean"

      - name: 2. Import Xiaomi SM6150 eBPF Backport
        run: |
          cd kernel
          # Luăm commit-ul specific indicat de tine (469808)
          git fetch https://github.com/LineageOS/android_kernel_xiaomi_sm6150 refs/changes/08/469808/1
          
          # Aplicăm fișierele cheie din acest backport
          git checkout FETCH_HEAD -f -- \
            include/linux/bpf.h \
            include/linux/filter.h \
            include/uapi/linux/bpf.h \
            kernel/bpf/core.c \
            kernel/bpf/verifier.c \
            kernel/bpf/syscall.c \
            net/core/filter.c
          
          git add .
          git commit -m "Imported Xiaomi eBPF backport"

      - name: 3. Final Conflict Resolution & Fixes
        run: |
          cd kernel
          # Rezolvăm conflictele de tipuri specifice kernelului 4.14 Samsung
          sed -i 's/dev_get_by_index_rcu/dev_get_by_index/g' net/core/filter.c
          
          # Curățăm redefinirile cauzate de mixul CLO + Xiaomi
          sed -i '/struct bpf_prog_offload_ols {/,/};/d' kernel/bpf/core.c
          sed -i '/struct bpf_verifier_env {/,/};/d' include/linux/bpf_verifier.h || true
          
          # Fix Samsung Debug & Toolchain
          sed -i 's/sec_debug_sched_msg/\/\/ sec_debug_sched_msg/g' arch/arm64/kernel/traps.c
          sed -i 's|$(srctree)/../toolchain/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin/aarch64-linux-android-||g' Makefile
          
          # Script dummy pentru securitate Samsung
          echo -e "#!/bin/sh\necho '00000000000000000000000000000000'\nexit 0" > secgetspf
          chmod +x secgetspf

      - name: 4. Configure and Build
        run: |
          cd kernel
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export PATH=$PATH:$(pwd)

          mkdir -p out
          make O=out ARCH=arm64 r5q_eur_open_defconfig
          
          # Setări pentru BPF Network Stats (Android 15 ready)
          scripts/config --file out/.config -e BPF -e BPF_SYSCALL -e BPF_JIT -e CGROUP_BPF
          scripts/config --file out/.config -e NETFILTER_XT_MATCH_BPF -e NET_ACT_BPF -e BPF_STREAM_PARSER
          scripts/config --file out/.config -e NET_CLS_ACT -e NET_CLS_BPF -e STREAM_PARSER
          scripts/config --file out/.config --set-val NR_CPUS 8
          scripts/config --file out/.config -d SEC_DEBUG
          
          yes "" | make O=out ARCH=arm64 oldconfig
          
          # Compilare cu toleranță la avertismente
          make -j$(nproc --all) O=out ARCH=arm64 \
            LD=ld.lld \
            KCFLAGS="-Wno-error -Wno-implicit-function-declaration -fcommon -DNR_CPUS=8"

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-r5q-Xiaomi-BPF
          path: |
            kernel/out/arch/arm64/boot/Image.gz-dtb
            kernel/out/arch/arm64/boot/dtbo.img
