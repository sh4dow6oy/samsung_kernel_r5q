name: Build R5Q - LineageOS V74 (Assembly Fix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LineageOS SM8150
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_qcom_sm8150
          ref: lineage-20
          path: kernel

      - name: Maximize Build Space & Swap
        run: |
          sudo swapoff -a || true
          sudo dd if=/dev/zero of=/swapfile bs=1M count=4096
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Download Mainey EUR Defconfig
        run: |
          wget -O kernel/arch/arm64/configs/r5q_defconfig https://raw.githubusercontent.com/mainey/android_kernel_samsung_r5q/lineage-19.0/arch/arm64/configs/r5q_eur_open_defconfig

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu gcc-arm-linux-gnueabi bc libssl-dev python3 bison flex libncurses6 libncurses-dev zstd
          sudo ln -sf /usr/bin/python3 /usr/bin/python
          mkdir -p clang
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang

      - name: Build Kernel (Fix Assembly & Symbols)
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          
          # Definim argumentele de build
          # Adăugăm flag-uri pentru a ignora directivele de asamblare nefamiliare
          MAKE_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CLANG_TRIPLE=aarch64-linux-gnu- O=out"
          
          make $MAKE_ARGS r5q_defconfig
          
          # Patch agresiv pentru a scoate suportul de 32-bit/v7 care cauzează erori în Clang
          ./scripts/config --file out/.config \
            -d CONFIG_SAMSUNG_RTIC \
            -d CONFIG_WERROR \
            -d CONFIG_LTO_CLANG \
            -d CONFIG_CFI_CLANG \
            -d CONFIG_ARM_UNWIND \
            -d CONFIG_VFP \
            -d CONFIG_NEON \
            -e CONFIG_BUILD_ARM64_DT_OVERLAY
            
          make $MAKE_ARGS olddefconfig

          # Monitorizare RAM
          (while true; do echo "[MONITOR] RAM Free: $(free -m | awk '/^Mem:/{print $4}')MB"; sleep 60; done) &

          # KCFLAGS fix: -D__LINUX_ARM_ARCH__=8 forțează codul să creadă că e pe ARMv8 (64-bit)
          # -fno-integrated-as (opțional, dar am păstrat LLVM_IAS=1 momentan pentru viteză)
          make -j$(nproc --all) $MAKE_ARGS V=1 Image.gz dtbs \
            KCFLAGS="-w -fcommon -D__LINUX_ARM_ARCH__=8" \
            LDFLAGS="--allow-multiple-definition --defsym=__aeabi_unwind_cpp_pr0=0 --defsym=__aeabi_unwind_cpp_pr1=0"

      - name: Assemble AnyKernel3
        run: |
          OUT="kernel/out/arch/arm64/boot"
          git clone https://github.com/osm0sis/AnyKernel3.git AK3
          if [ -f "$OUT/Image.gz" ]; then
            cp $OUT/Image.gz AK3/
            DTB=$(find $OUT/dts -name "*r5q*.dtb" -o -name "*sm8150*.dtb" | head -n 1)
            [ -f "$DTB" ] && cat $OUT/Image.gz $DTB > AK3/Image.gz
            find kernel/out -name "dtbo.img" -exec cp {} AK3/dtbo.img \;
            cd AK3 && zip -r9 ../R5Q_Build_V74.zip *
          else
            echo "Build failed again. Check the log for 'unknown directive' location."
            exit 1
          fi

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-R5Q-V74
          path: R5Q_Build_V74.zip
