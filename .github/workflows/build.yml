name: Build R5Q - Lumi BPF V45 (Merge BPF into Main)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Clean Main Branch (rawr-rebase)
        uses: actions/checkout@v4
        with:
          repository: LumiPlayground/android_kernel_samsung_sm8150
          ref: rawr-rebase # <--- Punctul de pornire stabil (Main)
          fetch-depth: 0

      - name: Configure Git & Merge Experimental BPF
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          echo "Aducem modificările din branch-ul experimental rawr-bpf..."
          git fetch origin rawr-bpf
          
          echo "Rulăm fuziunea (Tragem BPF peste Main)..."
          # Încercăm un merge controlat, forțând modificările eBPF acolo unde sunt conflicte de text
          git merge -X theirs origin/rawr-bpf -m "Fuziune: Integrare eBPF peste structura stabilă" || {
            echo "⚠️ Fuziune parțială realizată. Rezolvăm conflictele de tip Modify/Delete..."
            
            # Identificăm toate fișierele șterse în HEAD dar modificate în BPF și le eliminăm din index
            git status --porcelain | grep '^UD' | awk '{print $2}' | xargs -I {} git rm {}
            
            # Identificăm fișierele adăugate greșit în ambele părți fără rezoluție și le adăugăm pe cele din BPF
            git add .
            
            # Finalizăm manual commit-ul de merge care a fost blocat
            git commit -m "Fuziune finalizată: Conflictele de ștergere au fost eliminate automat"
          }
          
          echo "Git Merge s-a finalizat cu succes!"

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu bc libssl-dev zstd zip python3 python-is-python3 libelf-dev

      - name: Setup Toolchain (Neutron Clang)
        run: |
          mkdir -p clang
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang

      - name: Build Kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          
          # 1. FIX CONFLICTE DE FUZIUNE (Gator & KernelSU-Next)
          echo "Curățăm punțile stricate aduse de fuziune..."
          if [ -f drivers/Kconfig ]; then
            sed -i '/gator/d' drivers/Kconfig
            sed -i '/kernelsu/d' drivers/Kconfig
          fi
          if [ -f drivers/Makefile ]; then
            sed -i '/gator/d' drivers/Makefile
            sed -i '/kernelsu/d' drivers/Makefile
          fi

          # Neutralizăm scripturile Samsung sau experimentale care încearcă să ruleze 'tar' după KernelSU-Next
          find . -type f -name "*.sh" -exec sed -i 's/tar .*KernelSU-Next.*/echo "Skipping KernelSU tar"/g' {} + || true

          # 2. NUCLEAR CLEANUP (Prevenim Polly Errors experimentale global)
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-mllvm -polly[^ ]*//g' {} +
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-mllvm//g' {} +
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-polly[^ ]*//g' {} +

          # 3. FIX SPECIFIC VDSO (Prevenim eroarea /usr/bin/as)
          if [ -f arch/arm64/kernel/vdso/Makefile ]; then
            sed -i 's/-static//g' arch/arm64/kernel/vdso/Makefile
            sed -i 's/$(LDFLAGS)/$(filter-out -static,$(LDFLAGS))/g' arch/arm64/kernel/vdso/Makefile
            sed -i 's/$(CROSS_COMPILE)as/clang/g' arch/arm64/kernel/vdso/Makefile
          fi

          # 4. SETARE ARGUMENTE BUILD
          MAKE_ARGS='ARCH=arm64 
            LLVM=1 
            LLVM_IAS=1 
            CC=clang 
            LD=ld.lld 
            AR=llvm-ar 
            NM=llvm-nm 
            OBJCOPY=llvm-objcopy 
            OBJDUMP=llvm-objdump 
            STRIP=llvm-strip 
            AS=clang
            CROSS_COMPILE=aarch64-linux-gnu- 
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- 
            CLANG_TRIPLE=aarch64-linux-gnu- 
            HOSTCC=clang 
            HOSTCXX=clang++ 
            HOSTCFLAGS=-Wno-error 
            O=out'

          make $MAKE_ARGS r5q_eur_open_defconfig

          # FORȚARE BPF JIT & CURĂȚARE SAMSUNG SECURITY
          ./scripts/config --file out/.config \
            -e CONFIG_BPF -e CONFIG_BPF_SYSCALL -e CONFIG_BPF_JIT -e CONFIG_BPF_JIT_ALWAYS_ON \
            -e CONFIG_HAVE_EBPF_JIT -e CONFIG_NET_ACT_BPF -e CONFIG_NET_CLS_BPF \
            -d CONFIG_SAMSUNG_RTIC -d CONFIG_SAMSUNG_RTIC_AMP \
            -d CONFIG_CC_STACKPROTECTOR_STRONG -e CONFIG_CC_STACKPROTECTOR_NONE \
            -d CONFIG_WERROR

          make $MAKE_ARGS olddefconfig

          # COMPILARE FINALĂ
          make -j$(nproc --all) $MAKE_ARGS Image.gz Image.gz-dtb dtbs \
            KCFLAGS="-w -fcommon --target=aarch64-linux-gnu" \
            KASFLAGS="--target=aarch64-linux-gnu" \
            LDFLAGS="--no-rosegment"

      - name: Assemble AnyKernel3
        run: |
          OUT="out/arch/arm64/boot"
          if [ -f "$OUT/Image.gz-dtb" ]; then
            IMAGE_FINAL="$OUT/Image.gz-dtb"
          else
            IMAGE_FINAL="$OUT/Image.gz"
          fi
          
          git clone https://github.com/osm0sis/AnyKernel3.git AK3
          rm -rf AK3/.git
          cp "$IMAGE_FINAL" AK3/Image.gz
          [ -f "$OUT/dtbo.img" ] && cp "$OUT/dtbo.img" AK3/dtbo.img
          
          cd AK3
          sed -i 's/device.name1=maguro/device.name1=r5q/g' anykernel.sh
          sed -i 's/device.name2=toroplus/device.name2=SM-G770F/g' anykernel.sh
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          sed -i 's/header_version=0/header_version=2/g' anykernel.sh
          zip -r9 ../S10Lite_InvertedMerge_BPF.zip *

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-Inverted-Kernel
          path: S10Lite_InvertedMerge_BPF.zip
