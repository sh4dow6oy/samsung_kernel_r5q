name: S10 Lite - Safe eBPF v6 (Redefinition Fix)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: mainey/android_kernel_samsung_r5q
          ref: lineage-19.0
          path: kernel
          fetch-depth: 1

      - name: Setup Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves make python3 lz4
          mkdir -p toolchain
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang

      - name: Hard Patching & Samsung Cleanup
        run: |
          cd kernel
          # 1. Reset la bpf.h pentru a pleca de la o stare curata
          git checkout include/uapi/linux/bpf.h
          git checkout include/linux/bpf.h

          # 2. Injectare Safe (folosim #ifndef pentru a evita redefinirea)
          # Adaugam garda de protectie in jurul structurii bpf_raw_event_map
          sed -i '$a #ifndef __BPF_RAW_EVENT_MAP_DEFINED\n#define __BPF_RAW_EVENT_MAP_DEFINED\nstruct bpf_raw_event_map { struct bpf_map map; };\n#endif' include/linux/bpf.h

          # 3. Fix Enum BPF (Sintaxa confirmata)
          sed -i '/BPF_OBJ_GET,/a \	BPF_OBJ_NAME_LEN = 16,' include/uapi/linux/bpf.h
          sed -i '/BPF_F_WRONLY[[:space:]]*=[[:space:]]*(1U << 6),/a \	BPF_F_RDONLY_PROG = (1U << 7),\n	BPF_F_WRONLY_PROG = (1U << 8),' include/uapi/linux/bpf.h

          # 4. Bypass Total Samsung Security & Toolchain
          # Stergem liniile care forteaza folosirea GCC-ului vechi din Makefile
          sed -i 's|$(srctree)/../toolchain/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin/aarch64-linux-android-||g' Makefile
          
          # Cream un binar fals pentru secgetspf in loc de script
          echo "int main() { return 0; }" > secgetspf.c
          gcc secgetspf.c -o secgetspf
          chmod +x secgetspf
          sudo cp secgetspf /usr/local/bin/
          cp secgetspf .

      - name: Configure & Build
        run: |
          cd kernel
          export PATH=$(pwd):$(pwd)/../toolchain/proton-clang/bin:$PATH
          
          # Parametrii de build (fortam LLVM pentru a ignora erorile de toolchain Samsung)
          export MAKE_ARGS="ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1"
          
          make $MAKE_ARGS r5q_eur_open_defconfig
          
          # Activare eBPF
          ./scripts/config --enable CONFIG_BPF_SYSCALL
          ./scripts/config --enable CONFIG_BPF_JIT
          ./scripts/config --enable CONFIG_CGROUP_BPF
          ./scripts/config --disable CONFIG_DEBUG_INFO_BTF
          ./scripts/config --disable CONFIG_SECURITY_SAMSUNG_RKP
          
          make $MAKE_ARGS olddefconfig
          
          # KCFLAGS agresiv pentru a ignora orice redefinire ramasa
          export KCFLAGS="-O2 -Wno-everything -Wno-error -fcommon -D__BPF_RAW_EVENT_MAP_DEFINED"
          
          make -j$(nproc --all) $MAKE_ARGS Image.gz-dtb

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: s10-lite-ebpf-v22
          path: kernel/arch/arm64/boot/Image.gz-dtb
