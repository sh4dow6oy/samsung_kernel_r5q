name: Build Roynas R5Q - OpenELA 4.14.355 Surgical

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Samsung Source
        uses: actions/checkout@v4
        with:
          repository: Roynas-Android-Playground/kernel_samsung_r3q
          ref: master
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev \
          ccache python3 python-is-python3 libarchive-tools wget zstd libtinfo6 zip tar rsync

      - name: Surgical Upstream OpenELA 4.14.355
        run: |
          echo "Pregătim mediul de upstream..."
          wget -q https://github.com/openela/kernel-lts/archive/refs/tags/v4.14.355-openela.tar.gz
          mkdir openela_src
          tar -xzf v4.14.355-openela.tar.gz -C openela_src --strip-components=1
          
          echo "Aplicăm Upstream doar pe folderele core (evităm distrugerea scripturilor Samsung)..."
          # Actualizăm doar nucleul sistemului, nu și uneltele de build (scripts) sau config-urile de arch
          for dir in kernel mm net fs ipc lib crypto include virt block; do
            if [ -d openela_src/$dir ]; then
              rsync -a --delete openela_src/$dir/ ./$dir/
            fi
          done
          
          # Copiem restul dar fără a șterge ce are Samsung în plus
          rsync -a openela_src/drivers/ ./drivers/
          
          rm -rf openela_src v4.14.355-openela.tar.gz

      - name: Setup Neutron Clang
        run: |
          mkdir clang
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang

      - name: Build Kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          
          # 1. CLEANUP MAKEFILES
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-mllvm -polly[^ ]*//g' {} +
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-mllvm//g' {} +
          
          # 2. VDSO & WRAPPER FIX
          [ -f arch/arm64/kernel/vdso/Makefile ] && sed -i 's/-static//g' arch/arm64/kernel/vdso/Makefile
          sed -i 's/ifneq ($(wildcard $(srctree)\/scripts\/gcc-wrapper.py),)/ifeq (0,1)/g' Makefile

          # 3. KERNELSU CLEANUP
          sed -i '/kernelsu/d' drivers/android/Kconfig || true
          sed -i '/kernelsu/d' drivers/android/Makefile || true
          rm -rf drivers/kernelsu

          # 4. ARGUMENTE BUILD
          MAKE_ARGS="ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            O=out"

          # 5. CONFIGURARE
          make $MAKE_ARGS r5q_defconfig
          
          ./scripts/config --file out/.config \
            -d CONFIG_LTO -d CONFIG_LTO_CLANG -e CONFIG_LTO_NONE \
            -d CONFIG_CC_STACKPROTECTOR_STRONG -e CONFIG_CC_STACKPROTECTOR_NONE \
            -d CONFIG_SHADOW_CALL_STACK -d CONFIG_KNOX_KAP -d CONFIG_SECURITY_SAMSUNG_KNOX \
            -d CONFIG_ASSIST_KSU -d CONFIG_KSU
            
          make $MAKE_ARGS olddefconfig

          # 6. COMPILARE
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-fcommon -Wno-error -Wno-unknown-warning-option -Wno-unused-command-line-argument"

      - name: Package and Upload
        run: |
          IMAGE="$GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz-dtb"
          [ ! -f "$IMAGE" ] && IMAGE="$GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz"
          DTBO="$GITHUB_WORKSPACE/out/arch/arm64/boot/dtbo.img"

          git clone https://github.com/osm0sis/AnyKernel3.git
          cp $IMAGE AnyKernel3/Image.gz
          [ -f "$DTBO" ] && cp $DTBO AnyKernel3/dtbo.img
          sed -i 's/device.name1=maguro/device.name1=r5q/g' AnyKernel3/anykernel.sh
          
          cd AnyKernel3
          zip -r9 ../Kernel-R5Q-OpenELA-Surgical.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-R5Q-OpenELA
          path: Kernel-R5Q-OpenELA-Surgical.zip
