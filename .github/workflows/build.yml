name: Build R5Q - Phoenix BPF V10
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Your Kernel (r5q)
        uses: actions/checkout@v4
        with:
          repository: Roynas-Android-Playground/kernel_samsung_r3q
          ref: master
          path: kernel
          fetch-depth: 0

      - name: Phoenix Surgical Transplant (V10)
        run: |
          cd kernel
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          
          git remote add phoenix https://github.com/PhoenixKernel/linux.git
          git fetch phoenix android-4.14-phoenix --depth=1
          git fetch phoenix android12-5.10-phoenix --depth=1
          
          echo "Cleaning residues..."
          sed -i '/kernelsu\/Kconfig/d' drivers/android/Kconfig || true
          
          # 1. Resetăm la 4.14 Phoenix pentru stabilitate generală
          git checkout phoenix/android-4.14-phoenix -- kernel/fork.c
          git checkout phoenix/android-4.14-phoenix -- kernel/exit.c
          git checkout phoenix/android-4.14-phoenix -- include/linux/sched.h
          git checkout phoenix/android-4.14-phoenix -- include/linux/mm_types.h
          
          # 2. IMPORTĂM LOGICA DE SECURITATE DIN 5.10 (Fix pentru bpf_lsm_hooks)
          git checkout phoenix/android12-5.10-phoenix -- security/security.c
          git checkout phoenix/android12-5.10-phoenix -- include/linux/lsm_hook_defs.h
          git checkout phoenix/android12-5.10-phoenix -- include/linux/lsm_hooks.h
          git checkout phoenix/android12-5.10-phoenix -- include/linux/security.h
          git checkout phoenix/android12-5.10-phoenix -- include/linux/bpf.h
          git checkout phoenix/android12-5.10-phoenix -- include/uapi/linux/bpf.h

          # 3. FIX STRUCTURI MEMORIE (Injectăm manual în 4.14)
          # Adăugăm include pentru AT_VECTOR_SIZE
          sed -i '1i #include <uapi/linux/auxvec.h>' include/linux/mm_types.h
          # Injectăm membrii necesari în mm_struct
          sed -i '/struct task_struct \*owner;/a \	spinlock_t arg_lock;\n\tunsigned long saved_auxv[AT_VECTOR_SIZE];' include/linux/mm_types.h
          # Inițializare arg_lock în fork.c
          sed -i '/spin_lock_init(&mm->page_table_lock);/a \	spin_lock_init(&mm->arg_lock);' kernel/fork.c

          echo "Syncing BPF Subsystem..."
          git checkout phoenix/android-4.14-phoenix -- kernel/bpf/
          git checkout phoenix/android-4.14-phoenix -- security/bpf/ || true
          git checkout phoenix/android-4.14-phoenix -- fs/proc/base.c

          # Fix Clang compliance
          sed -i 's/page = (char \*)__get_free_page/struct page *page_ptr; page = (char *)__get_free_page/g' fs/proc/base.c || true

          git add .
          git commit -m "Surgical Sync V10: Synced security.c with 5.10 and fixed mm_struct" || echo "No changes"

      - name: Setup Toolchain
        run: |
          sudo apt-get update && sudo apt-get install -y zstd libssl-dev bc bison flex
          mkdir clang
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang
          echo "$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_PATH

      - name: Build Kernel
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"

          MAKE_ARGS="ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            O=out"

          mkdir -p out
          make $MAKE_ARGS r5q_defconfig

          ./scripts/config --file out/.config \
            -e CONFIG_BPF \
            -e CONFIG_BPF_SYSCALL \
            -e CONFIG_BPF_JIT \
            -e CONFIG_BPF_LSM \
            -d CONFIG_SAMSUNG_RTIC \
            -d CONFIG_SECURITY_RKP \
            -d CONFIG_WERROR

          make $MAKE_ARGS olddefconfig
          
          make -j$(nproc --all) $MAKE_ARGS Image.gz \
            KCFLAGS="-w -fcommon -fno-stack-protector -Wno-implicit-function-declaration -Wno-int-conversion -fintegrated-as" \
            HOSTCFLAGS="-w"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-R5Q-V10-Surgical
          path: kernel/out/arch/arm64/boot/Image.gz
