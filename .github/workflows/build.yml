name: Build Samsung S10 Lite (r5q) - Neutron Clang

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        repository: sh4dow6oy/android_kernel_samsung_a82xq
        ref: linux-4.14.285
        fetch-depth: 1

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential bison flex libssl-dev libelf-dev xz-utils wget git gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi zstd python3

    - name: Download and Setup Neutron Clang
      run: |
        mkdir -p neutron
        wget https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
        tar -I zstd -xf neutron-clang-10032024.tar.zst -C neutron
        echo "NEUTRON_PATH=$(pwd)/neutron/bin" >> $GITHUB_ENV

    - name: Bypass Samsung Toolchain Check
      run: |
        # 1. Ștergem wrapper-ul problematic ca să nu mai interfereze
        rm -f scripts/gcc-wrapper.py
        
        # 2. Creăm structura de foldere pe care o caută Makefile-ul Samsung
        mkdir -p toolchain/llvm-arm-toolchain-ship/10.0/bin
        
        # 3. Creăm link-uri către Neutron Clang în locația așteptată de Samsung
        ln -sf ${{ env.NEUTRON_PATH }}/clang toolchain/llvm-arm-toolchain-ship/10.0/bin/clang
        ln -sf ${{ env.NEUTRON_PATH }}/ld.lld toolchain/llvm-arm-toolchain-ship/10.0/bin/ld.lld
        
        # 4. Dezactivăm wrapper-ul din Makefile (opțional, dar sigur)
        sed -i 's/$(srctree)\/scripts\/gcc-wrapper.py//g' Makefile

    - name: Build Kernel
      run: |
        export PATH=${{ env.NEUTRON_PATH }}:$PATH
        
        # Variabile de mediu
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        
        # Setăm CC să pointeze direct la Neutron
        export CC=clang
        export LD=ld.lld

        # Curățare
        make clean
        make mrproper
        
        # Generare config
        make r5q_eur_open_defconfig
        
        # Compilare forțată
        make -j$(nproc --all) \
                      ARCH=arm64 \
                      CC=clang \
                      LD=ld.lld \
                      AR=llvm-ar \
                      NM=llvm-nm \
                      OBJCOPY=llvm-objcopy \
                      OBJDUMP=llvm-objdump \
                      STRIP=llvm-strip \
                      CLANG_TRIPLE=aarch64-linux-gnu- \
                      CROSS_COMPILE=aarch64-linux-gnu- \
                      CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
                      LLVM=1 \
                      LLVM_IAS=1 \
                      KCFLAGS="-w"

    - name: Check Output
      run: |
        ls -l arch/arm64/boot/
        if [ -f arch/arm64/boot/Image.gz-dtb ] || [ -f arch/arm64/boot/Image.gz ]; then
            echo "Build successful!"
        else
            echo "Build failed!"
            exit 1
        fi

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-S10Lite-Neutron-Fixed
        path: |
          arch/arm64/boot/Image.gz*
          arch/arm64/boot/dtbo.img
