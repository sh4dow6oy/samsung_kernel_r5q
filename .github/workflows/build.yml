name: Build S10 Lite Kernel (4.14) Android 15 Ready

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev dwarves \
            libncurses-dev git wget unzip make python2 \
            python3 python3-minimal lz4 xz-utils gcc g++

      - name: Download Proton Clang
        run: |
          mkdir -p toolchain
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang

      - name: Pre-build Fixes (Samsung & BPF)
        run: |
          # 1. Rezolvăm eroarea btf.h prin modificarea căii de include
          find . -name "*.c" -type f | xargs sed -i 's|<uapi/linux/btf.h>|<linux/btf.h>|g' || true
          
          # 2. Creăm fișierele dummy pentru a evita erorile de stat (perflog.h)
          mkdir -p system/core/liblog/include/log
          mkdir -p system/logging/liblog/include/log
          touch system/core/liblog/include/log/perflog.h
          touch system/logging/liblog/include/log/perflog.h
          
          # 3. Dezactivăm wrapper-ul de GCC al Samsung
          [ -f scripts/gcc-wrapper.py ] && mv scripts/gcc-wrapper.py scripts/gcc-wrapper.py.disabled || true
          
          # 4. Setăm Python2 ca implicit (multe scripturi 4.14 au nevoie de el)
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Build Kernel
        run: |
          export PATH=$(pwd)/toolchain/proton-clang/bin:$PATH
          
          # Definim argumentele globale de build
          # Adăugăm TECHPACK=true pentru driverele Qualcomm
          MAKE_ARGS="
            O=out \
            ARCH=arm64 \
            CC=clang \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1 \
            KCFLAGS=-Wno-error \
            TECHPACK=true
          "

          mkdir -p out

          # Pasul A: Generăm defconfig-ul (folosește r5q_eur_open_defconfig conform log-ului tău)
          make $MAKE_ARGS r5q_eur_open_defconfig

          # Pasul B: Injectăm setările BPF necesare pentru Android 15
          ./scripts/config --file out/.config --enable CONFIG_BPF_SYSCALL
          ./scripts/config --file out/.config --enable CONFIG_BPF_JIT
          ./scripts/config --file out/.config --enable CONFIG_HAVE_EBPF_JIT
          ./scripts/config --file out/.config --enable CONFIG_NET_CLS_BPF
          ./scripts/config --file out/.config --enable CONFIG_NET_ACT_BPF
          ./scripts/config --file out/.config --enable CONFIG_CGROUP_BPF
          ./scripts/config --file out/.config --disable CONFIG_ANDROID_PARANOID_NETWORK

          # Pasul C: FIX PENTRU RESTART CONFIG (olddefconfig)
          # Această comandă acceptă automat toate opțiunile noi și previne eroarea 'aborted!'
          make $MAKE_ARGS olddefconfig

          # Pasul D: Compilarea efectivă
          make -j$(nproc --all) $MAKE_ARGS

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-S10Lite-A15-Ready
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dtbo.img
            out/arch/arm64/boot/dts/vendor/qcom/*.dtb
