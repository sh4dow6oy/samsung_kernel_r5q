name: Build Samsung SM8150 (Auriana)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Cleanup Environment
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc "/usr/local/share/boost" "$AGENT_TOOLSDIRECTORY"
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison ncurses-dev libssl-dev libelf-dev xz-utils libfl-dev python3 git-core ccache

      - name: Clone Kernel Source
        run: |
          git clone --depth=1 -b auriana https://github.com/sh4dow6oy/android_kernel_samsung_sm8150.git source
          
      - name: Setup Proton Clang
        run: |
          mkdir clang
          cd clang
          wget https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.tar.gz
          tar -xf master.tar.gz
          echo "$(pwd)/proton-clang-master/bin" >> $GITHUB_PATH

      - name: Build Kernel
        run: |
          cd source
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export PATH=$(pwd)/../clang/proton-clang-master/bin:$PATH
          
          mkdir -p out
          
          # PASUL CRITIC: Combinarea configuratiilor
          # Samsung foloseste adesea scriptul merge_config.sh pentru a aplica overlay-ul de regiune
          make O=out ARCH=arm64 sm8150_sec_defconfig
          scripts/kconfig/merge_config.sh -O out/ .config arch/arm64/configs/sm8150_sec_r5q_eur_open.config

          # Compilare efectiva
          make -j$(nproc --all) O=out \
                      ARCH=arm64 \
                      CC=clang \
                      CROSS_COMPILE=aarch64-linux-gnu- \
                      CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
                      LD=ld.lld \
                      AR=llvm-ar \
                      NM=llvm-nm \
                      OBJCOPY=llvm-objcopy \
                      OBJDUMP=llvm-objdump \
                      STRIP=llvm-strip

      - name: Upload Results
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Auriana-R5Q
          path: |
            source/out/arch/arm64/boot/Image.gz
            source/out/arch/arm64/boot/Image.gz-dtb
            source/out/arch/arm64/boot/dtbo.img
            source/out/.config
