name: Build Lumi R5Q 5.4 - OneUI Target
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: LumiPlayground/android_kernel_samsung_sm8150-5.4
          ref: main
          path: kernel
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev \
          ccache python3 python-is-python3 libarchive-tools wget zstd zip \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libncurses-dev libtinfo6 dtc

      - name: Setup Toolchain (Neutron Clang)
        run: |
          mkdir clang
          wget -q https://github.com/Ylarod/setup-ndk-clang/releases/download/prebuilt/clang-linux-x86-ndk-r29-r563880c.tar.zst
          tar -I zstd -xf clang-linux-x86-ndk-r29-r563880c.tar.zst -C clang

      - name: Create OneUI R5Q Defconfig
        run: |
          cd kernel
          # Folosim b2q (S20+) ca baza pentru OneUI 5.4
          cp arch/arm64/configs/vendor/b2q_eur_openx_defconfig arch/arm64/configs/vendor/r5q_oneui_defconfig

          # Modificam DOAR identitatea proiectului
          ./scripts/config --file arch/arm64/configs/vendor/r5q_oneui_defconfig \
            -d CONFIG_PROJECT_B2Q \
            -e CONFIG_PROJECT_R5Q \
            -e CONFIG_SECTION_MISMATCH_WARN_ONLY \
            -e CONFIG_LTO_CLANG_NONE \
            -d CONFIG_LTO_CLANG_THIN

          # NOTA: NU atingem CONFIG_SECURITY_SMACK sau CONFIG_FIVE pentru OneUI.
          
          # Fix pentru erori de link-are in Techpack (Audio/Display)
          find techpack/audio -name "wcd-mbhc-adc.c" -exec sed -i 's/mbhc->slow_insertion/0/g' {} +

      - name: Build Kernel
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export MAKE_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- O=out"

          # Pregatire Config
          make $MAKE_ARGS vendor/r5q_oneui_defconfig
          
          # Daca primesti eroarea cu Stack Protector, dezactiveaza-l manual aici:
          # ./scripts/config --file out/.config -d CONFIG_CC_STACKPROTECTOR_STRONG -e CONFIG_CC_STACKPROTECTOR_NONE
          
          make $MAKE_ARGS olddefconfig

          # Compilare (Image.gz + DTB)
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-fcommon -w" O=out Image.gz dtbs

      - name: Package for OneUI (AnyKernel3)
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          cp kernel/out/arch/arm64/boot/Image.gz AnyKernel3/
          
          # Colectam DTB-urile specifice R5Q
          DTB_PATH="kernel/out/arch/arm64/boot/dts/vendor"
          find "$DTB_PATH" -name "*r5q*.dtb" -exec cat {} + > AnyKernel3/dtb

          cd AnyKernel3
          # Setari specifice pentru instalarea pe OneUI
          sed -i 's/device.name1=maguro/device.name1=r5q/g' anykernel.sh
          sed -i 's/device.name2=panda/device.name2=SM-G770F/g' anykernel.sh
          # OneUI are nevoie de un script de patch pentru fstab de obicei (AnyKernel se ocupa)
          zip -r9 ../Kernel-Lumi-R5Q-OneUI.zip *

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-OneUI-R5Q
          path: Kernel-Lumi-R5Q-OneUI.zip
