name: S10 Lite - Stock Build (Clang 9 GitHub Final)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves libncurses-dev git wget make python2 python3 pahole tar xz-utils lib32z1

      - name: Setup LLVM 9.0.1 (Official GitHub)
        run: |
          mkdir -p toolchain/clang toolchain/gcc
          # Descarcăm binarul oficial LLVM 9 de pe GitHub
          wget https://github.com/llvm/llvm-project/releases/download/llvmorg-9.0.1/clang+llvm-9.0.1-x86_64-linux-gnu-ubuntu-16.04.tar.xz -O clang.tar.xz
          tar -xf clang.tar.xz -C toolchain/clang --strip-components=1
          
          # Descarcăm GCC-ul tău pentru binutils (LD, OBJCOPY, AS)
          wget -L "https://github.com/sh4dow6oy/samsung_kernel_r5q/releases/download/GCC/prebuilts.tar" -O gcc.tar
          tar -xf gcc.tar -C toolchain/gcc
          
          echo "CLANG_PATH=$(pwd)/toolchain/clang/bin" >> $GITHUB_ENV
          GCC_BIN=$(find $(pwd)/toolchain/gcc -name "aarch64-linux-android-gcc" -type f -printf '%h\n' | head -n 1)
          echo "GCC_PATH=$GCC_BIN" >> $GITHUB_ENV

      - name: Essential Samsung Fixes
        run: |
          # Samsung environment fixes
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          mkdir -p system/core/liblog/include/log
          echo -e "#ifndef _PERFLOG_H\n#define _PERFLOG_H\n#endif" > system/core/liblog/include/log/perflog.h
          
          # Eliminăm flag-urile care blochează Clang 9 (unknown argument errors)
          find . -name "Makefile" -o -name "Kbuild" | xargs sed -i 's/-Werror//g' || true
          find . -name "Makefile" -o -name "Kbuild" | xargs sed -i 's/-implicit-function-declaration//g' || true
          find . -name "Makefile" -o -name "Kbuild" | xargs sed -i 's/-Wno-unused-but-set-variable//g' || true
          find . -name "Makefile" -o -name "Kbuild" | xargs sed -i 's/-Wno-maybe-uninitialized//g' || true
          
          # Fix pentru poll_t (compatibilitate 4.14)
          sed -i '/#define _UAPI_LINUX_TYPES_H/a #ifndef __poll_t\n#ifndef __ASSEMBLY__\ntypedef unsigned int __poll_t;\n#endif\n#define __poll_t __poll_t\n#endif' include/uapi/linux/types.h

      - name: Build Kernel
        run: |
          export PATH="${{ env.CLANG_PATH }}:${{ env.GCC_PATH }}:$PATH"
          
          # Forțăm ignorarea warning-urilor rămase prin KCFLAGS
          export KCFLAGS="-Wno-error -Wno-unknown-warning-option -Wno-implicit-function-declaration -Wno-int-conversion"

          MAKE_ARGS="
            O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
          "

          rm -rf out && mkdir -p out
          
          # Configurare și bypass Stack Protector (critic pentru bounds.s)
          make $MAKE_ARGS r5q_eur_open_defconfig
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/CONFIG_CC_STACKPROTECTOR_NONE=y/g' out/.config
          make $MAKE_ARGS olddefconfig
          
          # Generare headere
          make $MAKE_ARGS prepare scripts -j$(nproc --all)
          
          # Compilare principală
          make -j$(nproc --all) $MAKE_ARGS || make -j1 $MAKE_ARGS

          if [ -f out/arch/arm64/boot/Image ]; then
            echo "SUCCESS=true" >> $GITHUB_ENV
          fi

      - name: Package with AnyKernel3
        if: env.SUCCESS == 'true'
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          cp out/arch/arm64/boot/Image AnyKernel3/
          # Dacă sursa generează și dtbo.img, îl punem și pe acela
          [ -f out/arch/arm64/boot/dtbo.img ] && cp out/arch/arm64/boot/dtbo.img AnyKernel3/
          
          cd AnyKernel3
          # Ajustări rapide pentru S10 Lite (r5q)
          sed -i 's/device.name1=maguro/device.name1=r5q/g' anykernel.sh
          sed -i 's/device.name2=toroplus/device.name2=s10lite/g' anykernel.sh
          zip -r ../S10Lite-Kernel-Clang9.zip *

      - name: Upload Build
        if: env.SUCCESS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-Kernel-Final
          path: S10Lite-Kernel-Clang9.zip
