name: Build Roynas R5Q - Ravindu Toolchain Final
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: Roynas-Android-Playground/kernel_samsung_r3q
          ref: master
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev \
          ccache python3 python-is-python3 libarchive-tools wget libtinfo5

      - name: Setup Toolchains
        run: |
          # 1. Clang 4639204
          mkdir clang
          wget -q https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/clang-4639204-cfp-jopp.tar.gz
          tar -xf clang-4639204-cfp-jopp.tar.gz -C clang
          
          # 2. GCC (Calea indicată de tine)
          mkdir gcc-cfp
          wget -q https://github.com/ravindu644/Android-Kernel-Tutorials/releases/download/toolchains/gcc-cfp-jopp-only.tar.gz
          tar -xf gcc-cfp-jopp-only.tar.gz -C gcc-cfp

      - name: Build Kernel
        run: |
          # Definim căile bazate pe structura ta specifică
          CLANG_BIN=$GITHUB_WORKSPACE/clang/bin
          # Aceasta este calea unde se află binarele aarch64-linux-android-gcc
          GCC_BIN=$GITHUB_WORKSPACE/gcc-cfp/gcc-cfp-jopp-only/aarch64-linux-android-4.9/bin
          # Aceasta este calea internă unde se află ld.gold
          GCC_INTERNAL=$GITHUB_WORKSPACE/gcc-cfp/gcc-cfp-jopp-only/aarch64-linux-android-4.9/aarch64-linux-android/bin
          
          # Adăugăm ambele în PATH
          export PATH="$CLANG_BIN:$GCC_BIN:$GCC_INTERNAL:$PATH"

          # FIX LD.GOLD: Samsung caută "aarch64-linux-gnu-ld.gold"
          # Îl legăm de binarul găsit de tine în folderul intern
          ln -sf $GCC_INTERNAL/ld.gold $GCC_BIN/aarch64-linux-gnu-ld.gold
          ln -sf $GCC_INTERNAL/ld.gold $GCC_BIN/aarch64-linux-gnu-ld
          # Facem același lucru pentru prefixul de android dacă Makefile-ul îl cere pe acela
          ln -sf $GCC_INTERNAL/ld.gold $GCC_BIN/aarch64-linux-android-ld.gold

          # Cleanup Polly & KernelSU
          find . -type f \( -name "Makefile*" -o -name "*.mk" -o -name "Kconfig*" \) -exec sed -i 's/-polly-loopfusion-greedy=1//g' {} +
          find . -type f \( -name "Makefile*" -o -name "*.mk" -o -name "Kconfig*" \) -exec sed -i 's/-mllvm -polly//g' {} +
          sed -i '/kernelsu/d' drivers/android/Kconfig
          sed -i '/kernelsu/d' drivers/android/Makefile
          
          # Dezactivăm wrapper-ul Samsung
          sed -i 's/ifneq ($(wildcard $(srctree)\/scripts\/gcc-wrapper.py),)/ifeq (0,1)/g' Makefile

          # Argumente Build (Prefix-ul CROSS_COMPILE trebuie să se potrivească cu binarele din $GCC_BIN)
          # În toolchain-ul tău, binarele se numesc probabil aarch64-linux-android-
          MAKE_ARGS="ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-android- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            LD=aarch64-linux-android-ld.gold \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            O=out"

          # 1. Config
          make $MAKE_ARGS r5q_defconfig
          
          # 2. Patch .config pentru Android 15
          ./scripts/config --file out/.config \
            -d CONFIG_KNOX_KAP \
            -d CONFIG_SECURITY_SAMSUNG_KNOX \
            -d CONFIG_RKP_KDP \
            -d CONFIG_SAMSUNG_PRODUCT_SHIP \
            -d CONFIG_SECURITY_DEFEX \
            -d CONFIG_CC_STACKPROTECTOR_STRONG \
            -e CONFIG_CC_STACKPROTECTOR_NONE \
            -e CONFIG_BPF -e CONFIG_BPF_SYSCALL -e CONFIG_BPF_JIT \
            -e CONFIG_CGROUP_BPF -e CONFIG_NET_CLS_BPF -e CONFIG_NET_ACT_BPF

          make $MAKE_ARGS olddefconfig

          # 3. Compilare
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-fcommon -Wno-error -Wno-unused-command-line-argument"

      - name: Upload Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-Ravindu-A15-Fixed
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/dtbo.img
