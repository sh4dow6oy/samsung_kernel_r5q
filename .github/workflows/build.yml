name: Build Roynas R5Q - Lineage 23.2 eBPF

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Samsung Source
        uses: actions/checkout@v4
        with:
          repository: Roynas-Android-Playground/kernel_samsung_r3q
          ref: master
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev \
          ccache python3 python-is-python3 libarchive-tools wget zstd libtinfo6 zip \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Setup Neutron Clang
        run: |
          mkdir clang
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang

      - name: Manual Structural Backport (Lineage 23.2)
        run: |
          # 1. Adăugăm LineageOS ca sursă de referință
          git remote add lineage https://github.com/LineageOS/android_kernel_google_msm-4.14
          git fetch lineage lineage-23.2 --depth=1

          # 2. REPARAȚIE STRUCTURALĂ (Prevenim erorile 'no member named blinded')
          # Injectăm manual câmpurile necesare în structurile Samsung înainte de a aduce codul nou
          sed -i '/struct bpf_prog {/a \	u8 blinded:1,' include/linux/filter.h
          sed -i '/u8			jited:1,/a \	u8			has_callchain_buf:1,' include/linux/filter.h
          
          # 3. UPSTREAM SELECTIV
          # Injectăm fișierele din ramura 23.2 cerută
          echo "Injectăm componentele eBPF din Lineage 23.2..."
          BPF_FILES=(
            "kernel/bpf"
            "include/linux/bpf.h"
            "include/linux/bpf_types.h"
            "include/uapi/linux/bpf.h"
            "include/uapi/linux/filter.h"
            "net/core/filter.c"
          )

          for file in "${BPF_FILES[@]}"; do
            git checkout lineage/lineage-23.2 -- "$file" || echo "Skip: $file"
          done

      - name: Build Kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          
          # FIX KCONFIG (KernelSU Error)
          sed -i '/kernelsu/d' drivers/android/Kconfig || true
          sed -i '/kernelsu/d' drivers/android/Makefile || true
          
          # NUCLEAR CLEANUP & VDSO FIX
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-mllvm -polly[^ ]*//g' {} +
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-mllvm//g' {} +
          if [ -f arch/arm64/kernel/vdso/Makefile ]; then
            sed -i 's/-static//g' arch/arm64/kernel/vdso/Makefile
          fi

          # Argumente Build
          MAKE_ARGS="ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            O=out"

          # Configurare
          make $MAKE_ARGS r5q_defconfig
          
          # FORCE ENABLE EBPF (Android 16 Requirements)
          # NOTĂ: Dezactivăm CONFIG_BTF pentru a evita erorile de tip 'btf_type_by_id'
          ./scripts/config --file out/.config \
            -e CONFIG_BPF \
            -e CONFIG_BPF_SYSCALL \
            -e CONFIG_BPF_JIT \
            -e CONFIG_HAVE_EBPF_JIT \
            -e CONFIG_NET_CLS_BPF \
            -e CONFIG_NET_ACT_BPF \
            -e CONFIG_CGROUP_BPF \
            -e CONFIG_BPF_EVENTS \
            -e CONFIG_BPF_STREAM_PARSER \
            -d CONFIG_BTF \
            -d CONFIG_LTO_CLANG -e CONFIG_LTO_NONE \
            -d CONFIG_KNOX_KAP -d CONFIG_SECURITY_SAMSUNG_KNOX
            
          make $MAKE_ARGS olddefconfig

          # Compilare
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-fcommon -Wno-error -Wno-unknown-warning-option -Wno-unused-command-line-argument -mno-outline-atomics"

      - name: Package with AnyKernel3
        run: |
          IMAGE="$GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz-dtb"
          if [ ! -f "$IMAGE" ]; then IMAGE="$GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz"; fi
          DTBO="$GITHUB_WORKSPACE/out/arch/arm64/boot/dtbo.img"
          git clone https://github.com/osm0sis/AnyKernel3.git
          rm -rf AnyKernel3/.git
          cp $IMAGE AnyKernel3/Image.gz
          [ -f "$DTBO" ] && cp $DTBO AnyKernel3/dtbo.img
          sed -i 's/device.name1=maguro/device.name1=r5q/g' AnyKernel3/anykernel.sh
          cd AnyKernel3 && zip -r9 ../Kernel-S10Lite-L23.2-eBPF.zip *

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-S10Lite-eBPF-Lineage23.2
          path: Kernel-S10Lite-L23.2-eBPF.zip
