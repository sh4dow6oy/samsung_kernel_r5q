name: S10 Lite Kernel Build - v134 (Google Base Rebase)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Google MSM 4.14 (Base)
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_google_msm-4.14
          ref: lineage-18.1
          path: kernel-res
          fetch-depth: 1

      - name: Checkout Samsung S10 Lite (Source for Drivers)
        uses: actions/checkout@v4
        with:
          repository: mainey/android_kernel_samsung_r5q
          ref: lineage-18.1
          path: samsung-src
          fetch-depth: 1

      - name: Setup Proton Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves make python3 lz4 perl git curl
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang

      - name: The Great Driver Transplant
        run: |
          cd kernel-res
          # 1. Copiem driverele specifice Samsung pentru SM8150 (r5q)
          cp -rv ../samsung-src/drivers/soc/samsung drivers/soc/
          cp -rv ../samsung-src/drivers/gpu/drm/msm/samsung drivers/gpu/drm/msm/
          cp -rv ../samsung-src/drivers/input/touchscreen/samsung drivers/input/touchscreen/
          
          # 2. Copiem definitiile hardware (Device Tree) - Esential pentru boot!
          cp -rv ../samsung-src/arch/arm64/boot/dts/samsung arch/arm64/boot/dts/
          
          # 3. Copiem Defconfig-ul original S10 Lite
          cp ../samsung-src/arch/arm64/configs/r5q_eur_open_defconfig arch/arm64/configs/
          
          # 4. Inregistram noile foldere in Makefile-ul bazei Google
          echo "obj-y += samsung/" >> drivers/soc/Makefile
          echo "obj-y += samsung/" >> drivers/gpu/drm/msm/Makefile

      - name: Architect's Surgical Prep
        run: |
          cd kernel-res
          # Rezolvam vesnica problema cu ss_dsi_panel_debug si firmware
          find drivers/gpu/drm/msm/samsung -name Makefile -exec sed -i 's/obj-y += ss_dsi_panel_debug.o/#/g' {} +
          mkdir -p firmware/tsp_sec
          touch firmware/tsp_sec/y771_r5.bin
          touch firmware/tsp_sec/y771_r5_1l.bin
          
          # Injectam definitiile de compatibilitate Clang
          echo "#define __builtin_assume_aligned(x, ...) (x)" >> include/linux/compiler-clang.h

      - name: Build Kernel (Transplanted Mode)
        run: |
          cd kernel-res
          export PATH=$(pwd)/../toolchain/proton-clang/bin:$PATH
          
          # Generam config-ul bazat pe S10 Lite
          make ARCH=arm64 CC=clang r5q_eur_open_defconfig
          
          # Fortam activarea eBPF (care acum exista nativ in baza Google!)
          ./scripts/config --enable CONFIG_BPF_SYSCALL
          ./scripts/config --enable CONFIG_BPF_JIT
          
          # Dezactivam Knox/SEC_DEBUG care nu exista in baza Google
          ./scripts/config --disable CONFIG_SEC_DEBUG
          ./scripts/config --disable CONFIG_SECURITY_SAMSUNG_RKP
          
          make ARCH=arm64 CC=clang olddefconfig
          
          MAKE_ARGS="ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1"
          export KCFLAGS="-Wno-everything -Wno-error -Wno-implicit-function-declaration -Wno-int-conversion"

          make -j$(nproc --all) $MAKE_ARGS Image.gz-dtb || make -j$(nproc --all) $MAKE_ARGS Image.gz

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-GoogleBase-v134
          path: |
            kernel-res/arch/arm64/boot/Image.gz-dtb
            kernel-res/arch/arm64/boot/Image.gz
