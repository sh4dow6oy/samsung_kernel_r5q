name: S10 Lite (V31 - Manual BTF Header Fix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex git libssl-dev libelf-dev clang llvm lld zstd curl python3 device-tree-compiler gcc-aarch64-linux-gnu

      - name: Download Toolchain
        run: |
          mkdir -p clang
          wget https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang

      - name: Prepare Source
        run: |
          # 1. Permisiuni
          chmod -R 777 scripts/
          
          # 2. Curatare Makefile de secgetspf (inca mai apare in log-uri uneori)
          find . -type f -name "Makefile*" -exec sed -i 's/$(shell secgetspf)//g' {} +
          
          # 3. Patch DTC yylloc (pentru a evita erori la generarea dtb-urilor)
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' scripts/dtc/dtc-lexer.lex.c_shipped || true
          
          # 4. Mocking Samsung logging headers
          mkdir -p system/core/liblog/include/log
          mkdir -p system/logging/liblog/include/log
          touch system/core/liblog/include/log/perflog.h
          touch system/logging/liblog/include/log/perflog.h

      - name: Build Kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          
          # Parametrii de build
          MAKE_ARGS="ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            O=out"

          # Configurare
          make $MAKE_ARGS g770f_defconfig

          # Patch .config
          ./scripts/config --file out/.config \
            -d CONFIG_CC_WERROR \
            -d CONFIG_CC_STACKPROTECTOR_STRONG \
            -e CONFIG_CC_STACKPROTECTOR_NONE

          make $MAKE_ARGS olddefconfig

          # COMPILARE
          # -Iusr/include ajuta compilatorul sa gaseasca headerele UAPI generate sau adaugate manual
          make -j$(nproc --all) $MAKE_ARGS \
            KCFLAGS="--target=aarch64-linux-gnu \
                     -I$(pwd)/include/uapi \
                     -I$(pwd)/arch/arm64/include/uapi \
                     -fcommon \
                     -fno-stack-protector \
                     -Wno-error \
                     -Wno-strict-prototypes \
                     -Wno-deprecated-declarations \
                     -Wno-implicit-function-declaration" \
            2>&1 | tee build.log

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-V31-Result
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/dtbo.img
            build.log
