name: S10 Lite (Royna + BPF + Nuclear Clean)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Royna Base
        uses: actions/checkout@v4
        with:
          repository: Roynas-Android-Playground/kernel_samsung_r3q
          ref: master
          path: main

      - name: Checkout Pascua BPF
        uses: actions/checkout@v4
        with:
          repository: pascua28/android_kernel_samsung_sm7150
          ref: bpf
          path: bpf_source

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex git libssl-dev libelf-dev clang llvm lld zstd curl python3

      - name: Download Neutron Clang
        run: |
          mkdir -p main/clang
          wget https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C main/clang

      - name: BPF Merge
        run: |
          rm -rf main/kernel/bpf main/include/linux/bpf* main/include/uapi/linux/bpf*
          cp -r bpf_source/kernel/bpf main/kernel/
          cp bpf_source/include/linux/bpf* main/include/linux/
          cp bpf_source/include/uapi/linux/bpf* main/include/uapi/linux/
          cp bpf_source/include/linux/filter.h main/include/linux/

      - name: Nuclear Cleanup & Patching
        run: |
          cd main
          export PATH="$GITHUB_WORKSPACE/main/clang/bin:$PATH"

          # 1. NUCLEAR CLEANUP (Prevenim Error 1 cauzat de flag-uri LLVM incompatibile)
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-mllvm -polly[^ ]*//g' {} +
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-mllvm//g' {} +
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-polly[^ ]*//g' {} +

          # 2. VDSO FIX (Anti-static link errors)
          if [ -f arch/arm64/kernel/vdso/Makefile ]; then
            sed -i 's/-static//g' arch/arm64/kernel/vdso/Makefile
            sed -i 's/$(LDFLAGS)/$(filter-out -static,$(LDFLAGS))/g' arch/arm64/kernel/vdso/Makefile
          fi

          # 3. KERNELSU & SAMSUNG CLEANUP
          sed -i '/kernelsu/d' drivers/android/Kconfig || true
          sed -i '/kernelsu/d' drivers/android/Makefile || true
          rm -rf drivers/kernelsu
          # Dezactivăm gcc-wrapper-ul care injectează flag-uri de GCC în Clang
          sed -i 's/ifneq ($(wildcard $(srctree)\/scripts\/gcc-wrapper.py),)/ifeq (0,1)/g' Makefile
          
          # Fix asamblare .inst pentru IAS
          find arch/arm64 -name "*.S" -exec sed -i 's/\.inst\.w/.inst/g' {} +

      - name: Configure and Build
        run: |
          cd main
          export PATH="$GITHUB_WORKSPACE/main/clang/bin:$PATH"

          # 4. Argumente Build
          MAKE_ARGS="ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            O=out"

          # 5. Configurare
          make $MAKE_ARGS r5q_defconfig
          
          ./scripts/config --file out/.config \
            -d CONFIG_LTO -d CONFIG_LTO_CLANG -e CONFIG_LTO_NONE \
            -d CONFIG_CC_STACKPROTECTOR_STRONG -e CONFIG_CC_STACKPROTECTOR_NONE \
            -d CONFIG_SHADOW_CALL_STACK -d CONFIG_KNOX_KAP -d CONFIG_SECURITY_SAMSUNG_KNOX \
            -d CONFIG_ASSIST_KSU -d CONFIG_KSU \
            -e CONFIG_BPF_SYSCALL -e CONFIG_BPF_JIT
            
          make $MAKE_ARGS olddefconfig

          # 6. Compilare (Adăugăm flag-urile de iertare KCFLAGS)
          make -j$(nproc --all) $MAKE_ARGS \
            KCFLAGS="-fcommon -Wno-error -Wno-unknown-warning-option -Wno-unused-command-line-argument" \
            2>&1 | tee build.log

      - name: Upload Kernel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-Nuclear-Image
          path: |
            main/out/arch/arm64/boot/Image.gz-dtb
            main/out/arch/arm64/boot/dtbo.img
            main/build.log
