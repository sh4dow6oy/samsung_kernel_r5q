name: Build Samsung SM8150 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        repository: LumiPlayground/android_kernel_samsung_sm8150
        ref: auriana
        path: kernel

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm libncurses-dev wget git

    - name: Download Modern Toolchain (Clang 13 + GCC 9.3)
      run: |
        # Folosim Proton Clang, un toolchain foarte popular pentru kernel-uri Android
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain
        echo "TC_BIN=$(pwd)/toolchain/bin" >> $GITHUB_ENV

    - name: Build Kernel
      run: |
        cd kernel
        
        # Setup PATH către noul toolchain
        export PATH="${{ env.TC_BIN }}:$PATH"
        
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        export CC=clang
        export AR=llvm-ar
        export NM=llvm-nm
        export OBJCOPY=llvm-objcopy
        export OBJDUMP=llvm-objdump
        export STRIP=llvm-strip
        
        # Variabile specifice Samsung/Qualcomm
        export KERNEL_MAKE_ENV="DTC_EXT=$(pwd)/scripts/dtc/dtc \
                                CONFIG_BUILD_ARM64_DT_OVERLAY=y \
                                CLANG_TRIPLE=aarch64-linux-gnu-"

        # 1. Configurare (Metoda CAT)
        cat arch/arm64/configs/sm8150_sec_defconfig arch/arm64/configs/sm8150_sec_r5q_eur_open.config > arch/arm64/configs/combined_defconfig
        

        make O=out $KERNEL_MAKE_ENV combined_defconfig
        
        # Aplicăm setările automate (acest toolchain va trece de verificarea 5.1)
        make O=out $KERNEL_MAKE_ENV olddefconfig

        # 2. Build
        # Proton Clang suportă -ftrivial-auto-var-init=zero, deci nu mai e nevoie de sed pe Makefile
        make -j$(nproc --all) O=out $KERNEL_MAKE_ENV KCFLAGS="-w"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-SM8150-r5q
        path: |
          kernel/out/arch/arm64/boot/Image.gz-dtb
          kernel/out/arch/arm64/boot/dtbo.img
          kernel/out/.config
