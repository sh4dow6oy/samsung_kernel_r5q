name: Build R5Q - LineageOS V58 (Fix DT Include)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LineageOS SM8150
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_qcom_sm8150
          ref: lineage-20
          path: kernel

      - name: Download r5q_defconfig
        run: |
          wget -O kernel/arch/arm64/configs/r5q_defconfig https://raw.githubusercontent.com/Roynas-Android-Playground/kernel_samsung_r3q/master/arch/arm64/configs/r5q_defconfig

      - name: Fix DT Bindings & Includes
        run: |
          cd kernel/arch/arm64/boot/dts
          # Creăm legături între vendorii de dts pentru a evita erorile de "file not found"
          mkdir -p samsung
          # Uneori fișierele Samsung caută în ../qcom sau direct în dt-bindings
          ln -s ../../../scripts/dtc/include-prefixes/dt-bindings dt-bindings || true
          
          # Fix pentru eroarea specifică din log: arm-gic.h
          # Forțăm includerea căii de scripturi în calea de căutare a preprocesorului
          cd ../../../..
          
      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu bc libssl-dev python3 bison flex
          mkdir -p clang
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang

      - name: Build Kernel & DTBO
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          
          # Folosim -I pentru a forța compilatorul să găsească headerele DT
          EXTRA_INC="-I$(pwd)/scripts/dtc/include-prefixes"
          
          MAKE_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CLANG_TRIPLE=aarch64-linux-gnu- O=out"
          
          make $MAKE_ARGS r5q_defconfig
          
          # Activăm suportul DTBO și scoatem RTIC
          ./scripts/config --file out/.config -e CONFIG_BUILD_ARM64_DT_OVERLAY -d CONFIG_SAMSUNG_RTIC -d CONFIG_WERROR
          
          make $MAKE_ARGS olddefconfig
          
          # Compilăm cu extra include path pentru DTC
          make -j$(nproc --all) $MAKE_ARGS Image.gz dtbs dtbo.img KCFLAGS="$EXTRA_INC -w -fcommon" DTC_FLAGS="-i $(pwd)/scripts/dtc/include-prefixes"

      - name: Assemble AnyKernel3
        run: |
          OUT="kernel/out/arch/arm64/boot"
          git clone https://github.com/osm0sis/AnyKernel3.git AK3
          
          # Copiem Image.gz
          cp $OUT/Image.gz AK3/
          
          # Copiem DTBO
          find kernel/out -name "dtbo.img" -exec cp {} AK3/dtbo.img \;
          
          # Concatenăm DTB la Image (r5q specific)
          # Căutăm dtb-ul sm8150 sau r5q
          DTB=$(find $OUT/dts -name "*sm8150*.dtb" -o -name "*r5q*.dtb" | head -n 1)
          if [ -f "$DTB" ]; then
            cat $OUT/Image.gz $DTB > AK3/Image.gz
          fi
          
          cd AK3
          sed -i 's/device.name1=maguro/device.name1=r5q/g' anykernel.sh
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          zip -r9 ../R5Q_Lineage_V58.zip *

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-R5Q-V58
          path: R5Q_Lineage_V58.zip
