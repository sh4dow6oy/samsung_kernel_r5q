name: S10 Lite - Proton Clang Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves libncurses-dev git wget make python2 python3 pahole tar xz-utils lib32z1

      - name: Setup Proton Clang
        run: |
          # Clonăm Proton Clang - este un toolchain "all-in-one"
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang
          echo "PROTON_PATH=$(pwd)/toolchain/proton-clang/bin" >> $GITHUB_ENV

      - name: Build Kernel
        run: |
          export PATH="${{ env.PROTON_PATH }}:$PATH"
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          
          # Argumente de build "Pure LLVM"
          # Proton Clang permite folosirea LLVM=1 complet (mult mai rapid și curat)
          MAKE_ARGS="
            O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1
          "
          
          # KCFLAGS pentru a ignora warning-urile specifice Samsung fără a atinge codul
          export KCFLAGS="-Wno-error -Wno-implicit-function-declaration -Wno-strict-prototypes -Wno-unknown-warning-option -Wno-implicit-int -Wno-int-conversion"

          rm -rf out && mkdir -p out
          
          # 1. Configurare
          make $MAKE_ARGS r5q_eur_open_defconfig
          
          # 2. Fix stack protector în .config (nu în sursă)
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/CONFIG_CC_STACKPROTECTOR_NONE=y/g' out/.config
          make $MAKE_ARGS olddefconfig
          
          # 3. Build (J$(nproc) pentru viteză maximă)
          make -j$(nproc --all) $MAKE_ARGS || make -j1 $MAKE_ARGS

          if [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image .
            [ -f out/arch/arm64/boot/dtbo.img ] && cp out/arch/arm64/boot/dtbo.img .
            echo "SUCCESS=true" >> $GITHUB_ENV
          fi

      - name: Package AnyKernel3
        if: env.SUCCESS == 'true'
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
          cp Image AnyKernel3/
          [ -f dtbo.img ] && cp dtbo.img AnyKernel3/
          cd AnyKernel3
          sed -i 's/device.name1=maguro/device.name1=r5q/g' anykernel.sh
          zip -r ../S10Lite-Kernel-Proton.zip *

      - name: Upload
        if: env.SUCCESS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-Proton-Kernel
          path: S10Lite-Kernel-Proton.zip
