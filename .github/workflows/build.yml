name: Build Prime Kernel R5Q

on:
  workflow_dispatch:
    inputs:
      release:
          description: 'Upload release'
          type: boolean
          required: true
          default: false
      changelog:
          description: 'Changelog'
          type: string
          required: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_ts: ${{ steps.ts.outputs.release_ts }}
    steps:
      - name: Generate release date
        id: ts
        run: echo "release_ts=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

  build:
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git curl unzip wget zip zstd \
            bc bison flex libssl-dev libelf-dev python3 python-is-python3 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Download Proton Clang
        run: |
          mkdir clang-stable
          wget https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.tar.gz -O clang.tar.gz
          tar -xf clang.tar.gz -C clang-stable --strip-components=1
          chmod -R +x clang-stable/bin/

      - name: Build kernel
        run: |
          # 1. Setup PATH corect
          export PATH="$(pwd)/clang-stable/bin:$PATH"
          
          # 2. Definire variabile de build (fara spatii problematice)
          export ARCH=arm64
          export SUBARCH=arm64
          export HEADER_ARCH=arm64
          export KBUILD_BUILD_USER=Prime
          export KBUILD_BUILD_HOST=Kernel
          
          # 3. NUCLEAR CLEAN & Fix Samsung Scripts
          echo "exit 0" > scripts/gcc-goto.sh
          chmod +x scripts/gcc-goto.sh
          echo "#!/bin/bash" > secgetspf
          echo "exit 0" >> secgetspf
          chmod +x secgetspf
          export PATH="$PATH:$(pwd)"

          # 4. Parametrii Make
          # Folosim LLVM=1 pentru a seta automat majoritatea utilitarelor (clang, ld.lld, etc.)
          MAKE_ARGS="ARCH=arm64 \
            O=out \
            CC=clang \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            LD=ld.lld \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            DTC_EXT=$(pwd)/scripts/dtc"

          # 5. Build Sequence
          # Initializare out directory
          mkdir -p out
          
          # Defconfig
          make $MAKE_ARGS r5q_eur_open_defconfig

          # 6. Patch .config direct (evita erorile de scripturi Samsung)
          sed -i 's/CONFIG_SEC_DEBUG=y/CONFIG_SEC_DEBUG=n/g' out/.config || true
          sed -i 's/CONFIG_SEC_DEBUG_COMMON=y/CONFIG_SEC_DEBUG_COMMON=n/g' out/.config || true
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/CONFIG_CC_STACKPROTECTOR_NONE=y/g' out/.config || true
          echo "CONFIG_CC_HAVE_ASM_GOTO=y" >> out/.config

          # 7. Compilare efectiva
          make $MAKE_ARGS olddefconfig
          make $MAKE_ARGS -j$(nproc --all) Image.gz-dtb

          # 8. Mutare rezultat
          if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
            mkdir -p AnyKernel3
            cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          else
            echo "Kernel build failed - Image.gz-dtb not found!"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrimeKernel-R5Q-${{ needs.prepare.outputs.release_ts }}
          path: AnyKernel3/Image.gz-dtb

  release:
    needs: [prepare, build]
    if: github.event.inputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ needs.prepare.outputs.release_ts }}"
          name: "PrimeKernel-R5Q-${{ needs.prepare.outputs.release_ts }}"
          body: "${{ github.event.inputs.changelog }}"
          files: artifacts/PrimeKernel-R5Q-*/Image.gz-dtb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
