name: Build R5Q - LumiPlayground BPF V25

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout LumiPlayground Kernel
        uses: actions/checkout@v4
        with:
          repository: LumiPlayground/android_kernel_samsung_sm8150
          ref: rawr-bpf
          path: kernel

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev \
          ccache python3 python-is-python3 libarchive-tools wget zstd libtinfo6 zip \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi device-tree-compiler rsync git

      - name: Setup Toolchain (Neutron Clang)
        run: |
          mkdir -p clang
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang

      - name: Patch & Prepare
        run: |
          cd kernel
          # Fix DM-BOW (Sector Size)
          sed -i 's/#define SECTOR_SIZE 512/#ifndef SECTOR_SIZE\n#define SECTOR_SIZE 512\n#endif/' drivers/md/dm-bow.c
          
          # Kernel Spoofing la 4.14.300+ (pentru a mulțumi Android 15)
          # Unele versiuni de Android 15 cer minim 4.14.x ridicat
          sed -i 's/PATCHLEVEL = 14/PATCHLEVEL = 14/g' Makefile 

      - name: Build Kernel
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          MAKE_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- O=out"
          
          # Folosim defconfig-ul nativ pentru r5q din acest repo
          make $MAKE_ARGS r5q_eur_open_defconfig
          
          # Forțăm activarea BPF (BPF_SYSCALL este inima Android 15)
          ./scripts/config --file out/.config \
            -e CONFIG_BPF \
            -e CONFIG_BPF_SYSCALL \
            -e CONFIG_BPF_JIT \
            -e CONFIG_BPF_JIT_ALWAYS_ON \
            -e CONFIG_NETFILTER_XT_MATCH_BPF \
            -e CONFIG_CGROUP_BPF \
            -d CONFIG_WERROR \
            -e CONFIG_LTO_NONE
            
          make $MAKE_ARGS olddefconfig
          
          # Compilăm Image.gz, DTBs și DTBO
          make -j$(nproc --all) $MAKE_ARGS Image.gz dtbs dtbo.img KCFLAGS="-w -fcommon"

      - name: Assemble AnyKernel3
        run: |
          # Identificăm fișierele generate în folderul 'out'
          OUT="kernel/out/arch/arm64/boot"
          IMAGE="$OUT/Image.gz"
          DTB=$(find $OUT/dts -name "*r5q*.dtb" -type f | head -n 1)
          DTBO=$(find $OUT -name "dtbo.img" -type f | head -n 1)

          if [ ! -f "$IMAGE" ]; then
            echo "EROARE: Image.gz nu a fost generat!"
            exit 1
          fi

          # Setup AnyKernel3
          git clone https://github.com/osm0sis/AnyKernel3.git AK3
          
          # Samsung Style: Concatenăm DTB la Image.gz
          if [ -n "$DTB" ]; then
            echo "Folosim DTB: $DTB"
            cat "$IMAGE" "$DTB" > AK3/Image.gz
          else
            cp "$IMAGE" AK3/Image.gz
          fi
          
          # Adăugăm DTBO dacă există
          [ -f "$DTBO" ] && cp "$DTBO" AK3/dtbo.img

          # Configurare AnyKernel3 pentru S10 Lite
          cd AK3
          sed -i 's/device.name1=maguro/device.name1=r5q/g' anykernel.sh
          sed -i 's/device.name2=toroplus/device.name2=SM-G770F/g' anykernel.sh
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          
          zip -r9 ../S10Lite_Lumi_BPF_V25.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-Lumi-BPF-V25
          path: S10Lite_Lumi_BPF_V25.zip
