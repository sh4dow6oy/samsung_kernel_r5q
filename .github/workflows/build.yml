name: r5q Kernel - Apply eBPF Patch 387879

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex gcc-aarch64-linux-gnu git libssl-dev python3 clang llvm

      - name: Clone Mainey Kernel (r5q)
        run: |
          git clone --depth=100 https://github.com/mainey/android_kernel_samsung_r5q.git -b lineage-19.0 kernel
          cd kernel
          git config user.email "bot@build.com"
          git config user.name "Kernel-Builder"

      - name: Fetch and Cherry-pick eBPF Patch
        run: |
          cd kernel
          # Comanda ta specifica pentru Gerrit LineageOS
          git fetch https://github.com/LineageOS/android_kernel_samsung_sm7125 refs/changes/79/387879/1
          
          # Incercam cherry-pick. Daca esueaza, continuam pentru a vedea erorile.
          git cherry-pick FETCH_HEAD || echo "Conflicte detectate la eBPF. Va fi nevoie de fix-uri manuale."

      - name: Fix eBPF Configs (Auto-Enable)
        run: |
          cd kernel
          # Android 13/14 necesita aceste optiuni active in defconfig
          scripts/config --file arch/arm64/configs/r5q_defconfig -e BPF
          scripts/config --file arch/arm64/configs/r5q_defconfig -e BPF_SYSCALL
          scripts/config --file arch/arm64/configs/r5q_defconfig -e BPF_JIT
          scripts/config --file arch/arm64/configs/r5q_defconfig -e CGROUP_BPF
          scripts/config --file arch/arm64/configs/r5q_defconfig -e NETFILTER_XT_MATCH_BPF

      - name: Compile Kernel
        run: |
          cd kernel
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          
          make O=out r5q_defconfig
          # Folosim -i pentru a ignora erorile si a vedea cat de departe ajunge build-ul
          make -j$(nproc --all) O=out KCFLAGS="-Wno-error"

      - name: Store Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-S10Lite-eBPF-Test
          path: kernel/out/arch/arm64/boot/Image.gz-dtb
