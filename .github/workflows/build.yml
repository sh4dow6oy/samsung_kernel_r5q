name: Build Lumi R5Q - Native BPF Project-Fixed
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: LumiPlayground/android_kernel_samsung_sm8150
          ref: rawr-bpf
          path: kernel
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev \
          ccache python3 python-is-python3 libarchive-tools wget zstd zip \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libncurses-dev libtinfo6 \
          device-tree-compiler

      - name: Setup Toolchain (Neutron Clang)
        run: |
          mkdir clang
          wget -q https://github.com/Ylarod/setup-ndk-clang/releases/download/prebuilt/clang-linux-x86-ndk-r29-r563880c.tar.zst
          tar -I zstd -xf clang-linux-x86-ndk-r29-r563880c.tar.zst -C clang

      - name: Prepare Source & Fixes
        run: |
          cd kernel
          # 1. Permisiuni pentru utilitarele Lumi
          chmod -R +x tools/
          
          # 2. Fix COMMON symbols
          grep -r "bool main_ext_ss_not_working" . | cut -d: -f1 | xargs sed -i 's/bool main_ext_ss_not_working/static bool main_ext_ss_not_working/g' || true
          
          # 3. Configurare Defconfig cu flag-urile de proiect Samsung
          # Am adaugat CONFIG_SEC_R5Q_PROJECT=y care deblocheaza folderul renovation
          ./scripts/config --file arch/arm64/configs/r5q_eur_open_defconfig \
            -d CONFIG_RTIC \
            -d CONFIG_RTIC_MP \
            -d CONFIG_RTIC_KDP \
            -e CONFIG_BPF_SYSCALL \
            -e CONFIG_BUILD_ARM64_DT_OVERLAY \
            -e CONFIG_PROJECT_R5Q \
            -e CONFIG_SEC_R5Q_PROJECT \
            -e CONFIG_SAMSUNG_PRODUCT_SHIP \
            -e CONFIG_LTO_CLANG_NONE \
            -d CONFIG_LTO_CLANG_THIN \
            -e CONFIG_SECTION_MISMATCH_WARN_ONLY

      - name: Build Kernel
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          
          # Exportam variabilele de proiect si in mediu pentru a forta Makefile-urile
          export MAKE_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang \
            DTC_EXT=$(pwd)/tools/dtc \
            CONFIG_BUILD_ARM64_DT_OVERLAY=y \
            CONFIG_PROJECT_R5Q=y \
            CONFIG_SEC_R5Q_PROJECT=y \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD=ld.lld \
            O=out"

          # Init config
          make $MAKE_ARGS r5q_eur_open_defconfig
          make $MAKE_ARGS olddefconfig
          
          # Build propriu-zis
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-fcommon -w" O=out Image.gz dtbs

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          cp kernel/out/arch/arm64/boot/Image.gz AnyKernel3/
          
          # Colectare DTB
          echo "Colectam DTB-uri..."
          find kernel/out/arch/arm64/boot/dts/ -name "*.dtb" -type f -exec cat {} + > AnyKernel3/dtb
          
          # Colectare DTBO (Deep Search in folderul out)
          echo "Colectam DTBO-uri (inclusiv din renovation)..."
          find kernel/out/ -name "*.dtbo" -type f -exec cat {} + > AnyKernel3/dtbo.img

          # Debug: Afisam dimensiunile
          echo "--- RAPORT FINALE DIMENSIUNI ---"
          du -sh AnyKernel3/dtb
          du -sh AnyKernel3/dtbo.img
          echo "-------------------------------"

          cd AnyKernel3
          sed -i 's/device.name1=maguro/device.name1=r5q/g' anykernel.sh
          sed -i 's/device.name2=panda/device.name2=SM-G770F/g' anykernel.sh
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          
          zip -r9 ../Lumi-R5Q-BPF-Final-Project-Fixed.zip *

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Lumi-R5Q-BPF-Project-Fixed
          path: Lumi-R5Q-BPF-Final-Project-Fixed.zip
