name: Build Lumi R5Q 5.4 - OneUI Ultimate
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: LumiPlayground/android_kernel_samsung_sm8150-5.4
          ref: main
          path: kernel
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev \
          ccache python3 python-is-python3 libarchive-tools wget zstd zip \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libncurses-dev libtinfo6 \
          device-tree-compiler
      - name: Setup Toolchain (Neutron Clang)
        run: |
          mkdir clang
          wget -q https://github.com/Ylarod/setup-ndk-clang/releases/download/prebuilt/clang-linux-x86-ndk-r29-r563880c.tar.zst
          tar -I zstd -xf clang-linux-x86-ndk-r29-r563880c.tar.zst -C clang
      - name: Prepare Source & Fixes
        run: |
          cd kernel
          # 1. Permisiuni pentru tools (critic conform link-ului tau)
          chmod +x tools/dtc
          
          # 2. Fix Multiple Definition Error
          grep -r "bool main_ext_ss_not_working" . | cut -d: -f1 | xargs sed -i 's/bool main_ext_ss_not_working/static bool main_ext_ss_not_working/g' || true
          # 3. Defconfig R5Q (OneUI Target)
          cp arch/arm64/configs/vendor/b2q_eur_openx_defconfig arch/arm64/configs/vendor/r5q_oneui_defconfig
          ./scripts/config --file arch/arm64/configs/vendor/r5q_oneui_defconfig \
            -d CONFIG_PROJECT_B2Q -e CONFIG_PROJECT_R5Q \
            -e CONFIG_SECTION_MISMATCH_WARN_ONLY -e CONFIG_SAMSUNG_PRODUCT_SHIP \
            -e CONFIG_BUILD_ARM64_DT_OVERLAY
      - name: Build Kernel
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          
          # Integrare KERNEL_MAKE_ENV din sursa Lumi
          export MAKE_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang \
            DTC_EXT=$(pwd)/tools/dtc \
            CONFIG_BUILD_ARM64_DT_OVERLAY=y \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            O=out"
          make $MAKE_ARGS vendor/r5q_oneui_defconfig
          make $MAKE_ARGS olddefconfig
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-fcommon -w" O=out Image.gz dtbs
      
      - name: Manual DTBO Compilation (R5Q Revisions)
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/Image.gz
          
          echo "### Incepe Compilarea Manuala a DTBO (r00-r09) ###"
          mkdir -p dtbo_manual
          DTS_ROOT="kernel/arch/arm64/boot/dts"
          SAMSUNG_DIR="$DTS_ROOT/samsung"
          RENOVATION_DIR="$SAMSUNG_DIR/renovation"

          # 1. Procesam toate entry-point-urile (.dts) pentru R5Q
          # Includem toate folderele de DTS pentru a gasi .dtsi-urile de audio/pinctrl
          find "$RENOVATION_DIR" -name "sm8150-sec-r5q-overlay*.dts" | while read -r dts_file; do
            dtbo_name=$(basename "$dts_file" .dts).dtbo
            echo "Preprocesare Clang + DTC: $dtbo_name"

            # Preprocesare (Uneste codul din .dts cu .dtsi)
            clang -E -nostdinc -undef -D__DTS__ -x assembler-with-cpp \
              -I kernel/include \
              -I "$DTS_ROOT" \
              -I "$DTS_ROOT/qcom" \
              -I "$SAMSUNG_DIR" \
              -I "$RENOVATION_DIR" \
              "$dts_file" -o "dtbo_manual/temp.dts"

            # Compilare in binar .dtbo
            kernel/tools/dtc -@ -I dts -O dtb -o "dtbo_manual/$dtbo_name" "dtbo_manual/temp.dts"
          done

          # 2. Adaugam si System Update Overlay (important pentru stabilitate Samsung)
          if [ -f "$RENOVATION_DIR/sm8150-sec-system-update-overlay.dts" ]; then
             clang -E -nostdinc -undef -D__DTS__ -x assembler-with-cpp \
               -I kernel/include -I "$DTS_ROOT" -I "$DTS_ROOT/qcom" -I "$SAMSUNG_DIR" -I "$RENOVATION_DIR" \
               "$RENOVATION_DIR/sm8150-sec-system-update-overlay.dts" -o "dtbo_manual/update.dts"
             kernel/tools/dtc -@ -I dts -O dtb -o "dtbo_manual/system-update.dtbo" "dtbo_manual/update.dts"
          fi

          # 3. Concatenare finala
          cat dtbo_manual/*.dtbo > AnyKernel3/dtbo.img
          
          echo "--- VERIFICARE REZULTATE ---"
          ls -lh AnyKernel3/Image.gz
          if [ -s AnyKernel3/dtbo.img ]; then
            du -sh AnyKernel3/dtbo.img
            echo "SUCCES: DTBO a fost generat manual cu suport R5Q (r00-r09)."
          else
            echo "EROARE: dtbo.img este GOL!"
            exit 1
          fi
          echo "----------------------------"

          cd AnyKernel3
          sed -i 's/device.name1=maguro/device.name1=r5q/g' anykernel.sh
          sed -i 's/device.name2=panda/device.name2=SM-G770F/g' anykernel.sh
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          zip -r9 ../Lumi-R5Q-Complete-BPF-Final.zip *

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Lumi-R5Q-Final-Kernel
          path: Lumi-R5Q-Complete-BPF-Final.zip
