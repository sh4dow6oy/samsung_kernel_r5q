name: Build sh4dow6oy Kernel - R5Q (Full Net Stack & Header Fix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Your Samsung Source
        uses: actions/checkout@v4
        with:
          repository: sh4dow6oy/kernel_samsung_r5q
          ref: master
          fetch-depth: 0

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev \
          ccache python3 python-is-python3 libarchive-tools wget zstd libtinfo6 zip \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi device-tree-compiler rsync git

      - name: Setup Toolchain (Neutron Clang)
        run: |
          mkdir -p clang
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang

      - name: Transplant Full Networking & Essential Headers
        run: |
          git config user.email "sh4dow6oy@build.com"
          git config user.name "sh4dow6oy"
          
          git remote add lineage https://github.com/LineageOS/android_kernel_google_msm-4.14.git
          git fetch lineage lineage-20
          
          # Ștergem folderele care vor fi înlocuite complet pentru a evita conflicte de redefinire
          rm -rf net/ kernel/bpf/
          
          # 1. Importăm codul executabil
          git checkout lineage/lineage-20 -- net/
          git checkout lineage/lineage-20 -- kernel/bpf/
          git checkout lineage/lineage-20 -- arch/arm64/net/
          git checkout lineage/lineage-20 -- fs/compat_ioctl.c

          # 2. Importăm headerele critice (Fără a șterge tot include-ul)
          # Aici aducem bpf-cgroup.h care lipsea anterior
          git checkout lineage/lineage-20 -- include/linux/bpf*
          git checkout lineage/lineage-20 -- include/linux/filter.h
          git checkout lineage/lineage-20 -- include/net/
          git checkout lineage/lineage-20 -- include/uapi/linux/bpf*
          git checkout lineage/lineage-20 -- include/uapi/linux/filter.h
          git checkout lineage/lineage-20 -- include/uapi/linux/netfilter/
          
          # 3. SPOOFER: Raportăm Kernel 5.4 pentru Android 15
          sed -i 's/VERSION = 4/VERSION = 5/g' Makefile
          sed -i 's/PATCHLEVEL = 14/PATCHLEVEL = 4/g' Makefile

      - name: Build Kernel (SM8150)
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          MAKE_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- O=out"
          
          make $MAKE_ARGS r5q_defconfig
          
          # ACTIVARE OPTIUNI RETEA ANDROID 15 + JIT
          ./scripts/config --file out/.config \
            -e CONFIG_BPF -e CONFIG_BPF_SYSCALL -e CONFIG_BPF_JIT \
            -e CONFIG_BPF_JIT_ALWAYS_ON -e CONFIG_HAVE_EBPF_JIT \
            -e CONFIG_NETFILTER -e CONFIG_NETFILTER_ADVANCED \
            -e CONFIG_NETFILTER_XT_MATCH_BPF -e CONFIG_BPF_STREAM_PARSER \
            -e CONFIG_CGROUP_BPF -e CONFIG_PSI -e CONFIG_MEMBARRIER \
            -d CONFIG_WERROR -d CONFIG_LTO -d CONFIG_LTO_CLANG -e CONFIG_LTO_NONE
            
          make $MAKE_ARGS olddefconfig
          
          # KCFLAGS relaxate pentru transplant
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-Wno-error -fcommon -Wno-implicit-function-declaration -Wno-incompatible-pointer-types"
          make $MAKE_ARGS dtbs

      - name: Assemble Flashable Zip
        run: |
          DTB_FILE=$(find out/arch/arm64/boot/dts -name "sm8150-r5q*.dtb" | head -n 1)
          if [ -n "$DTB_FILE" ]; then
            cat out/arch/arm64/boot/Image.gz "$DTB_FILE" > out/arch/arm64/boot/Image.gz-dtb
          fi
          
          MKDTBOIMG=$(find . -name "mkdtboimg.py" | head -n 1)
          DTBOS=$(find out/arch/arm64/boot/dts -name "*.dtbo")
          [ -n "$DTBOS" ] && [ -n "$MKDTBOIMG" ] && python3 $MKDTBOIMG create out/dtbo.img $DTBOS
          
          git clone https://github.com/osm0sis/AnyKernel3.git
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/Image.gz || cp out/arch/arm64/boot/Image.gz AnyKernel3/Image.gz
          [ -f out/dtbo.img ] && cp out/dtbo.img AnyKernel3/dtbo.img
          
          sed -i 's/device.name1=maguro/device.name1=r5q/g' AnyKernel3/anykernel.sh
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
          cd AnyKernel3 && zip -r9 ../sh4dow6oy-R5Q-A15-HYBRID.zip *

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-A15-Hybrid
          path: sh4dow6oy-R5Q-A15-HYBRID.zip
