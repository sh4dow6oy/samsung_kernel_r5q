name: Build Roynas R5Q - Neutron Clang Final
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: sh4dow6oy/android_kernel_samsung_sm7150
          ref: sixteen
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev \
          ccache python3 python-is-python3 libarchive-tools wget zstd zip \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libncurses-dev libtinfo6

      - name: Setup Neutron Clang
        run: |
          mkdir clang
          wget -q https://github.com/Ylarod/setup-ndk-clang/releases/download/prebuilt/clang-linux-x86-ndk-r29-r563880c.tar.zst
          tar -I zstd -xf clang-linux-x86-ndk-r29-r563880c.tar.zst -C clang

      - name: Build Kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export KBUILD_BUILD_USER="Roynas"
          export KBUILD_BUILD_HOST="GithubActions"

          # --- FIX-URI CHIRURGICALE ---
          sed -i '0,/struct perf_event \*event;/! s/struct perf_event \*event;/\/\/ duplicat sters/g' kernel/trace/trace_event_perf.c
          find techpack/audio -name "wcd-mbhc-adc.c" -exec sed -i 's/mbhc->slow_insertion/0/g' {} +
          sed -i '30i bool msm_gpio_is_valid(int gpionum);' drivers/pinctrl/qcom/pinctrl-msm.c
          
          # Pregatire headere Samsung
          mkdir -p include/linux
          find drivers/samsung -name "sec_debug.h" -exec ln -sf ../../{} include/linux/sec_debug.h \;

          # --- SOLUȚIE DEFINITIVĂ PENTRU SIMBOLURI LIPSĂ (STUBS INLINE) ---
          # Ștergem conținutul vechi și injectăm funcții reale care returnează 0
          cat <<EOF > include/linux/sec_debug_stubs.h
          #ifndef _SEC_DEBUG_STUBS_H
          #define _SEC_DEBUG_STUBS_H
          #include <linux/types.h>
          static inline void sec_debug_set_reboot_reason(int reason) {}
          static inline int sec_debug_get_reboot_reason(void) { return 0; }
          static inline int sec_debug_get_p_reason(void) { return 0; }
          static inline int sec_debug_get_upload_cause(void) { return 0; }
          static inline void enable_emergency_dload_mode(int en) {}
          static inline int ois_reset_register(void *p) { return 0; }
          static inline int sec_kn_register_notifier(void *nb) { return 0; }
          static inline int manager_notifier_register(void *nb, int type) { return 0; }
          static inline int manager_notifier_unregister(void *nb) { return 0; }
          static inline unsigned long manager_hw_param_update(int param) { return 0; }
          static inline int set_usb_enable_state(int en) { return 0; }
          static inline int set_usb_enumeration_state(int en) { return 0; }
          static inline int get_usb_enumeration_state(void) { return 0; }
          static inline void sec_debug_store_bug_string(char *s) {}
          static inline int audio_register_wdsp_state_cb(void *a, void *b) { return 0; }
          static inline int audio_register_mad_mic_state_cb(void *a, void *b) { return 0; }
          static inline void* get_wsa_sysfs_ptr(void) { return NULL; }
          static inline void setSensorCallback(int a, void *b) {}
          static inline int sec_get_pps_voltage(void) { return 0; }
          static inline unsigned int is_boot_recovery(void) { return 0; }
          static inline void accel_factory_init_work(void *w) {}
          static inline void prox_factory_init_work(void *w) {}
          static inline const char* scsi_trace_parse_cdb(void *a, void *b, int c) { return ""; }
          static inline int sec_debug_is_enabled(void) { return 0; }
          #endif
          EOF

          # Injectăm header-ul nostru în vmlinux.h sau un header global
          echo "#include <linux/sec_debug_stubs.h>" >> include/linux/sec_debug.h

          # Dummy secgetspf
          echo -e "#!/bin/bash\necho 0" > scripts/secgetspf
          chmod +x scripts/secgetspf

          # --- ARGUMENTE BUILD ---
          MAKE_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- O=out"

          # --- CONFIGURARE ---
          make $MAKE_ARGS r5q_defconfig
          ./scripts/config --file out/.config \
            -d CONFIG_LTO -d CONFIG_LTO_CLANG -e CONFIG_LTO_NONE \
            -d CONFIG_CC_STACKPROTECTOR_STRONG -e CONFIG_CC_STACKPROTECTOR_NONE \
            -d CONFIG_SECURITY_SMACK -d CONFIG_SEC_DEBUG -e CONFIG_SECTION_MISMATCH_WARN_ONLY
          make $MAKE_ARGS olddefconfig

          # --- COMPILARE FINALĂ ---
          # Adaugam -Dinitcall_sec_debug=initcall_debug pentru a rezolva problema cu macro-ul Samsung original
          KCFLAGS_CLEAN="-fcommon -w -Wno-error -Dinitcall_sec_debug=initcall_debug -DPON_RESTART_REASON_CROSS_FAIL=0 -DPD_NOTI_ATTACH_TYPEDEF=CC_NOTI_ATTACH_TYPEDEF -DPDIC_NOTIFY_ID_ATTACH=CCIC_NOTIFY_ID_ATTACH -DSEC_DEBUG_MODEM_SEPARATE_EN=0"
          
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="$KCFLAGS_CLEAN" Image.gz

      - name: Package with AnyKernel3
        run: |
          if [ -f out/arch/arm64/boot/Image.gz ]; then
            git clone https://github.com/osm0sis/AnyKernel3.git
            cp out/arch/arm64/boot/Image.gz AnyKernel3/
            sed -i 's/device.name1=maguro/device.name1=r5q/g' AnyKernel3/anykernel.sh
            cd AnyKernel3 && zip -r9 ../Kernel-S10Lite-R5Q-Final.zip *
          else
            echo "EROARE: Image.gz nu a fost generat!"
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-S10Lite-Final
          path: Kernel-S10Lite-R5Q-Final.zip
