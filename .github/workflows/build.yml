name: Samsung SM8150 (r5q) - Final Fix - V22

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: sh4dow6oy/android_kernel_samsung_sm8150-5.4
          path: kernel
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libncurses-dev git zstd python3 gzip

      - name: Download & Extract Neutron Clang
        run: |
          mkdir -p neutron
          wget https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C neutron/

      - name: Patch Source Code
        run: |
          cd kernel
          # 1. Fix Section Mismatch & EAS
          sed -i 's/__init //g' drivers/samsung/debug/sec_debug_summary.c 2>/dev/null || true
          sed -i 's/__init //g' include/linux/sec_debug.h 2>/dev/null || true
          [ -f kernel/sched/fair.c ] && sed -i 's/static_branch_unlikely(&sched_energy_present)/sched_energy_enabled()/g' kernel/sched/fair.c

          # 2. Safe Patching pentru Duplicate Symbols
          # Căutăm flow.c oriunde s-ar afla în net/ pentru a evita eroarea "No such file"
          FLOW_FILE=$(find net/ -name flow.c)
          if [ ! -z "$FLOW_FILE" ]; then
            echo "Patching duplicate symbols in $FLOW_FILE"
            sed -i 's/^void flow_cache_ops_register/void __attribute__((weak)) flow_cache_ops_register/g' "$FLOW_FILE"
            sed -i 's/^void flow_cache_ops_unregister/void __attribute__((weak)) flow_cache_ops_unregister/g' "$FLOW_FILE"
          fi

      - name: Compile Kernel
        run: |
          cd kernel
          export PATH=$GITHUB_WORKSPACE/neutron/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          export AR=llvm-ar
          export LD=ld.lld
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          # 1. Config - Încercăm ambele locații posibile
          if [ -f arch/arm64/configs/vendor/r5q_eur_open_defconfig ]; then
            make O=out vendor/r5q_eur_open_defconfig
          else
            make O=out r5q_eur_open_defconfig
          fi
          
          # 2. Dezactivare Module Securitate Samsung (SDP/DEFEX/DSMS)
          # Acestea cauzează erori de compilare pe Clang nou
          scripts/config --file out/.config -d CONFIG_SDP
          scripts/config --file out/.config -d CONFIG_SAMSUNG_PRODUCT_SHIP
          scripts/config --file out/.config -d CONFIG_DEFEX
          scripts/config --file out/.config -d CONFIG_SECURITY_DEFEX
          scripts/config --file out/.config -d CONFIG_SECURITY_DSMS
          
          # 3. Final Adjustments
          sed -i 's/CONFIG_HARDENED_USERCOPY=y/CONFIG_HARDENED_USERCOPY=n/g' out/.config
          echo "CONFIG_SECTION_MISMATCH_WARN_ONLY=y" >> out/.config
          make O=out ARCH=arm64 olddefconfig

          # 4. Build Final
          make -j$(nproc --all) O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 \
                      KCFLAGS="-Wno-error -w -fcommon -Wno-cast-function-type -Wno-implicit-function-declaration -Wno-pointer-arith -Wno-frame-address -Wno-incompatible-pointer-types -Wno-cast-function-type-strict" \
                      HOSTCFLAGS="-Wno-error -fcommon" \
                      Image dtbs

      - name: Gzip and Artifacts
        run: |
          cd kernel/out/arch/arm64/boot/
          if [ -f Image ]; then
            gzip -n -c Image > Image.gz
            # Concatenăm DTB-urile dacă au fost generate
            DTBS=$(find dts/vendor/qcom/ -name "*.dtb" 2>/dev/null || find dts/ -name "*.dtb" 2>/dev/null)
            if [ ! -z "$DTBS" ]; then
               cat Image.gz $DTBS > Image.gz-dtb
            fi
          else
            echo "Kernel Image not found!"
            exit 1
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-r5q-V22
          path: |
            kernel/out/arch/arm64/boot/Image.gz
            kernel/out/arch/arm64/boot/Image.gz-dtb
