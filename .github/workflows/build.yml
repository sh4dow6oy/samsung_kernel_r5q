name: Kernel Merge CIP & Build (r5q)

on:
  workflow_dispatch:

jobs:
  merge-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex gcc-aarch64-linux-gnu git libssl-dev python3

      - name: Setup Kernel Source (Mainey)
        run: |
          git clone https://github.com/mainey/android_kernel_samsung_r5q.git -b lineage-20 kernel
          cd kernel
          git config user.email "bot@example.com"
          git config user.name "Kernel Merger"

      - name: Merge Linux-CIP
        run: |
          cd kernel
          # Adăugăm sursa oficială CIP ca "remote"
          git remote add cip https://git.kernel.org/pub/scm/linux/kernel/git/cip/linux-cip.git
          git fetch cip
          
          # Încercăm merge-ul cu ramura 4.19 sau 4.14 (alege ramura corespunzătoare kernelului tău)
          # Folosim 'v4.14.336-cip110' de exemplu, sau ramura generică 'linux-4.14.y-cip'
          git merge cip/linux-4.14.y-cip --allow-unrelated-histories -m "Merge CIP SLTS kernel" || echo "Conflicts detected"

      - name: Build Kernel
        run: |
          cd kernel
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          # Folosim defconfig-ul de r5q
          make O=out r5q_defconfig
          
          # Compilăm (ignoram erorile minore de merge pentru test)
          make -j$(nproc --all) O=out || echo "Build failed after merge"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CIP-Kernel-r5q
          path: kernel/out/arch/arm64/boot/Image.gz-dtb
