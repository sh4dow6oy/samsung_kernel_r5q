name: S10 Lite - Proton Clang (BTF Ultimate Fix)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves libncurses-dev git wget make python2 python3 pahole tar xz-utils lib32z1

      - name: Setup Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang
          echo "PROTON_PATH=$(pwd)/toolchain/proton-clang/bin" >> $GITHUB_ENV

      - name: Build Kernel
        run: |
          export PATH="${{ env.PROTON_PATH }}:$PATH"
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          
          # Fix pentru secgetspf
          echo -e '#!/bin/bash\necho "0"' > /tmp/secgetspf
          chmod +x /tmp/secgetspf
          sudo mv /tmp/secgetspf /usr/bin/secgetspf

          # Setup directoare de build
          rm -rf out && mkdir -p out/include/uapi/linux

          # FIX PENTRU BTF.H: Îl copiem în toate locurile posibile unde îl caută compilatorul
          cp include/linux/btf.h out/include/uapi/linux/btf.h || true
          mkdir -p include/uapi/linux
          cp include/linux/btf.h include/uapi/linux/btf.h || true

          MAKE_ARGS="
            O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1 \
            V=1
          "
          
          # KCFLAGS îmbunătățit:
          # 1. Adăugăm folderele de include manual
          # 2. Ignorăm warning-urile care devin erori în Clang 13
          export KCFLAGS="-Wno-error \
            -Wno-implicit-function-declaration \
            -Wno-unknown-warning-option \
            -I$(pwd)/include/uapi \
            -I$(pwd)/out/include/uapi \
            -I$(pwd)/include/linux"

          # 1. Defconfig
          make $MAKE_ARGS r5q_eur_open_defconfig
          
          # 2. Dezactivăm BTF și Stack Protector (cauzează erori de linking pe 4.14)
          sed -i 's/CONFIG_DEBUG_INFO_BTF=y/CONFIG_DEBUG_INFO_BTF=n/g' out/.config
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/CONFIG_CC_STACKPROTECTOR_NONE=y/g' out/.config
          make $MAKE_ARGS olddefconfig
          
          # 3. Build principal
          # Dacă eșuează din nou la bpf/core.c, forțăm o soluție de tip "header bypass"
          make -j$(nproc --all) $MAKE_ARGS || \
          (sed -i 's/#include <uapi\/linux\/btf.h>/\/\/#include <uapi\/linux\/btf.h>/g' kernel/bpf/core.c && \
           make -j$(nproc --all) $MAKE_ARGS)

          if [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image .
            echo "SUCCESS=true" >> $GITHUB_ENV
          fi

      - name: Upload Artifact
        if: env.SUCCESS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-Kernel-Final
          path: Image
