name: Build Samsung R5Q Kernel

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            wget bc bison flex libssl-dev libelf-dev software-properties-common

      - name: Install python2 (deadsnakes)
        run: |
          sudo add-apt-repository ppa:deadsnakes/ppa -y
          sudo apt-get update
          sudo apt-get install -y python2
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Setup Clang toolchain
        run: |
          TOOLCHAIN_PATH="$PWD/toolchain/clang"
          mkdir -p "$TOOLCHAIN_PATH"
          wget -O clang.tar.gz "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/413febb26cbd05d9a1e44f089190ac892f72e684.tar.gz"
          tar -xf clang.tar.gz -C "$TOOLCHAIN_PATH"

          mkdir -p "$PWD/toolchain/llvm-arm-toolchain-ship/10.0/bin"
          ln -s "$TOOLCHAIN_PATH/clang-r416183b/bin/clang" "$PWD/toolchain/llvm-arm-toolchain-ship/10.0/bin/clang"

          echo "PATH=$PATH" >> $GITHUB_ENV
          echo "CC=clang" >> $GITHUB_ENV

      - name: Setup AArch64 Linaro toolchain
        run: |
          TOOLCHAIN_PATH="$PWD/toolchain/gcc"
          mkdir -p "$TOOLCHAIN_PATH"
          wget -O linaro.tar.xz "https://releases.linaro.org/components/toolchain/binaries/latest-7/aarch64-linux-gnu/gcc-linaro-7.5.0-2019.12-x86_64_aarch64-linux-gnu.tar.xz"
          tar -xf linaro.tar.xz -C "$TOOLCHAIN_PATH"

          export PATH="$TOOLCHAIN_PATH/gcc-linaro-7.5.0-2019.12-x86_64_aarch64-linux-gnu/bin:$PATH"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export LD=aarch64-linux-gnu-ld

          echo "PATH=$PATH" >> $GITHUB_ENV
          echo "CROSS_COMPILE=$CROSS_COMPILE" >> $GITHUB_ENV
          echo "LD=$LD" >> $GITHUB_ENV

      - name: Configure kernel
        run: |
          export ARCH=arm64
          make ARCH=arm64 r5q_eur_open_defconfig

      - name: Build kernel
        run: |
          export ARCH=arm64
          make -j$(nproc) ARCH=arm64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: |
            arch/arm64/boot/Image
            arch/arm64/boot/dts/*.dtb
            .config
