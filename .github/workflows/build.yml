name: Build SM8150 5.4 Kernel (Android15 + BPF)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        repository: sh4dow6oy/android_kernel_samsung_sm8150-5.4
        path: kernel
        fetch-depth: 1

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev \
        gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libncurses-dev git zstd python3 gzip wget

    - name: Download Neutron Clang
      run: |
        mkdir -p neutron
        wget https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
        tar -I zstd -xf neutron-clang-10032024.tar.zst -C neutron/

    - name: Prepare Kernel Config
      run: |
        cd kernel
        export PATH=$GITHUB_WORKSPACE/neutron/bin:$PATH

        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-

        # 1) Load base defconfig
        make ARCH=arm64 vendor/r5q_eur_open_defconfig

        # 2) Enable CORE BPF & Android relevant options
        scripts/config --file .config -e CONFIG_BPF
        scripts/config --file .config -e CONFIG_BPF_SYSCALL
        scripts/config --file .config -e CONFIG_BPF_JIT
        scripts/config --file .config -e CONFIG_BPF_JIT_ALWAYS_ON
        scripts/config --file .config -e CONFIG_CGROUP_BPF
        scripts/config --file .config -e CONFIG_NET_CLS_BPF
        scripts/config --file .config -e CONFIG_NET_ACT_BPF
        scripts/config --file .config -e CONFIG_DEBUG_INFO_BTF
        scripts/config --file .config -e CONFIG_BPF_LSM

        # Samsung fingerprint + input
        scripts/config --file .config -e CONFIG_INPUT_TOUCHSCREEN
        scripts/config --file .config -e CONFIG_TOUCHSCREEN_SAMSUNG
        scripts/config --file .config -e CONFIG_TOUCHSCREEN_SEC_TS_Y771_R5
        scripts/config --file .config -e CONFIG_FINGERPRINT_ET7XX

        # Disable features known to cause issues
        scripts/config --file .config -d CONFIG_SDP
        scripts/config --file .config -d CONFIG_DEFEX

        make olddefconfig

    - name: Patch Source Code
      run: |
        cd kernel
        # Scheduler fix (if still needed)
        sed -i 's/static_branch_unlikely(&sched_energy_present)/sched_energy_enabled()/g' kernel/sched/fair.c

        # (optional) Stub out problematic MHI functions
        MHI_ARCH="drivers/bus/mhi/controllers/mhi_arch_qcom.c"
        if [ -f "$MHI_ARCH" ]; then
          cat << 'EOF' > "$MHI_ARCH"
#include <linux/module.h>
#include <linux/platform_device.h>
#include <linux/mhi.h>
int mhi_arch_pcie_init(struct mhi_controller *m) { return 0; }
void mhi_arch_pcie_deinit(struct mhi_controller *m) {}
EOF
        fi

        # Fingerprint driver ingest
        mkdir -p drivers/fingerprint
        BASE="https://raw.githubusercontent.com/Roynas-Android-Playground/kernel_samsung_r3q/master/drivers/fingerprint"
        for f in et7xx-spi.c et7xx-spi_data_transfer.c et7xx.h fingerprint.h fingerprint_sysfs.c fingerprint_sysfs.h; do
          wget -q -O "drivers/fingerprint/$f" "$BASE/$f"
        done
        # Fix wakelock includes
        sed -i '/#include <linux\/wakelock.h>/d' drivers/fingerprint/et7xx.h

    - name: Compile Kernel
      run: |
        cd kernel
        export PATH=$GITHUB_WORKSPACE/neutron/bin:$PATH
        export ARCH=arm64
        export CC=clang
        export NM=llvm-nm
        export OBJCOPY=llvm-objcopy
        export LD=ld.lld
        export LLVM=1
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

        make -j$(nproc) O=out ARCH=arm64 \
                     CC=clang LLVM=1 LLVM_IAS=1 \
                     KCFLAGS="-Wno-error -w -fcommon"

    - name: Prepare Artifact
      run: |
        if [ -f kernel/out/arch/arm64/boot/Image ]; then
          gzip -n -c kernel/out/arch/arm64/boot/Image > kernel/Image.gz
        else
          echo "Build failed!"
          exit 1
        fi

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-SM8150-Android15-BPF
        path: kernel/Image.gz
