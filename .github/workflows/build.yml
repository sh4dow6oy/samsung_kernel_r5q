name: Build R5Q Kernel OneUI7 Android15

on:
  workflow_dispatch:

env:
  DEVICE: r5q
  DEFCONFIG: r5q_defconfig
  AUTHOR: sh4dow6oy
  SUBLEVEL: 356

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

# Clone kernel
    - name: Checkout Kernel
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

# Dependencies
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
        bc bison build-essential curl flex git lz4 \
        libssl-dev libelf-dev zip unzip \
        python3 python-is-python3 \
        zstd ccache

# Clang
    - name: Setup Neutron Clang
      run: |
        mkdir clang
        wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
        tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang

# Import Android 15 subsystems
    - name: Import Android15 subsystems (Phoenix)
      run: |
        echo "Cloning Phoenix kernel..."
        git clone --depth=1 https://github.com/PhoenixKernel/linux.git -b android-4.14-phoenix phoenix

        echo "Import BPF"
        rm -rf kernel/bpf
        cp -r phoenix/kernel/bpf kernel/

        cp -r phoenix/include/linux/bpf* include/linux/ || true
        cp -r phoenix/include/uapi/linux/bpf* include/uapi/linux/ || true

        echo "Import CGROUP"
        cp -r phoenix/kernel/cgroup kernel/ || true
        cp -r phoenix/include/linux/cgroup* include/linux/ || true

        echo "Import BinderFS"
        rm -rf fs/binderfs
        cp -r phoenix/fs/binderfs fs/

        echo "Import Android binder updates"
        rm -rf drivers/android
        cp -r phoenix/drivers/android drivers/

        rm -rf phoenix

# Kernel patches
    - name: Apply Android15 patches
      run: |

        echo "Set kernel version"
        sed -i "s/^SUBLEVEL =.*/SUBLEVEL = ${{ env.SUBLEVEL }}/" Makefile
        sed -i "s/^EXTRAVERSION =.*/EXTRAVERSION = -${{ env.AUTHOR }}-OneUI7/" Makefile

        echo "Remove kernelsu"
        sed -i '/kernelsu/d' drivers/android/Kconfig || true
        sed -i '/kernelsu/d' drivers/android/Makefile || true
        rm -rf drivers/kernelsu

        echo "SELinux fix"
        sed -i 's/if (IS_ERR(newc))/if (false \&\& IS_ERR(newc))/' security/selinux/ss/services.c || true

        echo "vDSO linker fix"
        find arch/arm64/kernel/vdso -name "Makefile*" -exec sed -i 's/-Wl,-n//g' {} +
        find arch/arm64/kernel/vdso -name "Makefile*" -exec sed -i 's/-Wl,-T//g' {} +

# Build kernel
    - name: Build Kernel
      run: |

        export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"

        MAKE_ARGS="
        ARCH=arm64
        LLVM=1
        LLVM_IAS=1
        CC=clang
        LD=ld.lld
        AR=llvm-ar
        NM=llvm-nm
        OBJCOPY=llvm-objcopy
        OBJDUMP=llvm-objdump
        STRIP=llvm-strip
        CROSS_COMPILE=aarch64-linux-gnu-
        CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        O=out
        "

        make $MAKE_ARGS $DEFCONFIG

        ./scripts/config --file out/.config \
        -e CONFIG_BPF \
        -e CONFIG_BPF_SYSCALL \
        -e CONFIG_BPF_JIT \
        -e CONFIG_BPF_JIT_ALWAYS_ON \
        -e CONFIG_CGROUPS \
        -e CONFIG_CGROUP_BPF \
        -e CONFIG_ANDROID_BINDER_IPC \
        -e CONFIG_ANDROID_BINDERFS \
        -e CONFIG_OVERLAY_FS \
        -d CONFIG_KSU \
        -d CONFIG_ASSIST_KSU \
        -d CONFIG_LTO \
        -d CONFIG_LTO_CLANG \
        -e CONFIG_LTO_NONE

        make $MAKE_ARGS olddefconfig

        make -j$(nproc) $MAKE_ARGS \
        KCFLAGS="-fcommon -Wno-error"

# Package kernel
    - name: Package AnyKernel3
      run: |

        IMAGE="out/arch/arm64/boot/Image.gz-dtb"

        if [ ! -f "$IMAGE" ]; then
          IMAGE="out/arch/arm64/boot/Image.gz"
        fi

        git clone https://github.com/osm0sis/AnyKernel3.git

        cp $IMAGE AnyKernel3/Image.gz

        sed -i "s/device.name1=.*/device.name1=${{ env.DEVICE }}/g" AnyKernel3/anykernel.sh

        cd AnyKernel3
        zip -r9 ../Kernel-${{ env.DEVICE }}-OneUI7.zip *

# Upload
    - name: Upload Kernel
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-R5Q-OneUI7
        path: Kernel-*.zip
