name: Build R5Q - Neutron BPF 5.4 Ultimate
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Your Kernel (r5q)
        uses: actions/checkout@v4
        with:
          repository: Roynas-Android-Playground/kernel_samsung_r3q
          ref: master
          path: kernel
          fetch-depth: 0

      - name: Force Merge BPF 5.4 Logic
        run: |
          cd kernel
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          
          git remote add bpf_source https://github.com/cat658011/linux-bpf.git
          git fetch bpf_source bpf-5.4
          
          echo "Merging BPF-5.4 branch..."
          git merge -X theirs bpf_source/bpf-5.4 -m "Integrate BPF 5.4 Backports" || true
          
          # 1. FORȚARE BPF MODERNI
          git checkout bpf_source/bpf-5.4 -- kernel/bpf/
          git checkout bpf_source/bpf-5.4 -- net/core/filter.c
          git checkout bpf_source/bpf-5.4 -- include/linux/bpf.h
          git checkout bpf_source/bpf-5.4 -- include/linux/bpf_types.h
          git checkout bpf_source/bpf-5.4 -- include/linux/filter.h
          git checkout bpf_source/bpf-5.4 -- include/uapi/linux/bpf.h
          git checkout bpf_source/bpf-5.4 -- include/uapi/linux/bpf_common.h
          git checkout bpf_source/bpf-5.4 -- arch/arm64/net/bpf_jit_comp.c
          
          # 2. REPARARE ULTRA-AGRESIVĂ FS/PROC
          # Restaurăm fișierul direct din ramura ta originală, ignorând orice merge
          git checkout origin/master -- fs/proc/base.c
          
          git checkout --ours arch/arm64/configs/r5q_defconfig || echo "No config conflict"
          git add .
          git commit -m "BPF Hybrid: Hard Reset fs/proc/base.c to Samsung Stock" || echo "No changes"

      - name: Setup Neutron Clang
        run: |
          sudo apt-get update && sudo apt-get install -y zstd libssl-dev
          mkdir clang
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang
          echo "$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_PATH

      - name: Build Kernel
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          
          # NUCLEAR CLEANUP
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-mllvm -polly[^ ]*//g' {} +
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-mllvm//g' {} +
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-polly[^ ]*//g' {} +

          # VDSO FIX
          if [ -f arch/arm64/kernel/vdso/Makefile ]; then
            sed -i 's/-static//g' arch/arm64/kernel/vdso/Makefile
            sed -i 's/$(LDFLAGS)/$(filter-out -static,$(LDFLAGS))/g' arch/arm64/kernel/vdso/Makefile
          fi

          # KERNELSU & SECURITY BYPASS
          sed -i '/kernelsu/d' drivers/android/Kconfig
          sed -i '/kernelsu/d' drivers/android/Makefile
          sed -i 's/CONFIG_SYSTEM_TRUSTED_KEYRING=y/CONFIG_SYSTEM_TRUSTED_KEYRING=n/g' arch/arm64/configs/r5q_defconfig
          sed -i 's/CONFIG_MODULE_SIG=y/CONFIG_MODULE_SIG=n/g' arch/arm64/configs/r5q_defconfig
          
          MAKE_ARGS="ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            O=out"

          mkdir -p out
          make $MAKE_ARGS r5q_defconfig

          # CONFIGURARE BPF PENTRU ONEUI 7
          ./scripts/config --file out/.config \
            -e CONFIG_BPF \
            -e CONFIG_BPF_SYSCALL \
            -e CONFIG_BPF_JIT \
            -e CONFIG_BPF_EVENTS \
            -e CONFIG_CGROUP_BPF \
            -e CONFIG_NET_CLS_BPF \
            -e CONFIG_NET_ACT_BPF \
            -d CONFIG_SAMSUNG_RTIC \
            -d CONFIG_SECURITY_RKP \
            -d CONFIG_SECURITY_DEFEX \
            -d CONFIG_KSU \
            -d CONFIG_MODULE_SIG \
            -d CONFIG_WERROR

          make $MAKE_ARGS olddefconfig

          # COMPILARE FINALĂ
          make -j$(nproc --all) $MAKE_ARGS Image.gz \
            DTC_FLAGS="-i" \
            KCFLAGS="-w -fcommon" \
            HOSTCFLAGS="-w"

      - name: Package & Upload
        run: |
          if [ -f kernel/out/arch/arm64/boot/Image.gz ]; then
            git clone https://github.com/osm0sis/AnyKernel3.git AK3
            cp kernel/out/arch/arm64/boot/Image.gz AK3/
            cd AK3
            sed -i 's/device.name1=maguro/device.name1=r5q/g' anykernel.sh
            sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
            zip -r9 ../R5Q-OneUI7-Kernel.zip *
          else
            exit 1
          fi

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-Final-Kernel
          path: R5Q-OneUI7-Kernel.zip
