name: Build R5Q - Phoenix BPF V8
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Your Kernel (r5q)
        uses: actions/checkout@v4
        with:
          repository: Roynas-Android-Playground/kernel_samsung_r3q
          ref: master
          path: kernel
          fetch-depth: 0

      - name: Phoenix Hybrid Transplant (V8 - Full Struct Alignment)
        run: |
          cd kernel
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          
          git remote add phoenix https://github.com/PhoenixKernel/linux.git
          git fetch phoenix android-4.14-phoenix --depth=1
          git fetch phoenix android12-5.10-phoenix --depth=1
          
          echo "Deep Cleaning..."
          sed -i '/kernelsu\/Kconfig/d' drivers/android/Kconfig || true
          # Ștergem fișierele care cauzează conflicte pentru a forța versiunile noi
          rm -f include/linux/mm_types.h include/linux/sched.h include/linux/mm.h
          
          echo "Syncing 5.10 Foundations (The Big Three)..."
          # 1. STRUCTURI (Headere) - Esențiale pentru fork.c de 5.10
          git checkout phoenix/android12-5.10-phoenix -- include/linux/mm_types.h
          git checkout phoenix/android12-5.10-phoenix -- include/linux/sched.h
          git checkout phoenix/android12-5.10-phoenix -- include/linux/mm.h
          git checkout phoenix/android12-5.10-phoenix -- include/linux/sched/task.h
          git checkout phoenix/android12-5.10-phoenix -- include/linux/security.h
          git checkout phoenix/android12-5.10-phoenix -- include/linux/lsm_hooks.h
          git checkout phoenix/android12-5.10-phoenix -- include/linux/lsm_hook_defs.h
          git checkout phoenix/android12-5.10-phoenix -- include/linux/bpf.h
          git checkout phoenix/android12-5.10-phoenix -- include/uapi/linux/bpf.h
          git checkout phoenix/android12-5.10-phoenix -- include/linux/kernel_read_file.h || touch include/linux/kernel_read_file.h
          
          echo "Syncing Core Logic..."
          # 2. LOGICĂ (Cod Sursă)
          git checkout phoenix/android12-5.10-phoenix -- kernel/fork.c
          git checkout phoenix/android12-5.10-phoenix -- kernel/exit.c
          git checkout phoenix/android-4.14-phoenix -- kernel/bpf/
          git checkout phoenix/android-4.14-phoenix -- security/
          git checkout phoenix/android-4.14-phoenix -- fs/proc/base.c

          # Fix Clang - Tag struct page
          sed -i 's/page = (char \*)__get_free_page/struct page *page_ptr; page = (char *)__get_free_page/g' fs/proc/base.c || true
          
          # Fix global pentru redenumirea task->state (4.14) în task->__state (5.10)
          # Asta previne erorile de compilare în restul kernelului Samsung
          grep -rl "task->state" . | xargs sed -i 's/task->state/task->__state/g' || true
          grep -rl "p->state" . | xargs sed -i 's/p->state/p->__state/g' || true

          git add .
          git commit -m "Hybrid Sync V8: Full structural alignment with 5.10" || echo "No changes"

      - name: Setup Toolchain
        run: |
          sudo apt-get update && sudo apt-get install -y zstd libssl-dev bc bison flex
          mkdir clang
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang
          echo "$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_PATH

      - name: Build Kernel
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"

          MAKE_ARGS="ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            O=out"

          mkdir -p out
          make $MAKE_ARGS r5q_defconfig

          ./scripts/config --file out/.config \
            -e CONFIG_BPF \
            -e CONFIG_BPF_SYSCALL \
            -e CONFIG_BPF_JIT \
            -e CONFIG_BPF_LSM \
            -d CONFIG_SAMSUNG_RTIC \
            -d CONFIG_SECURITY_RKP \
            -d CONFIG_WERROR

          make $MAKE_ARGS olddefconfig
          
          # KCFLAGS agresive pentru compatibilitate hibridă
          make -j$(nproc --all) $MAKE_ARGS Image.gz \
            KCFLAGS="-w -fcommon -fno-stack-protector -Wno-implicit-function-declaration -Wno-int-conversion -fintegrated-as" \
            HOSTCFLAGS="-w"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-R5Q-V8-Final
          path: kernel/out/arch/arm64/boot/Image.gz
