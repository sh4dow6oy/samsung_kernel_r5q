name: Build Roynas R5Q - Android 15 Full BPF Import
on:
  workflow_dispatch:

env:
  SUBLEVEL: "356"
  AUTHOR: "sh4dow6oy"
  DEVICE: "r5q"
  DEFCONFIG: "r5q_defconfig"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: Roynas-Android-Playground/kernel_samsung_r3q
          ref: master
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev \
          ccache python3 python-is-python3 libarchive-tools wget zstd libtinfo6 zip curl

      - name: Setup Neutron Clang
        run: |
          mkdir clang
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang

      - name: Full BPF System Import (Lineage-23.0)
        run: |
          echo "Importăm TOATE fișierele din subsistemul BPF (Lineage-23.0)..."
          RAW_URL="https://raw.githubusercontent.com/acroreiser/android_kernel_lenovo_a6010/lineage-23.0"
          
          # 1. UAPI Headers (Definiții instrucțiuni JLT, JLE etc.)
          curl -sL "$RAW_URL/include/uapi/linux/bpf.h" -o include/uapi/linux/bpf.h
          curl -sL "$RAW_URL/include/uapi/linux/bpf_common.h" -o include/uapi/linux/bpf_common.h
          
          # 2. Kernel Internal Headers (Fix pentru BPF_F_NUMA_NODE și altele)
          curl -sL "$RAW_URL/include/linux/bpf.h" -o include/linux/bpf.h
          curl -sL "$RAW_URL/include/linux/bpf_verifier.h" -o include/linux/bpf_verifier.h
          
          # 3. Core Logic (Implementare commit-uri 263e252, b825f17, 12733ea)
          curl -sL "$RAW_URL/kernel/bpf/core.c" -o kernel/bpf/core.c
          curl -sL "$RAW_URL/kernel/bpf/verifier.c" -o kernel/bpf/verifier.c
          curl -sL "$RAW_URL/kernel/bpf/helpers.c" -o kernel/bpf/helpers.c
          curl -sL "$RAW_URL/kernel/bpf/syscall.c" -o kernel/bpf/syscall.c
          curl -sL "$RAW_URL/kernel/bpf/arraymap.c" -o kernel/bpf/arraymap.c
          curl -sL "$RAW_URL/kernel/bpf/hashtab.c" -o kernel/bpf/hashtab.c
          
          # 4. ARM64 JIT (Compilatorul hardware)
          curl -sL "$RAW_URL/arch/arm64/net/bpf_jit_comp.c" -o arch/arm64/net/bpf_jit_comp.c
          
          echo "Importul fișierelor BPF a fost finalizat!"

      - name: Build Kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          
          # Branding & Spoofing
          sed -i "s/^SUBLEVEL =.*/SUBLEVEL = ${{ env.SUBLEVEL }}/" Makefile
          sed -i "s/^EXTRAVERSION =.*/EXTRAVERSION = -${{ env.AUTHOR }}-A15/" Makefile
          
          # vDSO Fix pentru Neutron/LLD
          find arch/arm64/kernel/vdso -name "Makefile*" -exec sed -i 's/-Wl,-n//g' {} +
          find arch/arm64/kernel/vdso -name "Makefile*" -exec sed -i 's/-Wl,-T//g' {} +

          # Kconfig Cleanup (Eliminăm referințele invalide de KernelSU)
          sed -i '/kernelsu/d' drivers/android/Kconfig || true
          sed -i '/kernelsu/d' drivers/android/Makefile || true
          rm -rf drivers/kernelsu

          # Argumente Build
          MAKE_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- O=out"

          # Configurare Android 15
          make $MAKE_ARGS ${{ env.DEFCONFIG }}
          ./scripts/config --file out/.config \
            -e CONFIG_BPF -e CONFIG_BPF_SYSCALL -e CONFIG_BPF_JIT -e CONFIG_BPF_JIT_ALWAYS_ON \
            -e CONFIG_HAVE_EBPF_JIT -e CONFIG_NET_CLS_BPF -e CONFIG_CGROUP_BPF \
            -d CONFIG_LOCALVERSION_AUTO --set-str CONFIG_LOCALVERSION "-${{ env.AUTHOR }}"
          make $MAKE_ARGS olddefconfig

          # Compilare - folosim KCFLAGS pentru a ignora warning-urile din driverele Samsung vechi
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-fcommon -Wno-error -Wno-unused-variable -Wno-unused-function -Wno-implicit-function-declaration"

      - name: Package with AnyKernel3
        run: |
          IMAGE="$GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz-dtb"
          if [ ! -f "$IMAGE" ]; then IMAGE="$GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz"; fi
          git clone https://github.com/osm0sis/AnyKernel3.git
          cp $IMAGE AnyKernel3/Image.gz
          cd AnyKernel3 && zip -r9 ../Kernel-R5Q-A15-sh4dow6oy.zip *

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-A15-Full-BPF
          path: "*.zip"
