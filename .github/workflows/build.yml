name: Build Lumi R5Q - Final Taskstats Repair
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel (Roynas 4.14)
        uses: actions/checkout@v4
        with:
          repository: Roynas-Android-Playground/kernel_samsung_r3q
          ref: master
          path: kernel
          fetch-depth: 1

      - name: Clone Erstrom ath Tree (v5.2)
        run: |
          git clone https://github.com/erstrom/linux-ath.git ath-tree
          cd ath-tree
          git checkout v5.2-ath10k-sdio-v2 || git checkout v5.2-ath10k-sdio

      - name: Nuclear Cleanup & Hard Fixes
        run: |
          # 1. Înlocuim driverul ath10k (Brute Force)
          rm -rf kernel/drivers/net/wireless/ath/ath10k
          cp -r ath-tree/drivers/net/wireless/ath/ath10k kernel/drivers/net/wireless/ath/
          
          cd kernel
          
          # 2. NUCLEAR CLEANUP (Prevenim Error 1 cauzată de LLVM/Polly)
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-mllvm -polly[^ ]*//g' {} +
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-mllvm//g' {} +
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-polly[^ ]*//g' {} +
          
          # 3. VDSO FIX (Anti-static)
          if [ -f arch/arm64/kernel/vdso/Makefile ]; then
            sed -i 's/-static//g' arch/arm64/kernel/vdso/Makefile
            sed -i 's/$(LDFLAGS)/$(filter-out -static,$(LDFLAGS))/g' arch/arm64/kernel/vdso/Makefile
          fi

          # 4. KCONFIG FIX (KernelSU Missing)
          sed -i '/kernelsu/d' drivers/android/Kconfig

          # 5. TASKSTATS FIX (Metoda de RECONSTRUCȚIE)
          # Ștergem tot blocul de la #elif până la începutul funcției următoare pentru a evita orice conflict
          # Folosim un script python scurt pentru a face înlocuirea sigură, deoarece sed cu mai multe linii e riscant
          python3 -c "
          import sys
          path = 'kernel/taskstats.c'
          with open(path, 'r') as f:
              content = f.read()
          
          # Căutăm secțiunea problematică și o rescriem curat
          old_text = '#elif defined(CONFIG_POSIX_MQUEUE)'
          new_text = '#else\n#ifdef CONFIG_POSIX_MQUEUE'
          content = content.replace(old_text, new_text)
          
          # Adăugăm un #endif chiar înainte de taskstats_init_early pentru a închide blocul nou creat
          content = content.replace('void __init taskstats_init_early(void)', '#endif\nvoid __init taskstats_init_early(void)')
          
          with open(path, 'w') as f:
              f.write(content)
          "

      - name: Setup NDK Clang (r29)
        run: |
          mkdir -p clang
          wget -q https://github.com/Ylarod/setup-ndk-clang/releases/download/prebuilt/clang-linux-x86-ndk-r29-r563880c.tar.zst
          tar -I zstd -xf clang-linux-x86-ndk-r29-r563880c.tar.zst -C clang

      - name: Build Kernel Lumi R5Q
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          
          export MAKE_ARGS="ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CLANG=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            O=out"
          
          make $MAKE_ARGS r5q_defconfig
          
          # BPF & WiFi MODULES INJECTION
          {
            echo "CONFIG_BPF=y"
            echo "CONFIG_BPF_SYSCALL=y"
            echo "CONFIG_NETFILTER_XT_MATCH_BPF=y"
            echo "CONFIG_CGROUP_BPF=y"
            echo "CONFIG_BPF_JIT=y"
            echo "CONFIG_DTC_WERROR=n"
            echo "CONFIG_ATH10K=m"
            echo "CONFIG_ATH10K_SDIO=m"
          } >> out/.config
          
          make $MAKE_ARGS olddefconfig
          
          # Compilare finală
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-Wno-error -w" O=out Image.gz-dtb modules

      - name: Package AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          if [ -f kernel/out/arch/arm64/boot/Image.gz-dtb ]; then
            cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          fi
          mkdir -p AnyKernel3/modules/vendor/lib/modules
          find kernel/out -name "*.ko" -exec cp {} AnyKernel3/modules/vendor/lib/modules/ \;
          
          cd AnyKernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          sed -i 's|block=auto;|block=/dev/block/by-name/boot;|g' anykernel.sh
          zip -r9 ../Lumi-R5Q-Nuclear-Taskstats-Fixed.zip *

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: Lumi-R5Q-Kernel
          path: Lumi-R5Q-Nuclear-Taskstats-Fixed.zip
