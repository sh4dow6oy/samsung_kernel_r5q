name: Build R5Q Kernel with eBPF Backport from SM6150

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout R5Q Kernel (target)
      - name: Checkout R5Q Kernel
        uses: actions/checkout@v4
        with:
          repository: mainey/android_kernel_samsung_r5q
          path: r5q
          ref: lineage-18.1
          fetch-depth: 1

      # Checkout SM6150 Kernel (source eBPF/backport)
      - name: Checkout SM6150 Kernel
        uses: actions/checkout@v4
        with:
          repository: crdroidandroid/android_kernel_samsung_sm6150
          path: sm6150
          ref: 15.0
          fetch-depth: 1

      # Install build dependencies
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc build-essential flex bison libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            libncurses-dev git zstd python3 gzip dwarves wget

      # Download Neutron Clang
      - name: Download Neutron Clang
        run: |
          mkdir -p neutron
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C neutron/

      # Copy eBPF code + Makefile + Kconfig from SM6150 -> R5Q
      - name: Backport eBPF from SM6150 to R5Q
        run: |
          K_R5Q="$GITHUB_WORKSPACE/r5q"
          K_SM6150="$GITHUB_WORKSPACE/sm6150"

          # Copy kernel/bpf/
          mkdir -p $K_R5Q/kernel/bpf
          cp -r $K_SM6150/kernel/bpf/* $K_R5Q/kernel/bpf/

          # Copy include/linux/bpf.h
          cp $K_SM6150/include/linux/bpf.h $K_R5Q/include/linux/bpf.h

          # Append Makefile entries if missing
          grep -q "bpf/" $K_R5Q/arch/arm64/Makefile || \
              cat $K_SM6150/arch/arm64/Makefile | grep "bpf/" >> $K_R5Q/arch/arm64/Makefile

          # Append Kconfig entries if missing
          grep -q "BPF options" $K_R5Q/kernel/Kconfig || \
              cat $K_SM6150/kernel/Kconfig | grep -A10 "BPF options" >> $K_R5Q/kernel/Kconfig

      # Configure R5Q kernel
      - name: Configure R5Q Kernel
        run: |
          cd r5q
          export PATH=$GITHUB_WORKSPACE/neutron/bin:$PATH
          export ARCH=arm64
          mkdir -p out

          # Folosim config-ul corect
          make O=out ARCH=arm64 r5q_eur_open_defconfig

          # Activează eBPF + BTF
          scripts/config --file out/.config -e CONFIG_BPF
          scripts/config --file out/.config -e CONFIG_BPF_SYSCALL
          scripts/config --file out/.config -e CONFIG_BPF_JIT
          scripts/config --file out/.config -e CONFIG_BPF_JIT_ALWAYS_ON
          scripts/config --file out/.config -e CONFIG_CGROUP_BPF
          scripts/config --file out/.config -e CONFIG_BPF_LSM
          scripts/config --file out/.config -e CONFIG_DEBUG_INFO_BTF

          make O=out ARCH=arm64 olddefconfig

      # Build R5Q kernel
      - name: Build Kernel
        run: |
          cd r5q
          export PATH=$GITHUB_WORKSPACE/neutron/bin:$PATH
          export ARCH=arm64
          export CC=clang
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export LD=ld.lld
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          make -j$(nproc --all) O=out ARCH=arm64 \
               CC=clang LLVM=1 LLVM_IAS=1 \
               KCFLAGS="-Wno-error -Wno-unused-function -Wno-unused-variable"

      # Prepare artifact
      - name: Prepare Artifact
        run: |
          cd r5q
          if [ -f out/arch/arm64/boot/Image ]; then
            gzip -n -c out/arch/arm64/boot/Image > Image.gz
          else
            echo "Build failed!"
            exit 1
          fi

      # Upload kernel artifact
      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: r5q-ebpf
          path: r5q/Image.gz
