name: Build Roynas R5Q - Neutron Clang + A15 BPF 5.10
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: Roynas-Android-Playground/kernel_samsung_r3q
          ref: master
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc build-essential flex bison lz4 libssl-dev libelf-dev \
            ccache python3 python-is-python3 libarchive-tools wget zstd \
            libtinfo6 zip rsync \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Setup Neutron Clang
        run: |
          mkdir clang
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang

      # 🔥 Add SM7150 BPF 5.10 reference
      - name: Add BPF 5.10 Remote
        run: |
          git remote add bpf510 https://github.com/pascua28/android_kernel_samsung_sm7150.git
          git fetch bpf510 bpf-5.10 --depth=1

      # 🔥 Import SAFE BPF core only
      - name: Import Minimal BPF 5.10 Components
        run: |
          # Headers
          rsync -av bpf510:include/uapi/linux/bpf.h include/uapi/linux/ || true
          rsync -av bpf510:include/linux/bpf*.h include/linux/ || true

          # Core BPF subsystem (fără net/core!)
          rsync -av --exclude='*.o' bpf510:kernel/bpf/ kernel/bpf/ || true

      - name: Build Kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export KBUILD_BUILD_USER=Roynas
          export KBUILD_BUILD_HOST=GitHub
          export KBUILD_COMPILER_STRING="Neutron Clang A15-BPF5.10"

          # 1. Remove only broken polly flags
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) \
            -exec sed -i 's/-mllvm -polly[^ ]*//g' {} +

          # 2. Fix VDSO -static
          if [ -f arch/arm64/kernel/vdso/Makefile ]; then
            sed -i 's/\b-static\b//g' arch/arm64/kernel/vdso/Makefile
          fi

          # 3. KernelSU safe disable (no folder delete)
          sed -i '/kernelsu/d' drivers/android/Kconfig || true
          sed -i '/kernelsu/d' drivers/android/Makefile || true

          # 4. Disable gcc wrapper
          sed -i 's/ifneq ($(wildcard $(srctree)\/scripts\/gcc-wrapper.py),)/ifeq (0,1)/g' Makefile

          MAKE_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=1 O=out"

          make $MAKE_ARGS r5q_defconfig

          # 🔥 Android 15 Required BPF Config
          ./scripts/config --file out/.config \
            -e CONFIG_BPF \
            -e CONFIG_BPF_SYSCALL \
            -e CONFIG_BPF_JIT \
            -e CONFIG_HAVE_EBPF_JIT \
            -e CONFIG_BPF_EVENTS \
            -e CONFIG_CGROUP_BPF \
            -e CONFIG_NET_CLS_BPF \
            -e CONFIG_NET_ACT_BPF \
            -e CONFIG_KPROBE_EVENTS \
            -e CONFIG_UPROBE_EVENTS \
            -e CONFIG_FTRACE \
            -e CONFIG_FUNCTION_TRACER \
            -e CONFIG_DYNAMIC_FTRACE \
            -e CONFIG_CGROUPS \
            -e CONFIG_CGROUP_FREEZER \
            -e CONFIG_CGROUP_SCHED \
            -e CONFIG_NAMESPACES \
            -e CONFIG_USER_NS \
            -d CONFIG_LTO \
            -e CONFIG_LTO_NONE \
            -d CONFIG_KSU \
            -d CONFIG_ASSIST_KSU

          make $MAKE_ARGS olddefconfig

          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-Wno-error"

      - name: Package with AnyKernel3
        run: |
          IMAGE="$GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz-dtb"
          if [ ! -f "$IMAGE" ]; then
            IMAGE="$GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz"
          fi
          DTBO="$GITHUB_WORKSPACE/out/arch/arm64/boot/dtbo.img"

          git clone https://github.com/osm0sis/AnyKernel3.git
          rm -rf AnyKernel3/.git

          cp $IMAGE AnyKernel3/Image.gz
          [ -f "$DTBO" ] && cp $DTBO AnyKernel3/dtbo.img

          sed -i 's/^device.name1=.*/device.name1=r5q/' AnyKernel3/anykernel.sh
          sed -i 's/^device.name2=.*/device.name2=SM-G770F/' AnyKernel3/anykernel.sh
          sed -i 's/^device.name3=.*/device.name3=r5q/' AnyKernel3/anykernel.sh

          cd AnyKernel3
          zip -r9 ../Kernel-S10Lite-R5Q-A15-BPF510.zip *

      - name: Upload Flashable Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-S10Lite-R5Q-A15-BPF510
          path: Kernel-S10Lite-R5Q-A15-BPF510.zip
