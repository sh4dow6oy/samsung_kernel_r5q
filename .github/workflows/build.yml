name: S10 Lite - Base Swap LOS23 v28

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Samsung Source (Legacy)
        uses: actions/checkout@v4
        with:
          path: samsung-src

      - name: Setup Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves make python3 lz4 perl
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang

      - name: Prepare LineageOS 23 Base
        run: |
          # Clonăm direct baza LineageOS 23 ca director principal de lucru
          git clone --depth=1 -b lineage-23.0 https://github.com/LineageOS/android_kernel_google_msm-4.14.git kernel-res
          
      - name: Inject Samsung Drivers & DTS
        run: |
          # Transferăm driverele Samsung peste baza curată Lineage
          # Nota: 'drivers/soc/samsung', 'drivers/video/fbdev/exynos' etc.
          cp -r samsung-src/drivers/soc/samsung kernel-res/drivers/soc/ || true
          cp -r samsung-src/drivers/camera kernel-res/drivers/ || true
          cp -r samsung-src/drivers/fingerprint kernel-res/drivers/ || true
          cp -r samsung-src/drivers/sensors kernel-res/drivers/ || true
          
          # Transferăm configurația și Device Tree (Vital pentru boot)
          cp -r samsung-src/arch/arm64/boot/dts/samsung kernel-res/arch/arm64/boot/dts/ || true
          cp samsung-src/arch/arm64/configs/r5q_eur_open_defconfig kernel-res/arch/arm64/configs/
          
          # Transferăm scripturile Samsung de semnare/post-procesare
          cp -r samsung-src/scripts/samsung kernel-res/scripts/ || true
          cp samsung-src/scripts/secgetspf kernel-res/scripts/ 2>/dev/null || true

      - name: Patch Lineage for Samsung Compatibility
        run: |
          cd kernel-res
          # Rezolvăm conflictele de securitate Samsung care nu există în Lineage
          mkdir -p scripts
          echo -e "#!/bin/bash\necho 0" > scripts/secgetspf
          chmod +x scripts/secgetspf
          
          # Adaptăm Makefile-ul Lineage pentru a vedea driverele noi
          echo "obj-y += drivers/soc/samsung/" >> drivers/soc/Makefile
          
          # Fix access_ok pentru compatibilitate cu driverele vechi Samsung
          find drivers/ -name "*.c" -exec sed -i 's/access_ok(\([^,]*\), \([^)]*\))/access_ok(VERIFY_READ, \1, \2)/g' {} +

      - name: Build Kernel
        run: |
          cd kernel-res
          export PATH=$(pwd)/../toolchain/proton-clang/bin:$PATH
          MAKE_ARGS="ARCH=arm64 CC=clang HOSTCC=gcc CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1"
          
          # Folosim defconfig-ul Samsung pe baza Lineage
          make $MAKE_ARGS r5q_eur_open_defconfig
          
          # Forțăm activarea eBPF care în LOS23 este deja suportat nativ
          ./scripts/config --enable CONFIG_BPF_SYSCALL
          ./scripts/config --enable CONFIG_BPF_JIT
          ./scripts/config --enable CONFIG_CGROUP_BPF
          # Dezactivăm protecțiile Samsung care ar da conflict cu baza Lineage
          ./scripts/config --disable CONFIG_RKP_KDP
          ./scripts/config --disable CONFIG_DEFEX
          
          make $MAKE_ARGS olddefconfig
          make -j$(nproc --all) $MAKE_ARGS Image.gz-dtb
