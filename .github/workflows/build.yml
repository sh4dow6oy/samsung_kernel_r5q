name: Build SM8150 (r5q) Android15 Kernel Full + r3q Drivers

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout r5q Kernel
        uses: actions/checkout@v4
        with:
          repository: sh4dow6oy/android_kernel_samsung_sm8150-5.4
          path: kernel
          fetch-depth: 1

      - name: Checkout r3q Drivers
        uses: actions/checkout@v4
        with:
          repository: Roynas-Android-Playground/kernel_samsung_r3q
          path: r3q
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc build-essential flex bison libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            libncurses-dev git zstd python3 gzip wget dwarves

      - name: Download Neutron Clang
        run: |
          mkdir -p neutron
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C neutron/

      - name: Patch DTS slim_aud
        run: |
          cd kernel/arch/arm64/boot/dts/vendor/qcom
          mkdir -p .
          # Creează sm8150-audio.dtsi dacă lipsește
          cat > sm8150-audio.dtsi << 'EOF'
/slim_aud: slim@12200000 {
    compatible = "qcom,slim-ngd";
    reg = <0x12200000 0x1000>;
    interrupts = <GIC_SPI 123 IRQ_TYPE_LEVEL_HIGH>;
    clocks = <&clk_1>;
    clock-names = "core";
    status = "okay";
};
EOF
          # Include în sm8150.dtsi dacă nu există deja
          grep -q '#include "sm8150-audio.dtsi"' sm8150.dtsi || \
          echo '#include "sm8150-audio.dtsi"' >> sm8150.dtsi

      - name: Copy r3q Drivers
        run: |
          # Fingerprint
          mkdir -p kernel/drivers/fingerprint
          if [ -d "$GITHUB_WORKSPACE/r3q/drivers/fingerprint" ]; then
              cp -r "$GITHUB_WORKSPACE/r3q/drivers/fingerprint/"* kernel/drivers/fingerprint/
          fi
          # Touchscreen / Input
          mkdir -p kernel/drivers/input/touchscreen
          if [ -d "$GITHUB_WORKSPACE/r3q/drivers/input/touchscreen" ]; then
              cp -r "$GITHUB_WORKSPACE/r3q/drivers/input/touchscreen/"* kernel/drivers/input/touchscreen/
          fi

      - name: Prepare & Configure Kernel
        run: |
          cd kernel
          export PATH=$GITHUB_WORKSPACE/neutron/bin:$PATH
          export ARCH=arm64
          mkdir -p out

          make O=out ARCH=arm64 vendor/r5q_eur_open_defconfig
          chmod +x scripts/config

          # Android 15 BPF + BTF
          scripts/config --file out/.config -e CONFIG_BPF
          scripts/config --file out/.config -e CONFIG_BPF_SYSCALL
          scripts/config --file out/.config -e CONFIG_BPF_JIT
          scripts/config --file out/.config -e CONFIG_BPF_JIT_ALWAYS_ON
          scripts/config --file out/.config -e CONFIG_CGROUP_BPF
          scripts/config --file out/.config -e CONFIG_BPF_STREAM_PARSER
          scripts/config --file out/.config -e CONFIG_NET_CLS_BPF
          scripts/config --file out/.config -e CONFIG_NET_ACT_BPF
          scripts/config --file out/.config -e CONFIG_BPF_LSM
          scripts/config --file out/.config -e CONFIG_DEBUG_INFO_BTF
          scripts/config --file out/.config -e CONFIG_DEBUG_INFO
          scripts/config --file out/.config -e CONFIG_KALLSYMS
          scripts/config --file out/.config -e CONFIG_KALLSYMS_ALL
          scripts/config --file out/.config -e CONFIG_PAHOLE_HAS_SPLIT_BTF
          scripts/config --file out/.config -e CONFIG_DEBUG_INFO_DWARF4

          # Fingerprint & Touchscreen
          scripts/config --file out/.config -e CONFIG_INPUT_TOUCHSCREEN
          scripts/config --file out/.config -e CONFIG_TOUCHSCREEN_SAMSUNG
          scripts/config --file out/.config -e CONFIG_TOUCHSCREEN_SEC_TS_Y771_R5
          scripts/config --file out/.config -e CONFIG_FINGERPRINT_ET7XX

          # Remove DEFEX completely
          scripts/config --file out/.config -d CONFIG_DEFEX
          if [ -d "security/samsung/defex_lsm" ]; then
              rm -rf security/samsung/defex_lsm
          fi

          make O=out ARCH=arm64 olddefconfig

      - name: Build Kernel
        run: |
          cd kernel
          export PATH=$GITHUB_WORKSPACE/neutron/bin:$PATH
          export ARCH=arm64
          export CC=clang
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export LD=ld.lld
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          make -j$(nproc --all) O=out ARCH=arm64 \
               CC=clang LLVM=1 LLVM_IAS=1 \
               KCFLAGS="-Wno-error -Wno-unused-function -Wno-unused-variable"

      - name: Verify BPF Config
        run: |
          grep CONFIG_BPF kernel/out/.config || true
          grep CONFIG_DEBUG_INFO_BTF kernel/out/.config || true

      - name: Prepare Artifact
        run: |
          if [ -f kernel/out/arch/arm64/boot/Image ]; then
            gzip -n -c kernel/out/arch/arm64/boot/Image > kernel/Image.gz
          else
            echo "Build failed!"
            exit 1
          fi

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: r5q-Android15-BPF-R3QDrivers
          path: kernel/Image.gz
