name: Build Samsung SM-G770F Custom Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison flex libssl-dev make \
          libelf-dev dwarves \
          gcc-aarch64-linux-gnu \
          clang llvm lld \
          git zip unzip

    - name: Setup environment
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "CC=clang" >> $GITHUB_ENV
        echo "LLVM=1" >> $GITHUB_ENV
        echo "LLVM_IAS=1" >> $GITHUB_ENV
        echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV

    - name: Clean kernel tree
      run: make mrproper

    - name: Load defconfig
      run: make r5q_eur_open_defconfig

    - name: Build kernel
      run: make -j$(nproc)

    - name: Collect outputs
      run: |
        mkdir -p out
        cp arch/arm64/boot/Image out/
        if [ -f arch/arm64/boot/dtbo.img ]; then
          cp arch/arm64/boot/dtbo.img out/
        fi

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: r5q-custom-kernel
        path: out/*
