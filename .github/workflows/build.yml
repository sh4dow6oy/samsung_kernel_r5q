name: Build S10 Lite Kernel (Proton Clang)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: sh4dow6oy/samsung_kernel_r5q
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev \
          ccache python3 python-is-python3 libarchive-tools

      - name: Download Proton Clang
        run: |
          mkdir proton-clang
          curl -L https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.tar.gz | tar -xzf - --strip-components=1 -C proton-clang

      - name: Patch Kernel (No Knox & eBPF Prep)
        run: |
          DEFCONFIG="arch/arm64/configs/vendor/r5q_eur_open_defconfig"
          # Dezactivare Samsung Knox & Security
          sed -i 's/CONFIG_KNOX_KAP=y/CONFIG_KNOX_KAP=n/g' $DEFCONFIG
          sed -i 's/CONFIG_SECURITY_SAMSUNG_KNOX=y/CONFIG_SECURITY_SAMSUNG_KNOX=n/g' $DEFCONFIG
          sed -i 's/CONFIG_INTEGRITY_SAMSUNG=y/CONFIG_INTEGRITY_SAMSUNG=n/g' $DEFCONFIG
          sed -i 's/CONFIG_RKP_KDP=y/CONFIG_RKP_KDP=n/g' $DEFCONFIG
          sed -i 's/CONFIG_SAMSUNG_PRODUCT_SHIP=y/CONFIG_SAMSUNG_PRODUCT_SHIP=n/g' $DEFCONFIG
          
          # Configurare obligatorie eBPF pentru Android 15
          {
            echo "CONFIG_BPF=y"
            echo "CONFIG_BPF_SYSCALL=y"
            echo "CONFIG_BPF_JIT=y"
            echo "CONFIG_CGROUP_BPF=y"
            echo "CONFIG_NETFILTER_XT_MATCH_BPF=y"
            echo "CONFIG_NET_CLS_BPF=y"
            echo "CONFIG_NET_ACT_BPF=y"
          } >> $DEFCONFIG

      - name: Build Kernel
        run: |
          export PATH=$GITHUB_WORKSPACE/proton-clang/bin:$PATH
          
          # Argumente de build pentru Proton Clang
          MAKE_ARGS="ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            LD=ld.lld \
            O=out"

          # Generare config
          make $MAKE_ARGS vendor/r5q_eur_open_defconfig
          
          # Compilare propriu-zisă
          make -j$(nproc --all) $MAKE_ARGS

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-A15-Proton-Kernel
          path: out/arch/arm64/boot/Image.gz-dtb
