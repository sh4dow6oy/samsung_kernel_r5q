name: Build Prime Kernel R5Q (BPF Fixed)

on:
  workflow_dispatch:
    inputs:
      release:
          description: 'Upload release'
          type: boolean
          required: true
          default: false
      changelog:
          description: 'Changelog'
          type: string
          required: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_ts: ${{ steps.ts.outputs.release_ts }}
    steps:
      - name: Generate release date
        id: ts
        run: echo "release_ts=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

  build:
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: LumiPlayground/android_kernel_samsung_sm8150
          ref: rawr-bpf
          fetch-depth: 1

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git curl unzip wget zip zstd \
            bc bison flex libssl-dev libelf-dev python3 python-is-python3 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Download Proton Clang
        run: |
          mkdir clang-stable
          wget https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.tar.gz -O clang.tar.gz
          tar -xf clang.tar.gz -C clang-stable --strip-components=1
          chmod -R +x clang-stable/bin/

      - name: Build kernel
        run: |
          CLANG_DIR="$(pwd)/clang-stable"
          
          # 1. Fix Samsung Security Tools
          mkdir -p out
          echo "#!/bin/bash" > secgetspf
          echo "exit 0" >> secgetspf
          chmod +x secgetspf
          cp secgetspf out/
          export PATH="$(pwd):$PATH"

          # 2. Fix asm-goto & Werror (Eliminăm oprirea la erori de tip implicit declaration)
          echo "exit 0" > scripts/gcc-goto.sh
          chmod +x scripts/gcc-goto.sh
          
          # Eliminăm forțarea -Werror din Makefile-urile principale
          find . -name Makefile* -exec sed -i 's/-Werror//g' {} +

          # 3. Parametrii Make
          # Adăugăm -Wno-error=implicit-function-declaration pentru a trece de SEC_DEBUG
          MAKE_ARGS="ARCH=arm64 \
            O=out \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            CC=${CLANG_DIR}/bin/clang \
            LD=${CLANG_DIR}/bin/ld.lld \
            AR=${CLANG_DIR}/bin/llvm-ar \
            NM=${CLANG_DIR}/bin/llvm-nm \
            OBJCOPY=${CLANG_DIR}/bin/llvm-objcopy \
            OBJDUMP=${CLANG_DIR}/bin/llvm-objdump \
            STRIP=${CLANG_DIR}/bin/llvm-strip \
            OBJSIZE=${CLANG_DIR}/bin/llvm-size \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            DTC_EXT=$(pwd)/scripts/dtc \
            KCFLAGS='-Wno-implicit-function-declaration -Wno-error -Wno-implicit-int' \
            KCPPFLAGS='-Wno-unknown-warning-option'"

          # 4. Configurare
          make $MAKE_ARGS r5q_eur_open_defconfig

          # 5. Patch .config
          # Forțăm dezactivarea SEC_DEBUG și Stack Protector pentru stabilitatea build-ului
          sed -i 's/CONFIG_SEC_DEBUG=y/CONFIG_SEC_DEBUG=n/g' out/.config || true
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/n/g' out/.config || true
          sed -i 's/CONFIG_CC_STACKPROTECTOR=y/n/g' out/.config || true
          echo "CONFIG_CC_STACKPROTECTOR_NONE=y" >> out/.config
          echo "CONFIG_CC_HAVE_ASM_GOTO=y" >> out/.config

          # 6. Compilare
          make $MAKE_ARGS olddefconfig
          make $MAKE_ARGS -j$(nproc --all) Image.gz-dtb

          # 7. Finalizare
          if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
            echo "Kernel built successfully!"
          else
            echo "Build failed: Image.gz-dtb was not generated."
            exit 1
          fi

      - name: Upload Image.gz-dtb
        uses: actions/upload-artifact@v4
        with:
          name: PrimeKernel-R5Q-BPF-${{ needs.prepare.outputs.release_ts }}
          path: out/arch/arm64/boot/Image.gz-dtb

  release:
    needs: [prepare, build]
    if: github.event.inputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ needs.prepare.outputs.release_ts }}"
          name: "PrimeKernel-R5Q-BPF-${{ needs.prepare.outputs.release_ts }}"
          body: "${{ github.event.inputs.changelog }}"
          files: artifacts/PrimeKernel-R5Q-BPF-*/Image.gz-dtb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
