name: S10 Lite - Upstream with Custom Samsung Toolchain

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves libncurses-dev git wget make python2 python3 pahole tar xz-utils lib32z1 lib32ncurses6 lib32stdc++6

      - name: Setup Samsung Toolchain
        run: |
          mkdir -p toolchain/samsung
          # Folosim -L pentru a urmari redirectarile GitHub
          wget -L "https://github.com/sh4dow6oy/samsung_kernel_r5q/releases/download/toolchain/toolchain.tar.gz" -O toolchain.tar.gz
          
          if [ -f toolchain.tar.gz ]; then
            tar -xf toolchain.tar.gz -C toolchain/samsung
          else
            echo "Eroare: Fisierul toolchain.tar.gz nu a fost descarcat!"
            exit 1
          fi
          
          # Căutăm binarele (detectie recursiva)
          BIN_PATH=$(find $(pwd)/toolchain/samsung -name "aarch64-linux-*-gcc" -type f -printf '%h\n' | head -n 1)
          
          if [ -z "$BIN_PATH" ]; then
            echo "Eroare: Nu am gasit executabilele GCC in arhiva!"
            ls -R toolchain/samsung
            exit 1
          fi
          
          echo "TOOLCHAIN_BIN=$BIN_PATH" >> $GITHUB_ENV
          echo "Final Toolchain Path: $BIN_PATH"

      - name: Upstream Merge (LTS 4.14.y)
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git remote add linux-stable https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git || true
          git fetch linux-stable linux-4.14.y
          
          git merge FETCH_HEAD -m "Upstream 4.14.y" || echo "Conflicte detectate"
          git checkout --ours Makefile arch/arm64/configs/r5q_eur_open_defconfig drivers/staging/Kconfig
          git add . && git commit -m "Merged Upstream" || echo "Nothing to commit"

      - name: Pre-build Fixes
        run: |
          sed -i '/#define _UAPI_LINUX_TYPES_H/a #ifndef __poll_t\n#ifndef __ASSEMBLY__\ntypedef unsigned int __poll_t;\n#endif\n#define __poll_t __poll_t\n#endif' include/uapi/linux/types.h
          mkdir -p system/core/liblog/include/log
          echo -e "#ifndef _PERFLOG_H\n#define _PERFLOG_H\n#endif" > system/core/liblog/include/log/perflog.h
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Build Kernel
        run: |
          export PATH="${{ env.TOOLCHAIN_BIN }}:$PATH"
          
          # Detectam prefixul automat
          GCC_FILE=$(ls ${{ env.TOOLCHAIN_BIN }} | grep gcc | head -n 1)
          PFIX=$(echo $GCC_FILE | sed 's/gcc//')
          
          echo "Using Prefix: $PFIX"

          MAKE_ARGS="O=out ARCH=arm64 CROSS_COMPILE=$PFIX HOSTCC=gcc HOSTCXX=g++ TECHPACK=true"
          
          rm -rf out && mkdir -p out
          make $MAKE_ARGS r5q_eur_open_defconfig
          
          # Dezactivam warning-urile care opresc build-ul (Werror)
          export KCFLAGS="-Wno-error"
          
          make $MAKE_ARGS olddefconfig
          make -j$(nproc --all) $MAKE_ARGS || (echo "DIAGNOSTIC J1..." && make -j1 $MAKE_ARGS)

          if [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image .
            [ -f out/arch/arm64/boot/dtbo.img ] && cp out/arch/arm64/boot/dtbo.img .
            echo "SUCCESS=true" >> $GITHUB_ENV
          fi

      - name: Upload Artifacts
        if: env.SUCCESS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-Kernel-Samsung-TC
          path: |
            Image
            dtbo.img
