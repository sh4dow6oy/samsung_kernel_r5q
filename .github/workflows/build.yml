name: Build Samsung SM8150 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v5
        with:
          repository: sh4dow6oy/android_kernel_samsung_sm8150
          ref: auriana
          path: kernel

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential bison flex libssl-dev libelf-dev xz-utils libncurses5-dev python3 python3-pip wget

      - name: Download Toolchains
        run: |
          # Clang r416183b
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b clang
          # GCC 64-bit (AArch64)
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 gcc-arm64
          # GCC 32-bit (ARM)
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 gcc-arm

      - name: Build Custom DTC
        run: |
          echo "--- Building Upstream DTC ---"
          git clone --depth=1 https://git.kernel.org/pub/scm/utils/dtc/dtc.git dtc-src
          cd dtc-src
          make -j$(nproc)
          # Setăm variabila de mediu către BINARUL dtc, nu către folder
          echo "CUSTOM_DTC_PATH=$(pwd)/dtc" >> $GITHUB_ENV

      - name: Fix Camera and Float Errors
        run: |
          cd kernel

          # 2. Patch pentru icnss buffer overflow
          sed -i 's/char antbuffer\[2\]/char antbuffer[5]/g' drivers/soc/qcom/icnss.c || true

      - name: Build Kernel
        run: |
          cd kernel
          
          # Setup Path pentru Toolchains
          CLANG_BIN=$(pwd)/../clang/bin
          GCC64_BIN=$(pwd)/../gcc-arm64/bin
          GCC32_BIN=$(pwd)/../gcc-arm/bin
          export PATH="$CLANG_BIN:$GCC64_BIN:$GCC32_BIN:$PATH"
          
          export ARCH=arm64
          mkdir -p out

          # 1. Creare Config (Merge defconfig + variant config)
          cat arch/arm64/configs/sm8150_sec_defconfig arch/arm64/configs/sm8150_sec_r5q_eur_open.config > out/.config
          
          # 2. Aplicare Config
          make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- olddefconfig

          # 3. Compilare (Kernel + DTB + DTBO)
          # KCFLAGS="-mgeneral-regs-only" previne folosirea registrelor Floating Point în codul kernelului
          make -j$(nproc --all) O=out \
              ARCH=arm64 \
              CC=clang \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              CROSS_COMPILE=aarch64-linux-android- \
              CROSS_COMPILE_ARM32=arm-linux-androideabi- \
              LD=ld.lld \
              AR=llvm-ar \
              NM=llvm-nm \
              OBJCOPY=llvm-objcopy \
              OBJDUMP=llvm-objdump \
              STRIP=llvm-strip \
              KBUILD_VMLINUX_LIBS=$LIBGCC_PATH \
              DTC=$CUSTOM_DTC_PATH \
              KCFLAGS="-mgeneral-regs-only" \
              Image.gz-dtb dtbs

      - name: Build DTBO Image
        run: |
          echo "--- Packing DTBO Image ---"
          wget https://raw.githubusercontent.com/K-Blaaaack/mkdtboimg/master/mkdtboimg.py -O mkdtboimg.py
          
          # Căutăm fișierele dtbo în directorul de output
          DTBO_FILES=$(find kernel/out/arch/arm64/boot/dts/ -name "*.dtbo")
          
          if [ -z "$DTBO_FILES" ]; then
            echo "EROARE: Nu s-au găsit fișiere .dtbo!"
            exit 1
          fi
          
          python3 mkdtboimg.py create dtbo.img $DTBO_FILES

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-SM8150-r5q
          path: |
            kernel/out/arch/arm64/boot/Image.gz-dtb
            dtbo.img
