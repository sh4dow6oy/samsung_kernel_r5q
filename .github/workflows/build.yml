name: Build Lumi R5Q - Stock Init Clean
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel
        uses: actions/checkout@v4
        with:
          repository: Roynas-Android-Playground/kernel_samsung_r3q
          ref: master
          path: kernel
          fetch-depth: 1

      - name: Kernel Surgical Fixes (VDSO, Polly, Security)
        run: |
          cd kernel
          # 1. NUCLEAR CLEANUP (Prevenim Error 1)
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-mllvm -polly[^ ]*//g' {} +
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-mllvm//g' {} +
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-polly[^ ]*//g' {} +
          
          # 2. VDSO FIX (Anti -static)
          if [ -f arch/arm64/kernel/vdso/Makefile ]; then
            sed -i 's/-static//g' arch/arm64/kernel/vdso/Makefile
            sed -i 's/$(LDFLAGS)/$(filter-out -static,$(LDFLAGS))/g' arch/arm64/kernel/vdso/Makefile
          fi
          # 3. KERNELSU & SAMSUNG CLEANUP
          sed -i '/kernelsu/d' drivers/android/Kconfig || true
          sed -i '/kernelsu/d' drivers/android/Makefile || true
          rm -rf drivers/kernelsu
          sed -i 's/ifneq ($(wildcard $(srctree)\/scripts\/gcc-wrapper.py),)/ifeq (0,1)/g' Makefile

          # --- 3. FORCE SELINUX PERMISSIVE ---
          # Ne asigurăm că SELinux nu blochează boot-ul pe OneUI 7
          sed -i 's/selinux_enforcing_boot = 1/selinux_enforcing_boot = 0/g' security/selinux/hooks.c || true

      - name: Setup Neutron Clang
        run: |
          mkdir clang
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang

      - name: Build Image.gz-dtb
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          
          MAKE_ARGS="ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            HOSTCC=clang \
            HOSTCXX=clang++ \
            HOSTLD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            O=out"
          
          # Generare config de bază
          make $MAKE_ARGS r5q_defconfig
          
          # --- CONFIGURARE ONEUI 7 (OBLIGATORIU) ---
          # Dezactivăm SAR-ul legacy (cel care căuta partiția sda21)
          printf "CONFIG_ANDROID_SAR_RAMDISK=n\n" >> out/.config
          
          # Activăm Device Mapper pentru Dynamic Partitions (System/Vendor/Product)
          printf "CONFIG_BLK_DEV_DM=y\n" >> out/.config
          printf "CONFIG_DM_REMAPPER=y\n" >> out/.config
          printf "CONFIG_DM_UEVENT=y\n" >> out/.config
          printf "CONFIG_DM_VERITY=n\n" >> out/.config
          
          # Suport Android 15 (EROFS pentru partitii noi, BinderFS pentru servicii)
          printf "CONFIG_EROFS_FS=y\n" >> out/.config
          printf "CONFIG_EROFS_FS_ZIP=y\n" >> out/.config
          printf "CONFIG_BLK_DEV_INITRD=y\n" >> out/.config
          printf "CONFIG_ANDROID_BINDERFS=y\n" >> out/.config
          
          # Creștem numărul de loop devices pentru containerele APEX din Android 15
          printf "CONFIG_BLK_DEV_LOOP=y\n" >> out/.config
          printf "CONFIG_BLK_DEV_LOOP_MIN_COUNT=16\n" >> out/.config
          
          # CMDLINE: Forțăm boot-ul în sistem, nu în recovery, și punem SELinux în permissive
          printf "CONFIG_CMDLINE=\"loop.max_part=16 androidboot.force_normal_boot=1 androidboot.selinux=permissive\"\n" >> out/.config
          printf "CONFIG_CMDLINE_EXTEND=y\n" >> out/.config

          # Aplicăm noile setări
          make $MAKE_ARGS olddefconfig
          
          # Compilăm kernelul (KCFLAGS ajută la ignorarea avertismentelor minore)
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-fcommon -Wno-error -w" O=out Image.gz-dtb

      - name: Upload Image.gz-dtb
        uses: actions/upload-artifact@v4
        with:
          name: Image-Lumi-Clean-Stock
          path: kernel/out/arch/arm64/boot/Image.gz
