name: Build S10 Lite Kernel (Franken-Kernel)

on:
  workflow_dispatch: # Permite pornirea manuală a build-ului din interfața GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source (nzlnice)
        uses: actions/checkout@v4
        with:
          repository: nzlnice/kernel_qcom_sm8150
          fetch-depth: 1

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex git glibc-source libssl-dev libelf-dev abi-compliance-checker
          sudo apt-get install -y clang llvm lld

      - name: Download Toolchain (AOSP Clang)
        run: |
          mkdir clang
          cd clang
          wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-r450784d.tar.gz
          tar -xf clang-r450784d.tar.gz

      - name: Setup Build Variables
        run: |
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "SUBARCH=arm64" >> $GITHUB_ENV
          echo "PATH=$GITHUB_WORKSPACE/clang/bin:$PATH" >> $GITHUB_ENV
          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-android-" >> $GITHUB_ENV

      - name: Pull Samsung Specific Drivers (Optional/Manual Step)
        run: |
          # Aici poți adăuga comenzi git pentru a aduce driverele din sursa Mainey
          # Exemplu: git clone --depth=1 https://github.com/mainey/android_kernel_samsung_r5q samsung_src
          # Apoi comenzi 'cp -r' pentru a muta driverele în structura nzlnice
          echo "Gata pentru integrare manuală sau patch-uri."

      - name: Configure Kernel
        run: |
          # Folosim vendor defconfig-ul de SM8150 din sursa nzlnice
          make O=out vendor/sm8150-perf_defconfig

      - name: Build Kernel
        run: |
          make -j$(nproc --all) O=out \
                      CC=clang \
                      AR=llvm-ar \
                      NM=llvm-nm \
                      OBJCOPY=llvm-objcopy \
                      OBJDUMP=llvm-objdump \
                      STRIP=llvm-strip

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-Kernel-Image
          path: out/arch/arm64/boot/Image.gz-dtb
