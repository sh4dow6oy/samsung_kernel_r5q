name: Build R5Q - Phoenix Hybrid BPF
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Your Kernel (r5q)
        uses: actions/checkout@v4
        with:
          repository: Roynas-Android-Playground/kernel_samsung_r3q
          ref: master
          path: kernel
          fetch-depth: 0

      - name: Phoenix Hybrid Transplant (V5)
        run: |
          cd kernel
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          
          git remote add phoenix https://github.com/PhoenixKernel/linux.git
          git fetch phoenix android-4.14-phoenix --depth=1
          git fetch phoenix android12-5.10-phoenix --depth=1
          
          echo "Cleaning residues and fixing Kconfig..."
          sed -i '/kernelsu\/Kconfig/d' drivers/android/Kconfig || true
          
          rm -rf kernel/bpf/ security/bpf/
          rm -f include/linux/bpf.h include/uapi/linux/bpf.h
          
          echo "Deep-Syncing Headers (Targeting 5.10 for BPF/LSM Consistency)..."
          # IMPORT CRITIC: Toată definiția BPF și LSM din 5.10 pentru a avea structurile complete
          git checkout phoenix/android12-5.10-phoenix -- include/linux/bpf.h
          git checkout phoenix/android12-5.10-phoenix -- include/linux/bpf_types.h
          git checkout phoenix/android12-5.10-phoenix -- include/uapi/linux/bpf.h
          git checkout phoenix/android12-5.10-phoenix -- include/linux/lsm_hook_defs.h
          git checkout phoenix/android12-5.10-phoenix -- include/linux/lsm_hooks.h
          git checkout phoenix/android12-5.10-phoenix -- include/linux/security.h
          
          # Păstrăm mm și sched din 4.14 pentru stabilitatea sistemului Samsung
          git checkout phoenix/android-4.14-phoenix -- include/linux/mm_types.h
          git checkout phoenix/android-4.14-phoenix -- include/linux/sched.h
          git checkout phoenix/android-4.14-phoenix -- include/linux/filter.h
          
          # Luăm logica .c (sursele)
          git checkout phoenix/android-4.14-phoenix -- kernel/bpf/
          git checkout phoenix/android-4.14-phoenix -- security/
          git checkout phoenix/android-4.14-phoenix -- kernel/fork.c
          git checkout phoenix/android-4.14-phoenix -- fs/proc/base.c

          # Fix Clang compliance
          sed -i 's/page = (char \*)__get_free_page/struct page *page_ptr; page = (char *)__get_free_page/g' fs/proc/base.c || true
          
          # Patch manual pentru BPF_PROG_TYPE_LSM dacă lipsește din uapi
          if ! grep -q "BPF_PROG_TYPE_LSM" include/uapi/linux/bpf.h; then
            sed -i '/BPF_PROG_TYPE_EXT,/a \	BPF_PROG_TYPE_LSM,' include/uapi/linux/bpf.h
          fi

          git add .
          git commit -m "Hybrid Sync V5: Synced BPF structs with 5.10 headers" || echo "No changes"

      - name: Setup Toolchain
        run: |
          sudo apt-get update && sudo apt-get install -y zstd libssl-dev
          mkdir clang
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang
          echo "$GITHUB_WORKSPACE/clang/bin" >> $GITHUB_PATH

      - name: Build Kernel
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-mllvm -polly[^ ]*//g' {} +

          MAKE_ARGS="ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            O=out"

          mkdir -p out
          make $MAKE_ARGS r5q_defconfig

          ./scripts/config --file out/.config \
            -e CONFIG_BPF \
            -e CONFIG_BPF_SYSCALL \
            -e CONFIG_BPF_JIT \
            -e CONFIG_BPF_LSM \
            -e CONFIG_CGROUP_BPF \
            -d CONFIG_SAMSUNG_RTIC \
            -d CONFIG_SECURITY_RKP \
            -d CONFIG_WERROR

          make $MAKE_ARGS olddefconfig
          # Adăugăm flag-uri pentru a ignora erorile de tip mismatch cauzate de headerele de 5.10 în 4.14
          make -j$(nproc --all) $MAKE_ARGS Image.gz KCFLAGS="-w -fcommon -fno-stack-protector -Wno-implicit-function-declaration -Wno-int-conversion"

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-R5Q-Phoenix-Hybrid-V5
          path: kernel/out/arch/arm64/boot/Image.gz
