name: S10 Lite Kernel - Android 15 Hybrid (Pascua-Sixteen Style)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves libncurses-dev git wget make python2 python3 pahole cpio

      - name: Cache Toolchain
        uses: actions/cache@v4
        with:
          path: toolchain/proton-clang
          key: ${{ runner.os }}-proton-clang-v1

      - name: Download Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang || true

      - name: Upstream eBPF from Kernel.org (Linux 4.14.y)
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git remote add linux-stable https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git || true
          git fetch linux-stable linux-4.14.y --depth=1
          PATHS=("kernel/bpf/" "drivers/android/" "include/linux/bpf.h" "include/linux/filter.h" "include/linux/bpf_verifier.h" "include/linux/bpf-cgroup.h" "include/uapi/linux/bpf.h" "include/uapi/linux/bpf_common.h" "include/uapi/linux/filter.h" "arch/arm64/net/")
          for path in "${PATHS[@]}"; do git checkout FETCH_HEAD -- "$path" || echo "Skip: $path"; done

      - name: Pre-build Fixes (Android 15 & SELinux)
        run: |
          # 1. Fix SELinux & BPF Structs (Pascua Technique)
          # Injectăm membrul security înapoi în structura BPF pentru a nu mai crăpa SELinux
          sed -i '/struct bpf_prog_aux {/a \	void *security;' include/linux/bpf.h
          
          # Adăugăm declarațiile externe în hooks.c pentru a rezolva "undeclared identifier"
          if [ -f security/selinux/hooks.c ]; then
            sed -i '/#include "layers.h"/a #include <linux/bpf.h>' security/selinux/hooks.c
            sed -i '130i extern const struct file_operations bpf_map_fops;' security/selinux/hooks.c
            sed -i '131i extern const struct file_operations bpf_prog_fops;' security/selinux/hooks.c
            # Bypass pentru erorile de tip mismatch dacă simbolurile tot nu sunt găsite
            sed -i 's/file->f_op == &bpf_map_fops/0/g' security/selinux/hooks.c
            sed -i 's/file->f_op == &bpf_prog_fops/0/g' security/selinux/hooks.c
          fi

          # 2. Fix Assembler & Poll types
          sed -i '/#define _UAPI_LINUX_TYPES_H/a #ifndef __poll_t\n#ifndef __ASSEMBLY__\ntypedef unsigned int __poll_t;\n#endif\n#define __poll_t __poll_t\n#endif' include/uapi/linux/types.h

          # 3. Fix Cgroup Bridge (Android 15 Compatibility)
          if [ -f kernel/cgroup/cgroup.c ]; then
            sed -i 's/ret = cgroup_bpf_inherit(root_cgrp)/cgroup_bpf_inherit(root_cgrp, NULL)/g' kernel/cgroup/cgroup.c
            sed -i 's/ret = cgroup_bpf_inherit(cgrp)/cgroup_bpf_inherit(cgrp, NULL)/g' kernel/cgroup/cgroup.c
          fi

          # 4. Injectare Samsung Perflog & Python Link
          mkdir -p system/core/liblog/include/log
          echo -e "#ifndef _PERFLOG_H\n#define _PERFLOG_H\n#endif" > system/core/liblog/include/log/perflog.h
          sudo ln -sf /usr/bin/python3 /usr/bin/python

      - name: Build Kernel
        run: |
          export PATH=$(pwd)/toolchain/proton-clang/bin:$PATH
          MAKE_ARGS="O=out ARCH=arm64 CC=clang HOSTCC=gcc HOSTCXX=g++ LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1 TECHPACK=true"
          
          # Flags pentru a ignora warning-urile care opresc build-ul pe Clang modern
          export KCFLAGS="-Wno-error -Wno-implicit-function-declaration -Wno-macro-redefined -Wno-incompatible-pointer-types"
          
          rm -rf out && mkdir -p out
          make $MAKE_ARGS r5q_eur_open_defconfig
          
          # Configurații critice pentru Android 15 (Sixteen style)
          ./scripts/config --file out/.config --enable CONFIG_BPF_SYSCALL
          ./scripts/config --file out/.config --enable CONFIG_BPF_JIT
          ./scripts/config --file out/.config --enable CONFIG_HAVE_EBPF_JIT
          ./scripts/config --file out/.config --enable CONFIG_ANDROID_BINDERFS
          ./scripts/config --file out/.config --disable CONFIG_SAMSUNG_PRODUCT_SHIP
          ./scripts/config --file out/.config --disable CONFIG_DEFEX
          ./scripts/config --file out/.config --disable CONFIG_CC_STACKPROTECTOR_STRONG
          
          make $MAKE_ARGS olddefconfig
          make -j$(nproc --all) $MAKE_ARGS || (echo "Build failed, attempting single-thread for logs..." && make -j1 $MAKE_ARGS)

          if [ -f out/arch/arm64/boot/Image ]; then
            echo "KERNEL_READY=true" >> $GITHUB_ENV
            cp out/arch/arm64/boot/Image .
          else
            echo "Kernel Image not found!"
            exit 1
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: env.KERNEL_READY == 'true'
        with:
          name: Kernel-S10Lite-Android15
          path: Image
