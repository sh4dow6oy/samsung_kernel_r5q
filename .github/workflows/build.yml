name: Build r5q Kernel - eBPF Final Fix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi git libssl-dev python3 clang llvm lld

      - name: Clone Mainey Kernel
        run: |
          git clone --depth=100 https://github.com/mainey/android_kernel_samsung_r5q.git -b lineage-19.0 kernel
          cd kernel
          git config user.email "wizard@build.com"
          git config user.name "Kernel-Wizard"

      - name: Apply eBPF Logic (Safe Merge)
        run: |
          cd kernel
          # Fetch commit-urile dar nu facem checkout forțat la tot, pentru a evita redefinirile de structuri
          git fetch https://github.com/LineageOS/android_kernel_samsung_sm7125 refs/changes/79/387879/1
          git cherry-pick FETCH_HEAD -X theirs || {
            # Dacă cherry-pick eșuează, forțăm doar fișierele care nu produc conflicte de structură
            git checkout FETCH_HEAD -- net/core/filter.c kernel/bpf/core.c
            git add .
            git commit -m "Partial eBPF merge" || echo "No changes"
          }

      - name: Patch Header Conflicts
        run: |
          cd kernel
          # Rezolvăm eroarea "redefinition of struct bpf_line_info" prin adăugarea unor guards
          sed -i '/struct bpf_line_info {/i #ifndef __BPF_LINE_INFO_DEFINED\n#define __BPF_LINE_INFO_DEFINED' include/uapi/linux/bpf.h
          sed -i '/};/a #endif' include/uapi/linux/bpf.h
          
          # Fix BPF_OBJ_NAME_LEN
          sed -i '/#define _UAPI__LINUX_BPF_H/a #ifndef BPF_OBJ_NAME_LEN\n#define BPF_OBJ_NAME_LEN 16U\n#endif' include/uapi/linux/bpf.h

          # Creăm dummy secgetspf pentru a trece de Makefile-ul Samsung
          echo -e "#!/bin/sh\necho '00000000000000000000000000000000'\nexit 0" > secgetspf
          chmod +x secgetspf

      - name: Configure and Build
        run: |
          cd kernel
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export PATH=$PATH:$(pwd)

          mkdir -p out
          make O=out ARCH=arm64 r5q_eur_open_defconfig
          
          # Configurații eBPF
          scripts/config --file out/.config -e BPF -e BPF_SYSCALL -e BPF_JIT -e CGROUP_BPF -e NETFILTER_XT_MATCH_BPF
          scripts/config --file out/.config --set-val NR_CPUS 8
          scripts/config --file out/.config -d SEC_DEBUG
          
          # Acceptăm automat opțiunile noi
          yes "" | make O=out ARCH=arm64 oldconfig
          
          # BUILD: Adăugăm -Wno-reorder și -Wno-error pentru a trece de erorile din verifier.c
          make -j$(nproc --all) O=out ARCH=arm64 \
            LD=ld.lld \
            KCFLAGS="-Wno-error -Wno-implicit-function-declaration -Wno-int-conversion -fcommon -DNR_CPUS=8"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-r5q-eBPF-Final
          path: |
            kernel/out/arch/arm64/boot/Image.gz-dtb
            kernel/out/arch/arm64/boot/dtbo.img
