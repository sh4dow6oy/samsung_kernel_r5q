name: Build S10 Lite (r5q) Kernel - Neutron Clang

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Base
        uses: actions/checkout@v4
        with:
          repository: pascua28/android_kernel_samsung_sm7150
          ref: sixteen
          path: kernel

      - name: Checkout S10 Lite DTS
        uses: actions/checkout@v4
        with:
          repository: Roynas-Android-Playground/kernel_samsung_r3q
          ref: master
          path: roynas_source
          sparse-checkout: |
            arch/arm64/boot/dts/samsung/renovation

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential bison flex libssl-dev libelf-dev clang lld llvm zip
          mkdir -p bin

      - name: Install Neutron Toolchain
        run: |
          curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
          chmod +x antman
          ./antman -S
          echo "$GITHUB_WORKSPACE/neutron-clang/bin" >> $GITHUB_PATH

      - name: Patch Kernel and Inject DTS
        run: |
          cd kernel
          # 1. Injectare DTS S10 Lite
          mkdir -p arch/arm64/boot/dts/samsung/renovation
          cp -r ../roynas_source/arch/arm64/boot/dts/samsung/renovation/* arch/arm64/boot/dts/samsung/renovation/
          echo 'dtbo-$(CONFIG_ARCH_SM8150) += renovation/sm8150-sec-r5q-overlay-r00.dtbo' >> arch/arm64/boot/dts/samsung/Makefile

          # 2. Configurare r5q - Dezactivare module Samsung Debug problematice
          cat arch/arm64/configs/vendor/sm8150-perf_defconfig arch/arm64/configs/a71.config > arch/arm64/configs/r5q_defconfig
          cat <<EOF >> arch/arm64/configs/r5q_defconfig
          CONFIG_MACH_SAMSUNG_R5Q=y
          CONFIG_PANEL_S6E3HA8=y
          CONFIG_TOUCHSCREEN_ST_STSA354=y
          CONFIG_TOUCHSCREEN_SEC_TS=y
          CONFIG_FUELGAUGE_MAX17055=y
          CONFIG_CHARGER_MAX77705=y
          CONFIG_BATTERY_SAMSUNG_V2=y
          CONFIG_SEC_DEBUG=n
          CONFIG_SEC_ABC=n
          CONFIG_SEC_LOG_BUF=n
          CONFIG_SEC_HW_PARAM=n
          CONFIG_SEC_RESET_REASON=n
          CONFIG_CC_STACKPROTECTOR_NONE=y
          EOF

      - name: Fix Samsung Display Driver & AOSP Flags
        run: |
          cd kernel
          # 1. Fix Include Paths pentru SDE (rezolvă 'ss_dsi_panel_common.h' not found)
          sed -i '/ccflags-y += -Idrivers\/gpu\/drm\/msm/a ccflags-y += -Idrivers/gpu/drm/msm/samsung' drivers/gpu/drm/msm/Makefile
          
          # 2. Fix 'is_aosp' - Prevenirea erorilor de redeclarare și tip 'bool'
          # Ștergem injectările anterioare defectuoase
          grep -rl "is_aosp" drivers/gpu/drm/msm/ | xargs sed -i '/bool is_aosp = true;/d' || true
          
          # Definim is_aosp corect în msm_drv.c
          if ! grep -q "bool is_aosp = true;" drivers/gpu/drm/msm/msm_drv.c; then
            echo 'bool is_aosp = true;' >> drivers/gpu/drm/msm/msm_drv.c
            sed -i '1i #include <linux/types.h>' drivers/gpu/drm/msm/msm_drv.c
          fi

          # 3. Fix ss_dsi_panel_sysfs.c (Eroarea unknown type name 'bool')
          sed -i '1i #include <linux/types.h>' drivers/gpu/drm/msm/samsung/ss_dsi_panel_sysfs.c

          # 4. Fix DSI Identifiers în ss_dsi_panel_common.h
          HEADER_DSI="drivers/gpu/drm/msm/samsung/ss_dsi_panel_common.h"
          if [ -f "$HEADER_DSI" ]; then
            sed -i '1i #include <linux/types.h>' $HEADER_DSI
            sed -i '1i #include "../dsi-staging/dsi_defs.h"' $HEADER_DSI
            if ! grep -q "SS_DSI_CMD_SET_MAX" $HEADER_DSI; then
              sed -i '/#define _SS_DSI_PANEL_H_/a #define SS_DSI_CMD_SET_MAX DSI_CMD_SET_MAX\n#define SUPPORT_PANEL_REVISION 8\n#define RX_CMD_START 0\n#define RX_CMD_END 100\n#define RX_SELF_DISP_DEBUG 1\n#define RX_SELF_MASK_CHECK 2' $HEADER_DSI
            fi
          fi

          # 5. Fix vDSO & Hardware Params
          sed -i 's/-fno-compiler-account-cfa-mitigation//g' Makefile
          sed -i 's/-fno-compiler-account-cfa-mitigation//g' arch/arm64/Makefile
          sed -i 's/$(CROSS_COMPILE)as/$(CC) -target aarch64-linux-gnu -c/g' arch/arm64/kernel/vdso/Makefile
          sed -i '1i #include <linux/types.h>' include/linux/msm_pcie.h
          
          echo -e "#!/bin/bash\nexit 0" > secgetspf
          chmod +x secgetspf
          echo "$(pwd)" >> $GITHUB_PATH

      - name: Build Kernel
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/neutron-clang/bin:$PATH"
          make O=out ARCH=arm64 r5q_defconfig
          make O=out ARCH=arm64 olddefconfig
          
          # Compilare cu ignorarea avertizărilor transformate în erori de Clang modern
          make -j$(nproc --all) O=out \
               ARCH=arm64 LLVM=1 LLVM_IAS=1 \
               CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
               CROSS_COMPILE=aarch64-linux-gnu- \
               CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
               LD=ld.lld AR=llvm-ar NM=llvm-nm \
               OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
               CONFIG_LTO_CLANG_NONE=y \
               KCFLAGS="-Wno-error -Wno-int-conversion -Wno-implicit-function-declaration -Wno-incompatible-pointer-types -Wno-return-type" \
               -k || true

      - name: Prepare AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          find kernel/out/arch/arm64/boot/ -name "Image*" -maxdepth 1 -exec cp {} AnyKernel3/ \;
          find kernel/out/arch/arm64/boot/dts/samsung/ -name "*.dtbo" -exec cp {} AnyKernel3/dtbo.img \;
          cd AnyKernel3
          sed -i 's/device.name1=maguro/device.name1=r5q/g' anykernel.sh
          zip -r ../S10Lite-Kernel-Final.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-S10Lite-R5Q
          path: S10Lite-Kernel-Final.zip
