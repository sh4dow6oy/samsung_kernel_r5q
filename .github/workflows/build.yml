name: S10 Lite - Proton Clang (Fix BTF)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves libncurses-dev git wget make python2 python3 pahole tar xz-utils lib32z1

      - name: Setup Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang
          echo "PROTON_PATH=$(pwd)/toolchain/proton-clang/bin" >> $GITHUB_ENV

      - name: Build Kernel
        run: |
          export PATH="${{ env.PROTON_PATH }}:$PATH"
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          
          # FIX CRITIC pentru 'uapi/linux/btf.h'
          # Creăm un simlink în folderul de incluziune pentru a ajuta compilatorul să găsească fișierul
          mkdir -p include/uapi/linux
          cp include/linux/btf.h include/uapi/linux/btf.h || true
          
          # Fix pentru eroarea secgetspf (creăm un script gol care să nu dea eroare)
          echo -e '#!/bin/bash\necho "0"' > /tmp/secgetspf
          chmod +x /tmp/secgetspf
          sudo mv /tmp/secgetspf /usr/bin/secgetspf

          MAKE_ARGS="
            O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1 \
            V=1
          "
          
          # Adăugăm flag-ul de incluziune direct în KCFLAGS pentru a forța căutarea în folderul uapi
          export KCFLAGS="-Wno-error -Wno-implicit-function-declaration -I$(pwd)/include/uapi -I$(pwd)/out/include/generated/uapi"

          rm -rf out && mkdir -p out
          
          # 1. Configurare
          make $MAKE_ARGS r5q_eur_open_defconfig
          
          # 2. Dezactivăm BTF în config dacă tot dă erori (opțional, dar recomandat pentru stabilitate build)
          sed -i 's/CONFIG_DEBUG_INFO_BTF=y/CONFIG_DEBUG_INFO_BTF=n/g' out/.config
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/CONFIG_CC_STACKPROTECTOR_NONE=y/g' out/.config
          make $MAKE_ARGS olddefconfig
          
          # 3. Build
          make -j$(nproc --all) $MAKE_ARGS || make -j1 $MAKE_ARGS

          if [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image .
            echo "SUCCESS=true" >> $GITHUB_ENV
          fi

      - name: Upload Artifact
        if: env.SUCCESS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-Kernel-Fixed
          path: Image
