name: Build Samsung S10 Lite (r5q) - Neutron Clang

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        repository: sh4dow6oy/android_kernel_samsung_a82xq
        ref: linux-4.14.285
        fetch-depth: 1

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential bison flex libssl-dev libelf-dev xz-utils wget git gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi zstd python3

    - name: Download and Setup Neutron Clang
      run: |
        mkdir neutron
        wget https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
        tar -I zstd -xf neutron-clang-10032024.tar.zst -C neutron
        echo "NEUTRON_PATH=$(pwd)/neutron/bin" >> $GITHUB_ENV

    - name: Nuclear Fix for Samsung Wrapper
      run: |
        # Rescriem wrapper-ul pentru Python 3 si bypass toolchain samsung
        cat <<EOF > scripts/gcc-wrapper.py
#!/usr/bin/env python3
import sys, subprocess
def run_gcc():
    args = sys.argv[1:]
    return subprocess.call(args)
if __name__ == "__main__":
    sys.exit(run_gcc())
EOF
        chmod +x scripts/gcc-wrapper.py

    - name: Build Kernel
      run: |
        export PATH=${{ env.NEUTRON_PATH }}:$PATH
        
        # Variabile de mediu
        export ARCH=arm64
        export SUBARCH=arm64
        export CC=clang
        export NM=llvm-nm
        export OBJCOPY=llvm-objcopy
        export LD=ld.lld
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        
        # Fix pentru Neutron (uneori are nevoie de forțarea tripletei)
        export CLANG_TRIPLE=aarch64-linux-gnu-

        make clean
        make mrproper
        
        # Configurare
        make r5q_eur_open_defconfig
        
        # Compilare
        # Am adaugat LLVM=1 si LLVM_IAS=1 pentru a folosi integratorul de asamblare Neutron
        make -j$(nproc --all) \
                      ARCH=arm64 \
                      CC=clang \
                      LD=ld.lld \
                      AR=llvm-ar \
                      NM=llvm-nm \
                      OBJCOPY=llvm-objcopy \
                      OBJDUMP=llvm-objdump \
                      STRIP=llvm-strip \
                      CLANG_TRIPLE=aarch64-linux-gnu- \
                      CROSS_COMPILE=aarch64-linux-gnu- \
                      CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
                      LLVM=1 \
                      LLVM_IAS=1 \
                      KCFLAGS="-w"

    - name: Check Output
      run: |
        if [ -f arch/arm64/boot/Image.gz-dtb ]; then
            echo "Success: Image.gz-dtb created"
        elif [ -f arch/arm64/boot/Image.gz ]; then
            echo "Success: Image.gz created"
        else
            echo "Build failed!"
            exit 1
        fi

    - name: Upload Kernel
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-S10Lite-Neutron
        path: |
          arch/arm64/boot/Image.gz*
          arch/arm64/boot/dtbo.img
