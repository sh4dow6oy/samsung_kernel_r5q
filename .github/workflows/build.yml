name: Build R5Q Kernel - Bootable

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: sh4dow6oy/android_kernel_samsung_sm7150
          ref: sixteen
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev \
          ccache python3 python-is-python3 libarchive-tools wget zstd zip \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libncurses-dev

      - name: Setup Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: Fix secgetspf
        run: |
          echo -e "#!/bin/bash\necho 0" > scripts/secgetspf
          chmod +x scripts/secgetspf
          export PATH="$GITHUB_WORKSPACE/scripts:$PATH"

      - name: Build Kernel
        run: |
          set -e

          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export KBUILD_BUILD_USER="Roynas"
          export KBUILD_BUILD_HOST="Github"

          MAKE_ARGS="ARCH=arm64 \
            LLVM=1 LLVM_IAS=1 \
            CC=clang LD=ld.lld \
            AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            O=out"

          # Defconfig
          make $MAKE_ARGS r5q_defconfig

          # 🔥 CURĂȚARE REALĂ (important)
          ./scripts/config --file out/.config \
            -d CONFIG_SEC_DEBUG \
            -d CONFIG_SEC_DEBUG_EXTRA_INFO \
            -d CONFIG_USB_CONFIGFS \
            -d CONFIG_USB_G_ANDROID \
            -d CONFIG_SAMSUNG_BATTERY \
            -d CONFIG_BATTERY_SAMSUNG \
            -d CONFIG_MOTOR \
            -d CONFIG_ADSP_FACTORY \
            -d CONFIG_QCOM_WCD934X \
            -d CONFIG_SND_SOC_WCD_MBHC \
            -d CONFIG_SND_SOC_SAMSUNG \
            -d CONFIG_SEC_SYSFS \
            -d CONFIG_SEC_FACTORY \
            -e CONFIG_SECTION_MISMATCH_WARN_ONLY

          make $MAKE_ARGS olddefconfig

          # 🔥 BUILD SAFE
          make -j4 $MAKE_ARGS Image.gz 2>&1 | tee build.log

      - name: Package AnyKernel3
        run: |
          if [ -f out/arch/arm64/boot/Image.gz ]; then
            git clone https://github.com/osm0sis/AnyKernel3.git
            cp out/arch/arm64/boot/Image.gz AnyKernel3/

            sed -i 's/device.name1=.*/device.name1=r5q/' AnyKernel3/anykernel.sh

            cd AnyKernel3
            zip -r9 ../Kernel-R5Q-Bootable.zip *
          else
            echo "Build failed!"
            cat build.log
            exit 1
          fi

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-R5Q-Bootable
          path: Kernel-R5Q-Bootable.zip
