name: Build Samsung Kernel r5q (GCC)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
      CC: gcc
      NO_CC_WRAPPER: 1
      KERNEL_DIR: ${{ github.workspace }}
      OUTPUT_DIR: ${{ github.workspace }}/out
      DEFCONFIG: r5q_eur_open_defconfig

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev dwarves \
            libncurses-dev git wget unzip make gcc g++ \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            python3

      - name: Disable gcc-wrapper
        run: |
          cd $KERNEL_DIR
          mv scripts/gcc-wrapper.py scripts/gcc-wrapper.py.disabled || true

      - name: Make defconfig
        run: |
          cd $KERNEL_DIR
          make O=$OUTPUT_DIR ARCH=$ARCH $DEFCONFIG

      - name: Build kernel
        run: |
          cd $KERNEL_DIR
          make -j$(nproc) O=$OUTPUT_DIR ARCH=$ARCH \
            CC=$CC CROSS_COMPILE=$CROSS_COMPILE NO_CC_WRAPPER=1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-artifacts
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dts/*.dtb
            out/vmlinux
