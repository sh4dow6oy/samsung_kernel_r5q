name: S10 Lite (V26 - Permissions & Path Fix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Cache
        uses: actions/cache@v4
        with:
          path: |
            clang
            out
          key: ${{ runner.os }}-r5q-v26-final
          restore-keys: |
            ${{ runner.os }}-r5q-v26-

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex git libssl-dev libelf-dev clang llvm lld zstd curl python3 device-tree-compiler gcc-aarch64-linux-gnu

      - name: Download Neutron Clang
        run: |
          if [ ! -d "clang/bin" ]; then
            mkdir -p clang
            wget https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
            tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang
          fi

      - name: Fix Permissions and Source
        run: |
          # 1. ACORDARE PERMISIUNI (Rezolvă "Permission denied" de la ./scripts/config)
          chmod -R +x scripts/
          
          # 2. Fix DTC Lexer & yylloc
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' scripts/dtc/dtc-lexer.lex.c_shipped || true
          
          # 3. Stergere agresiva secgetspf din Makefile-uri
          # Folosim o metoda care cauta orice variatie a string-ului
          find . -type f -name "Makefile*" -exec sed -i 's/$(shell secgetspf)//g' {} +
          find . -type f -name "*.mk" -exec sed -i 's/$(shell secgetspf)//g' {} +

          # 4. Mocking Headers
          mkdir -p system/core/liblog/include/log
          touch system/core/liblog/include/log/perflog.h
          
          # 5. Dezactivare gcc-wrapper.py
          sed -i 's/exec /#exec /g' scripts/gcc-wrapper.py || true
          echo 'exec "$@"' >> scripts/gcc-wrapper.py
          chmod +x scripts/gcc-wrapper.py

      - name: Build Kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          
          # Definim argumentele de build
          MAKE_ARGS="ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            O=out"

          # Configurare
          make $MAKE_ARGS g770f_defconfig

          # Executăm scripts/config (Acum va avea permisiuni)
          ./scripts/config --file out/.config \
            -d CONFIG_CC_STACKPROTECTOR_STRONG \
            -e CONFIG_CC_STACKPROTECTOR_NONE \
            -d CONFIG_CC_WERROR

          make $MAKE_ARGS olddefconfig

          # Compilare
          make -j$(nproc --all) $MAKE_ARGS \
            KCFLAGS="--target=aarch64-linux-gnu -fcommon -fno-stack-protector -Wno-error" \
            2>&1 | tee build.log

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-Build-V26
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/dtbo.img
            build.log
