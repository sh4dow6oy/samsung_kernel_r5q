name: Build R5Q - S10 Lite A15 Final V24

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout LineageOS Kernel
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_google_msm-4.14
          ref: lineage-21
          path: kernel

      - name: Checkout Mainey R5Q
        uses: actions/checkout@v4
        with:
          repository: mainey/android_kernel_samsung_r5q
          ref: lineage-19.0
          path: samsung

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev \
          ccache python3 python-is-python3 libarchive-tools wget zstd libtinfo6 zip \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi device-tree-compiler rsync git

      - name: Setup Toolchain
        run: |
          mkdir -p clang
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang

      - name: Injected Hardware & Source Patches
        run: |
          # 1. Injectăm Device Tree Samsung (Esențial pentru hardware-ul r5q)
          mkdir -p kernel/arch/arm64/boot/dts/samsung
          cp -r samsung/arch/arm64/boot/dts/samsung/* kernel/arch/arm64/boot/dts/samsung/
          echo 'obj-y += samsung/' > kernel/arch/arm64/boot/dts/Makefile
          
          # 2. Configurația specifică r5q
          cp samsung/arch/arm64/configs/r5q_eur_open_defconfig kernel/arch/arm64/configs/r5q_eur_open_defconfig

          # 3. [GPIO FIX] Eliminăm msm_gpio_dump care cauzează erori de linker
          sed -i '/if (chip->gpio_dump) {/,/}/d' kernel/drivers/gpio/gpiolib.c
          echo 'struct seq_file; int msm_gpio_dump(struct seq_file *s) { return 0; }' >> kernel/drivers/gpio/gpiolib.c

          # 4. Linker Fixes pentru Wi-Fi și PSCI
          echo "void arm64_update_smccc_conduit(unsigned int conduit) {}" >> kernel/arch/arm64/kernel/psci.c
          find kernel/drivers/staging/ -name "*.h" -o -name "*.c" | xargs sed -i 's/timer_setup_on_stack/timer_setup/g' || true
          
          # 5. [SCHEDULER] Folosim managementul de procese Google (eliminăm conflictele WALT)
          sed -i 's/obj-y += walt.o/# obj-y += walt.o/' kernel/kernel/sched/Makefile
          
          # 6. [CORESIGHT FIX] Dezactivăm driverul de debug care genera erori de pointeri
          sed -i 's/obj-$(CONFIG_CORESIGHT_DUMMY) += coresight-dummy.o/# coresight-dummy disabled/' kernel/drivers/hwtracing/coresight/Makefile

          # 7. DM-BOW & Kernel Spoofing (Forțăm kernel 5.4 pentru compatibilitate A15)
          sed -i 's/#define SECTOR_SIZE 512/#ifndef SECTOR_SIZE\n#define SECTOR_SIZE 512\n#endif/' kernel/drivers/md/dm-bow.c
          cd kernel
          sed -i 's/VERSION = 4/VERSION = 5/g' Makefile
          sed -i 's/PATCHLEVEL = 14/PATCHLEVEL = 4/g' Makefile

      - name: Build Kernel Components
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          MAKE_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- O=out"
          
          make $MAKE_ARGS r5q_eur_open_defconfig
          
          # Ajustăm configurația pentru stabilitate maximă
          ./scripts/config --file out/.config \
            -e CONFIG_BUILD_ARM64_DTBO_IMG \
            -d CONFIG_SCHED_WALT -d CONFIG_SCHED_CORE_CTL \
            -e CONFIG_BPF -e CONFIG_BPF_SYSCALL -e CONFIG_BPF_JIT \
            -d CONFIG_WERROR -e CONFIG_LTO_NONE -d CONFIG_GOOGLE_BMS \
            -d CONFIG_CORESIGHT_DUMMY -d CONFIG_MMC_SDHCI_MSM_ICE
            
          make $MAKE_ARGS olddefconfig
          
          # Compilăm Image.gz și DTBs (Device Tree Blobs)
          make -j$(nproc) $MAKE_ARGS Image.gz dtbs KCFLAGS="-w -fcommon"
          
          # Compilăm separat DTBO (Overlay)
          make -j4 $MAKE_ARGS dtbo.img KCFLAGS="-w -fcommon" || echo "DTBO build skipped"

      - name: Assemble AnyKernel3
        run: |
          OUT="kernel/out/arch/arm64/boot"
          IMAGE="$OUT/Image.gz"
          DTB=$(find $OUT/dts -name "*r5q*.dtb" -type f | head -n 1)
          DTBO=$(find $OUT -name "dtbo.img" -type f | head -n 1)

          if [ ! -f "$IMAGE" ]; then
            echo "EROARE: Image.gz nu a fost generat!"
            exit 1
          fi

          git clone https://github.com/osm0sis/AnyKernel3.git AK3
          
          # Samsung cere ca DTB-ul să fie concatenat cu kernelul (Image.gz-dtb)
          if [ -n "$DTB" ]; then
            echo "Concatenăm Image cu DTB: $DTB"
            cat "$IMAGE" "$DTB" > AK3/Image.gz
          else
            cp "$IMAGE" AK3/Image.gz
          fi
          
          # Adăugăm DTBO dacă a fost generat
          [ -f "$DTBO" ] && cp "$DTBO" AK3/dtbo.img

          cd AK3
          sed -i 's/device.name1=maguro/device.name1=r5q/g' anykernel.sh
          sed -i 's/device.name2=toroplus/device.name2=SM-G770F/g' anykernel.sh
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          zip -r9 ../S10Lite_A15_V24.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-Kernel-Final-V24
          path: S10Lite_A15_V24.zip
