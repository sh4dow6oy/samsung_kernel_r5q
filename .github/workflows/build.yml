name: S10 Lite (r5q) - GKI Compatible Kernel 4.14 (Android 15)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ARCH: arm64
      SUBARCH: arm64
      LLVM: 1
      LLVM_IAS: 1
      CC: clang

    steps:
      # ===============================
      # Checkout kernel source
      # ===============================
      - name: Checkout S10 Lite Kernel Source
        uses: actions/checkout@v4
        with:
          repository: sh4dow6oy/samsung_kernel_r5q
          path: kernel
          fetch-depth: 1

      # ===============================
      # Dependencies
      # ===============================
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev \
            dwarves lz4 git make python3 \
            gcc-aarch64-linux-gnu

      # ===============================
      # Proton Clang
      # ===============================
      - name: Setup Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain
          echo "$(pwd)/toolchain/bin" >> $GITHUB_PATH

      # ===============================
      # GKI + eBPF SAFE PATCHES
      # ===============================
      - name: Apply GKI + eBPF compatibility patches
        run: |
          cd kernel

          echo "[+] Fix access_ok() compatibility"
          sed -i 's/access_ok(\([^,]*\),/access_ok(VERIFY_READ, \1,/' kernel/bpf/syscall.c || true

          echo "[+] Disable BTF (Android 15 safe)"
          sed -i 's/CONFIG_DEBUG_INFO_BTF=y/CONFIG_DEBUG_INFO_BTF=n/' arch/arm64/configs/r5q_* || true

          echo "[+] Prevent xdp_buff redefinition"
          sed -i '/struct xdp_buff {/,+5d' include/linux/bpf.h || true

          echo "[+] Guard bpf_lirc include"
          sed -i 's/#include <linux\/bpf_lirc.h>/\/\* disabled: not in 4.14 \*\//' kernel/bpf/syscall.c || true

          echo "[+] Guard PERF_BPF_EVENT_*"
          sed -i 's/PERF_BPF_EVENT_PROG_/PERF_EVENT_/g' kernel/bpf/syscall.c || true

      # ===============================
      # Kernel configuration
      # ===============================
      - name: Configure Kernel (GKI Compatible)
        run: |
          cd kernel

          make r5q_eur_open_defconfig

          ./scripts/config --enable CONFIG_MODULES
          ./scripts/config --enable CONFIG_MODVERSIONS
          ./scripts/config --enable CONFIG_IKCONFIG
          ./scripts/config --enable CONFIG_IKCONFIG_PROC

          # Android 15 eBPF (MINIMAL)
          ./scripts/config --enable CONFIG_BPF
          ./scripts/config --enable CONFIG_BPF_SYSCALL
          ./scripts/config --enable CONFIG_BPF_JIT
          ./scripts/config --enable CONFIG_CGROUP_BPF

          # REQUIRED DISABLES
          ./scripts/config --disable CONFIG_DEBUG_INFO
          ./scripts/config --disable CONFIG_DEBUG_INFO_BTF
          ./scripts/config --disable CONFIG_RANDOMIZE_BASE

          # Samsung blockers
          ./scripts/config --disable CONFIG_SECURITY_SAMSUNG_RKP
          ./scripts/config --disable CONFIG_SAMSUNG_PRODUCT_SHIP

          make olddefconfig

      # ===============================
      # Build kernel
      # ===============================
      - name: Build Kernel Image + Modules
        run: |
          cd kernel

          export KCFLAGS="-O3 -Wno-everything -Wno-error"

          make -j$(nproc) \
            ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            Image.gz-dtb modules

      # ===============================
      # Upload artifacts
      # ===============================
      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: s10lite-kernel-gki-a15
          path: |
            kernel/arch/arm64/boot/Image.gz-dtb
            kernel/modules
