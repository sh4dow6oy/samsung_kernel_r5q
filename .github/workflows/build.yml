name: Build R5Q - Lumi BPF V40 (RTIC & JIT Fix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout LumiPlayground Kernel
        uses: actions/checkout@v4
        with:
          repository: LumiPlayground/android_kernel_samsung_sm8150
          ref: rawr-bpf
          path: kernel

      - name: Install Toolchain & Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu bc
          mkdir -p clang
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang

      - name: Fix Assembler Path
        run: |
          mkdir -p $GITHUB_WORKSPACE/bin-fix
          ln -s /usr/bin/aarch64-linux-gnu-as $GITHUB_WORKSPACE/bin-fix/as
          echo "$GITHUB_WORKSPACE/bin-fix" >> $GITHUB_PATH

      - name: Build Kernel
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/bin-fix:$PATH"
          
          # Folosim LLVM linker (ld.lld) pentru a evita erorile de relocare ale bfd
          MAKE_ARGS="ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            O=out"
          
          make $MAKE_ARGS r5q_eur_open_defconfig
          
          # DEZACTIVARE RTIC & ACTIVARE BPF JIT
          ./scripts/config --file out/.config \
            -d CONFIG_SAMSUNG_RTIC \
            -d CONFIG_SAMSUNG_RTIC_AMP \
            -e CONFIG_BPF -e CONFIG_BPF_SYSCALL -e CONFIG_BPF_JIT -e CONFIG_BPF_JIT_ALWAYS_ON \
            -e CONFIG_HAVE_EBPF_JIT -e CONFIG_NET_ACT_BPF -e CONFIG_NET_CLS_BPF \
            -d CONFIG_CC_STACKPROTECTOR_STRONG -e CONFIG_CC_STACKPROTECTOR_NONE \
            -d CONFIG_UNMAP_KERNEL_AT_EL0 -d CONFIG_WERROR
            
          make $MAKE_ARGS olddefconfig
          
          # Compilăm cu flag-uri pentru a repara relocările SELinux
          # -mcmodel=large ajută la erorile de tip "relocation truncated"
          make -j$(nproc --all) $MAKE_ARGS Image.gz dtbs \
            KCFLAGS="-w -fcommon -fno-stack-protector -mcmodel=large"

      - name: Assemble AnyKernel3
        run: |
          OUT="kernel/out/arch/arm64/boot"
          IMAGE="$OUT/Image.gz"
          DTB=$(find $OUT/dts -name "*r5q*.dtb" -type f | head -n 1)
          git clone https://github.com/osm0sis/AnyKernel3.git AK3
          [ -f "$DTB" ] && cat "$IMAGE" "$DTB" > AK3/Image.gz || cp "$IMAGE" AK3/Image.gz
          cd AK3
          sed -i 's/device.name1=maguro/device.name1=r5q/g' anykernel.sh
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          zip -r9 ../S10Lite_V40_JIT_NoRTIC.zip *

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-V40
          path: S10Lite_V40_JIT_NoRTIC.zip
