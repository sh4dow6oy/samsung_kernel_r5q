name: Build Roynas R5Q - Neutron Toolchain
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: Roynas-Android-Playground/kernel_samsung_r3q
          ref: master
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev \
          ccache python3 python-is-python3 libarchive-tools wget libtinfo5

      - name: Setup Neutron Clang
        run: |
          mkdir clang
          # Descarcăm Neutron Clang (unul dintre cele mai performante compilatoare pentru Android)
          curl -LSs "https://raw.githubusercontent.com/Neutron-Builds/lisp-wrapper/main/install.sh" | bash
          # Scriptul de sus instalează Neutron în folderul curent

      - name: Build Kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/neutron-clang/bin:$PATH"
          
          # 1. NUCLEAR CLEANUP (Rezolvăm cauza erorilor anterioare)
          # Ștergem orice urmă de Polly care a blocat build-ul trecut
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-mllvm -polly[^ ]*//g' {} +
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-mllvm//g' {} +
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-polly[^ ]*//g' {} +
          
          # FIX VDSO -shared vs -static (Eroarea fatală de linker)
          if [ -f arch/arm64/kernel/vdso/Makefile ]; then
            sed -i 's/-static//g' arch/arm64/kernel/vdso/Makefile
            sed -i 's/$(LDFLAGS)/$(filter-out -static,$(LDFLAGS))/g' arch/arm64/kernel/vdso/Makefile
          fi

          # Dezactivăm KernelSU și wrapper-ul Samsung
          sed -i '/kernelsu/d' drivers/android/Kconfig || true
          sed -i '/kernelsu/d' drivers/android/Makefile || true
          rm -rf drivers/kernelsu
          sed -i 's/ifneq ($(wildcard $(srctree)\/scripts\/gcc-wrapper.py),)/ifeq (0,1)/g' Makefile

          # 2. Argumente Build (Neutron nu are nevoie de GCC extern pentru majoritatea task-urilor)
          MAKE_ARGS="ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            O=out"

          # 3. Build Sequence
          make $MAKE_ARGS r5q_defconfig
          
          # Patch .config pentru Android 15 & stabilitate
          ./scripts/config --file out/.config \
            -d CONFIG_LTO -d CONFIG_LTO_CLANG -e CONFIG_LTO_NONE \
            -d CONFIG_CC_STACKPROTECTOR_STRONG -e CONFIG_CC_STACKPROTECTOR_NONE \
            -d CONFIG_SHADOW_CALL_STACK -d CONFIG_KNOX_KAP -d CONFIG_SECURITY_SAMSUNG_KNOX \
            -d CONFIG_RKP_KDP -d CONFIG_SAMSUNG_PRODUCT_SHIP -d CONFIG_SECURITY_DEFEX \
            -d CONFIG_ASSIST_KSU -d CONFIG_KSU

          make $MAKE_ARGS olddefconfig
          
          # 4. Compilare (Neutron este foarte rapid)
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-fcommon -Wno-error -Wno-unknown-warning-option -Wno-unused-command-line-argument"

      - name: Upload Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-Neutron-Kernel
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/dtbo.img
