name: S10 Lite (Sixteen - DTC & Assembly Fix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sixteen Base (Pascua)
        uses: actions/checkout@v4
        with:
          repository: pascua28/android_kernel_samsung_sm7150
          ref: sixteen
          path: main

      - name: Checkout Royna (For R5Q Defconfig)
        uses: actions/checkout@v4
        with:
          repository: Roynas-Android-Playground/kernel_samsung_r3q
          ref: master
          path: royna

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex git libssl-dev libelf-dev clang llvm lld zstd curl python3 device-tree-compiler

      - name: Download Neutron Clang
        run: |
          mkdir -p main/clang
          wget https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C main/clang

      - name: Inject R5Q & Precision Patching
        run: |
          cp royna/arch/arm64/configs/r5q_defconfig main/arch/arm64/configs/r5q_defconfig
          cd main
          
          # 1. FIX DTC (Multiple definitions fix pentru Clang modern)
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' scripts/dtc/dtc-lexer.lex.c_shipped || true
          
          # 2. FIX setup_arch IN MAIN.C & SETUP.C
          sed -i 's/setup_arch(.*);/setup_arch(\&command_line);/g' init/main.c
          sed -i '1i void setup_arch(char **cmdline_p);' init/main.c
          sed -i 's/void setup_arch(char \*\*cmdline_p.*/void setup_arch(char \*\*cmdline_p)/g' arch/arm64/kernel/setup.c

          # 3. GLOBAL SHIMS (Assembly Safe - Rezolva eroarea de la usr/initramfs)
          cat << 'EOF' > global_shims.h
          #ifndef __GLOBAL_SHIMS_H
          #define __GLOBAL_SHIMS_H
          #ifndef __ASSEMBLY__
          #include <linux/types.h>
          static inline int as_is_debug_level(void) { return 0; }
          static inline int get_avc_paranoid(void) { return 0; }
          #define initcall_sec_debug 0
          #endif
          #ifndef SAMSUNG_PRODUCT_SHIP
          #define SAMSUNG_PRODUCT_SHIP 1
          #endif
          #endif
          EOF
          cat global_shims.h include/linux/compiler.h > include/linux/compiler.h.new
          mv include/linux/compiler.h.new include/linux/compiler.h

          # 4. NUCLEAR CLEANUP (Polly, Wrappers & SecGetSpf)
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-mllvm -polly[^ ]*//g' {} +
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-mllvm//g' {} +
          sed -i 's/ifneq ($(wildcard $(srctree)\/scripts\/gcc-wrapper.py),)/ifeq (0,1)/g' Makefile
          sed -i 's/secgetspf//g' Makefile
          find include/linux -name "cgroup.h" -exec sed -i 's/task->frozen/0/g' {} +

          # 5. VDSO Fix
          if [ -f arch/arm64/kernel/vdso/Makefile ]; then
            sed -i 's/-static//g' arch/arm64/kernel/vdso/Makefile
          fi

      - name: Configure and Build
        run: |
          cd main
          export PATH="$GITHUB_WORKSPACE/main/clang/bin:$PATH"

          # Adaugam DTC-ul extern in argumente
          MAKE_ARGS="ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            DTC=dtc \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            O=out"

          make $MAKE_ARGS r5q_defconfig
          
          ./scripts/config --file out/.config \
            -e CONFIG_BPF_SYSCALL -e CONFIG_BPF_JIT \
            -d CONFIG_LTO -d CONFIG_LTO_CLANG -e CONFIG_LTO_NONE \
            -d CONFIG_SECURITY_SAMSUNG_KNOX -d CONFIG_KNOX_KAP \
            -d CONFIG_SEC_DEBUG

          make $MAKE_ARGS olddefconfig

          # Build Final
          make -j$(nproc --all) $MAKE_ARGS \
            KCFLAGS="-fcommon -Wno-error -Wno-implicit-function-declaration -Wno-macro-redefined -Wno-incompatible-pointer-types" \
            2>&1 | tee build.log

      - name: Upload Kernel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-Sixteen-v8-DTCFix
          path: |
            main/out/arch/arm64/boot/Image.gz-dtb
            main/out/arch/arm64/boot/dtbo.img
            main/build.log
