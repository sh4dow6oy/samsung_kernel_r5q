name: R5Q Android 15 - Ultimate BPF DTBO Appended

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04 # Ubuntu-latest (24.04) are toate dependințele moderne de glibc pentru Neutron
    steps:
      - name: Checkout Source (Full History)
        uses: actions/checkout@v4
        with:
          repository: LumiPlayground/android_kernel_samsung_sm8150
          ref: rawr-bpf
          fetch-depth: 0

      - name: Setup & Brutal Patching
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd bc build-essential libssl-dev libelf-dev python3 python-is-python3 curl ccache zip
          
          # 1. HARD PATCH KALLSYMS (Elimină eroarea 'out of range' / truncation din link-vmlinux)
          sed -i 's/if (base_relative)/if (0)/g' scripts/kallsyms.c || true
          sed -i 's/--kallsyms-base-relative//g' scripts/link-vmlinux.sh || true
          
          # 2. FORCE SELINUX PERMISSIVE (Fix pentru crash-urile de servicii/proprietăți din Android 15)
          if [ -f security/selinux/hooks.c ]; then
            sed -i 's/static int selinux_enforcing = 1;/static int selinux_enforcing = 0;/g' security/selinux/hooks.c
            sed -i 's/static int selinux_enforcing __lsm_ro_after_init = 1;/static int selinux_enforcing __lsm_ro_after_init = 0;/g' security/selinux/hooks.c
          fi
          
          # 3. FIX SAMSUNG MEMORY & MCMODEL LARGE (Injectare sigură direct la începutul Makefile-ului de arm64)
          sed -i 's/extern inline bool need_memory_boosting/extern bool need_memory_boosting/g' include/linux/mm.h || true
          printf '\nKBUILD_CFLAGS += -mcmodel=large\nKBUILD_AFLAGS += -mcmodel=large\n' >> arch/arm64/Makefile

          # 4. BYPASS EROARE VDSO /usr/bin/as
          if [ -f arch/arm64/kernel/vdso/Makefile ]; then
            sed -i 's/-static//g' arch/arm64/kernel/vdso/Makefile
            sed -i 's/$(LDFLAGS)/$(filter-out -static,$(LDFLAGS))/g' arch/arm64/kernel/vdso/Makefile
            sed -i 's/$(CROSS_COMPILE)as/clang -target aarch64-linux-gnu/g' arch/arm64/kernel/vdso/Makefile
          fi

      - name: Download Neutron
        run: |
          mkdir clang-neutron
          curl -LO https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang-neutron

      - name: Build Kernel, BPF & DTBO
        run: |
          export PATH="$(pwd)/clang-neutron/bin:$PATH"
          
          # Argumente de compilare standard LLVM (Înlocuiesc vechiul REAL_CC nefuncțional)
          MAKE_ARGS="ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            AS=\"clang -target aarch64-linux-gnu\" \
            HOSTCC=clang \
            HOSTCXX=clang++ \
            HOSTCFLAGS=-Wno-error \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            O=out"

          # Configurare inițială
          make $MAKE_ARGS r5q_eur_open_defconfig
          
          # Optimizare Config pentru Android 15 (Esențial pentru BPF și eBPF în stiva de rețea A15)
          ./scripts/config --file out/.config \
            -e CONFIG_BPF \
            -e CONFIG_BPF_SYSCALL \
            -e CONFIG_NET_CLS_ACT \
            -e CONFIG_NET_ACT_BPF \
            -e CONFIG_NET_CLS_BPF \
            -e CONFIG_BPF_JIT \
            -e CONFIG_CGROUP_BPF \
            -e CONFIG_LTO_CLANG \
            -e CONFIG_THINLTO \
            -d CONFIG_LTO_NONE \
            -d CONFIG_MODVERSIONS \
            -d CONFIG_CC_STACKPROTECTOR_STRONG \
            -e CONFIG_CC_STACKPROTECTOR_NONE \
            -d CONFIG_WERROR

          make $MAKE_ARGS olddefconfig
          
          # Compilare finală cu forțarea target-ului în KCFLAGS
          make -j$(nproc --all) $MAKE_ARGS \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            KCFLAGS="-w -fcommon -fno-pic -fno-stack-protector --target=aarch64-linux-gnu" \
            Image.gz-dtb dtbs

      - name: Package with AnyKernel3
        run: |
          # Detectăm imaginea generată (Image.gz-dtb sau fallback la Image.gz)
          IMAGE="$GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz-dtb"
          if [ ! -f "$IMAGE" ]; then
            IMAGE="$GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz"
          fi
          
          # Extragere/Generare automată DTBO.img din structurile compilate parțiale
          MKDTIMG="$GITHUB_WORKSPACE/tools/mkdtimg"
          if [ ! -f "$GITHUB_WORKSPACE/out/arch/arm64/boot/dtbo.img" ] && [ -f "$MKDTIMG" ]; then
            chmod +x $MKDTIMG
            DTBO_FILES=$(find $GITHUB_WORKSPACE/out/arch/arm64/boot/dts/ -name "*.dtbo")
            $MKDTIMG create $GITHUB_WORKSPACE/out/arch/arm64/boot/dtbo.img --version=2 --page_size=4096 $DTBO_FILES
          fi
          
          DTBO="$GITHUB_WORKSPACE/out/arch/arm64/boot/dtbo.img"

          # Clonare și configurare AnyKernel3 pentru Samsung S10 Lite (r5q)
          git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel
          rm -rf AnyKernel/.git
          
          cp $IMAGE AnyKernel/Image.gz
          [ -f "$DTBO" ] && cp $DTBO AnyKernel/dtbo.img
          
          cd AnyKernel
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          sed -i 's/device.name1=maguro/device.name1=r5q/g' anykernel.sh
          sed -i 's/device.name2=toroplus/device.name2=SM-G770F/g' anykernel.sh
          sed -i 's/device.name3=toro/device.name3=r5q/g' anykernel.sh
          sed -i 's/header_version=0/header_version=2/g' anykernel.sh
          
          # Logica automată de instalare DTBO
          printf '\n## dtbo flashing\nif [ -f $home/dtbo.img ]; then\n  ui_print "Flashing DTBO...";\n  flash_dtbo;\nfi;\n' >> anykernel.sh
          
          zip -r9 ../Kernel-R5Q-Android15-Ultimate.zip *

      - name: Upload Flashable Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-R5Q-A15-Ultimate
          path: Kernel-R5Q-Android15-Ultimate.zip
