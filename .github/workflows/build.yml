name: S10 Lite - 4.19 Hybrid (Fixed Paths)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves libncurses-dev git wget make python2 python3 pahole tar xz-utils lib32z1

      - name: Setup Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang
          echo "PROTON_PATH=$(pwd)/toolchain/proton-clang/bin" >> $GITHUB_ENV

      - name: Hybrid Source Preparation
        run: |
          # 1. Clonare baze
          git clone --depth=1 https://github.com/duckyduckG/android_kernel_qcom_sm8150_419.git kernel_source
          git clone --depth=1 https://github.com/mainey/android_kernel_samsung_r5q.git samsung_source
          
          # 2. Injectare Config & DTS
          cp samsung_source/arch/arm64/configs/r5q_eur_open_defconfig kernel_source/arch/arm64/configs/r5q_defconfig
          mkdir -p kernel_source/arch/arm64/boot/dts/vendor/qcom/
          find samsung_source/arch/arm64/boot/dts/ -name "*r5q*" -exec cp {} kernel_source/arch/arm64/boot/dts/vendor/qcom/ \;
          # Copiem si dtsi-urile de panel/display (Samsung le tine des separat)
          find samsung_source/arch/arm64/boot/dts/vendor/qcom/ -name "*.dtsi" -exec cp {} kernel_source/arch/arm64/boot/dts/vendor/qcom/ \;

          cd kernel_source

          # 3. Injectare DISPLAY (Samsung legacy paths)
          echo "Injecting Samsung Display Drivers..."
          rm -rf drivers/gpu/drm/msm
          cp -r ../samsung_source/drivers/gpu/drm/msm drivers/gpu/drm/

          # 4. Injectare TOUCHSCREEN
          echo "Injecting Samsung Touch Drivers..."
          rm -rf drivers/input/touchscreen
          cp -r ../samsung_source/drivers/input/touchscreen drivers/input/

          # 5. FIX TECHPACK (Folosim Audio-ul NATIV din 4.19)
          # Ne asiguram doar ca techpack-ul audio e legat in Makefile-ul principal
          if ! grep -q "techpack" Makefile; then
            sed -i 's/^core-y[[:space:]]*:=/core-y := techpack\/ /' Makefile
          fi

          # 6. COMPATIBILITY FIXES (Samsung Drivers on 4.19 Base)
          # Eliminam referintele la structuri care s-au schimbat intre 4.9 si 4.19 in DRM
          find drivers/gpu/drm/msm/ -type f -name "*.h" -exec sed -i 's/struct drm_device \*ddev/struct drm_device *dev/g' {} +
          
          # Fix Samsung SecTools
          echo -e '#!/bin/bash\necho "0"' > /tmp/secgetspf
          chmod +x /tmp/secgetspf
          sudo mv /tmp/secgetspf /usr/bin/secgetspf

      - name: Build Kernel
        run: |
          export PATH="${{ env.PROTON_PATH }}:$PATH"
          cd kernel_source
          ARGS="ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1"
          
          # KCFLAGS permisive pentru a trece de micile diferente de sintaxa din driverele Samsung
          export KCFLAGS="-Wno-error -Wno-implicit-function-declaration -Wno-int-conversion -Wno-incompatible-pointer-types -Wno-unused-variable -Wno-unused-function -Wno-return-type"

          make $ARGS r5q_defconfig
          
          # Dezactivare LTO/BTF
          sed -i 's/CONFIG_LTO_CLANG=y/CONFIG_LTO_CLANG=n/g' .config
          sed -i 's/CONFIG_LTO=y/CONFIG_LTO=n/g' .config
          sed -i 's/CONFIG_DEBUG_INFO_BTF=y/CONFIG_DEBUG_INFO_BTF=n/g' .config
          
          make $ARGS olddefconfig
          make -j$(nproc --all) $ARGS

          if [ -f arch/arm64/boot/Image ]; then
            cp arch/arm64/boot/Image ../
            find arch/arm64/boot/dts/ -name "*.dtbo" -exec cp {} ../ \; || true
            echo "SUCCESS=true" >> $GITHUB_ENV
          fi

      - name: Upload
        if: env.SUCCESS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-4.19-Hybrid-Bootable
          path: |
            Image
            *.dtbo
