name: R5Q Android 15 BPF Builder - Final Fix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Base Source (R5Q)
        uses: actions/checkout@v4
        with:
          repository: sh4dow6oy/samsung_kernel_r5q
          ref: master
          fetch-depth: 0

      - name: Sync BPF & Fix Headers
        run: |
          git config --global user.name "sh4dow6oy"
          git config --global user.email "109531621+sh4dow6oy@users.noreply.github.com"
          
          # Adăugăm sursa BPF
          git remote add bpf_provider https://github.com/pascua28/android_kernel_samsung_sm7150.git
          git fetch bpf_provider bpf-5.10
          
          # 1. Resetăm mm.h (Evităm eroarea vm_sequence)
          git checkout HEAD -- include/linux/mm.h
          
          # 2. Aduce logica BPF necesară
          git checkout bpf_provider/bpf-5.10 -- kernel/bpf/
          git checkout bpf_provider/bpf-5.10 -- include/uapi/linux/bpf.h
          git checkout bpf_provider/bpf-5.10 -- include/linux/bpf_types.h
          git checkout bpf_provider/bpf-5.10 -- net/core/filter.c
          
          # 3. Injectăm macro-ul __bpf_md_ptr obligatoriu pentru Clang
          chmod +w include/uapi/linux/bpf.h
          printf '#ifndef __bpf_md_ptr\n#define __bpf_md_ptr(type, name) \\\n\tunion { \\\n\t\ttype name; \\\n\t\t__u64 name##_64; \\\n\t}\n#endif\n' | cat - include/uapi/linux/bpf.h > temp && mv temp include/uapi/linux/bpf.h
          
          git add .
          git commit -m "Apply eBPF support and fix environment" || echo "No changes"

      - name: Setup Environment (Python2 & Clang)
        run: |
          sudo apt-get update
          # Instalăm python-is-python3 și creăm manual link-ul către python2
          sudo apt-get install -y zstd bc build-essential gcc-aarch64-linux-gnu libssl-dev libelf-dev python3 python-is-python3
          sudo ln -sf /usr/bin/python3 /usr/bin/python2
          
          # Descărcare Neutron Toolchain
          mkdir clang-neutron
          wget https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang-neutron

      - name: Build Kernel
        run: |
          export PATH=$(pwd)/clang-neutron/bin:$PATH
          export ARCH=arm64
          export CC="clang --target=aarch64-linux-gnu"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          # 1. FIX: Creăm headerele de sistem Android care lipsesc (perflog.h)
          # Asta previne eroarea 'cp: cannot stat' care oprește build-ul Samsung
          mkdir -p system/core/liblog/include/log/
          mkdir -p system/logging/liblog/include/log/
          touch system/core/liblog/include/log/perflog.h
          touch system/logging/liblog/include/log/perflog.h

          # 2. Fix calea hardcoded Samsung
          mkdir -p toolchain/llvm-arm-toolchain-ship/10.0/bin
          ln -sf $(pwd)/clang-neutron/bin/clang toolchain/llvm-arm-toolchain-ship/10.0/bin/clang
          
          # 3. Generare config (Auto-detect r5q_eur_open_defconfig)
          REAL_DEFCONFIG=$(ls arch/arm64/configs/ | grep r5q | head -n 1)
          make O=out $REAL_DEFCONFIG
          
          # 4. Forțăm activarea BPF pentru Android 15
          ./scripts/config --file out/.config --enable BPF --enable BPF_SYSCALL --enable BPF_JIT --enable CGROUP_BPF
          ./scripts/config --file out/.config --disable SEC_DEBUG --disable CC_STACKPROTECTOR_STRONG --enable CC_STACKPROTECTOR_NONE
          
          # 5. Acceptăm automat noile opțiuni de kernel
          make O=out olddefconfig
          
          # 6. Compilare principală
          echo "--- START COMPILATION ---"
          make -j$(nproc --all) O=out LLVM=1 LLVM_IAS=1 KCFLAGS="-w -Wno-error"

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3
          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          elif [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz AnyKernel3/
          else
            cp out/arch/arm64/boot/Image AnyKernel3/
          fi
          cd AnyKernel3 && zip -r9 ../R5Q-A15-BPF-Kernel.zip * -x .git README.md

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: R5Q-Kernel-Result
          path: R5Q-A15-BPF-Kernel.zip
