name: Build Samsung S10 Lite (r5q) - Neutron Clang

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        repository: sh4dow6oy/android_kernel_samsung_a82xq
        ref: linux-4.14.285
        fetch-depth: 1

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential bison flex libssl-dev libelf-dev xz-utils wget git gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi zstd python3

    - name: Download and Setup Neutron Clang
      run: |
        mkdir -p neutron
        wget https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
        tar -I zstd -xf neutron-clang-10032024.tar.zst -C neutron
        echo "NEUTRON_PATH=$(pwd)/neutron/bin" >> $GITHUB_ENV

    - name: Fix Samsung Wrapper
      run: |
        # Folosim printf pentru a evita erorile de interpretare YAML/EOF
        printf "#!/usr/bin/env python3\nimport sys, subprocess\ndef run_gcc():\n    args = sys.argv[1:]\n    return subprocess.call(args)\nif __name__ == '__main__':\n    sys.exit(run_gcc())\n" > scripts/gcc-wrapper.py
        chmod +x scripts/gcc-wrapper.py
        # Verificăm dacă fișierul a fost creat corect
        cat scripts/gcc-wrapper.py

    - name: Build Kernel
      run: |
        export PATH=${{ env.NEUTRON_PATH }}:$PATH
        
        # Variabile de mediu
        export ARCH=arm64
        export SUBARCH=arm64
        export CC=clang
        export NM=llvm-nm
        export OBJCOPY=llvm-objcopy
        export LD=ld.lld
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        export CLANG_TRIPLE=aarch64-linux-gnu-

        # Curățare
        make clean
        make mrproper
        
        # Generare config
        make r5q_eur_open_defconfig
        
        # Compilare
        # Am adăugat explicit toate uneltele LLVM pentru Neutron
        make -j$(nproc --all) \
                      ARCH=arm64 \
                      CC=clang \
                      LD=ld.lld \
                      AR=llvm-ar \
                      NM=llvm-nm \
                      OBJCOPY=llvm-objcopy \
                      OBJDUMP=llvm-objdump \
                      STRIP=llvm-strip \
                      CLANG_TRIPLE=aarch64-linux-gnu- \
                      CROSS_COMPILE=aarch64-linux-gnu- \
                      CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
                      LLVM=1 \
                      LLVM_IAS=1 \
                      KCFLAGS="-w"

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-S10Lite-Neutron
        path: |
          arch/arm64/boot/Image.gz*
          arch/arm64/boot/dtbo.img
