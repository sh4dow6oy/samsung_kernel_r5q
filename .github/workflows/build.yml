name: S10 Lite (V33 - Legacy Security Fix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex git libssl-dev libelf-dev clang llvm lld zstd curl python3 device-tree-compiler gcc-aarch64-linux-gnu

      - name: Download Toolchain
        run: |
          mkdir -p clang
          wget https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang

      - name: Surgical Patching (V33)
        run: |
          # 1. FIX BPF Path
          sed -i 's|<uapi/linux/btf.h>|<linux/btf.h>|g' kernel/bpf/core.c || true
          sed -i 's|<uapi/linux/bpf.h>|<linux/bpf.h>|g' kernel/bpf/core.c || true
          
          # 2. FIX Samsung FIVE (set_fs/get_fs error)
          # Injectam un header care sa previna eroarea de declaratie implicita
          # sau pur si simplu dezactivam eroarea pentru aceste fisiere
          find security/samsung/five/ -name "*.c" -exec sed -i '1i #include <asm/uaccess.h>' {} +

          # 3. Curatenie Samsung & Permissions
          chmod -R 777 scripts/
          find . -type f -name "Makefile*" -exec sed -i 's/$(shell secgetspf)//g' {} +
          
          # 4. Mocking Headers
          mkdir -p system/core/liblog/include/log
          mkdir -p system/logging/liblog/include/log
          touch system/core/liblog/include/log/perflog.h
          touch system/logging/liblog/include/log/perflog.h

      - name: Build Kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          
          MAKE_ARGS="ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            O=out"

          make $MAKE_ARGS g770f_defconfig

          # Patch .config - Dezactivam FIVE daca continua sa dea erori de linkare (optional)
          ./scripts/config --file out/.config \
            -d CONFIG_CC_WERROR \
            -d CONFIG_CC_STACKPROTECTOR_STRONG \
            -e CONFIG_CC_STACKPROTECTOR_NONE \
            -d CONFIG_SAMSUNG_FIVE

          make $MAKE_ARGS olddefconfig

          # COMPILARE
          # Am adaugat -Wno-implicit-function-declaration special pentru set_fs
          make -j$(nproc --all) $MAKE_ARGS \
            KCFLAGS="--target=aarch64-linux-gnu \
                     -I$(pwd)/include/uapi \
                     -I$(pwd)/arch/arm64/include/uapi \
                     -fcommon \
                     -fno-stack-protector \
                     -Wno-error \
                     -Wno-strict-prototypes \
                     -Wno-deprecated-declarations \
                     -Wno-implicit-function-declaration \
                     -Wno-int-conversion" \
            2>&1 | tee build.log

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-V33-Result
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/dtbo.img
            build.log
