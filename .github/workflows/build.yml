name: Samsung SM8150 (r5q) Kernel Build - V12

on:
  workflow_dispatch:

jobs:
  build_kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: sh4dow6oy/android_kernel_samsung_sm8150-5.4
          path: kernel
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libncurses-dev git zstd python3 gzip

      - name: Download & Extract Neutron Clang
        run: |
          mkdir neutron
          wget https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C neutron/

      - name: Patch Source Code
        run: |
          cd kernel
          # Fix Section Mismatch
          sed -i 's/__init //g' drivers/samsung/debug/sec_debug_summary.c 2>/dev/null || true
          sed -i 's/__init //g' include/linux/sec_debug.h 2>/dev/null || true
          
          # FIX DTS ERROR: Comentăm referința la slim_aud care dă eroare
          # Această comandă caută blocul &slim_aud și îl dezactivează pentru a permite compilarea DTB-ului
          sed -i '/&slim_aud {/,/};/s/^/\/\//' arch/arm64/boot/dts/vendor/qcom/sm8150-audio.dtsi || true

      - name: Compile Kernel
        run: |
          cd kernel
          export PATH=$GITHUB_WORKSPACE/neutron/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          # 1. Config
          make O=out vendor/r5q_eur_open_defconfig
          
          # Fix Config Options
          sed -i 's/CONFIG_HARDENED_USERCOPY=y/CONFIG_HARDENED_USERCOPY=n/g' out/.config
          sed -i 's/# CONFIG_SECTION_MISMATCH_WARN_ONLY is not set/CONFIG_SECTION_MISMATCH_WARN_ONLY=y/g' out/.config
          echo "CONFIG_SECTION_MISMATCH_WARN_ONLY=y" >> out/.config
          make O=out ARCH=arm64 olddefconfig

          # 2. Build Image (fără dtbs momentan pentru a vedea dacă Image se face)
          make -j$(nproc --all) O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 \
                      KCFLAGS="-Wno-error -w -fcommon -Wno-cast-function-type -Wno-implicit-function-declaration -Wno-pointer-arith" \
                      HOSTCFLAGS="-Wno-error -fcommon" \
                      Image
          
          # 3. Build DTBs (separat, ca să nu oprească tot build-ul dacă unul singur crapă)
          make -j$(nproc --all) O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 \
                      dtbs || echo "Unele DTB-uri au eșuat, verificăm ce s-a generat..."

      - name: Prepare Image.gz and Concatenate
        run: |
          cd kernel/out/arch/arm64/boot/
          if [ -f Image ]; then
            gzip -c Image > Image.gz
          fi
          
          # Căutăm orice DTB care a reușit să se compileze
          DTBS=$(find dts/ -name "*.dtb" 2>/dev/null)
          
          if [ -f Image.gz ] && [ ! -z "$DTBS" ]; then
            cat Image.gz $DTBS > Image.gz-dtb
            echo "Succes partial/total la concatenare."
          else
            echo "Eroare critică: Image sau DTB lipsă."
            ls -R .
            exit 1
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-r5q-V12
          path: |
            kernel/out/arch/arm64/boot/Image.gz-dtb
            kernel/out/arch/arm64/boot/dts/vendor/qcom/*.dtbo
            kernel/out/.config
