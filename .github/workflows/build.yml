name: S10 Lite - Base Swap LOS23 v40

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Samsung Source
        uses: actions/checkout@v4
        with:
          path: samsung-src

      - name: Setup Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves make python3 lz4 perl
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang

      - name: Prepare LineageOS 23 Base
        run: |
          git clone --depth=1 -b lineage-23.0 https://github.com/LineageOS/android_kernel_google_msm-4.14.git kernel-res

      - name: Inject Samsung Components
        run: |
          cp -r samsung-src/drivers/soc/samsung kernel-res/drivers/soc/ || true
          cp -r samsung-src/drivers/camera kernel-res/drivers/ || true
          cp -r samsung-src/drivers/fingerprint kernel-res/drivers/ || true
          cp -r samsung-src/drivers/sensors kernel-res/drivers/ || true
          cp -r samsung-src/arch/arm64/boot/dts/samsung kernel-res/arch/arm64/boot/dts/ || true
          cp samsung-src/arch/arm64/configs/r5q_eur_open_defconfig kernel-res/arch/arm64/configs/

      - name: Apply Pascua "Sixteen" Fixes
        run: |
          cd kernel-res
          
          # Fix IPA v3 missing headers (Metoda Pascua)
          find drivers/platform/msm/ipa/ -name "Makefile" -exec sed -i 's/ccflags-y +=/ccflags-y += -I$(src) -I$(src)\/.. -I$(src)\/..\/.. /g' {} +
          
          # Fix Sensors SSC (Dezactivare totală pentru a trece de eroare)
          sed -i 's/obj-$(CONFIG_SENSORS_SSC).*/obj-y -= sensors_ssc.o/g' drivers/sensors/Makefile
          
          # Fix SMB1390 Cast (uintptr_t)
          sed -i 's/(int)of_device_get_match_data/(uintptr_t)of_device_get_match_data/g' drivers/power/supply/qcom/smb1390-charger-psy.c

          # Fix DTS (Eliminare noduri orfane)
          find arch/arm64/boot/dts/qcom/ -type f -name "*.dtsi" -exec sed -i '/shared_meta/d' {} +
          find arch/arm64/boot/dts/qcom/ -type f -name "*.dtsi" -exec sed -i '/hyp_meta/d' {} +
          
          # Fix GPIO (Comentare dump Samsung)
          sed -i '/if (chip->gpio_dump)/,/}/ s/^/\/\//' drivers/gpio/gpiolib.c
          
          # Align MMC/SDHCI (Back to standard 4.14)
          sed -i 's/void sdhci_cmd_irq(struct sdhci_host \*host, u32 intmask, u32 \*intmask_p)/void sdhci_cmd_irq(struct sdhci_host \*host, u32 intmask)/g' drivers/mmc/host/sdhci.c
          sed -i 's/sdhci_cmd_irq(host, intmask & SDHCI_INT_CMD_MASK, \&intmask);/sdhci_cmd_irq(host, intmask \& SDHCI_INT_CMD_MASK);/g' drivers/mmc/host/sdhci.c

      - name: Build Kernel
        run: |
          cd kernel-res
          export PATH=$(pwd)/../toolchain/proton-clang/bin:$PATH
          MAKE_ARGS="ARCH=arm64 CC=clang HOSTCC=gcc CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1"
          
          export KCFLAGS="-Wno-error -Wno-implicit-function-declaration -Wno-void-pointer-to-int-cast -Wno-return-type -Wno-unused-variable -Wno-macro-redefined -Wno-frame-larger-than=2048"

          make $MAKE_ARGS r5q_eur_open_defconfig
          
          # Dezactivări critice pentru boot pe Android 15
          ./scripts/config --disable CONFIG_SENSORS_SSC
          ./scripts/config --disable CONFIG_RKP_KDP
          ./scripts/config --disable CONFIG_DEFEX
          ./scripts/config --disable CONFIG_SCHED_WALT
          
          make $MAKE_ARGS olddefconfig
          make -j$(nproc --all) $MAKE_ARGS Image.gz-dtb
