name: S10 Lite Kernel - Clean Build - Upstream CIP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true # Asigură un mediu de lucru curat la fiecare rulare

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev dwarves \
            libncurses-dev git wget unzip make python2 \
            python3 python3-minimal lz4 xz-utils gcc g++ pahole

      - name: Cache Proton Clang
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: toolchain/proton-clang
          key: ${{ runner.os }}-proton-clang-v1

      - name: Download Proton Clang (if not cached)
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p toolchain
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang

      - name: Upstream Integration (Linux-CIP 4.14.y)
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git remote add upstream https://git.kernel.org/pub/scm/linux/kernel/git/cip/linux-cip.git
          git fetch upstream linux-4.14.y --depth=100

          # Merge-ul aduce baza la 4.14.336+ (CIP)
          git merge upstream/linux-4.14.y -m "Merge Linux-CIP Upstream" || echo "Conflicts ignored"
          
          # Checkout forțat pentru eBPF și Binder (esențial pentru Android 15)
          git checkout upstream/linux-4.14.y -- kernel/bpf/ drivers/android/ include/linux/bpf.h include/uapi/linux/bpf.h include/uapi/linux/btf.h include/linux/btf.h arch/arm64/net/

      - name: Pre-build Fixes
        run: |
          # Fix pentru tipuri de date și headere Samsung lipsă
          grep -q "__poll_t" include/uapi/linux/types.h || echo "typedef unsigned int __poll_t;" >> include/uapi/linux/types.h
          mkdir -p system/core/liblog/include/log system/logging/liblog/include/log
          touch system/core/liblog/include/log/perflog.h system/logging/liblog/include/log/perflog.h
          
          # Corecție referințe headere
          find kernel/bpf/ -name "*.c" | xargs sed -i 's|<uapi/linux/btf.h>|<linux/btf.h>|g' || true
          
          # Setări mediu
          [ -f scripts/gcc-wrapper.py ] && mv scripts/gcc-wrapper.py scripts/gcc-wrapper.py.disabled || true
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Build Kernel
        run: |
          export PATH=$(pwd)/toolchain/proton-clang/bin:$PATH
          
          # Definim argumentele. Observă lipsa oricărui cache pentru folderul 'out'
          MAKE_ARGS="
            O=out \
            ARCH=arm64 \
            CC=clang \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1 \
            KCFLAGS=-Wno-error \
            TECHPACK=true
          "

          # Ștergem folderul out dacă există (pentru Clean Build garantat)
          rm -rf out && mkdir -p out
          
          make $MAKE_ARGS r5q_eur_open_defconfig
          
          # Config Android 15
          ./scripts/config --file out/.config --enable CONFIG_BPF_SYSCALL
          ./scripts/config --file out/.config --enable CONFIG_BPF_JIT
          ./scripts/config --file out/.config --enable CONFIG_HAVE_EBPF_JIT
          ./scripts/config --file out/.config --enable CONFIG_ANDROID_BINDERFS
          ./scripts/config --file out/.config --enable CONFIG_ANDROID_BINDER_IPC
          ./scripts/config --file out/.config --disable CONFIG_DEBUG_INFO_BTF
          
          make $MAKE_ARGS olddefconfig
          make -j$(nproc --all) $MAKE_ARGS

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-S10Lite-Clean-Build
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dtbo.img
            out/arch/arm64/boot/dts/vendor/qcom/*.dtb
