name: Build Samsung SM8150 Kernel (Auriana)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        repository: LumiPlayground/android_kernel_samsung_sm8150
        ref: auriana
        path: kernel

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm libncurses-dev

    - name: Download Me2 Toolchain
      run: |
        git clone https://github.com/mk7x7/Me2.git toolchain
        # Setăm calea către binarele toolchain-ului
        echo "TOOLCHAIN_PATH=$(pwd)/toolchain/toolchain/bin" >> $GITHUB_ENV

    - name: Build Kernel
      run: |
        cd kernel
        
        # Definire variabile de mediu
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=${{ env.TOOLCHAIN_PATH }}/aarch64-linux-android-
        
        # Definire KERNEL_MAKE_ENV conform cerinței tale
        # DTC_EXT indică script-ului de build să folosească binarul dtc din sursa kernelului
        export KERNEL_MAKE_ENV="DTC_EXT=$(pwd)/scripts/dtc/dtc CONFIG_BUILD_ARM64_DT_OVERLAY=y"
        
        # 1. Configurare (Merge Defconfigs)
        make O=out sm8150_sec_defconfig
        scripts/kconfig/merge_config.sh -O out out/.config arch/arm64/configs/sm8150_sec_r5q_eur_open.config
        
        # Re-aplicăm variabilele pentru a genera .config-ul final
        make O=out $KERNEL_MAKE_ENV olddefconfig
        
        # 2. Compilare
        # Transmitem KERNEL_MAKE_ENV direct în comanda make
        make -j$(nproc --all) O=out $KERNEL_MAKE_ENV
       
        - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
        name: Kernel-SM8150-r5q
        path: |
          kernel/out/arch/arm64/boot/Image.gz-dtb
          kernel/out/arch/arm64/boot/dtbo.img
          kernel/out/.config
