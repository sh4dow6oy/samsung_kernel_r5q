name: S10 Lite - ZyC Clang v46

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout S10 Lite Source
        uses: actions/checkout@v4
        with:
          path: s10-lite-src

      - name: Setup ZyC Clang (The Pro Choice)
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves make python3 lz4 perl git
          # ZyC este mult mai apropiat de mediul lui Pascua decât Proton
          git clone --depth=1 https://gitlab.com/ZyC_Clang/Clang.git toolchain/zyc-clang

      - name: Prepare Pascua Sixteen Base
        run: |
          git clone --depth=1 -b sixteen https://github.com/pascua28/android_kernel_samsung_sm7150.git kernel-res

      - name: Inject S10 Lite Components
        run: |
          # Injectăm doar ce e strict necesar pentru S10 Lite
          cp -r s10-lite-src/drivers/soc/samsung kernel-res/drivers/soc/ || true
          cp -r s10-lite-src/drivers/camera kernel-res/drivers/ || true
          cp -r s10-lite-src/drivers/fingerprint kernel-res/drivers/ || true
          cp -r s10-lite-src/drivers/sensors kernel-res/drivers/ || true
          cp -r s10-lite-src/arch/arm64/boot/dts/samsung kernel-res/arch/arm64/boot/dts/ || true
          cp s10-lite-src/arch/arm64/configs/r5q_eur_open_defconfig kernel-res/arch/arm64/configs/

      - name: Stripping Incompatible Optimizations
        run: |
          cd kernel-res
          # Ștergem orice urmă de Polly sau Regalloc care ar putea bloca Clang-ul standard
          find . -type f -name "Makefile*" -exec sed -i 's/-mllvm -polly.*//g' {} +
          find . -type f -name "Makefile*" -exec sed -i 's/-mllvm -regalloc.*//g' {} +
          
          # Fix Stack Protector (Override Makefile error)
          sed -i 's/$(error "Cannot use CONFIG_CC_STACKPROTECTOR_STRONG.*/$(warning "Bypassing Stack Protector")/g' Makefile
          
          # Fix SMB1390 Pointer Cast
          sed -i 's/(int)of_device_get_match_data/(uintptr_t)of_device_get_match_data/g' drivers/power/supply/qcom/smb1390-charger-psy.c || true

      - name: Build Kernel
        run: |
          cd kernel-res
          export PATH=$(pwd)/../toolchain/zyc-clang/bin:$PATH
          
          # Variabilele de mediu pentru ZyC Clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          MAKE_ARGS="ARCH=arm64 CC=clang HOSTCC=gcc LLVM=1 LLVM_IAS=1"
          
          # Adăugăm -Wno-unknown-warning-option pentru a ignora flag-urile pe care ZyC nu le are, dar Pascua le-a lăsat în cod
          export KCFLAGS="-Wno-error -Wno-implicit-function-declaration -Wno-void-pointer-to-int-cast -Wno-return-type -Wno-unused-variable -Wno-macro-redefined -Wno-frame-larger-than= -Wno-unknown-warning-option"

          make $MAKE_ARGS r5q_eur_open_defconfig
          
          # Forțăm configurația de securitate compatibilă
          ./scripts/config --disable CONFIG_CC_STACKPROTECTOR_STRONG
          ./scripts/config --enable CONFIG_CC_STACKPROTECTOR_NONE
          ./scripts/config --disable CONFIG_RKP_KDP
          ./scripts/config --disable CONFIG_DEFEX
          
          make $MAKE_ARGS olddefconfig
          make -j$(nproc --all) $MAKE_ARGS Image.gz-dtb

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: kernel-S10Lite-ZyC-v46
          path: kernel-res/arch/arm64/boot/Image.gz-dtb
