name: Build Roynas R5Q - A15 BPF Merge
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: Roynas-Android-Playground/kernel_samsung_r3q
          ref: master
          fetch-depth: 0 # Esențial pentru merge/cherry-pick

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev \
          ccache python3 python-is-python3 libarchive-tools wget zstd libtinfo6 zip git

      - name: Integrate A15 BPF Support
        run: |
          git config --global user.email "bot@example.com"
          git config --global user.name "Kernel Bot"
          
          # Adăugăm LineageOS ca sursă de patches
          git remote add lineage https://github.com/LineageOS/android_kernel_google_msm-4.14.git
          git fetch lineage lineage-23.0
          
          # Încercăm să aducem doar folderele critice pentru BPF pentru a evita conflicte masive în driverele Samsung
          # Aceasta este o metodă mai sigură decât un merge complet
          git checkout lineage/lineage-23.0 -- kernel/bpf/ net/core/filter.c include/linux/filter.h include/uapi/linux/bpf.h
          
          # Commit-uim schimbările aduse din Lineage
          git add .
          git commit -m "Add Android 15 eBPF support from LineageOS 23.0" || echo "No changes to commit"

      - name: Setup Neutron Clang
        run: |
          mkdir clang
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang

      - name: Build Kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          
          # Cleanup specific Samsung
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-mllvm -polly[^ ]*//g' {} +
          if [ -f arch/arm64/kernel/vdso/Makefile ]; then
            sed -i 's/$(LDFLAGS)/$(filter-out -static,$(LDFLAGS))/g' arch/arm64/kernel/vdso/Makefile
          fi

          MAKE_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- O=out"

          make $MAKE_ARGS r5q_defconfig
          
          # FORȚĂM ACTIVAREA EBPF PENTRU ANDROID 15
          ./scripts/config --file out/.config \
            -e CONFIG_BPF \
            -e CONFIG_BPF_SYSCALL \
            -e CONFIG_BPF_JIT \
            -e CONFIG_BPF_JIT_ALWAYS_ON \
            -e CONFIG_NETFILTER_XT_MATCH_BPF \
            -e CONFIG_NET_CLS_BPF \
            -e CONFIG_NET_ACT_BPF \
            -e CONFIG_CGROUP_BPF \
            -d CONFIG_LTO_CLANG -e CONFIG_LTO_NONE

          make $MAKE_ARGS olddefconfig
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-fcommon -Wno-error"

      - name: Package AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          cp out/arch/arm64/boot/Image.gz AnyKernel3/
          [ -f out/arch/arm64/boot/dtbo.img ] && cp out/arch/arm64/boot/dtbo.img AnyKernel3/
          
          # Update AnyKernel script for r5q
          sed -i 's/device.name1=maguro/device.name1=r5q/g' AnyKernel3/anykernel.sh
          
          cd AnyKernel3 && zip -r9 ../Kernel-R5Q-A15-BPF-Final.zip *

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-A15-Ready
          path: Kernel-R5Q-A15-BPF-Final.zip
