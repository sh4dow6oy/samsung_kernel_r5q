name: Build Samsung S10 Lite Kernel (4.14)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev dwarves \
            libncurses-dev git wget unzip make python3 \
            python2 python3-minimal lz4 xz-utils gcc g++

      - name: Download Proton Clang
        run: |
          mkdir -p toolchain
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang

      - name: Pre-build Fixes (4.14 Specific)
        run: |
          # 1. Fix pentru btf.h și erori de include
          find . -name "*.c" -type f | xargs sed -i 's|<uapi/linux/btf.h>|<linux/btf.h>|g' || true
          
          # 2. Creare foldere dummy pentru log-uri Samsung (esențial pe S10 Lite)
          mkdir -p system/core/liblog/include/log
          touch system/core/liblog/include/log/perflog.h
          
          # 3. Rezolvare problemă script python2/3 (4.14 folosește des python2)
          sudo ln -sf /usr/bin/python3 /usr/bin/python

      - name: Build Kernel
        run: |
          export PATH=$(pwd)/toolchain/proton-clang/bin:$PATH
          
          # Argumente Build pentru Snapdragon 855 (SM8150)
          MAKE_ARGS="
            O=out \
            ARCH=arm64 \
            CC=clang \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1 \
            KCFLAGS=-Wno-error
          "

          # 1. Configurația pentru S10 Lite (verifică numele exact în arch/arm64/configs)
          # Probabil este r5q_eur_open_defconfig sau sm8150_defconfig
          make $MAKE_ARGS r5q_eur_open_defconfig

          # 2. Forțare module BPF pentru compatibilitate Android 15
          ./scripts/config --file out/.config --enable CONFIG_BPF
          ./scripts/config --file out/.config --enable CONFIG_BPF_SYSCALL
          ./scripts/config --file out/.config --enable CONFIG_NET_CLS_BPF
          ./scripts/config --file out/.config --enable CONFIG_NET_ACT_BPF
          ./scripts/config --file out/.config --enable CONFIG_BPF_JIT
          ./scripts/config --file out/.config --enable CONFIG_HAVE_EBPF_JIT
          
          # 3. Compilare
          make -j$(nproc --all) $MAKE_ARGS

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-S10Lite-4.14
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dtbo.img
