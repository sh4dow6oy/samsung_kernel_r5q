name: Build r5q Kernel - Neutron Final
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Instalare Dependințe
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential flex git-core libssl-dev libelf-dev clang lld llvm wget zstd zip lz4

      - name: 2. Clone Kernel r5q
        run: |
          git clone --depth=1 https://github.com/mainey/android_kernel_samsung_r5q.git -b lineage-19.0 kernel
          cd kernel
          git config user.email "bot@github.com"
          git config user.name "KernelBot"

      - name: 3. Setup Neutron Clang
        run: |
          mkdir clang
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang

      - name: 4. Patch Makefile (Fix 'not found' errors)
        run: |
          cd kernel
          # Eliminăm verificările de compilator care blochează build-ul pe GitHub
          sed -i 's/ifneq ($(call cc-option,-fstack-protector-strong),)/ifdef CONFIG_CC_STACKPROTECTOR_STRONG/g' Makefile
          # Forțăm Makefile-ul să nu mai caute toolchain-ul Samsung în foldere externe
          sed -i 's/CROSS_COMPILE_ARM32 := .*/CROSS_COMPILE_ARM32 := arm-linux-gnueabi-/g' Makefile
          sed -i 's/CROSS_COMPILE := .*/CROSS_COMPILE := aarch64-linux-gnu-/g' Makefile

      - name: 5. Compilare Kernel
        run: |
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          
          # Definim variabilele pentru a forța Neutron
          export KBUILD_COMPILER_STRING="$(clang --version | head -n 1)"
          export CLANG_TRIPLE=aarch64-linux-gnu-
          
          mkdir -p out
          
          # Generăm .config (Adăugăm CC=clang și aici)
          make O=out r5q_eur_open_defconfig CC=clang
          
          # Build-ul final cu toate uneltele LLVM activate
          make -j$(nproc --all) O=out \
               CC=clang \
               LD=ld.lld \
               AR=llvm-ar \
               NM=llvm-nm \
               OBJCOPY=llvm-objcopy \
               OBJDUMP=llvm-objdump \
               STRIP=llvm-strip \
               OBJSIZE=llvm-size \
               READELF=llvm-readelf \
               HOSTCC=clang \
               HOSTCXX=clang++ \
               HOSTAR=llvm-ar \
               CROSS_COMPILE=aarch64-linux-gnu- \
               CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
               LLVM=1 \
               LLVM_IAS=1 \
               CONFIG_CC_STACKPROTECTOR_STRONG=y

      - name: 6. Împachetare AnyKernel3
        run: |
          if [ -f kernel/out/arch/arm64/boot/Image.gz-dtb ]; then
            git clone https://github.com/osm0sis/AnyKernel3.git
            cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
            cd AnyKernel3
            sed -i 's/device.name1=maguro/device.name1=r5q/' anykernel.sh
            sed -i 's/device.name2=toro/device.name2=SM-G770F/' anykernel.sh
            zip -r ../r5q-Neutron-Kernel.zip *
          else
            echo "EROARE: Compilarea a eșuat. Verifică log-ul de mai sus."
            exit 1
          fi

      - name: 7. Upload
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-Neutron-Build
          path: r5q-Neutron-Kernel.zip
