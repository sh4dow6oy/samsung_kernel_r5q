name: Build S10 Lite Kernel (Proton Clang)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: sh4dow6oy/samsung_kernel_r5q
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev \
          ccache python3 python-is-python3 libarchive-tools libncurses-dev wget \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Download Proton Clang
        run: |
          git clone https://github.com/kdrag0n/proton-clang.git --depth=1 proton-clang

      - name: Build Kernel
        run: |
          # Definim calea către toolchain
          PROTON_PATH=$GITHUB_WORKSPACE/proton-clang/bin
          
          # Parametrii de build - Observă HOSTLDFLAGS pentru a evita eroarea de libc
          MAKE_ARGS="ARCH=arm64 \
            CC=$PROTON_PATH/clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            AR=$PROTON_PATH/llvm-ar \
            NM=$PROTON_PATH/llvm-nm \
            OBJCOPY=$PROTON_PATH/llvm-objcopy \
            OBJDUMP=$PROTON_PATH/llvm-objdump \
            STRIP=$PROTON_PATH/llvm-strip \
            LD=$PROTON_PATH/ld.lld \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            HOSTLDFLAGS=-fuse-ld=bfd \
            O=out"

          # 1. Generăm config-ul de bază (r5q_eur_open_defconfig)
          make $MAKE_ARGS r5q_eur_open_defconfig
          
          # 2. Patching Defconfig: Dezactivăm Knox și activăm eBPF pentru Android 15
          # Folosim scripts/config pentru a manipula .config-ul generat anterior
          ./scripts/config --file out/.config \
            -d CONFIG_KNOX_KAP \
            -d CONFIG_SECURITY_SAMSUNG_KNOX \
            -d CONFIG_RKP_KDP \
            -d CONFIG_SAMSUNG_PRODUCT_SHIP \
            -d CONFIG_KDP_NS_RESTRICTION \
            -e CONFIG_BPF \
            -e CONFIG_BPF_SYSCALL \
            -e CONFIG_BPF_JIT \
            -e CONFIG_CGROUP_BPF \
            -e CONFIG_NET_CLS_BPF \
            -e CONFIG_NET_ACT_BPF \
            -e CONFIG_DEBUG_INFO_BTF

          # 3. Rezolvăm întrebările noi din config (BPF_JIT_ALWAYS_ON etc.)
          # Această comandă setează automat noile opțiuni la valorile lor default
          make $MAKE_ARGS olddefconfig

          # 4. Compilarea propriu-zisă
          # KCFLAGS="-Wno-error" previne oprirea build-ului la avertismentele Proton Clang
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-Wno-error -fcommon"

      - name: Upload Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-A15-Kernel
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/dtbo.img
