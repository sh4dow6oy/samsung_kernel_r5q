name: Build Samsung S10 Lite (r5q) Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        repository: sh4dow6oy/android_kernel_samsung_a82xq
        ref: linux-4.14.285
        fetch-depth: 1

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential bison flex libssl-dev libelf-dev xz-utils wget git gcc-aarch64-linux-gnu zstd python3

    - name: Download and Setup NDK Clang
      run: |
        mkdir clang
        wget https://github.com/Ylarod/setup-ndk-clang/releases/download/prebuilt/clang-linux-x86-ndk-r29-r563880c.tar.zst
        tar -I zstd -xf clang-linux-x86-ndk-r29-r563880c.tar.zst -C clang
        # Setăm calea către binare pentru pașii următori
        echo "CLANG_PATH=$(pwd)/clang/bin" >> $GITHUB_ENV

    - name: Fix Samsung Python Wrapper
      run: |
        # Stergem wrapper-ul original care cauta cai inexistente si folosim unul simplu de Python 3
        cat <<EOF > scripts/gcc-wrapper.py
#!/usr/bin/env python3
import sys, subprocess
def run_gcc():
    args = sys.argv[1:]
    return subprocess.call(args)
if __name__ == "__main__":
    sys.exit(run_gcc())
EOF
        chmod +x scripts/gcc-wrapper.py

    - name: Build Kernel
      run: |
        # Adaugam Clang in PATH
        export PATH=${{ env.CLANG_PATH }}:$PATH
        
        # Variabile de mediu pentru cross-compilation
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        export CC=clang
        export REAL_CC=clang
        export HOSTCC=gcc
        export HOSTCXX=g++

        # Curatare surse
        make clean
        make mrproper
        
        # Generare fisier .config din defconfig-ul tau
        make r5q_eur_open_defconfig
        
        # Compilare efectiva
        # LLVM=1 foloseste uneltele LLVM (ar, ld, objcopy) din folderul Clang
        # KCFLAGS="-w" ignora warning-urile care pot opri build-ul pe compilatoare noi
        make -j$(nproc --all) \
                      ARCH=arm64 \
                      CC=clang \
                      REAL_CC=clang \
                      CLANG_TRIPLE=aarch64-linux-gnu- \
                      CROSS_COMPILE=aarch64-linux-gnu- \
                      CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
                      LLVM=1 \
                      LLVM_IAS=1 \
                      KCFLAGS="-w"

    - name: Check Output
      run: |
        echo "Verificare rezultate in arch/arm64/boot/:"
        ls -l arch/arm64/boot/
        if [ -f arch/arm64/boot/Image.gz-dtb ]; then
            echo "Kernel compiled successfully!"
        elif [ -f arch/arm64/boot/Image.gz ]; then
            echo "Kernel compiled (Image.gz found)!"
        else
            echo "Build FAILED!"
            exit 1
        fi

    - name: Upload Kernel Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-S10Lite-r5q-ClangR29
        path: |
          arch/arm64/boot/Image.gz*
          arch/arm64/boot/dtbo.img
          arch/arm64/boot/dts/samsung/r5q*.dtb
