name: Build Samsung SM8150 (Auriana)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Cleanup and Install Dependencies
        run: |
          sudo apt-get update
          sudo add-apt-repository universe -y
          sudo apt-get update
          sudo apt-get install -y python2-minimal bc build-essential flex bison ncurses-dev libssl-dev libelf-dev xz-utils libfl-dev git-core ccache zip zstd binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi
          # Setăm Python 2 ca binar 'python' pentru scripturile Samsung (RKP)
          sudo ln -sf /usr/bin/python2 /usr/bin/python
      - name: Clone Kernel Source
        run: git clone --depth=1 -b auriana https://github.com/sh4dow6oy/android_kernel_samsung_sm8150.git s

      - name: Download Proton Clang
        run: git clone --depth=1 https://github.com/kdrag0n/proton-clang.git llvm-proton

      - name: Build Kernel
        run: |
          export ARCH=arm64
          TOOLCHAIN_PATH="${{ github.workspace }}/llvm-proton/bin"
          export PATH="$TOOLCHAIN_PATH:$PATH"
          
          # Fix compatibilitate unelte
          ln -sf $TOOLCHAIN_PATH/llvm-objdump $TOOLCHAIN_PATH/aarch64-linux-gnu-objdump
          ln -sf $TOOLCHAIN_PATH/llvm-readelf $TOOLCHAIN_PATH/aarch64-linux-gnu-readelf
          ln -sf $TOOLCHAIN_PATH/llvm-nm $TOOLCHAIN_PATH/aarch64-linux-gnu-nm
          
          cd s
          chmod +x tools/mkdtimg
          # Dezactivăm DEFEX pentru că e buguit în sursele OpenELA, dar lăsăm RKP
          sed -i 's/CONFIG_SECURITY_DEFEX=y/CONFIG_SECURITY_DEFEX=n/g' arch/arm64/configs/r5q_defconfig || true
          # 1. FIX: Eliminăm referințele la funcțiile de securitate Samsung care lipsesc (RKP/KDP)
          # Această comandă dezactivează apelurile către rkp_cred_enable, rkp_free_security etc.
          sed -i 's/CONFIG_RKP_KDP=y/CONFIG_RKP_KDP=n/g' arch/arm64/configs/r5q_eur_open_defconfig || true
          sed -i 's/CONFIG_RKP_NS_PROT=y/CONFIG_RKP_NS_PROT=n/g' arch/arm64/configs/r5q_eur_open_defconfig || true
          sed -i 's/select RKP_KDP//g' arch/arm64/Kconfig || true
          sed -i 's/.*ois_gain_rear3_result.*/\/\/ &/' drivers/media/platform/msm/camera/cam_sensor_module/cam_eeprom/cam_eeprom_core.c || true
          sed -i 's/.*ois_sr_rear3_result.*/\/\/ &/' drivers/media/platform/msm/camera/cam_sensor_module/cam_eeprom/cam_eeprom_core.c || true
          sed -i 's/ptep = huge_pmd_share/pte = huge_pmd_share/g' arch/arm64/mm/hugetlbpage.c || true
          # --- COMPILARE ---
          MAKE_ARGS="ARCH=arm64 \
            O=out \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            READELF=aarch64-linux-gnu-readelf \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=0 \
            PYTHON=python"
          # 3. Config & Build
          make $MAKE_ARGS r5q_defconfig
          
            ./scripts/config --file out/.config \
            -d CONFIG_RKP_KDP \
            -d CONFIG_RKP_NS_PROT \
            -d CONFIG_RKP_CFP \
            -d CONFIG_RKP_CFP_JOPP \
            -d CONFIG_LTO_CLANG \
            -d CONFIG_THINLTO \
            -e CONFIG_LTO_NONE \
            -d CONFIG_SECURITY_DEFEX \
            -d CONFIG_SAMSUNG_PRODUCT_SHIP
          
          make $MAKE_ARGS olddefconfig
          
          # Generăm Image.gz și DTBO-urile (.dtbo)
          make -j$(nproc --all) $MAKE_ARGS LDFLAGS="-z notext" KCFLAGS="-fcommon -fno-pic -Wno-error" Image.gz dtbs
      - name: Create Flashable Package
        run: |
          # 1. Generare DTBO.img folosind binarul tău din 'tools'
          # CRITIC: --version=2 rezolvă eroarea "Dtbo_Version = 0"
          MKDTIMG="${{ github.workspace }}/s/tools/mkdtimg"
          chmod +x $MKDTIMG
          DTBO_FILES=$(find s/out/arch/arm64/boot/dts/ -name "*.dtbo")
          $MKDTIMG create dtbo.img --version=2 --page_size=4096 --id=0x10000000 $DTBO_FILES
          
          # 2. Setup AnyKernel3
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel
          cp s/out/arch/arm64/boot/Image.gz AnyKernel/Image.gz
          cp dtbo.img AnyKernel/dtbo.img
          
          # 3. Configurare AnyKernel3 pentru Samsung S10 Lite / A82 (Header V2)
          cd AnyKernel
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          sed -i 's/header_version=0/header_version=2/g' anykernel.sh
          
          # Injectăm logica de flash DTBO în scriptul de instalare
          sed -i '/write_boot;/a \
          \
          ## dtbo install\
          if [ -f $home/dtbo.img ]; then\
            ui_print " "; ui_print "Flashing DTBO...";\
            flash_dtbo;\
          fi;' anykernel.sh
          
          zip -r9 ../Kernel-Auriana-Final.zip *
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Auriana-SM8150
          path: Kernel-Auriana-Final.zip
