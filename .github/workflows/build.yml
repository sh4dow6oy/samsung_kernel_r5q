name: S10 Lite (V27 - The Ultimate Build Fix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex git libssl-dev libelf-dev clang llvm lld zstd curl python3 device-tree-compiler gcc-aarch64-linux-gnu

      - name: Download Neutron Clang
        run: |
          mkdir -p clang
          wget https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang

      - name: Nuclear Fix for Source
        run: |
          # 1. Permisiuni totale pe scripturi
          chmod -R 777 scripts/
          
          # 2. Eliminare completa secgetspf (cauza multor erori de tip "No such file")
          grep -rl "secgetspf" . | xargs sed -i 's/$(shell secgetspf)//g' 2>/dev/null || true
          
          # 3. Fix DTC Lexer
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' scripts/dtc/dtc-lexer.lex.c_shipped || true
          
          # 4. Creare Mock Headers pentru a opri erorile de "perflog.h"
          # Cream structura de directoare exact unde o cauta Samsung
          mkdir -p system/core/liblog/include/log
          mkdir -p system/logging/liblog/include/log
          echo "" > system/core/liblog/include/log/perflog.h
          echo "" > system/logging/liblog/include/log/perflog.h
          
          # 5. Dezactivare Samsung gcc-wrapper
          sed -i 's/exec /#exec /g' scripts/gcc-wrapper.py || true
          echo 'exec "$@"' >> scripts/gcc-wrapper.py
          chmod +x scripts/gcc-wrapper.py

      - name: Build Kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          
          # Setam variabilele de mediu pentru a forta LLVM peste tot
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          
          MAKE_ARGS="ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            O=out"

          # Configurare
          make $MAKE_ARGS g770f_defconfig

          # Patch config pentru Clang
          ./scripts/config --file out/.config \
            -d CONFIG_CC_STACKPROTECTOR_STRONG \
            -e CONFIG_CC_STACKPROTECTOR_NONE \
            -d CONFIG_CC_WERROR

          make $MAKE_ARGS olddefconfig

          # Build cu forțare asamblor integrat (fara /usr/bin/as)
          make -j$(nproc --all) $MAKE_ARGS \
            CC="clang" \
            HOSTCC="clang" \
            KCFLAGS="--target=aarch64-linux-gnu -Wno-error -Wno-implicit-function-declaration -fno-stack-protector" \
            2>&1 | tee build.log

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-V27-Result
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/dtbo.img
            build.log
