name: Build R5Q - LineageOS 23 Native Hybrid V5

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout LineageOS Kernel
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_google_msm-4.14
          ref: lineage-21
          path: kernel

      - name: Checkout Mainey R5Q
        uses: actions/checkout@v4
        with:
          repository: mainey/android_kernel_samsung_r5q
          ref: lineage-19.0
          path: samsung

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev \
          ccache python3 python-is-python3 libarchive-tools wget zstd libtinfo6 zip \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi device-tree-compiler rsync git

      - name: Setup Toolchain (Neutron Clang)
        run: |
          mkdir -p clang
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang

      - name: Injected Hardware & Source Patches
        run: |
          # 1. Injectăm Device Tree
          mkdir -p kernel/arch/arm64/boot/dts/samsung
          cp -r samsung/arch/arm64/boot/dts/samsung/* kernel/arch/arm64/boot/dts/samsung/
          echo 'obj-y += samsung/' > kernel/arch/arm64/boot/dts/Makefile
          
          # 2. Config EUR Open
          cp samsung/arch/arm64/configs/r5q_eur_open_defconfig kernel/arch/arm64/configs/r5q_eur_open_defconfig
          
          # 3. [FIX SDIO] Adaugam eticheta 'out:' doar unde e nevoie (linia ~1086)
          # Folosim numarul liniei pentru precizie maxima
          sed -i '1085i out:' kernel/drivers/mmc/core/sdio.c

          # 4. [FIX SDHCI] Restabilim semnatura functiei sdhci_cmd_irq pentru compatibilitate
          sed -i 's/sdhci_cmd_irq(struct sdhci_host \*host, u32 intmask)/sdhci_cmd_irq(struct sdhci_host \*host, u32 intmask, u32 \*intmask_p)/g' kernel/drivers/mmc/host/sdhci.c
          
          # 5. [FIX SDHCI DMA] Definim variabilele lipsa pentru log-urile de eroare
          sed -i '/unsigned long long)dma,/i \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ \ dma_addr_t dma = 0;' kernel/drivers/mmc/host/sdhci.c

          # 6. [FIX GPIO] Eliminăm referința la gpio_dump
          sed -i '/if (chip->gpio_dump) {/,/}/d' kernel/drivers/gpio/gpiolib.c
          
          # 7. [FIX DM-BOW] Redefinire SECTOR_SIZE
          sed -i 's/#define SECTOR_SIZE 512/#ifndef SECTOR_SIZE\n#define SECTOR_SIZE 512\n#endif/' kernel/drivers/md/dm-bow.c

          # 8. Kernel Spoofing la 5.4
          cd kernel
          sed -i 's/VERSION = 4/VERSION = 5/g' Makefile
          sed -i 's/PATCHLEVEL = 14/PATCHLEVEL = 4/g' Makefile

      - name: Build Kernel
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          MAKE_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- O=out"
          
          make $MAKE_ARGS r5q_eur_open_defconfig
          
          ./scripts/config --file out/.config \
            -d CONFIG_SCHED_WALT -d CONFIG_SCHED_CORE_CTL -d CONFIG_MSM_CORE_CTL \
            -e CONFIG_BPF -e CONFIG_BPF_SYSCALL -e CONFIG_BPF_JIT \
            -e CONFIG_PSI -e CONFIG_CGROUP_BPF -e CONFIG_NETFILTER_XT_MATCH_BPF \
            -d CONFIG_WERROR -e CONFIG_LTO_NONE -d CONFIG_LTO_CLANG
            
          make $MAKE_ARGS olddefconfig
          make -j$(nproc --all) $MAKE_ARGS Image.gz dtbs KCFLAGS="-Wno-error -fcommon -Wno-implicit-function-declaration -Wno-incompatible-pointer-types"

      - name: Assemble Final Package
        run: |
          cd kernel
          DTB_FILE=$(find out/arch/arm64/boot/dts/samsung -name "*r5q*eur*.dtb" | head -n 1)
          cat out/arch/arm64/boot/Image.gz "$DTB_FILE" > out/arch/arm64/boot/Image.gz-dtb
          git clone https://github.com/osm0sis/AnyKernel3.git
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/Image.gz
          sed -i 's/device.name1=maguro/device.name1=r5q/g' AnyKernel3/anykernel.sh
          cd AnyKernel3 && zip -r9 ../R5Q-A15-V5-FINAL.zip *

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-R5Q-V5-Final
          path: R5Q-A15-V5-FINAL.zip
