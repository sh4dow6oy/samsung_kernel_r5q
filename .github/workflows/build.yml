name: S10 Lite Kernel Build - v84

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout S10 Lite Source
        uses: actions/checkout@v4
        with:
          path: s10-lite-src

      - name: Setup Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves make python3 lz4 perl git
          git clone --depth=1 https://gitlab.com/clangsantoni/zyc_clang.git toolchain/zyc-clang

      - name: Prepare Base (LineageOS 4.14.356)
        run: |
          git clone --depth=1 -b lineage-23.0 https://github.com/LineageOS/android_kernel_google_msm-4.14.git kernel-res
          cd kernel-res
          git remote add stable https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux-stable.git
          git fetch stable linux-4.14.y
          git merge FETCH_HEAD --no-edit || echo "Merge handled"

      - name: Inject Samsung Drivers
        run: |
          cp -r s10-lite-src/drivers/soc/samsung kernel-res/drivers/soc/ || true
          cp -r s10-lite-src/drivers/camera kernel-res/drivers/ || true
          cp -r s10-lite-src/drivers/fingerprint kernel-res/drivers/ || true
          cp -r s10-lite-src/drivers/sensors kernel-res/drivers/ || true
          cp -r s10-lite-src/arch/arm64/boot/dts/samsung kernel-res/arch/arm64/boot/dts/ || true
          cp s10-lite-src/arch/arm64/configs/r5q_eur_open_defconfig kernel-res/arch/arm64/configs/

      - name: Surgical Fixes v84 (DebugFS & GPIO Bypass)
        run: |
          cd kernel-res
          
          # 1. SDIO Fix
          sed -i 's/out:$/out: ;/g' drivers/mmc/core/sdio.c
          sed -i '/^}$/i out: ;' drivers/mmc/core/sdio.c

          # 2. GPIO HARD FIX (v14 bypass strategy)
          # Injectam membrul lipsa in header pentru a evita eroarea 'no member named gpio_dump'
          sed -i '/struct gpio_chip {/a \	void *gpio_dump;' include/linux/gpio/driver.h
          
          # Neutralizam referintele la DebugFS care lipsesc din upstream
          # Schimbam pointerul lipsa list_gpios_fops cu NULL ca sa nu crape compilarea
          sed -i 's/\&list_gpios_fops/NULL/g' drivers/gpio/gpiolib.c
          # Comentam apelul catre functia de init care nu mai e definita corect
          sed -i 's/subsys_initcall(gpiolib_debugfs_init);/\/\/subsys_initcall(gpiolib_debugfs_init);/g' drivers/gpio/gpiolib.c

          # 3. WALT Scheduler (Scoatem din Makefile pentru a evita conflictele cu PELT)
          sed -i 's/obj-y += walt.o/# obj-y += walt.o/g' kernel/sched/Makefile
          
          # 4. DM-BOW & SDHCI
          sed -i '15i #undef SECTOR_SIZE' drivers/md/dm-bow.c
          sed -i 's/sdhci_cmd_irq(host, intmask & SDHCI_INT_CMD_MASK, \&intmask)/sdhci_cmd_irq(host, intmask \& SDHCI_INT_CMD_MASK)/g' drivers/mmc/host/sdhci.c

          # 5. Fix HID Trace Path
          sed -i 's|#define TRACE_INCLUDE_PATH .|#define TRACE_INCLUDE_PATH ../../drivers/hid|g' drivers/hid/hid-trace.h

      - name: Build Kernel
        run: |
          cd kernel-res
          export PATH=$(pwd)/../toolchain/zyc-clang/bin:$PATH
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          MAKE_ARGS="ARCH=arm64 CC=clang HOSTCC=gcc LLVM=1 LLVM_IAS=1"
          # KCFLAGS permisive pentru a trece de orice alte warning-uri de tip 'implicit declaration'
          export KCFLAGS="-Wno-error -Wno-unused-label -Wno-implicit-function-declaration -Wno-incompatible-pointer-types -Wno-return-type -I$(pwd)/drivers/hid"

          make $MAKE_ARGS r5q_eur_open_defconfig
          
          # Forțăm configurația stabilă
          ./scripts/config --disable CONFIG_SCHED_WALT
          ./scripts/config --enable CONFIG_SCHED_PELT
          ./scripts/config --disable CONFIG_CC_STACKPROTECTOR_STRONG
          ./scripts/config --enable CONFIG_CC_STACKPROTECTOR_NONE
          
          make $MAKE_ARGS olddefconfig
          make -j$(nproc --all) $MAKE_ARGS Image.gz-dtb

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: kernel-S10Lite-v84
          path: kernel-res/arch/arm64/boot/Image.gz-dtb
