name: S10 Lite - Final Stable Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves libncurses-dev git wget make python2 python3 pahole tar xz-utils lib32z1

      - name: Setup Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang
          echo "PROTON_PATH=$(pwd)/toolchain/proton-clang/bin" >> $GITHUB_ENV

      - name: Prepare Source & Fix Headers
        run: |
          # 1. Redirecționăm include-ul problematic către calea standard
          find . -type f -name "*.c" -o -name "*.h" | xargs sed -i 's/uapi\/linux\/btf.h/linux\/btf.h/g' || true

          # 2. Creăm un header dummy btf.h pentru a satisface dependențele BPF
          mkdir -p include/linux
          mkdir -p include/uapi/linux
          if [ ! -f include/linux/btf.h ]; then
            echo -e "#ifndef _LINUX_BTF_H\n#define _LINUX_BTF_H\n#include <linux/types.h>\n#endif" > include/linux/btf.h
          fi
          cp include/linux/btf.h include/uapi/linux/btf.h

          # 3. Fix pentru utilitarele Samsung și mediu
          echo -e '#!/bin/bash\necho "0"' > /tmp/secgetspf
          chmod +x /tmp/secgetspf
          sudo mv /tmp/secgetspf /usr/bin/secgetspf
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Build Kernel
        run: |
          export PATH="${{ env.PROTON_PATH }}:$PATH"
          
          # Argumente de build
          MAKE_ARGS="
            O=out \
            ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1
          "
          
          # Flag-uri pentru a ignora warning-urile tratate ca erori de Clang 13
          export KCFLAGS="-Wno-error -Wno-implicit-function-declaration -Wno-unknown-warning-option -Wno-incompatible-pointer-types"

          rm -rf out && mkdir -p out
          
          # 1. Generare config original
          make $MAKE_ARGS r5q_eur_open_defconfig
          
          # 2. Aplicare patch-uri de configurare (Bypass eBPF JIT Errors)
          # Acestea elimină necesitatea compilării codului problematic din kernel/bpf/
          sed -i 's/CONFIG_BPF_JIT=y/CONFIG_BPF_JIT=n/g' out/.config
          sed -i 's/CONFIG_BPF_SYSCALL=y/CONFIG_BPF_SYSCALL=n/g' out/.config
          sed -i 's/CONFIG_DEBUG_INFO_BTF=y/CONFIG_DEBUG_INFO_BTF=n/g' out/.config
          
          # Optimizări pentru GitHub Actions (Evită Out-Of-Memory)
          sed -i 's/CONFIG_LTO_CLANG=y/CONFIG_LTO_CLANG=n/g' out/.config
          sed -i 's/CONFIG_LTO=y/CONFIG_LTO=n/g' out/.config
          sed -i 's/CONFIG_KASAN=y/CONFIG_KASAN=n/g' out/.config
          
          # 3. Finalizare config
          make $MAKE_ARGS olddefconfig
          
          # 4. Compilare propriu-zisă (folosim -j3 pentru a nu bloca RAM-ul serverului)
          make -j3 $MAKE_ARGS

          # Verificare succes
