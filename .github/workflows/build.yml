name: S10 Lite - Safe eBPF v4 (Final Fix)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: mainey/android_kernel_samsung_r5q
          ref: lineage-19.0
          path: kernel
          fetch-depth: 1

      - name: Setup Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves make python3 lz4
          mkdir -p toolchain
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang

      - name: Patch BPF Syntax & Samsung Makefile
        run: |
          cd kernel
          # 1. Fix BPF enum syntax - adaugam elementele corect cu virgula
          # Cautam ultima acolada a enum-ului bpf_cmd si inseram inainte
          sed -i '/BPF_OBJ_GET,/a \	BPF_OBJ_NAME_LEN = 16,' include/uapi/linux/bpf.h
          sed -i '/BPF_F_WRONLY/a \	BPF_F_RDONLY_PROG = (1U << 7),\n	BPF_F_WRONLY_PROG = (1U << 8),' include/uapi/linux/bpf.h

          # 2. Curatam Makefile-ul de caile Samsung inexistente
          # Eliminam prefixul care cauta folderul de GCC 4.9 local
          sed -i 's|$(srctree)/../toolchain/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin/aarch64-linux-android-||g' Makefile
          
          # 3. Cream scriptul secgetspf necesar pentru build
          echo -e "#!/bin/sh\necho '00000000000000000000000000000000'\nexit 0" > secgetspf
          chmod +x secgetspf

      - name: Configure & Build
        run: |
          cd kernel
          # Adaugam toolchain-ul si scriptul secgetspf in PATH
          export PATH=$(pwd):$(pwd)/../toolchain/proton-clang/bin:$PATH
          
          # Definirea argumentelor de build
          export MAKE_ARGS="ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1"
          
          # Generare config
          make $MAKE_ARGS r5q_eur_open_defconfig
          
          # Activare BPF pentru Android 15
          ./scripts/config --enable CONFIG_BPF_SYSCALL
          ./scripts/config --enable CONFIG_BPF_JIT
          ./scripts/config --enable CONFIG_CGROUP_BPF
          ./scripts/config --disable CONFIG_DEBUG_INFO_BTF
          ./scripts/config --disable CONFIG_SECURITY_SAMSUNG_RKP
          
          make $MAKE_ARGS olddefconfig
          
          # Build propriu-zis cu suprimarea erorilor de tip
          export KCFLAGS="-O2 -Wno-everything -Wno-error -fcommon"
          make -j$(nproc --all) $MAKE_ARGS Image.gz-dtb

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: s10-lite-ebpf-kernel-v20
          path: kernel/arch/arm64/boot/Image.gz-dtb
