name: Build Roynas R5Q - External Module Mode
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: sh4dow6oy/android_kernel_samsung_sm7150
          ref: sixteen
          path: kernel
          fetch-depth: 1

      - name: Checkout Drivers (r3q)
        uses: actions/checkout@v4
        with:
          repository: Roynas-Android-Playground/kernel_samsung_r3q
          path: r3q_source
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev \
          ccache python3 python-is-python3 libarchive-tools wget zstd zip \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libncurses-dev libtinfo6

      - name: Setup Neutron Clang
        run: |
          mkdir clang
          wget -q https://github.com/Ylarod/setup-ndk-clang/releases/download/prebuilt/clang-linux-x86-ndk-r29-r563880c.tar.zst
          tar -I zstd -xf clang-linux-x86-ndk-r29-r563880c.tar.zst -C clang

      - name: Build Kernel & External Modules
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export KBUILD_BUILD_USER="Roynas"
          export KBUILD_BUILD_HOST="GithubActions"

          # 1. PREP DRIVERS (r3q)
          rm -rf drivers/battery_v2
          cp -r ../r3q_source/drivers/battery_v2 drivers/

          # 2. ARGUMENTE BUILD
          MAKE_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- O=out"

          # 3. CONFIGURARE (Dezactivăm bateria din nucleu)
          make $MAKE_ARGS r5q_defconfig
          ./scripts/config --file out/.config \
            -d CONFIG_BATTERY_SAMSUNG \
            -d CONFIG_BATTERY_SAMSUNG_V2 \
            -d CONFIG_LTO -d CONFIG_LTO_CLANG -e CONFIG_LTO_NONE
          make $MAKE_ARGS olddefconfig

          # 4. COMPILARE KERNEL (Fără baterie)
          KCFLAGS_BASE="-fcommon -w -Wno-error"
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="$KCFLAGS_BASE" Image.gz

          # 5. COMPILARE MODUL EXTERN (Baterie)
          # Ne mutăm în folderul driverului și îl compilăm folosind kernelul proaspăt construit ca referință
          echo "Compilez driverul de baterie ca modul extern..."
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="$KCFLAGS_BASE -Idrivers/battery_v2/include" M=drivers/battery_v2 modules

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          cp kernel/out/arch/arm64/boot/Image.gz AnyKernel3/
          # Copiem modulele .ko generate (dacă există)
          find kernel/drivers/battery_v2 -name "*.ko" -exec cp {} AnyKernel3/ \;
          
          sed -i 's/device.name1=maguro/device.name1=r5q/g' AnyKernel3/anykernel.sh
          cd AnyKernel3 && zip -r9 ../Kernel-R5Q-ExternalModules.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-R5Q-External
          path: Kernel-R5Q-ExternalModules.zip
