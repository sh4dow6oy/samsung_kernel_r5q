name: Build Roynas R5Q - SM8150 Ultimate Hybrid
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: sh4dow6oy/android_kernel_samsung_sm7150
          ref: sixteen
          path: kernel
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev \
          ccache python3 python-is-python3 libarchive-tools wget zstd zip \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libncurses-dev libtinfo6

      - name: Setup Neutron Clang
        run: |
          mkdir clang
          wget -q https://github.com/Ylarod/setup-ndk-clang/releases/download/prebuilt/clang-linux-x86-ndk-r29-r563880c.tar.zst
          tar -I zstd -xf clang-linux-x86-ndk-r29-r563880c.tar.zst -C clang

      - name: Build Kernel
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export KBUILD_BUILD_USER="Roynas"
          export KBUILD_BUILD_HOST="S10Lite-Hybrid"

          # 1. PREGĂTIRE DIRECTOR ȘI HEADERE
          mkdir -p out
          make ARCH=arm64 O=out headers_install

          # 2. FIX-URI SURSĂ (Patch-uri automate prin sed)
          
          # Fix Initcall (Eroarea initcall_sec_debug)
          sed -i 's/initcall_sec_debug/initcall_debug/g' init/main.c
          
          # Fix Perf Event (Duplicat kernel/trace)
          sed -i '0,/struct perf_event \*event;/! s/struct perf_event \*event;/\/\/ duplicat/g' kernel/trace/trace_event_perf.c
          
          # Fix Imagis Touch (Incomplete definition tsp_dump_callbacks)
          find drivers/input/touchscreen/imagis_40xx -name "ist40xx.c" -exec sed -i '/dump_callbacks.inform_dump/s/^/\/\//' {} +

          # Fix Wi-Fi / PLD (Garda de protecție redefinire pld_context)
          find drivers/staging/qca-wifi-host-cmn -name "pld.h" -exec sed -i '/struct pld_context {/i #ifndef __PLD_CONTEXT_GUARD\n#define __PLD_CONTEXT_GUARD' {} +
          find drivers/staging/qca-wifi-host-cmn -name "pld.h" -exec sed -i '/};/a #endif' {} +

          # Fix Pinctrl (Prototip msm_gpio_is_valid)
          sed -i '/#include <linux\/pinctrl\/pinctrl.h>/a bool msm_gpio_is_valid(int gpionum);' drivers/pinctrl/qcom/pinctrl-msm.c
          
          # Fix Sensors (Redenumire PD în CC)
          sed -i 's/PD_NOTI_ATTACH_TYPEDEF/CC_NOTI_ATTACH_TYPEDEF/g' drivers/sensors/sx9360.c
          sed -i 's/PDIC_NOTIFY_ID_ATTACH/CCIC_NOTIFY_ID_ATTACH/g' drivers/sensors/sx9360.c
          
          # Fix Display Debug (Conflict extern vs static)
          find drivers/gpu/drm/msm/samsung -name "ss_dsi_panel_debug.h" -exec sed -i '/extern bool.*_debug_partition/s/^/\/\//' {} +

          # Fix Baterie
          find drivers/battery_v2 -type f -exec sed -i '/now_isApdo\|num_apdo\|has_apdo/s/^/\/\//' {} +
          sed -i '/POWER_SUPPLY_EXT_PROP_DIRECT_CLEAR_ERR/s/^/\/\//' drivers/battery_v2/sec_battery.c

          # 3. CONFIGURARE
          MAKE_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- O=out"
          
          ARCH=arm64 ./scripts/kconfig/merge_config.sh -m -O out \
            arch/arm64/configs/r5q_defconfig \
            arch/arm64/configs/vendor/sm8150_defconfig \
            arch/arm64/configs/a70q.config
          
          ./scripts/config --file out/.config \
            -d CONFIG_QCOM_KGSL_CORESIGHT -d CONFIG_CORESIGHT \
            -d CONFIG_BLK_DEV_IO_TRACE -d CONFIG_SEC_DEBUG \
            -d CONFIG_SECURITY_SMACK -d CONFIG_KSU \
            -d CONFIG_LTO -d CONFIG_LTO_CLANG -e CONFIG_LTO_NONE \
            -e CONFIG_SECTION_MISMATCH_WARN_ONLY
            
          make $MAKE_ARGS olddefconfig

          # 4. COMPILARE FINALĂ
          KCFLAGS_BASE="-fcommon -w -Wno-error -Wno-format -DPON_RESTART_REASON_CROSS_FAIL=0 -I$(pwd)/out/usr/include"
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="$KCFLAGS_BASE" Image.gz

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          cp kernel/out/arch/arm64/boot/Image.gz AnyKernel3/
          sed -i 's/device.name1=maguro/device.name1=r5q/g' AnyKernel3/anykernel.sh
          cd AnyKernel3 && zip -r9 ../Kernel-R5Q-SM8150-Final.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-R5Q-Final
          path: Kernel-R5Q-SM8150-Hybrid.zip
