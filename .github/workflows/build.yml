name: R5Q Android 15 - LumiPlayground Base

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout LumiPlayground Source (rawr-bpf)
        uses: actions/checkout@v4
        with:
          repository: LumiPlayground/android_kernel_samsung_sm8150
          ref: rawr-bpf
          fetch-depth: 1

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd bc build-essential gcc-aarch64-linux-gnu libssl-dev libelf-dev python3 python-is-python3
          # Fix pentru scripturile care caută explicit python2
          sudo ln -sf /usr/bin/python3 /usr/bin/python2
          
          # Descărcare Neutron Toolchain
          mkdir clang-neutron
          wget https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang-neutron

      - name: Build Kernel (R5Q Config)
        run: |
          # Setări mediu
          export PATH=$(pwd)/clang-neutron/bin:$PATH
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          # Variabilele cerute de Makefile-ul Samsung/Lumi
          KERNEL_LLVM_BIN=$(pwd)/clang-neutron/bin/clang
          CLANG_TRIPLE=aarch64-linux-gnu-
          
          # Fix rapid pentru headerele de log Android (dacă Makefile-ul le cere)
          mkdir -p system/core/liblog/include/log/
          touch system/core/liblog/include/log/perflog.h

          # 1. Configurare folosind defconfig-ul de R5Q care există deja în sursa Lumi
          # (Am văzut că ai trimis link-ul către el anterior)
          make O=out ARCH=arm64 CROSS_COMPILE=$CROSS_COMPILE REAL_CC=$KERNEL_LLVM_BIN CLANG_TRIPLE=$CLANG_TRIPLE r5q_eur_open_defconfig
          
          # 2. Aplicăm setările (nu mai avem nevoie de scripts/config pentru că e deja gata)
          make O=out ARCH=arm64 CROSS_COMPILE=$CROSS_COMPILE REAL_CC=$KERNEL_LLVM_BIN CLANG_TRIPLE=$CLANG_TRIPLE olddefconfig

          # 3. Compilare
          echo "--- START COMPILATION ---"
          make -j$(nproc --all) O=out ARCH=arm64 \
               CROSS_COMPILE=$CROSS_COMPILE \
               REAL_CC=$KERNEL_LLVM_BIN \
               CLANG_TRIPLE=$CLANG_TRIPLE \
               KCFLAGS="-w -Wno-error"

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3
          # Verificăm unde a fost generată imaginea (Image.gz-dtb sau Image)
          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          else
            cp out/arch/arm64/boot/Image.gz AnyKernel3/ || cp out/arch/arm64/boot/Image AnyKernel3/
          fi
          cd AnyKernel3 && zip -r9 ../R5Q-Lumi-Kernel.zip * -x .git README.md

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: R5Q-Lumi-BPF-A15
          path: R5Q-Lumi-Kernel.zip
