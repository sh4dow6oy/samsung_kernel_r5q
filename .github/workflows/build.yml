name: Build Roynas R5Q - Neutron Clang Final

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: LumiPlayground/android_kernel_samsung_sm8150
          ref: rawr-bpf
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev \
          ccache python3 python-is-python3 libarchive-tools wget zstd libtinfo6 zip

      - name: Setup Neutron Clang
        run: |
          mkdir clang
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang

      - name: Build Kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          
          # 1. NUCLEAR CLEANUP (Prevenim Polly Errors)
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-mllvm -polly[^ ]*//g' {} +
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-mllvm//g' {} +
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-polly[^ ]*//g' {} +
          
          # 2. VDSO & FIX ASSEMBBLER DIRECT IN MAKEFILE (Bypass /usr/bin/as)
          # Forțăm sistemul vDSO și Kbuild să folosească Clang ca asamblor, chiar dacă ignoră LLVM_IAS
          find . -type f -name "Makefile*" -exec sed -i 's/$(CROSS_COMPILE)as/clang/g' {} +
          
          if [ -f arch/arm64/kernel/vdso/Makefile ]; then
            sed -i 's/-static//g' arch/arm64/kernel/vdso/Makefile
            sed -i 's/$(LDFLAGS)/$(filter-out -static,$(LDFLAGS))/g' arch/arm64/kernel/vdso/Makefile
            # Fix specific pentru target vDSO în Neutron
            printf '\nVDSO_AFLAGS += --target=aarch64-linux-gnu\n' >> arch/arm64/kernel/vdso/Makefile
          fi

          # 3. KERNELSU & SAMSUNG CLEANUP
          sed -i '/kernelsu/d' drivers/android/Kconfig || true
          sed -i '/kernelsu/d' drivers/android/Makefile || true
          rm -rf drivers/kernelsu
          sed -i 's/ifneq ($(wildcard $(srctree)\/scripts\/gcc-wrapper.py),)/ifeq (0,1)/g' Makefile

          # 4. Argumente Build (Definim explicit AS=clang cu target ARM64)
          MAKE_ARGS="ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            AS=\"clang -target aarch64-linux-gnu\" \
            HOSTCC=clang \
            HOSTCXX=clang++ \
            HOSTCFLAGS=-Wno-error \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            O=out"

          # 5. Configurare
          make $MAKE_ARGS r5q_eur_open_defconfig

          ./scripts/config --file out/.config \
            -e CONFIG_LTO_CLANG \
            -e CONFIG_THINLTO \
            -d CONFIG_LTO_NONE \
            -d CONFIG_MODVERSIONS \
            -d CONFIG_CC_STACKPROTECTOR_STRONG \
            -e CONFIG_CC_STACKPROTECTOR_NONE \
            -d CONFIG_SHADOW_CALL_STACK \
            -d CONFIG_KNOX_KAP \
            -d CONFIG_SECURITY_SAMSUNG_KNOX \
            -d CONFIG_ASSIST_KSU \
            -d CONFIG_KSU \
            -d CONFIG_WERROR

          make $MAKE_ARGS olddefconfig
          
          # 6. Compilare (Forțăm din nou parametrii ca măsuri redundante)
          make -j$(nproc --all) $MAKE_ARGS \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            AS="clang -target aarch64-linux-gnu" \
            KCFLAGS="-fcommon -Wno-error -Wno-unknown-warning-option -Wno-unused-command-line-argument -Wno-stringop-truncation --target=aarch64-linux-gnu" \
            Image.gz dtbs

      - name: Package with AnyKernel3
        run: |
          IMAGE="$GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz-dtb"
          if [ ! -f "$IMAGE" ]; then
            IMAGE="$GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz"
          fi
          
          # Generare automată DTBO.img din fișierele compilate separate
          MKDTIMG="$GITHUB_WORKSPACE/s/tools/mkdtimg"
          if [ ! -f "$GITHUB_WORKSPACE/out/arch/arm64/boot/dtbo.img" ] && [ -f "$MKDTIMG" ]; then
            chmod +x $MKDTIMG
            DTBO_FILES=$(find $GITHUB_WORKSPACE/out/arch/arm64/boot/dts/ -name "*.dtbo")
            $MKDTIMG create $GITHUB_WORKSPACE/out/arch/arm64/boot/dtbo.img --version=2 --page_size=4096 $DTBO_FILES
          fi
          
          DTBO="$GITHUB_WORKSPACE/out/arch/arm64/boot/dtbo.img"

          git clone https://github.com/osm0sis/AnyKernel3.git
          rm -rf AnyKernel3/.git
          
          cp $IMAGE AnyKernel3/Image.gz
          [ -f "$DTBO" ] && cp $DTBO AnyKernel3/dtbo.img
          
          cd AnyKernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          sed -i 's/device.name1=maguro/device.name1=r5q/g' anykernel.sh
          sed -i 's/device.name2=toroplus/device.name2=SM-G770F/g' anykernel.sh
          sed -i 's/device.name3=toro/device.name3=r5q/g' anykernel.sh
          sed -i 's/header_version=0/header_version=2/g' anykernel.sh
          
          printf '\n## dtbo install\nif [ -f $home/dtbo.img ]; then\n  ui_print " "; ui_print "Flashing DTBO...";\n  flash_dtbo;\nfi;\n' >> anykernel.sh
          
          zip -r9 ../Kernel-S10Lite-R5Q-Neutron.zip *

      - name: Upload Flashable Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-S10Lite-R5Q
          path: Kernel-S10Lite-R5Q-Neutron.zip
