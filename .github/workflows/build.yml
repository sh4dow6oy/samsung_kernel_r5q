name: Build S10 Lite Kernel (4.14) A15-BPF Backport

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev dwarves \
            libncurses-dev git wget unzip make python2 \
            python3 python3-minimal lz4 xz-utils gcc g++

      - name: Download Proton Clang
        run: |
          mkdir -p toolchain
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang

      - name: Backport BPF Headers from Pascua28
        run: |
          # Clonăm doar headerele necesare pentru a repara eroarea btf.h
          git clone --depth=1 https://github.com/pascua28/android_kernel_samsung_sm8250 -b seventeen tmp_repo
          
          # Creăm directoarele dacă nu există
          mkdir -p include/uapi/linux/
          mkdir -p include/linux/
          
          # Copiem fișierele critice pentru BPF/BTF
          cp tmp_repo/include/uapi/linux/btf.h include/uapi/linux/btf.h
          cp tmp_repo/include/linux/btf.h include/linux/btf.h || cp tmp_repo/include/uapi/linux/btf.h include/linux/btf.h
          
          # Opțional: Copiem și restul definitiilor BPF pentru a evita erori ulterioare în core.c
          cp tmp_repo/include/uapi/linux/bpf.h include/uapi/linux/bpf.h
          cp tmp_repo/include/linux/bpf.h include/linux/bpf.h
          
          rm -rf tmp_repo
          echo "Backport BPF headers completed."

      - name: Pre-build Fixes
        run: |
          # 1. Forțăm core.c să găsească btf.h folosind noua locație
          find . -name "core.c" -path "*/kernel/bpf/*" | xargs sed -i 's|<uapi/linux/btf.h>|<linux/btf.h>|g' || true
          
          # 2. Fix pentru log-urile Samsung (perflog.h) - varianta extinsă
          mkdir -p system/core/liblog/include/log
          mkdir -p system/logging/liblog/include/log
          # Creăm fișierul fizic în toate locațiile posibile căutate de Makefile
          touch system/core/liblog/include/log/perflog.h
          touch system/logging/liblog/include/log/perflog.h
          
          # 3. Dezactivăm wrapper-ul Samsung și setăm Python
          [ -f scripts/gcc-wrapper.py ] && mv scripts/gcc-wrapper.py scripts/gcc-wrapper.py.disabled || true
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Build Kernel
        run: |
          export PATH=$(pwd)/toolchain/proton-clang/bin:$PATH
          
          MAKE_ARGS="
            O=out \
            ARCH=arm64 \
            CC=clang \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1 \
            KCFLAGS=-Wno-error \
            TECHPACK=true
          "

          mkdir -p out
          make $MAKE_ARGS r5q_eur_open_defconfig

          # Injectăm configurările pentru eBPF modern (Android 15)
          ./scripts/config --file out/.config --enable CONFIG_BPF_SYSCALL
          ./scripts/config --file out/.config --enable CONFIG_BPF_JIT
          ./scripts/config --file out/.config --enable CONFIG_HAVE_EBPF_JIT
          ./scripts/config --file out/.config --enable CONFIG_NET_CLS_BPF
          ./scripts/config --file out/.config --enable CONFIG_NET_ACT_BPF
          ./scripts/config --file out/.config --enable CONFIG_BPF_EVENTS
          ./scripts/config --file out/.config --enable CONFIG_DEBUG_INFO_BTF

          # Rezolvăm conflictele de configurare automat
          make $MAKE_ARGS olddefconfig

          # Compilarea principală
          make -j$(nproc --all) $MAKE_ARGS

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-S10Lite-Backported
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dtbo.img
            out/arch/arm64/boot/dts/vendor/qcom/*.dtb
