name: Build Prime Kernel R5Q

on:
  workflow_dispatch:
    inputs:
      release:
          description: 'Upload release'
          type: boolean
          required: true
          default: false
      changelog:
          description: 'Changelog'
          type: string
          required: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_ts: ${{ steps.ts.outputs.release_ts }}
    steps:
      - name: Generate release date
        id: ts
        run: echo "release_ts=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

  build:
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git curl unzip wget zip zstd \
            bc bison flex libssl-dev libelf-dev python3 python-is-python3 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Download Proton Clang
        run: |
          mkdir clang-stable
          wget https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.tar.gz -O clang.tar.gz
          tar -xf clang.tar.gz -C clang-stable --strip-components=1
          chmod -R +x clang-stable/bin/

      - name: Build kernel
        run: |
          CLANG_DIR="$(pwd)/clang-stable"
          
          # 1. Fix Samsung Scripts & Security tools
          mkdir -p out
          echo "#!/bin/bash" > secgetspf
          echo "exit 0" >> secgetspf
          chmod +x secgetspf
          cp secgetspf out/
          export PATH="$(pwd):$PATH"

          # 2. Fix asm-goto (dezactivăm testul care crapă compilarea pe Clang)
          echo "exit 0" > scripts/gcc-goto.sh
          chmod +x scripts/gcc-goto.sh

          # 3. Parametrii Make - Metoda "Injecție"
          # Adăugăm flag-uri pentru a ignora erorile Samsung în loc să ștergem Makefile-urile
          MAKE_ARGS="ARCH=arm64 \
            O=out \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            CC=${CLANG_DIR}/bin/clang \
            LD=${CLANG_DIR}/bin/ld.lld \
            AR=${CLANG_DIR}/bin/llvm-ar \
            NM=${CLANG_DIR}/bin/llvm-nm \
            OBJCOPY=${CLANG_DIR}/bin/llvm-objcopy \
            OBJDUMP=${CLANG_DIR}/bin/llvm-objdump \
            STRIP=${CLANG_DIR}/bin/llvm-strip \
            OBJSIZE=${CLANG_DIR}/bin/llvm-size \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            DTC_EXT=$(pwd)/scripts/dtc \
            KCFLAGS=-Wno-implicit-function-declaration \
            KCPPFLAGS=-Wno-unknown-warning-option"

          # 4. Build Sequence
          # Resetăm eventualele resturi de la sed-ul anterior dacă rulezi pe același mediu
          git checkout . 

          # Generare config
          make $MAKE_ARGS r5q_eur_open_defconfig

          # 5. Patch .config (Dezactivăm SEC_DEBUG care cauzează probleme de linkare)
          sed -i 's/CONFIG_SEC_DEBUG=y/CONFIG_SEC_DEBUG=n/g' out/.config || true
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/CONFIG_CC_STACKPROTECTOR_NONE=y/g' out/.config || true
          echo "CONFIG_CC_HAVE_ASM_GOTO=y" >> out/.config

          # 6. Compilare finală
          make $MAKE_ARGS olddefconfig
          make $MAKE_ARGS -j$(nproc --all) Image.gz-dtb

          # 7. Verificare rezultat
          if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
            mkdir -p AnyKernel3
            cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          else
            echo "Build failed: Image.gz-dtb not found!"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrimeKernel-R5Q-${{ needs.prepare.outputs.release_ts }}
          path: AnyKernel3/Image.gz-dtb

  release:
    needs: [prepare, build]
    if: github.event.inputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ needs.prepare.outputs.release_ts }}"
          name: "PrimeKernel-R5Q-${{ needs.prepare.outputs.release_ts }}"
          body: "${{ github.event.inputs.changelog }}"
          files: artifacts/PrimeKernel-R5Q-*/Image.gz-dtb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
