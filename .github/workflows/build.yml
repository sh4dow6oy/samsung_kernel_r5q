name: S10 Lite Kernel - Pure Upstream 4.14.y

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves libncurses-dev git wget make python2 python3 pahole

      - name: Download Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang

      - name: Perform Upstream Merge
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          
          # Adăugăm sursa oficială Linux Stable
          git remote add linux-stable https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git || true
          git fetch linux-stable linux-4.14.y
          
          # Încercăm un merge automat. 
          # Folosim strategia "recursive" dar lăsăm conflictele pentru rezolvare manuală prin script
          git merge FETCH_HEAD -m "Upstream merge to latest 4.14.y" || echo "Conflicte detectate, aplicăm fix-uri..."

          # Rezolvăm conflictele comune (păstrăm Makefile-ul Samsung pentru versiune, dar luăm restul)
          git checkout --ours Makefile
          git checkout --ours drivers/staging/Kconfig
          git checkout --ours arch/arm64/configs/r5q_eur_open_defconfig
          
          # Adăugăm fișierele care pot lipsi
          git add .
          git commit -m "Fixed merge conflicts for S10 Lite" || echo "Nimic de comis"

      - name: Pre-build Fixes
        run: |
          # Fix pentru erori de tip poll_t apărute în upstream-ul 4.14
          sed -i '/#define _UAPI_LINUX_TYPES_H/a #ifndef __poll_t\n#ifndef __ASSEMBLY__\ntypedef unsigned int __poll_t;\n#endif\n#define __poll_t __poll_t\n#endif' include/uapi/linux/types.h
          
          # Python 2 symlink pentru scripturile Samsung
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Build Kernel
        run: |
          export PATH=$(pwd)/toolchain/proton-clang/bin:$PATH
          MAKE_ARGS="O=out ARCH=arm64 CC=clang HOSTCC=gcc HOSTCXX=g++ LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1 TECHPACK=true"
          
          # Dezactivăm Stack Protector Strong dacă dă erori de detecție
          rm -rf out && mkdir -p out
          make $MAKE_ARGS r5q_eur_open_defconfig
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/CONFIG_CC_STACKPROTECTOR_NONE=y/g' out/.config
          
          make $MAKE_ARGS olddefconfig
          make -j$(nproc --all) $MAKE_ARGS

          if [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image .
            echo "BUILD_SUCCESS=true" >> $GITHUB_ENV
          fi

      - name: Upload Kernel
        if: env.BUILD_SUCCESS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-Kernel-Upstream-4.14
          path: Image
