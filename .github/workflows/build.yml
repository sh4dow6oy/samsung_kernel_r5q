name: Build Lumi R5Q - Ultimate BPF Fixed
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: LumiPlayground/android_kernel_samsung_sm8150
          ref: rawr-bpf
          path: kernel
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev \
          ccache python3 python-is-python3 libarchive-tools wget zstd zip \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libncurses-dev libtinfo6 \
          device-tree-compiler

      - name: Setup Toolchain (Neutron Clang)
        run: |
          mkdir clang
          wget -q https://github.com/Ylarod/setup-ndk-clang/releases/download/prebuilt/clang-linux-x86-ndk-r29-r563880c.tar.zst
          tar -I zstd -xf clang-linux-x86-ndk-r29-r563880c.tar.zst -C clang

      - name: Prepare Source & Fixes
        run: |
          cd kernel
          # 1. Permisiuni pentru utilitarele de build Lumi
          chmod -R +x tools/
          
          # 2. Fix simboluri multiple (COMMON symbols fix)
          grep -r "bool main_ext_ss_not_working" . | cut -d: -f1 | xargs sed -i 's/bool main_ext_ss_not_working/static bool main_ext_ss_not_working/g' || true
          
          # 3. FIX CRITIC pentru eroarea "relocation truncated" (SELinux/RTIC)
          # Dezactivam RTIC deoarece intra in conflict cu adresele de memorie Clang
          ./scripts/config --file arch/arm64/configs/r5q_eur_open_defconfig \
            -d CONFIG_RTIC \
            -d CONFIG_RTIC_MP \
            -d CONFIG_RTIC_KDP \
            -e CONFIG_BPF_SYSCALL \
            -e CONFIG_BUILD_ARM64_DT_OVERLAY \
            -e CONFIG_SAMSUNG_PRODUCT_SHIP \
            -e CONFIG_LTO_CLANG_NONE \
            -d CONFIG_LTO_CLANG_THIN \
            -e CONFIG_SECTION_MISMATCH_WARN_ONLY

      - name: Build Kernel
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          
          # Parametrii de build pentru ramura rawr-bpf
          # Adaugam LDFLAGS pentru a ignora segmentele RWX care pot opri build-ul
          export MAKE_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang \
            DTC_EXT=$(pwd)/tools/dtc \
            CONFIG_BUILD_ARM64_DT_OVERLAY=y \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD=ld.lld \
            O=out"

          # Aplicam config-ul nativ R5Q
          make $MAKE_ARGS r5q_eur_open_defconfig
          make $MAKE_ARGS olddefconfig
          
          # Compilare cu flag-uri de compatibilitate
          # Folosim -fcommon pentru a ignora restul de simboluri duplicate
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-fcommon -w" O=out Image.gz dtbs

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          cp kernel/out/arch/arm64/boot/Image.gz AnyKernel3/
          
          # Colectare DTB (Baza Hardware)
          echo "Colectam DTB-uri..."
          find kernel/out/arch/arm64/boot/dts/ -name "*.dtb" -type f -exec cat {} + > AnyKernel3/dtb
          
          # Colectare DTBO (Overlay Display/Touch)
          # Cautam in tot folderul out (inclusiv techpack) pentru a evita fisierul de 0mb
          echo "Colectam DTBO-uri..."
          find kernel/out/ -name "*.dtbo" -type f -exec cat {} + > AnyKernel3/dtbo.img

          # Verificare dimensiuni in log
          echo "--- VERIFICARE FINALA ---"
          ls -lh AnyKernel3/dtb
          ls -lh AnyKernel3/dtbo.img
          echo "-------------------------"

          cd AnyKernel3
          sed -i 's/device.name1=maguro/device.name1=r5q/g' anykernel.sh
          sed -i 's/device.name2=panda/device.name2=SM-G770F/g' anykernel.sh
          # Dezactivam verificarea stricta a device-ului pentru a evita erori la flash
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          
          zip -r9 ../Lumi-R5Q-BPF-Final-Fixed.zip *

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Lumi-R5Q-BPF-Final
          path: Lumi-R5Q-BPF-Final-Fixed.zip
