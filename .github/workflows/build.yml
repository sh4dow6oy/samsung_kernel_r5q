name: S10 Lite (Lineage Base + Mainey R5Q EUR Config)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LineageOS SM8150 Base
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_oneplus_sm8150
          ref: lineage-22.1
          path: main

      - name: Checkout Mainey (R5Q Source)
        uses: actions/checkout@v4
        with:
          repository: mainey/android_kernel_samsung_r5q
          path: mainey

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex git libssl-dev libelf-dev clang llvm lld zstd curl python3 device-tree-compiler

      - name: Download Neutron Clang
        run: |
          mkdir -p main/clang
          wget https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C main/clang

      - name: Surgical Grafting (DTS & EUR Config)
        run: |
          # 1. Copiem Config-ul European r5q exact din calea specificata
          cp mainey/arch/arm64/configs/r5q_eur_open_defconfig main/arch/arm64/configs/r5q_defconfig
          
          # 2. Replicam structura de foldere DTS (Crucial pentru include-uri)
          mkdir -p main/arch/arm64/boot/dts/samsung
          cp -r mainey/arch/arm64/boot/dts/samsung/* main/arch/arm64/boot/dts/samsung/
          
          cd main
          # 3. Global Shims (Protecție Assembly pentru functii Samsung lipsa)
          cat << 'EOF' > global_shims.h
          #ifndef __GLOBAL_SHIMS_H
          #define __GLOBAL_SHIMS_H
          #ifndef __ASSEMBLY__
          static inline int as_is_debug_level(void) { return 0; }
          static inline int get_avc_paranoid(void) { return 0; }
          #define initcall_sec_debug 0
          #endif
          #define SAMSUNG_PRODUCT_SHIP 1
          #endif
          EOF
          cat global_shims.h include/linux/compiler.h > include/linux/compiler.h.new
          mv include/linux/compiler.h.new include/linux/compiler.h

          # 4. Patch DTC Lexer pentru compatibilitate Clang modern
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' scripts/dtc/dtc-lexer.lex.c_shipped || true

      - name: Configure and Build
        run: |
          cd main
          export PATH="$GITHUB_WORKSPACE/main/clang/bin:$PATH"

          MAKE_ARGS="ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            DTC=dtc \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            O=out"

          # Generăm config folosind fisierul r5q_defconfig (care e acum r5q_eur_open_defconfig)
          make $MAKE_ARGS r5q_defconfig
          
          # Ajustări obligatorii pentru suport Android 15 & Lineage Base
          ./scripts/config --file out/.config \
            -e CONFIG_BPF_SYSCALL -e CONFIG_BPF_JIT \
            -d CONFIG_LTO -d CONFIG_LTO_CLANG -e CONFIG_LTO_NONE \
            -d CONFIG_SECURITY_SAMSUNG_KNOX -d CONFIG_KNOX_KAP \
            -d CONFIG_SEC_ABC -d CONFIG_SEC_DEBUG

          make $MAKE_ARGS olddefconfig

          # Build Final
          make -j$(nproc --all) $MAKE_ARGS \
            KCFLAGS="-fcommon -Wno-error -Wno-implicit-function-declaration -Wno-macro-redefined -Wno-incompatible-pointer-types" \
            2>&1 | tee build.log

      - name: Upload Kernel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-Lineage-EUR-Final
          path: |
            main/out/arch/arm64/boot/Image.gz-dtb
            main/out/arch/arm64/boot/dtbo.img
            main/build.log
