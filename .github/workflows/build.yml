name: Build Lumi R5Q - Stock Init & Polly Fix
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel
        uses: actions/checkout@v4
        with:
          repository: Roynas-Android-Playground/kernel_samsung_r3q
          ref: master
          path: kernel
          fetch-depth: 1

      - name: Kernel Surgical Fixes (VDSO, Polly, Security)
        run: |
          cd kernel
          # --- 1. FIX VDSO: Elimină -static (Eroare de Linker LLVM) ---
          find arch/arm64/kernel/vdso -type f -name "Makefile*" -exec sed -i 's/-static//g' {} +
          find arch/arm64/kernel/vdso -type f -name "Makefile*" -exec sed -i 's/$(LDFLAGS)/$(filter-out -static,$(LDFLAGS))/g' {} +

          # --- 2. FIX POLLY: Elimină optimizările care crapă compilarea ---
          # Căutăm și ștergem orice referință la plugin-ul Polly sau optimizări de loop-uri specifice
          find . -type f -name "Makefile*" -exec sed -i 's/-mllvm -polly[^ ]*//g' {} +
          find . -type f -name "Makefile*" -exec sed -i 's/-mllvm -enable-loop-distribute//g' {} +
          find . -type f -name "Makefile*" -exec sed -i 's/-mllvm -enable-recursive-eval//g' {} +

          # --- 3. FORCE SELINUX PERMISSIVE ---
          sed -i 's/selinux_enforcing_boot = 1/selinux_enforcing_boot = 0/g' security/selinux/hooks.c || true

      - name: Setup Neutron Clang
        run: |
          mkdir clang
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang

      - name: Build Image.gz-dtb
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          
          MAKE_ARGS="ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            HOSTCC=clang \
            HOSTCXX=clang++ \
            HOSTLD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            O=out"
          
          make $MAKE_ARGS r5q_defconfig
          
          # --- CONFIGURARE ONEUI 7 & ANTI-BOOTLOOP ---
          # Dezactivăm SAR-ul vechi care căuta sda21
          printf "CONFIG_ANDROID_SAR_RAMDISK=n\n" >> out/.config
          
          # Activăm Device Mapper pentru Dynamic Partitions
          printf "CONFIG_BLK_DEV_DM=y\nCONFIG_DM_REMAPPER=y\nCONFIG_DM_UEVENT=y\nCONFIG_DM_VERITY=n\n" >> out/.config
          
          # Suport Android 15 (EROFS, APEX, BinderFS)
          printf "CONFIG_EROFS_FS=y\nCONFIG_EROFS_FS_ZIP=y\nCONFIG_BLK_DEV_INITRD=y\nCONFIG_ANDROID_BINDERFS=y\n" >> out/.config
          printf "CONFIG_BLK_DEV_LOOP=y\nCONFIG_BLK_DEV_LOOP_MIN_COUNT=16\n" >> out/.config
          
          # Dezactivare securitate Samsung
          printf "CONFIG_RKP_KDP=n\nCONFIG_KNOX_KAP=n\nCONFIG_SEC_ABC=n\n" >> out/.config
          
          # CMDLINE final
          printf "CONFIG_CMDLINE=\"loop.max_part=16 androidboot.force_normal_boot=1 androidboot.selinux=permissive\"\n" >> out/.config
          printf "CONFIG_CMDLINE_EXTEND=y\n" >> out/.config

          make $MAKE_ARGS olddefconfig
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-fcommon -Wno-error -w" O=out Image.gz-dtb

      - name: Upload Image.gz-dtb
        uses: actions/upload-artifact@v4
        with:
          name: Image-Lumi-PollyFix
          path: kernel/out/arch/arm64/boot/Image.gz-dtb
