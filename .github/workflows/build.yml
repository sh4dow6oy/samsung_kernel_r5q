name: Build Samsung Kernel r5q (GCC11)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
      CC: gcc
      KERNEL_DIR: ${{ github.workspace }}
      OUTPUT_DIR: ${{ github.workspace }}/out
      DEFCONFIG: r5q_eur_open_defconfig

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev dwarves \
            libncurses-dev git wget unzip make \
            gcc-11 g++-11 \
            gcc-aarch64-linux-gnu-11 g++-aarch64-linux-gnu-11 \
            binutils-aarch64-linux-gnu \
            python3

      - name: Set GCC 11
        run: |
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-11 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-11 100
          sudo update-alternatives --install /usr/bin/aarch64-linux-gnu-gcc aarch64-linux-gnu-gcc /usr/bin/aarch64-linux-gnu-gcc-11 100
          sudo update-alternatives --install /usr/bin/aarch64-linux-gnu-g++ aarch64-linux-gnu-g++ /usr/bin/aarch64-linux-gnu-g++-11 100

      - name: Disable gcc-wrapper
        run: |
          cd $KERNEL_DIR
          mv scripts/gcc-wrapper.py scripts/gcc-wrapper.py.disabled || true

      - name: Make defconfig
        run: |
          cd $KERNEL_DIR
          make O=$OUTPUT_DIR ARCH=$ARCH $DEFCONFIG

      - name: Build kernel
        run: |
          cd $KERNEL_DIR
          make -j$(nproc) O=$OUTPUT_DIR ARCH=$ARCH \
            CC=$CC CROSS_COMPILE=$CROSS_COMPILE

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-artifacts
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dts/*.dtb
            out/vmlinux
