name: Build sh4dow6oy Kernel - OpenELA 4.14.356 (Final SCSI Fix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Samsung Source
        uses: actions/checkout@v4
        with:
          repository: Roynas-Android-Playground/kernel_samsung_r3q
          ref: master

      - name: Install Dependencies
          # Adăugăm rsync pentru un merge mai inteligent
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev \
          ccache python3 python-is-python3 libarchive-tools wget zstd libtinfo6 zip \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi device-tree-compiler rsync

      - name: Setup Neutron Clang
        run: |
          mkdir -p clang
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang

      - name: Smart Merge & SCSI Header Fix
        run: |
          wget -q https://github.com/openela/kernel-lts/archive/refs/tags/v4.14.356-openela-rc1.tar.gz -O openela.tar.gz
          mkdir openela_src
          tar -xzf openela.tar.gz -C openela_src --strip-components=1
          
          # [FIX KernelSU]
          sed -i '/kernelsu/d' drivers/android/Kconfig
          
          # [MERGE] Aplicăm OpenELA peste tot codul de bază
          rsync -av openela_src/ .
          
          # [RESTORE CRITICAL SAMSUNG] Revenim la hardware-ul original Samsung
          # Acesta este pasul care ne asigură că avem r5q dts și drivere specifice
          git checkout HEAD -- arch/arm64/boot/dts
          git checkout HEAD -- drivers/video/fbdev/msm
          git checkout HEAD -- include/scsi/scsi.h
          git checkout HEAD -- include/scsi/scsi_ioctl.h
          
          # [NUCLEAR FIX SCSI] Dacă restabilirea headerelor nu ajută, dezactivăm bucata de cod problematică
          # deoarece SCSI_IOCTL este rar folosit în boot-ul de Android modern
          sed -i 's/case SCSI_IOCTL_GET_IDLUN:/#if 0\ncase SCSI_IOCTL_GET_IDLUN:/' drivers/scsi/scsi_ioctl.c
          sed -i 's/case SCSI_IOCTL_GET_PCI:/case SCSI_IOCTL_GET_PCI:\n#endif/' drivers/scsi/scsi_ioctl.c
          
          # Fix Nuclear Symbol
          echo 'void dma_contiguous_early_fixup(void *res_cma) { }' > drivers/base/samsung_stub.c
          echo 'obj-y += samsung_stub.o' >> drivers/base/Makefile

      - name: Build Kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export KBUILD_BUILD_USER="sh4dow6oy"
          export KBUILD_BUILD_HOST="OpenELA-Build"
          
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-mllvm -polly[^ ]*//g' {} +
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-mllvm//g' {} +
          [ -f arch/arm64/kernel/vdso/Makefile ] && sed -i 's/-static//g' arch/arm64/kernel/vdso/Makefile
          sed -i 's/ifneq ($(wildcard $(srctree)\/scripts\/gcc-wrapper.py),)/ifeq (0,1)/g' Makefile

          MAKE_ARGS="ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            O=out"

          make $MAKE_ARGS r5q_defconfig
          
          ./scripts/config --file out/.config \
            --set-str CONFIG_LOCALVERSION "-sh4dow6oy" \
            -e CONFIG_SAMSUNG_PRODUCT_SHIP \
            -e CONFIG_BUILD_ARM64_DTB_IMAGE \
            -e CONFIG_DTC \
            -d CONFIG_LTO -d CONFIG_LTO_CLANG -e CONFIG_LTO_NONE \
            -d CONFIG_WERROR
          
          make $MAKE_ARGS olddefconfig
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-fno-common -Wno-error -Wno-implicit-function-declaration -Wno-int-conversion"
          
          # Generare DTBs (S10 Lite are nevoie de ele)
          make $MAKE_ARGS dtbs
          make $MAKE_ARGS dtbo.img || echo "DTBO manual step"

      - name: AnyKernel3 Packaging
        run: |
          IMAGE=$(find out/arch/arm64/boot -name "Image.gz-dtb" -o -name "Image.gz" | head -n 1)
          # Căutăm orice fișier DTBO generat
          DTBO_FINAL=$(find out -name "dtbo.img" -o -name "dtbo" | head -n 1)

          git clone https://github.com/osm0sis/AnyKernel3.git
          rm -rf AnyKernel3/.git

          cp "$IMAGE" AnyKernel3/Image.gz
          if [ -f "$DTBO_FINAL" ]; then
            cp "$DTBO_FINAL" AnyKernel3/dtbo.img
            echo "SUCCESS: DTBO găsit și adăugat."
          fi

          sed -i 's/device.name1=maguro/device.name1=r5q/g' AnyKernel3/anykernel.sh
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
          
          cd AnyKernel3 && zip -r9 ../sh4dow6oy-Kernel-R5Q-OpenELA.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sh4dow6oy-Kernel-R5Q
          path: sh4dow6oy-Kernel-R5Q-OpenELA.zip
