name: Build Samsung Kernel r5q (Clang)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      ARCH: arm64
      KERNEL_DIR: ${{ github.workspace }}
      OUTPUT_DIR: ${{ github.workspace }}/out
      DEFCONFIG: r5q_eur_open_defconfig
      LLVM: 1
      CLANG_TRIPLE: aarch64-linux-gnu-
      CROSS_COMPILE: aarch64-linux-gnu-
      PATH: ${{ github.workspace }}/toolchain/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin:${PATH}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev dwarves \
            libncurses-dev git wget unzip make \
            python3 python3-distutils

      - name: Download Android NDK
        run: |
          mkdir -p toolchain
          cd toolchain
          wget https://dl.google.com/android/repository/android-ndk-r25b-linux.zip -O ndk.zip
          unzip ndk.zip -d ndk
          rm ndk.zip

      - name: Disable gcc-wrapper
        run: |
          cd $KERNEL_DIR
          mv scripts/gcc-wrapper.py scripts/gcc-wrapper.py.disabled || true

      - name: Make defconfig
        run: |
          cd $KERNEL_DIR
          make O=$OUTPUT_DIR ARCH=$ARCH $DEFCONFIG

      - name: Build kernel
        run: |
          cd $KERNEL_DIR
          make -j$(nproc) O=$OUTPUT_DIR ARCH=$ARCH LLVM=1 \
            CC=clang LD=ld.lld \
            CROSS_COMPILE=$CROSS_COMPILE \
            CLANG_TRIPLE=$CLANG_TRIPLE

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-artifacts
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dts/*.dtb
            out/vmlinux
