name: S10 Lite - Stock Kernel + Safe eBPF v1

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: mainey/android_kernel_samsung_r5q
          ref: lineage-19.0
          path: kernel
          fetch-depth: 1

      - name: Setup Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves make python3 lz4
          mkdir -p toolchain
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang

      - name: Apply Safe eBPF Backport
        run: |
          cd kernel
          sed -i '/enum bpf_cmd/i #define BPF_OBJ_NAME_LEN 16U' include/uapi/linux/bpf.h
          sed -i '/BPF_F__LAST_FIELD/i #define BPF_F_RDONLY_PROG (1U << 7)\n#define BPF_F_WRONLY_PROG (1U << 8)' include/uapi/linux/bpf.h
          echo '#if LINUX_VERSION_CODE < KERNEL_VERSION(5,0,0)' >> include/linux/bpf.h
          echo '#define access_ok(addr, size) access_ok(VERIFY_READ, addr, size)' >> include/linux/bpf.h
          echo '#endif' >> include/linux/bpf.h
          echo 'struct bpf_raw_event_map { struct bpf_map map; };' >> include/linux/bpf.h
          echo '#define PERF_BPF_EVENT_PROG_LOAD 1' >> include/linux/perf_event.h
          echo '#define PERF_BPF_EVENT_PROG_UNLOAD 2' >> include/linux/perf_event.h

      - name: Configure & Build
        run: |
          cd kernel
          export PATH=$(pwd)/../toolchain/proton-clang/bin:$PATH
          make ARCH=arm64 CC=clang r5q_eur_open_defconfig
          ./scripts/config --enable CONFIG_BPF_SYSCALL
          ./scripts/config --enable CONFIG_BPF_JIT
          ./scripts/config --enable CONFIG_CGROUP_BPF
          ./scripts/config --disable CONFIG_XDP_SOCKETS
          ./scripts/config --disable CONFIG_BPF_LSM
          ./scripts/config --disable CONFIG_DEBUG_INFO_BTF
          ./scripts/config --disable CONFIG_BPF_PRELOAD
          ./scripts/config --disable CONFIG_BPF_RAW_TRACEPOINTS
          ./scripts/config --disable CONFIG_NETFILTER_XT_MATCH_BPF
          make ARCH=arm64 CC=clang olddefconfig
          MAKE_ARGS="ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1"
          export KCFLAGS="-O2 -Wno-everything -Wno-error -Wno-implicit-function-declaration -Wno-int-conversion -Wno-incompatible-pointer-types"
          make -j$(nproc --all) $MAKE_ARGS Image.gz-dtb

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: s10-lite-safe-ebpf-kernel
          path: kernel/arch/arm64/boot/Image.gz-dtb
