name: Build Samsung SM8150 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        repository: sh4dow6oy/android_kernel_samsung_sm8150
        ref: auriana
        path: kernel

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm libncurses-dev wget git

    - name: Setup AOSP Clang (r383902)
      run: |
        mkdir -p clang
        wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/3857008389202edac32d57008bb8c99d2c957f9d/clang-r383902.tar.gz
        tar -xf clang-r383902.tar.gz -C clang
        echo "CLANG_BIN=$(pwd)/clang/bin" >> $GITHUB_ENV

    - name: Download AOSP GCC 4.9
      run: |
        git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 gcc64
        git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 gcc32
        echo "GCC64_BIN=$(pwd)/gcc64/bin" >> $GITHUB_ENV
        echo "GCC32_BIN=$(pwd)/gcc32/bin" >> $GITHUB_ENV

    - name: Build Kernel
      run: |
        cd kernel
        
        export PATH="${{ env.CLANG_BIN }}:${{ env.GCC64_BIN }}:${{ env.GCC32_BIN }}:$PATH"
        export ARCH=arm64
        export SUBARCH=arm64
        
        # Setează variabilele de bază
        export CC=clang
        export HOSTCC=gcc
        export CROSS_COMPILE=aarch64-linux-android-
        export CROSS_COMPILE_ARM32=arm-linux-androideabi-
        export CLANG_TRIPLE=aarch64-linux-gnu-

        # --- FIX 1: BYPASS CLANG ERROR ---
        # Adăugăm flag-ul de confirmare cerut de Clang direct în Makefile-ul principal
        # sau îl putem pasa în KCFLAGS. Cea mai sigură metodă este în Makefile.
        sed -i 's/-ftrivial-auto-var-init=zero/-ftrivial-auto-var-init=zero -enable-trivial-auto-var-init-zero-knowing-it-will-be-removed-from-clang/g' Makefile

        # Configurare
        cat arch/arm64/configs/sm8150_sec_defconfig arch/arm64/configs/sm8150_sec_r5q_eur_open.config > arch/arm64/configs/combined_defconfig
        
        # Dezactivăm Stack Protector Strong care a eșuat anterior
        echo "CONFIG_CC_STACKPROTECTOR_NONE=y" >> arch/arm64/configs/combined_defconfig
        echo "# CONFIG_CC_STACKPROTECTOR_STRONG is not set" >> arch/arm64/configs/combined_defconfig

        make O=out DTC_EXT=$(pwd)/scripts/dtc/dtc combined_defconfig
        make O=out DTC_EXT=$(pwd)/scripts/dtc/dtc olddefconfig

        # Compilare
        # Pasăm manual flag-ul și în KCFLAGS pentru a fi 100% siguri că e acoperit peste tot
        make -j$(nproc --all) O=out \
             DTC_EXT=$(pwd)/scripts/dtc/dtc \
             LD=ld.lld \
             KCFLAGS="-w -fno-stack-protector -enable-trivial-auto-var-init-zero-knowing-it-will-be-removed-from-clang"
        
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-SM8150-r5q
        path: |
          kernel/out/arch/arm64/boot/Image.gz-dtb
          kernel/out/arch/arm64/boot/dtbo.img
          kernel/out/.config
