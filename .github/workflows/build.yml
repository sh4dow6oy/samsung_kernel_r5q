name: Build Samsung S10 Lite (r5q) - Neutron Clang Final

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        repository: sh4dow6oy/android_kernel_samsung_a82xq
        ref: linux-4.14.285
        fetch-depth: 1

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential bison flex libssl-dev libelf-dev xz-utils wget git gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi zstd python3

    - name: Download and Setup Neutron Clang
      run: |
        mkdir -p neutron
        wget https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
        tar -I zstd -xf neutron-clang-10032024.tar.zst -C neutron
        echo "NEUTRON_BIN=$(pwd)/neutron/bin" >> $GITHUB_ENV

    - name: Surgical Source Patching
      run: |
        # 1. Eliminăm wrapper-ele de Python (Nuclear Fix)
        find . -name "Makefile*" -o -name "*.mak" -o -name "*.include" | xargs sed -i 's/python $(srctree)\/scripts\/gcc-wrapper.py//g'
        find . -name "Makefile*" -o -name "*.mak" -o -name "*.include" | xargs sed -i 's/$(srctree)\/scripts\/gcc-wrapper.py//g'
        sed -i 's/python / /g' Makefile scripts/Makefile.*

        # 2. Fix pentru drivers/clk/clk.c
        last_include=$(grep -n "#include" drivers/clk/clk.c | tail -n 1 | cut -d: -f1)
        sed -i "${last_include}a #include <linux/msm-bus.h>\nstatic uint32_t clk_debugfs_bus_cl_id;" drivers/clk/clk.c

        # 3. FIX GLOBAL PENTRU CAMERA MSM (Reparăm și corupția Makefile-urilor)
        CAM_PATH="drivers/media/platform/msm/camera"
        EXTRA_INCLUDES="-I\$(srctree)/$CAM_PATH/cam_core -I\$(srctree)/$CAM_PATH/cam_utils -I\$(srctree)/$CAM_PATH/cam_req_mgr -I\$(srctree)/$CAM_PATH/cam_sensor_module/cam_sensor_utils -I\$(srctree)/$CAM_PATH/cam_sync -I\$(srctree)/$CAM_PATH/cam_cpas"
        
        # Folosim un loop care asigură linie nouă înainte de injectare
        find $CAM_PATH -name "Makefile" | while read -r mkfile; do
          echo "" >> "$mkfile"
          echo "ccflags-y += $EXTRA_INCLUDES" >> "$mkfile"
        done
        
        # Fix pentru HID
        echo "" >> drivers/hid/Makefile
        echo "ccflags-y += -I\$(srctree)/\$(src)" >> drivers/hid/Makefile

        # 4. FIX pentru kperfmon
        mkdir -p ../system/core/liblog/include/log/
        mkdir -p ../../system/core/liblog/include/log/
        mkdir -p ../../system/logging/liblog/include/log/
        if [ -f include/linux/perflog.h ]; then
          cp include/linux/perflog.h ../system/core/liblog/include/log/perflog.h
          cp include/linux/perflog.h ../../system/core/liblog/include/log/perflog.h
          cp include/linux/perflog.h ../../system/logging/liblog/include/log/perflog.h
        fi
        
        # 5. Bypass secgetspf
        echo -e "#!/bin/bash\nexit 0" > scripts/secgetspf
        chmod +x scripts/secgetspf
        sudo cp scripts/secgetspf /usr/local/bin/secgetspf

    - name: Build Kernel
      run: |
        export PATH="${{ env.NEUTRON_BIN }}:$PATH"
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        
        export CC=clang
        export LD=ld.lld
        export AR=llvm-ar
        export NM=llvm-nm
        export OBJCOPY=llvm-objcopy
        export OBJDUMP=llvm-objdump
        export STRIP=llvm-strip

        make clean
        make mrproper
        make r5q_eur_open_defconfig
        
        make -j$(nproc --all) \
                      ARCH=arm64 \
                      CC=clang \
                      LD=ld.lld \
                      AR=llvm-ar \
                      NM=llvm-nm \
                      OBJCOPY=llvm-objcopy \
                      OBJDUMP=llvm-objdump \
                      STRIP=llvm-strip \
                      CLANG_TRIPLE=aarch64-linux-gnu- \
                      CROSS_COMPILE=aarch64-linux-gnu- \
                      CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
                      LLVM=1 \
                      LLVM_IAS=1 \
                      KCFLAGS="-w" \
                      DTC_EXT=dtc

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-S10Lite-r5q
        path: |
          arch/arm64/boot/Image.gz*
          arch/arm64/boot/dtbo.img
