name: Build S10 Lite Kernel (Proton Clang)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: sh4dow6oy/samsung_kernel_r5q
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev \
          ccache python3 python-is-python3 libarchive-tools libncurses-dev wget \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Download Proton Clang
        run: |
          git clone https://github.com/kdrag0n/proton-clang.git --depth=1 proton-clang

      - name: Build Kernel
        run: |
          # Punem proton-clang la sfârșitul PATH-ului sau îl definim manual
          # pentru a evita ca 'ld' din proton să suprascrie 'ld' din sistem
          PROTON_PATH=$GITHUB_WORKSPACE/proton-clang/bin
          
          # Parametrii pentru compilare
          # Observă forțarea HOSTLDFLAGS pentru a folosi linker-ul sistemului
          MAKE_ARGS="ARCH=arm64 \
            CC=$PROTON_PATH/clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            AR=$PROTON_PATH/llvm-ar \
            NM=$PROTON_PATH/llvm-nm \
            OBJCOPY=$PROTON_PATH/llvm-objcopy \
            OBJDUMP=$PROTON_PATH/llvm-objdump \
            STRIP=$PROTON_PATH/llvm-strip \
            LD=$PROTON_PATH/ld.lld \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            HOSTLDFLAGS=-fuse-ld=bfd \
            O=out"

          # 1. Configurare (r5q direct în configs)
          make $MAKE_ARGS r5q_eur_open_defconfig
          
          # 2. Patching Defconfig pentru eBPF/No Knox
          ./scripts/config --file out/.config \
            -d CONFIG_KNOX_KAP \
            -d CONFIG_SECURITY_SAMSUNG_KNOX \
            -d CONFIG_RKP_KDP \
            -d CONFIG_SAMSUNG_PRODUCT_SHIP \
            -e CONFIG_BPF \
            -e CONFIG_BPF_SYSCALL \
            -e CONFIG_BPF_JIT \
            -e CONFIG_CGROUP_BPF \
            -e CONFIG_NET_CLS_BPF \
            -e CONFIG_NET_ACT_BPF

          # 3. Build propriu-zis
          # Folosim PATH-ul original pentru host tools și calea absolută pentru restul
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-Wno-error -fcommon"

      - name: Upload Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-Kernel-A15
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/arch/arm64/boot/dtbo.img
