name: S10 Lite - Safe Core eBPF Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout S10 Lite Kernel Source
        uses: actions/checkout@v4
        with:
          repository: sh4dow6oy/samsung_kernel_r5q
          path: kernel-res
          fetch-depth: 1

      - name: Checkout Pascua Source (Temporary)
        uses: actions/checkout@v4
        with:
          repository: pascua28/android_kernel_samsung_sm8250
          ref: sixteen
          path: pascua-src
          fetch-depth: 1

      - name: Setup Proton Clang Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves make python3 lz4
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang

      - name: Surgical eBPF Transplant
        run: |
          # Mutăm fișierele necesare din sursa lui Pascua în sursa S10 Lite
          # Folosim -f pentru a suprascrie fișierele vechi/incomplete de la Samsung
          cp -f pascua-src/kernel/bpf/core.c kernel-res/kernel/bpf/
          cp -f pascua-src/kernel/bpf/syscall.c kernel-res/kernel/bpf/
          cp -f pascua-src/include/linux/bpf.h kernel-res/include/linux/
          cp -f pascua-src/include/linux/btf.h kernel-res/include/linux/
          cp -f pascua-src/include/uapi/linux/bpf.h kernel-res/include/uapi/linux/

          cd kernel-res
          # Patch-uri critice pentru compatibilitate 4.14 (Legacy Access)
          # În 4.14 access_ok avea 3 argumente, în 5.x+ are doar 2.
          sed -i 's/access_ok(VERIFY_READ, /access_ok(/g' kernel/bpf/syscall.c || true
          sed -i 's/access_ok(VERIFY_WRITE, /access_ok(/g' kernel/bpf/syscall.c || true
          
          # Fix pentru structurile de memorie (Pascua folosește un allocator mai nou)
          sed -i 's/kvmalloc_array/kmalloc_array/g' kernel/bpf/syscall.c || true

      - name: Configure Kernel for Android 15
        run: |
          cd kernel-res
          export PATH=$(pwd)/../toolchain/proton-clang/bin:$PATH
          make ARCH=arm64 CC=clang r5q_eur_open_defconfig
          
          # Activăm eBPF modern (esențial pentru Network Stack-ul A15)
          ./scripts/config --enable CONFIG_BPF_SYSCALL
          ./scripts/config --enable CONFIG_BPF_JIT
          ./scripts/config --enable CONFIG_CGROUP_BPF
          
          # Dezactivăm securitatea Samsung care ar bloca noile syscall-uri BPF
          ./scripts/config --disable CONFIG_SAMSUNG_PRODUCT_SHIP
          ./scripts/config --disable CONFIG_SECURITY_SAMSUNG_RKP
          
          make ARCH=arm64 CC=clang olddefconfig

      - name: Build Kernel
        run: |
          cd kernel-res
          export PATH=$(pwd)/../toolchain/proton-clang/bin:$PATH
          MAKE_ARGS="ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1"
          
          # Flag-uri de "iertare" pentru compilator
          export KCFLAGS="-Wno-everything -Wno-error -Wno-implicit-function-declaration -Wno-int-conversion -Wno-incompatible-pointer-types"
          
          make -j$(nproc --all) $MAKE_ARGS Image.gz-dtb

      - name: Upload Kernel Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-A15-eBPF-v141
          path: kernel-res/arch/arm64/boot/Image.gz-dtb
          
