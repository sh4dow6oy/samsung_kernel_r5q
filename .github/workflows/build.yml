name: S10 Lite Kernel Build - v123

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Fast Checkout
        uses: actions/checkout@v4
        with:
          repository: mainey/android_kernel_samsung_r5q
          ref: lineage-18.1
          path: kernel-res
          fetch-depth: 1

      - name: Setup Proton Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves make python3 lz4 perl git curl
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang

      - name: Surgical Fixes (HID, Firmware & Camera)
        run: |
          cd kernel-res
          
          # 1. FIX HID-TRACE (Eroarea principala din log)
          # Dezactivam complet tracing-ul HID din Makefile pentru a evita eroarea de header missing
          sed -i 's/obj-$(CONFIG_HID_TRACE)		+= hid-trace.o//g' drivers/hid/Makefile
          
          # 2. FIX MISSING FIRMWARE (y771_r5.bin)
          # Cream folderul si un fisier binar gol ca sa nu mai crape build-ul
          mkdir -p firmware/tsp_sec
          touch firmware/tsp_sec/y771_r5.bin
          
          # 3. FIX CAMERA ISP (Variabila 'i')
          find . -type f -name "cam_vfe_bus_ver3.c" -exec sed -i 's/uint32_t                     i;/uint32_t                     i = 0;/g' {} +
          
          # 4. COMPILER FIX
          sed -i '/#define __builtin_assume_aligned/d' include/linux/compiler-clang.h
          
          # 5. SAMSUNG MODEM LOGGING SYNTAX FIX
          find drivers/soc/samsung -name "*.c" -exec sed -i 's/pr_err(".*"):$/& ;/g' {} +

      - name: Configure for Android 15
        run: |
          cd kernel-res
          # Activam suportul BPF
          ./scripts/config --file arch/arm64/configs/r5q_eur_open_defconfig --enable CONFIG_BPF_SYSCALL
          ./scripts/config --file arch/arm64/configs/r5q_eur_open_defconfig --enable CONFIG_BPF_JIT
          ./scripts/config --file arch/arm64/configs/r5q_eur_open_defconfig --enable CONFIG_CGROUP_BPF
          ./scripts/config --file arch/arm64/configs/r5q_eur_open_defconfig --enable CONFIG_NETFILTER_XT_MATCH_BPF
          
          # Dezactivam manual HID_TRACE in defconfig
          ./scripts/config --file arch/arm64/configs/r5q_eur_open_defconfig --disable CONFIG_HID_TRACE

      - name: Build Kernel
        run: |
          cd kernel-res
          export PATH=$(pwd)/../toolchain/proton-clang/bin:$PATH
          MAKE_ARGS="ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1"
          
          # Adaugam flag-ul pentru a ignora cautarea in include/trace
          export KCFLAGS="-Wno-everything -Wno-error -Wno-macro-redefined -I$(pwd)/drivers/hid"

          make $MAKE_ARGS r5q_eur_open_defconfig
          make -j$(nproc --all) $MAKE_ARGS Image.gz-dtb || make -j$(nproc --all) $MAKE_ARGS Image.gz

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-A15-v123
          path: |
            kernel-res/arch/arm64/boot/Image.gz-dtb
            kernel-res/arch/arm64/boot/Image.gz
