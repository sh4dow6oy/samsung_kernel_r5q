name: S10 Lite (V24 - Assembler & Headers Fix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Your Kernel Source
        uses: actions/checkout@v4
        with:
          repository: sh4dow6oy/samsung_kernel_r5q
          ref: master
          fetch-depth: 1

      - name: Setup Build Cache
        uses: actions/cache@v4
        with:
          path: |
            clang
            out
          key: ${{ runner.os }}-r5q-v24-final
          restore-keys: |
            ${{ runner.os }}-r5q-v24-

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex git libssl-dev libelf-dev clang llvm lld zstd curl python3 device-tree-compiler gcc-aarch64-linux-gnu

      - name: Download Neutron Clang
        run: |
          if [ ! -d "clang/bin" ]; then
            mkdir -p clang
            wget https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
            tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang
          fi

      - name: Build Kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          
          # Parametrii critici pentru a evita /usr/bin/as
          MAKE_ARGS="ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            O=out"

          # 1. FIX: Creare Mock Headers pentru log/perflog.h
          # Samsung cauta aceste fisiere in foldere de sistem Android care nu exista aici
          mkdir -p system/core/liblog/include/log
          mkdir -p system/logging/liblog/include/log
          touch system/core/liblog/include/log/perflog.h
          touch system/logging/liblog/include/log/perflog.h

          # 2. FIX: Stergere secgetspf din Makefile-uri (preventiv)
          find . -name "Makefile*" -exec sed -i 's/$(shell secgetspf)//g' {} +
          find . -name "Makefile*" -exec sed -i 's/secgetspf//g' {} +

          # 3. Config
          make $MAKE_ARGS g770f_defconfig

          # 4. Dezactivare protectii care blocheaza compiler check
          ./scripts/config --file out/.config \
            -d CONFIG_CC_STACKPROTECTOR_STRONG \
            -e CONFIG_CC_STACKPROTECTOR_NONE \
            -d CONFIG_CC_WERROR

          make $MAKE_ARGS olddefconfig

          # 5. Compilare (Adaugam --target pentru siguranta asamblorului)
          make -j$(nproc --all) $MAKE_ARGS \
            KCFLAGS="--target=aarch64-linux-gnu -fcommon -fno-stack-protector -Wno-error" \
            2>&1 | tee build.log

      - name: Package with AnyKernel3
        if: success()
        run: |
          git clone https://github.com/osm0sis/AnyKernel3
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/ || echo "No Image"
          cp out/arch/arm64/boot/dtbo.img AnyKernel3/ || echo "No DTBO"
          cd AnyKernel3
          sed -i 's/device.name1=maguro/device.name1=r5q/' anykernel.sh
          sed -i 's|block=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot|block=/dev/block/bootdevice/by-name/boot|' anykernel.sh
          zip -r ../S10Lite-G770F-V24.zip *

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-Build-V24
          path: |
            S10Lite-G770F-V24.zip
            build.log
