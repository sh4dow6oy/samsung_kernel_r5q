name: Build Kernel R5Q
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: sh4dow6oy/kernel_samsung_r5q
          ref: master
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev \
          ccache python3 python-is-python3 libarchive-tools wget zstd libtinfo6 zip

      - name: Build Custom DTC
        run: |
          echo "--- Building Upstream DTC ---"
          git clone --depth=1 https://git.kernel.org/pub/scm/utils/dtc/dtc.git
          cd dtc && make -j$(nproc)
          echo "DTC_PATH=$(pwd)/dtc" >> $GITHUB_ENV

      - name: Setup Google Clang r428724
        run: |
          echo "--- Setup Google Clang r428724 ---"
          mkdir -p toolchain/clang-r428724
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/6e4168587705b4a80f58adaa288a8bb75f13da68/clang-r428724.tar.gz -O clang.tar.gz
          tar -xf clang.tar.gz -C toolchain/clang-r428724
          rm clang.tar.gz
          
          # FIX: Symlink pentru readelf cerut de scripturile Samsung
          ln -sf $(pwd)/toolchain/clang-r428724/bin/llvm-readelf $(pwd)/toolchain/clang-r428724/bin/aarch64-linux-gnu-readelf
          
          # Adăugăm toolchain-ul în variabila PATH pentru pașii următori
          echo "$(pwd)/toolchain/clang-r428724/bin" >> $GITHUB_PATH

      - name: Build Kernel
        run: |
          # Adăugăm DTC-ul custom în PATH
          export PATH="$DTC_PATH:$PATH"
          
          # 1. NUCLEAR CLEANUP (Prevenim Error 1 cauzată de flag-uri LLVM incompatibile)
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-mllvm -polly[^ ]*//g' {} +
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-mllvm//g' {} +
          
          # 2. FIX: Samsung gcc-wrapper workaround
          sed -i 's/ifneq ($(wildcard $(srctree)\/scripts\/gcc-wrapper.py),)/ifeq (0,1)/g' Makefile
          
          # 3. Argumente Build
          MAKE_ARGS="ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            DTC=dtc \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            O=out"

          # 4. Configurare
          make $MAKE_ARGS r5q_defconfig
          
          # Dezactivăm opțiunile care cauzează crash-uri la compilare pe Clang-ul Google
          ./scripts/config --file out/.config \
            -e CONFIG_THINLTO \
            -d CONFIG_CC_STACKPROTECTOR_STRONG -e CONFIG_CC_STACKPROTECTOR_NONE \
            -d CONFIG_KSU
          
          make $MAKE_ARGS olddefconfig

          # 5. Compilare
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-fcommon -Wno-error -Wno-unused-command-line-argument"

      - name: Package with AnyKernel3
        run: |
          IMAGE="$GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz-dtb"
          if [ ! -f "$IMAGE" ]; then IMAGE="$GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz"; fi
          DTBO="$GITHUB_WORKSPACE/out/arch/arm64/boot/dtbo.img"
          
          git clone https://github.com/osm0sis/AnyKernel3.git
          rm -rf AnyKernel3/.git
          cp $IMAGE AnyKernel3/Image.gz
          [ -f "$DTBO" ] && cp $DTBO AnyKernel3/dtbo.img
          
          sed -i 's/device.name1=maguro/device.name1=r5q/g' AnyKernel3/anykernel.sh
          sed -i 's/device.name2=toroplus/device.name2=SM-G770F/g' AnyKernel3/anykernel.sh
          
          cd AnyKernel3
          zip -r9 ../Kernel-S10Lite-R5Q-GoogleClang.zip *

      - name: Upload Flashable Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-S10Lite-R5Q
          path: Kernel-S10Lite-R5Q-GoogleClang.zip
