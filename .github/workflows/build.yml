name: Build r5q Kernel - Modern eBPF (lineage-23.2)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev python3 clang llvm lld

      - name: Clone Mainey Kernel
        run: |
          git clone --depth=1 https://github.com/mainey/android_kernel_samsung_r5q.git -b lineage-19.0 kernel
          cd kernel
          git config user.email "wizard@build.com"
          git config user.name "Kernel-Wizard"

      - name: 1. Import Modern eBPF from Xiaomi 23.2
        run: |
          cd kernel
          # Adaugam Xiaomi ca sursa pentru eBPF modern (Android 15)
          git remote add xiaomi https://github.com/LineageOS/android_kernel_xiaomi_sm6150.git
          git fetch xiaomi lineage-23.2 --depth=1
          
          # Inlocuim complet infrastructura eBPF veche cu cea moderna
          git checkout xiaomi/lineage-23.2 -f -- \
            include/linux/bpf.h \
            include/linux/bpf_verifier.h \
            include/linux/filter.h \
            include/uapi/linux/bpf.h \
            kernel/bpf/ \
            net/core/filter.c
          
          git add .
          git commit -m "Integrated modern eBPF subsystem from lineage-23.2"

      - name: 2. Critical Fixes for Samsung Compatibility
        run: |
          cd kernel
          # Fix 'bool' unknown type in filter.h
          sed -i 's/#define _LINUX_FILTER_H/#define _LINUX_FILTER_H\n#include <linux/types.h>/g' include/linux/filter.h
          
          # Rezolvam simbolurile de retea (Samsung foloseste variante standard)
          sed -i 's/dev_get_by_index_rcu/dev_get_by_index/g' net/core/filter.c
          
          # Sincronizam alocatorul de memorie Xiaomi cu kernel-ul Samsung
          sed -i 's/static void \*bpf_map_area_alloc/void \*bpf_map_area_alloc/g' kernel/bpf/syscall.c || true
          sed -i 's/static void bpf_map_area_free/void bpf_map_area_free/g' kernel/bpf/syscall.c || true
          
          # Fix Samsung Traps & Makefile
          sed -i 's/sec_debug_sched_msg/\/\/ sec_debug_sched_msg/g' arch/arm64/kernel/traps.c
          sed -i 's|$(srctree)/../toolchain/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin/aarch64-linux-android-||g' Makefile
          
          # Securitate Samsung bypass
          echo -e "#!/bin/sh\necho '00000000000000000000000000000000'\nexit 0" > secgetspf
          chmod +x secgetspf

      - name: 3. Configure and Build
        run: |
          cd kernel
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export PATH=$PATH:$(pwd)

          mkdir -p out
          make O=out ARCH=arm64 r5q_eur_open_defconfig
          
          # Activam suportul eBPF complet (necesar pentru noul kernel/bpf/)
          ./scripts/config --file out/.config -e BPF -e BPF_SYSCALL -e BPF_JIT -e CGROUP_BPF
          ./scripts/config --file out/.config -e NETFILTER_XT_MATCH_BPF -e NET_ACT_BPF -e BPF_STREAM_PARSER
          ./scripts/config --file out/.config -e NET_CLS_ACT -e NET_CLS_BPF -e STREAM_PARSER
          ./scripts/config --file out/.config --set-val NR_CPUS 8
          ./scripts/config --file out/.config -d SEC_DEBUG
          
          yes "" | make O=out ARCH=arm64 oldconfig
          
          # Compilare cu flag-uri de compatibilitate
          make -j$(nproc --all) O=out ARCH=arm64 \
            LD=ld.lld \
            KCFLAGS="-Wno-error -Wno-implicit-function-declaration -fcommon -DNR_CPUS=8"

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-r5q-Modern-BPF-A15
          path: |
            kernel/out/arch/arm64/boot/Image.gz-dtb
            kernel/out/arch/arm64/boot/dtbo.img
