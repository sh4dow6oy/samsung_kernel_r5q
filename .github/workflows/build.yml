name: Build S10 Lite (r5q) Kernel - Neutron Clang

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Base (pascua28)
        uses: actions/checkout@v4
        with:
          repository: pascua28/android_kernel_samsung_sm7150
          ref: sixteen
          path: kernel

      - name: Checkout S10 Lite DTS (Roynas Source)
        uses: actions/checkout@v4
        with:
          repository: Roynas-Android-Playground/kernel_samsung_r3q
          ref: master
          path: roynas_source
          sparse-checkout: |
            arch/arm64/boot/dts/samsung/renovation

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential bison flex libssl-dev libelf-dev clang lld llvm zip
          mkdir -p bin

      - name: Install Neutron Clang
        run: |
          curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
          chmod +x antman
          ./antman -S
          echo "$GITHUB_WORKSPACE/neutron-clang/bin" >> $GITHUB_PATH

      - name: Patch Kernel Config and Inject DTS
        run: |
          cd kernel
          # 1. Injectăm fișierele DTS/DTBO de S10 Lite (r5q)
          mkdir -p arch/arm64/boot/dts/samsung/renovation
          cp -r ../roynas_source/arch/arm64/boot/dts/samsung/renovation/* arch/arm64/boot/dts/samsung/renovation/
          
          # 2. Adăugăm Overlay-ul în Makefile-ul Samsung (Folosim ARCH_SM8150 conform bazei)
          echo 'dtbo-$(CONFIG_ARCH_SM8150) += renovation/sm8150-sec-r5q-overlay-r00.dtbo' >> arch/arm64/boot/dts/samsung/Makefile

          # 3. Creăm fragmentul r5q.config (Hardware specific)
          # Folosim setările din a71.config ca punct de plecare pentru senzori/camera
          cp arch/arm64/configs/a71.config arch/arm64/configs/r5q.config
          
          cat <<EOF >> arch/arm64/configs/r5q.config
          # S10 Lite Hardware Specifics
          CONFIG_MACH_SAMSUNG_R5Q=y
          CONFIG_PANEL_S6E3HA8=y
          CONFIG_TOUCHSCREEN_ST_STSA354=y
          CONFIG_TOUCHSCREEN_SEC_TS=y
          CONFIG_FUELGAUGE_MAX17055=y
          CONFIG_CHARGER_MAX77705=y
          CONFIG_BATTERY_SAMSUNG_V2=y
          CONFIG_SND_SOC_WCD937X=y
          CONFIG_SND_SOC_SAMSUNG_AUDIO=y
          CONFIG_SEC_ABC=n
          CONFIG_SEC_DEBUG=y
          EOF

      - name: Build Kernel
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/neutron-clang/bin:$PATH"
          
          # 1. Generăm config-ul fără interacțiune umană (yes "" | ...)
          # Asta previne blocarea în prompt-urile de tip [N/m/y/?] văzute în log
          yes "" | make O=out ARCH=arm64 vendor/sm8150-perf_defconfig r5q.config
          
          # 2. Patch direct pentru a evita eroarea de Stack Protector dacă compilatorul dă rateuri
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/CONFIG_CC_STACKPROTECTOR_NONE=y/g' out/.config
          
          # 3. Compilarea propriu-zisă
          # Adăugăm flag-uri pentru a ignora scripturile Samsung lipsă (secgetspf)
          make -j$(nproc --all) O=out \
               ARCH=arm64 \
               CC=clang \
               CLANG_TRIPLE=aarch64-linux-gnu- \
               CROSS_COMPILE=aarch64-linux-gnu- \
               CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
               LD=ld.lld \
               AR=llvm-ar \
               NM=llvm-nm \
               OBJCOPY=llvm-objcopy \
               OBJDUMP=llvm-objdump \
               STRIP=llvm-strip \
               CONFIG_LTO_CLANG_NONE=y \
               KCFLAGS="-Wno-error" # Ignoră avertismentele care pot opri build-ul
      - name: Prepare AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          # Verificăm dacă fișierul a fost generat
          if [ -f kernel/out/arch/arm64/boot/Image.gz-dtb ]; then
            cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          else
            cp kernel/out/arch/arm64/boot/Image.gz AnyKernel3/
          fi
          
          # Luăm DTBO-ul generat pentru S10 Lite
          find kernel/out/arch/arm64/boot/dts/samsung/ -name "*.dtbo" -exec cp {} AnyKernel3/dtbo.img \;
          
          cd AnyKernel3
          sed -i 's/device.name1=maguro/device.name1=r5q/g' anykernel.sh
          zip -r ../S10Lite-Neutron-Kernel.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-Kernel-Flashable
          path: S10Lite-Kernel-Neutron.zip
