name: S10 Lite - Safe eBPF v5 (Clean Patch)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: mainey/android_kernel_samsung_r5q
          ref: lineage-19.0
          path: kernel
          fetch-depth: 1

      - name: Setup Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves make python3 lz4
          mkdir -p toolchain
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang

      - name: Patch BPF & Cleanup Makefile
        run: |
          cd kernel
          # 1. Resetăm bpf.h la starea originală pentru a evita dublările din build-urile trecute
          git checkout include/uapi/linux/bpf.h

          # 2. Inserăm constantele BPF corect (Sintaxă fixă pentru Enum)
          # Folosim un marker existent (BPF_OBJ_GET) pentru a insera noile tipuri
          sed -i '/BPF_OBJ_GET,/a \	BPF_OBJ_NAME_LEN = 16,' include/uapi/linux/bpf.h
          
          # Căutăm BPF_F_WRONLY și inserăm flag-urile imediat după, cu virgulă la final
          sed -i '/BPF_F_WRONLY[[:space:]]*=[[:space:]]*(1U << 6),/a \	BPF_F_RDONLY_PROG = (1U << 7),\n	BPF_F_WRONLY_PROG = (1U << 8),' include/uapi/linux/bpf.h

          # 3. Bypass Samsung Security (SPF) - Trebuie să fie vizibil global
          echo -e "#!/bin/sh\necho '00000000000000000000000000000000'\nexit 0" > secgetspf
          chmod +x secgetspf
          sudo cp secgetspf /usr/local/bin/

          # 4. Curățăm Makefile de path-uri brute
          sed -i 's|$(srctree)/../toolchain/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin/aarch64-linux-android-||g' Makefile

          # 5. Adăugăm structura lipsă în header-ul de sistem
          echo 'struct bpf_raw_event_map { struct bpf_map map; };' >> include/linux/bpf.h

      - name: Configure & Build
        run: |
          cd kernel
          export PATH=$(pwd):$(pwd)/../toolchain/proton-clang/bin:$PATH
          
          # Argumente de build pentru LLVM/Clang
          export MAKE_ARGS="ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1"
          
          # Generăm config-ul
          make $MAKE_ARGS r5q_eur_open_defconfig
          
          # Forțăm activarea eBPF
          ./scripts/config --enable CONFIG_BPF_SYSCALL
          ./scripts/config --enable CONFIG_BPF_JIT
          ./scripts/config --enable CONFIG_CGROUP_BPF
          ./scripts/config --disable CONFIG_DEBUG_INFO_BTF
          ./scripts/config --disable CONFIG_SECURITY_SAMSUNG_RKP
          
          make $MAKE_ARGS olddefconfig
          
          # Compilare cu flag-uri de compatibilitate
          export KCFLAGS="-Wno-everything -Wno-error -fcommon -DNR_CPUS=8"
          make -j$(nproc --all) $MAKE_ARGS Image.gz-dtb

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: s10-lite-ebpf-v21
          path: kernel/arch/arm64/boot/Image.gz-dtb
