name: S10 Lite - Stock Build (Clang + Prebuilts Combo)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves libncurses-dev git wget make python2 python3 pahole tar xz-utils lib32z1

      - name: Setup Combined Toolchain
        run: |
          mkdir -p toolchain/combined
          
          # 1. Descarcăm și extragem Prebuilts (GCC)
          wget -L "https://github.com/sh4dow6oy/samsung_kernel_r5q/releases/download/GCC/prebuilts.tar" -O prebuilts.tar
          tar -xf prebuilts.tar -C toolchain/combined
          
          # 2. Descarcăm și extragem Clang r416183b peste ele
          wget -L "https://github.com/sh4dow6oy/samsung_kernel_r5q/releases/download/GCC/clang-r416183b.tar" -O clang.tar
          tar -xf clang.tar -C toolchain/combined
          
          # Detectăm căile recursiv
          CLANG_BIN=$(find $(pwd)/toolchain/combined -name clang -type f -printf '%h\n' | head -n 1)
          GCC_BIN=$(find $(pwd)/toolchain/combined -name "aarch64-linux-android-gcc" -type f -printf '%h\n' | head -n 1)
          GCC_ARM32=$(find $(pwd)/toolchain/combined -name "arm-linux-androideabi-gcc" -type f -printf '%h\n' | head -n 1)
          
          echo "CLANG_PATH=$CLANG_BIN" >> $GITHUB_ENV
          echo "GCC_PATH=$GCC_BIN" >> $GITHUB_ENV
          echo "GCC_ARM32_PATH=$GCC_ARM32" >> $GITHUB_ENV
          
          echo "Toolchain Detection:"
          echo "Clang: $CLANG_BIN"
          echo "GCC 64: $GCC_BIN"
          echo "GCC 32: $GCC_ARM32"

      - name: Essential Fixes
        run: |
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          mkdir -p system/core/liblog/include/log
          echo -e "#ifndef _PERFLOG_H\n#define _PERFLOG_H\n#endif" > system/core/liblog/include/log/perflog.h
          
          # Dezactivăm Werror global pentru a trece de warning-urile Clang r416
          sed -i 's/-Werror//g' Makefile || true
          
          # Fix pentru compatibilitate tip poll_t
          sed -i '/#define _UAPI_LINUX_TYPES_H/a #ifndef __poll_t\n#ifndef __ASSEMBLY__\ntypedef unsigned int __poll_t;\n#endif\n#define __poll_t __poll_t\n#endif' include/uapi/linux/types.h

      - name: Build Kernel
        run: |
          # Adăugăm toolchain-urile în PATH
          export PATH="${{ env.CLANG_PATH }}:${{ env.GCC_PATH }}:${{ env.GCC_ARM32_PATH }}:$PATH"
          
          # Argumente optimizate pentru Clang Google Prebuilt
          MAKE_ARGS="
            O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
          "

          rm -rf out && mkdir -p out
          
          # Configurare
          make $MAKE_ARGS r5q_eur_open_defconfig
          
          # Fix Stack Protector (Bypass Clang 12+ version check)
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/CONFIG_CC_STACKPROTECTOR_NONE=y/g' out/.config
          make $MAKE_ARGS olddefconfig
          
          # Pregătire headere
          make $MAKE_ARGS prepare scripts -j$(nproc --all)
          
          # Build propriu-zis
          make -j$(nproc --all) $MAKE_ARGS || (echo "Eroare detectată, reluăm cu J1 pentru detalii..." && make -j1 $MAKE_ARGS)

          if [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image .
            [ -f out/arch/arm64/boot/dtbo.img ] && cp out/arch/arm64/boot/dtbo.img .
            echo "SUCCESS=true" >> $GITHUB_ENV
          fi

      - name: Upload Artifacts
        if: env.SUCCESS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-Kernel-Clang-Combo
          path: |
            Image
            dtbo.img
