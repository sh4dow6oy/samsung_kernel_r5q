name: Build R5Q - V107 DTS Transplant

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Ducky Kernel (4.19)
        uses: actions/checkout@v4
        with:
          repository: duckyduckG/android_kernel_qcom_sm8150_419
          ref: lineage-23.2
          path: kernel

      - name: Transplant DTS & Headers from Mainey
        run: |
          # 1. Clonăm sursa Mainey temporar
          git clone --depth=1 https://github.com/mainey/android_kernel_samsung_r5q -b lineage-19.0 mainey_source
          
          # 2. Copiem folderul samsung în dts/vendor
          mkdir -p kernel/arch/arm64/boot/dts/vendor/samsung
          cp -r mainey_source/arch/arm64/boot/dts/vendor/samsung/* kernel/arch/arm64/boot/dts/vendor/samsung/
          
          # 3. CRITIC: Copiem headerele specifice Samsung (dt-bindings)
          # Multe DTS-uri depind de constantele de aici
          mkdir -p kernel/include/dt-bindings/vendor/samsung
          cp -r mainey_source/include/dt-bindings/vendor/samsung/* kernel/include/dt-bindings/vendor/samsung/ 2>/dev/null || true
          
          # 4. Modificăm Makefile-ul de vendor pentru a recunoaște noul folder samsung
          if ! grep -q "samsung" kernel/arch/arm64/boot/dts/vendor/Makefile; then
            echo 'subdir-y += samsung' >> kernel/arch/arm64/boot/dts/vendor/Makefile
          fi

      - name: Setup Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y bc libssl-dev python3 bison flex libncurses6 libncurses-dev git gcc-aarch64-linux-gnu zstd device-tree-compiler
          sudo ln -sf /usr/bin/python3 /usr/bin/python
          mkdir -p clang
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang

      - name: Build V107
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          MAKE_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- O=out"
          
          # Folosim config-ul sm8150 ca bază
          make $MAKE_ARGS vendor/sm8150-perf_defconfig
          
          # Injectăm forțat suportul Samsung și R5Q
          ./scripts/config --file out/.config \
            -e CONFIG_MACH_SAMSUNG \
            -e CONFIG_MACH_R5Q \
            -e CONFIG_BUILD_ARM64_DT_OVERLAY \
            -e CONFIG_LTO_CLANG_THIN \
            -d CONFIG_SAMSUNG_RTIC \
            -d CONFIG_WERROR
            
          make $MAKE_ARGS olddefconfig
          
          # Build - Acum ar trebui să vadă și folderul samsung datorită Makefile-ului patch-uit
          make -j$(nproc --all) $MAKE_ARGS V=1 Image.gz dtbs dtbo.img

      - name: Assemble AnyKernel3
        run: |
          OUT="kernel/out/arch/arm64/boot"
          if [ -f "$OUT/Image.gz" ]; then
            git clone https://github.com/osm0sis/AnyKernel3.git AK3
            cp $OUT/Image.gz AK3/
            
            # Căutăm DTB-ul generat din transplant
            DTB=$(find $OUT/dts -name "*r5q*.dtb" | head -n 1)
            [ -f "$DTB" ] && cat $OUT/Image.gz $DTB > AK3/Image.gz
            
            # Căutăm imaginea DTBO
            DTBO=$(find kernel/out -name "dtbo.img" | head -n 1)
            [ -f "$DTBO" ] && cp $DTBO AK3/dtbo.img
            
            cd AK3 && zip -r9 ../R5Q_Transplant_V107.zip *
          else
            echo "Eroare: Transplantul a cauzat crash la compilare. Verifică erorile de tip 'include file not found'."
            exit 1
          fi

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-R5Q-V107
          path: R5Q_Transplant_V107.zip
