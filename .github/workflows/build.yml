name: R5Q BPF - Vmalloc & Memory Fix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout LumiPlayground Source
        uses: actions/checkout@v4
        with:
          repository: LumiPlayground/android_kernel_samsung_sm8150
          ref: rawr-bpf
          fetch-depth: 1

      - name: Setup & Memory Architecture Patch
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd bc build-essential gcc-aarch64-linux-gnu libssl-dev libelf-dev python3 python-is-python3
          sudo ln -sf /usr/bin/python3 /usr/bin/python2
          
          # 1. FIX PENTRU KVMALLOC (Eroarea din vmalloc.c)
          # Injectăm definiția kvmalloc în mm.h dacă lipsește, pentru a fi vizibilă global
          echo -e "\nstatic inline void *kvmalloc(size_t size, gfp_t flags)\n{\n\tif (size > PAGE_SIZE)\n\t\treturn vmalloc(size);\n\treturn kmalloc(size, flags);\n}\n" >> include/linux/mm.h
          
          # 2. FIX PENTRU BPF HEADERS
          sed -i '1i #include <linux/mm.h>\n#include <linux/slab.h>\n#include <linux/vmalloc.h>' kernel/bpf/core.c
          sed -i '1i #include <linux/mm.h>\n#include <linux/slab.h>\n#include <linux/vmalloc.h>' kernel/bpf/syscall.c
          
          # 3. Patch Python Syntax (gcc-wrapper.py)
          sed -i 's/print >> sys.stderr, \(.*\)/print(\1, file=sys.stderr)/g' scripts/gcc-wrapper.py
          
          # Descărcare Neutron Toolchain
          mkdir clang-neutron
          wget https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang-neutron

      - name: Build Kernel
        run: |
          export PATH=$(pwd)/clang-neutron/bin:$PATH
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          KERNEL_LLVM_BIN=$(pwd)/clang-neutron/bin/clang
          CLANG_TRIPLE=aarch64-linux-gnu-
          
          # Fix headere Samsung hardcoded
          mkdir -p system/core/liblog/include/log/
          touch system/core/liblog/include/log/perflog.h

          # 1. Config (Folosim config-ul R5Q din sursa Lumi)
          make O=out ARCH=arm64 CROSS_COMPILE=$CROSS_COMPILE REAL_CC=$KERNEL_LLVM_BIN CLANG_TRIPLE=$CLANG_TRIPLE r5q_eur_open_defconfig
          
          # 2. Optimizări pentru stabilitate BPF
          ./scripts/config --file out/.config --enable BPF --enable BPF_SYSCALL --enable BPF_JIT
          ./scripts/config --file out/.config --disable KPROBES --disable FUNCTION_TRACER
          
          make O=out ARCH=arm64 CROSS_COMPILE=$CROSS_COMPILE REAL_CC=$KERNEL_LLVM_BIN CLANG_TRIPLE=$CLANG_TRIPLE olddefconfig

          # 3. Compilare principală
          make -j$(nproc --all) O=out ARCH=arm64 \
               CROSS_COMPILE=$CROSS_COMPILE \
               REAL_CC=$KERNEL_LLVM_BIN \
               CLANG_TRIPLE=$CLANG_TRIPLE \
               KCFLAGS="-w -Wno-error -D__BPF_TRUNC_STRLEN=64"

      - name: Package AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3
          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          else
            cp out/arch/arm64/boot/Image.gz AnyKernel3/ || cp out/arch/arm64/boot/Image AnyKernel3/
          fi
          cd AnyKernel3 && zip -r9 ../R5Q-A15-Kernel.zip * -x .git README.md

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-R5Q-Vmalloc-Fixed
          path: R5Q-A15-Kernel.zip
