name: S10 Lite Kernel Build - Upstream CIP & A15 Fixes

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Avem nevoie de tot istoricul pentru Upstream

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev dwarves \
            libncurses-dev git wget unzip make python2 \
            python3 python3-minimal lz4 xz-utils gcc g++ pahole

      - name: Download Proton Clang
        run: |
          mkdir -p toolchain
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang

      - name: Upstream Integration (Linux-CIP)
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

          # Adăugăm sursa oficială stabilă
          git remote add upstream https://git.kernel.org/pub/scm/linux/kernel/git/cip/linux-cip.git
          git fetch upstream linux-4.14.y-cip --depth=100

          # Încercăm un merge automat. 
          # Folosim '-X theirs' pentru a accepta patch-urile de securitate oficiale peste codul vechi
          git merge upstream/linux-4.14.y-cip -m "Merge Linux-CIP Upstream" || echo "Conflicte detectate, rezolvăm selectiv..."

          # FORȚĂM subsystemul BPF să fie cel din CIP (pentru compatibilitate Android 15)
          git checkout upstream/linux-4.14.y-cip -- kernel/bpf/
          git checkout upstream/linux-4.14.y-cip -- include/linux/bpf.h
          git checkout upstream/linux
