name: Samsung SM8150 (r5q) - Linker Fix - V20

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: sh4dow6oy/android_kernel_samsung_sm8150-5.4
          path: kernel
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libncurses-dev git zstd python3 gzip

      - name: Download & Extract Neutron Clang
        run: |
          mkdir -p neutron
          wget https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C neutron/

      - name: Patch Source Code (Fix All Conflicts)
        run: |
          cd kernel
          # 1. Fix Section Mismatch
          sed -i 's/__init //g' drivers/samsung/debug/sec_debug_summary.c 2>/dev/null || true
          sed -i 's/__init //g' include/linux/sec_debug.h 2>/dev/null || true
          
          # 2. EAS Fix
          sed -i 's/static_branch_unlikely(&sched_energy_present)/sched_energy_enabled()/g' kernel/sched/fair.c
          
          # 3. FIX DUPLICATE SYMBOLS (flow_cache_ops)
          # Eliminăm definițiile duplicate din net/xfrm/xfrm_state.c care intră în coliziune cu net/core/flow.c
          # Folosim o metodă sigură de a comenta funcțiile problematice dacă sunt duplicate
          sed -i 's/void flow_cache_ops_register/void __attribute__((weak)) flow_cache_ops_register/g' net/core/flow.c
          sed -i 's/void flow_cache_ops_unregister/void __attribute__((weak)) flow_cache_ops_unregister/g' net/core/flow.c

      - name: Compile Kernel
        run: |
          cd kernel
          export PATH=$GITHUB_WORKSPACE/neutron/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          export AR=llvm-ar
          export LD=ld.lld
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          # 1. Config
          make O=out vendor/r5q_eur_open_defconfig || make O=out r5q_eur_open_defconfig
          
          # 2. Fix Config
          sed -i 's/CONFIG_HARDENED_USERCOPY=y/CONFIG_HARDENED_USERCOPY=n/g' out/.config
          sed -i 's/# CONFIG_SECTION_MISMATCH_WARN_ONLY is not set/CONFIG_SECTION_MISMATCH_WARN_ONLY=y/g' out/.config
          echo "CONFIG_SECTION_MISMATCH_WARN_ONLY=y" >> out/.config
          make O=out ARCH=arm64 olddefconfig

          # 3. Build Image
          # Folosim KCFLAGS pentru a ignora restul avertismentelor care pot deveni erori
          make -j$(nproc --all) O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 \
                      KCFLAGS="-Wno-error -w -fcommon -Wno-cast-function-type -Wno-implicit-function-declaration -Wno-pointer-arith -Wno-frame-address" \
                      HOSTCFLAGS="-Wno-error -fcommon" \
                      Image dtbs

      - name: Export Final Kernel
        run: |
          cd kernel/out/arch/arm64/boot/
          if [ -f Image ]; then
            gzip -n -c Image > Image.gz
            # Creăm și versiunea cu DTB dacă avem fișierele
            DTBS=$(find dts/ -name "*.dtb" 2>/dev/null)
            if [ ! -z "$DTBS" ]; then
               cat Image.gz $DTBS > Image.gz-dtb
            fi
            echo "Succes!"
          else
            echo "Eroare: Kernelul nu s-a compilat."
            exit 1
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-r5q-V20-Final
          path: |
            kernel/out/arch/arm64/boot/Image.gz
            kernel/out/arch/arm64/boot/Image.gz-dtb
            kernel/out/arch/arm64/boot/dts/vendor/qcom/*.dtbo
