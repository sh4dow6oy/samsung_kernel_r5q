name: Build Samsung S10 Lite (r5q) Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        repository: sh4dow6oy/android_kernel_samsung_a82xq
        ref: linux-4.14.285
        fetch-depth: 1

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential bison flex libssl-dev libelf-dev xz-utils wget git gcc-aarch64-linux-gnu zstd python3

    - name: Download and Setup NDK Clang
      run: |
        mkdir clang
        wget https://github.com/Ylarod/setup-ndk-clang/releases/download/prebuilt/clang-linux-x86-ndk-r29-r563880c.tar.zst
        tar -I zstd -xf clang-linux-x86-ndk-r29-r563880c.tar.zst -C clang
        echo "CLANG_PATH=$(pwd)/clang/bin" >> $GITHUB_ENV

    - name: Build Kernel
      run: |
        export PATH=${{ env.CLANG_PATH }}:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        
        # Trucul pentru a sări peste gcc-wrapper.py de la Samsung
        export CC=clang
        export REAL_CC=clang
        
        # Curățare
        make clean
        make mrproper
        
        # Configurare
        make r5q_eur_open_defconfig
        
        # Compilare
        # Folosim LLVM=1 pentru a substitui automat majoritatea uneltelor (ar, ld, etc.)
        make -j$(nproc --all) \
                      ARCH=arm64 \
                      CC=clang \
                      REAL_CC=clang \
                      CLANG_TRIPLE=aarch64-linux-gnu- \
                      CROSS_COMPILE=aarch64-linux-gnu- \
                      CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
                      LLVM=1 \
                      LLVM_IAS=1

    - name: Check Output
      run: |
        if [ -f arch/arm64/boot/Image.gz-dtb ]; then
            echo "Kernel compiled: Image.gz-dtb"
        elif [ -f arch/arm64/boot/Image.gz ]; then
            echo "Kernel compiled: Image.gz"
        else
            echo "Build failed! Checking directory structure:"
            ls -R arch/arm64/boot/
            exit 1
        fi

    - name: Upload Kernel
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-S10Lite-r5q
        path: |
          arch/arm64/boot/Image.gz*
          arch/arm64/boot/dtbo.img
