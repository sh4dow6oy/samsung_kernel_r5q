name: S10 Lite Kernel - Clean Build - Upstream CIP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev dwarves \
            libncurses-dev git wget unzip make python2 \
            python3 python3-minimal lz4 xz-utils gcc g++ pahole

      - name: Cache Proton Clang
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: toolchain/proton-clang
          key: ${{ runner.os }}-proton-clang-v1

      - name: Download Proton Clang (if not cached)
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p toolchain
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang

      - name: Upstream Integration (Auto-Detect Branch)
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

          # Adăugăm sursa oficială stabilă CIP
          git remote add upstream https://git.kernel.org/pub/scm/linux/kernel/git/cip/linux-cip.git
          
          # Detectăm dacă branch-ul este 'linux-4.14.y' sau '4.14.y'
          UPSTREAM_BRANCH=$(git ls-remote --heads upstream | grep -E '4.14.y' | awk -F'/' '{print $3}' | head -n 1)
          echo "Detectat branch upstream: $UPSTREAM_BRANCH"
          
          if [ -z "$UPSTREAM_BRANCH" ]; then
            echo "Eroare: Nu s-a putut găsi ramura 4.14 pe upstream!"
            exit 1
          fi

          git fetch upstream $UPSTREAM_BRANCH --depth=100

          # Merge forțat cu strategia 'theirs' pentru a evita blocajele în conflicte
          git merge upstream/$UPSTREAM_BRANCH -m "Merge Linux-CIP Upstream" -X theirs || echo "Conflicte rezolvate automat."

          # Checkout forțat pentru subsystemele vitale Android 15
          git checkout upstream/$UPSTREAM_BRANCH -- kernel/bpf/
          git checkout upstream/$UPSTREAM_BRANCH -- drivers/android/
          git checkout upstream/$UPSTREAM_BRANCH -- include/linux/bpf.h
          git checkout upstream/$UPSTREAM_BRANCH -- include/uapi/linux/bpf.h
          git checkout upstream/$UPSTREAM_BRANCH -- include/uapi/linux/btf.h
          git checkout upstream/$UPSTREAM_BRANCH -- include/linux/btf.h || true
          git checkout upstream/$UPSTREAM_BRANCH -- arch/arm64/net/
          
          echo "Upstream eBPF & Binder components updated successfully."

      - name: Pre-build Fixes
        run: |
          # 1. Injectăm __poll_t în types.h
          grep -q "__poll_t" include/uapi/linux/types.h || echo "typedef unsigned int __poll_t;" >> include/uapi/linux/types.h
          
          # 2. Fix log-uri Samsung
          mkdir -p system/core/liblog/include/log system/logging/liblog/include/log
          touch system/core/liblog/include/log/perflog.h system/logging/liblog/include/log/perflog.h
          
          # 3. Corecție referințe headere BPF
          find kernel/bpf/ -name "*.c" | xargs sed -i 's|<uapi/linux/btf.h>|<linux/btf.h>|g' || true
          
          # 4. Setări Python și wrapper
          [ -f scripts/gcc-wrapper.py ] && mv scripts/gcc-wrapper.py scripts/gcc-wrapper.py.disabled || true
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Build Kernel
        run: |
          export PATH=$(pwd)/toolchain/proton-clang/bin:$PATH
          
          MAKE_ARGS="
            O=out \
            ARCH=arm64 \
            CC=clang \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1 \
            KCFLAGS=-Wno-error \
            TECHPACK=true
          "

          # Clean build garantat
          rm -rf out && mkdir -p out
          
          make $MAKE_ARGS r5q_eur_open_defconfig
          
          # Config Android 15 (eBPF, BinderFS)
          ./scripts/config --file out/.config --enable CONFIG_BPF_SYSCALL
          ./scripts/config --file out/.config --enable CONFIG_BPF_JIT
          ./scripts/config --file out/.config --enable CONFIG_HAVE_EBPF_JIT
          ./scripts/config --file out/.config --enable CONFIG_ANDROID_BINDERFS
          ./scripts/config --file out/.config --enable CONFIG_ANDROID_BINDER_IPC
          ./scripts/config --file out/.config --disable CONFIG_DEBUG_INFO_BTF
          
          make $MAKE_ARGS olddefconfig
          make -j$(nproc --all) $MAKE_ARGS

      - name: Upload Artifacts
        uses: upload-artifact@v4
        with:
          name: Kernel-S10Lite-A15-Ready
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dtbo.img
            out/arch/arm64/boot/dts/vendor/qcom/*.dtb
