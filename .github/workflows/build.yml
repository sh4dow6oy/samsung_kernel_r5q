name: Build Samsung R5Q Kernel

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget bc bison flex libssl-dev libelf-dev

      - name: Install Python 2.7
        uses: actions/setup-python@v5
        with:
          python-version: '2.7'

      - name: Create python2 symlink
        run: |
          sudo ln -sf $(which python) /usr/bin/python2

      - name: Setup Clang toolchain
        run: |
          TOOLCHAIN_PATH="$PWD/toolchain/clang"
          mkdir -p "$TOOLCHAIN_PATH"
          wget -O clang.tar.gz "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/413febb26cbd05d9a1e44f089190ac892f72e684.tar.gz"
          tar -xf clang.tar.gz -C "$TOOLCHAIN_PATH"

          mkdir -p "$PWD/toolchain/llvm-arm-toolchain-ship/10.0/bin"
          ln -s "$TOOLCHAIN_PATH/clang-r416183b/bin/clang" "$PWD/toolchain/llvm-arm-toolchain-ship/10.0/bin/clang"

          echo "PATH=$TOOLCHAIN_PATH/clang-r416183b/bin:$PATH" >> $GITHUB_ENV
          echo "CC=clang" >> $GITHUB_ENV

      - name: Setup Android NDK (GCC + ld included)
        run: |
          NDK_URL="https://dl.google.com/android/repository/android-ndk-r25b-linux.zip"
          wget -O ndk.zip "$NDK_URL"
          unzip ndk.zip -d "$PWD/toolchain/ndk"

          export NDK_PATH="$PWD/toolchain/ndk/android-ndk-r25b"
          export PATH="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"

          # Android NDK uses clang, but provides the full toolchain
          echo "PATH=$PATH" >> $GITHUB_ENV

      - name: Configure kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          make ARCH=arm64 r5q_eur_open_defconfig

      - name: Build kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          make -j$(nproc) ARCH=arm64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kern
