name: S10 Lite - Stock Source Build Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves libncurses-dev git wget make python2 python3 pahole tar xz-utils

      - name: Setup Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang

      - name: Essential Samsung Fixes
        run: |
          # Samsung cere python2 pentru scripturile interne
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          
          # Creăm headerele lipsă pe care Samsung le așteaptă în mod normal din mediul de build Android
          mkdir -p system/core/liblog/include/log
          echo -e "#ifndef _PERFLOG_H\n#define _PERFLOG_H\n#endif" > system/core/liblog/include/log/perflog.h
          
          # Fix minor pentru compatibilitate Clang pe 4.14
          sed -i '/#define _UAPI_LINUX_TYPES_H/a #ifndef __poll_t\n#ifndef __ASSEMBLY__\ntypedef unsigned int __poll_t;\n#endif\n#define __poll_t __poll_t\n#endif' include/uapi/linux/types.h

      - name: Build Stock Kernel
        run: |
          export PATH=$(pwd)/toolchain/proton-clang/bin:$PATH
          
          # Argumente de build pentru arhitectura r5q
          MAKE_ARGS="
            O=out \
            ARCH=arm64 \
            CC=clang \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1 \
            KCFLAGS=-Wno-error \
            TECHPACK=true
          "

          rm -rf out && mkdir -p out
          
          # 1. Generăm .config din defconfig-ul stock al Samsung
          make $MAKE_ARGS r5q_eur_open_defconfig
          
          # 2. Ajustăm configurarea pentru a evita erorile de compilator
          # Stack protector strong cauzează deseori fail la check pe surse vechi
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/CONFIG_CC_STACKPROTECTOR_NONE=y/g' out/.config
          
          # 3. Aplicăm modificările în config
          make $MAKE_ARGS olddefconfig
          
          # 4. Compilarea propriu-zisă
          make -j$(nproc --all) $MAKE_ARGS

          # Verificăm dacă a ieșit Image
          if [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image .
            [ -f out/arch/arm64/boot/dtbo.img ] && cp out/arch/arm64/boot/dtbo.img .
            echo "SUCCESS=true" >> $GITHUB_ENV
          else
            echo "Build failed - Image not found"
            exit 1
          fi

      - name: Upload Stock Artifacts
        if: env.SUCCESS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-Stock-Kernel
          path: |
            Image
            dtbo.img
