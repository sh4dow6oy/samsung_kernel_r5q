name: Build Samsung SM8150 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        repository: LumiPlayground/android_kernel_samsung_sm8150
        ref: auriana
        path: kernel

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm libncurses-dev

    - name: Download Me2 Toolchain
      run: |
        git clone https://github.com/mk7x7/Me2.git toolchain
        echo "TC_BIN=$(pwd)/toolchain/toolchain/bin" >> $GITHUB_ENV

    - name: Build Kernel
      run: |
        cd kernel
        
        # Setup PATH
        TC_BIN=${{ env.TC_BIN }}
        export PATH="$TC_BIN:$PATH"
        
        export ARCH=arm64
        export SUBARCH=arm64
        
        # Variabilele de mediu pentru compilator
        export KERNEL_MAKE_ENV="DTC_EXT=$(pwd)/scripts/dtc/dtc \
                                CONFIG_BUILD_ARM64_DT_OVERLAY=y \
                                CC=clang \
                                HOSTCC=clang \
                                CLANG_TRIPLE=aarch64-linux-gnu- \
                                CROSS_COMPILE=$TC_BIN/aarch64-linux-android- \
                                CROSS_COMPILE_ARM32=$TC_BIN/arm-linux-androideabi- \
                                LD=ld.lld \
                                AR=llvm-ar \
                                NM=llvm-nm \
                                OBJCOPY=llvm-objcopy \
                                OBJDUMP=llvm-objdump \
                                STRIP=llvm-strip"

        # 1. Metoda CAT pentru configurații
        # Combinăm defconfig-ul de bază cu cel specific regiunii într-un singur fișier
        cat arch/arm64/configs/sm8150_sec_defconfig arch/arm64/configs/sm8150_sec_r5q_eur_open.config > arch/arm64/configs/combined_defconfig
        
        # Generăm .config din fișierul combinat
        make O=out $KERNEL_MAKE_ENV combined_defconfig
        
        # Aplicăm setările și curățăm conflictele
        make O=out $KERNEL_MAKE_ENV olddefconfig
        
        # 2. Build
        # Folosim KCFLAGS="-w" pentru a trece de verificările stricte de compilator
        make -j$(nproc --all) O=out $KERNEL_MAKE_ENV KCFLAGS="-w"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-SM8150-r5q
        path: |
          kernel/out/arch/arm64/boot/Image.gz-dtb
          kernel/out/arch/arm64/boot/dtbo.img
          kernel/out/.config
