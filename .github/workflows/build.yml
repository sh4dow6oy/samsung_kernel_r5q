name: Build Roynas R5Q - Neutron Clang Final

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: sh4dow6oy/android_kernel_qcom_sm8150_419
          ref: master
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev \
          ccache python3 python-is-python3 libarchive-tools wget zstd zip \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libncurses-dev libtinfo6

      - name: Setup Neutron Clang
        run: |
          mkdir clang
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang

      - name: Build Kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export KBUILD_BUILD_USER="Roynas"
          export KBUILD_BUILD_HOST="GithubActions"

          # 1. FIX USBPD (ERR_PTR)
          if [ -f include/linux/usb/usbpd.h ]; then
            sed -i '1i #include <linux/err.h>' include/linux/usb/usbpd.h
            sed -i '1i #include <linux/errno.h>' include/linux/usb/usbpd.h
          fi

          # 2. FIX BLUETOOTH SOC IDs (Eroarea QCA_HSP)
          if [ -f drivers/bluetooth/bluetooth-power.c ]; then
            sed -i '40i #define QCA_HSP_SOC_ID_0100 0x400A0100' drivers/bluetooth/bluetooth-power.c
            sed -i '41i #define QCA_HSP_SOC_ID_0110 0x400A0110' drivers/bluetooth/bluetooth-power.c
            sed -i '42i #define QCA_HSP_SOC_ID_0200 0x400A0200' drivers/bluetooth/bluetooth-power.c
            sed -i '43i #define QCA_HSP_SOC_ID_0210 0x400A0210' drivers/bluetooth/bluetooth-power.c
            sed -i '44i #define QCA_HSP_SOC_ID_1211 0x400B0200' drivers/bluetooth/bluetooth-power.c
          fi

          # 3. FIX DTC (Ubuntu 24.04 yylloc)
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' scripts/dtc/dtc-lexer.lex.c_shipped || true

          # 4. CLEANUP POLLY
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-mllvm -polly[^ ]*//g' {} +
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-mllvm//g' {} +

          # FIX AGRESIV PENTRU GPIO_KEYS (Samsung modifications)
          if [ -f drivers/input/keyboard/gpio_keys.c ]; then
              # 1. Definim SECLOG și KEY_WINK
              sed -i '30i #ifndef SECLOG\n#define SECLOG "[SEC_INPUT]"\n#endif' drivers/input/keyboard/gpio_keys.c
              sed -i '31i #ifndef KEY_WINK\n#define KEY_WINK 123\n#endif' drivers/input/keyboard/gpio_keys.c
          
              # 2. Reparăm eroarea de la linia 1077 (inițializarea)
              # Schimbăm "struct gpio_keys_button *button" în "const struct gpio_keys_button *button"
              sed -i 's/struct gpio_keys_button \*button = \&pdata->buttons\[i\];/const struct gpio_keys_button *button = \&pdata->buttons[i];/g' drivers/input/keyboard/gpio_keys.c
          
              # 3. Reparăm eroarea de la linia 1090 (apelul funcției) prin cast
              sed -i 's/button, i, child);/(struct gpio_keys_button *)button, i, child);/g' drivers/input/keyboard/gpio_keys.c
          
              # 4. Neutralizăm restul logicilor Samsung
              sed -i 's/button->button->wakeup_default/0/g' drivers/input/keyboard/gpio_keys.c
              sed -i 's/button->wakeup_default =/ \/\/ /g' drivers/input/keyboard/gpio_keys.c
              sed -i 's/pdata->wakeup_enable =/ \/\/ /g' drivers/input/keyboard/gpio_keys.c
              sed -i 's/if (pdata->wakeup_enable)/if (0)/g' drivers/input/keyboard/gpio_keys.c
          fi

          # 5. ARGUMENTE BUILD
          MAKE_ARGS="ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            O=out"

          # 6. CONFIGURARE
          make $MAKE_ARGS r5q_defconfig
          ./scripts/config --file out/.config \
            -d CONFIG_LTO -d CONFIG_LTO_CLANG -e CONFIG_LTO_NONE \
            -d CONFIG_CC_STACKPROTECTOR_STRONG -e CONFIG_CC_STACKPROTECTOR_NONE \
            -e CONFIG_SECTION_MISMATCH_WARN_ONLY
          make $MAKE_ARGS olddefconfig

          # 7. COMPILARE (Aici folosim -fcommon)
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-fcommon -Wno-error -Wno-implicit-function-declaration -Wno-unknown-warning-option"

      - name: Package with AnyKernel3
        run: |
          IMAGE="$GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz-dtb"
          if [ ! -f "$IMAGE" ]; then IMAGE="$GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz"; fi
          DTBO="$GITHUB_WORKSPACE/out/arch/arm64/boot/dtbo.img"
          git clone https://github.com/osm0sis/AnyKernel3.git
          rm -rf AnyKernel3/.git
          cp $IMAGE AnyKernel3/Image.gz
          [ -f "$DTBO" ] && cp $DTBO AnyKernel3/dtbo.img
          sed -i 's/device.name1=maguro/device.name1=r5q/g' AnyKernel3/anykernel.sh
          cd AnyKernel3 && zip -r9 ../Kernel-S10Lite-R5Q-Neutron.zip *

      - name: Upload Flashable Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-S10Lite-R5Q
          path: Kernel-S10Lite-R5Q-Neutron.zip
