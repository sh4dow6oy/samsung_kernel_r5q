name: Build Roynas R5Q - OpenELA 4.14.356 RC1 (Linker Fix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Samsung Source
        uses: actions/checkout@v4
        with:
          repository: Roynas-Android-Playground/kernel_samsung_r3q
          ref: master
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev \
          ccache python3 python-is-python3 libarchive-tools wget zstd libtinfo6 zip \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Setup Neutron Clang
        run: |
          mkdir -p clang
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang

      - name: Inject OpenELA 4.14.356 RC1
        run: |
          wget -q https://github.com/openela/kernel-lts/archive/refs/tags/v4.14.356-openela-rc1.tar.gz -O openela.tar.gz
          mkdir openela_tmp
          tar -xzf openela.tar.gz -C openela_tmp --strip-components=1
          cp -rf openela_tmp/* .
          rm -rf openela_tmp openela.tar.gz
          
          # --- THE NUCLEAR OPTION: FIX DMA SYMBOL ---
          # 1. Ștergem orice mizerie am făcut în headere anterior
          git checkout include/linux/dma-contiguous.h || true
          
          # 2. Cream un fișier C mic care să definească funcția global pentru linker
          echo 'void dma_contiguous_early_fixup(void *res_cma) { }' > drivers/base/samsung_stub.c
          
          # 3. Îl adăugăm în Makefile-ul de la drivers/base pentru a fi compilat
          echo 'obj-y += samsung_stub.o' >> drivers/base/Makefile
          
          # Fix COMMON symbols
          sed -i 's/KBUILD_CFLAGS   += $(call cc-option,-fno-delete-null-pointer-checks,)/KBUILD_CFLAGS   += $(call cc-option,-fno-delete-null-pointer-checks,)\nKBUILD_CFLAGS   += -fno-common/g' Makefile

      - name: Build Kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export KBUILD_BUILD_USER="Roynas"
          export KBUILD_BUILD_HOST="Android-Playground"
          
          # Cleanup flag-uri incompatibile
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-mllvm -polly[^ ]*//g' {} +
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-mllvm//g' {} +
          
          # Fix VDSO
          if [ -f arch/arm64/kernel/vdso/Makefile ]; then
            sed -i 's/-static//g' arch/arm64/kernel/vdso/Makefile
          fi

          # Fix Python 3.12
          sed -i 's/ifneq ($(wildcard $(srctree)\/scripts\/gcc-wrapper.py),)/ifeq (0,1)/g' Makefile

          MAKE_ARGS="ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            O=out"

          make $MAKE_ARGS r5q_defconfig
          
          ./scripts/config --file out/.config \
            -d CONFIG_LTO -d CONFIG_LTO_CLANG -e CONFIG_LTO_NONE \
            -d CONFIG_KNOX_KAP -d CONFIG_SECURITY_SAMSUNG_KNOX \
            -d CONFIG_WERROR
          
          make $MAKE_ARGS olddefconfig

          # Compilare
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-fno-common -Wno-error -Wno-implicit-function-declaration -Wno-int-conversion -Wno-unused-command-line-argument"

      - name: Package with AnyKernel3
        run: |
          IMAGE="out/arch/arm64/boot/Image.gz"
          [ -f out/arch/arm64/boot/Image.gz-dtb ] && IMAGE="out/arch/arm64/boot/Image.gz-dtb"
          
          git clone https://github.com/osm0sis/AnyKernel3.git
          cp $IMAGE AnyKernel3/Image.gz
          [ -f out/arch/arm64/boot/dtbo.img ] && cp out/arch/arm64/boot/dtbo.img AnyKernel3/dtbo.img

          sed -i 's/device.name1=maguro/device.name1=r5q/g' AnyKernel3/anykernel.sh
          cd AnyKernel3 && zip -r9 ../Kernel-R5Q-OpenELA.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-R5Q-OpenELA
          path: Kernel-R5Q-OpenELA.zip
