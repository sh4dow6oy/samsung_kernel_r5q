name: Build Samsung SM8150 (Auriana)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Cleanup Environment
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc "/usr/local/share/boost" "$AGENT_TOOLSDIRECTORY"
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison ncurses-dev libssl-dev libelf-dev xz-utils libfl-dev python3 git-core ccache gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Clone Kernel Source
        run: |
          git clone --depth=1 -b auriana https://github.com/sh4dow6oy/android_kernel_samsung_sm8150.git source
          
      - name: Setup Proton Clang
        run: |
          mkdir clang
          cd clang
          wget https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.tar.gz
          tar -xf master.tar.gz
          # Ștergem linker-ul din toolchain pentru a forța utilizarea celui de sistem
          # Asta previne eroarea de relocare (libc) pe Ubuntu 22.04+
          rm -f proton-clang-master/bin/ld
          echo "$(pwd)/proton-clang-master/bin" >> $GITHUB_PATH

      - name: Build Kernel
        run: |
          cd source
          
          # Exportăm variabilele de compilare
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export HOSTCC=gcc
          export HOSTCXX=g++
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          mkdir -p out

          # 1. Creăm configurația combinată (Metoda CAT)
          # Îmbinăm defconfig-ul de bază cu fragmentul specific proiectului R5Q
          cat arch/arm64/configs/sm8150_sec_defconfig arch/arm64/configs/sm8150_sec_r5q_eur_open.config > arch/arm64/configs/temp_defconfig
          
          # 2. Generăm fișierul .config inițial
          make O=out ARCH=arm64 HOSTCC=$HOSTCC HOSTCXX=$HOSTCXX temp_defconfig
          
          # 3. FIX CRITIC: Eliminarea ghilimelelor pentru Wi-Fi QCACLD
          # Makefile-ul driverului eșuează când vede "default" cu ghilimele.
          # Îl transformăm în default simplu pentru a permite 'include' în Kbuild.
          sed -i 's/CONFIG_WLAN_SUB_VARIANT="\(.*\)"/CONFIG_WLAN_SUB_VARIANT=\1/' out/.config
          
          # Sincronizăm configurația pentru a aplica modificarea de mai sus
          make O=out ARCH=arm64 HOSTCC=$HOSTCC HOSTCXX=$HOSTCXX olddefconfig

          # 4. Compilarea finală
          # Folosim nproc pentru a utiliza toate nucleele disponibile pe runner
          make -j$(nproc --all) O=out \
                      ARCH=arm64 \
                      CC=clang \
                      HOSTCC=$HOSTCC \
                      HOSTCXX=$HOSTCXX \
                      CROSS_COMPILE=aarch64-linux-gnu- \
                      CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
                      NM=llvm-nm \
                      OBJCOPY=llvm-objcopy \
                      OBJDUMP=llvm-objdump \
                      STRIP=llvm-strip \
                      LD=ld.lld \
                      AR=llvm-ar

      - name: Check and Upload Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-SM8150-Auriana-R5Q
          path: |
            source/out/arch/arm64/boot/Image.gz
            source/out/arch/arm64/boot/Image.gz-dtb
            source/out/arch/arm64/boot/dtbo.img
