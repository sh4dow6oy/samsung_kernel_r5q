name: Lumi R5Q - Surgical Merge (Sunmughan Drivers + Lumi Config)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Lumi Base (The Core)
        uses: actions/checkout@v4
        with:
          repository: LumiPlayground/android_kernel_samsung_sm8150
          ref: rawr-bpf
          path: kernel

      - name: Checkout Sunmughan Source (The Drivers)
        uses: actions/checkout@v4
        with:
          repository: sunmughan/samsung_kernel_r5q
          ref: master
          path: sunmughan_source

      - name: Surgical Merge & Restore
        run: |
          # 1. Backup fișierele critice din Lumi (BPF, Entry și CONFIG-ul dorit)
          mkdir -p lumi_backup
          cp -r kernel/arch/arm64/net lumi_backup/
          cp kernel/arch/arm64/kernel/entry.S lumi_backup/
          cp kernel/arch/arm64/configs/r5q_eur_open_defconfig lumi_backup/
          
          # 2. Swap Hardware & Arch (Drivers, Techpack, Arch/arm64 din Sunmughan)
          rm -rf kernel/drivers kernel/techpack kernel/arch/arm64
          cp -r sunmughan_source/drivers kernel/
          cp -r sunmughan_source/techpack kernel/
          cp -r sunmughan_source/arch/arm64 kernel/arch/
          
          # 3. RESTAURARE fișiere Lumi
          rm -rf kernel/arch/arm64/net/*
          cp -r lumi_backup/net/* kernel/arch/arm64/net/
          cp lumi_backup/entry.S kernel/arch/arm64/kernel/entry.S
          
          # Restaurăm Config-ul Lumi (Esențial pentru setările tale)
          mkdir -p kernel/arch/arm64/configs/
          cp lumi_backup/r5q_eur_open_defconfig kernel/arch/arm64/configs/r5q_eur_open_defconfig

      - name: Apply Universal Hotfixes
        run: |
          cd kernel
          # 1. Fix RKP sintaxă în mmu.c
          sed -i '20i #define __page_aligned_rkp_bss __section(".bss..page_aligned")' arch/arm64/mm/mmu.c
          sed -i '21i #define __page_aligned_rkp_data __section(".data..page_aligned")' arch/arm64/mm/mmu.c

          # 2. Fix ZRAM & Task MMU
          sed -i '40i #define ZRAM_WB_TYPE 4\n#define ZRAM_WB_HUGE_TYPE 5\n#define ZRAM_HUGE_TYPE 3\n#define ZRAM_SAME_TYPE 2' fs/proc/task_mmu.c
          sed -i 's/count_vm_events(SQZR_/\/\/&/g' drivers/block/zram/zram_drv.c
          sed -i 's/count_vm_event(SQZR_/\/\/&/g' drivers/block/zram/zram_drv.c

          # 3. Fix GPU Adreno (IDR_INIT)
          sed -i 's/IDR_INIT/{ 0 }/g' drivers/gpu/msm/kgsl_device.h

          # 4. DISABLE KPERFMON (Fix perflog.h)
          sed -i 's/CONFIG_KPERFMON=y/CONFIG_KPERFMON=n/g' arch/arm64/configs/r5q_eur_open_defconfig || true
          sed -i 's/obj-$(CONFIG_KPERFMON)/# obj-$(CONFIG_KPERFMON)/g' drivers/Makefile || true

          # 5. FIX SDE ROTATOR TRACE (dst_bw error)
          sed -i 's/dst_fmt, dst_bw, dst_bh/dst_fmt, 0, 0/g' drivers/media/platform/msm/sde/rotator/sde_rotator_trace.h

          # 6. Globale
          find arch/arm64/kernel/vdso -type f -name "Makefile*" -exec sed -i 's/-static//g' {} +
          find arch/arm64/boot/dts -name "Makefile" -exec sed -i 's/-Werror//g' {} +

      - name: Setup Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev \
          ccache python3 libarchive-tools wget zstd zip gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
          
          mkdir -p clang
          wget -q https://github.com/Ylarod/setup-ndk-clang/releases/download/prebuilt/clang-linux-x86-ndk-r29-r563880c.tar.zst
          tar -I zstd -xf clang-linux-x86-ndk-r29-r563880c.tar.zst -C clang

      - name: Build Kernel
        run: |
          cd kernel
          sed -i 's/CONFIG_KPERFMON=y/CONFIG_KPERFMON=n/g' arch/arm64/configs/r5q_eur_open_defconfig
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export MAKE_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=0 CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD=ld.lld \
            O=out"

          # Folosim config-ul restaurat din Lumi
          make $MAKE_ARGS r5q_eur_open_defconfig
          
          # --- AJUSTĂRI ONEUI 7 (OBLIGATORII) ---
          # Ne asigurăm că aceste flag-uri sunt setate corect peste config-ul Lumi
          sed -i 's/CONFIG_ANDROID_SAR_RAMDISK=y/CONFIG_ANDROID_SAR_RAMDISK=n/g' out/.config
          printf "CONFIG_BLK_DEV_DM=y\nCONFIG_DM_REMAPPER=y\nCONFIG_DM_UEVENT=y\n" >> out/.config
          printf "CONFIG_EROFS_FS=y\nCONFIG_EROFS_FS_ZIP=y\n" >> out/.config
          printf "CONFIG_ANDROID_BINDERFS=y\n" >> out/.config

          make $MAKE_ARGS olddefconfig
          
          # Build
          make -j$(nproc --all) $MAKE_ARGS KCFLAGS="-w -Wno-error -Wno-int-conversion" O=out Image.gz-dtb

      - name: AnyKernel3 Packaging
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          if [ -f kernel/out/arch/arm64/boot/Image.gz-dtb ]; then
            cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/Image.gz-dtb
          else
            echo "EROARE: Compilarea a eșuat!" && exit 1
          fi
          cd AnyKernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          sed -i 's|block=auto;|block=/dev/block/by-name/boot;|g' anykernel.sh
          sed -i 's/kernel.type=inline/kernel.type=gzip-dtb/g' anykernel.sh
          zip -r9 ../Lumi-R5Q-Surgical-Final.zip *

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Lumi-Final-Kernel
          path: Lumi-R5Q-Surgical-Final.zip
