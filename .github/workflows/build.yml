name: R5Q - Android 15 (PDIC to CCIC Fix)
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pascua28 Base
        uses: actions/checkout@v4
        with:
          repository: pascua28/android_kernel_samsung_sm7150
          ref: sixteen
          path: kernel

      - name: Hybrid Config & Comprehensive Patching
        run: |
          cd kernel
          # 1. CONFIG HIBRID
          cp arch/arm64/configs/sdmmagpie_defconfig arch/arm64/configs/r5q_hybrid_defconfig
          curl -s https://raw.githubusercontent.com/Roynas-Android-Playground/kernel_samsung_r3q/master/arch/arm64/configs/r5q_defconfig > roynas_r5q.config
          echo "" >> arch/arm64/configs/r5q_hybrid_defconfig
          cat roynas_r5q.config >> arch/arm64/configs/r5q_hybrid_defconfig

          # 2. OPTIMIZARE CONFIG
          ./scripts/config --file arch/arm64/configs/r5q_hybrid_defconfig \
            --disable CONFIG_SND_SOC_SM6150 \
            --disable CONFIG_SND_SOC_SM7150 \
            --enable CONFIG_SND_SOC_SM8150 \
            --disable CONFIG_SECURITY_SMACK \
            --disable CONFIG_BPFILTER \
            --enable CONFIG_BPF \
            --enable CONFIG_BPF_SYSCALL \
            --set-val CONFIG_NR_CPUS 8 \
            --enable CONFIG_MACH_SAMSUNG_R5Q

          # 3. REPARAȚIE SENZORI (PDIC -> CCIC GLOBAL)
          # Înlocuim orice referință PDIC cu CCIC în driverul sx9360
          sed -i 's/PDIC_NOTIFY/CCIC_NOTIFY/g' drivers/sensors/sx9360.c
          sed -i 's/PD_NOTI/CC_NOTI/g' drivers/sensors/sx9360.c

          # 4. CREARE FIȘIER STUBS (Rezolvă erorile ld.lld anterioare)
          cat <<EOF > kernel/linker_stubs.c
          #include <linux/kernel.h>
          #include <linux/export.h>
          int sysctl_sched_conservative_pl = 0;
          int sysctl_sched_many_wakeup_threshold = 0;
          void scsi_trace_parse_cdb(void) {}
          void mhi_set_napi_chained_rx(void) {}
          void ois_reset_register(void) {}
          void accel_factory_init_work(void) {}
          void prox_factory_init_work(void) {}
          void setSensorCallback(void *p) {}
          void audio_register_wdsp_state_cb(void) {}
          void audio_register_mad_mic_state_cb(void) {}
          unsigned int minmax_running_min = 0;
          unsigned int minmax_running_max = 0;
          EXPORT_SYMBOL(sysctl_sched_conservative_pl);
          EXPORT_SYMBOL(sysctl_sched_many_wakeup_threshold);
          EOF
          echo "obj-y += linker_stubs.o" >> kernel/Makefile

          # 5. FIX TRACE (Precision Strike)
          sed -i '0,/struct perf_event \*event;/! s/struct perf_event \*event;/\/\/ duplicate/g' kernel/trace/trace_event_perf.c

          # 6. FIX AUDIO & CAMERA
          sed -i 's/mbhc->slow_insertion/0/g' techpack/audio/asoc/codecs/wcd-mbhc-adc.c || true
          sed -i 's/void swrm_wcd_notify/__attribute__((weak)) void swrm_wcd_notify/g' techpack/audio/soc/swr-wcd-ctrl.c || true
          find . -name "cam_actuator_core.c" -exec sed -i 's/rc = cam_actuator_do_soft_landing(a_ctrl);/rc = 0;/g' {} + || true

          # 7. FIX MEMORY (Clang 17+)
          sed -i 's/try_to_unmap(page, ttu_flags)/try_to_unmap(page, ttu_flags, NULL)/g' mm/huge_memory.c || true
          sed -i 's/split_huge_pmd(vma, addr, pmd);/__split_huge_pmd(vma, (pmd_t *)pmd, addr, false, NULL);/g' fs/proc/task_mmu.c || true

      - name: Setup Toolchain
        run: |
          sudo apt-get update && sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev zstd zip gcc-aarch64-linux-gnu
          mkdir -p clang
          wget -q https://github.com/Ylarod/setup-ndk-clang/releases/download/prebuilt/clang-linux-x86-ndk-r29-r563880c.tar.zst
          tar -I zstd -xf clang-linux-x86-ndk-r29-r563880c.tar.zst -C clang

      - name: Build Kernel Image
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export MAKE_ARGS="ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- O=out"
          
          make $MAKE_ARGS r5q_hybrid_defconfig
          make $MAKE_ARGS olddefconfig
          
          make -j$(nproc --all) $MAKE_ARGS \
            KCFLAGS="-w" \
            CONFIG_BPFILTER=n \
            LDFLAGS="--allow-multiple-definition" \
            O=out Image.gz-dtb

      - name: Package
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          find kernel/out -name "Image.gz*" -exec cp {} AnyKernel3/ \;
          cd AnyKernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          zip -r9 ../Lumi-Kernel-R5Q-v13.zip *

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Lumi-Kernel
          path: Lumi-Kernel-R5Q-v13.zip
