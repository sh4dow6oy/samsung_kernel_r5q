name: Build Prime Kernel R5Q

on:
  workflow_dispatch:
    inputs:
      release:
          description: 'Upload release'
          type: boolean
          required: true
          default: false
      changelog:
          description: 'Changelog'
          type: string
          required: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_ts: ${{ steps.ts.outputs.release_ts }}
    steps:
      - name: Generate release date
        id: ts
        run: echo "release_ts=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

  build:
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git curl unzip wget zip zstd \
            bc bison flex libssl-dev libelf-dev python3 python-is-python3 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Download Proton Clang
        run: |
          mkdir clang-stable
          wget https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.tar.gz -O clang.tar.gz
          tar -C clang-stable --strip-components=1 -xf clang.tar.gz
          chmod -R +x clang-stable/bin/

      - name: Build kernel
        run: |
          # 1. Setup PATH
          export CLANG_BIN="$(pwd)/clang-stable/bin"
          export PATH="$CLANG_BIN:$PATH"

          # 2. NUCLEAR CLEAN
          echo "exit 0" > scripts/gcc-goto.sh
          chmod +x scripts/gcc-goto.sh
          
          # Eliminăm flag-urile care cauzează segfault la teste
          find . -name Makefile* -exec sed -i 's/-Werror//g' {} +
          sed -i 's/$(error Cannot use CONFIG_CC_STACKPROTECTOR_STRONG.*/$(warning Bypassed)/g' Makefile

          # 3. Fix Samsung tools
          echo "#!/bin/bash" > secgetspf
          echo "exit 0" >> secgetspf
          chmod +x secgetspf
          export PATH="$PATH:$(pwd)"

          # 4. Mediul de compilare - SOLUȚIA PENTRU .relr.dyn
          # Forțăm HOSTCC să fie GCC-ul nativ din Ubuntu, nu cel din folderul Clang
          export KERNEL_MAKE_ENV="DTC_EXT=$(pwd)/scripts/dtc CONFIG_BUILD_ARM64_DT_OVERLAY=y SHELL=/bin/bash HOSTCC=gcc HOSTCXX=g++ HOSTLDFLAGS='-L/usr/lib/x86_64-linux-gnu -L/lib/x86_64-linux-gnu'"
          
          MAKE_ARGS="ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            O=out"

          # 5. Configurare
          make $MAKE_ARGS $KERNEL_MAKE_ENV r5q_eur_open_defconfig

          # 6. Patch Config
          ./scripts/config --file out/.config \
            -d CONFIG_SEC_DEBUG \
            -d CONFIG_SEC_DEBUG_COMMON \
            -d CONFIG_CC_STACKPROTECTOR_STRONG \
            -e CONFIG_CC_STACKPROTECTOR_NONE \
            -d CONFIG_SAMSUNG_PRODUCT_SHIP \
            -e CONFIG_CC_HAVE_ASM_GOTO

          # 7. Compilare Finală
          make $MAKE_ARGS $KERNEL_MAKE_ENV olddefconfig
          make $MAKE_ARGS $KERNEL_MAKE_ENV -j$(nproc --all) Image.gz-dtb

          if [ -d "AnyKernel3" ]; then
            cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrimeKernel-R5Q-${{ needs.prepare.outputs.release_ts }}
          path: AnyKernel3/

  release:
    needs: [prepare, build]
    if: github.event.inputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
      - name: Zip and Release
        run: |
          cd artifacts
          for dir in PrimeKernel-*; do
            if [ -d "$dir" ]; then
              (cd "$dir" && zip -r "../${dir}.zip" .)
            fi
          done
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ needs.prepare.outputs.release_ts }}"
          name: "PrimeKernel-R5Q-${{ needs.prepare.outputs.release_ts }}"
          body: "${{ github.event.inputs.changelog }}"
          files: artifacts/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
