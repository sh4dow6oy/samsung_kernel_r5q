name: Build Kernel r5q (S10 Lite) - Stable Generic Input

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: 1. Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev wget zstd zip git python3 curl

      - name: 2. Checkout Kernel Source (SM8150 4.19)
        uses: actions/checkout@v4
        with:
          repository: sh4dow6oy/android_kernel_qcom_sm8150_419
          path: kernel
          fetch-depth: 1

      - name: 3. Setup Neutron Clang Toolchain
        run: |
          mkdir clang
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C clang
          echo "$(pwd)/clang/bin" >> $GITHUB_PATH

      - name: 4. Integrate Samsung r5q Config & Battery/Sensors
        run: |
          cd kernel
          git remote add samsung https://github.com/sh4dow6oy/kernel_samsung_r3q
          git fetch samsung master --depth=1
          
          # Luăm DOAR configurația r5q și driverele care nu se bat cu baza
          git checkout samsung/master -- arch/arm64/configs/r5q_defconfig
          
          # Păstrăm input/touchscreen generic din baza SM8150 (nu facem checkout pe el)
          # Luăm doar restul componentelor vitale Samsung
          git checkout samsung/master -- drivers/battery_v2/
          git checkout samsung/master -- drivers/sensors/
          git checkout samsung/master -- drivers/motor/

      - name: 5. Setup KernelSU
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main

      - name: 6. Build Kernel
        run: |
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          
          MAKE_PARAMS=(
              O=out
              CC=clang
              LD=ld.lld
              AR=llvm-ar
              NM=llvm-nm
              OBJCOPY=llvm-objcopy
              OBJDUMP=llvm-objdump
              STRIP=llvm-strip
              HOSTCC=gcc
              HOSTCXX=g++
              CROSS_COMPILE=aarch64-linux-gnu-
              CROSS_COMPILE_ARM32=arm-linux-gnueabi-
              LLVM=1
              LLVM_IAS=1
          )

          # Aplicăm r5q_defconfig
          make "${MAKE_PARAMS[@]}" r5q_defconfig
          
          # Forțăm activarea KernelSU și optimizări de viteză
          echo "CONFIG_KSU=y" >> out/.config
          echo "CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y" >> out/.config
          
          # Curățăm config-ul (rezolvă eventuale conflicte între defconfig-ul Samsung și baza SM8150)
          make "${MAKE_PARAMS[@]}" olddefconfig
          
          # Compilare
          make -j$(nproc --all) "${MAKE_PARAMS[@]}"

      - name: 7. Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1
          
          # Căutăm imaginea generată (Image.gz-dtb este standard pentru S10 Lite)
          find kernel/out/arch/arm64/boot/ -name "Image.gz-dtb" -exec cp {} AnyKernel3/ \; || \
          find kernel/out/arch/arm64/boot/ -name "Image.gz" -exec cp {} AnyKernel3/ \; || \
          find kernel/out/arch/arm64/boot/ -name "Image" -exec cp {} AnyKernel3/ \;
          
          cd AnyKernel3
          sed -i 's/device.name1=/device.name1=r5q/' anykernel.sh
          sed -i 's/device.name2=/device.name2=S10Lite/' anykernel.sh
          zip -r9 ../r5q-Kernel-Stable.zip *

      - name: 8. Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-r5q-Kernel
          path: r5q-Kernel-Stable.zip
