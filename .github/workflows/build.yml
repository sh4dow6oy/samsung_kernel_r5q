name: Build R5Q - Ducky 4.19 + Neutron Clang (LTO)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest # Neutron recomandă cel mai nou mediu
    steps:
      - name: Checkout DuckyDuck Kernel (4.19)
        uses: actions/checkout@v4
        with:
          repository: duckyduckG/android_kernel_qcom_sm8150_419
          ref: lineage-23.2
          path: kernel

      - name: Import Mainey Config (r5q)
        run: |
          wget -O kernel/arch/arm64/configs/r5q_imported_defconfig https://raw.githubusercontent.com/mainey/android_kernel_samsung_r5q/lineage-19.0/arch/arm64/configs/r5q_eur_open_defconfig

      - name: Setup Neutron Clang
        run: |
          mkdir -p clang
          # Descarcă ultima versiune stabilă de Neutron
          curl -LSs "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman" | bash -s -- --install=clang
          mv bin clang/bin || true # Ajustare path dacă e nevoie

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc libssl-dev python3 bison flex libncurses6 libncurses-dev zstd git gcc-aarch64-linux-gnu

      - name: Build with Neutron & LTO
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          
          # Neutron funcționează cel mai bine cu LLVM=1 și LLVM_IAS=1
          MAKE_ARGS="ARCH=arm64 \
                     LLVM=1 \
                     LLVM_IAS=1 \
                     CC=clang \
                     LD=ld.lld \
                     CROSS_COMPILE=aarch64-linux-gnu- \
                     CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
                     O=out"
          
          make $MAKE_ARGS r5q_imported_defconfig
          
          # Activăm LTO pentru performanță maximă
          ./scripts/config --file out/.config \
            -e CONFIG_LTO_CLANG \
            -e CONFIG_LTO_CLANG_THIN \
            -d CONFIG_LTO_NONE \
            -d CONFIG_SAMSUNG_RTIC \
            -d CONFIG_WERROR
            
          make $MAKE_ARGS olddefconfig
          
          # Start build
          make -j$(nproc --all) $MAKE_ARGS V=1 Image.gz dtbs

      - name: Assemble
        run: |
          OUT="kernel/out/arch/arm64/boot"
          if [ -f "$OUT/Image.gz" ]; then
            git clone https://github.com/osm0sis/AnyKernel3.git AK3
            cp $OUT/Image.gz AK3/
            # Căutăm DTB-ul Samsung în sursa Ducky
            DTB=$(find $OUT/dts -name "*r5q*.dtb" | head -n 1)
            [ -f "$DTB" ] && cat $OUT/Image.gz $DTB > AK3/Image.gz
            find kernel/out -name "dtbo.img" -exec cp {} AK3/dtbo.img \;
            cd AK3 && zip -r9 ../R5Q_Neutron_LTO_V103.zip *
          else
            echo "Build failed. Verifică dacă LTO a consumat tot RAM-ul."
            exit 1
          fi

      - name: Upload
        uses: upload-artifact@v4
        with:
          name: Kernel-R5Q-Neutron
          path: R5Q_Neutron_LTO_V103.zip
