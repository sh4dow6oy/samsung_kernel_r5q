name: S10 Lite - Santoni Stable v57

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout S10 Lite Source
        uses: actions/checkout@v4
        with:
          path: s10-lite-src

      - name: Setup ZyC Santoni Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves make python3 lz4 perl git
          git clone --depth=1 https://gitlab.com/clangsantoni/zyc_clang.git toolchain/zyc-clang

      - name: Prepare Pascua Sixteen Base
        run: |
          git clone --depth=1 -b sixteen https://github.com/pascua28/android_kernel_samsung_sm7150.git kernel-res

      - name: Inject S10 Lite Components
        run: |
          cp -r s10-lite-src/drivers/soc/samsung kernel-res/drivers/soc/ || true
          cp -r s10-lite-src/drivers/camera kernel-res/drivers/ || true
          cp -r s10-lite-src/drivers/fingerprint kernel-res/drivers/ || true
          cp -r s10-lite-src/drivers/sensors kernel-res/drivers/ || true
          cp -r s10-lite-src/arch/arm64/boot/dts/samsung kernel-res/arch/arm64/boot/dts/ || true
          cp s10-lite-src/arch/arm64/configs/r5q_eur_open_defconfig kernel-res/arch/arm64/configs/

      - name: Scrub Buggy Optimization Flags
        run: |
          cd kernel-res
          # Eliminăm flag-urile de Machine Learning care cauzează eroarea regalloc
          find . -name "Makefile*" -exec sed -i 's/-mllvm -regalloc-enable-advisor=release//g' {} +
          find . -name "Makefile*" -exec sed -i 's/-mllvm -regalloc-enable-advisor=development//g' {} +
          
          # Eliminăm Polly pentru că mediul GitHub nu are setate variabilele de mediu pentru plugin-urile LLVM
          find . -name "Makefile*" -exec sed -i 's/-mllvm -polly//g' {} +
          find . -name "Makefile*" -exec sed -i 's/-mllvm -polly-[^ ]*//g' {} +

          # Aplicăm fix-urile esențiale de cod
          find fs/ -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's/struct crypto_blkcipher/struct crypto_skcipher/g' {} +
          sed -i 's/bprm->file = file/bprm.file = file/g' fs/exec.c
          
          # Fix Scheduler (Static conflict)
          sed -i '/boosted_task_util/d' kernel/sched/fair.c
          sed -i 's/static unsigned long boosted_task_util/unsigned long boosted_task_util/g' kernel/sched/fair.c
          sed -i '50i struct task_struct; unsigned long boosted_task_util(struct task_struct *task);' kernel/sched/fair.c

      - name: Build Kernel
        run: |
          cd kernel-res
          export PATH=$(pwd)/../toolchain/zyc-clang/bin:$PATH
          
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          # Folosim LLVM=1 pentru a utiliza linker-ul lld din toolchain-ul Santoni
          MAKE_ARGS="ARCH=arm64 CC=clang HOSTCC=gcc LLVM=1 LLVM_IAS=1"
          
          export KCFLAGS="-Wno-error -Wno-unknown-warning-option -Wno-implicit-function-declaration -Wno-incompatible-pointer-types"

          make $MAKE_ARGS r5q_eur_open_defconfig
          
          # Dezactivăm securitatea Samsung care ar bloca boot-ul
          ./scripts/config --disable CONFIG_CC_STACKPROTECTOR_STRONG
          ./scripts/config --enable CONFIG_CC_STACKPROTECTOR_NONE
          ./scripts/config --disable CONFIG_RKP_KDP
          ./scripts/config --disable CONFIG_DEFEX
          
          make $MAKE_ARGS olddefconfig
          make -j$(nproc --all) $MAKE_ARGS Image.gz-dtb

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: kernel-S10Lite-Santoni-v57
          path: kernel-res/arch/arm64/boot/Image.gz-dtb
