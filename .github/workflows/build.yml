name: Samsung SM8150 (r5q) - Fingerprint Driver Ingest - V40

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: sh4dow6oy/android_kernel_samsung_sm8150-5.4
          path: kernel
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libncurses-dev git zstd python3 gzip

      - name: Download & Extract Neutron Clang
        run: |
          mkdir -p neutron
          wget https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C neutron/

      - name: Patch Source Code
        run: |
          cd kernel
          # 1. FIX SCHEDULER (EAS)
          sed -i 's/static_branch_unlikely(&sched_energy_present)/sched_energy_enabled()/g' kernel/sched/fair.c
          
          # 2. FIX MHI ERRORS (Stub complet)
          MHI_ARCH="drivers/bus/mhi/controllers/mhi_arch_qcom.c"
          if [ -f "$MHI_ARCH" ]; then
            printf "#include <linux/module.h>\n#include <linux/platform_device.h>\n#include <linux/mhi.h>\n\nint mhi_arch_pcie_init(struct mhi_controller *mhi_cntrl) { return 0; }\nvoid mhi_arch_pcie_deinit(struct mhi_controller *mhi_cntrl) {}\nint mhi_arch_iommu_init(struct mhi_controller *mhi_cntrl) { return 0; }\nvoid mhi_arch_iommu_deinit(struct mhi_controller *mhi_cntrl) {}\nint mhi_arch_link_resume(struct mhi_controller *mhi_cntrl) { return 0; }\nint mhi_arch_link_suspend(struct mhi_controller *mhi_cntrl) { return 0; }\nint mhi_arch_link_lpm_disable(struct mhi_controller *mhi_cntrl) { return 0; }\nvoid mhi_arch_link_lpm_enable(struct mhi_controller *mhi_cntrl) {}\nint mhi_arch_reg_suspend_cb(struct mhi_controller *mhi_cntrl) { return 0; }\nvoid mhi_arch_reg_resume_cb(struct mhi_controller *mhi_cntrl) {}\n" > "$MHI_ARCH"
          fi

          # 3. INGEST FINGERPRINT DRIVERS (Descărcăm fișierele lipsă)
          FP_DIR="drivers/fingerprint"
          mkdir -p "$FP_DIR"
          wget -O "$FP_DIR/et7xx-spi.c" https://github.com/Roynas-Android-Playground/kernel_samsung_r3q/blob/master/drivers/fingerprint/et7xx-spi.c
          wget -O "$FP_DIR/et7xx-spi.h" https://github.com/Roynas-Android-Playground/kernel_samsung_r3q/blob/master/drivers/fingerprint/et7xx-spi.h
          wget -O "$FP_DIR/fingerprint_common.h" https://github.com/Roynas-Android-Playground/kernel_samsung_r3q/blob/master/drivers/fingerprint/fingerprint_common.h
          
          # Asigurăm Makefile-ul
          if [ ! -f "$FP_DIR/Makefile" ]; then
            echo "obj-y += et7xx-spi.o fingerprint_common.o" > "$FP_DIR/Makefile"
          fi

          # 4. Fix Section Mismatch
          sed -i 's/__init //g' drivers/samsung/debug/sec_debug_summary.c 2>/dev/null || true
          sed -i 's/__init //g' include/linux/sec_debug.h 2>/dev/null || true

      - name: Compile Kernel
        run: |
          cd kernel
          export PATH=$GITHUB_WORKSPACE/neutron/bin:$PATH
          export ARCH=arm64
          export CC=clang
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export LD=ld.lld
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          # 1. Config
          make O=out vendor/r5q_eur_open_defconfig
          
          # 2. Touchscreen & I2C/SPI
          scripts/config --file out/.config -e CONFIG_INPUT_TOUCHSCREEN
          scripts/config --file out/.config -e CONFIG_TOUCHSCREEN_SAMSUNG
          scripts/config --file out/.config -e CONFIG_TOUCHSCREEN_SEC_TS_Y771_R5
          scripts/config --file out/.config -e CONFIG_I2C_QCOM_GENI
          scripts/config --file out/.config -e CONFIG_SPI_QCOM_GENI
          
          # 3. Activăm driverul de amprentă din config
          scripts/config --file out/.config -e CONFIG_FINGERPRINT_ET7XX
          
          # Dezactivăm securitatea Samsung
          scripts/config --file out/.config -d CONFIG_SDP
          scripts/config --file out/.config -d CONFIG_DEFEX
          scripts/config --file out/.config -d CONFIG_SECURITY_DSMS
          
          make O=out ARCH=arm64 olddefconfig

          # 4. Build Final
          make -j$(nproc --all) O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 \
                      KCFLAGS="-Wno-error -w -fcommon -fno-stack-protector -Wno-implicit-function-declaration" \
                      Image

      - name: Prepare Artifacts
        run: |
          if [ -f kernel/out/arch/arm64/boot/Image ]; then
            gzip -n -c kernel/out/arch/arm64/boot/Image > kernel/Image.gz
            echo "Kernel Image.gz generat!"
          else
            echo "Eroare: Imaginea de kernel nu a fost creată!"
            exit 1
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-r5q-V40-Final
          path: kernel/Image.gz
