name: S10 Lite Kernel Build - v124 (Architect's Choice)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source (Fast)
        uses: actions/checkout@v4
        with:
          repository: mainey/android_kernel_samsung_r5q
          ref: lineage-18.1
          path: kernel-res
          fetch-depth: 1

      - name: Setup Proton Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves make python3 lz4 perl git curl
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang

      - name: Architect's Surgical Prep
        run: |
          cd kernel-res
          
          # 1. ELIMINARE TRACING & DEBUG (Sursele erorilor anterioare)
          # Dezactivam HID-TRACE si SEC_DEBUG direct din Makefile-uri
          find . -name Makefile -exec sed -i 's/obj-$(CONFIG_HID_TRACE)/# obj-$(CONFIG_HID_TRACE)/g' {} +
          find . -name Makefile -exec sed -i 's/obj-$(CONFIG_SEC_DEBUG)/# obj-$(CONFIG_SEC_DEBUG)/g' {} +
          
          # 2. FIX FIRMWARE STUBBING
          # Cream orice folder de firmware ar putea fi cerut si punem fisiere "dummy"
          mkdir -p firmware/tsp_sec
          touch firmware/tsp_sec/y771_r5.bin
          
          # 3. COMPILER ALIGNMENT (Injectam fix-ul in headerele de baza)
          echo "#define __builtin_assume_aligned(x, ...) (x)" >> include/linux/compiler-clang.h
          
          # 4. CAMERA & MODEM SYNTAX FIX
          # Reparam variabila 'i' si terminatorii de macro Samsung
          find . -type f -name "cam_vfe_bus_ver3.c" -exec sed -i 's/uint32_t                     i;/uint32_t                     i = 0;/g' {} +
          find drivers/soc/samsung -name "*.c" -exec sed -i 's/):$/): ;/g' {} +

      - name: Hardcode Android 15 Compliance
        run: |
          cd kernel-res
          # Incepem de la defconfig-ul de baza
          make ARCH=arm64 r5q_eur_open_defconfig
          
          # Aplicam forțat cerințele eBPF (fara Kconfig interference)
          scripts/config --enable CONFIG_BPF_SYSCALL
          scripts/config --enable CONFIG_BPF_JIT
          scripts/config --enable CONFIG_CGROUP_BPF
          scripts/config --enable CONFIG_NETFILTER_XT_MATCH_BPF
          scripts/config --enable CONFIG_BPF_STREAM_PARSER
          
          # Tăiem tot ce e "toxic" pentru compilatoarele noi
          scripts/config --disable CONFIG_SEC_DEBUG
          scripts/config --disable CONFIG_HID_TRACE
          scripts/config --disable CONFIG_SECURITY_SAMSUNG_RKP
          scripts/config --disable CONFIG_TIMA
          scripts/config --disable CONFIG_INTEGRITY_PLATFORM_KEYRING

      - name: Build Kernel (Aggressive Optimization)
        run: |
          cd kernel-res
          export PATH=$(pwd)/../toolchain/proton-clang/bin:$PATH
          
          MAKE_ARGS="ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1"
          
          # Folosim flag-uri care permit compilarea rapida si ignora balastul vechi
          export KCFLAGS="-Wno-everything -Wno-error -Wno-implicit-function-declaration -Wno-macro-redefined"

          # Compilarea propriu-zisa
          make -j$(nproc --all) $MAKE_ARGS Image.gz-dtb || make -j$(nproc --all) $MAKE_ARGS Image.gz

      - name: Upload Finished Kernel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S10Lite-A15-Architect-v124
          path: |
            kernel-res/arch/arm64/boot/Image.gz-dtb
            kernel-res/arch/arm64/boot/Image.gz
