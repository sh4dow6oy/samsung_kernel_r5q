name: S10 Lite - Pascua Method v52

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout S10 Lite Source
        uses: actions/checkout@v4
        with:
          path: s10-lite-src

      - name: Setup AOSP Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves make python3 lz4 perl git
          git clone --depth=1 https://github.com/Panchajanya1999/azure-clang.git toolchain/clang

      - name: Prepare Pascua Sixteen Base
        run: |
          git clone --depth=1 -b sixteen https://github.com/pascua28/android_kernel_samsung_sm7150.git kernel-res

      - name: Inject S10 Lite Components
        run: |
          cp -r s10-lite-src/drivers/soc/samsung kernel-res/drivers/soc/ || true
          cp -r s10-lite-src/drivers/camera kernel-res/drivers/ || true
          cp -r s10-lite-src/drivers/fingerprint kernel-res/drivers/ || true
          cp -r s10-lite-src/drivers/sensors kernel-res/drivers/ || true
          cp -r s10-lite-src/arch/arm64/boot/dts/samsung kernel-res/arch/arm64/boot/dts/ || true
          cp s10-lite-src/arch/arm64/configs/r5q_eur_open_defconfig kernel-res/arch/arm64/configs/

      - name: Deep Kernel Surgery (The Pascua Way)
        run: |
          cd kernel-res
          
          # 1. GLOBAL CRYPTO REPLACEMENT (blkcipher -> skcipher)
          # Aceasta este marea curățenie în sistemele de fișiere (ecryptfs, sdcardfs)
          find fs/ -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's/struct crypto_blkcipher/struct crypto_skcipher/g' {} +
          find fs/ -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's/crypto_alloc_blkcipher/crypto_alloc_skcipher/g' {} +
          find fs/ -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's/crypto_blkcipher_setkey/crypto_skcipher_setkey/g' {} +
          
          # 2. SCHEDULER AGGRESSIVE FIX
          # Eliminăm orice prototip vechi și forțăm unul nou care să nu bată cap în cap cu structurile
          sed -i '/boosted_task_util/d' kernel/sched/fair.c
          sed -i 's/static unsigned long boosted_task_util/unsigned long boosted_task_util/g' kernel/sched/fair.c
          # Inserăm declarația după include-uri (linia 50 e de obicei sigură după headere)
          sed -i '50i struct task_struct; unsigned long boosted_task_util(struct task_struct *task);' kernel/sched/fair.c

          # 3. FIX BPRM (fs/exec.c)
          sed -i 's/bprm->file = file/bprm.file = file/g' fs/exec.c

          # 4. REMOVE SAMSUNG SECURITY (RKP/DEFEX)
          # Pascua le dezactivează complet pentru a evita crash-urile pe A15
          find . -name "Makefile" -exec sed -i 's/obj-$(CONFIG_RKP_KDP).*/obj-y -= rkp_kdp.o/g' {} +
          find . -name "Makefile" -exec sed -i 's/obj-$(CONFIG_SAMSUNG_PRODUCT_SHIP).*/obj-y -= product_ship.o/g' {} +

      - name: Build Kernel
        run: |
          cd kernel-res
          export PATH=$(pwd)/../toolchain/clang/bin:$PATH
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          # Folosim LLVM=1 pentru a folosi întreg setul de unelte LLVM (ld.lld, llvm-ar, etc.)
          MAKE_ARGS="ARCH=arm64 CC=clang HOSTCC=gcc LLVM=1 LLVM_IAS=1"
          
          # Flag-uri de relaxare extreme
          export KCFLAGS="-Wno-error -Wno-implicit-function-declaration -Wno-void-pointer-to-int-cast -Wno-return-type -Wno-unused-variable -Wno-macro-redefined -Wno-frame-larger-than= -Wno-unknown-warning-option -Wno-incompatible-pointer-types -Wno-mismatched-parameter-types"

          make $MAKE_ARGS r5q_eur_open_defconfig
          
          # Ajustări defconfig stil Pascua
          ./scripts/config --disable CONFIG_CC_STACKPROTECTOR_STRONG
          ./scripts/config --enable CONFIG_CC_STACKPROTECTOR_NONE
          ./scripts/config --disable CONFIG_RKP_KDP
          ./scripts/config --disable CONFIG_DEFEX
          ./scripts/config --disable CONFIG_SECURITY_DEFEX
          
          make $MAKE_ARGS olddefconfig
          make -j$(nproc --all) $MAKE_ARGS Image.gz-dtb

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-S10Lite-PascuaMethod-v52
          path: kernel-res/arch/arm64/boot/Image.gz-dtb
